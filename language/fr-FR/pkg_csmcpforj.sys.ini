PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Fournit un point d'accès Streamable HTTP du Model Context Protocol à l'adresse /api/index.php/v1/mcp, afin que tout client MCP compatible (Claude, Cursor, Cline, connecteurs personnalisés de ChatGPT, GitHub Copilot, Gemini CLI et autres) puisse gérer directement ce site Joomla avec un jeton API Joomla."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="L'extension CS MCP for J a été installée. Le composant, le plugin système, le plugin Services Web et le plugin d'authentification OAuth sont activés. Pour connecter un client, générez un jeton API Joomla dans votre profil utilisateur (ou activez la connexion OAuth dans les Paramètres) et utilisez l'URL du point d'accès affichée sur le tableau de bord du composant."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J a été mis à jour. Les jetons et les réglages du point d'accès existants ont été conservés."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="Ouvrir MCP for J"
