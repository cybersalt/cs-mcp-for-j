PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Ofrece un endpoint Streamable HTTP del Model Context Protocol en /api/index.php/v1/mcp para que cualquier cliente MCP compatible (Claude, Cursor, Cline, conectores personalizados de ChatGPT, GitHub Copilot, Gemini CLI y otros) pueda gestionar este sitio Joomla directamente con un API Token de Joomla."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="Se ha instalado la extensión CS MCP for J. El componente, el plugin de sistema, el plugin de servicios web y el plugin de autenticación OAuth están activados. Para conectar un cliente, genere un API Token de Joomla en su perfil de usuario (o active el inicio de sesión OAuth en Opciones) y use la URL del endpoint que aparece en el panel del componente."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="Se ha actualizado CS MCP for J. Se han conservado los tokens y los ajustes del endpoint existentes."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="Abrir MCP for J"
