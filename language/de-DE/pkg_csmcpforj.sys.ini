PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Stellt unter /api/index.php/v1/mcp einen Streamable-HTTP-Endpunkt für das Model Context Protocol bereit, sodass jeder konforme MCP-Client (Claude, Cursor, Cline, benutzerdefinierte Konnektoren von ChatGPT, GitHub Copilot, Gemini CLI und andere) diese Joomla-Website direkt mit einem Joomla API Token verwalten kann."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="Die Erweiterung CS MCP for J wurde installiert. Die Komponente, das System-Plugin, das Web-Services-Plugin und das OAuth-Authentifizierungs-Plugin sind aktiviert. Um einen Client zu verbinden, erzeugen Sie in Ihrem Benutzerprofil ein Joomla API Token (oder schalten in den Optionen die OAuth-Anmeldung ein) und verwenden die Endpunkt-URL, die im Dashboard der Komponente angezeigt wird."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J wurde aktualisiert. Vorhandene Tokens und Endpunkt-Einstellungen wurden beibehalten."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="MCP for J öffnen"
