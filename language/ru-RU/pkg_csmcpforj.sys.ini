PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Предоставляет точку подключения Model Context Protocol (Streamable HTTP) по адресу /api/index.php/v1/mcp, чтобы любой совместимый MCP-клиент (Claude, Cursor, Cline, пользовательские коннекторы ChatGPT, GitHub Copilot, Gemini CLI и другие) мог управлять этим сайтом Joomla напрямую с помощью токена API Joomla."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="Расширение CS MCP for J установлено. Компонент, системный плагин, плагин веб-служб и плагин аутентификации OAuth включены. Чтобы подключить клиент, создайте токен API Joomla в своём профиле пользователя (или включите вход через OAuth в параметрах) и используйте URL точки подключения, показанный на панели управления компонента."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J обновлён. Существующие токены и настройки точки подключения сохранены."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="Открыть MCP for J"
