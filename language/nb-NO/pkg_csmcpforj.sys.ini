PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Gjør et Model Context Protocol-endepunkt (Streamable HTTP) tilgjengelig på /api/index.php/v1/mcp, slik at enhver kompatibel MCP-klient (Claude, Cursor, Cline, egendefinerte ChatGPT-koblinger, GitHub Copilot, Gemini CLI og andre) kan administrere dette Joomla-nettstedet direkte med et Joomla API-token."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="Utvidelsen CS MCP for J er installert. Komponenten, systemprogramtillegget, programtillegget for nettjenester og programtillegget for OAuth-autentisering er aktivert. For å koble til en klient, generer et Joomla API-token i brukerprofilen din (eller slå på OAuth-innlogging i Innstillinger) og bruk endepunkt-URL-en som vises på komponentens oversikt."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J er oppdatert. Eksisterende tokener og endepunktinnstillinger er beholdt."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="Åpne MCP for J"
