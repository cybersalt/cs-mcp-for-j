PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="/api/index.php/v1/mcp adresinde Streamable HTTP üzerinden bir Model Context Protocol uç noktası sunar. Böylece uyumlu her MCP istemcisi (Claude, Cursor, Cline, ChatGPT özel bağlayıcıları, GitHub Copilot, Gemini CLI ve diğerleri) bir Joomla API belirteci ile bu Joomla sitesini doğrudan yönetebilir."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="CS MCP for J eklentileri kuruldu. Bileşen, sistem eklentisi, Web Servisleri eklentisi ve OAuth kimlik doğrulama eklentisi etkinleştirildi. Bir istemciyi bağlamak için kullanıcı profilinizde bir Joomla API belirteci oluşturun (veya Seçenekler'de OAuth ile oturum açmayı açın) ve bileşen kontrol panelinde gösterilen uç nokta URL'sini kullanın."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J güncellendi. Mevcut belirteçler ve uç nokta ayarları korundu."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="MCP for J'yi aç"
