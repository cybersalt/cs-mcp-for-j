PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Gjer eit Model Context Protocol-endepunkt (Streamable HTTP) tilgjengeleg på /api/index.php/v1/mcp, slik at alle kompatible MCP-klientar (Claude, Cursor, Cline, eigendefinerte ChatGPT-koplingar, GitHub Copilot, Gemini CLI og andre) kan administrere denne Joomla-nettstaden direkte med eit Joomla API-token."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="Utvidinga CS MCP for J er installert. Komponenten, systemprogramtillegget, programtillegget for nettenester og programtillegget for OAuth-autentisering er aktiverte. For å kople til ein klient genererer du eit Joomla API-token i brukarprofilen din (eller slår på OAuth-innlogging i Innstillingar) og brukar endepunkt-URL-en som blir vist på oversikta til komponenten."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J er oppdatert. Eksisterande token og endepunktinnstillingar er behaldne."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="Opne MCP for J"
