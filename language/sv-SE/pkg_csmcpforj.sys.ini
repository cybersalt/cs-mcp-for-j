PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Tillhandahåller en anslutningspunkt för Model Context Protocol via Streamable HTTP på /api/index.php/v1/mcp, så att kompatibla MCP-klienter (Claude, Cursor, Cline, anpassade ChatGPT-anslutningar, GitHub Copilot, Gemini CLI med flera) kan hantera Joomla-webbplatsen direkt med en Joomla API-token."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="Tillägget CS MCP for J har installerats. Komponenten, systempluginen, webbtjänstpluginen och pluginen för OAuth-autentisering är aktiverade. Anslut en klient genom att generera en Joomla API-token i din användarprofil (eller aktivera OAuth-inloggning i Inställningar) och använda anslutningsadressen på komponentens kontrollpanel."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J har uppdaterats. Befintliga token och inställningar för anslutningspunkten har bevarats."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="Öppna MCP for J"
