PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Exposes a Streamable-HTTP Model Context Protocol endpoint at /api/index.php/v1/mcp so any conformant MCP client (Claude, Cursor, Cline, ChatGPT custom connectors, GitHub Copilot, Gemini CLI, and others) can manage this Joomla site directly using a Joomla API token."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="The CS MCP for J extension has been installed. The component, system plugin, Web Services plugin and OAuth authentication plugin are enabled. To connect a client, generate a Joomla API token in your user profile (or switch on OAuth sign-in in Options) and use the endpoint URL shown on the component's dashboard."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J has been updated. Existing tokens and endpoint settings have been preserved."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="Open MCP for J"
