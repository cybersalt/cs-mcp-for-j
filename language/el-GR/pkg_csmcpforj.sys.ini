PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Παρέχει ένα τελικό σημείο Model Context Protocol μέσω Streamable HTTP στη διεύθυνση /api/index.php/v1/mcp, ώστε κάθε συμβατός πελάτης MCP (Claude, Cursor, Cline, προσαρμοσμένες συνδέσεις ChatGPT, GitHub Copilot, Gemini CLI και άλλοι) να μπορεί να διαχειρίζεται απευθείας αυτόν τον ιστότοπο Joomla με ένα διακριτικό Joomla API."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="Οι επεκτάσεις CS MCP for J εγκαταστάθηκαν. Η εφαρμογή, το πρόσθετο συστήματος, το πρόσθετο Υπηρεσιών Διαδικτύου και το πρόσθετο πιστοποίησης OAuth ενεργοποιήθηκαν. Για να συνδέσετε έναν πελάτη, δημιουργήστε ένα διακριτικό Joomla API στο προφίλ χρήστη σας (ή ενεργοποιήστε τη σύνδεση OAuth στις Επιλογές) και χρησιμοποιήστε τη διεύθυνση URL τελικού σημείου που εμφανίζεται στον πίνακα ελέγχου της εφαρμογής."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="Το CS MCP for J ενημερώθηκε. Τα υπάρχοντα διακριτικά και οι ρυθμίσεις του τελικού σημείου διατηρήθηκαν."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="Άνοιγμα MCP for J"
