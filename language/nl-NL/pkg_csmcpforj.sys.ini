PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Biedt een Streamable-HTTP Model Context Protocol-endpoint op /api/index.php/v1/mcp, zodat elke conforme MCP-client (Claude, Cursor, Cline, aangepaste connectors van ChatGPT, GitHub Copilot, Gemini CLI en andere) deze Joomla-site rechtstreeks kan beheren met een Joomla API-token."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="De extensie CS MCP for J is geïnstalleerd. De component, de systeemplugin, de Web Services-plugin en de OAuth-authenticatieplugin zijn ingeschakeld. Om een client te verbinden, maak je een Joomla API-token aan in je gebruikersprofiel (of schakel je OAuth-aanmelding in bij Opties) en gebruik je de endpoint-URL die op het dashboard van de component staat."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J is bijgewerkt. Bestaande tokens en endpoint-instellingen zijn behouden."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="MCP for J openen"
