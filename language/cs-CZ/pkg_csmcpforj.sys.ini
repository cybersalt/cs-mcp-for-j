PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Zpřístupňuje koncový bod Model Context Protocol (Streamable HTTP) na adrese /api/index.php/v1/mcp, takže jakýkoli kompatibilní klient MCP (Claude, Cursor, Cline, vlastní konektory ChatGPT, GitHub Copilot, Gemini CLI a další) může tento web Joomla spravovat přímo pomocí tokenu Joomla API."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="Rozšíření CS MCP for J bylo nainstalováno. Komponenta, systémový plugin, plugin webových služeb a plugin ověřování OAuth jsou povoleny. Chcete-li připojit klienta, vygenerujte token Joomla API ve svém uživatelském profilu (nebo zapněte přihlašování OAuth v Možnostech) a použijte adresu URL koncového bodu zobrazenou na přehledu komponenty."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J bylo aktualizováno. Stávající tokeny a nastavení koncového bodu zůstaly zachovány."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="Otevřít MCP for J"
