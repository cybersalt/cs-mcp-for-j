PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="/api/index.php/v1/mcp に Streamable HTTP 方式の Model Context Protocol エンドポイントを提供し、準拠した MCP クライアント（Claude、Cursor、Cline、ChatGPT のカスタムコネクタ、GitHub Copilot、Gemini CLI など）が Joomla API トークンを使ってこの Joomla サイトを直接管理できるようにします。"

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="CS MCP for J エクステンションをインストールしました。コンポーネント、システムプラグイン、Webサービスプラグイン、OAuth 認証プラグインが有効になっています。クライアントを接続するには、ユーザープロフィールで Joomla API トークンを生成する（またはオプションで OAuth サインインを有効にする）と、コンポーネントのダッシュボードに表示されるエンドポイント URL を使えます。"
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J を更新しました。既存のトークンとエンドポイントの設定は保持されています。"
PKG_CSMCPFORJ_POSTINSTALL_OPEN="MCP for J を開く"
