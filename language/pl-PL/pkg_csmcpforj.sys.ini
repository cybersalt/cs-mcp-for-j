PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Udostępnia punkt końcowy Model Context Protocol (Streamable HTTP) pod adresem /api/index.php/v1/mcp, dzięki czemu każdy zgodny klient MCP (Claude, Cursor, Cline, własne konektory ChatGPT, GitHub Copilot, Gemini CLI i inne) może zarządzać tą witryną Joomla bezpośrednio za pomocą tokenu API Joomla."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="Rozszerzenie CS MCP for J zostało zainstalowane. Komponent, dodatek systemowy, dodatek usług internetowych i dodatek uwierzytelniania OAuth są włączone. Aby podłączyć klienta, wygeneruj token API Joomla w swoim profilu użytkownika (lub włącz logowanie OAuth w Opcjach) i użyj adresu URL punktu końcowego widocznego w panelu komponentu."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J został zaktualizowany. Istniejące tokeny i ustawienia punktu końcowego zostały zachowane."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="Otwórz MCP for J"
