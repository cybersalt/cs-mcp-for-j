PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Espone un endpoint Streamable HTTP del Model Context Protocol su /api/index.php/v1/mcp, così che qualsiasi client MCP conforme (Claude, Cursor, Cline, connettori personalizzati di ChatGPT, GitHub Copilot, Gemini CLI e altri) possa gestire direttamente questo sito Joomla con un token API di Joomla."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="L'estensione CS MCP for J è stata installata. Il componente, il plugin di sistema, il plugin Web Service e il plugin di autenticazione OAuth sono abilitati. Per collegare un client, genera un token API di Joomla nel tuo profilo utente (oppure attiva l'accesso OAuth nelle Opzioni) e usa l'URL dell'endpoint mostrato nel pannello di controllo del componente."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="CS MCP for J è stato aggiornato. I token e le impostazioni dell'endpoint esistenti sono stati conservati."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="Apri MCP for J"
