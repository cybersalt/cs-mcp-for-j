PKG_CSMCPFORJ="CS MCP for J"
PKG_CSMCPFORJ_XML_DESCRIPTION="Disponibiliza um endpoint Streamable HTTP do Model Context Protocol em /api/index.php/v1/mcp para que qualquer cliente MCP compatível (Claude, Cursor, Cline, conectores personalizados do ChatGPT, GitHub Copilot, Gemini CLI e outros) possa gerenciar este site Joomla diretamente com uma chave da API Joomla."

PKG_CSMCPFORJ_POSTINSTALL_INSTALLED="A extensão CS MCP for J foi instalada. O componente, o plugin de sistema, o plugin de Serviços Web e o plugin de autenticação OAuth estão ativados. Para conectar um cliente, gere uma chave da API Joomla no seu perfil de usuário (ou ative o login OAuth em Opções) e use a URL do endpoint exibida no painel do componente."
PKG_CSMCPFORJ_POSTINSTALL_UPDATED="O CS MCP for J foi atualizado. Os tokens e as configurações do endpoint existentes foram mantidos."
PKG_CSMCPFORJ_POSTINSTALL_OPEN="Abrir o MCP for J"
