PLG_SYSTEM_CSMCPFORJ="System - MCP for J"
PLG_SYSTEM_CSMCPFORJ_XML_DESCRIPTION="Регистрирует встроенные инструменты MCP (материалы, категории, меню, модули, пользователи, пользовательские поля, шаблоны, расширения, Schema.org и другое) и преобразует заголовки Authorization: Bearer в X-Joomla-Token для точки подключения /api/index.php/v1/mcp, чтобы могли подключаться MCP-клиенты, поддерживающие только аутентификацию Bearer."
