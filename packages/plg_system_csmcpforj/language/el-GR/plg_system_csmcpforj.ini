PLG_SYSTEM_CSMCPFORJ="System - MCP for J"
PLG_SYSTEM_CSMCPFORJ_XML_DESCRIPTION="Καταχωρεί τα ενσωματωμένα εργαλεία MCP (άρθρα, κατηγορίες, μενού, ενθέματα, χρήστες, προσαρμοσμένα πεδία, πρότυπα, επεκτάσεις, Schema.org και άλλα) και μετατρέπει την κεφαλίδα Authorization: Bearer σε X-Joomla-Token για το τελικό σημείο /api/index.php/v1/mcp, ώστε να μπορούν να συνδεθούν και πελάτες MCP που υποστηρίζουν μόνο Bearer."
