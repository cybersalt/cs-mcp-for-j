PLG_SYSTEM_CSMCPFORJ="System - MCP for J"
PLG_SYSTEM_CSMCPFORJ_XML_DESCRIPTION="Registra gli strumenti MCP integrati (articoli, categorie, menu, moduli, utenti, campi personalizzati, template, estensioni, Schema.org e altro) e converte le intestazioni Authorization: Bearer in X-Joomla-Token per l'endpoint /api/index.php/v1/mcp, così che possano collegarsi anche i client MCP che supportano solo l'autenticazione Bearer."
