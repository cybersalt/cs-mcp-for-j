PLG_API-AUTHENTICATION_CSMCPFORJ="API-autentisering - MCP for J OAuth"
PLG_API-AUTHENTICATION_CSMCPFORJ_XML_DESCRIPTION="Låter ChatGPT, claude.ai och andra MCP-klienter med OAuth logga in på webbplatsens MCP for J-anslutningspunkt. Hanterar endast OAuth-token från MCP for J, endast vid MCP-anslutningspunkten och endast när OAuth är aktiverat i inställningarna för MCP for J. Joomla API-token påverkas inte."
