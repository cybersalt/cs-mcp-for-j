PLG_API-AUTHENTICATION_CSMCPFORJ="API Authentication - MCP for J OAuth"
PLG_API-AUTHENTICATION_CSMCPFORJ_XML_DESCRIPTION="Permite que o ChatGPT, o claude.ai e outros clientes MCP com OAuth façam login no endpoint do MCP for J deste site. Atua apenas nos tokens OAuth do MCP for J, apenas no endpoint MCP e somente quando o OAuth está ativado nas opções do MCP for J. As chaves da API Joomla não são afetadas."
