PLG_API-AUTHENTICATION_CSMCPFORJ_XML_DESCRIPTION="Consente a ChatGPT, claude.ai e ad altri client MCP con OAuth di accedere all'endpoint MCP for J di questo sito. Agisce solo sui token OAuth di MCP for J, solo sull'endpoint MCP e solo quando OAuth è attivo nelle opzioni di MCP for J. I token API di Joomla non sono interessati."
