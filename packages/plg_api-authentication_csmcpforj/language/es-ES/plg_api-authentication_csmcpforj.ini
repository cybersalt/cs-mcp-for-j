PLG_API-AUTHENTICATION_CSMCPFORJ="API Authentication - MCP for J OAuth"
PLG_API-AUTHENTICATION_CSMCPFORJ_XML_DESCRIPTION="Permite que ChatGPT, claude.ai y otros clientes MCP con OAuth inicien sesión en el endpoint de MCP for J de este sitio. Solo actúa sobre los tokens OAuth de MCP for J, solo en el endpoint MCP y solo cuando OAuth está activado en las opciones de MCP for J. Los API Tokens de Joomla no se ven afectados."
