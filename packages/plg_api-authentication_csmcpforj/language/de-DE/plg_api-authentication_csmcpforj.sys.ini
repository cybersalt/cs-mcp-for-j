PLG_API-AUTHENTICATION_CSMCPFORJ="API Authentication - MCP for J OAuth"
PLG_API-AUTHENTICATION_CSMCPFORJ_XML_DESCRIPTION="Ermöglicht ChatGPT, claude.ai und anderen OAuth-fähigen MCP-Clients die Anmeldung am MCP-for-J-Endpunkt dieser Website. Wirkt nur auf OAuth-Tokens von MCP for J, nur am MCP-Endpunkt und nur, wenn OAuth in den Optionen von MCP for J eingeschaltet ist. Joomla API Tokens sind davon nicht betroffen."
