PLG_API-AUTHENTICATION_CSMCPFORJ="API Authentication - MCP for J OAuth"
PLG_API-AUTHENTICATION_CSMCPFORJ_XML_DESCRIPTION="Permet à ChatGPT, claude.ai et aux autres clients MCP OAuth de se connecter au point d'accès MCP for J de ce site. N'agit que sur les jetons OAuth de MCP for J, uniquement sur le point d'accès MCP et seulement lorsque OAuth est activé dans les paramètres de MCP for J. Les jetons API Joomla ne sont pas concernés."
