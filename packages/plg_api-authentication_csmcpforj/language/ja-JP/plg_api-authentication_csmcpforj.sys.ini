PLG_API-AUTHENTICATION_CSMCPFORJ="API Authentication - MCP for J OAuth"
PLG_API-AUTHENTICATION_CSMCPFORJ_XML_DESCRIPTION="ChatGPT、claude.ai などの OAuth 対応 MCP クライアントが、このサイトの MCP for J エンドポイントにサインインできるようにします。MCP for J の OAuth トークンだけを、MCP エンドポイントでのみ、MCP for J のオプションで OAuth が有効なときだけ扱います。Joomla API トークンには影響しません。"
