PLG_API-AUTHENTICATION_CSMCPFORJ="API Authentication - MCP for J OAuth"
PLG_API-AUTHENTICATION_CSMCPFORJ_XML_DESCRIPTION="Позволяет ChatGPT, claude.ai и другим MCP-клиентам с OAuth входить в точку подключения MCP for J на этом сайте. Действует только на OAuth-токены MCP for J, только на точке подключения MCP и только когда OAuth включён в параметрах MCP for J. Токены API Joomla не затрагиваются."
