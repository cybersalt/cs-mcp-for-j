PLG_API-AUTHENTICATION_CSMCPFORJ="API Authentication - MCP for J OAuth"
PLG_API-AUTHENTICATION_CSMCPFORJ_XML_DESCRIPTION="Umožňuje ChatGPT, claude.ai a dalším klientům MCP s OAuth přihlásit se ke koncovému bodu MCP for J tohoto webu. Pracuje pouze s tokeny OAuth MCP for J, pouze na koncovém bodu MCP a pouze tehdy, když je OAuth zapnuté v Možnostech MCP for J. Tokeny Joomla API nejsou dotčeny."
