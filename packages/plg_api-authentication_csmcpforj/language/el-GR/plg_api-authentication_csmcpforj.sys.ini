PLG_API-AUTHENTICATION_CSMCPFORJ="API Authentication - MCP for J OAuth"
PLG_API-AUTHENTICATION_CSMCPFORJ_XML_DESCRIPTION="Επιτρέπει στο ChatGPT, στο claude.ai και σε άλλους πελάτες MCP με υποστήριξη OAuth να συνδέονται στο τελικό σημείο MCP for J αυτού του ιστότοπου. Χειρίζεται μόνο διακριτικά OAuth του MCP for J, μόνο στο τελικό σημείο MCP και μόνο όταν το OAuth είναι ενεργό στις επιλογές του MCP for J. Τα διακριτικά Joomla API δεν επηρεάζονται."
