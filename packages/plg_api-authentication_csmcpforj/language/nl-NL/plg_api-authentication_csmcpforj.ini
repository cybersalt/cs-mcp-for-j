PLG_API-AUTHENTICATION_CSMCPFORJ="API Authentication - MCP for J OAuth"
PLG_API-AUTHENTICATION_CSMCPFORJ_XML_DESCRIPTION="Laat ChatGPT, claude.ai en andere OAuth-MCP-clients zich aanmelden bij het MCP for J-endpoint van deze site. Werkt alleen op OAuth-tokens van MCP for J, alleen op het MCP-endpoint en alleen als OAuth is ingeschakeld in de opties van MCP for J. Joomla API-tokens worden niet beïnvloed."
