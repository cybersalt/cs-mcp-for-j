COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="O login está desativado"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Este site não permite que aplicativos se conectem por login, então o aplicativo que enviou você até aqui não pode se conectar dessa forma.</p><p>Um Super User pode ativá-lo na administração do Joomla, em <strong>Componentes &rarr; MCP for J &rarr; Opções &rarr; Login OAuth</strong>. Depois, inicie a conexão de novo pelo aplicativo.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="Não foi possível verificar a identidade deste aplicativo"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>O aplicativo que enviou você até aqui se identificou com um documento de identidade publicado, mas este site não conseguiu usá-lo: %s.</p><p>Se o aplicativo deixar você escolher como ele se conecta, remova o conector e adicione-o de novo sem a identidade publicada, para que ele se registre neste site. O administrador do site pode ver os detalhes em Componentes &rarr; MCP for J &rarr; Registros.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Este aplicativo não está registrado"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>O aplicativo que enviou você até aqui não está registrado neste site, ou o acesso dele foi revogado. Volte ao aplicativo e adicione o conector novamente.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Endereço de retorno inválido"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>O aplicativo pediu para voltar a um endereço que ele não registrou. Para sua segurança, esta solicitação foi interrompida.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Sua conta não pode usar o MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Você está conectado como <strong>%1$s</strong> (%2$s), mas esta conta não tem permissão para usar o MCP for J neste site.</p><p>Um Super User pode permitir: o grupo da conta precisa da permissão do Joomla <em>Autenticação nos Serviços Web</em> (Sistema &rarr; Configurações globais &rarr; Permissões), além de acesso ao MCP for J em Opções &rarr; Permissões do componente.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Sua conta ainda não pode conectar aplicativos"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Você está conectado como <strong>%1$s</strong> (%2$s), mas no momento esta conta não pode conectar aplicativos: %3$s.</p><p>Depois que isso for resolvido, inicie a conexão de novo pelo seu aplicativo.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Sessão expirada"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Sua sessão expirou antes da sua resposta. Volte ao aplicativo e tente se conectar novamente.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="Conectar %s?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> quer se conectar a <strong>%2$s</strong> pelo MCP for J."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="Ele vai agir como <strong>%1$s</strong> (%2$s), com exatamente as permissões que esta conta tem no site, inclusive fazer alterações se a conta puder."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="Depois que você permitir, será levado de volta a <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="O aplicativo se identificou com a identidade publicada em <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>A autorização vai para um programa neste computador</strong> (%s). Só permita se você acabou de iniciar a conexão a partir de um aplicativo neste computador."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Você pode desconectá-lo a qualquer momento em Componentes &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Só permita aplicativos que você mesmo adicionou. Se você não acabou de adicionar um conector, escolha Negar."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Permitir"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Negar"
