COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="El inicio de sesión está desactivado"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Este sitio web no permite que las aplicaciones se conecten iniciando sesión, así que la aplicación que le ha enviado aquí no puede conectarse de esta forma.</p><p>Un Super User puede activarlo en la administración de Joomla, en <strong>Componentes &rarr; MCP for J &rarr; Opciones &rarr; Inicio de sesión OAuth</strong>. Después, vuelva a iniciar la conexión desde la aplicación.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="No se ha podido comprobar la identidad de esta aplicación"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>La aplicación que le ha enviado aquí se ha identificado con un documento de identidad publicado, pero este sitio no ha podido usarlo: %s.</p><p>Si la aplicación le permite elegir cómo se conecta, elimine el conector y vuelva a añadirlo sin la identidad publicada, para que se registre en este sitio. El administrador del sitio puede ver los detalles en Componentes &rarr; MCP for J &rarr; Registros.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Esta aplicación no está registrada"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>La aplicación que le ha enviado aquí no está registrada en este sitio, o su acceso ha sido revocado. Vuelva a la aplicación y añada de nuevo el conector.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Dirección de retorno no válida"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>La aplicación ha pedido volver a una dirección que no ha registrado. Por su seguridad, se ha detenido esta solicitud.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Su cuenta no puede usar MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Ha iniciado sesión como <strong>%1$s</strong> (%2$s), pero esta cuenta no tiene permiso para usar MCP for J en este sitio.</p><p>Un Super User puede permitirlo: el grupo de la cuenta necesita el permiso de Joomla <em>Acceso a servicios web</em> (Sistema &rarr; Configuración global &rarr; Permisos), además de acceso a MCP for J en Opciones &rarr; Permisos del componente.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Su cuenta todavía no puede conectar aplicaciones"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Ha iniciado sesión como <strong>%1$s</strong> (%2$s), pero esta cuenta no puede conectar aplicaciones en este momento: %3$s.</p><p>Cuando esté resuelto, vuelva a iniciar la conexión desde su aplicación.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="La sesión ha caducado"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Su sesión ha caducado antes de que respondiera. Vuelva a la aplicación e intente conectarse de nuevo.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="¿Conectar %s?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> quiere conectarse a <strong>%2$s</strong> a través de MCP for J."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="Actuará como <strong>%1$s</strong> (%2$s), con exactamente los permisos que esta cuenta tiene en el sitio, incluido hacer cambios si la cuenta puede hacerlos."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="Después de permitirlo, volverá a <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="La aplicación se ha identificado con la identidad publicada en <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>La autorización va a un programa de este ordenador</strong> (%s). Permítalo solo si acaba de empezar a conectar desde una aplicación de este ordenador."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Puede desconectarla en cualquier momento en Componentes &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Permita solo aplicaciones que haya añadido usted mismo. Si no acaba de añadir un conector, elija Denegar."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Permitir"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Denegar"
