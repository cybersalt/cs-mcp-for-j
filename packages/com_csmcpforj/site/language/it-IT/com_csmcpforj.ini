COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="L'accesso è disattivato"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Questo sito non permette alle app di collegarsi tramite accesso, quindi l'app che ti ha mandato qui non può collegarsi in questo modo.</p><p>Un Super User può attivarlo nell'amministrazione di Joomla, in <strong>Componenti &rarr; MCP for J &rarr; Opzioni &rarr; Accesso OAuth</strong>. Poi riavvia il collegamento dall'app.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="Non è stato possibile verificare l'identità di questa app"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>L'app che ti ha mandato qui si è identificata con un documento di identità pubblicato, ma questo sito non ha potuto usarlo: %s.</p><p>Se l'app ti permette di scegliere come collegarsi, rimuovi il connettore e aggiungilo di nuovo senza l'identità pubblicata, così che si registri su questo sito. L'amministratore del sito trova i dettagli in Componenti &rarr; MCP for J &rarr; Registri.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Questa app non è registrata"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>L'app che ti ha mandato qui non è registrata su questo sito, oppure il suo accesso è stato revocato. Torna all'app e aggiungi di nuovo il connettore.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Indirizzo di ritorno non valido"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>L'app ha chiesto di tornare a un indirizzo che non ha registrato. Per la tua sicurezza la richiesta è stata bloccata.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Il tuo account non può usare MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Hai effettuato l'accesso come <strong>%1$s</strong> (%2$s), ma questo account non può usare MCP for J su questo sito.</p><p>Un Super User può consentirlo: il gruppo dell'account ha bisogno del permesso Joomla <em>Accesso Web Service</em> (Sistema &rarr; Configurazione globale &rarr; Permessi), più l'accesso a MCP for J in Opzioni &rarr; Permessi del componente.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Il tuo account non può ancora collegare app"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Hai effettuato l'accesso come <strong>%1$s</strong> (%2$s), ma al momento questo account non può collegare app: %3$s.</p><p>Una volta risolto, riavvia il collegamento dalla tua app.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Sessione scaduta"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>La tua sessione è scaduta prima che rispondessi. Torna all'app e prova di nuovo a collegarti.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="Collegare %s?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> vuole collegarsi a <strong>%2$s</strong> tramite MCP for J."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="Agirà come <strong>%1$s</strong> (%2$s), con esattamente i permessi che questo account ha sul sito, comprese le modifiche se l'account può farle."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="Dopo che l'avrai consentito, tornerai a <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="L'app si è identificata con l'identità pubblicata su <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>L'autorizzazione va a un programma su questo computer</strong> (%s). Consentila solo se hai appena avviato il collegamento da un'app su questo computer."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Puoi scollegarla in qualsiasi momento in Componenti &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Consenti solo le app che hai aggiunto tu. Se non hai appena aggiunto un connettore, scegli Nega."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Consenti"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Nega"
