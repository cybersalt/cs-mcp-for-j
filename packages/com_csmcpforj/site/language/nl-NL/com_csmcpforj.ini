COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="Aanmelden is uitgeschakeld"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Deze website laat apps niet verbinden door aan te melden, dus de app die je hierheen stuurde kan op deze manier geen verbinding maken.</p><p>Een Super User kan het inschakelen in het Joomla-beheer onder <strong>Componenten &rarr; MCP for J &rarr; Opties &rarr; OAuth-aanmelding</strong>. Start daarna opnieuw met verbinden vanuit de app.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="De identiteit van deze app kon niet worden gecontroleerd"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>De app die je hierheen stuurde, identificeerde zich met een gepubliceerd identiteitsdocument, maar deze site kon het niet gebruiken: %s.</p><p>Als je in de app kunt kiezen hoe deze verbinding maakt, verwijder dan de connector en voeg hem opnieuw toe zonder de gepubliceerde identiteit, zodat de app zich bij deze site registreert. De beheerder van de site ziet de details onder Componenten &rarr; MCP for J &rarr; Logboeken.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Deze app is niet geregistreerd"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>De app die je hierheen stuurde, is niet geregistreerd bij deze site, of de toegang is ingetrokken. Ga terug naar de app en voeg de connector opnieuw toe.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Ongeldig terugstuuradres"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>De app vroeg om terug te keren naar een adres dat hij niet heeft geregistreerd. Voor je veiligheid is dit verzoek gestopt.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Je account kan MCP niet gebruiken"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Je bent aangemeld als <strong>%1$s</strong> (%2$s), maar dit account mag MCP for J op deze site niet gebruiken.</p><p>Een Super User kan het toestaan: de groep van het account heeft het Joomla-recht <em>Web services inloggen</em> nodig (Systeem &rarr; Algemene instellingen &rarr; Rechten), plus toegang tot MCP for J in de Opties &rarr; Rechten van de component.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Je account kan nog geen apps verbinden"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Je bent aangemeld als <strong>%1$s</strong> (%2$s), maar dit account kan op dit moment geen apps verbinden: %3$s.</p><p>Zodra dat is opgelost, start je de verbinding opnieuw vanuit je app.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Sessie verlopen"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Je sessie is verlopen voordat je antwoordde. Ga terug naar de app en probeer opnieuw te verbinden.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="%s verbinden?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> wil via MCP for J verbinding maken met <strong>%2$s</strong>."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="De app handelt als <strong>%1$s</strong> (%2$s), met precies de rechten die dit account op de site heeft, inclusief het maken van wijzigingen als het account dat mag."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="Nadat je toestemming hebt gegeven, word je teruggestuurd naar <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="De app identificeerde zich met de identiteit die is gepubliceerd op <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>De toestemming gaat naar een programma op deze computer</strong> (%s). Sta het alleen toe als je net bent begonnen met verbinden vanuit een app op deze computer."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Je kunt de verbinding op elk moment verbreken onder Componenten &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Sta alleen apps toe die je zelf hebt toegevoegd. Als je niet net een connector hebt toegevoegd, kies dan Weigeren."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Toestaan"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Weigeren"
