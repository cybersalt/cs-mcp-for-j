COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="Logowanie jest wyłączone"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Ta witryna nie pozwala aplikacjom łączyć się przez logowanie, więc aplikacja, która Cię tu przysłała, nie może się w ten sposób połączyć.</p><p>Super User może to włączyć w panelu administracyjnym Joomla: <strong>Komponenty &rarr; MCP for J &rarr; Opcje &rarr; Logowanie OAuth</strong>. Następnie rozpocznij łączenie w aplikacji od nowa.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="Nie udało się sprawdzić tożsamości tej aplikacji"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>Aplikacja, która Cię tu przysłała, przedstawiła się opublikowanym dokumentem tożsamości, ale ta witryna nie mogła go użyć: %s.</p><p>Jeśli aplikacja pozwala wybrać sposób łączenia, usuń konektor i dodaj go ponownie bez opublikowanej tożsamości, aby zarejestrował się w tej witrynie. Administrator witryny znajdzie szczegóły w Komponenty &rarr; MCP for J &rarr; Dzienniki.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Ta aplikacja nie jest zarejestrowana"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>Aplikacja, która Cię tu przysłała, nie jest zarejestrowana w tej witrynie albo jej dostęp został odwołany. Wróć do aplikacji i dodaj konektor ponownie.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Nieprawidłowy adres powrotu"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>Aplikacja poprosiła o powrót na adres, którego nie zarejestrowała. Dla Twojego bezpieczeństwa to żądanie zostało zatrzymane.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Twoje konto nie może używać MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Zalogowano jako <strong>%1$s</strong> (%2$s), ale to konto nie ma uprawnień do używania MCP for J w tej witrynie.</p><p>Super User może na to zezwolić: grupa konta potrzebuje uprawnienia Joomla <em>Logowanie do usług internetowych</em> (System &rarr; Konfiguracja globalna &rarr; Uprawnienia) oraz dostępu do MCP for J w Opcje &rarr; Uprawnienia komponentu.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Twoje konto nie może jeszcze łączyć aplikacji"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Zalogowano jako <strong>%1$s</strong> (%2$s), ale to konto nie może teraz łączyć aplikacji: %3$s.</p><p>Gdy to zostanie rozwiązane, rozpocznij łączenie w aplikacji od nowa.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Sesja wygasła"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Sesja wygasła, zanim udzielono odpowiedzi. Wróć do aplikacji i spróbuj połączyć się ponownie.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="Połączyć %s?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> chce połączyć się z <strong>%2$s</strong> przez MCP for J."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="Będzie działać jako <strong>%1$s</strong> (%2$s), z dokładnie takimi uprawnieniami, jakie to konto ma w witrynie, łącznie z wprowadzaniem zmian, jeśli konto może je wprowadzać."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="Po wyrażeniu zgody nastąpi powrót do <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="Aplikacja przedstawiła się tożsamością opublikowaną pod adresem <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>Zgoda trafi do programu na tym komputerze</strong> (%s). Zezwól tylko wtedy, gdy przed chwilą rozpoczęto łączenie z aplikacji na tym komputerze."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Można ją w każdej chwili odłączyć w Komponenty &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Zezwalaj tylko aplikacjom dodanym przez siebie. Jeśli przed chwilą nie dodano konektora, wybierz Odmów."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Zezwól"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Odmów"
