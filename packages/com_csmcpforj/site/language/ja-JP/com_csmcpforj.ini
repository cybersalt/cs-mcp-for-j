COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="サインインは無効になっています"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>このサイトではアプリがサインインで接続することを許可していないため、ここへ案内したアプリはこの方法では接続できません。</p><p>Super User が Joomla の管理画面の <strong>コンポーネント &rarr; MCP for J &rarr; オプション &rarr; OAuth サインイン</strong> で有効にできます。その後、アプリからもう一度接続を始めてください。</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="このアプリの ID を確認できませんでした"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>ここへ案内したアプリは公開された ID ドキュメントで名乗りましたが、このサイトではそれを使えませんでした: %s。</p><p>アプリで接続方法を選べる場合は、コネクタを削除し、公開された ID を使わずに追加し直して、このサイトに登録されるようにしてください。サイトの管理者は コンポーネント &rarr; MCP for J &rarr; ログ で詳細を確認できます。</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="このアプリは登録されていません"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>ここへ案内したアプリはこのサイトに登録されていないか、アクセスが取り消されています。アプリに戻り、コネクタを追加し直してください。</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="戻り先アドレスが無効です"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>アプリが、登録していないアドレスへ戻ろうとしました。安全のため、このリクエストは停止しました。</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="このアカウントは MCP を使えません"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p><strong>%1$s</strong>（%2$s）としてサインインしていますが、このアカウントにはこのサイトで MCP for J を使う権限がありません。</p><p>Super User が許可できます。アカウントのグループに Joomla の権限 <em>Webサービスログイン</em>（システム &rarr; グローバル設定 &rarr; 権限）と、コンポーネントの オプション &rarr; 権限 での MCP for J へのアクセスが必要です。</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="このアカウントはまだアプリを接続できません"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p><strong>%1$s</strong>（%2$s）としてサインインしていますが、このアカウントは現在アプリを接続できません: %3$s。</p><p>解決したら、アプリからもう一度接続を始めてください。</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="セッションの有効期限が切れました"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>回答する前にセッションの有効期限が切れました。アプリに戻り、もう一度接続してください。</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="%s を接続しますか？"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> が MCP for J を通じて <strong>%2$s</strong> に接続しようとしています。"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="アプリは <strong>%1$s</strong>（%2$s）として、このアカウントがサイトで持つ権限そのままで動作します。アカウントに権限があれば変更も行います。"
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="許可すると <strong>%s</strong> に戻ります。"
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="アプリは <strong>%s</strong> で公開されている ID で名乗りました。"
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>許可はこのコンピューター上のプログラムに送られます</strong>（%s）。このコンピューター上のアプリから今まさに接続を始めた場合にだけ許可してください。"
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="いつでも コンポーネント &rarr; MCP for J で接続を解除できます。"
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="自分で追加したアプリだけを許可してください。コネクタを追加した覚えがなければ「拒否」を選んでください。"
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="許可"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="拒否"
