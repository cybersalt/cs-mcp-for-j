COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="Innlogging er slått av"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Denne nettstaden lèt ikkje appar kople til ved innlogging, så appen som sende deg hit, kan ikkje kople til på denne måten.</p><p>Ein Super User kan slå det på i Joomla-administrasjonen under <strong>Komponentar &rarr; MCP for J &rarr; Innstillingar &rarr; OAuth-innlogging</strong>. Start deretter tilkoplinga på nytt frå appen.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="Identiteten til appen kunne ikkje kontrollerast"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>Appen som sende deg hit, identifiserte seg med eit publisert identitetsdokument, men denne nettstaden kunne ikkje bruke det: %s.</p><p>Viss appen lèt deg velje korleis appen koplar til, fjernar du koplinga og legg ho til på nytt utan den publiserte identiteten, slik at appen registrerer seg hos denne nettstaden i staden. Administratoren av nettstaden finn detaljane under Komponentar &rarr; MCP for J &rarr; Loggar.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Denne appen er ikkje registrert"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>Appen som sende deg hit, er ikkje registrert hos denne nettstaden, eller tilgangen er trekt tilbake. Gå tilbake til appen og legg til koplinga på nytt.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Ugyldig omdirigeringsadresse"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>Appen bad om å gå tilbake til ei adresse appen ikkje har registrert. Av omsyn til tryggleiken din vart førespurnaden stoppa.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Kontoen din kan ikkje bruke MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Du er logga inn som <strong>%1$s</strong> (%2$s), men denne kontoen har ikkje lov til å bruke MCP for J på denne nettstaden.</p><p>Ein Super User kan tillate det: gruppa til kontoen treng Joomla-retten <em>Innlogging for nettenester</em> (System &rarr; Globale innstillingar &rarr; Rettar), og i tillegg tilgang til MCP for J under Innstillingar &rarr; Rettar for komponenten.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Kontoen din kan ikkje kople til appar enno"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Du er logga inn som <strong>%1$s</strong> (%2$s), men denne kontoen kan ikkje kople til appar akkurat no: %3$s.</p><p>Når det er ordna, startar du tilkoplinga på nytt frå appen.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Økta er utgått"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Økta di gjekk ut før du svarte. Gå tilbake til appen og prøv å kople til på nytt.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="Kople til %s?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> vil kople til <strong>%2$s</strong> gjennom MCP for J."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="Appen vil handle som <strong>%1$s</strong> (%2$s), med nøyaktig dei rettane denne kontoen har på nettstaden, inkludert å gjere endringar viss kontoen kan det."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="Etter at du har tillate det, blir du send tilbake til <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="Appen identifiserte seg med identiteten som er publisert på <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>Godkjenninga går til eit program på denne datamaskina</strong> (%s). Tillat det berre viss du nettopp starta tilkoplinga frå ein app på denne datamaskina."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Du kan kople appen frå når som helst under Komponentar &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Tillat berre appar du har lagt til sjølv. Viss du ikkje nettopp la til ei kopling, vel du Avslå."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Tillat"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Avslå"
