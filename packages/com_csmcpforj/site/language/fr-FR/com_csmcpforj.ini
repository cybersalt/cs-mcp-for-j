COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="La connexion est désactivée"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Ce site ne permet pas aux applications de se connecter par identification, donc l'application qui vous a envoyé ici ne peut pas se connecter de cette façon.</p><p>Un Super User peut l'activer dans l'administration de Joomla, sous <strong>Composants &rarr; MCP for J &rarr; Paramètres &rarr; Connexion OAuth</strong>. Relancez ensuite la connexion depuis l'application.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="L'identité de cette application n'a pas pu être vérifiée"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>L'application qui vous a envoyé ici s'est identifiée avec un document d'identité publié, mais ce site n'a pas pu l'utiliser : %s.</p><p>Si l'application vous laisse choisir sa façon de se connecter, supprimez le connecteur et ajoutez-le à nouveau sans l'identité publiée, pour qu'elle s'enregistre plutôt auprès de ce site. L'administrateur du site trouvera les détails sous Composants &rarr; MCP for J &rarr; Journaux.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Cette application n'est pas enregistrée"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>L'application qui vous a envoyé ici n'est pas enregistrée auprès de ce site, ou son accès a été révoqué. Retournez dans l'application et ajoutez à nouveau le connecteur.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Adresse de retour non valide"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>L'application a demandé à revenir vers une adresse qu'elle n'a pas enregistrée. Pour votre sécurité, cette demande a été arrêtée.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Votre compte ne peut pas utiliser MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Vous êtes connecté en tant que <strong>%1$s</strong> (%2$s), mais ce compte n'a pas le droit d'utiliser MCP for J sur ce site.</p><p>Un Super User peut l'autoriser : le groupe du compte a besoin du droit Joomla <em>Connexion aux services Web</em> (Système &rarr; Configuration globale &rarr; Droits), ainsi que d'un accès à MCP for J dans Paramètres &rarr; Droits du composant.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Votre compte ne peut pas encore connecter d'applications"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Vous êtes connecté en tant que <strong>%1$s</strong> (%2$s), mais ce compte ne peut pas connecter d'applications pour le moment : %3$s.</p><p>Une fois ce point réglé, relancez la connexion depuis votre application.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Session expirée"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Votre session a expiré avant votre réponse. Retournez dans l'application et réessayez de vous connecter.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="Connecter %s ?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> souhaite se connecter à <strong>%2$s</strong> via MCP for J."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="Elle agira en tant que <strong>%1$s</strong> (%2$s), avec exactement les droits de ce compte sur le site, y compris faire des modifications si le compte en a le droit."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="Après votre autorisation, vous serez renvoyé vers <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="L'application s'est identifiée avec l'identité publiée sur <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>L'autorisation part vers un programme de cet ordinateur</strong> (%s). N'autorisez que si vous venez de lancer la connexion depuis une application de cet ordinateur."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Vous pouvez la déconnecter à tout moment sous Composants &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="N'autorisez que les applications que vous avez ajoutées vous-même. Si vous ne venez pas d'ajouter un connecteur, choisissez Refuser."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Autoriser"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Refuser"
