COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="Přihlašování je vypnuté"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Tento web nedovoluje aplikacím připojit se přihlášením, takže aplikace, která vás sem poslala, se tímto způsobem připojit nemůže.</p><p>Super User to může zapnout v administraci Joomla v části <strong>Komponenty &rarr; MCP for J &rarr; Možnosti &rarr; Přihlašování OAuth</strong>. Poté začněte připojování v aplikaci znovu.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="Identitu této aplikace se nepodařilo ověřit"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>Aplikace, která vás sem poslala, se identifikovala zveřejněným dokumentem identity, ale tento web jej nemohl použít: %s.</p><p>Pokud vám aplikace dovoluje zvolit způsob připojení, odeberte konektor a přidejte jej znovu bez zveřejněné identity, aby se místo toho zaregistroval u tohoto webu. Správce webu najde podrobnosti v části Komponenty &rarr; MCP for J &rarr; Protokoly.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Tato aplikace není registrována"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>Aplikace, která vás sem poslala, není u tohoto webu registrována, nebo jí byl přístup odebrán. Vraťte se do aplikace a přidejte konektor znovu.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Neplatná adresa přesměrování"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>Aplikace požádala o návrat na adresu, kterou nezaregistrovala. Kvůli vaší bezpečnosti byl tento požadavek zastaven.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Váš účet nemůže používat MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Jste přihlášeni jako <strong>%1$s</strong> (%2$s), ale tento účet nesmí na tomto webu používat MCP for J.</p><p>Super User to může povolit: skupina účtu potřebuje oprávnění Joomla <em>Přihlásit se k webovým službám</em> (Systém &rarr; Globální nastavení &rarr; Oprávnění) a také přístup k MCP for J v Možnostech komponenty &rarr; Oprávnění.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Váš účet zatím nemůže připojovat aplikace"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Jste přihlášeni jako <strong>%1$s</strong> (%2$s), ale tento účet teď nemůže připojovat aplikace: %3$s.</p><p>Jakmile to bude vyřešeno, začněte připojování v aplikaci znovu.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Relace vypršela"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Vaše relace vypršela dříve, než jste odpověděli. Vraťte se do aplikace a zkuste se připojit znovu.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="Připojit %s?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> se chce připojit k webu <strong>%2$s</strong> prostřednictvím MCP for J."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="Bude jednat jako <strong>%1$s</strong> (%2$s), s přesně stejnými oprávněními, jaká má tento účet na webu, včetně provádění změn, pokud je účet může provádět."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="Po povolení budete přesměrováni zpět na <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="Aplikace se identifikovala identitou zveřejněnou na <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>Schválení půjde programu na tomto počítači</strong> (%s). Povolte to jen tehdy, pokud jste právě začali připojovat aplikaci na tomto počítači."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Kdykoli ji můžete odpojit v části Komponenty &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Povolujte jen aplikace, které jste přidali sami. Pokud jste právě nepřidali konektor, zvolte Zamítnout."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Povolit"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Zamítnout"
