COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="Signing in is switched off"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>This website does not let apps connect by signing in, so the app that sent you here cannot connect this way.</p><p>A Super User can switch it on in the Joomla admin under <strong>Components &rarr; MCP for J &rarr; Options &rarr; OAuth sign-in</strong>. Then start connecting again from the app.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="This app's identity could not be checked"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>The app that sent you here identified itself with a published identity document, but this site could not use it: %s.</p><p>If the app lets you choose how it connects, remove the connector and add it again without its published identity, so that it registers with this site instead. The site&rsquo;s administrator can see the details under Components &rarr; MCP for J &rarr; Logs.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="This app is not registered"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>The app that sent you here is not registered with this site, or its access was revoked. Go back to the app and add the connector again.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Invalid redirect address"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>The app asked to return to an address it did not register. For your safety this request was stopped.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Your account cannot use MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>You are signed in as <strong>%1$s</strong> (%2$s), but this account is not allowed to use MCP for J on this site.</p><p>A Super User can allow it: the account&rsquo;s group needs Joomla&rsquo;s <em>Web Services Login</em> permission (System &rarr; Global Configuration &rarr; Permissions), plus access to MCP for J in the component&rsquo;s Options &rarr; Permissions.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Your account cannot connect apps yet"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>You are signed in as <strong>%1$s</strong> (%2$s), but this account cannot connect apps right now: %3$s.</p><p>Once that is sorted out, start the connection again from your app.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Session expired"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Your session expired before you answered. Go back to the app and try connecting again.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="Connect %s?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> wants to connect to <strong>%2$s</strong> through MCP for J."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="It will act as <strong>%1$s</strong> (%2$s), with exactly the permissions this account has on the site, including making changes if the account can."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="After you allow it, you will be sent back to <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="The app identified itself with the identity published at <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>The approval goes to a program on this computer</strong> (%s). Only allow it if you just started connecting from an app on this computer."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="You can disconnect it at any time under Components &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Only allow apps you added yourself. If you did not just add a connector, choose Deny."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Allow"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Deny"
