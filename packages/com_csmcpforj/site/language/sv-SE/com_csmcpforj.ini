COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="Inloggning är avstängd"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Den här webbplatsen låter inte appar ansluta genom inloggning, så appen som skickade dig hit kan inte ansluta på det här sättet.</p><p>En superanvändare kan slå på det i Joomlas administration under <strong>Komponenter &rarr; MCP for J &rarr; Inställningar &rarr; OAuth-inloggning</strong>. Starta sedan anslutningen igen från appen.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="Appens identitet kunde inte kontrolleras"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>Appen som skickade dig hit identifierade sig med ett publicerat identitetsdokument, men webbplatsen kunde inte använda det: %s.</p><p>Om appen låter dig välja hur den ansluter tar du bort anslutningen och lägger till den igen utan den publicerade identiteten, så att den registrerar sig hos webbplatsen i stället. Webbplatsens administratör kan se detaljerna under Komponenter &rarr; MCP for J &rarr; Loggar.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Appen är inte registrerad"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>Appen som skickade dig hit är inte registrerad hos den här webbplatsen, eller så har dess åtkomst återkallats. Gå tillbaka till appen och lägg till anslutningen igen.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Ogiltig returadress"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>Appen bad om att få återvända till en adress som den inte har registrerat. För din säkerhet stoppades begäran.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Ditt konto kan inte använda MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Du är inloggad som <strong>%1$s</strong> (%2$s), men det här kontot får inte använda MCP for J på den här webbplatsen.</p><p>En superanvändare kan tillåta det: kontots grupp behöver Joomlas behörighet <em>Webbtjänstinloggning</em> (System &rarr; Globala inställningar &rarr; Behörigheter) samt åtkomst till MCP for J under komponentens Inställningar &rarr; Behörigheter.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Ditt konto kan inte ansluta appar än"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Du är inloggad som <strong>%1$s</strong> (%2$s), men det här kontot kan inte ansluta appar just nu: %3$s.</p><p>När det är löst startar du anslutningen igen från din app.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Sessionen har gått ut"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Din session gick ut innan du svarade. Gå tillbaka till appen och försök ansluta igen.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="Ansluta %s?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> vill ansluta till <strong>%2$s</strong> via MCP for J."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="Den kommer att agera som <strong>%1$s</strong> (%2$s), med exakt de behörigheter som det här kontot har på webbplatsen, inklusive att göra ändringar om kontot får det."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="När du har tillåtit den skickas du tillbaka till <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="Appen identifierade sig med identiteten som publicerats på <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>Godkännandet går till ett program på den här datorn</strong> (%s). Tillåt det bara om du nyss började ansluta från en app på den här datorn."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Du kan koppla från den när som helst under Komponenter &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Tillåt bara appar som du själv har lagt till. Om du inte nyss lade till en anslutning väljer du Neka."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Tillåt"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Neka"
