COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="Вход отключён"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Этот сайт не позволяет приложениям подключаться через вход, поэтому приложение, которое направило вас сюда, не может подключиться таким способом.</p><p>Super User может включить это в панели администратора Joomla: <strong>Компоненты &rarr; MCP for J &rarr; Параметры &rarr; Вход через OAuth</strong>. После этого начните подключение в приложении заново.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="Не удалось проверить подлинность этого приложения"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>Приложение, которое направило вас сюда, представилось с помощью опубликованного документа идентификации, но этот сайт не смог его использовать: %s.</p><p>Если приложение позволяет выбрать способ подключения, удалите коннектор и добавьте его снова без опубликованной идентификации, чтобы оно зарегистрировалось на этом сайте. Администратор сайта может посмотреть подробности в разделе Компоненты &rarr; MCP for J &rarr; Журналы.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Это приложение не зарегистрировано"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>Приложение, которое направило вас сюда, не зарегистрировано на этом сайте или его доступ был отозван. Вернитесь в приложение и добавьте коннектор заново.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Недопустимый адрес возврата"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>Приложение попросило вернуться на адрес, который оно не регистрировало. Ради вашей безопасности запрос остановлен.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Ваша учётная запись не может использовать MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Вы вошли как <strong>%1$s</strong> (%2$s), но этой учётной записи не разрешено использовать MCP for J на этом сайте.</p><p>Super User может это разрешить: группе учётной записи нужно право Joomla <em>Вход в веб-службы</em> (Система &rarr; Общие настройки &rarr; Права доступа), а также доступ к MCP for J в разделе Параметры &rarr; Права доступа компонента.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Ваша учётная запись пока не может подключать приложения"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Вы вошли как <strong>%1$s</strong> (%2$s), но сейчас эта учётная запись не может подключать приложения: %3$s.</p><p>Когда это будет исправлено, начните подключение в приложении заново.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Сеанс истёк"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Ваш сеанс истёк до того, как вы ответили. Вернитесь в приложение и попробуйте подключиться ещё раз.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="Подключить %s?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> хочет подключиться к <strong>%2$s</strong> через MCP for J."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="Оно будет действовать от имени <strong>%1$s</strong> (%2$s), с теми же правами, что у этой учётной записи на сайте, включая внесение изменений, если учётной записи это разрешено."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="После разрешения вы вернётесь на <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="Приложение представилось с помощью идентификации, опубликованной на <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>Разрешение получит программа на этом компьютере</strong> (%s). Разрешайте, только если вы только что начали подключение из приложения на этом компьютере."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Отключить его можно в любой момент в разделе Компоненты &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Разрешайте только приложения, которые вы добавили сами. Если вы только что не добавляли коннектор, нажмите «Отклонить»."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Разрешить"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Отклонить"
