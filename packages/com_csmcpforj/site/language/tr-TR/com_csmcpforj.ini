COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="Oturum açma kapalı"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Bu site, uygulamaların oturum açarak bağlanmasına izin vermiyor; bu yüzden sizi buraya gönderen uygulama bu şekilde bağlanamaz.</p><p>Bir Super User bunu Joomla yönetim panelinde <strong>Bileşenler &rarr; MCP for J &rarr; Seçenekler &rarr; OAuth ile oturum açma</strong> bölümünden açabilir. Ardından bağlantıyı uygulamada yeniden başlatın.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="Bu uygulamanın kimliği doğrulanamadı"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>Sizi buraya gönderen uygulama kendini yayımlanmış bir kimlik belgesiyle tanıtıyor, ancak bu site onu kullanamıyor: %s.</p><p>Uygulama bağlanma yöntemini seçmenize izin veriyorsa bağlayıcıyı kaldırın ve yayımlanmış kimlik olmadan yeniden ekleyin; böylece uygulama bunun yerine bu sitede kayıt olur. Site yöneticisi ayrıntıları Bileşenler &rarr; MCP for J &rarr; Günlükler bölümünde görebilir.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Bu uygulama kayıtlı değil"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>Sizi buraya gönderen uygulama bu sitede kayıtlı değil veya erişimi geri alınmış. Uygulamaya dönün ve bağlayıcıyı yeniden ekleyin.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Geçersiz dönüş adresi"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>Uygulama, kaydettirmediği bir adrese geri dönmek istedi. Güvenliğiniz için istek durduruldu.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Hesabınız MCP kullanamaz"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p><strong>%1$s</strong> (%2$s) olarak oturum açtınız, ancak bu hesap bu sitede MCP for J kullanamıyor.</p><p>Bir Super User buna izin verebilir: hesabın grubunun Joomla'nın <em>Web Servisleri Girişi</em> iznine (Sistem &rarr; Genel Yapılandırma &rarr; İzinler) ve bileşenin Seçenekler &rarr; İzinler bölümünde MCP for J erişimine sahip olması gerekir.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Hesabınız henüz uygulama bağlayamıyor"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p><strong>%1$s</strong> (%2$s) olarak oturum açtınız, ancak bu hesap şu anda uygulama bağlayamıyor: %3$s.</p><p>Sorun giderildiğinde bağlantıyı uygulamada yeniden başlatın.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Oturumun süresi doldu"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Siz yanıt vermeden oturumun süresi doldu. Uygulamaya dönün ve yeniden bağlanmayı deneyin.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="%s bağlansın mı?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong>, MCP for J üzerinden <strong>%2$s</strong> sitesine bağlanmak istiyor."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="<strong>%1$s</strong> (%2$s) olarak, bu hesabın sitedeki izinlerinin tam aynısıyla işlem yapacak; hesabın izni varsa değişiklik de yapabilecek."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="İzin verdiğinizde <strong>%s</strong> adresine geri döneceksiniz."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="Uygulama kendini <strong>%s</strong> üzerinde yayımlanmış bir kimlikle tanıtıyor."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>Erişim bu bilgisayardaki bir programa gidiyor</strong> (%s). Yalnızca bağlantıyı az önce bu bilgisayardaki bir uygulamadan başlattıysanız izin verin."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Bağlantısını istediğiniz zaman Bileşenler &rarr; MCP for J bölümünden kesebilirsiniz."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Yalnızca kendi eklediğiniz uygulamalara izin verin. Az önce bir bağlayıcı eklemediyseniz Reddet'i seçin."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="İzin ver"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Reddet"
