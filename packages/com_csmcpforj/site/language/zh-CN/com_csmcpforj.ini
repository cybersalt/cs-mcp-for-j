COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="登录已关闭"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>此网站不允许应用通过登录来连接，因此把您带到这里的应用无法用这种方式连接。</p><p>Super User 可以在 Joomla 后台的 <strong>组件设置 &rarr; MCP for J &rarr; 选项 &rarr; OAuth 登录</strong> 中开启。然后请在应用中重新开始连接。</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="无法验证此应用的身份"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>把您带到这里的应用使用已发布的身份文档来表明身份，但此网站无法使用它：%s。</p><p>如果应用允许您选择连接方式，请删除连接器，然后不使用已发布的身份重新添加，让它改为在此网站上注册。网站管理员可以在 组件设置 &rarr; MCP for J &rarr; 日志 中查看详情。</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="此应用尚未注册"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>把您带到这里的应用没有在此网站注册，或者它的访问权限已被撤销。请回到应用中重新添加连接器。</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="返回地址无效"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>应用要求返回到一个它没有注册过的地址。为了您的安全，此请求已被停止。</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="您的账户不能使用 MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>您已以 <strong>%1$s</strong>（%2$s）身份登录，但此账户不能在本网站使用 MCP for J。</p><p>Super User 可以允许：该账户所在的用户组需要 Joomla 的 <em>Web Services 登录</em> 权限（系统设置 &rarr; 全局配置 &rarr; 权限），并在组件的 选项 &rarr; 权限 中获得 MCP for J 的访问权限。</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="您的账户暂时还不能连接应用"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>您已以 <strong>%1$s</strong>（%2$s）身份登录，但此账户现在不能连接应用：%3$s。</p><p>问题解决后，请在应用中重新开始连接。</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="会话已过期"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>您还没有作答，会话就已过期。请回到应用中重新尝试连接。</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="要连接 %s 吗？"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> 想通过 MCP for J 连接到 <strong>%2$s</strong>。"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="它将以 <strong>%1$s</strong>（%2$s）的身份操作，权限与此账户在网站上的权限完全相同；如果账户有权限，也会进行修改。"
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="您允许后，将返回到 <strong>%s</strong>。"
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="该应用使用发布在 <strong>%s</strong> 上的身份来表明身份。"
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>授权将发送给这台电脑上的某个程序</strong>（%s）。只有在您刚刚从这台电脑上的应用开始连接时才允许。"
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="您可以随时在 组件设置 &rarr; MCP for J 中断开它的连接。"
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="只允许您自己添加的应用。如果您刚才没有添加连接器，请选择「拒绝」。"
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="允许"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="拒绝"
