COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="Η σύνδεση είναι απενεργοποιημένη"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Αυτός ο ιστότοπος δεν επιτρέπει στις εφαρμογές να συνδέονται μέσω σύνδεσης χρήστη, οπότε η εφαρμογή που σας έστειλε εδώ δεν μπορεί να συνδεθεί με αυτόν τον τρόπο.</p><p>Ένας Super User μπορεί να το ενεργοποιήσει στη διαχείριση του Joomla, στο <strong>Εφαρμογές &rarr; MCP for J &rarr; Επιλογές &rarr; Σύνδεση OAuth</strong>. Έπειτα ξεκινήστε ξανά τη σύνδεση από την εφαρμογή.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="Δεν ήταν δυνατή η επαλήθευση της ταυτότητας αυτής της εφαρμογής"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>Η εφαρμογή που σας έστειλε εδώ αυτοπροσδιορίζεται με ένα δημοσιευμένο έγγραφο ταυτότητας, αλλά αυτός ο ιστότοπος δεν μπορεί να το χρησιμοποιήσει: %s.</p><p>Αν η εφαρμογή σάς επιτρέπει να επιλέξετε τον τρόπο σύνδεσης, αφαιρέστε τη σύνδεση και προσθέστε την ξανά χωρίς τη δημοσιευμένη ταυτότητα, ώστε να εγγραφεί σε αυτόν τον ιστότοπο. Ο διαχειριστής του ιστότοπου μπορεί να δει λεπτομέρειες στο Εφαρμογές &rarr; MCP for J &rarr; Αρχεία καταγραφής.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Αυτή η εφαρμογή δεν είναι εγγεγραμμένη"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>Η εφαρμογή που σας έστειλε εδώ δεν είναι εγγεγραμμένη σε αυτόν τον ιστότοπο ή η πρόσβασή της ανακλήθηκε. Επιστρέψτε στην εφαρμογή και προσθέστε ξανά τη σύνδεση.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Μη έγκυρη διεύθυνση επιστροφής"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>Η εφαρμογή ζήτησε να επιστρέψει σε μια διεύθυνση που δεν έχει δηλώσει. Για την ασφάλειά σας, το αίτημα διακόπηκε.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Ο λογαριασμός σας δεν μπορεί να χρησιμοποιήσει το MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Έχετε συνδεθεί ως <strong>%1$s</strong> (%2$s), αλλά αυτός ο λογαριασμός δεν μπορεί να χρησιμοποιήσει το MCP for J σε αυτόν τον ιστότοπο.</p><p>Ένας Super User μπορεί να το επιτρέψει: η ομάδα του λογαριασμού χρειάζεται το δικαίωμα <em>Υπηρεσίες Διαδικτύου Είσοδος</em> του Joomla (Σύστημα &rarr; Γενικές Ρυθμίσεις &rarr; Δικαιώματα) και πρόσβαση στο MCP for J στις Επιλογές &rarr; Δικαιώματα της εφαρμογής.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Ο λογαριασμός σας δεν μπορεί ακόμη να συνδέσει εφαρμογές"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Έχετε συνδεθεί ως <strong>%1$s</strong> (%2$s), αλλά αυτός ο λογαριασμός δεν μπορεί να συνδέσει εφαρμογές αυτή τη στιγμή: %3$s.</p><p>Όταν διορθωθεί αυτό, ξεκινήστε ξανά τη σύνδεση από την εφαρμογή.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Η συνεδρία έληξε"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Η συνεδρία έληξε πριν απαντήσετε. Επιστρέψτε στην εφαρμογή και δοκιμάστε ξανά να συνδεθείτε.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="Σύνδεση του %s;"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="Το <strong>%1$s</strong> θέλει να συνδεθεί στο <strong>%2$s</strong> μέσω του MCP for J."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="Θα ενεργεί ως <strong>%1$s</strong> (%2$s), με ακριβώς τα δικαιώματα που έχει αυτός ο λογαριασμός στον ιστότοπο, συμπεριλαμβανομένων αλλαγών αν ο λογαριασμός τις επιτρέπει."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="Όταν επιτρέψετε, θα επιστρέψετε στο <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="Η εφαρμογή αυτοπροσδιορίζεται με μια ταυτότητα που έχει δημοσιευτεί στο <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>Η πρόσβαση πηγαίνει σε ένα πρόγραμμα σε αυτόν τον υπολογιστή</strong> (%s). Επιτρέψτε το μόνο αν μόλις ξεκινήσατε τη σύνδεση από μια εφαρμογή σε αυτόν τον υπολογιστή."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Μπορείτε να την αποσυνδέσετε οποιαδήποτε στιγμή από το Εφαρμογές &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Επιτρέψτε μόνο εφαρμογές που προσθέσατε εσείς. Αν δεν προσθέσατε μόλις μια σύνδεση, επιλέξτε Απόρριψη."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Να επιτραπεί"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Απόρριψη"
