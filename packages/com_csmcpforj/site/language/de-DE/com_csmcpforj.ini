COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="Die Anmeldung ist ausgeschaltet"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Diese Website erlaubt Apps nicht, sich per Anmeldung zu verbinden. Die App, die Sie hierher geschickt hat, kann sich auf diesem Weg also nicht verbinden.</p><p>Ein Super User kann es in der Joomla-Administration unter <strong>Komponenten &rarr; MCP for J &rarr; Optionen &rarr; OAuth-Anmeldung</strong> einschalten. Starten Sie danach die Verbindung in der App erneut.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="Die Identität dieser App konnte nicht geprüft werden"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>Die App, die Sie hierher geschickt hat, hat sich mit einem veröffentlichten Identitätsdokument ausgewiesen, aber diese Website konnte es nicht verwenden: %s.</p><p>Wenn Sie in der App wählen können, wie sie sich verbindet, entfernen Sie den Konnektor und fügen ihn ohne die veröffentlichte Identität erneut hinzu, damit sich die App stattdessen bei dieser Website registriert. Der Administrator der Website sieht die Einzelheiten unter Komponenten &rarr; MCP for J &rarr; Protokolle.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Diese App ist nicht registriert"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>Die App, die Sie hierher geschickt hat, ist bei dieser Website nicht registriert, oder ihr Zugriff wurde widerrufen. Gehen Sie zurück zur App und fügen Sie den Konnektor erneut hinzu.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Ungültige Rücksprungadresse"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>Die App wollte zu einer Adresse zurückkehren, die sie nicht registriert hat. Zu Ihrer Sicherheit wurde diese Anfrage gestoppt.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Ihr Konto kann MCP nicht verwenden"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Sie sind als <strong>%1$s</strong> (%2$s) angemeldet, aber dieses Konto darf MCP for J auf dieser Website nicht verwenden.</p><p>Ein Super User kann es erlauben: Die Gruppe des Kontos braucht die Joomla-Berechtigung <em>Web-Services-Anmeldung</em> (System &rarr; Konfiguration &rarr; Berechtigungen) sowie Zugriff auf MCP for J unter Optionen &rarr; Berechtigungen der Komponente.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Ihr Konto kann noch keine Apps verbinden"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Sie sind als <strong>%1$s</strong> (%2$s) angemeldet, aber dieses Konto kann im Moment keine Apps verbinden: %3$s.</p><p>Sobald das behoben ist, starten Sie die Verbindung in Ihrer App erneut.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Sitzung abgelaufen"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Ihre Sitzung ist abgelaufen, bevor Sie geantwortet haben. Gehen Sie zurück zur App und versuchen Sie erneut, sich zu verbinden.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="%s verbinden?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> möchte sich über MCP for J mit <strong>%2$s</strong> verbinden."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="Die App handelt als <strong>%1$s</strong> (%2$s), mit genau den Berechtigungen, die dieses Konto auf der Website hat, einschließlich Änderungen, falls das Konto sie vornehmen darf."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="Nachdem Sie zugestimmt haben, werden Sie zu <strong>%s</strong> zurückgeleitet."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="Die App hat sich mit der Identität ausgewiesen, die unter <strong>%s</strong> veröffentlicht ist."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>Die Zustimmung geht an ein Programm auf diesem Computer</strong> (%s). Erlauben Sie es nur, wenn Sie gerade selbst eine Verbindung aus einer App auf diesem Computer gestartet haben."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Sie können die Verbindung jederzeit unter Komponenten &rarr; MCP for J trennen."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Erlauben Sie nur Apps, die Sie selbst hinzugefügt haben. Wenn Sie nicht gerade einen Konnektor hinzugefügt haben, wählen Sie Ablehnen."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Erlauben"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Ablehnen"
