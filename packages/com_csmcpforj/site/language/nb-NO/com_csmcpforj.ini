COM_CSMCPFORJ="MCP for J"

; OAuth sign-in pages, shown on the site to the person connecting an AI app.
; *_TITLE values are escaped when the page is built: plain text, no HTML
; and no entities such as &rsquo;. The other values are HTML.
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_TITLE="Innlogging er slått av"
COM_CSMCPFORJ_OAUTH_PAGE_DISABLED_BODY="<p>Dette nettstedet lar ikke apper koble til ved innlogging, så appen som sendte deg hit, kan ikke koble til på denne måten.</p><p>En Super User kan slå det på i Joomla-administrasjonen under <strong>Komponenter &rarr; MCP for J &rarr; Innstillinger &rarr; OAuth-innlogging</strong>. Start deretter tilkoblingen på nytt fra appen.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_TITLE="Appens identitet kunne ikke kontrolleres"
; %s = the reason, in English (it is also written to the Logs).
COM_CSMCPFORJ_OAUTH_PAGE_CIMD_BODY="<p>Appen som sendte deg hit, identifiserte seg med et publisert identitetsdokument, men dette nettstedet kunne ikke bruke det: %s.</p><p>Hvis appen lar deg velge hvordan den kobler til, fjerner du koblingen og legger den til på nytt uten den publiserte identiteten, slik at den registrerer seg hos dette nettstedet i stedet. Nettstedets administrator finner detaljene under Komponenter &rarr; MCP for J &rarr; Logger.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_TITLE="Denne appen er ikke registrert"
COM_CSMCPFORJ_OAUTH_PAGE_UNREGISTERED_BODY="<p>Appen som sendte deg hit, er ikke registrert hos dette nettstedet, eller tilgangen er trukket tilbake. Gå tilbake til appen og legg til koblingen på nytt.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_TITLE="Ugyldig omdirigeringsadresse"
COM_CSMCPFORJ_OAUTH_PAGE_REDIRECT_BODY="<p>Appen ba om å gå tilbake til en adresse den ikke har registrert. Av hensyn til din sikkerhet ble forespørselen stoppet.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_TITLE="Kontoen din kan ikke bruke MCP"
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_PAGE_NOT_ALLOWED_BODY="<p>Du er logget inn som <strong>%1$s</strong> (%2$s), men denne kontoen har ikke lov til å bruke MCP for J på dette nettstedet.</p><p>En Super User kan tillate det: kontoens gruppe trenger Joomla-rettigheten <em>Innlogging for nettjenester</em> (System &rarr; Globale innstillinger &rarr; Rettigheter), og i tillegg tilgang til MCP for J under komponentens Innstillinger &rarr; Rettigheter.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_TITLE="Kontoen din kan ikke koble til apper ennå"
; %1$s = the user's name, %2$s = their username, %3$s = the reason, in English.
COM_CSMCPFORJ_OAUTH_PAGE_INACTIVE_BODY="<p>Du er logget inn som <strong>%1$s</strong> (%2$s), men denne kontoen kan ikke koble til apper akkurat nå: %3$s.</p><p>Når det er ordnet, starter du tilkoblingen på nytt fra appen.</p>"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_TITLE="Økten er utløpt"
COM_CSMCPFORJ_OAUTH_PAGE_EXPIRED_BODY="<p>Økten din utløp før du svarte. Gå tilbake til appen og prøv å koble til på nytt.</p>"

; Allow / Deny page. %s in the title = the app's name.
COM_CSMCPFORJ_OAUTH_CONSENT_TITLE="Koble til %s?"
; %1$s = the app's name, %2$s = the site's name.
COM_CSMCPFORJ_OAUTH_CONSENT_LEAD="<strong>%1$s</strong> vil koble til <strong>%2$s</strong> gjennom MCP for J."
; %1$s = the user's name, %2$s = their username.
COM_CSMCPFORJ_OAUTH_CONSENT_ACT_AS="Den vil handle som <strong>%1$s</strong> (%2$s), med nøyaktig de rettighetene denne kontoen har på nettstedet, inkludert å gjøre endringer hvis kontoen kan det."
; %s = the host the browser returns to.
COM_CSMCPFORJ_OAUTH_CONSENT_RETURN="Etter at du har tillatt det, blir du sendt tilbake til <strong>%s</strong>."
; %s = the host the app's identity was published on.
COM_CSMCPFORJ_OAUTH_CONSENT_PUBLISHED="Appen identifiserte seg med identiteten som er publisert på <strong>%s</strong>."
; %s = the local address (localhost or 127.0.0.1).
COM_CSMCPFORJ_OAUTH_CONSENT_LOCAL="<strong>Godkjenningen går til et program på denne datamaskinen</strong> (%s). Tillat det bare hvis du nettopp startet tilkoblingen fra en app på denne datamaskinen."
COM_CSMCPFORJ_OAUTH_CONSENT_DISCONNECT="Du kan koble den fra når som helst under Komponenter &rarr; MCP for J."
; Must name the Deny button below.
COM_CSMCPFORJ_OAUTH_CONSENT_WARNING="Tillat bare apper du har lagt til selv. Hvis du ikke nettopp la til en kobling, velger du Avslå."
COM_CSMCPFORJ_OAUTH_CONSENT_ALLOW="Tillat"
COM_CSMCPFORJ_OAUTH_CONSENT_DENY="Avslå"
