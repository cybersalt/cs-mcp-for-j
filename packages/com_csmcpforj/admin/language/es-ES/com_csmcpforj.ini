COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="No hay clave de API que copiar. En su aplicación de IA, añada un conector y pegue la <strong>URL del endpoint</strong> de este sitio (abajo). Al hacer clic en Connect, la aplicación abre sola la página de inicio de sesión de este sitio: inicie sesión con su usuario y contraseña de este sitio y haga clic en <strong>Permitir</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai y Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Póngale un nombre, pegue la URL del endpoint y haga clic en Continue. Deje <em>Sign in now</em>; para el cliente OAuth funcionan tanto <em>Use Claude's published identity</em> como <em>Register automatically</em>. No añada cabeceras de solicitud. Haga clic en Add y luego en <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> <strong>Plugins</strong> en la barra lateral izquierda &rarr; <strong>Add</strong> (arriba a la derecha) &rarr; <strong>Add custom MCP server</strong>. Póngale un nombre, pegue la URL del endpoint, deje Authentication en <strong>OAuth</strong>, marque la casilla, haga clic en <strong>Create as a plugin</strong> y luego en <strong>Connect</strong>. Necesita un plan de pago de ChatGPT (Plus funciona)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>; luego escriba <code>/mcp</code>, elija el servidor y elija <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> Paleta de comandos &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; pegue la URL del endpoint. VS Code le pedirá que inicie sesión."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> añada <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> bajo <code>mcpServers</code> en <code>mcp.json</code> (sin cabeceras) y haga clic en <strong>Login</strong> junto al servidor en Settings &rarr; MCP."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> añada <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> para el servidor en <code>settings.json</code> y ejecute <code>/mcp auth &lt;name&gt;</code>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Codex abre solo la página de inicio de sesión (si no, ejecute <code>codex mcp login joomla</code>). Haga clic en Permitir en pocos minutos, en un navegador del mismo ordenador que Codex. Si el navegador dice luego que 127.0.0.1 rechazó la conexión, use <code>codex mcp login joomla --no-browser</code> y pegue la dirección de esa página en el terminal, o siga usando el método de la clave de API de abajo."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, pegue la URL del endpoint y haga clic en <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="Al hacer clic en Permitir, la aplicación actúa como la cuenta con la que inició sesión y puede hacer exactamente lo que esa cuenta puede en este sitio, incluido hacer cambios si la cuenta tiene permiso. Los Administrators y Managers necesitan antes el permiso <em>Acceso a servicios web</em> (vea Permisos en el panel). Cada aplicación conectada aparece en el panel, donde se puede desconectar al momento."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="¿Prefiere una clave de API, o su cliente no puede abrir un navegador? El método de la clave de API en <strong>Configuración avanzada</strong>, más abajo, sigue funcionando con cualquier cliente."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT (&ldquo;Add custom MCP server&rdquo;) y claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) solo pueden conectarse enviándole a la página de inicio de sesión de este sitio. Eso está desactivado en este sitio. Cuando está activado, conectar es: pegar la dirección de este sitio en la aplicación, iniciar sesión, hacer clic en Permitir."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="Activarlo en Opciones"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Pida a un Super User que active el <strong>inicio de sesión OAuth</strong> en las opciones de MCP for J. Mientras tanto, use el método de la clave de API de abajo."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="Lo más fácil: el cuadro &ldquo;Add custom connector&rdquo; de Claude funciona en este sitio."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="El inicio de sesión está activado en este sitio, así que en Claude Desktop o claude.ai vaya a <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, pegue la dirección MCP de este sitio, haga clic en Continue, mantenga los ajustes de inicio de sesión que detecte, haga clic en Add y luego en Connect, inicie sesión con su usuario y contraseña de este sitio y haga clic en Permitir. El método del archivo de configuración de abajo solo hace falta si prefiere una clave de API."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai se conecta de forma permanente con <strong>Add custom connector</strong>: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, pegue la dirección MCP de este sitio, haga clic en Continue, mantenga los ajustes de inicio de sesión que detecte, haga clic en Add y luego en Connect. Inicie sesión con su usuario y contraseña de este sitio y haga clic en Permitir. La conexión queda disponible en todos los chats."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="En ChatGPT, haga clic en <strong>Plugins</strong> en la barra lateral izquierda y luego en <strong>Add</strong> (arriba a la derecha) &rarr; <strong>Add custom MCP server</strong>. Póngale un nombre (como &ldquo;Mi sitio Joomla&rdquo;), pegue la dirección MCP de este sitio, deje Authentication en <strong>OAuth</strong>, marque &ldquo;I understand and want to continue&rdquo; y haga clic en <strong>Create as a plugin</strong>. Haga clic en <strong>Connect</strong> y ChatGPT abrirá la página de inicio de sesión de este sitio: inicie sesión con su usuario y contraseña de este sitio y haga clic en Permitir. Después, en un chat, escriba <strong>@</strong> y elija el plugin. No hay clave de API que pegar."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="El cuadro &ldquo;Add custom connector&rdquo; se conecta, pero el inicio de sesión falla"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Compruebe, por orden: (1) que la cuenta con la que inició sesión puede usar MCP &mdash; los Administrators necesitan <em>Acceso a servicios web</em>, y los Managers eso más <em>Usar el endpoint MCP</em> en Opciones &rarr; Permisos (vea la tarjeta <em>¿Quién puede usar este endpoint?</em> del panel); la página de inicio de sesión se lo dice si no es así; (2) que la tarjeta &ldquo;Conectar aplicaciones de IA iniciando sesión&rdquo; del panel dice <strong>Listo</strong>; (3) que su cortafuegos deja que los servidores de la aplicación lleguen al sitio (vea la siguiente entrada). No introduzca un client ID ni un secret: la aplicación se registra sola. (4) Haga clic en Permitir poco después de que se abra la página de inicio de sesión: las aplicaciones abandonan un inicio de sesión al cabo de un rato (Codex tras unos 5 minutos), y un Permitir tardío acaba en error. Vuelva a iniciar Connect y funcionará."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai o ChatGPT no llega al sitio, o el inicio de sesión se queda a medias"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai y ChatGPT se conectan desde sus propios servidores, no desde su navegador, así que el sitio tiene que ser accesible por HTTPS público. Un cortafuegos de aplicaciones web (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 o un cortafuegos del alojamiento como TigerProtect de o2switch, que responde 503) puede bloquear esas solicitudes. Permita las solicitudes a <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> y <code>index.php?csmcpforj_oauth=&hellip;</code> (los endpoints de registro, token y revocación). En RSFirewall bastan estas dos excepciones: <code>csmcpforj_oauth</code> y <code>api\/index\.php\/v1\/mcp</code> como expresión regular. claude.ai se conecta desde <code>160.79.104.0/21</code>. <strong>Cloudflare</strong>: Browser Integrity Check y Security Level pueden bloquear los servidores de las aplicaciones. Añada una regla personalizada del WAF (Security &rarr; WAF &rarr; Custom rules) con la acción <strong>Skip</strong> para las solicitudes cuya ruta URI contenga <code>/api/index.php/v1/mcp</code> o <code>/.well-known/oauth-</code>, o cuya cadena de consulta contenga <code>csmcpforj_oauth</code>, y marque <em>Browser Integrity Check</em> y <em>Security Level</em>. Bot Fight Mode no se puede saltar con una regla, así que desactívelo si bloquea. <strong>Route 66</strong> y otras extensiones SEO que reescriben URL pueden capturar las direcciones de inicio de sesión (<code>index.php?csmcpforj_oauth=&hellip;</code>) y responder con la página de inicio, de modo que la aplicación no puede registrarse y no da un motivo claro. Si <strong>Comprobar conexión</strong> muestra la página de inicio para los endpoints de inicio de sesión, excluya en esa extensión las URL que contengan <code>csmcpforj_oauth</code>, o desactive su plugin de sistema. La página de inicio de sesión en sí se abre en su propio navegador."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="El panel dice que las aplicaciones de IA no encuentran la página de inicio de sesión de este sitio (No está listo)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="Los clientes de IA buscan los datos de inicio de sesión en <code>/.well-known/oauth-authorization-server</code> de su dominio. Joomla solo responde ahí cuando Configuración global &rarr; <strong>Usar la reescritura de URLs</strong> está activado y el <code>.htaccess</code> del sitio está en su sitio (cambie el nombre de <code>htaccess.txt</code>), o cuando nginx envía las rutas desconocidas a <code>index.php</code>. Esto no afecta a AutoSSL de cPanel, que usa <code>/.well-known/acme-challenge/</code>. Un sitio instalado en una subcarpeta (por ejemplo <code>example.com/joomla</code>) necesita además una regla en la raíz del dominio que envíe <code>/.well-known/oauth-authorization-server/joomla</code> a la subcarpeta."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Iniciar sesión desde un servidor o un equipo sin navegador"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Los clientes de escritorio (Claude Code, Codex, Cursor, Gemini CLI) abren un navegador en el mismo equipo y esperan la respuesta en una dirección local, así que el inicio de sesión OAuth necesita un navegador allí. En un servidor sin pantalla o por SSH, use el método de la clave de API de Configuración avanzada; funciona en todas partes."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="En la aplicación de IA, añada un conector nuevo (claude.ai y Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector; ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server) y pegue esta <strong>URL del endpoint</strong>: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Haga clic en Connect.</strong> La aplicación abre sola la página de inicio de sesión de este sitio. Inicie sesión con su usuario y contraseña de este sitio."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Haga clic en Permitir.</strong> Vuelve a la aplicación, ya conectada. La aplicación puede hacer todo lo que su cuenta tiene permitido en este sitio."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Conectar una aplicación de IA a este sitio"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Hay tres formas. Haga clic en una para abrir sus pasos numerados. La mayoría quiere la primera."
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. Iniciar sesión (lo más fácil) &mdash; ChatGPT, claude.ai, Claude Desktop y la mayoría de las demás aplicaciones de IA"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Pegar un prompt de configuración &mdash; para un chat de IA que puede ejecutar comandos"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. Archivo de configuración o línea de comandos &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI y otros"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Funciona en aplicaciones de IA que pueden ejecutar comandos (Codex, Claude Code, Cursor, Cline, el modo agente de Copilot y similares). La IA prueba ella misma la conexión y puede ofrecer hacerla permanente."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="Para aplicaciones que se configuran con un archivo de ajustes o un comando. Se hace una vez y queda conectado."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>Consiga su token de API.</strong> Haga clic en el botón: su perfil de usuario se abre en una pestaña nueva. Abra allí la pestaña <strong>API Token de Joomla</strong>, haga clic en el icono del ojo para mostrar el token y cópielo. Después vuelva a esta pestaña."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="Conseguir mi token de API (abre una pestaña nueva)"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>Copie el prompt.</strong> Su token ya está incluido."
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="<strong>Péguelo en una conversación nueva</strong> con su aplicación de IA y envíelo. La IA prueba la conexión y, si puede, ofrece hacerla permanente."
COM_CSMCPFORJ_DASHBOARD_WAY3_STEP_COPY="<strong>Copie la configuración.</strong> Su token ya está incluido."
COM_CSMCPFORJ_DASHBOARD_WAY3_GUIDE_LINK="Las instrucciones paso a paso para cada aplicación están en la guía de configuración &rarr;"
COM_CSMCPFORJ_DASHBOARD_COPY_URL_BUTTON="Copiar"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1_COPY="<strong>Copie la URL del endpoint.</strong>"
