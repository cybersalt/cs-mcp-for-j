COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="Inicio de sesión OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Permite que las aplicaciones de IA se conecten enviándole a la página de inicio de sesión de este sitio web, en lugar de que usted copie en ellas una clave de API. ChatGPT (&ldquo;Add custom MCP server&rdquo;) y claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) solo pueden conectarse así. Las conexiones con clave de API siguen funcionando en cualquier caso."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="Activar el inicio de sesión OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Si está activado, usted pega la dirección MCP de este sitio en una aplicación de IA, la aplicación abre la página de inicio de sesión de este sitio, usted inicia sesión con su usuario y contraseña habituales y hace clic en Permitir. Desde entonces la aplicación actúa como usted, con exactamente sus permisos en este sitio. Las aplicaciones conectadas aparecen en el panel, donde se puede desconectar cada una. Al desactivar esto se desconectan todas al instante."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Duración del token de acceso (segundos)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Cuánto dura cada token de acceso antes de que la aplicación lo renueve sin avisar. Predeterminado 3600 (una hora). Entre 300 y 86400."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Mantener la sesión iniciada (días)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Cuánto tiempo puede seguir renovando una aplicación sin que el usuario vuelva a iniciar sesión. Cada renovación pone el reloj a cero. Predeterminado 30."
