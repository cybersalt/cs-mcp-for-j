COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="Guía de configuración"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="Guía de configuración"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for J — Guía de configuración"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Conectar una IA a este sitio Joomla"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for J está pensado para que sea fácil conectar un asistente de IA como Codex, Claude, ChatGPT o Cursor a su sitio Joomla &mdash; para que la IA pueda leer sus artículos, gestionar usuarios, publicar contenido y más, todo desde el chat habitual de la IA. No hace falta ser técnico. El método fácil de abajo sirve a la mayoría; más abajo encontrará opciones avanzadas si las necesita."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ La forma fácil"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Sin archivos de configuración. Sin cabeceras. Sin jerga. Copie un prompt de configuración listo para usar desde el panel y péguelo en un chat nuevo con su IA. La IA hace el resto &mdash; prueba la conexión y, en los clientes que lo admiten, le ofrece guardarla de forma permanente."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Consiga su clave de API</strong> (una contraseña personal que permite a su IA actuar en este sitio). Si todavía no tiene una, abajo se explica cómo."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Vaya al panel</strong> (botón de abajo) y pegue allí su clave de API en el campo."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Haga clic en el botón &ldquo;Copiar prompt&rdquo;</strong> del panel. Su clave se incluye automáticamente en el prompt antes de copiarlo."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Péguelo en un chat nuevo</strong> con su IA (Claude, ChatGPT, Cursor, Copilot, Gemini, etc.) y envíelo. La IA confirmará que la conexión funciona y le ofrecerá guardarla."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Ir al panel"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="Eso es todo. Su IA está conectada. Si quiere saber más sobre cómo encaja todo, o prefiere configurar su IA a mano, siga leyendo abajo &mdash; pero no es necesario."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Consiga su clave de API"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="Una <strong>clave de API</strong> es una contraseña personal que permite a su IA actuar en este sitio Joomla como USTED. Cualquiera que tenga la clave puede hacer todo lo que puede hacer su cuenta de usuario de Joomla &mdash; así que trátela como algo privado. Así se genera una:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sHaga clic aquí para abrir su perfil de usuario de Joomla%s. Se abre en una pestaña nueva. Allí, busque la pestaña llamada <strong>API Token de Joomla</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="En esa pestaña, haga clic en el botón <strong>Restablecer</strong>. Joomla genera una larga cadena de letras y números y la pone en el campo bajo el botón. Esa es su clave."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Haga clic en el pequeño <strong>icono del ojo</strong> junto al campo para mostrar la clave y copie la cadena completa."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Péguela en el campo de abajo de esta página (se guarda solo en su navegador, para que los botones de copiar de esta página la rellenen solos), O péguela directamente en el campo de clave de API del panel si va allí a hacer la configuración fácil."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Trate esta clave como una contraseña."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="No la pegue en documentos compartidos, capturas de pantalla ni código que vaya a publicar. Si alguna vez se filtra, vuelva a la pestaña API Token de Joomla y haga clic de nuevo en Restablecer &mdash; la clave anterior deja de ser válida al instante."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Pegue aquí su clave de API (para copiar con un clic en esta página)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Su clave solo se recuerda en este navegador</strong> &mdash; nunca sale de su ordenador. Use el botón de la papelera para olvidarla. Si deja esto vacío, los botones de copiar de esta página seguirán funcionando, pero tendrá que pegar su clave a mano en el fragmento copiado."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Mostrar/ocultar la clave"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Olvidar la clave guardada"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Avanzado: conectar una IA manualmente (la mayoría no lo necesita)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Esta sección es para quien quiera configurar a mano la conexión de su cliente de IA con este sitio &mdash; normalmente editando un pequeño archivo de texto llamado &ldquo;archivo de configuración&rdquo;. Si la configuración fácil de arriba le ha funcionado, puede ignorar toda esta sección. Si quiere saltarse el prompt de configuración y registrar la conexión directamente en su cliente de IA, siga leyendo."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="La URL de conexión de este sitio"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="Esta es la dirección que necesita su cliente de IA. La pegará en la configuración del cliente junto con su clave de API."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Elija su cliente de IA"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="La URL de conexión y la clave de API son las mismas para cualquier IA &mdash; solo cambia <em>dónde las pega</em> según el cliente. Elija su cliente abajo para ver las instrucciones concretas."

