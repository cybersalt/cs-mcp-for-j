COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, extensión para IDE o aplicación de escritorio)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex admite este endpoint de forma nativa como servidor MCP Streamable HTTP. Primero guarde la clave de API de Joomla en una variable de entorno propia de este sitio y después registre el endpoint con el nombre de esa variable. La clave nunca se escribe en <code>config.toml</code>. Si usa el botón de copiar después de pegar una clave arriba, el comando de entorno copiado contiene esa clave; manténgala fuera de terminales compartidos, grabaciones y solicitudes de soporte."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; guardar la clave para los próximos procesos de Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Abra un terminal nuevo después de crear una variable de entorno permanente en Windows. Los procesos de Codex y de terminal que ya estén abiertos no la ven."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; definir la clave para este terminal (guárdela en su entorno de shell seguro si hace falta que persista)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Registrar este sitio Joomla en Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Ejecute <code>codex mcp list</code>, reinicie Codex (o revise el estado MCP en su interfaz) y luego llame a la herramienta inofensiva de solo lectura <code>get_joomla_version</code>. Así se comprueban la inicialización, la autenticación, el descubrimiento de herramientas y la llamada. Para una conexión de solo lectura, active además el modo de solo lectura del servidor de MCP for J; los ajustes de aprobación del cliente no pueden saltarse los permisos del servidor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="¿Token no válido en cPanel o PHP-FPM?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Puede que el servidor web esté eliminando la cabecera estándar Authorization. Sustituya la entrada creada arriba en <code>~/.codex/config.toml</code> por este bloque para que Codex lea la misma variable de entorno y la envíe como <code>X-Joomla-Token</code>, y reinicie Codex."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Atención &mdash; el cuadro &ldquo;Add custom connector&rdquo; de Claude necesita OAuth, y está desactivado en este sitio."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="El cuadro &ldquo;Add custom connector&rdquo; integrado en Claude Desktop y claude.ai se conecta iniciando sesión (OAuth) y no tiene campo para una clave de API. Un Super User puede activar el inicio de sesión OAuth en las opciones de MCP for J; entonces ese cuadro funciona. Hasta entonces, las instrucciones de Claude Desktop de abajo usan un cambio en el archivo de configuración. (O use la configuración fácil de arriba &mdash; también funciona con Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Cuatro pasos: cree un pequeño archivo auxiliar, un &ldquo;script envoltorio&rdquo;, que contiene el comando de conexión; haga que el archivo de configuración de Claude Desktop apunte a él; y reinicie Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="¿Por qué un script envoltorio en lugar de poner la conexión directamente en la configuración de Claude Desktop? Claude Desktop 1.30096+ (ago. 2026) rechaza las entradas de configuración cuyos argumentos parecen contener credenciales &mdash; una medida de seguridad bienintencionada que, por desgracia, bloquea el método directo. Mover el comando a un pequeño archivo auxiliar lo evita (Claude Desktop solo ve un comando simple sin argumentos visibles) y su clave de API queda exactamente igual de segura que antes &mdash; el archivo auxiliar está en su propia carpeta de usuario, junto a la configuración de Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Requisito previo, una sola vez &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Estas instrucciones suponen que tiene Node.js instalado en su ordenador (incluye un comando llamado <code>npx</code>). La mayoría de los entornos de desarrollo ya lo tienen; si no, instálelo desde <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> con el instalador LTS. El archivo envoltorio de abajo espera Node.js en la ruta de instalación estándar de Windows, <code>C:\Program Files\nodejs\</code>. Si lo instaló en otro sitio, cambie esa ruta en el archivo envoltorio después de copiarlo."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Paso 1 &mdash; crear el script envoltorio"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Por ahora solo para Windows (usuarios de Mac/Linux: vean las preguntas frecuentes). Copie el bloque de abajo en un archivo de texto nuevo. Guárdelo en su carpeta de usuario (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) con el nombre <code>claude-mcp-joomla-{sitename}.cmd</code>, sustituyendo <code>{sitename}</code> por una etiqueta corta para su sitio (p. ej. <code>cybersaltorg</code>). Asegúrese de que <code>.cmd</code> sea realmente la extensión y no parte del nombre &mdash; en el Bloc de notas, elija &ldquo;Tipo: Todos los archivos&rdquo; para que no añada <code>.txt</code>. Si pegó su clave de API en el campo de arriba de esta página, el botón de copiar la incluirá por usted."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="¿No sabe cuál es su nombre de usuario de Windows? Abra el Explorador de archivos, vaya a <code>C:\Users\</code> y mire los nombres de las carpetas &mdash; una es la suya."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Paso 2 &mdash; abrir el archivo de configuración de Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="El archivo de ajustes de Claude Desktop está en una ruta fija según el sistema operativo. Ábralo con cualquier editor de texto (VS Code, Bloc de notas, TextEdit, Sublime o el que tenga):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop tiene un botón en Settings &rarr; Developer &rarr; <strong>Edit Config</strong> que debería abrirle el archivo. Si al hacer clic no pasa nada, es porque su ordenador no sabe con qué programa abrir los archivos <code>.json</code>. No pasa nada &mdash; abra usted el archivo con un editor de texto usando una de las rutas de arriba. Si el archivo todavía no existe, créelo y use el bloque de abajo como todo su contenido (envuelto como <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Paso 3 &mdash; añadir este bloque a la configuración de Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Pegue esto en <code>claude_desktop_config.json</code>. Si el archivo ya tiene un objeto <code>mcpServers</code> con otros servidores, añada la entrada <code>joomla-...</code> junto a ellos (no pegue un segundo objeto <code>mcpServers</code>). Si el archivo está vacío o no existe, use todo el bloque de abajo como contenido. <strong>Importante:</strong> sustituya <code>YOUR_WINDOWS_USERNAME</code> por su nombre de usuario real de Windows."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Esta configuración solo hace que Claude Desktop apunte al script envoltorio que creó en el paso 1. Su clave de API se queda en el archivo envoltorio, no en la configuración de Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Paso 4 &mdash; cerrar del todo Claude Desktop y volver a abrirlo"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop solo lee su archivo de configuración al arrancar. Ciérrelo del todo &mdash; en Windows, haga clic derecho en el icono de Claude en la bandeja del sistema (abajo a la derecha; puede que tenga que pulsar antes la pequeña flecha hacia arriba) y elija Quit. Espere un par de segundos y vuelva a abrirlo. En cualquier conversación, haga clic en el icono de herramientas (o pregunte &ldquo;¿qué herramientas tienes?&rdquo;) &mdash; deberían aparecer las herramientas del sitio. Si no aparecen, vea Solución de problemas más abajo."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (terminal o VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Si usa Claude Code, un solo comando de terminal crea la conexión &mdash; sin editar ningún archivo de configuración. Pegue su clave de API en el campo de arriba para que el botón de copiar de abajo la incluya; luego pegue el comando en un terminal y pulse Intro. Claude Code confirma la conexión al momento y se recarga."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (la versión web)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="El cuadro <strong>Add custom connector</strong> de claude.ai se conecta iniciando sesión (OAuth), y eso está desactivado en este sitio. Un Super User puede activarlo en las opciones de MCP for J, y entonces claude.ai tendrá una conexión permanente. Hasta entonces, la configuración fácil de arriba (pegar un prompt) sirve solo para el chat actual."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor guarda sus conexiones MCP en un archivo de configuración llamado <code>mcp.json</code>. Ábralo en un editor de texto, pegue el bloque de abajo dentro del objeto <code>mcpServers</code> y guarde. En la mayoría de los casos Cursor aplica el cambio sin reiniciar."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Ubicación del archivo de configuración: <code>~/.cursor/mcp.json</code> (para todos sus proyectos) o <code>.cursor/mcp.json</code> en una carpeta de proyecto concreta (solo para ese proyecto)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Servidores MCP personalizados en ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="El cuadro <strong>Add custom MCP server</strong> de ChatGPT solo puede conectarse iniciando sesión (OAuth) o sin autenticación; no tiene campo para una clave de API ni para una cabecera. El inicio de sesión OAuth está desactivado en este sitio, así que ChatGPT todavía no puede conectarse. Un Super User puede activarlo en las opciones de MCP for J. Mientras tanto, use Codex (el agente de programación de OpenAI), que envía la clave de API desde una variable de entorno."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Para añadir un servidor MCP personalizado hace falta un plan de pago de ChatGPT. Funciona con Plus (comprobado en octubre de 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI y Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Tanto Gemini CLI (el asistente de IA de Google para el terminal) como la extensión Gemini Code Assist (para VS Code / JetBrains) leen el mismo archivo de configuración MCP. Dos pasos: edite ese archivo para añadir este sitio Joomla como servidor MCP y reinicie Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Puede añadir el servidor de forma global (para que lo vea cualquier sesión de Gemini) o solo dentro de una carpeta de proyecto. El fragmento es idéntico &mdash; solo cambia la ubicación del archivo."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Abra (o cree) su archivo de ajustes de Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Elija una de estas dos ubicaciones:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Global (todos los proyectos):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Solo un proyecto:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (en una carpeta de proyecto)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Pegue este bloque dentro del archivo."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Si el archivo ya tiene una sección <code>mcpServers</code>, añada la entrada <code>&quot;joomla-...&quot;</code> dentro de la existente &mdash; no duplique la clave exterior <code>mcpServers</code>. Si el archivo está vacío o es nuevo, pegue el fragmento entero tal cual."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini usa <code>httpUrl</code> para los servidores MCP por HTTP (como este) &mdash; distinto de la clave <code>url</code> de Cursor. Copie exactamente este fragmento en lugar de reutilizar el de Cursor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Reinicie Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Cierre y vuelva a abrir <code>gemini</code> en el terminal, o recargue la ventana de VS Code / JetBrains. Escriba <code>/mcp</code> en Gemini CLI para ver los servidores conectados y confirmar que aparece su sitio Joomla."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="La aplicación web <code>gemini.google.com</code> no admite servidores MCP personalizados a fecha de ago. 2026 &mdash; esta guía cubre solo Gemini CLI y Gemini Code Assist. Si Google añade soporte en la interfaz web más adelante, lo documentaremos aquí."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Otros clientes de IA compatibles con MCP (Cline, Continue, GitHub Copilot en modo agente, Windsurf, mcp-cli, etc.) también funcionan &mdash; la URL de conexión y la clave de API son idénticas, solo cambia el sitio exacto donde se pegan. Iremos añadiendo guías para más clientes; si se queda atascado, las preguntas frecuentes de abajo tienen orientación general."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Copiar"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Copiado"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Copiado (con su clave)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Seguridad y uso compartido"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="Su clave de API ES el inicio de sesión &mdash; quien la tenga puede hacer todo lo que puede hacer su cuenta de usuario de Joomla. No hay acceso anónimo. Si activa el <strong>inicio de sesión OAuth</strong>, una aplicación de IA también puede conectarse enviándole a la página de inicio de sesión normal de este sitio; después actúa como la cuenta que inició sesión, con exactamente los permisos de esa cuenta, hasta que la desconecte en el panel."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Dar acceso MCP a otras personas"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Hay dos formas &mdash; elija la que le convenga:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Una clave por persona (lo más seguro)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Cree un usuario de Joomla para cada persona, póngalo en un grupo con solo los permisos que quiera darle (p. ej. solo lectura), genere una clave para ese usuario y envíesela de forma privada. Cada persona tiene su propio rastro en los registros; puede revocar cualquier clave sin afectar a las demás."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Una clave compartida (lo más sencillo, pero lo menos seguro)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Cree un usuario limitado (p. ej. <code>mcp-demo-guest</code>) en un grupo de solo lectura, genere una clave y compártala más ampliamente. Más fácil de repartir; más difícil saber quién la usa o quitar el acceso a una sola persona. Bien para una demo pública; no para accesos delicados."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Revocar una clave"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="Para que una clave existente deje de funcionar al instante, vaya a Usuarios &rarr; el usuario en cuestión &rarr; pestaña API Token de Joomla &rarr; haga clic en <strong>Restablecer</strong>. La clave anterior deja de ser válida en el momento del clic. Entregue la nueva clave a esa persona o déjela sin acceso."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Solución de problemas"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Busque el tipo de aplicación que está conectando y abra el problema que coincida con lo que ve. Los mensajes de error y los bloqueos de cortafuegos pueden aparecer en cualquier aplicación, así que tienen su propio grupo al final."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; o &ldquo;Authentication failed&rdquo; (error 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="Su IA llega al sitio, pero la clave de API no es correcta. Compruebe: (1) que la clave no se ha restablecido desde que la copió (cada restablecimiento invalida la clave anterior); (2) que se copió entera, sin caracteres de menos ni espacios de más; (3) si editó un archivo de configuración, que la palabra <code>Bearer </code> (con un espacio detrás) va antes de la clave. Si no está seguro, genere una clave nueva y vuelva a intentarlo."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; o &ldquo;Could not match accept header&rdquo; (error 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Las versiones antiguas de MCP for J (anteriores a la 2.3.4) tenían un fallo que impedía conectarse a algunos clientes de IA. Actualice MCP for J a la última versión &mdash; mire en Sistema &rarr; Actualizar &rarr; Extensiones en la administración de Joomla."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;Conectado, pero no aparece ninguna herramienta en la IA&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Normalmente es una de tres cosas: (1) el grupo del usuario no tiene <strong>Acceso a servicios web</strong> &mdash; configúrelo en Sistema &rarr; Configuración global &rarr; Permisos (de forma predeterminada solo lo tienen los Super Users); (2) el grupo no tiene permiso MCP &mdash; los Super Users siempre lo tienen y los Administrators por los valores predeterminados de Joomla, pero los Managers y otros grupos necesitan Usar el endpoint MCP (y Escribir a través del endpoint MCP para cambios) en Opciones &rarr; Permisos de este componente; (3) el cliente de IA guardó en caché una lista de herramientas vacía &mdash; desconecte y vuelva a conectar el servidor MCP en el cliente para que lo compruebe de nuevo."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; o la URL devuelve un error (error 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="O bien la URL es incorrecta (revísela &mdash; debe terminar en <code>/api/index.php/v1/mcp</code>), O el plugin de servicios web de MCP está desactivado en su sitio Joomla. En la administración de Joomla: Sistema &rarr; Gestionar &rarr; Extensiones &rarr; busque <code>csmcpforj</code> &rarr; compruebe que el plugin de servicios web está activado. Si ya está activado, puede que el <code>.htaccess</code> de su sitio esté bloqueando la ruta <code>/api/</code> &mdash; un problema del proveedor de alojamiento o de un plugin de seguridad."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; o &ldquo;Malware detected&rdquo; (error 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Un plugin de seguridad de su sitio Joomla (RSFirewall, Admin Tools Pro, Securitycheck Pro) está bloqueando la solicitud MCP. En RSFirewall, añada dos excepciones: <code>csmcpforj_oauth</code> y <code>api\/index\.php\/v1\/mcp</code> como expresión regular (la primera es para el inicio de sesión). En los demás, permita <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> y las URL que contengan <code>csmcpforj_oauth</code>. Para confirmar la causa, desactive un momento el plugin de seguridad, vuelva a intentarlo y actívelo de nuevo con las excepciones puestas. El botón <strong>Comprobar conexión</strong> del panel muestra qué dirección está bloqueada."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="El botón &ldquo;Edit Config&rdquo; de Claude Desktop no hace nada al pulsarlo"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Ese botón intenta pasar <code>claude_desktop_config.json</code> al programa con el que su ordenador abre los archivos <code>.json</code>. Si no lo tiene configurado, el botón no hace nada sin avisar. Solución: abra usted el archivo con cualquier editor de texto. Las rutas por sistema operativo están en la sección de Claude dentro de Avanzado, más arriba. Si el archivo todavía no existe, créelo y use el fragmento de esa sección como todo su contenido (envuélvalo como <code>{&quot;mcpServers&quot;: { ... }}</code>). No hace falta cambiar permisos &mdash; el archivo está en su propia carpeta de usuario."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="El cuadro &ldquo;Add custom connector&rdquo; de Claude o &ldquo;Add custom MCP server&rdquo; de ChatGPT no tiene campo para la clave de API"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Esos cuadros están hechos para conectarse iniciando sesión (OAuth); no hay dónde pegar una clave de API de MCP for J. Este sitio tiene el inicio de sesión OAuth desactivado. Un Super User puede activarlo en Componentes &rarr; MCP for J &rarr; Opciones &rarr; <strong>Inicio de sesión OAuth</strong>, y entonces funcionan los dos cuadros. Mientras tanto: Claude Desktop puede usar el método del script envoltorio de arriba, claude.ai la configuración fácil y los usuarios de ChatGPT, Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop muestra &ldquo;Some MCP servers could not be loaded&rdquo; al arrancar"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (ago. 2026) endureció la validación del archivo de configuración y ahora rechaza las entradas cuyos argumentos parecen contener credenciales. Eso bloquea las dos formas obvias de configurar directamente en <code>claude_desktop_config.json</code> un servidor MCP con token bearer: la forma nativa <code>type: http</code> Y pasar <code>mcp-remote</code> con un argumento <code>--header &quot;Authorization: Bearer ...&quot;</code>. Ambas parecen correctas en el archivo, pero el validador de esquema de Claude Desktop las descarta al cargarlas. <strong>Solución:</strong> use el método del script envoltorio descrito en la sección de Claude dentro de Avanzado, más arriba &mdash; ponga todo el comando en un pequeño archivo <code>.cmd</code> y haga que la configuración de Claude Desktop solo haga referencia a ese archivo. Claude Desktop ve un comando simple sin argumentos visibles y lo acepta. Su clave de API queda exactamente igual de segura que antes &mdash; el archivo envoltorio está en su propia carpeta de usuario."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="He reiniciado Claude Desktop, pero sigue sin ver la nueva conexión"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="En Windows, cerrar la ventana de Claude Desktop solo la oculta en la bandeja del sistema &mdash; la aplicación sigue en marcha con la configuración ANTIGUA cargada en memoria. Pulsar después el icono de la barra de tareas solo recupera la ventana de ese proceso que ya está en marcha. Claude Desktop solo vuelve a leer su archivo de configuración con un reinicio real de la aplicación. Para reiniciarla de verdad: haga clic derecho en el icono de Claude en la bandeja del sistema (esquina inferior derecha; puede que tenga que pulsar la pequeña flecha hacia arriba para ver los iconos ocultos) &rarr; elija <strong>Quit</strong> &rarr; espere unos 3 segundos a que el proceso termine del todo &rarr; vuelva a abrir Claude Desktop desde el menú Inicio. Solo entonces se aplicarán los cambios de su archivo de configuración."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Preguntas frecuentes"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="¿Puede alguien usar esta conexión sin una clave de API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="No. Cada solicitud tiene que llevar una clave de API válida, o un token de acceso OAuth si el inicio de sesión OAuth está activado. Las solicitudes sin ella se rechazan. Es así a propósito &mdash; la IA puede hacer acciones reales en su sitio (crear artículos, editar usuarios, etc.), así que el acceso anónimo sería un desastre de seguridad."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="¿Puede un usuario de Joomla tener varias claves de API activas?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="No. Joomla guarda exactamente una clave de API por usuario. Pulsar Restablecer genera una nueva e invalida la anterior. Si necesita varias claves (una por dispositivo, una por herramienta de IA, etc.), cree usuarios de Joomla separados."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="¿Hay un límite de uso?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="MCP for J en sí no tiene límite. Se aplican los límites normales del alojamiento (memoria de PHP, conexiones de MariaDB, etc.). Si genera mucho tráfico (operaciones por lotes grandes en muchos sitios), hable con su proveedor de alojamiento para aumentar la concurrencia de PHP-FPM."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="¿Tengo que abrir puertos del cortafuegos o configurar algo especial?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="No. MCP usa simplemente HTTPS estándar en el puerto 443. Si su sitio ya es accesible públicamente en <code>https://yoursite.com/</code>, el endpoint MCP es accesible desde cualquier cliente de IA en Internet sin configuración adicional."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="¿Cómo cambio (roto) mi clave de API de forma periódica?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="No hay programación automática &mdash; la cambia a mano cuando quiera. Vaya a Usuarios &rarr; el usuario &rarr; pestaña API Token de Joomla &rarr; haga clic en Restablecer. Después actualice la configuración del cliente de IA con la nueva clave. Buena costumbre: cambie cualquier clave que haya aparecido alguna vez en una captura de pantalla, un registro o un informe de errores."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Uso un cliente de IA que no aparece arriba &mdash; ¿funcionará?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Casi seguro que sí, siempre que admita MCP estándar por HTTPS y le permita añadir una cabecera Authorization personalizada o pueda iniciar sesión con OAuth (active el inicio de sesión OAuth en Opciones). La URL es la misma en todas partes &mdash; solo cambia la pantalla de configuración del cliente. Clientes que sabemos que funcionan pero para los que aún no hemos escrito guías paso a paso: Continue.dev, Windsurf, el editor Zed, mcp-cli, MCP Inspector, LibreChat, Open WebUI (con el puente <code>mcpo</code>) y varios agentes basados en Ollama."

