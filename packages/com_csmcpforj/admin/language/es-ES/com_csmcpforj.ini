; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="¿Quién puede usar este endpoint?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="Los permisos se comprueban para la cuenta de usuario de Joomla a la que pertenece el token de API. El cliente MCP (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl o cualquier otro) solo hace de intermediario &mdash; el mismo token se comporta igual desde cualquier cliente."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Importante:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Quien genera el token obtiene a través del endpoint MCP el mismo acceso que tiene en cualquier otra parte de la administración de Joomla. Genere tokens solo para usuarios a los que confiaría esas acciones directamente."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Grupo de usuarios de Joomla"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="¿Funciona de entrada?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Por qué"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Sí"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Necesita permiso explícito"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Los Super Users siempre superan cualquier comprobación de permisos en Joomla."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Tiene core.manage por los permisos predeterminados de Joomla, que el control de MCP acepta para las herramientas de lectura y escritura (las herramientas que cambian permisos, extensiones, ajustes de plugins o el propio Joomla siguen necesitando un Super User) &mdash; pero el grupo sigue necesitando <strong>Acceso a servicios web</strong> antes de que Joomla le deje autenticarse siquiera."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="No tiene permiso MCP de forma predeterminada. Conceda al grupo <strong>Acceso a servicios web</strong> en Sistema &rarr; Configuración global &rarr; Permisos, y después Usar el endpoint MCP y (opcionalmente) Escribir a través del endpoint MCP en <strong>Opciones &rarr; Permisos</strong> de este componente."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Necesita Acceso a servicios web"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Antes de que nada de esto se aplique:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla protege toda la API con un permiso aparte llamado <strong>Acceso a servicios web</strong> (<code>core.login.api</code>), y <strong>de forma predeterminada solo lo tienen los Super Users</strong>. Cualquier otro grupo &mdash; incluidos Administrator y Manager &mdash; recibe <code>403 Forbidden</code> de todas las herramientas hasta que se lo conceda, haga lo que haga en la administración. Configúrelo en <strong>Sistema &rarr; Configuración global &rarr; Permisos</strong>, en el grupo, no en este componente."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / grupo personalizado"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Conceda al grupo <strong>Acceso a servicios web</strong> en Sistema &rarr; Configuración global &rarr; Permisos, y después Usar el endpoint MCP y (opcionalmente) Escribir a través del endpoint MCP en <strong>Opciones &rarr; Permisos</strong> de este componente."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Conectar un asistente de IA a este sitio"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Hay dos formas. La primera (copiar y pegar un prompt) es la más fácil &mdash; funciona sin configurar el cliente y, cuando su IA confirma que funciona, normalmente ofrece instalar este sitio como conector permanente sin editar JSON a mano. La segunda es para quien prefiera editar directamente la configuración de su cliente."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Copiar un prompt de configuración (recomendado)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Pegue un prompt de configuración en su asistente de IA"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="No hace falta configurar el cliente. Copie el prompt de abajo en una conversación nueva con su asistente de IA (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini, etc.). La IA hará una prueba con curl, confirmará la conexión y &mdash; en los clientes que lo admiten &mdash; le ofrecerá hacer la conexión permanente, sin editar archivos JSON ni recordar comandos de terminal."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Extra:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Si su cliente de IA tiene una herramienta de shell (Codex, Claude Code, Cursor Composer, Cline, Continue, el modo agente de GitHub Copilot, etc.), el prompt incluye una oferta de autoinstalación. Diga simplemente &lsquo;hazlo permanente&rsquo; cuando la IA confirme que la conexión funciona, y ejecutará el comando adecuado para el cliente para registrar el servidor MCP (por ejemplo, <code>codex mcp add</code> o <code>claude mcp add</code>). Tras reiniciar el cliente, este sitio aparece como herramientas MCP nativas en todas las conversaciones &mdash; nunca más hará falta un prompt."
; Shared "type here" field pattern - see FieldStyleHelper.
COM_CSMCPFORJ_FIELD_OPTIONAL="Opcional"
COM_CSMCPFORJ_FIELD_REQUIRED="Obligatorio"

COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Genere un API Token de Joomla en Mi perfil (enlace a la derecha)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Haga clic abajo en &lsquo;Copiar prompt&rsquo;."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Péguelo en una conversación nueva con su asistente de IA. Si se saltó el paso 2, sustituya antes <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> por su token real."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Envíelo. La IA probará la conexión y, en los clientes que lo admiten, le ofrecerá hacerla permanente."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Este prompt funciona en cualquier cliente de IA con herramienta de shell o terminal: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (modo agente), Gemini CLI, Windsurf, mcp-cli, etc. No funciona en chats solo web (claude.ai, chatgpt.com, gemini.google.com) sin acceso a shell &mdash; para esos, use la pestaña Conector MCP."

; Tab 2 — manual MCP connector configuration
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="Conector MCP (configuración manual)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="Añadir manualmente como conector MCP"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="Para Claude Desktop (archivo de configuración), Claude Code, Cursor, Codex, Cline, Copilot, Gemini CLI o cualquier cliente en el que prefiera editar la configuración directamente. Se configura una vez y queda para todas las conversaciones. (Los conectores personalizados de claude.ai y ChatGPT no pueden enviar una clave de API: se conectan iniciando sesión. Vea <strong>Conectar iniciando sesión (OAuth)</strong> en esta página.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="Genere un API Token de Joomla en Mi perfil."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="Copie el fragmento de configuración de abajo."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP3="Sustituya <code>YOUR_JOOMLA_API_TOKEN</code> por el token que ha generado."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Péguelo en la configuración MCP de su cliente de IA &mdash; Claude Desktop: <code>claude_desktop_config.json</code>; Claude Code: <code>claude mcp add</code>; Cursor: <code>~/.cursor/mcp.json</code>; GitHub Copilot: ajustes MCP en VS Code / JetBrains; Cline / Continue: ajustes JSON de la extensión. Reinicie el cliente después de guardar. (Los cuadros de diálogo &ldquo;Add custom connector&rdquo; de claude.ai y ChatGPT no tienen campo para esto; use allí el inicio de sesión OAuth.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_XHEADER_NOTE="Si su cliente no admite una cabecera Authorization, sustituya el bloque headers por:"

