COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_LABEL="Catálogo"
COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_DESC="Ajustes del explorador del catálogo de complementos MCP."
COM_CSMCPFORJ_CONFIG_CATALOG_URL_LABEL="URL del endpoint del catálogo"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_DESC="De dónde se obtiene el catálogo de complementos MCP. Deje el valor predeterminado salvo que tenga una réplica privada del catálogo; a una URL base sin más se le añade /catalog.json."
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="Duración de la caché del catálogo (horas)"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="Cuánto tiempo se guarda en caché el catalog.json obtenido antes de volver a descargarlo. El botón de actualizar de la página del catálogo se salta esto. Rango 1&ndash;168 (una semana)."
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="Mostrar complementos Pro no disponibles"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Muestra los complementos Pro en el catálogo aunque ahora no tenga una suscripción Pro. Útil para ver lo que hay; elija No para ocultarlos por completo."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Volver a comprobar la suscripción cada (segundos)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="Cada cuánto vuelve a preguntar el panel a cybersalt.com si el correo vinculado sigue teniendo acceso Pro. 86400 = una vez al día (recomendado). Mínimo 60, máximo 604800 = una vez a la semana."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="Servidor MCP"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Controles del lado del servidor para el endpoint MCP. Determinan lo que los clientes MCP ven y pueden llamar."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Modo de solo lectura"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="Con SÍ, el endpoint MCP anuncia y acepta solo las herramientas cuyas ToolAnnotations de MCP las declaran de solo lectura (list_*, get_*, read_*, check_*, validate_*, fetch_*, además de joomla_update_healthcheck). Útil si quiere que un cliente de IA explore el sitio sin poder cambiar contenido. Las escrituras devuelven un error que explica que el servidor está en modo de solo lectura. El ajuste es un mínimo: un cliente MCP también puede añadir ?read_only=1 a la URL del endpoint para limitarse más, pero NO puede desbloquear las escrituras en un sitio que tenga esto en SÍ."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Privacidad al grabar la pantalla"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Controles de la protección con desenfoque de los secretos del panel (el API Token de Joomla en la vista previa del prompt, el correo de la suscripción Pro). El desenfoque está activado de forma predeterminada; estas opciones ajustan el mostrar al pasar el ratón para que un movimiento casual no deje ver el secreto por accidente al compartir o grabar la pantalla."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Retardo para mostrar al pasar el ratón (segundos)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Cuántos segundos debe mantener el puntero sobre un secreto desenfocado para que se muestre. Mientras lo mantiene, aparece junto al secreto una pequeña cuenta atrás para que sepa que el temporizador corre. Si aparta el ratón, se cancela y el temporizador se reinicia &mdash; la próxima vez la cuenta atrás empieza de nuevo entera. Ponga 0 para mostrarlo al instante (quita la protección contra pasar el ratón sin querer, pero recupera el comportamiento clásico). Predeterminado: 3 segundos."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Ocultar automáticamente tras mostrar (segundos)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Cuántos segundos sigue visible un secreto mostrado al pasar el ratón antes de volver a desenfocarse solo &mdash; aunque el ratón siga encima. Una precaución extra para casos como &ldquo;miré, lo leí y me distraje&rdquo;, en los que un navegador desatendido dejaría el secreto a la vista indefinidamente. Al apartar el ratón siempre se desenfoca enseguida, sea cual sea este ajuste. Ponga 0 para desactivar el ocultado automático (los secretos mostrados siguen visibles hasta que aparte el ratón). Predeterminado: 8 segundos &mdash; suficiente para leer cómodamente un token base64 completo, y lo bastante corto para que una sesión desatendida no deje el secreto expuesto."

