COM_CSMCPFORJ_CHECK_CLOUDFLARE="Este sitio está detrás de Cloudflare. Si esa respuesta es una página de Cloudflare, añada una regla personalizada del WAF con la acción Skip para las direcciones MCP y de inicio de sesión, marcando Browser Integrity Check y Security Level (vea Solución de problemas más abajo)."
COM_CSMCPFORJ_CHECK_UNREACHABLE="El servidor web no ha podido llegar a su propia dirección pública (%s). Algunos alojamientos no lo permiten, así que esta comprobación no puede saberlo. Pruebe a conectarse desde la aplicación y revise los registros."

; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Cortafuegos y extensiones de URL"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall está activado."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="Puede bloquear las solicitudes MCP (&ldquo;403 Access Forbidden &mdash; Malware detected&rdquo;) y el inicio de sesión de claude.ai. En RSFirewall, añada dos excepciones: <code>csmcpforj_oauth</code> y <code>api\/index\.php\/v1\/mcp</code> como expresión regular."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools está activado."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="Su Web Application Firewall puede bloquear las solicitudes MCP y el inicio de sesión. Si <strong>Comprobar conexión</strong> muestra un bloqueo, busque la regla en el Blocked Requests Log de Admin Tools y añada una excepción del WAF, o desactive esa regla. Permita <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> y las URL que contengan <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck está activado."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="Su cortafuegos puede bloquear las solicitudes MCP y el inicio de sesión. Si <strong>Comprobar conexión</strong> muestra un bloqueo, busque la solicitud en sus registros y añada una excepción para <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> y las URL que contengan <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 está activado."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Esta extensión SEO puede capturar las direcciones de inicio de sesión (<code>index.php?csmcpforj_oauth=&hellip;</code>) y responder con la página de inicio, de modo que claude.ai o ChatGPT no pueden registrarse y no dan un motivo claro. Si <strong>Comprobar conexión</strong> muestra la página de inicio para los endpoints de inicio de sesión, excluya en Route 66 las URL que contengan <code>csmcpforj_oauth</code>, o desactive su plugin de sistema."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Los cortafuegos del alojamiento también pueden bloquear: o2switch TigerProtect responde 503, y las reglas de Imunify360, ModSecurity o Cloudflare responden 403. Pida a su alojamiento que permita las direcciones de arriba, o que deje pasar los servidores de Anthropic (<code>160.79.104.0/21</code>) para claude.ai. <strong>Cloudflare</strong>: Browser Integrity Check y Security Level pueden bloquear los servidores de las aplicaciones. Añada una regla personalizada del WAF (Security &rarr; WAF &rarr; Custom rules) con la acción <strong>Skip</strong> para las solicitudes cuya ruta URI contenga <code>/api/index.php/v1/mcp</code> o <code>/.well-known/oauth-</code>, o cuya cadena de consulta contenga <code>csmcpforj_oauth</code>, y marque <em>Browser Integrity Check</em> y <em>Security Level</em>. Bot Fight Mode no se puede saltar con una regla, así que desactívelo si bloquea."

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Lista de comprobación de claude.ai: &ldquo;cannot register&rdquo;, &ldquo;Authorization failed&rdquo; o &ldquo;Couldn't reach the MCP server&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Revíselos en este orden. Cada uno de ellos le ha costado horas a alguien."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Use exactamente esta dirección: <code>%s</code>. Con o sin <em>www</em> tiene que coincidir con cómo responde el sitio, <strong>sin redirección</strong> por medio (de www al dominio sin www, o de http a https). El botón <strong>Comprobar conexión</strong> del panel avisa de una redirección."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="El inicio de sesión OAuth está activado en este sitio. claude.ai solo puede conectarse iniciando sesión, así que tiene que seguir activado."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>El inicio de sesión OAuth está desactivado en este sitio.</strong> claude.ai solo puede conectarse iniciando sesión, así que antes un Super User tiene que activarlo: Componentes &rarr; MCP for J &rarr; Opciones &rarr; <strong>Inicio de sesión OAuth</strong>. Mientras esté desactivado, claude.ai dice que &ldquo;cannot register&rdquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="En el cuadro <strong>Add custom connector</strong>, elija <strong>Sign in now</strong>. Para el cliente OAuth funcionan tanto <strong>Use Claude's published identity</strong> como <strong>Register automatically</strong> (la identidad publicada necesita la extensión curl de PHP en el servidor). Deje vacíos el client ID y el secret. Si una forma falla, elimine el conector y vuelva a añadirlo con la otra."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>No añada cabeceras de solicitud.</strong> claude.ai no acepta una cabecera <code>X-Joomla-Token</code>, así que allí no se puede usar una clave de API. Iniciar sesión es la única forma de entrar desde claude.ai."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Los cortafuegos tienen que dejar pasar los servidores de claude.ai. Se conectan desde <code>160.79.104.0/21</code>, no desde su navegador. RSFirewall necesita dos excepciones: <code>csmcpforj_oauth</code> y <code>api\/index\.php\/v1\/mcp</code> como expresión regular. Admin Tools, Securitycheck y los cortafuegos del alojamiento como o2switch TigerProtect (que responde 503) también pueden bloquearlo. <strong>Cloudflare</strong>: Browser Integrity Check y Security Level pueden bloquear los servidores de las aplicaciones. Añada una regla personalizada del WAF (Security &rarr; WAF &rarr; Custom rules) con la acción <strong>Skip</strong> para las solicitudes cuya ruta URI contenga <code>/api/index.php/v1/mcp</code> o <code>/.well-known/oauth-</code>, o cuya cadena de consulta contenga <code>csmcpforj_oauth</code>, y marque <em>Browser Integrity Check</em> y <em>Security Level</em>. Bot Fight Mode no se puede saltar con una regla, así que desactívelo si bloquea. El botón <strong>Comprobar conexión</strong> del panel muestra qué responde."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> y otras extensiones SEO que reescriben URL pueden capturar las direcciones de inicio de sesión (<code>index.php?csmcpforj_oauth=&hellip;</code>) y responder con la página de inicio, de modo que la aplicación no puede registrarse y no da un motivo claro. Si <strong>Comprobar conexión</strong> muestra la página de inicio para los endpoints de inicio de sesión, excluya en esa extensión las URL que contengan <code>csmcpforj_oauth</code>, o desactive su plugin de sistema."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Inicie sesión con una cuenta que pueda usar MCP (vea <em>¿Quién puede usar este endpoint?</em> en el panel). Si solo falla para una persona, compruebe que su cuenta no está bloqueada y que no tiene marcado <em>Requiere de restablecer la contraseña</em>."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="¿Sigue atascado? Componentes &rarr; MCP for J &rarr; <strong>Registros</strong> muestra cada paso del inicio de sesión y por qué se rechazó un paso."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_JUMP="Ir a:"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_LOGIN="claude.ai, ChatGPT y otras aplicaciones que se conectan iniciando sesión"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_DESKTOP="Claude Desktop con un archivo de configuración"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_ERRORS="Mensajes de error, en cualquier aplicación"
