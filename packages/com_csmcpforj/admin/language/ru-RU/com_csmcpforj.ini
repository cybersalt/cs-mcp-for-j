COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_BODY="Брандмауэр блокирует запрос до того, как его увидит MCP for J. Нажмите <strong>Проверить подключение</strong> выше, чтобы увидеть, какой адрес заблокирован. В RSFirewall добавьте исключения для <code>csmcpforj_oauth</code> и <code>api\/index\.php\/v1\/mcp</code> (регулярное выражение). Брандмауэры хостинга (o2switch TigerProtect, Imunify360) должны разрешать те же адреса. <strong>Cloudflare</strong>: Browser Integrity Check и Security Level могут блокировать серверы приложений. Добавьте собственное правило WAF (Security &rarr; WAF &rarr; Custom rules) с действием <strong>Skip</strong> для запросов, путь URI которых содержит <code>/api/index.php/v1/mcp</code> или <code>/.well-known/oauth-</code>, либо строка запроса содержит <code>csmcpforj_oauth</code>, и отметьте <em>Browser Integrity Check</em> и <em>Security Level</em>. Bot Fight Mode нельзя обойти правилом, поэтому отключите его, если он блокирует."
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_CLAUDE_TITLE="claude.ai пишет &ldquo;cannot register&rdquo; или авторизация не удалась"

