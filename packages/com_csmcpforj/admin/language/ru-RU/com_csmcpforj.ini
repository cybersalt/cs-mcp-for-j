COM_CSMCPFORJ_SUPPORT_BANNER_PRO_HEADING="У вас активная подписка MCP for J Pro &mdash; спасибо!"
COM_CSMCPFORJ_SUPPORT_BANNER_PRO_BODY="Подписчики Pro получают приоритетную поддержку. Ваши обращения приходят к нам с меткой Pro, поэтому мы видим их первыми и отвечаем как можно быстрее. Спрашивайте о чём угодно &mdash; сообщения об ошибках, пожелания новых функций, вопросы, идеи &mdash; всё приветствуется."

COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_HEADING="Мы рады вашим сообщениям"
COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_BODY="Присылайте нам сообщения об ошибках, пожелания функций, вопросы и идеи &mdash; мы читаем каждое и ценим отзывы. Поддержка бесплатной версии оказывается по мере возможностей (ресурсы на бесплатную поддержку ограничены), поэтому ответ может занять время. Если вам нужны гарантированные сроки ответа или приоритетное внимание, рассмотрите %sподписку MCP for J Pro%s."

COM_CSMCPFORJ_SUPPORT_FORM_HEADING="Напишите нам"
COM_CSMCPFORJ_SUPPORT_FORM_INTRO="Ваше сообщение отправляется прямо на <code>support@cybersalt.com</code>. Сведения об окружении (URL вашего сайта, версия MCP for J, версии Joomla и PHP, установленные дополнения и статус подписки Pro) прикладываются автоматически, чтобы мы могли помочь быстрее, &mdash; полный список виден на боковой панели."

