COM_CSMCPFORJ_CHECK_UNEXPECTED="Ответил не MCP for J (HTTP %d): '%s'. Обычно причина в брандмауэре; см. «Устранение неполадок» ниже."
COM_CSMCPFORJ_CHECK_CLOUDFLARE="Этот сайт работает за Cloudflare. Если этот ответ &mdash; страница Cloudflare, добавьте собственное правило WAF с действием Skip для адресов MCP и входа, отметив Browser Integrity Check и Security Level (см. «Устранение неполадок» ниже)."
COM_CSMCPFORJ_CHECK_UNREACHABLE="Веб-сервер не смог достучаться до своего публичного адреса (%s). Некоторые хостинги этого не позволяют, поэтому проверка не может дать ответ. Попробуйте подключиться из приложения и посмотрите журналы."

; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Брандмауэр и расширения для URL"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall включён."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="Он может блокировать запросы MCP (&ldquo;403 Access Forbidden &mdash; Malware detected&rdquo;) и вход claude.ai. В RSFirewall добавьте два исключения: <code>csmcpforj_oauth</code> и <code>api\/index\.php\/v1\/mcp</code> как регулярное выражение."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools включён."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="Его Web Application Firewall может блокировать запросы MCP и вход. Если <strong>Проверить подключение</strong> показывает блокировку, найдите правило в Blocked Requests Log в Admin Tools и добавьте исключение WAF или отключите это правило. Разрешите <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> и URL, содержащие <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck включён."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="Его брандмауэр может блокировать запросы MCP и вход. Если <strong>Проверить подключение</strong> показывает блокировку, найдите запрос в его журналах и добавьте исключение для <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> и URL, содержащих <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 включён."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Это SEO-расширение может перехватывать адреса входа (<code>index.php?csmcpforj_oauth=&hellip;</code>) и отвечать главной страницей, из-за чего claude.ai или ChatGPT не может зарегистрироваться и не сообщает понятной причины. Если <strong>Проверить подключение</strong> показывает главную страницу для точек входа, исключите в Route 66 URL с <code>csmcpforj_oauth</code> или отключите его системный плагин."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Блокировать могут и брандмауэры хостинга: o2switch TigerProtect отвечает 503, а правила Imunify360, ModSecurity или Cloudflare отвечают 403. Попросите хостинг разрешить указанные выше адреса или пропускать серверы Anthropic (<code>160.79.104.0/21</code>) для claude.ai. <strong>Cloudflare</strong>: Browser Integrity Check и Security Level могут блокировать серверы приложений. Добавьте собственное правило WAF (Security &rarr; WAF &rarr; Custom rules) с действием <strong>Skip</strong> для запросов, путь URI которых содержит <code>/api/index.php/v1/mcp</code> или <code>/.well-known/oauth-</code>, либо строка запроса содержит <code>csmcpforj_oauth</code>, и отметьте <em>Browser Integrity Check</em> и <em>Security Level</em>. Bot Fight Mode нельзя обойти правилом, поэтому отключите его, если он блокирует."

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Контрольный список для claude.ai: &ldquo;cannot register&rdquo;, &ldquo;Authorization failed&rdquo; или &ldquo;Couldn't reach the MCP server&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Проверьте всё по порядку. Каждый из этих пунктов уже стоил кому-то нескольких часов."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Используйте точно этот адрес: <code>%s</code>. С <em>www</em> или без &mdash; должно совпадать с тем, как отвечает сайт, <strong>без перенаправлений</strong> между ними (с www на домен без www или с http на https). Кнопка <strong>Проверить подключение</strong> на панели управления сообщает о перенаправлении."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="Вход через OAuth на этом сайте включён. claude.ai может подключаться только через вход, поэтому он должен оставаться включённым."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>Вход через OAuth на этом сайте выключен.</strong> claude.ai может подключаться только через вход, поэтому Super User должен сначала его включить: Компоненты &rarr; MCP for J &rarr; Параметры &rarr; <strong>Вход через OAuth</strong>. Пока он выключен, claude.ai пишет &ldquo;cannot register&rdquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="В окне <strong>Add custom connector</strong> выберите <strong>Sign in now</strong>. Для клиента OAuth подходят оба варианта, <strong>Use Claude's published identity</strong> и <strong>Register automatically</strong> (для опубликованной идентификации на сервере нужно расширение PHP curl). Оставьте client ID и secret пустыми. Если один способ не сработал, удалите коннектор и добавьте его снова другим способом."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>Не добавляйте заголовки запроса.</strong> claude.ai не принимает заголовок <code>X-Joomla-Token</code>, поэтому ключ API там использовать нельзя. Вход &mdash; единственный способ подключиться из claude.ai."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Брандмауэры должны пропускать серверы claude.ai. Они подключаются с <code>160.79.104.0/21</code>, а не из вашего браузера. RSFirewall нужны два исключения: <code>csmcpforj_oauth</code> и <code>api\/index\.php\/v1\/mcp</code> как регулярное выражение. Admin Tools, Securitycheck и брандмауэры хостинга вроде o2switch TigerProtect (который отвечает 503) тоже могут блокировать. <strong>Cloudflare</strong>: Browser Integrity Check и Security Level могут блокировать серверы приложений. Добавьте собственное правило WAF (Security &rarr; WAF &rarr; Custom rules) с действием <strong>Skip</strong> для запросов, путь URI которых содержит <code>/api/index.php/v1/mcp</code> или <code>/.well-known/oauth-</code>, либо строка запроса содержит <code>csmcpforj_oauth</code>, и отметьте <em>Browser Integrity Check</em> и <em>Security Level</em>. Bot Fight Mode нельзя обойти правилом, поэтому отключите его, если он блокирует. Кнопка <strong>Проверить подключение</strong> на панели управления показывает, что отвечает."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> и другие SEO-расширения, переписывающие URL, могут перехватывать адреса входа (<code>index.php?csmcpforj_oauth=&hellip;</code>) и отвечать главной страницей, из-за чего приложение не может зарегистрироваться и не сообщает понятной причины. Если <strong>Проверить подключение</strong> показывает главную страницу для точек входа, исключите в этом расширении URL с <code>csmcpforj_oauth</code> или отключите его системный плагин."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Входите под учётной записью, которой разрешено использовать MCP (см. <em>Кто может использовать эту точку подключения?</em> на панели управления). Если не получается только у одного человека, проверьте, не заблокирована ли его учётная запись и не включено ли для неё <em>Требовать изменение пароля</em>."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="Всё ещё не получается? Компоненты &rarr; MCP for J &rarr; <strong>Журналы</strong> показывает каждый шаг входа и причину, по которой шаг был отклонён."
