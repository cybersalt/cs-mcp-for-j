COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="Вход через OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Позволяет ИИ-приложениям подключаться, отправляя вас на страницу входа этого сайта, вместо того чтобы вы копировали в них ключ API. ChatGPT (&ldquo;Add custom MCP server&rdquo;) и claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) могут подключаться только так. Подключения с ключом API продолжают работать в любом случае."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="Включить вход через OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Когда включено, вы вставляете адрес MCP этого сайта в ИИ-приложение, приложение открывает страницу входа этого сайта, вы входите со своим обычным логином и паролем и нажимаете «Разрешить». После этого приложение действует от вашего имени, ровно с вашими правами на этом сайте. Подключённые приложения перечислены на панели управления, где каждое можно отключить. Выключение этого параметра сразу отключает их все."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Срок действия токена доступа (секунды)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Сколько действует каждый токен доступа, прежде чем приложение незаметно его обновит. По умолчанию 3600 (один час). От 300 до 86400."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Не выходить в течение (дни)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Как долго приложение может продолжать обновление без повторного входа пользователя. Каждое обновление сбрасывает отсчёт. По умолчанию 30."
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="Подключение ИИ-приложений через вход"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="Некоторые ИИ-приложения, включая ChatGPT и claude.ai, могут подключиться к сайту, только отправив вас на страницу входа этого сайта. На этом сайте это выключено, поэтому такие приложения пока не могут подключиться. Включите <strong>Вход через OAuth</strong> в параметрах, чтобы разрешить это. Подключения с ключом API продолжают работать в любом случае."
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="Открыть параметры, чтобы включить"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="Ключ API не нужен. Копировать нужно только <strong>URL точки подключения</strong> этого сайта."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="Проверяем, находят ли ИИ-приложения страницу входа этого сайта&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>Готово.</strong> ИИ-приложения находят страницу входа этого сайта."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>Не готово.</strong> ИИ-приложения не находят страницу входа этого сайта, поэтому не смогут подключиться. Чтобы исправить, включите <strong>Перенаправлять URL</strong> в разделе Система &rarr; Общие настройки и убедитесь, что на сайте есть файл .htaccess. Подробности &mdash; в разделе «Устранение неполадок» руководства по настройке."
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_HEADING="Подключённые приложения"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_NONE="Пока не подключено ни одного ИИ-приложения. Приложение появится здесь после того, как кто-то войдёт и нажмёт «Разрешить»."
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_APP="Приложение"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_USER="Вход выполнен как"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_CONNECTED="Подключено"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_LAST_USED="Последнее использование"
COM_CSMCPFORJ_DASHBOARD_OAUTH_REVOKE="Отключить"
COM_CSMCPFORJ_OAUTH_REVOKED="Приложение отключено. Оно теряет доступ при следующем же запросе, и для повторного подключения его нужно будет разрешить снова."
COM_CSMCPFORJ_OAUTH_REVOKE_NOTHING="У этого приложения не было активного доступа, который можно отключить."
COM_CSMCPFORJ_ACTIONLOG_OAUTH_CONSENT="Пользователь <a href=&quot;{accountlink}&quot;>{username}</a> подключил приложение &ldquo;{title}&rdquo; к MCP for J (OAuth)"
COM_CSMCPFORJ_ACTIONLOG_OAUTH_REVOKE="Пользователь <a href=&quot;{accountlink}&quot;>{username}</a> отключил приложение &ldquo;{title}&rdquo; от MCP for J (OAuth)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="Подключение через вход (проще всего)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Копировать ключ API не нужно. В своём ИИ-приложении добавьте коннектор и вставьте <strong>URL точки подключения</strong> этого сайта (ниже). Когда вы нажмёте Connect, приложение само откроет страницу входа этого сайта: войдите со своим логином и паролем для этого сайта, затем нажмите <strong>Разрешить</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai и Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Дайте имя, вставьте URL точки подключения и нажмите Continue. Оставьте <em>Sign in now</em>; для клиента OAuth подходят оба варианта, <em>Use Claude's published identity</em> и <em>Register automatically</em>. Не добавляйте заголовки запроса. Нажмите Add, затем <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> <strong>Plugins</strong> на левой боковой панели &rarr; <strong>Add</strong> (справа вверху) &rarr; <strong>Add custom MCP server</strong>. Дайте имя, вставьте URL точки подключения, оставьте Authentication на <strong>OAuth</strong>, отметьте флажок, нажмите <strong>Create as a plugin</strong>, затем <strong>Connect</strong>. Нужен платный тариф ChatGPT (Plus подходит)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>, затем введите <code>/mcp</code>, выберите сервер и выберите <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> палитра команд &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; вставьте URL точки подключения. VS Code попросит вас войти."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> добавьте <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> в <code>mcpServers</code> в <code>mcp.json</code> (без заголовков), затем нажмите <strong>Login</strong> рядом с сервером в Settings &rarr; MCP."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> добавьте для сервера <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> в <code>settings.json</code>, затем выполните <code>/mcp auth &lt;name&gt;</code>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Codex сам откроет страницу входа (если нет, выполните <code>codex mcp login joomla</code>). Нажмите «Разрешить» в течение нескольких минут, в браузере на том же компьютере, где Codex. Если потом браузер сообщит, что 127.0.0.1 отказал в подключении, выполните <code>codex mcp login joomla --no-browser</code> и вставьте адрес той страницы в терминал, или продолжайте пользоваться способом с ключом API ниже."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, вставьте URL точки подключения, затем нажмите <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="Когда вы нажимаете «Разрешить», приложение действует от имени учётной записи, под которой вы вошли, и может делать ровно то, что эта учётная запись может на сайте, включая изменения, если ей это разрешено. Группам Administrator и Manager сначала нужно право <em>Вход в веб-службы</em> (см. «Права доступа» на панели управления). Каждое подключённое приложение перечислено на панели управления, где его можно сразу отключить."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="Предпочитаете ключ API или ваш клиент не может открыть браузер? Способ с ключом API в разделе <strong>Расширенная настройка</strong> ниже по-прежнему работает для любого клиента."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT (&ldquo;Add custom MCP server&rdquo;) и claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) могут подключаться, только отправив вас на страницу входа этого сайта. На этом сайте это выключено. Когда это включено, подключение выглядит так: вставьте адрес этого сайта в приложение, войдите, нажмите «Разрешить»."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="Включить в параметрах"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Попросите Super User включить <strong>Вход через OAuth</strong> в параметрах MCP for J. До тех пор пользуйтесь способом с ключом API ниже."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="Проще всего: окно &ldquo;Add custom connector&rdquo; в Claude работает на этом сайте."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="Вход на этом сайте включён, поэтому в Claude Desktop или claude.ai откройте <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, вставьте адрес MCP этого сайта, нажмите Continue, оставьте найденные настройки входа, нажмите Add, затем Connect, войдите со своим логином и паролем для этого сайта и нажмите «Разрешить». Способ с файлом конфигурации ниже нужен, только если вы предпочитаете ключ API."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai подключается постоянно через <strong>Add custom connector</strong>: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, вставьте адрес MCP этого сайта, нажмите Continue, оставьте найденные настройки входа, нажмите Add, затем Connect. Войдите со своим логином и паролем для этого сайта и нажмите «Разрешить». Подключение останется доступным в каждом чате."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="В ChatGPT нажмите <strong>Plugins</strong> на левой боковой панели, затем <strong>Add</strong> (справа вверху) &rarr; <strong>Add custom MCP server</strong>. Дайте имя (например, &ldquo;Мой сайт Joomla&rdquo;), вставьте адрес MCP этого сайта, оставьте Authentication на <strong>OAuth</strong>, отметьте &ldquo;I understand and want to continue&rdquo; и нажмите <strong>Create as a plugin</strong>. Нажмите <strong>Connect</strong>, и ChatGPT откроет страницу входа этого сайта: войдите со своим логином и паролем для этого сайта и нажмите «Разрешить». Затем в чате введите <strong>@</strong> и выберите плагин. Вставлять ключ API не нужно."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="Окно &ldquo;Add custom connector&rdquo; подключается, но вход не удаётся"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Проверьте по порядку: (1) может ли учётная запись, под которой вы вошли, использовать MCP &mdash; группе Administrator нужно право <em>Вход в веб-службы</em>, а группе Manager &mdash; оно же плюс <em>Использовать точку подключения MCP</em> в разделе Параметры &rarr; Права доступа (см. карточку <em>Кто может использовать эту точку подключения?</em> на панели управления); если нет, страница входа скажет об этом; (2) показывает ли карточка &ldquo;Подключение ИИ-приложений через вход&rdquo; на панели управления <strong>Готово</strong>; (3) пропускает ли ваш брандмауэр к сайту серверы приложения (см. следующий пункт). Не вводите client ID и secret: приложение регистрируется само. (4) Нажимайте «Разрешить» вскоре после открытия страницы входа: приложения через некоторое время прекращают попытку входа (Codex &mdash; примерно через 5 минут), и запоздалое «Разрешить» заканчивается ошибкой. Запустите Connect заново, и всё получится."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai или ChatGPT не может достучаться до сайта или вход обрывается на середине"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai и ChatGPT подключаются со своих серверов, а не из вашего браузера, поэтому сайт должен быть доступен по публичному HTTPS. Брандмауэр веб-приложений (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 или брандмауэр хостинга, например TigerProtect у o2switch, который отвечает 503) может блокировать эти запросы. Разрешите запросы к <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> и <code>index.php?csmcpforj_oauth=&hellip;</code> (точки регистрации, токенов и отзыва). В RSFirewall достаточно двух исключений: <code>csmcpforj_oauth</code> и <code>api\/index\.php\/v1\/mcp</code> как регулярное выражение. claude.ai подключается с <code>160.79.104.0/21</code>. <strong>Cloudflare</strong>: Browser Integrity Check и Security Level могут блокировать серверы приложений. Добавьте собственное правило WAF (Security &rarr; WAF &rarr; Custom rules) с действием <strong>Skip</strong> для запросов, путь URI которых содержит <code>/api/index.php/v1/mcp</code> или <code>/.well-known/oauth-</code>, либо строка запроса содержит <code>csmcpforj_oauth</code>, и отметьте <em>Browser Integrity Check</em> и <em>Security Level</em>. Bot Fight Mode нельзя обойти правилом, поэтому отключите его, если он блокирует. <strong>Route 66</strong> и другие SEO-расширения, переписывающие URL, могут перехватывать адреса входа (<code>index.php?csmcpforj_oauth=&hellip;</code>) и отвечать главной страницей, из-за чего приложение не может зарегистрироваться и не сообщает понятной причины. Если <strong>Проверить подключение</strong> показывает главную страницу для точек входа, исключите в этом расширении URL с <code>csmcpforj_oauth</code> или отключите его системный плагин. Сама страница входа открывается в вашем собственном браузере."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="Панель управления сообщает, что ИИ-приложения не находят страницу входа этого сайта (Не готово)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="ИИ-клиенты ищут данные для входа по адресу <code>/.well-known/oauth-authorization-server</code> на вашем домене. Joomla отвечает там, только если в разделе Общие настройки &rarr; <strong>Перенаправлять URL</strong> включено и на сайте есть файл <code>.htaccess</code> (переименуйте <code>htaccess.txt</code>), либо если nginx передаёт неизвестные пути на <code>index.php</code>. Это не влияет на AutoSSL в cPanel, который использует <code>/.well-known/acme-challenge/</code>. Сайту, установленному в подпапку (например, <code>example.com/joomla</code>), нужно ещё правило в корне домена, которое направляет <code>/.well-known/oauth-authorization-server/joomla</code> в эту подпапку."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Вход с сервера или с компьютера без браузера"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Настольные клиенты (Claude Code, Codex, Cursor, Gemini CLI) открывают браузер на том же компьютере и ждут ответа на локальном адресе, поэтому для входа через OAuth там нужен браузер. На сервере без экрана или по SSH используйте вместо этого способ с ключом API из раздела «Расширенная настройка»; он работает везде."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="В ИИ-приложении добавьте новый коннектор (claude.ai и Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector; ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server) и вставьте этот <strong>URL точки подключения</strong>: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Нажмите Connect.</strong> Приложение само откроет страницу входа этого сайта. Войдите со своим логином и паролем для этого сайта."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Нажмите «Разрешить».</strong> Вы вернётесь в приложение, уже подключённое. Приложение может делать всё, что разрешено вашей учётной записи на этом сайте."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Подключите ИИ-приложение к этому сайту"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Есть три способа. Нажмите на любой, чтобы открыть пронумерованные шаги. Большинству нужен первый."
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. Через вход (проще всего) &mdash; ChatGPT, claude.ai, Claude Desktop и большинство других ИИ-приложений"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Вставить промпт для настройки &mdash; для ИИ-чата, который умеет выполнять команды"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. Файл конфигурации или командная строка &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI и другие"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Работает в ИИ-приложениях, которые умеют выполнять команды (Codex, Claude Code, Cursor, Cline, режим агента Copilot и подобные). ИИ сам проверяет подключение и может предложить сделать его постоянным."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="Для приложений, которые настраиваются файлом настроек или командой. Делается один раз, и подключение сохраняется."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>Получите токен API.</strong> Нажмите кнопку: ваш профиль пользователя откроется в новой вкладке. Откройте там вкладку <strong>Токен API</strong>, нажмите на значок глаза, чтобы показать токен, и скопируйте его. Затем вернитесь на эту вкладку."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="Получить мой токен API (откроется новая вкладка)"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>Скопируйте промпт.</strong> Ваш токен уже в нём."
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="<strong>Вставьте его в новый разговор</strong> с ИИ-приложением и отправьте. ИИ проверит подключение и, если сможет, предложит сделать его постоянным."
COM_CSMCPFORJ_DASHBOARD_WAY3_STEP_COPY="<strong>Скопируйте конфигурацию.</strong> Ваш токен уже в ней."
COM_CSMCPFORJ_DASHBOARD_WAY3_GUIDE_LINK="Пошаговые инструкции для каждого приложения &mdash; в руководстве по настройке &rarr;"
COM_CSMCPFORJ_DASHBOARD_COPY_URL_BUTTON="Скопировать"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1_COPY="<strong>Скопируйте URL точки подключения.</strong>"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2_ADD="<strong>Добавьте URL точки подключения в ИИ-приложение как коннектор.</strong> Где это делается, зависит от приложения:"
