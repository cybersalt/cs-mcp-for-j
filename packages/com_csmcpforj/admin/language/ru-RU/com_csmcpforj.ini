COM_CSMCPFORJ_DASHBOARD_QUICKSTART_HEADING="Быстрый старт"
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP1_TITLE="1. Создайте токен API"
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP1_BODY="Войдите под пользователем, от имени которого должен действовать MCP-клиент. Откройте «Мой профиль», перейдите на вкладку «Токен API» и нажмите на значок глаза, чтобы его показать."
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP2_TITLE="2. Проверьте права"
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP2_BODY="Super User работают сразу. Любой другой группе, включая Administrator и Manager, сначала нужно право <strong>Вход в веб-службы</strong> в разделе Система &rarr; Общие настройки &rarr; Права доступа. Группам Manager и другим также нужны права «Использовать» / «Запись» в разделе Параметры &rarr; Права доступа этого компонента."
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP3_TITLE="3. Вставьте в клиент"
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP3_BODY="Скопируйте фрагмент конфигурации, вставьте его в свой MCP-клиент и перезапустите клиент. Выполните tools/list, чтобы проверить подключение."

