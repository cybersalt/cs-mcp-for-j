COM_CSMCPFORJ_CHECK_OK_ENDPOINT="Доступна. Она просит приложения войти или отправить токен, как и должна."
COM_CSMCPFORJ_CHECK_OK_DISCOVERY="Доступно. Приложения могут узнать, как войти."
COM_CSMCPFORJ_CHECK_OK_OAUTH="Доступно. Приложения могут здесь войти."
