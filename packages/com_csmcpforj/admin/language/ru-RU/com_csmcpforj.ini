COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="Руководство по настройке"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="Руководство по настройке"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for J — Руководство по настройке"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Подключите ИИ к этому сайту Joomla"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for J создан, чтобы было легко подключить к вашему сайту Joomla ИИ-ассистента вроде Codex, Claude, ChatGPT или Cursor &mdash; чтобы ИИ мог читать ваши материалы, управлять пользователями, публиковать содержимое и многое другое, прямо в обычном чате ИИ. Технических знаний не нужно. Простой способ ниже подходит большинству; дополнительные варианты &mdash; ниже на странице, если они вам понадобятся."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ Простой способ"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Без файлов конфигурации. Без заголовков. Без жаргона. Просто скопируйте готовый промпт для настройки с панели управления и вставьте его в новый чат с ИИ. Остальное ИИ сделает сам &mdash; проверит подключение и, в клиентах, которые это поддерживают, предложит сохранить его навсегда."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Получите ключ API</strong> (личный пароль, который позволяет вашему ИИ действовать на этом сайте). Если ключа ещё нет, инструкция ниже."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Перейдите на панель управления</strong> (кнопка ниже) и вставьте там свой ключ API в поле."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Нажмите кнопку &ldquo;Скопировать промпт&rdquo;</strong> на панели управления. Ваш ключ автоматически подставляется в промпт перед копированием."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Вставьте его в новый чат</strong> с ИИ (Claude, ChatGPT, Cursor, Copilot, Gemini и т. д.) и отправьте. ИИ подтвердит, что подключение работает, и предложит его сохранить."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="На панель управления"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="Вот и всё. Ваш ИИ подключён. Если хотите узнать больше о том, как всё устроено, или предпочитаете настроить ИИ вручную, читайте дальше &mdash; но это необязательно."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Получите ключ API"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="<strong>Ключ API</strong> &mdash; это личный пароль, который позволяет вашему ИИ действовать на этом сайте Joomla от ВАШЕГО имени. Любой, у кого есть ключ, может делать всё, что может ваша учётная запись Joomla, &mdash; поэтому храните его в тайне. Вот как его создать:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sНажмите здесь, чтобы открыть свой профиль пользователя Joomla%s. Он откроется в новой вкладке. Найдите там вкладку <strong>Токен API</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="На этой вкладке нажмите кнопку <strong>Сбросить</strong>. Joomla создаст длинную строку из букв и цифр и поместит её в поле под кнопкой. Это и есть ваш ключ."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Нажмите на маленький <strong>значок глаза</strong> рядом с полем, чтобы показать ключ, затем скопируйте всю строку."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Вставьте его в поле ниже на этой странице (он сохраняется только в вашем браузере, чтобы кнопки копирования на этой странице подставляли его сами) ИЛИ вставьте его прямо в поле ключа API на панели управления, если идёте туда за простой настройкой."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Обращайтесь с этим ключом как с паролем."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Не вставляйте его в общие документы, снимки экрана или код, который будете публиковать. Если он когда-нибудь утечёт, вернитесь на вкладку «Токен API» и снова нажмите «Сбросить» &mdash; старый ключ сразу перестанет действовать."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Вставьте сюда ключ API (для копирования в один клик на этой странице)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Ваш ключ запоминается только в этом браузере</strong> &mdash; он никогда не покидает ваш компьютер. Кнопка с корзиной удаляет его. Если оставить поле пустым, кнопки копирования на этой странице всё равно будут работать, но ключ придётся вставлять в скопированный фрагмент вручную."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Показать/скрыть ключ"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Забыть сохранённый ключ"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Дополнительно: подключить ИИ вручную (большинству это не нужно)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Этот раздел для тех, кто хочет вручную настроить подключение ИИ-клиента к этому сайту &mdash; обычно редактированием небольшого текстового файла, &ldquo;файла конфигурации&rdquo;. Если простая настройка выше сработала, весь этот раздел можно пропустить. Если вы хотите обойтись без промпта и зарегистрировать подключение прямо в ИИ-клиенте, читайте дальше."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="URL подключения этого сайта"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="Это адрес, который нужен вашему ИИ-клиенту. Вы вставите его в настройки клиента вместе с ключом API."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Выберите свой ИИ-клиент"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="URL подключения и ключ API одинаковы для любого ИИ &mdash; отличается только <em>место, куда их вставлять</em>, в каждом клиенте. Выберите свой клиент ниже, чтобы увидеть конкретные инструкции."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, расширение IDE или настольное приложение)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex поддерживает эту точку подключения напрямую как сервер MCP Streamable HTTP. Сначала сохраните ключ API Joomla в отдельной переменной окружения для этого сайта, затем зарегистрируйте точку подключения по имени этой переменной. Ключ никогда не записывается в <code>config.toml</code>. Если вы нажмёте кнопку копирования после того, как вставили ключ выше, скопированная команда будет содержать этот ключ, поэтому не показывайте её в общих терминалах, записях и обращениях в поддержку."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; сохранить ключ для будущих процессов Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Откройте новый терминал после того, как задали постоянную переменную окружения Windows. Уже запущенные процессы Codex и терминала её не видят."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; задать ключ для этого терминала (при необходимости сохраните его в своём защищённом окружении оболочки)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Зарегистрируйте этот сайт Joomla в Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Выполните <code>codex mcp list</code>, перезапустите Codex (или посмотрите статус MCP в его интерфейсе), затем вызовите безобидный инструмент только для чтения <code>get_joomla_version</code>. Так проверяются инициализация, аутентификация, поиск инструментов и их вызов. Для подключения только для чтения дополнительно включите серверный режим только для чтения в MCP for J; настройки подтверждения в клиенте не могут обойти права сервера."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Недействительный токен на cPanel или PHP-FPM?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Возможно, веб-сервер удаляет стандартный заголовок Authorization. Замените созданную выше запись в <code>~/.codex/config.toml</code> этим блоком, чтобы Codex читал ту же переменную окружения и отправлял её как <code>X-Joomla-Token</code>, затем перезапустите Codex."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Внимание &mdash; окну &ldquo;Add custom connector&rdquo; в Claude нужен OAuth, а он на этом сайте выключен."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Встроенное окно &ldquo;Add custom connector&rdquo; в Claude Desktop и claude.ai подключается через вход (OAuth), и в нём нет поля для ключа API. Super User может включить вход через OAuth в параметрах MCP for J; после этого окно заработает. До тех пор инструкции для Claude Desktop ниже используют правку файла конфигурации. (Или воспользуйтесь простой настройкой выше &mdash; она работает и с Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Четыре шага: создайте небольшой вспомогательный файл &mdash; &ldquo;скрипт-обёртку&rdquo; с командой подключения, укажите на него в файле конфигурации Claude Desktop и перезапустите Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Зачем скрипт-обёртка, а не подключение прямо в конфигурации Claude Desktop? Claude Desktop 1.30096+ (авг. 2026) отклоняет записи конфигурации, аргументы команды которых похожи на учётные данные, &mdash; полезная мера безопасности, которая, к сожалению, блокирует прямой способ. Если перенести команду в небольшой вспомогательный файл, проблема исчезает (Claude Desktop видит простую команду без видимых аргументов), а ключ API остаётся ровно так же защищён, как раньше, &mdash; вспомогательный файл лежит в вашей папке пользователя рядом с конфигурацией самого Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Одноразовое требование &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Эти инструкции предполагают, что на компьютере установлен Node.js (в нём есть команда <code>npx</code>). В большинстве сред разработки он уже есть; если нет, установите его с <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> с помощью установщика LTS. Файл-обёртка ниже ожидает Node.js по стандартному пути установки Windows <code>C:\Program Files\nodejs\</code>. Если вы установили его в другое место, исправьте этот путь в файле-обёртке после копирования."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Шаг 1 &mdash; создайте скрипт-обёртку"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Пока только для Windows (пользователям Mac/Linux &mdash; см. FAQ). Скопируйте блок ниже в новый текстовый файл. Сохраните его в папке пользователя (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) под именем <code>claude-mcp-joomla-{sitename}.cmd</code>, заменив <code>{sitename}</code> коротким названием сайта (например, <code>cybersaltorg</code>). Убедитесь, что <code>.cmd</code> &mdash; это действительно расширение, а не часть имени: в Блокноте выберите &ldquo;Тип файла: Все файлы&rdquo;, чтобы он не добавил <code>.txt</code>. Если вы вставили ключ API в поле вверху этой страницы, кнопка копирования подставит его за вас."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Не знаете своё имя пользователя Windows? Откройте Проводник, перейдите в <code>C:\Users\</code> и посмотрите на названия папок &mdash; одна из них ваша."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Шаг 2 &mdash; откройте файл конфигурации Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Файл настроек Claude Desktop лежит по фиксированному пути для каждой операционной системы. Откройте его любым текстовым редактором (VS Code, Блокнот, TextEdit, Sublime &mdash; какой есть):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="В Claude Desktop есть кнопка Settings &rarr; Developer &rarr; <strong>Edit Config</strong>, которая должна открыть файл за вас. Если при нажатии ничего не происходит, значит, компьютер не знает, какой программой открывать файлы <code>.json</code>. Ничего страшного &mdash; просто откройте файл сами текстовым редактором по одному из путей выше. Если файла ещё нет, создайте его и используйте блок ниже как всё его содержимое (обёрнутый в <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Шаг 3 &mdash; добавьте этот блок в конфигурацию Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Вставьте это в <code>claude_desktop_config.json</code>. Если в файле уже есть объект <code>mcpServers</code> с другими серверами, добавьте запись <code>joomla-...</code> рядом с ними (не вставляйте второй объект <code>mcpServers</code>). Если файл пустой или его нет, используйте весь блок ниже как его содержимое. <strong>Важно:</strong> замените <code>YOUR_WINDOWS_USERNAME</code> своим настоящим именем пользователя Windows."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Эта конфигурация лишь указывает Claude Desktop на скрипт-обёртку, созданный на шаге 1. Ваш ключ API остаётся в файле-обёртке, а не в конфигурации Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Шаг 4 &mdash; полностью закройте Claude Desktop и откройте снова"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop читает файл конфигурации только при запуске. Закройте его полностью &mdash; в Windows щёлкните правой кнопкой по значку Claude в области уведомлений (внизу справа; возможно, сначала нужно нажать маленькую стрелку вверх) и выберите Quit. Подождите пару секунд и запустите снова. В любом разговоре нажмите значок инструментов (или спросите &ldquo;какие у тебя есть инструменты?&rdquo;) &mdash; там должны быть инструменты сайта. Если их нет, см. «Устранение неполадок» ниже."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (терминал или VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Если вы пользуетесь Claude Code, подключение создаётся одной командой терминала &mdash; без правки файлов конфигурации. Вставьте ключ API в поле выше, чтобы кнопка копирования ниже его подставила, затем вставьте команду в терминал и нажмите Enter. Claude Code сразу подтвердит подключение и перезагрузится."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (веб-версия)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="Окно <strong>Add custom connector</strong> в claude.ai подключается через вход (OAuth), а на этом сайте он выключен. Super User может включить его в параметрах MCP for J, и тогда claude.ai получит постоянное подключение. До тех пор простая настройка выше (вставка промпта) работает только для текущего чата."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor хранит подключения MCP в файле конфигурации <code>mcp.json</code>. Откройте его в текстовом редакторе, вставьте блок ниже в объект <code>mcpServers</code> и сохраните. Обычно Cursor применяет изменение без перезапуска."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Расположение файла конфигурации: <code>~/.cursor/mcp.json</code> (для всех ваших проектов) или <code>.cursor/mcp.json</code> в папке конкретного проекта (только для этого проекта)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Пользовательские серверы MCP в ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="Окно <strong>Add custom MCP server</strong> в ChatGPT может подключаться только через вход (OAuth) или без аутентификации; в нём нет поля для ключа API или заголовка. Вход через OAuth на этом сайте выключен, поэтому ChatGPT пока подключиться не может. Super User может включить его в параметрах MCP for J. До тех пор используйте Codex (агент OpenAI для программирования), который отправляет ключ API из переменной окружения."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Чтобы добавить пользовательский сервер MCP, нужен платный тариф ChatGPT. На Plus работает (проверено в октябре 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI и Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="И Gemini CLI (терминальный ИИ-ассистент Google), и расширение Gemini Code Assist (для VS Code / JetBrains) читают один и тот же файл конфигурации MCP. Два шага: отредактируйте этот файл, добавив этот сайт Joomla как сервер MCP, затем перезапустите Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Сервер можно добавить глобально (его увидит любой сеанс Gemini) или только в одной папке проекта. Фрагмент одинаковый &mdash; меняется только расположение файла."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Откройте (или создайте) файл настроек Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Выберите одно из двух мест:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Глобально (все проекты):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Только проект:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (в папке проекта)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Вставьте этот блок в файл."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Если в файле уже есть раздел <code>mcpServers</code>, добавьте запись <code>&quot;joomla-...&quot;</code> внутрь существующего &mdash; не дублируйте внешний ключ <code>mcpServers</code>. Если файл пустой или совсем новый, вставьте весь фрагмент как есть."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini использует <code>httpUrl</code> для серверов MCP по HTTP (как этот) &mdash; в отличие от ключа <code>url</code> в Cursor. Скопируйте именно этот фрагмент, а не берите тот, что для Cursor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Перезапустите Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Закройте и снова запустите <code>gemini</code> в терминале или перезагрузите окно VS Code / JetBrains. Введите <code>/mcp</code> в Gemini CLI, чтобы увидеть подключённые серверы и убедиться, что ваш сайт Joomla есть в списке."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="Веб-приложение <code>gemini.google.com</code> на август 2026 не поддерживает пользовательские серверы MCP &mdash; это руководство охватывает только Gemini CLI и Gemini Code Assist. Если Google добавит такую поддержку в веб-интерфейс, мы опишем её здесь."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Другие ИИ-клиенты с поддержкой MCP (Cline, Continue, GitHub Copilot в режиме агента, Windsurf, mcp-cli и т. д.) тоже работают &mdash; URL подключения и ключ API одинаковые, отличается только место, куда их вставлять. Со временем мы добавим инструкции для других клиентов; если застряли, в FAQ ниже есть общие советы."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Скопировать"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Скопировано"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Скопировано (с вашим ключом)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Безопасность и совместный доступ"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="Ваш ключ API И ЕСТЬ вход &mdash; любой, у кого он есть, может делать всё, что может ваша учётная запись Joomla. Анонимного доступа нет. Если включить <strong>вход через OAuth</strong>, ИИ-приложение сможет подключиться, отправив вас на обычную страницу входа этого сайта; после этого оно действует от имени вошедшей учётной записи, ровно с её правами, пока вы не отключите его на панели управления."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Как дать доступ к MCP другим людям"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Есть два способа &mdash; выберите подходящий:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Отдельный ключ для каждого (самое безопасное)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Создайте для каждого человека пользователя Joomla, поместите его в группу только с нужными правами (например, только чтение), создайте для этого пользователя ключ и отправьте его лично. У каждого свой след в журналах; любой ключ можно отозвать, не затрагивая остальные."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Один общий ключ (проще всего, но наименее безопасно)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Создайте одного ограниченного пользователя (например, <code>mcp-demo-guest</code>) в группе только для чтения, создайте один ключ и раздайте его шире. Проще распространять; сложнее понять, кто им пользуется, или отключить доступ одному человеку. Подходит для публичной демонстрации; не для чувствительного доступа."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Как отозвать ключ"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="Чтобы существующий ключ сразу перестал работать, откройте Пользователи &rarr; нужный пользователь &rarr; вкладка «Токен API» &rarr; нажмите <strong>Сбросить</strong>. Старый ключ перестаёт действовать в момент нажатия. Передайте новый ключ этому человеку или оставьте его без доступа."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Устранение неполадок"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Найдите тип приложения, которое вы подключаете, и откройте проблему, которая совпадает с тем, что вы видите. Сообщения об ошибках и блокировки брандмауэра бывают в любом приложении, поэтому они вынесены в отдельную группу в конце."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; или &ldquo;Authentication failed&rdquo; (ошибка 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="Ваш ИИ достучался до сайта, но ключ API неверный. Проверьте: (1) не сбрасывали ли ключ после того, как скопировали (каждый сброс делает предыдущий ключ недействительным); (2) скопирован ли ключ целиком, без пропущенных символов и лишних пробелов; (3) если вы правили файл конфигурации &mdash; стоит ли перед ключом слово <code>Bearer </code> (с пробелом после). Если сомневаетесь, создайте новый ключ и попробуйте снова."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; или &ldquo;Could not match accept header&rdquo; (ошибка 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="В старых версиях MCP for J (до 2.3.4) была ошибка, из-за которой некоторые ИИ-клиенты не могли подключиться. Обновите MCP for J до последней версии &mdash; см. Система &rarr; Обновление &rarr; Расширения в панели администратора Joomla."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;Подключено, но в ИИ не появляется ни одного инструмента&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Обычно причина одна из трёх: (1) у группы пользователя нет права <strong>Вход в веб-службы</strong> &mdash; задайте его в разделе Система &rarr; Общие настройки &rarr; Права доступа (по умолчанию оно есть только у Super User); (2) у группы нет прав MCP &mdash; у Super User они есть всегда, у Administrator &mdash; благодаря настройкам Joomla по умолчанию, но группам Manager и другим нужно «Использовать точку подключения MCP» (и «Запись через точку подключения MCP» для изменений) в разделе Параметры &rarr; Права доступа этого компонента; (3) ИИ-клиент закешировал пустой список инструментов &mdash; отключите и снова подключите сервер MCP в клиенте, чтобы он проверил заново."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; или URL возвращает ошибку (ошибка 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Либо URL неверный (проверьте &mdash; он должен заканчиваться на <code>/api/index.php/v1/mcp</code>), ЛИБО на вашем сайте Joomla отключён плагин веб-служб для MCP. В панели администратора Joomla: Система &rarr; Управление &rarr; Расширения &rarr; найдите <code>csmcpforj</code> &rarr; убедитесь, что плагин веб-служб включён. Если он уже включён, возможно, путь <code>/api/</code> блокирует <code>.htaccess</code> вашего сайта &mdash; это проблема хостинга или плагина безопасности."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; или &ldquo;Malware detected&rdquo; (ошибка 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Плагин безопасности на вашем сайте Joomla (RSFirewall, Admin Tools Pro, Securitycheck Pro) блокирует запрос MCP. В RSFirewall добавьте два исключения: <code>csmcpforj_oauth</code> и <code>api\/index\.php\/v1\/mcp</code> как регулярное выражение (первое нужно для входа). В остальных разрешите <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> и URL, содержащие <code>csmcpforj_oauth</code>. Чтобы убедиться в причине, ненадолго отключите плагин безопасности, попробуйте снова, а затем включите его обратно с исключениями. Кнопка <strong>Проверить подключение</strong> на панели управления показывает, какой адрес блокируется."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Кнопка &ldquo;Edit Config&rdquo; в Claude Desktop ничего не делает при нажатии"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Эта кнопка пытается передать <code>claude_desktop_config.json</code> программе, которой ваш компьютер открывает файлы <code>.json</code>. Если такая программа не настроена, кнопка молча ничего не делает. Решение: откройте файл сами любым текстовым редактором. Пути для каждой операционной системы указаны в разделе Claude в блоке «Дополнительно» выше. Если файла ещё нет, создайте его и используйте фрагмент из того раздела как всё содержимое (оберните фрагмент в <code>{&quot;mcpServers&quot;: { ... }}</code>). Менять права не нужно &mdash; файл лежит в вашей папке пользователя."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="В окне &ldquo;Add custom connector&rdquo; в Claude или &ldquo;Add custom MCP server&rdquo; в ChatGPT нет поля для ключа API"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Эти окна предназначены для подключения через вход (OAuth); вставить ключ API MCP for J там некуда. На этом сайте вход через OAuth выключен. Super User может включить его в разделе Компоненты &rarr; MCP for J &rarr; Параметры &rarr; <strong>Вход через OAuth</strong>, и тогда оба окна заработают. До тех пор: Claude Desktop может использовать способ со скриптом-обёрткой выше, claude.ai &mdash; простую настройку, а пользователи ChatGPT &mdash; Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop при запуске показывает &ldquo;Some MCP servers could not be loaded&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (авг. 2026) ужесточил проверку файла конфигурации и теперь отклоняет записи, аргументы команды которых похожи на учётные данные. Это блокирует оба очевидных способа настроить сервер MCP с bearer-токеном прямо в <code>claude_desktop_config.json</code>: встроенную форму <code>type: http</code> И запуск <code>mcp-remote</code> с аргументом <code>--header &quot;Authorization: Bearer ...&quot;</code>. Оба выглядят в файле правильно, но проверка схемы в Claude Desktop отбрасывает их при загрузке. <strong>Решение:</strong> используйте способ со скриптом-обёрткой, описанный в разделе Claude в блоке «Дополнительно» выше, &mdash; поместите всю команду в небольшой файл <code>.cmd</code>, а в конфигурации Claude Desktop укажите только этот файл. Claude Desktop видит простую команду без видимых аргументов и принимает её. Ключ API остаётся ровно так же защищён, как раньше, &mdash; файл-обёртка лежит в вашей папке пользователя."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Я перезапустил Claude Desktop, но он всё ещё не видит новое подключение"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="В Windows закрытие окна Claude Desktop лишь сворачивает его в область уведомлений &mdash; всё приложение продолжает работать со СТАРОЙ конфигурацией в памяти. Последующее нажатие на значок на панели задач просто возвращает окно этого уже запущенного процесса. Claude Desktop перечитывает файл конфигурации только при настоящем перезапуске приложения. Чтобы действительно перезапустить: щёлкните правой кнопкой по значку Claude в области уведомлений (правый нижний угол; возможно, придётся нажать маленькую стрелку вверх, чтобы увидеть скрытые значки) &rarr; выберите <strong>Quit</strong> &rarr; подождите около 3 секунд, пока процесс полностью завершится, &rarr; снова запустите Claude Desktop из меню «Пуск». Только после этого изменения в файле конфигурации вступят в силу."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Частые вопросы"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Может ли кто-то пользоваться этим подключением без ключа API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="Нет. Каждый запрос должен содержать действующий ключ API или токен доступа OAuth, если вход через OAuth включён. Запросы без них отклоняются. Так задумано &mdash; ИИ может выполнять на сайте реальные действия (создавать материалы, редактировать пользователей и т. д.), поэтому анонимный доступ был бы катастрофой для безопасности."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Может ли у одного пользователя Joomla быть несколько действующих ключей API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="Нет. Joomla хранит ровно один ключ API на пользователя. Нажатие «Сбросить» создаёт новый ключ и делает старый недействительным. Если вам нужно несколько ключей (по одному на устройство, на ИИ-инструмент и т. д.), создайте отдельных пользователей Joomla."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Есть ли ограничение на объём использования?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="У самого MCP for J ограничений нет. Действуют обычные ограничения хостинга (память PHP, соединения MariaDB и т. д.). Если вы создаёте большую нагрузку (крупные пакетные операции на многих сайтах), обсудите с хостингом увеличение параллельности PHP-FPM."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Нужно ли открывать порты в брандмауэре или настраивать что-то особое?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="Нет. MCP использует обычный HTTPS на порту 443. Если ваш сайт уже публично доступен по адресу <code>https://yoursite.com/</code>, точка подключения MCP доступна любому ИИ-клиенту в интернете без дополнительной настройки."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="Как регулярно менять ключ API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Автоматического расписания нет &mdash; вы меняете ключ вручную, когда захотите. Откройте Пользователи &rarr; пользователь &rarr; вкладка «Токен API» &rarr; нажмите «Сбросить». Затем обновите конфигурацию ИИ-клиента новым ключом. Хорошая привычка: меняйте любой ключ, который хоть раз попадал на снимок экрана, в журнал или в отчёт об ошибке."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Я пользуюсь ИИ-клиентом, которого нет в списке выше, &mdash; он будет работать?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Почти наверняка да, если он поддерживает стандартный MCP по HTTPS и позволяет добавить собственный заголовок Authorization или умеет входить через OAuth (включите вход через OAuth в параметрах). URL везде один и тот же &mdash; отличается только экран настроек клиента. Клиенты, которые точно работают, но для которых мы ещё не написали пошаговых инструкций: Continue.dev, Windsurf, редактор Zed, mcp-cli, MCP Inspector, LibreChat, Open WebUI (через мост <code>mcpo</code>) и различные агенты на основе Ollama."

