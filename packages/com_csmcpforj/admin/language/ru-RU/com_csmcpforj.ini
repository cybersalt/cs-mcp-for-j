COM_CSMCPFORJ_DASHBOARD_PRO_INTRO="Если привязать учётную запись Cybersalt Extensions, этот сайт сможет устанавливать и автоматически обновлять купленные вами дополнения MCP Pro &mdash; будь то подписка All-Access или одно дополнение, купленное отдельно.<br><br>Когда вы нажимаете <strong>Привязать учётную запись</strong>, этот сайт регистрирует на <code>cybersalt.com</code> <strong>ID загрузки</strong> (в нём есть ваш домен) и связывает его с адресом электронной почты, с которого была покупка. Эта привязка разрешает каждую загрузку и каждое обновление Pro для дополнений, принадлежащих вашей учётной записи. Для этого на cybersalt.com отправляются ваш адрес электронной почты и домен этого сайта; пароль не отправляется &mdash; ключом служит адрес электронной почты."
