; Component config — catalog fieldset
COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_LABEL="Каталог"
COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_DESC="Настройки каталога дополнений MCP."
COM_CSMCPFORJ_CONFIG_CATALOG_URL_LABEL="URL источника каталога"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_DESC="Откуда загружается каталог дополнений MCP. Оставьте значение по умолчанию, если у вас нет собственного зеркала каталога; к простому базовому URL добавляется /catalog.json."
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="Время кеширования каталога (часы)"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="Сколько хранится в кеше загруженный catalog.json, прежде чем он будет загружен снова. Кнопка обновления на странице каталога игнорирует это. Диапазон 1&ndash;168 (одна неделя)."
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="Показывать недоступные дополнения Pro"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Показывать дополнения Pro в каталоге, даже если у вас сейчас нет подписки Pro. Удобно, чтобы посмотреть, что есть; выберите «Нет», чтобы полностью их скрыть."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Повторно проверять подписку каждые (секунды)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="Как часто панель управления заново спрашивает у cybersalt.com, есть ли у привязанного адреса электронной почты доступ Pro. 86400 = раз в день (рекомендуется). Минимум 60, максимум 604800 = раз в неделю."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="Сервер MCP"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Серверные настройки точки подключения MCP. Определяют, что MCP-клиенты видят и что могут вызывать."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Режим только для чтения"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="Если ДА, точка подключения MCP объявляет и принимает только инструменты, которые в своих MCP ToolAnnotations помечены как только для чтения (list_*, get_*, read_*, check_*, validate_*, fetch_*, а также joomla_update_healthcheck). Удобно, если вы хотите, чтобы ИИ-клиент изучал сайт, не имея возможности менять содержимое. Попытки записи возвращают ошибку с пояснением, что сервер работает в режиме только для чтения. Этот параметр задаёт нижнюю границу: MCP-клиент может также добавить ?read_only=1 к URL точки подключения, чтобы ограничить себя ещё сильнее, но НЕ может разблокировать запись на сайте, где здесь выбрано ДА."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Конфиденциальность при записи экрана"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Настройки размытия секретов на панели управления (токен API Joomla в предпросмотре промпта, адрес электронной почты подписки Pro). Размытие включено по умолчанию; эти параметры настраивают показ при наведении, чтобы случайное движение мыши не раскрыло секрет при демонстрации или записи экрана."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Задержка показа при наведении (секунды)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Сколько секунд нужно держать указатель над размытым секретом, прежде чем он будет показан. Пока вы держите указатель, рядом с секретом виден небольшой обратный отсчёт, чтобы было понятно, что таймер идёт. Если увести мышь, показ отменяется и таймер сбрасывается &mdash; при следующем наведении отсчёт начинается заново. Укажите 0, чтобы показывать сразу при наведении (это убирает защиту от случайного наведения, но возвращает классическое поведение). По умолчанию: 3 секунды."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Автоматически скрывать после показа (секунды)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Сколько секунд секрет, показанный при наведении, остаётся видимым, прежде чем снова автоматически размоется &mdash; даже если мышь всё ещё над ним. Дополнительная страховка на случай вроде &ldquo;посмотрел, прочитал и отвлёкся&rdquo;, когда оставленный без присмотра браузер иначе показывал бы секрет бесконечно. Если увести мышь, секрет всегда сразу размывается, независимо от этого параметра. Укажите 0, чтобы отключить автоматическое скрытие (показанные секреты остаются видимыми, пока вы не уведёте мышь). По умолчанию: 8 секунд &mdash; достаточно, чтобы спокойно прочитать весь токен base64, и достаточно мало, чтобы оставленный без присмотра сеанс не раскрыл секрет."

