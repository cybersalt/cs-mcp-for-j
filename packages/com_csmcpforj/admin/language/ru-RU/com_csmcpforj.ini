; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Кто может использовать эту точку подключения?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="Права проверяются для учётной записи Joomla, которой принадлежит токен API. MCP-клиент (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl или любой другой) только передаёт запросы &mdash; один и тот же токен работает одинаково в любом клиенте."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Важно:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Тот, кто создаёт токен, получает через точку подключения MCP тот же доступ, что и в любом другом месте панели администратора Joomla. Создавайте токены только для пользователей, которым вы доверили бы эти действия напрямую."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Группа пользователей Joomla"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Работает сразу?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Почему"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Да"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Нужно явное разрешение"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Super User в Joomla всегда проходят любую проверку прав."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Имеет core.manage благодаря правам Joomla по умолчанию, и проверка MCP принимает это для инструментов чтения и записи (инструменты, меняющие права, расширения, настройки плагинов или саму Joomla, по-прежнему требуют Super User) &mdash; но группе всё равно нужно право <strong>Вход в веб-службы</strong>, без которого Joomla вообще не даст ей пройти аутентификацию."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="По умолчанию не имеет прав MCP. Дайте группе право <strong>Вход в веб-службы</strong> в разделе Система &rarr; Общие настройки &rarr; Права доступа, а затем «Использовать точку подключения MCP» и (при необходимости) «Запись через точку подключения MCP» в разделе <strong>Параметры &rarr; Права доступа</strong> этого компонента."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Нужно право «Вход в веб-службы»"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Прежде чем всё это начнёт работать:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla закрывает весь API отдельным правом <strong>Вход в веб-службы</strong> (<code>core.login.api</code>), и <strong>по умолчанию оно есть только у Super User</strong>. Любая другая группа &mdash; включая Administrator и Manager &mdash; получает <code>403 Forbidden</code> от каждого инструмента, пока вы не дадите это право, что бы она ни могла делать в панели администратора. Настраивается в разделе <strong>Система &rarr; Общие настройки &rarr; Права доступа</strong>, для группы, а не для этого компонента."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / своя группа"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Дайте группе право <strong>Вход в веб-службы</strong> в разделе Система &rarr; Общие настройки &rarr; Права доступа, а затем «Использовать точку подключения MCP» и (при необходимости) «Запись через точку подключения MCP» в разделе <strong>Параметры &rarr; Права доступа</strong> этого компонента."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Подключите ИИ-ассистента к этому сайту"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Есть два способа. Первый (скопировать и вставить промпт) самый простой &mdash; он работает без настройки клиента, и после того как ИИ подтвердит, что всё работает, он обычно предлагает установить этот сайт как постоянный коннектор, без ручной правки JSON. Второй &mdash; для тех, кто предпочитает сам редактировать конфигурацию клиента."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Скопировать промпт для настройки (рекомендуется)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Вставьте промпт для настройки в своего ИИ-ассистента"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Настраивать клиент не нужно. Скопируйте промпт ниже в новый разговор с ИИ-ассистентом (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini и т. д.). ИИ выполнит тестовый запрос curl, подтвердит подключение и &mdash; в клиентах, которые это поддерживают, &mdash; предложит сделать подключение постоянным, без правки JSON-файлов и без команд терминала, которые нужно запоминать."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Бонус:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Если у вашего ИИ-клиента есть инструмент оболочки (Codex, Claude Code, Cursor Composer, Cline, Continue, режим агента GitHub Copilot и т. д.), промпт содержит предложение установиться самостоятельно. Просто скажите &lsquo;сделай постоянным&rsquo;, когда ИИ подтвердит, что подключение работает, и он выполнит подходящую для клиента команду регистрации сервера MCP (например, <code>codex mcp add</code> или <code>claude mcp add</code>). После перезапуска клиента этот сайт появится как встроенные инструменты MCP в каждом разговоре &mdash; промпт больше никогда не понадобится."
; Shared "type here" field pattern - see FieldStyleHelper.
COM_CSMCPFORJ_FIELD_OPTIONAL="Необязательно"
COM_CSMCPFORJ_FIELD_REQUIRED="Обязательно"

COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Создайте токен API Joomla в разделе «Мой профиль» (ссылка справа)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Нажмите &lsquo;Скопировать промпт&rsquo; ниже."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Вставьте его в новый разговор с ИИ-ассистентом. Если вы пропустили шаг 2, сначала замените <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> своим настоящим токеном."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Отправьте. ИИ проверит подключение и, в клиентах, которые это поддерживают, предложит сделать его постоянным."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Этот промпт работает в любом ИИ-клиенте с инструментом оболочки или терминала: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (режим агента), Gemini CLI, Windsurf, mcp-cli и т. д. Он не работает в чатах, которые есть только в браузере (claude.ai, chatgpt.com, gemini.google.com) и не имеют доступа к оболочке &mdash; для них используйте вкладку «Коннектор MCP»."

; Tab 2 — manual MCP connector configuration
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="Коннектор MCP (ручная настройка)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="Добавить вручную как коннектор MCP"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="Для Claude Desktop (файл конфигурации), Claude Code, Cursor, Codex, Cline, Copilot, Gemini CLI или любого клиента, конфигурацию которого вы предпочитаете править напрямую. Настраивается один раз и действует во всех разговорах. (Пользовательские коннекторы claude.ai и ChatGPT не могут отправить ключ API: они подключаются через вход. См. <strong>Подключение через вход (OAuth)</strong> на этой странице.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="Создайте токен API Joomla в разделе «Мой профиль»."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="Скопируйте фрагмент конфигурации ниже."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP3="Замените <code>YOUR_JOOMLA_API_TOKEN</code> созданным токеном."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Вставьте его в конфигурацию MCP своего ИИ-клиента &mdash; Claude Desktop: <code>claude_desktop_config.json</code>; Claude Code: <code>claude mcp add</code>; Cursor: <code>~/.cursor/mcp.json</code>; GitHub Copilot: настройки MCP в VS Code / JetBrains; Cline / Continue: JSON-настройки расширения. После сохранения перезапустите клиент. (В окнах &ldquo;Add custom connector&rdquo; в claude.ai и ChatGPT нет поля для этого; там используйте вход через OAuth.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_XHEADER_NOTE="Если ваш клиент не поддерживает заголовок Authorization, замените блок headers на:"

