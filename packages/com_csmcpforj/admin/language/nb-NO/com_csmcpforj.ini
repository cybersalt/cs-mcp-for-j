; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Hvem kan bruke dette endepunktet?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="Rettigheter kontrolleres mot Joomla-brukerkontoen som eier API-tokenet. MCP-klienten (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl eller noe annet) bare videresender &mdash; det samme tokenet oppfører seg likt fra alle klienter."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Viktig:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Den som genererer tokenet, får den samme tilgangen gjennom MCP-endepunktet som vedkommende har ellers i Joomla-administrasjonen. Generer bare tokener for brukere du ville stolt på til å gjøre disse handlingene direkte."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Joomla-brukergruppe"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Virker det med en gang?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Hvorfor"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Ja"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Må gis uttrykkelig"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Super Users består alltid alle rettighetskontroller i Joomla."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Har core.manage gjennom Joomlas standardrettigheter, som MCP-kontrollen godtar for lese- og skriveverktøy (verktøyene som endrer rettigheter, utvidelser, innstillinger for programtillegg eller selve Joomla, krever fortsatt en Super User) &mdash; men gruppen trenger fortsatt <strong>Innlogging for nettjenester</strong> før Joomla i det hele tatt lar den autentisere seg."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="Har ingen MCP-rettighet som standard. Gi gruppen <strong>Innlogging for nettjenester</strong> i System &rarr; Globale innstillinger &rarr; Rettigheter, og deretter Bruke MCP-endepunktet og (valgfritt) Skrive gjennom MCP-endepunktet under <strong>Innstillinger &rarr; Rettigheter</strong> for denne komponenten."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Trenger Innlogging for nettjenester"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Før noe av dette gjelder:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla beskytter hele API-et med en egen rettighet som heter <strong>Innlogging for nettjenester</strong> (<code>core.login.api</code>), og <strong>bare Super Users har den som standard</strong>. Alle andre grupper &mdash; også Administrator og Manager &mdash; får <code>403 Forbidden</code> fra alle verktøy til du gir dem den, uansett hva annet de kan gjøre i administrasjonen. Angi den i <strong>System &rarr; Globale innstillinger &rarr; Rettigheter</strong>, på gruppen, ikke på denne komponenten."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / egendefinert gruppe"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Gi gruppen <strong>Innlogging for nettjenester</strong> i System &rarr; Globale innstillinger &rarr; Rettigheter, og deretter Bruke MCP-endepunktet og (valgfritt) Skrive gjennom MCP-endepunktet under <strong>Innstillinger &rarr; Rettigheter</strong> for denne komponenten."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Koble en KI-assistent til dette nettstedet"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Det er to måter å gjøre det på. Den første (kopier og lim inn en prompt) er enklest &mdash; den virker uten noen klientkonfigurasjon, og når KI-en har bekreftet at den virker, tilbyr den vanligvis å installere dette nettstedet som en permanent kobling for deg uten manuell redigering av JSON. Den andre er for brukere som heller vil redigere klientkonfigurasjonen direkte."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Kopier en oppsettsprompt (anbefalt)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Lim inn en oppsettsprompt i KI-assistenten din"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Ingen klientkonfigurasjon er nødvendig. Kopier prompten nedenfor til en ny samtale med KI-assistenten din (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini osv.). KI-en kjører en test med curl, bekrefter tilkoblingen og &mdash; i klienter som støtter det &mdash; tilbyr å gjøre tilkoblingen permanent for deg, uten JSON-filer å redigere og uten terminalkommandoer å huske."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Bonus:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Hvis KI-klienten din har et skallverktøy (Codex, Claude Code, Cursor Composer, Cline, Continue, agentmodus i GitHub Copilot osv.), inneholder prompten et tilbud om selvinstallasjon. Si bare &laquo;make it permanent&raquo; etter at KI-en har bekreftet at tilkoblingen virker, så kjører den riktig kommando for klienten for å registrere MCP-serveren (for eksempel <code>codex mcp add</code> eller <code>claude mcp add</code>). Etter en omstart av klienten vises dette nettstedet som innebygde MCP-verktøy i alle samtaler &mdash; ingen prompt trengs noen gang igjen."
; Shared "type here" field pattern - see FieldStyleHelper.
COM_CSMCPFORJ_FIELD_OPTIONAL="Valgfritt"
COM_CSMCPFORJ_FIELD_REQUIRED="Påkrevd"

COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Generer et Joomla API-token i profilen din (lenke til høyre)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Klikk på &laquo;Kopier prompt&raquo; nedenfor."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Lim den inn i en ny samtale med KI-assistenten din. Hvis du hoppet over trinn 2, må du først erstatte <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> med det faktiske tokenet ditt."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Send. KI-en tester tilkoblingen og tilbyr, i klienter som støtter det, å gjøre den permanent."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Denne prompten virker i alle KI-klienter med et skall-/terminalverktøy: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (agentmodus), Gemini CLI, Windsurf, mcp-cli osv. Den virker ikke i rene nettbaserte chatgrensesnitt (claude.ai, chatgpt.com, gemini.google.com) som mangler skalltilgang &mdash; bruk fanen MCP-kobling for disse."

; Tab 2 — manual MCP connector configuration
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="MCP-kobling (manuell konfigurasjon)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="Legg til manuelt som MCP-kobling"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="For Claude Desktop (konfigurasjonsfil), Claude Code, Cursor, Codex, Cline, Copilot, Gemini CLI eller enhver klient der du heller vil redigere konfigurasjonen direkte. Engangsoppsett som gjelder for alle samtaler. (Egendefinerte koblinger i claude.ai og ChatGPT kan ikke sende en API-nøkkel: de kobler til ved innlogging. Se <strong>Koble til ved innlogging (OAuth)</strong> på denne siden.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="Generer et Joomla API-token i profilen din."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="Kopier konfigurasjonsutdraget nedenfor."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP3="Erstatt <code>YOUR_JOOMLA_API_TOKEN</code> med tokenet du genererte."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Lim det inn i MCP-konfigurasjonen til KI-klienten din &mdash; Claude Desktop: <code>claude_desktop_config.json</code>; Claude Code: <code>claude mcp add</code>; Cursor: <code>~/.cursor/mcp.json</code>; GitHub Copilot: MCP-innstillinger i VS Code / JetBrains; Cline / Continue: innstillings-JSON for utvidelsen. Start klienten på nytt etter at du har lagret. (Dialogene &laquo;Add custom connector&raquo; i claude.ai og ChatGPT har ikke noe felt for dette; bruk OAuth-innlogging for disse.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_XHEADER_NOTE="Hvis klienten din ikke støtter et Authorization-hode, bytter du ut headers-blokken med:"

