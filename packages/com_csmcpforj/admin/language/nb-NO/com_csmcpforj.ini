COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_HEADING="Vi setter pris på å høre fra deg"
COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_BODY="Send oss feilrapporter, funksjonsønsker, spørsmål og ideer &mdash; vi leser alt og setter pris på tilbakemeldingene. Støtte for gratisversjonen gis etter beste evne (ressursene våre til gratis støtte er begrensede), så svar kan ta litt tid. Hvis du trenger garanterte svartider eller prioritert oppmerksomhet, kan du vurdere %set MCP for J Pro-medlemskap%s."

