COM_CSMCPFORJ_DASHBOARD_PRO_INTRO="Når du kobler til Cybersalt Extensions-kontoen din, kan dette nettstedet installere og automatisk oppdatere Pro MCP-tilleggene du har kjøpt &mdash; enten det er All-Access-medlemskapet eller ett enkelt tillegg kjøpt separat.<br><br>Når du klikker på <strong>Koble til konto</strong>, registrerer dette nettstedet en <strong>nedlastings-ID</strong> (som inneholder domenet ditt) hos <code>cybersalt.com</code> og kobler den til e-postadressen du kjøpte med. Denne koblingen gir tillatelse til alle Pro-nedlastinger og -oppdateringer for tilleggene kontoen din eier. E-postadressen din og domenet til dette nettstedet sendes til cybersalt.com for dette; ikke noe passord sendes &mdash; e-postadressen er nøkkelen."
