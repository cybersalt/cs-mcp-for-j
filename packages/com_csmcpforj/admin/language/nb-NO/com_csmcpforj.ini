COM_CSMCPFORJ_ACTIONLOG_OAUTH_CONSENT="Brukeren <a href=&quot;{accountlink}&quot;>{username}</a> koblet appen &laquo;{title}&raquo; til MCP for J (OAuth)"
COM_CSMCPFORJ_ACTIONLOG_OAUTH_REVOKE="Brukeren <a href=&quot;{accountlink}&quot;>{username}</a> koblet appen &laquo;{title}&raquo; fra MCP for J (OAuth)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="Koble til ved å logge inn (enklest)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Ingen API-nøkkel å kopiere. I KI-appen din legger du til en kobling og limer inn <strong>endepunkt-URL-en</strong> til dette nettstedet (nedenfor). Når du klikker på Connect, åpner appen innloggingssiden på dette nettstedet av seg selv: logg inn med brukernavnet og passordet ditt for dette nettstedet, og klikk deretter på <strong>Tillat</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai og Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Gi den et navn, lim inn endepunkt-URL-en og klikk på Continue. Behold <em>Sign in now</em>; for OAuth-klienten virker både <em>Use Claude's published identity</em> og <em>Register automatically</em>. Ikke legg til forespørselshoder. Klikk på Add og deretter på <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> <strong>Plugins</strong> i venstre sidepanel &rarr; <strong>Add</strong> (øverst til høyre) &rarr; <strong>Add custom MCP server</strong>. Gi den et navn, lim inn endepunkt-URL-en, la Authentication stå på <strong>OAuth</strong>, kryss av i boksen, klikk på <strong>Create as a plugin</strong> og deretter på <strong>Connect</strong>. Krever et betalt ChatGPT-abonnement (Plus virker)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>, skriv deretter <code>/mcp</code>, velg serveren og velg <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> Command Palette &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; lim inn endepunkt-URL-en. VS Code ber deg logge inn."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> legg til <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> under <code>mcpServers</code> i <code>mcp.json</code> (uten hoder), og klikk deretter på <strong>Login</strong> ved siden av serveren i Settings &rarr; MCP."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> legg til <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> for serveren i <code>settings.json</code>, og kjør deretter <code>/mcp auth &lt;name&gt;</code>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Codex åpner innloggingssiden av seg selv (hvis ikke, kjør <code>codex mcp login joomla</code>). Klikk på Tillat innen noen minutter, i en nettleser på samme datamaskin som Codex. Hvis nettleseren da sier at 127.0.0.1 nektet tilkobling, bruker du <code>codex mcp login joomla --no-browser</code> og limer adressen til den siden inn i terminalen, eller fortsetter å bruke metoden med API-nøkkel nedenfor."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, lim inn endepunkt-URL-en, og klikk deretter på <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="Når du klikker på Tillat, handler appen som kontoen du logget inn med, og kan gjøre nøyaktig det den kontoen kan på dette nettstedet, inkludert å gjøre endringer hvis kontoen har lov til det. Administrators og Managere trenger først rettigheten <em>Innlogging for nettjenester</em> (se Rettigheter på oversikten). Alle tilkoblede apper er oppført på oversikten, der de kan kobles fra med en gang."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="Foretrekker du en API-nøkkel, eller kan ikke klienten din åpne en nettleser? Metoden med API-nøkkel under <strong>Avansert oppsett</strong> nedenfor virker fortsatt for alle klienter."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT (&laquo;Add custom MCP server&raquo;) og claude.ai / Claude Desktop (&laquo;Add custom connector&raquo;) kan bare koble til ved å sende deg til innloggingssiden på dette nettstedet. Det er slått av på dette nettstedet. Når det er på, er tilkoblingen slik: lim inn adressen til dette nettstedet i appen, logg inn, klikk på Tillat."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="Slå det på i Innstillinger"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Be en Super User om å slå på <strong>OAuth-innlogging</strong> i innstillingene for MCP for J. Inntil da bruker du metoden med API-nøkkel nedenfor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="Enklest: dialogen &laquo;Add custom connector&raquo; i Claude virker på dette nettstedet."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="Innlogging er slått på for dette nettstedet, så i Claude Desktop eller claude.ai går du til <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, limer inn MCP-adressen til dette nettstedet, klikker på Continue, beholder innloggingsinnstillingene den oppdager, klikker på Add og deretter Connect, logger inn med brukernavnet og passordet ditt for dette nettstedet og klikker på Tillat. Metoden med konfigurasjonsfil nedenfor trengs bare hvis du foretrekker en API-nøkkel."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai kobler til permanent gjennom <strong>Add custom connector</strong>: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, lim inn MCP-adressen til dette nettstedet, klikk på Continue, behold innloggingsinnstillingene den oppdager, klikk på Add og deretter Connect. Logg inn med brukernavnet og passordet ditt for dette nettstedet og klikk på Tillat. Tilkoblingen er tilgjengelig i alle chatter."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="I ChatGPT klikker du på <strong>Plugins</strong> i venstre sidepanel, deretter <strong>Add</strong> (øverst til høyre) &rarr; <strong>Add custom MCP server</strong>. Gi den et navn (for eksempel &laquo;Joomla-nettstedet mitt&raquo;), lim inn MCP-adressen til dette nettstedet, la Authentication stå på <strong>OAuth</strong>, kryss av for &laquo;I understand and want to continue&raquo; og klikk på <strong>Create as a plugin</strong>. Klikk på <strong>Connect</strong>, så åpner ChatGPT innloggingssiden på dette nettstedet: logg inn med brukernavnet og passordet ditt for dette nettstedet og klikk på Tillat. Skriv deretter <strong>@</strong> i en chat og velg programtillegget. Det er ingen API-nøkkel å lime inn."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="Dialogen &laquo;Add custom connector&raquo; kobler til, men innloggingen mislykkes"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Kontroller i denne rekkefølgen: (1) kontoen du logget inn med, har lov til å bruke MCP &mdash; Administrators trenger <em>Innlogging for nettjenester</em>, og Managere trenger det pluss <em>Bruke MCP-endepunktet</em> under Innstillinger &rarr; Rettigheter (se kortet <em>Hvem kan bruke dette endepunktet?</em> på oversikten); innloggingssiden sier fra hvis ikke; (2) kortet &laquo;Koble til KI-apper ved å logge inn&raquo; på oversikten viser <strong>Klar</strong>; (3) brannmuren din lar appens egne servere nå nettstedet (se neste oppføring). Ikke oppgi klient-ID eller -hemmelighet: appen registrerer seg selv. (4) Klikk på Tillat kort tid etter at innloggingssiden åpnes: apper gir opp en innlogging etter en stund (Codex etter omtrent 5 minutter), og en sen Tillat ender i en feil. Start Connect på nytt, så virker det."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai eller ChatGPT når ikke nettstedet, eller innloggingen stopper halvveis"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai og ChatGPT kobler til fra sine egne servere, ikke fra nettleseren din, så nettstedet må kunne nås over offentlig HTTPS. En brannmur for nettapplikasjoner (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 eller en brannmur hos vertsleverandøren, som o2switch TigerProtect, som svarer 503) kan blokkere disse forespørslene. Tillat forespørsler til <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> og <code>index.php?csmcpforj_oauth=&hellip;</code> (endepunktene for registrering, token og tilbakekalling). I RSFirewall er disse to unntakene nok: <code>csmcpforj_oauth</code>, og <code>api\/index\.php\/v1\/mcp</code> som regulært uttrykk. claude.ai kobler til fra <code>160.79.104.0/21</code>. <strong>Cloudflare</strong>: Browser Integrity Check og Security Level kan blokkere appenes servere. Legg til en egendefinert WAF-regel (Security &rarr; WAF &rarr; Custom rules) med handlingen <strong>Skip</strong> for forespørsler der URI-stien inneholder <code>/api/index.php/v1/mcp</code> eller <code>/.well-known/oauth-</code>, eller der spørrestrengen inneholder <code>csmcpforj_oauth</code>, og kryss av for <em>Browser Integrity Check</em> og <em>Security Level</em>. Bot Fight Mode kan ikke hoppes over med en regel, så slå den av hvis den blokkerer. <strong>Route 66</strong> og andre SEO-utvidelser som skriver om URL-er, kan fange opp innloggingsadressene (<code>index.php?csmcpforj_oauth=&hellip;</code>) og svare med forsiden, slik at appen ikke kan registrere seg og ikke oppgir noen tydelig grunn. Hvis <strong>Kontroller tilkoblingen</strong> viser forsiden for innloggingsendepunktene, utelater du URL-er som inneholder <code>csmcpforj_oauth</code> i den utvidelsen, eller slår av systemprogramtillegget dens. Selve innloggingssiden åpnes i din egen nettleser."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="Oversikten sier at KI-apper ikke finner innloggingssiden på dette nettstedet (Ikke klar)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="KI-klienter ser etter innloggingsdetaljene på <code>/.well-known/oauth-authorization-server</code> på domenet ditt. Joomla svarer der bare når Globale innstillinger &rarr; <strong>Bruk omskriving av nettadresse</strong> er på og <code>.htaccess</code>-filen til nettstedet er på plass (gi nytt navn til <code>htaccess.txt</code>), eller når nginx sender ukjente stier til <code>index.php</code>. Dette påvirker ikke AutoSSL i cPanel, som bruker <code>/.well-known/acme-challenge/</code>. Et nettsted som er installert i en undermappe (for eksempel <code>example.com/joomla</code>), trenger også en regel i domeneroten som sender <code>/.well-known/oauth-authorization-server/joomla</code> til undermappen."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Innlogging fra en server eller en maskin uten nettleser"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Skrivebordsklienter (Claude Code, Codex, Cursor, Gemini CLI) åpner en nettleser på samme maskin og lytter etter svaret på en lokal adresse, så OAuth-innlogging trenger en nettleser der. På en server uten grafisk grensesnitt eller over SSH bruker du i stedet metoden med API-nøkkel under Avansert oppsett; den virker overalt."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="I KI-appen legger du til en ny kobling (claude.ai og Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector; ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server) og limer inn denne <strong>endepunkt-URL-en</strong>: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Klikk på Connect.</strong> Appen åpner innloggingssiden på dette nettstedet av seg selv. Logg inn med brukernavnet og passordet ditt for dette nettstedet."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Klikk på Tillat.</strong> Du blir sendt tilbake til appen, tilkoblet. Appen kan gjøre alt kontoen din har lov til på dette nettstedet."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Koble en KI-app til dette nettstedet"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Det er tre måter. Klikk på en for å åpne de nummererte trinnene. De fleste vil ha den første."
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. Logg inn (enklest) &mdash; ChatGPT, claude.ai, Claude Desktop og de fleste andre KI-apper"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Lim inn en oppsettsprompt &mdash; for en KI-chat som kan kjøre kommandoer"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. Konfigurasjonsfil eller kommandolinje &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI og andre"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Virker i KI-apper som kan kjøre kommandoer (Codex, Claude Code, Cursor, Cline, agentmodus i Copilot og lignende). KI-en tester tilkoblingen selv og kan tilby å gjøre den permanent."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="For apper du setter opp med en innstillingsfil eller en kommando. Du gjør det én gang, og så er den tilkoblet."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>Skaff API-tokenet ditt.</strong> Klikk på knappen: brukerprofilen din åpnes i en ny fane. Åpne fanen <strong>Joomla API-token</strong>, klikk på øyeikonet for å vise tokenet og kopier det. Kom deretter tilbake til denne fanen."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="Skaff API-tokenet mitt (åpner en ny fane)"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>Kopier prompten.</strong> Tokenet ditt er allerede i den."
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="<strong>Lim den inn i en ny samtale</strong> med KI-appen din og send. KI-en tester tilkoblingen og tilbyr, hvis den kan, å gjøre den permanent."
COM_CSMCPFORJ_DASHBOARD_WAY3_STEP_COPY="<strong>Kopier konfigurasjonen.</strong> Tokenet ditt er allerede i den."
COM_CSMCPFORJ_DASHBOARD_WAY3_GUIDE_LINK="Trinnvise instruksjoner for hver app finnes i oppsettsveiledningen &rarr;"
COM_CSMCPFORJ_DASHBOARD_COPY_URL_BUTTON="Kopier"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1_COPY="<strong>Kopier endepunkt-URL-en.</strong>"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2_ADD="<strong>Legg til endepunkt-URL-en i KI-appen din som en kobling.</strong> Hvor du gjør det, avhenger av appen:"
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN="Koble til ved å logge inn"
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN_ON="KI-apper kan koble til ved å logge inn."

