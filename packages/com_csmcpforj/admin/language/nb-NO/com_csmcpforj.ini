COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="OAuth-innlogging"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Lar KI-apper koble til ved å sende deg til innloggingssiden på dette nettstedet, i stedet for at du kopierer en API-nøkkel inn i dem. ChatGPT (&laquo;Add custom MCP server&raquo;) og claude.ai / Claude Desktop (&laquo;Add custom connector&raquo;) kan bare koble til på denne måten. Tilkoblinger som bruker en API-nøkkel, fortsetter å virke uansett."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="Aktiver OAuth-innlogging"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Når dette er på, limer du MCP-adressen til dette nettstedet inn i en KI-app, appen åpner innloggingssiden på dette nettstedet, du logger inn med det vanlige brukernavnet og passordet ditt og klikker på Tillat. Appen handler deretter som deg, med nøyaktig dine rettigheter på dette nettstedet. Tilkoblede apper er oppført på oversikten, der hver av dem kan kobles fra. Slår du av dette, kobles alle fra umiddelbart."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Levetid for tilgangstoken (sekunder)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Hvor lenge hvert tilgangstoken varer før appen fornyer det i det stille. Standard 3600 (én time). Mellom 300 og 86400."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Forbli logget inn i (dager)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Hvor lenge en app kan fortsette å fornye uten at brukeren logger inn på nytt. Hver fornyelse nullstiller tiden. Standard 30."
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="Koble til KI-apper ved å logge inn"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="Noen KI-apper, blant annet ChatGPT og claude.ai, kan bare koble til et nettsted ved å sende deg til innloggingssiden på det nettstedet. Dette er slått av på dette nettstedet, så disse appene kan ikke koble til ennå. Slå på <strong>OAuth-innlogging</strong> i Innstillinger for å tillate det. Tilkoblinger som bruker en API-nøkkel, fortsetter å virke uansett."
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="Åpne Innstillinger for å slå det på"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="Ingen API-nøkkel er nødvendig. Det eneste du kopierer, er <strong>endepunkt-URL-en</strong> til dette nettstedet."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="Kontrollerer at KI-apper kan finne innloggingssiden på dette nettstedet&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>Klar.</strong> KI-apper kan finne innloggingssiden på dette nettstedet."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>Ikke klar.</strong> KI-apper finner ikke innloggingssiden på dette nettstedet, så de kan ikke koble til. For å løse dette slår du på <strong>Bruk omskriving av nettadresse</strong> i System &rarr; Globale innstillinger og kontrollerer at .htaccess-filen til nettstedet er på plass. Feilsøkingsdelen i oppsettsveiledningen har detaljene."
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_HEADING="Tilkoblede apper"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_NONE="Ingen KI-apper er tilkoblet ennå. En app vises her etter at noen har logget inn og klikket på Tillat."
