COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="Oppsettsveiledning"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="Oppsettsveiledning"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for J — Oppsettsveiledning"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Koble en KI til dette Joomla-nettstedet"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for J er laget for å gjøre det enkelt å koble en KI-assistent som Codex, Claude, ChatGPT eller Cursor til Joomla-nettstedet ditt &mdash; slik at KI-en kan lese artiklene dine, administrere brukere, publisere innhold og mer, alt gjennom det vanlige chatgrensesnittet til KI-en. Du trenger ikke være teknisk. Den enkle metoden nedenfor virker for de fleste; bla ned for avanserte alternativer hvis du trenger dem."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ Den enkle måten"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Ingen konfigurasjonsfiler. Ingen hoder. Ingen sjargong. Bare kopier en ferdig oppsettsprompt fra oversikten og lim den inn i en ny chat med KI-en din. KI-en gjør resten &mdash; den tester tilkoblingen og tilbyr, i klienter som støtter det, å lagre tilkoblingen permanent for deg."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Skaff API-nøkkelen din</strong> (et personlig passord som lar KI-en din handle på dette nettstedet). Instruksjoner finnes nedenfor hvis du ikke har en ennå."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Gå til oversikten</strong> (knappen nedenfor) og lim inn API-nøkkelen din i feltet der."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Klikk på knappen &laquo;Kopier prompt&raquo;</strong> på oversikten. Nøkkelen din settes automatisk inn i prompten før den kopieres."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Lim den inn i en ny chat</strong> med KI-en din (Claude, ChatGPT, Cursor, Copilot, Gemini osv.) og send. KI-en bekrefter at tilkoblingen virker og tilbyr å lagre den."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Gå til oversikten"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="Det var det. KI-en din er tilkoblet. Hvis du vil vite mer om hvordan delene henger sammen, eller heller vil konfigurere KI-en manuelt, kan du lese videre nedenfor &mdash; men du må ikke."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Skaff API-nøkkelen din"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="En <strong>API-nøkkel</strong> er et personlig passord som lar KI-en din handle på dette Joomla-nettstedet som DEG. Alle som har nøkkelen, kan gjøre alt Joomla-brukerkontoen din kan &mdash; så behandle den som privat. Slik genererer du en:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sKlikk her for å åpne Joomla-brukerprofilen din%s. Den åpnes i en ny fane. Der ser du etter fanen som heter <strong>Joomla API-token</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="På den fanen klikker du på knappen <strong>Tilbakestill</strong>. Joomla genererer en lang rekke bokstaver og tall og setter den i feltet under knappen. Dette er nøkkelen din."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Klikk på det lille <strong>øyeikonet</strong> ved siden av feltet for å vise nøkkelen, og kopier deretter hele strengen."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Lim den inn i feltet nedenfor på denne siden (den lagres bare i nettleseren din, slik at kopieringsknappene på denne siden kan fylle den inn automatisk), ELLER lim den rett inn i feltet for API-nøkkel på oversikten hvis du er på vei dit for det enkle oppsettet."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Behandle denne nøkkelen som et passord."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Ikke lim den inn i delte dokumenter, skjermbilder eller kode du skal publisere. Hvis den noen gang lekker, går du tilbake til fanen Joomla API-token og klikker på Tilbakestill igjen &mdash; den gamle nøkkelen blir ugyldig umiddelbart."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Lim inn API-nøkkelen din her (for kopiering med ett klikk på denne siden)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Nøkkelen din huskes bare i denne nettleseren</strong> &mdash; den forlater aldri datamaskinen din. Bruk søppelbøtteknappen for å glemme den. Hvis du lar dette stå tomt, virker kopieringsknappene på denne siden fortsatt, men du må lime nøkkelen inn i det kopierte utdraget manuelt."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Vis/skjul nøkkelen"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Glem den lagrede nøkkelen"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Avansert: koble til en KI manuelt (de fleste trenger ikke dette)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Denne delen er for dem som vil konfigurere tilkoblingen mellom KI-klienten og dette nettstedet for hånd &mdash; vanligvis ved å redigere en liten tekstfil som kalles en &laquo;konfigurasjonsfil&raquo;. Hvis det enkle oppsettet ovenfor virket for deg, kan du trygt hoppe over hele denne delen. Hvis du vil gå utenom oppsettsprompten og registrere tilkoblingen direkte i KI-klienten, leser du videre."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="Tilkoblings-URL for dette nettstedet"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="Dette er adressen KI-klienten din trenger. Du limer den inn i oppsettet til klienten sammen med API-nøkkelen din."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Velg KI-klienten din"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="Tilkoblings-URL-en + API-nøkkelen er den samme for alle KI-er &mdash; bare <em>hvor du limer dem inn</em> varierer fra klient til klient. Velg klienten din nedenfor for å få de konkrete instruksjonene."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, IDE-utvidelse eller skrivebordsapp)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex støtter dette endepunktet direkte som en MCP-server med Streamable HTTP. Lagre først Joomla API-nøkkelen i en miljøvariabel for dette nettstedet, og registrer deretter endepunktet med navnet på miljøvariabelen. Nøkkelen skrives aldri til <code>config.toml</code>. Hvis du bruker kopieringsknappen etter å ha limt inn en nøkkel ovenfor, inneholder den kopierte miljøkommandoen denne nøkkelen, så hold den unna delte terminaler, opptak og støttesaker."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; lagre nøkkelen for fremtidige Codex-prosesser"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Åpne en ny terminal etter å ha angitt en permanent miljøvariabel i Windows. Eksisterende Codex- og terminalprosesser kan ikke se den."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; angi nøkkelen for denne terminalen (gjør den permanent i det sikre skallmiljøet ditt ved behov)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Registrer dette Joomla-nettstedet i Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Kjør <code>codex mcp list</code>, start Codex på nytt (eller sjekk MCP-statusen i grensesnittet) og kall deretter det harmløse skrivebeskyttede verktøyet <code>get_joomla_version</code>. Dette bekrefter initialisering, autentisering, oppdagelse av verktøy og kall. For en skrivebeskyttet tilkobling slår du også på den skrivebeskyttede modusen på serversiden i MCP for J; godkjenningsinnstillinger i klienten kan ikke overstyre rettighetene på serveren."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Ugyldig token på cPanel eller PHP-FPM?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Nettserveren kan fjerne det vanlige Authorization-hodet. Erstatt oppføringen du opprettet ovenfor i <code>~/.codex/config.toml</code> med denne blokken, slik at Codex leser den samme miljøvariabelen og sender den som <code>X-Joomla-Token</code>, og start deretter Codex på nytt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Merk &mdash; dialogen &laquo;Add custom connector&raquo; i Claude trenger OAuth, som er slått av på dette nettstedet."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Den innebygde dialogen &laquo;Add custom connector&raquo; i Claude Desktop og claude.ai kobler til ved innlogging (OAuth) og har ikke noe felt for API-nøkkel. En Super User kan slå på OAuth-innlogging i innstillingene for MCP for J; da virker dialogen. Inntil da bruker instruksjonene for Claude Desktop nedenfor redigering av konfigurasjonsfilen i stedet. (Eller bruk det enkle oppsettet ovenfor &mdash; det virker også med Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Fire trinn: lag en liten hjelpefil som kalles et &laquo;wrapper-skript&raquo; og som inneholder tilkoblingskommandoen, pek konfigurasjonsfilen til Claude Desktop på den, og start Claude Desktop på nytt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Hvorfor et wrapper-skript i stedet for å sette tilkoblingen rett i konfigurasjonen til Claude Desktop? Claude Desktop 1.30096+ (august 2026) avviser konfigurasjonsoppføringer der kommandoargumentene ser ut til å inneholde legitimasjon &mdash; en velment sikkerhetsfunksjon som dessverre blokkerer den direkte metoden. Å flytte kommandoen til en liten hjelpefil omgår dette (Claude Desktop ser bare en vanlig kommando uten synlige argumenter), og API-nøkkelen din er like trygg som før &mdash; hjelpefilen ligger i din egen brukermappe sammen med konfigurasjonen til Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Engangsforutsetning &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Disse instruksjonene forutsetter at du har Node.js installert på datamaskinen (som følger med en kommando som heter <code>npx</code>). De fleste utvikleroppsett har det allerede; hvis ikke, installerer du det fra <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> med LTS-installasjonsprogrammet. Wrapper-filen nedenfor forventer Node.js på standard installasjonssti i Windows, <code>C:\Program Files\nodejs\</code>. Hvis du installerte det et annet sted, redigerer du stien i wrapper-filen etter kopiering."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Trinn 1 &mdash; lag wrapper-skriptet"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Foreløpig bare for Windows (Mac-/Linux-brukere, se FAQ). Kopier blokken nedenfor til en ny ren tekstfil. Lagre den i brukermappen din (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) med filnavnet <code>claude-mcp-joomla-{sitename}.cmd</code>, der du erstatter <code>{sitename}</code> med en kort betegnelse på nettstedet ditt (f.eks. <code>cybersaltorg</code>). Pass på at <code>.cmd</code> faktisk er filtypen, ikke en del av filnavnet &mdash; i Notisblokk velger du &laquo;Filtype: Alle filer&raquo;, så den ikke legger til <code>.txt</code>. Hvis du limte inn API-nøkkelen din i feltet øverst på denne siden, setter kopieringsknappen den inn for deg."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Usikker på hva Windows-brukernavnet ditt er? Åpne Filutforsker, gå til <code>C:\Users\</code> og se på mappenavnene &mdash; en av dem er din."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Trinn 2 &mdash; åpne konfigurasjonsfilen til Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Innstillingsfilen til Claude Desktop ligger på en fast sti i hvert operativsystem. Åpne den i et hvilket som helst tekstredigeringsprogram (VS Code, Notisblokk, TextEdit, Sublime, det du har):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop har en knapp under Settings &rarr; Developer &rarr; <strong>Edit Config</strong> som skal åpne filen for deg. Hvis du klikker på den og ingenting skjer, er det fordi datamaskinen ikke vet hvilket program den skal åpne <code>.json</code>-filer med. Ikke noe problem &mdash; åpne bare filen selv i et tekstredigeringsprogram med en av stiene ovenfor. Hvis filen ikke finnes ennå, oppretter du den og bruker blokken nedenfor som hele innholdet (pakket inn som <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Trinn 3 &mdash; legg til denne blokken i konfigurasjonen til Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Lim dette inn i <code>claude_desktop_config.json</code>. Hvis filen allerede har et <code>mcpServers</code>-objekt med andre servere, legger du til <code>joomla-...</code>-oppføringen ved siden av dem (ikke lim inn et nytt <code>mcpServers</code>-objekt). Hvis filen er tom eller mangler, bruker du hele blokken nedenfor som innhold. <strong>Viktig:</strong> erstatt <code>YOUR_WINDOWS_USERNAME</code> med det faktiske Windows-brukernavnet ditt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Denne konfigurasjonen peker bare Claude Desktop til wrapper-skriptet du laget i trinn 1. API-nøkkelen din blir i wrapper-filen, ikke i konfigurasjonen til Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Trinn 4 &mdash; avslutt Claude Desktop helt og åpne den igjen"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop leser konfigurasjonsfilen bare når den starter. Lukk den helt &mdash; i Windows høyreklikker du på Claude-ikonet i systemstatusfeltet (nederst til høyre, du må kanskje klikke på den lille pilen opp) og velger Quit. Vent noen sekunder og start den på nytt. I en hvilken som helst samtale klikker du på verktøyikonet (eller spør &laquo;what tools do you have?&raquo;) &mdash; verktøyene til nettstedet skal være oppført. Hvis de ikke er det, se Feilsøking nedenfor."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (terminal eller VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Hvis du bruker Claude Code, setter én terminalkommando opp tilkoblingen &mdash; uten redigering av konfigurasjonsfiler. Lim inn API-nøkkelen din i feltet ovenfor, så fyller kopieringsknappen nedenfor den inn, lim deretter kommandoen inn i en terminal og trykk på Enter. Claude Code bekrefter tilkoblingen med en gang og laster inn på nytt."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (nettversjonen)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="Dialogen <strong>Add custom connector</strong> i claude.ai kobler til ved innlogging (OAuth), som er slått av på dette nettstedet. En Super User kan slå den på i innstillingene for MCP for J, og da får claude.ai en permanent tilkobling. Inntil da virker det enkle oppsettet ovenfor (lim inn en prompt) bare for den gjeldende chatten."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor lagrer MCP-tilkoblingene sine i en konfigurasjonsfil som heter <code>mcp.json</code>. Åpne den i et tekstredigeringsprogram, lim inn blokken nedenfor i <code>mcpServers</code>-objektet og lagre. Cursor oppdager endringen uten omstart i de fleste tilfeller."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Plassering av konfigurasjonsfilen: <code>~/.cursor/mcp.json</code> (for alle prosjektene dine) eller <code>.cursor/mcp.json</code> i en bestemt prosjektmappe (bare for det prosjektet)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Egendefinerte MCP-servere i ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="Dialogen <strong>Add custom MCP server</strong> i ChatGPT kan bare koble til ved innlogging (OAuth) eller uten autentisering; den har ikke noe felt for API-nøkkel eller hode. OAuth-innlogging er slått av på dette nettstedet, så ChatGPT kan ikke koble til ennå. En Super User kan slå den på i innstillingene for MCP for J. Inntil da bruker du Codex (kodeagenten fra OpenAI), som sender API-nøkkelen fra en miljøvariabel."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Å legge til en egendefinert MCP-server krever et betalt ChatGPT-abonnement. Det virker med Plus (kontrollert oktober 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI og Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Både Gemini CLI (Googles KI-assistent for terminalen) og utvidelsen Gemini Code Assist (for VS Code / JetBrains) leser den samme MCP-konfigurasjonsfilen. To trinn: rediger filen for å legge til dette Joomla-nettstedet som en MCP-server, og start deretter Gemini på nytt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Du kan legge til serveren globalt (slik at alle Gemini-økter ser den) eller bare i én prosjektmappe. Utdraget er det samme &mdash; bare plasseringen av filen er forskjellig."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Åpne (eller opprett) innstillingsfilen for Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Velg en av disse to plasseringene:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Globalt (alle prosjekter):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Bare prosjektet:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (i en prosjektmappe)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Lim inn denne blokken i filen."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Hvis filen allerede har en <code>mcpServers</code>-seksjon, legger du til <code>&quot;joomla-...&quot;</code>-oppføringen i den eksisterende &mdash; ikke dupliser den ytre <code>mcpServers</code>-nøkkelen. Hvis filen er tom eller helt ny, limer du inn hele utdraget som det er."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini bruker <code>httpUrl</code> for HTTP-baserte MCP-servere (som denne) &mdash; det er forskjellig fra <code>url</code>-nøkkelen i Cursor. Kopier dette utdraget nøyaktig i stedet for å gjenbruke det for Cursor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Start Gemini på nytt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Avslutt og start <code>gemini</code> på nytt i terminalen, eller last VS Code- / JetBrains-vinduet på nytt. Skriv <code>/mcp</code> i Gemini CLI for å se de tilkoblede serverne og bekrefte at Joomla-nettstedet ditt er oppført."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="Nettappen <code>gemini.google.com</code> støtter ikke egendefinerte MCP-servere per august 2026 &mdash; denne veiledningen dekker bare Gemini CLI og Gemini Code Assist. Hvis Google legger til støtte i nettgrensesnittet senere, dokumenterer vi det her."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Andre KI-klienter med MCP-støtte (Cline, Continue, GitHub Copilot i agentmodus, Windsurf, mcp-cli osv.) virker også &mdash; tilkoblings-URL-en og API-nøkkelen er de samme, bare det nøyaktige stedet du limer dem inn, er forskjellig. Vi legger til konkrete veiledninger for flere klienter etter hvert; står du fast, har FAQ nedenfor generell veiledning."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Kopier"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Kopiert"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Kopiert (med nøkkelen din)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Sikkerhet og deling"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="API-nøkkelen din ER innloggingen &mdash; den som har den, kan gjøre alt Joomla-brukerkontoen din kan. Det finnes ingen anonym tilgang. Hvis du slår på <strong>OAuth-innlogging</strong>, kan en KI-app også koble til ved å sende deg til den vanlige innloggingssiden på dette nettstedet; den handler da som kontoen som logget inn, med nøyaktig den kontoens rettigheter, til du kobler den fra på oversikten."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Gi MCP-tilgang til andre"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Det er to måter å gjøre det på &mdash; velg det som passer:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Én nøkkel per person (sikrest)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Opprett en Joomla-bruker for hver person, plasser vedkommende i en gruppe med bare de rettighetene du vil gi (f.eks. skrivebeskyttet), generer en nøkkel for brukeren og send den privat. Hver person har sitt eget revisjonsspor; du kan trekke tilbake én enkelt nøkkel uten å påvirke de andre."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Én delt nøkkel (enklest, men minst sikker)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Opprett én begrenset bruker (f.eks. <code>mcp-demo-guest</code>) i en skrivebeskyttet gruppe, generer én nøkkel og del den bredere. Enklere å distribuere; vanskeligere å vite hvem som bruker den eller å trekke tilbake tilgangen for bare én person. Greit for en offentlig demo; ikke for sensitiv tilgang."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Trekke tilbake en nøkkel"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="For å få en eksisterende nøkkel til å slutte å virke umiddelbart går du til Brukere &rarr; den aktuelle brukeren &rarr; fanen Joomla API-token &rarr; klikk på <strong>Tilbakestill</strong>. Den gamle nøkkelen blir ugyldig i det du klikker. Gi den nye nøkkelen til vedkommende, eller la vedkommende stå uten tilgang."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Feilsøking"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Finn typen app du kobler til, og åpne deretter problemet som passer med det du ser. Feilmeldinger og blokkeringer i brannmurer kan dukke opp i alle apper, så de har sin egen gruppe til slutt."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&laquo;Unauthorized&raquo; eller &laquo;Authentication failed&raquo; (feil 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="KI-en din når nettstedet, men API-nøkkelen er ikke riktig. Kontroller: (1) nøkkelen er ikke tilbakestilt siden du kopierte den (hver tilbakestilling gjør den forrige nøkkelen ugyldig); (2) nøkkelen ble kopiert hel, uten manglende tegn eller ekstra mellomrom; (3) hvis du redigerte en konfigurasjonsfil, står ordet <code>Bearer </code> (med mellomrom etter) foran nøkkelen. Hvis du er usikker, genererer du en ny nøkkel og prøver igjen."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&laquo;Not Acceptable&raquo; eller &laquo;Could not match accept header&raquo; (feil 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Eldre versjoner av MCP for J (før 2.3.4) hadde en feil som hindret noen KI-klienter i å koble til. Oppdater MCP for J til siste versjon &mdash; sjekk System &rarr; Oppdater &rarr; Utvidelser i Joomla-administrasjonen."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&laquo;Tilkoblet, men ingen verktøy vises i KI-en&raquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Vanligvis er det én av tre ting: (1) brukerens gruppe har ikke <strong>Innlogging for nettjenester</strong> &mdash; angi det i System &rarr; Globale innstillinger &rarr; Rettigheter (bare Super Users har det som standard); (2) gruppen har ingen MCP-rettighet &mdash; Super Users har det alltid og Administrators gjennom Joomlas standardinnstillinger, men Managere og andre grupper trenger Bruke MCP-endepunktet (og Skrive gjennom MCP-endepunktet for endringer) under Innstillinger &rarr; Rettigheter for denne komponenten; (3) KI-klienten har bufret en tom verktøyliste &mdash; koble MCP-serveren fra og til igjen i klienten for å tvinge en ny kontroll."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&laquo;Not Found&raquo;, eller URL-en gir en feil (feil 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Enten er URL-en feil (kontroller den &mdash; den skal slutte med <code>/api/index.php/v1/mcp</code>), ELLER programtillegget for nettjenester for MCP er deaktivert på Joomla-nettstedet ditt. I Joomla-administrasjonen: System &rarr; Administrer &rarr; Utvidelser &rarr; søk etter <code>csmcpforj</code> &rarr; kontroller at programtillegget Web Services er aktivert. Hvis det allerede er aktivert, kan <code>.htaccess</code>-filen på nettstedet blokkere stien <code>/api/</code> &mdash; et problem hos vertsleverandøren eller med et sikkerhetstillegg."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&laquo;Forbidden&raquo; eller &laquo;Malware detected&raquo; (feil 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Et sikkerhetstillegg på Joomla-nettstedet ditt (RSFirewall, Admin Tools Pro, Securitycheck Pro) blokkerer MCP-forespørselen. I RSFirewall legger du til to unntak: <code>csmcpforj_oauth</code>, og <code>api\/index\.php\/v1\/mcp</code> som regulært uttrykk (det første er for innlogging). I de andre tillater du <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> og URL-er som inneholder <code>csmcpforj_oauth</code>. For å bekrefte årsaken slår du av sikkerhetstillegget et øyeblikk, prøver igjen og slår det på igjen med unntakene på plass. Knappen <strong>Kontroller tilkoblingen</strong> på oversikten viser hvilken adresse som er blokkert."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Knappen &laquo;Edit Config&raquo; i Claude Desktop gjør ingenting når jeg klikker på den"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Den knappen prøver å gi <code>claude_desktop_config.json</code> til programmet datamaskinen din åpner <code>.json</code>-filer med. Hvis du ikke har satt opp det, gjør knappen stille ingenting. Løsning: åpne filen selv i et hvilket som helst tekstredigeringsprogram. Stier per operativsystem står i Claude-delen under Avansert ovenfor. Hvis filen ikke finnes ennå, oppretter du den og bruker utdraget fra den delen som hele innholdet (pakk utdraget inn som <code>{&quot;mcpServers&quot;: { ... }}</code>). Ingen endringer av tillatelser er nødvendig &mdash; filen ligger i din egen brukermappe."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="Dialogen &laquo;Add custom connector&raquo; i Claude eller &laquo;Add custom MCP server&raquo; i ChatGPT har ikke noe felt for API-nøkkelen"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Disse dialogene er laget for å koble til ved innlogging (OAuth); det finnes ikke noe sted å lime inn en API-nøkkel for MCP for J. Dette nettstedet har OAuth-innlogging slått av. En Super User kan slå det på under Komponenter &rarr; MCP for J &rarr; Innstillinger &rarr; <strong>OAuth-innlogging</strong>, og da virker begge dialogene. Inntil da: Claude Desktop kan bruke metoden med wrapper-skript ovenfor, claude.ai det enkle oppsettet, og ChatGPT-brukere Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop viser &laquo;Some MCP servers could not be loaded&raquo; ved oppstart"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (august 2026) strammet inn valideringen av konfigurasjonsfilen og avviser nå oppføringer der kommandoargumentene ser ut til å kunne inneholde legitimasjon. Dette blokkerer de to opplagte måtene å konfigurere en MCP-server med Bearer-token direkte i <code>claude_desktop_config.json</code>: den innebygde formen <code>type: http</code> OG å sende <code>mcp-remote</code> med argumentet <code>--header &quot;Authorization: Bearer ...&quot;</code>. Begge ser riktige ut i konfigurasjonsfilen, men skjemavalidatoren i Claude Desktop forkaster dem ved innlasting. <strong>Løsning:</strong> bruk metoden med wrapper-skript som er beskrevet i Claude-delen under Avansert ovenfor &mdash; legg hele kommandoen i en liten <code>.cmd</code>-fil, og la konfigurasjonen til Claude Desktop bare vise til filen. Claude Desktop ser en vanlig kommando uten synlige argumenter og godtar den. API-nøkkelen din er like trygg som før &mdash; wrapper-filen ligger i din egen brukermappe."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Jeg startet Claude Desktop på nytt, men den ser fortsatt ikke den nye tilkoblingen"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="I Windows skjuler lukking av Claude Desktop-vinduet bare appen i systemstatusfeltet &mdash; hele appen fortsetter å kjøre med den GAMLE konfigurasjonen i minnet. Å klikke på ikonet på oppgavelinjen senere henter bare vinduet tilbake fra den allerede kjørende prosessen. Claude Desktop leser konfigurasjonsfilen på nytt bare ved en ekte omstart av appen. Slik starter du den virkelig på nytt: høyreklikk på Claude-ikonet i systemstatusfeltet (nederst til høyre, du må kanskje klikke på den lille pilen opp for å se skjulte ikoner) &rarr; velg <strong>Quit</strong> &rarr; vent ca. 3 sekunder til prosessen er helt avsluttet &rarr; start Claude Desktop igjen fra Start-menyen. Først da trer endringene i konfigurasjonsfilen i kraft."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Vanlige spørsmål"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Kan noen bruke denne tilkoblingen uten en API-nøkkel?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="Nei. Alle forespørsler må ha en gyldig API-nøkkel, eller et OAuth-tilgangstoken hvis OAuth-innlogging er slått på. Forespørsler uten avvises. Dette er med vilje &mdash; KI-en kan utføre reelle handlinger på nettstedet ditt (opprette artikler, redigere brukere osv.), så anonym tilgang ville vært en sikkerhetskatastrofe."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Kan én Joomla-bruker ha flere aktive API-nøkler?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="Nei. Joomla lagrer nøyaktig én API-nøkkel per bruker. Å klikke på Tilbakestill genererer en ny og gjør den gamle ugyldig. Hvis du trenger flere nøkler (én per enhet, én per KI-verktøy osv.), oppretter du separate Joomla-brukere."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Er det en grense for hvor mye jeg kan bruke det?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="MCP for J har ingen hastighetsgrense i seg selv. Vanlige grenser hos vertsleverandøren gjelder (PHP-minne, MariaDB-tilkoblinger osv.). Hvis du genererer tung trafikk (store satsvise operasjoner på mange nettsteder), kan du snakke med vertsleverandøren om å øke samtidigheten i PHP-FPM."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Må jeg åpne porter i brannmuren eller konfigurere noe spesielt?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="Nei. MCP bruker bare vanlig HTTPS på port 443. Hvis nettstedet ditt allerede er offentlig tilgjengelig på <code>https://yoursite.com/</code>, kan MCP-endepunktet nås fra alle KI-klienter på internett uten ekstra oppsett."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="Hvordan bytter (roterer) jeg API-nøkkelen min regelmessig?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Det finnes ingen automatisk planlegger &mdash; du roterer manuelt når du vil. Gå til Brukere &rarr; brukeren &rarr; fanen Joomla API-token &rarr; klikk på Tilbakestill. Oppdater deretter konfigurasjonen til KI-klienten med den nye nøkkelen. God vane: roter alle nøkler som noen gang har vært synlige i et skjermbilde, en logg eller en feilrapport."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Jeg bruker en KI-klient som ikke står ovenfor &mdash; vil den virke?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Nesten helt sikkert, så lenge den støtter standard MCP over HTTPS og enten lar deg legge til et eget Authorization-hode eller kan logge inn med OAuth (slå på OAuth-innlogging i Innstillinger). URL-en er den samme overalt &mdash; bare oppsettsgrensesnittet i klienten er forskjellig. Klienter vi vet virker, men som vi ikke har skrevet trinnvise veiledninger for: Continue.dev, Windsurf, Zed-editoren, mcp-cli, MCP Inspector, LibreChat, Open WebUI (via <code>mcpo</code>-broen) og diverse Ollama-baserte agenter."

