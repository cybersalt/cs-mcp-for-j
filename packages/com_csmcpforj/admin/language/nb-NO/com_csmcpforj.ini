COM_CSMCPFORJ_CONFIG_CATALOG_URL_DESC="Hvor katalogen over MCP-tillegg hentes fra. La standardverdien stå med mindre du kjører et privat speil av katalogen; en ren basis-URL får /catalog.json lagt til."
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="Levetid for katalogbuffer (timer)"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="Hvor lenge den hentede catalog.json bufres før den hentes på nytt. En manuell oppdateringsknapp på katalogsiden omgår dette. Område 1&ndash;168 (én uke)."
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="Vis utilgjengelige Pro-tillegg"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Vis Pro-tillegg i katalogen selv om du for øyeblikket ikke har Pro-medlemskap. Nyttig for å se hva som finnes; sett til Nei for å skjule dem helt."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Kontroller medlemskapet på nytt hvert (sekunder)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="Hvor ofte oversikten spør cybersalt.com på nytt om den koblede e-postadressen fortsatt har Pro-tilgang. 86400 = én gang om dagen (anbefalt). Minimum 60, maksimum 604800 = én gang i uken."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="MCP-server"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Kontroller på serversiden for MCP-endepunktet. Påvirker hva MCP-klienter ser og kan kalle."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Skrivebeskyttet modus"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="Når JA, kunngjør og godtar MCP-endepunktet bare verktøy som MCP ToolAnnotations angir som skrivebeskyttet (list_*, get_*, read_*, check_*, validate_*, fetch_* og joomla_update_healthcheck). Nyttig når du vil at en KI-klient skal utforske nettstedet uten å kunne endre innhold. Skriving gir en feil som forklarer at serveren er i skrivebeskyttet modus. Innstillingen er et gulv: en MCP-klient kan også sende ?read_only=1 på endepunkt-URL-en for å begrense ytterligere, men kan ikke LÅSE OPP skriving på et nettsted som har dette satt til JA."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Personvern ved skjermopptak"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Kontroller for beskyttelse av hemmeligheter med uskarphet på oversikten (Joomla API-token i forhåndsvisningen av prompten, e-post for Pro-medlemskap). Uskarphet er på som standard; disse alternativene justerer visning ved å holde musen over, slik at en tilfeldig musebevegelse ikke avslører hemmeligheten ved skjermdeling eller skjermopptak."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Forsinkelse før visning ved musepeker (sekunder)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Hvor mange sekunder du må holde musepekeren over en uskarp hemmelighet før den vises. En liten nedtelling vises ved siden av hemmeligheten mens du holder pekeren der, så du vet at tidtakeren går. Flytter du musen bort, avbrytes visningen og tidtakeren nullstilles &mdash; neste gang starter en ny nedtelling i full lengde. Sett til 0 for å vise umiddelbart (fjerner beskyttelsen mot tilfeldig musebevegelse, men gir tilbake den klassiske oppførselen). Standard 3 sekunder."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Skjul automatisk etter visning (sekunder)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Når en hemmelighet er vist ved å holde musepekeren over den, hvor mange sekunder den forblir synlig før den automatisk blir uskarp igjen &mdash; selv om musen fortsatt er over den. Ekstra sikring for situasjoner der du &laquo;kikket, leste og så ble avbrutt&raquo;, der en nettleser uten tilsyn ellers kunne latt hemmeligheten stå synlig på ubestemt tid. Flytter du musen bort, blir den alltid uskarp umiddelbart uansett denne innstillingen. Sett til 0 for å slå av automatisk skjuling (viste hemmeligheter forblir synlige til du flytter musen). Standard 8 sekunder &mdash; lenge nok til å lese et helt base64-token i ro og mak, kort nok til at en økt uten tilsyn ikke avslører hemmeligheten."

