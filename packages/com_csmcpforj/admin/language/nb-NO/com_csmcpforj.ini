COM_CSMCPFORJ_DASHBOARD_CLAUDE_CHECKLIST_LINK="Kobler du til claude.ai? Gå gjennom sjekklisten &rarr;"
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_TITLE="403, 503 eller &laquo;Malware detected&raquo; fra nettstedet"
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_BODY="En brannmur blokkerer forespørselen før MCP for J ser den. Klikk på <strong>Kontroller tilkoblingen</strong> ovenfor for å se hvilken adresse som er blokkert. I RSFirewall legger du til unntak for <code>csmcpforj_oauth</code> og <code>api\/index\.php\/v1\/mcp</code> (regulært uttrykk). Brannmurer hos vertsleverandøren (o2switch TigerProtect, Imunify360) må tillate de samme adressene. <strong>Cloudflare</strong>: Browser Integrity Check og Security Level kan blokkere appenes servere. Legg til en egendefinert WAF-regel (Security &rarr; WAF &rarr; Custom rules) med handlingen <strong>Skip</strong> for forespørsler der URI-stien inneholder <code>/api/index.php/v1/mcp</code> eller <code>/.well-known/oauth-</code>, eller der spørrestrengen inneholder <code>csmcpforj_oauth</code>, og kryss av for <em>Browser Integrity Check</em> og <em>Security Level</em>. Bot Fight Mode kan ikke hoppes over med en regel, så slå den av hvis den blokkerer."
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_CLAUDE_TITLE="claude.ai sier &laquo;cannot register&raquo;, eller autorisasjonen mislyktes"

; Check connection (#2). The details are shown as plain text, so no HTML or entities in them.
COM_CSMCPFORJ_CHECK_HINT="Kontroller at KI-apper kan nå dette nettstedet. Nettserveren spør sin egen offentlige adresse om det samme som en app spør om når den kobler til. Ingenting endres."
COM_CSMCPFORJ_CHECK_BTN="Kontroller tilkoblingen"
COM_CSMCPFORJ_CHECK_RUNNING="Kontrollerer..."
COM_CSMCPFORJ_CHECK_FAILED="Selve kontrollen mislyktes. Last inn siden på nytt og prøv igjen."
COM_CSMCPFORJ_CHECK_ENDPOINT="MCP-endepunkt"
COM_CSMCPFORJ_CHECK_DISCOVERY="Innloggingsdetaljer (/.well-known/oauth-protected-resource)"
COM_CSMCPFORJ_CHECK_OAUTH_ENDPOINTS="Innloggingsendepunkter (index.php?csmcpforj_oauth=...)"
COM_CSMCPFORJ_CHECK_OK_ENDPOINT="Kan nås. Det ber apper logge inn eller sende et token, slik det skal."
COM_CSMCPFORJ_CHECK_OK_DISCOVERY="Kan nås. Apper kan finne ut hvordan de logger inn."
COM_CSMCPFORJ_CHECK_OK_OAUTH="Kan nås. Apper kan logge inn her."
COM_CSMCPFORJ_CHECK_OK_OFF="Kan nås. Det sier til apper at innlogging er slått av, noe som er riktig så lenge OAuth-innlogging er av."
COM_CSMCPFORJ_CHECK_REDIRECT="Omdirigert (HTTP %d) til %s. KI-apper må bruke nøyaktig den adressen nettstedet svarer på, uten omdirigering. Bruk den adressen i appen, eller endre nettstedet så det ikke omdirigerer."
COM_CSMCPFORJ_CHECK_UNEXPECTED="Noe annet enn MCP for J svarte (HTTP %d): '%s'. En brannmur er den vanlige årsaken; se Feilsøking nedenfor."
COM_CSMCPFORJ_CHECK_CLOUDFLARE="Dette nettstedet ligger bak Cloudflare. Hvis svaret er en Cloudflare-side, legger du til en egendefinert WAF-regel med handlingen Skip for MCP- og innloggingsadressene, og krysser av for Browser Integrity Check og Security Level (se Feilsøking nedenfor)."
COM_CSMCPFORJ_CHECK_UNREACHABLE="Nettserveren kunne ikke nå sin egen offentlige adresse (%s). Noen vertsleverandører tillater ikke det, så denne kontrollen kan ikke avgjøre det. Prøv å koble til fra appen og se i Logger."

; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Brannmur og URL-utvidelser"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall er slått på."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="Den kan blokkere MCP-forespørsler (&laquo;403 Access Forbidden &mdash; Malware detected&raquo;) og innloggingen til claude.ai. I RSFirewall legger du til to unntak: <code>csmcpforj_oauth</code>, og <code>api\/index\.php\/v1\/mcp</code> som regulært uttrykk."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools er slått på."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="Web Application Firewall i programmet kan blokkere MCP-forespørsler og innloggingen. Hvis <strong>Kontroller tilkoblingen</strong> viser en blokkering, finner du regelen i Blocked Requests Log i Admin Tools og legger til et WAF-unntak, eller slår av den regelen. Tillat <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> og URL-er som inneholder <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck er slått på."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="Brannmuren kan blokkere MCP-forespørsler og innloggingen. Hvis <strong>Kontroller tilkoblingen</strong> viser en blokkering, finner du forespørselen i loggene og legger til et unntak for <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> og URL-er som inneholder <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 er slått på."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Denne SEO-utvidelsen kan fange opp innloggingsadressene (<code>index.php?csmcpforj_oauth=&hellip;</code>) og svare med forsiden, slik at claude.ai eller ChatGPT ikke kan registrere seg og ikke oppgir noen tydelig grunn. Hvis <strong>Kontroller tilkoblingen</strong> viser forsiden for innloggingsendepunktene, utelater du URL-er som inneholder <code>csmcpforj_oauth</code> i Route 66, eller slår av systemprogramtillegget."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Brannmurer hos vertsleverandøren kan også blokkere: o2switch TigerProtect svarer 503, og regler i Imunify360, ModSecurity eller Cloudflare svarer 403. Be vertsleverandøren om å tillate adressene ovenfor, eller om å slippe gjennom serverne til Anthropic (<code>160.79.104.0/21</code>) for claude.ai. <strong>Cloudflare</strong>: Browser Integrity Check og Security Level kan blokkere appenes servere. Legg til en egendefinert WAF-regel (Security &rarr; WAF &rarr; Custom rules) med handlingen <strong>Skip</strong> for forespørsler der URI-stien inneholder <code>/api/index.php/v1/mcp</code> eller <code>/.well-known/oauth-</code>, eller der spørrestrengen inneholder <code>csmcpforj_oauth</code>, og kryss av for <em>Browser Integrity Check</em> og <em>Security Level</em>. Bot Fight Mode kan ikke hoppes over med en regel, så slå den av hvis den blokkerer."

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Sjekkliste for claude.ai: &laquo;cannot register&raquo;, &laquo;Authorization failed&raquo; eller &laquo;Couldn't reach the MCP server&raquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Gå gjennom disse i rekkefølge. Hver av dem har kostet noen timer."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Bruk nøyaktig denne adressen: <code>%s</code>. Med eller uten <em>www</em> må stemme med hvordan nettstedet svarer, <strong>uten omdirigering</strong> imellom (fra www til det rene domenet, eller fra http til https). Knappen <strong>Kontroller tilkoblingen</strong> på oversikten varsler om en omdirigering."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="OAuth-innlogging er slått på på dette nettstedet. claude.ai kan bare koble til ved innlogging, så dette må forbli på."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>OAuth-innlogging er slått av på dette nettstedet.</strong> claude.ai kan bare koble til ved innlogging, så en Super User må slå det på først: Komponenter &rarr; MCP for J &rarr; Innstillinger &rarr; <strong>OAuth-innlogging</strong>. Mens det er av, sier claude.ai &laquo;cannot register&raquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="I dialogen <strong>Add custom connector</strong> velger du <strong>Sign in now</strong>. For OAuth-klienten virker både <strong>Use Claude's published identity</strong> og <strong>Register automatically</strong> (den publiserte identiteten krever PHP-utvidelsen curl på serveren). La klient-ID og hemmelighet stå tomme. Hvis én måte mislykkes, fjerner du koblingen og legger den til på nytt med den andre."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>Ikke legg til forespørselshoder.</strong> claude.ai godtar ikke et <code>X-Joomla-Token</code>-hode, så en API-nøkkel kan ikke brukes der. Innlogging er den eneste veien inn fra claude.ai."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Brannmurer må slippe gjennom serverne til claude.ai. De kobler til fra <code>160.79.104.0/21</code>, ikke fra nettleseren din. RSFirewall trenger to unntak: <code>csmcpforj_oauth</code>, og <code>api\/index\.php\/v1\/mcp</code> som regulært uttrykk. Admin Tools, Securitycheck og brannmurer hos vertsleverandøren, som o2switch TigerProtect (som svarer 503), kan også blokkere. <strong>Cloudflare</strong>: Browser Integrity Check og Security Level kan blokkere appenes servere. Legg til en egendefinert WAF-regel (Security &rarr; WAF &rarr; Custom rules) med handlingen <strong>Skip</strong> for forespørsler der URI-stien inneholder <code>/api/index.php/v1/mcp</code> eller <code>/.well-known/oauth-</code>, eller der spørrestrengen inneholder <code>csmcpforj_oauth</code>, og kryss av for <em>Browser Integrity Check</em> og <em>Security Level</em>. Bot Fight Mode kan ikke hoppes over med en regel, så slå den av hvis den blokkerer. Knappen <strong>Kontroller tilkoblingen</strong> på oversikten viser hva som svarer."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> og andre SEO-utvidelser som skriver om URL-er, kan fange opp innloggingsadressene (<code>index.php?csmcpforj_oauth=&hellip;</code>) og svare med forsiden, slik at appen ikke kan registrere seg og ikke oppgir noen tydelig grunn. Hvis <strong>Kontroller tilkoblingen</strong> viser forsiden for innloggingsendepunktene, utelater du URL-er som inneholder <code>csmcpforj_oauth</code> i den utvidelsen, eller slår av systemprogramtillegget dens."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Logg inn med en konto som har lov til å bruke MCP (se <em>Hvem kan bruke dette endepunktet?</em> på oversikten). Hvis det bare mislykkes for én person, kontrollerer du at kontoen ikke er blokkert og ikke er satt til <em>Krev tilbakestilling av passord</em>."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="Står du fortsatt fast? Komponenter &rarr; MCP for J &rarr; <strong>Logger</strong> viser hvert trinn i innloggingen, og hvorfor et trinn ble avvist."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_JUMP="Gå til:"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_LOGIN="claude.ai, ChatGPT og andre apper som kobler til ved å logge inn"
