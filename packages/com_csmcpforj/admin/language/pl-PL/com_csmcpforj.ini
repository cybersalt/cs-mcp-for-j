; Component config — catalog fieldset
COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_LABEL="Katalog"
COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_DESC="Ustawienia przeglądarki katalogu add-onów MCP."
COM_CSMCPFORJ_CONFIG_CATALOG_URL_LABEL="Adres URL źródła katalogu"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_DESC="Skąd pobierany jest katalog add-onów MCP. Zostaw wartość domyślną, chyba że prowadzisz prywatną kopię lustrzaną katalogu; do samego bazowego adresu URL dopisywane jest /catalog.json."
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="Czas przechowywania katalogu w pamięci podręcznej (godziny)"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="Jak długo pobrany catalog.json jest przechowywany w pamięci podręcznej, zanim zostanie pobrany ponownie. Przycisk odświeżania na stronie katalogu to pomija. Zakres 1&ndash;168 (jeden tydzień)."
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="Pokazuj niedostępne add-ony Pro"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Pokazuje add-ony Pro w katalogu, nawet jeśli nie masz teraz subskrypcji Pro. Przydatne, by zobaczyć, co jest dostępne; wybierz Nie, aby je całkowicie ukryć."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Ponownie sprawdzaj subskrypcję co (sekundy)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="Jak często panel ponownie pyta cybersalt.com, czy powiązany adres e-mail nadal ma dostęp Pro. 86400 = raz dziennie (zalecane). Minimum 60, maksimum 604800 = raz w tygodniu."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="Serwer MCP"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Ustawienia po stronie serwera dla punktu końcowego MCP. Określają, co klienci MCP widzą i mogą wywołać."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Tryb tylko do odczytu"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="Gdy TAK, punkt końcowy MCP ogłasza i przyjmuje tylko narzędzia, które w swoich MCP ToolAnnotations są oznaczone jako tylko do odczytu (list_*, get_*, read_*, check_*, validate_*, fetch_*, a także joomla_update_healthcheck). Przydatne, gdy klient AI ma przeglądać witrynę bez możliwości zmiany treści. Próby zapisu zwracają błąd z wyjaśnieniem, że serwer działa w trybie tylko do odczytu. To ustawienie jest dolną granicą: klient MCP może też dodać ?read_only=1 do adresu punktu końcowego, aby ograniczyć się jeszcze bardziej, ale NIE może odblokować zapisu w witrynie, w której tu ustawiono TAK."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Prywatność przy nagrywaniu ekranu"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Ustawienia rozmywania sekretów na panelu (token API Joomla w podglądzie promptu, adres e-mail subskrypcji Pro). Rozmycie jest domyślnie włączone; te opcje dostrajają pokazywanie po najechaniu, aby przypadkowy ruch myszą nie odsłonił sekretu podczas udostępniania lub nagrywania ekranu."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Opóźnienie pokazania po najechaniu (sekundy)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Ile sekund trzeba trzymać kursor nad rozmytym sekretem, zanim zostanie pokazany. Podczas trzymania obok sekretu widać małe odliczanie, aby było jasne, że licznik biegnie. Odsunięcie myszy anuluje pokazanie i zeruje licznik &mdash; przy następnym najechaniu odliczanie zaczyna się od nowa. Ustaw 0, aby pokazywać od razu po najechaniu (usuwa to ochronę przed przypadkowym najechaniem, ale przywraca klasyczne działanie). Domyślnie 3 sekundy."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Automatyczne ukrycie po pokazaniu (sekundy)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Ile sekund sekret pokazany po najechaniu pozostaje widoczny, zanim zostanie automatycznie znowu rozmyty &mdash; nawet jeśli mysz nadal nad nim jest. Dodatkowe zabezpieczenie na sytuacje typu &ldquo;zerknąłem, przeczytałem i coś mnie rozproszyło&rdquo;, w których pozostawiona bez opieki przeglądarka w przeciwnym razie pokazywałaby sekret bez końca. Odsunięcie myszy zawsze od razu go rozmywa, niezależnie od tego ustawienia. Ustaw 0, aby wyłączyć automatyczne ukrywanie (pokazane sekrety pozostają widoczne, dopóki nie odsuniesz myszy). Domyślnie 8 sekund &mdash; wystarczająco, by spokojnie przeczytać cały token base64, i na tyle krótko, by pozostawiona bez opieki sesja nie odsłoniła sekretu."

