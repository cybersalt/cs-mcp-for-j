COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Lista kontrolna claude.ai: &ldquo;cannot register&rdquo;, &ldquo;Authorization failed&rdquo; lub &ldquo;Couldn't reach the MCP server&rdquo;"
