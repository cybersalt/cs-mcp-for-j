; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Kto może używać tego punktu końcowego?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="Uprawnienia są sprawdzane dla konta użytkownika Joomla, do którego należy token API. Klient MCP (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl lub dowolny inny) tylko przekazuje żądania &mdash; ten sam token działa tak samo w każdym kliencie."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Ważne:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Osoba, która generuje token, dostaje przez punkt końcowy MCP taki sam dostęp, jaki ma w każdym innym miejscu panelu administracyjnego Joomla. Generuj tokeny tylko dla użytkowników, którym powierzył(a)byś te czynności bezpośrednio."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Grupa użytkowników Joomla"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Działa od razu?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Dlaczego"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Tak"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Wymaga wyraźnego uprawnienia"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Super User w Joomla zawsze przechodzi każde sprawdzenie uprawnień."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Ma core.manage dzięki domyślnym uprawnieniom Joomla, co kontrola MCP akceptuje dla narzędzi odczytu i zapisu (narzędzia zmieniające uprawnienia, rozszerzenia, ustawienia dodatków lub samą Joomla nadal wymagają Super User) &mdash; ale grupa wciąż potrzebuje uprawnienia <strong>Logowanie do usług internetowych</strong>, zanim Joomla w ogóle pozwoli jej się uwierzytelnić."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="Domyślnie nie ma uprawnień MCP. Nadaj grupie <strong>Logowanie do usług internetowych</strong> w System &rarr; Konfiguracja globalna &rarr; Uprawnienia, a następnie Używanie punktu końcowego MCP i (opcjonalnie) Zapis przez punkt końcowy MCP w <strong>Opcje &rarr; Uprawnienia</strong> tego komponentu."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Wymaga Logowania do usług internetowych"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Zanim cokolwiek z tego zadziała:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla chroni całe API osobnym uprawnieniem o nazwie <strong>Logowanie do usług internetowych</strong> (<code>core.login.api</code>), a <strong>domyślnie ma je tylko Super User</strong>. Każda inna grupa &mdash; również Administrator i Manager &mdash; dostaje <code>403 Forbidden</code> od każdego narzędzia, dopóki go nie nadasz, niezależnie od tego, co jeszcze może robić w panelu administracyjnym. Ustaw je w <strong>System &rarr; Konfiguracja globalna &rarr; Uprawnienia</strong>, dla grupy, a nie dla tego komponentu."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / własna grupa"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Nadaj grupie <strong>Logowanie do usług internetowych</strong> w System &rarr; Konfiguracja globalna &rarr; Uprawnienia, a następnie Używanie punktu końcowego MCP i (opcjonalnie) Zapis przez punkt końcowy MCP w <strong>Opcje &rarr; Uprawnienia</strong> tego komponentu."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Podłącz asystenta AI do tej witryny"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Są dwa sposoby. Pierwszy (skopiuj i wklej prompt) jest najprostszy &mdash; działa bez konfigurowania klienta, a gdy AI potwierdzi, że wszystko działa, zwykle zaproponuje zainstalowanie tej witryny jako stałego konektora, bez ręcznej edycji JSON. Drugi jest dla osób, które wolą samodzielnie edytować konfigurację klienta."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Skopiuj prompt konfiguracyjny (zalecane)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Wklej prompt konfiguracyjny do swojego asystenta AI"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Nie trzeba konfigurować klienta. Skopiuj poniższy prompt do nowej rozmowy z asystentem AI (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini itd.). AI wykona testowe zapytanie curl, potwierdzi połączenie i &mdash; w klientach, które to obsługują &mdash; zaproponuje utrwalenie połączenia, bez edycji plików JSON i bez zapamiętywania poleceń terminala."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Bonus:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Jeśli Twój klient AI ma narzędzie powłoki (Codex, Claude Code, Cursor Composer, Cline, Continue, tryb agenta GitHub Copilot itd.), prompt zawiera propozycję samoinstalacji. Po prostu napisz &lsquo;zrób to na stałe&rsquo;, gdy AI potwierdzi, że połączenie działa, a uruchomi ono odpowiednie dla klienta polecenie rejestracji serwera MCP (na przykład <code>codex mcp add</code> albo <code>claude mcp add</code>). Po ponownym uruchomieniu klienta ta witryna pojawi się jako natywne narzędzia MCP w każdej rozmowie &mdash; prompt nie będzie już nigdy potrzebny."
