COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_BODY="Zapora blokuje żądanie, zanim zobaczy je MCP for J. Kliknij powyżej <strong>Sprawdź połączenie</strong>, aby zobaczyć, który adres jest blokowany. W RSFirewall dodaj wyjątki dla <code>csmcpforj_oauth</code> i <code>api\/index\.php\/v1\/mcp</code> (wyrażenie regularne). Zapory hostingu (o2switch TigerProtect, Imunify360) muszą zezwalać na te same adresy. <strong>Cloudflare</strong>: Browser Integrity Check i Security Level mogą blokować serwery aplikacji. Dodaj własną regułę WAF (Security &rarr; WAF &rarr; Custom rules) z akcją <strong>Skip</strong> dla żądań, których ścieżka URI zawiera <code>/api/index.php/v1/mcp</code> lub <code>/.well-known/oauth-</code> albo których query string zawiera <code>csmcpforj_oauth</code>, i zaznacz <em>Browser Integrity Check</em> oraz <em>Security Level</em>. Bot Fight Mode nie da się pominąć regułą, więc wyłącz go, jeśli blokuje."
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_CLAUDE_TITLE="claude.ai zgłasza &ldquo;cannot register&rdquo; albo autoryzacja się nie udała"

