COM_CSMCPFORJ_SUPPORT_BANNER_PRO_HEADING="Masz aktywną subskrypcję MCP for J Pro &mdash; dziękujemy!"
COM_CSMCPFORJ_SUPPORT_BANNER_PRO_BODY="Subskrybenci Pro mają wsparcie priorytetowe. Twoje zgłoszenia trafiają do nas z oznaczeniem Pro, więc widzimy je jako pierwsze i odpowiadamy możliwie szybko. Pytaj o cokolwiek &mdash; zgłoszenia błędów, prośby o funkcje, pytania, pomysły &mdash; wszystko mile widziane."

COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_HEADING="Chętnie się od Ciebie dowiemy"
COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_BODY="Przysyłaj nam zgłoszenia błędów, prośby o funkcje, pytania i pomysły &mdash; czytamy każde i doceniamy opinie. Wsparcie dla wersji darmowej jest udzielane w miarę możliwości (nasze zasoby na darmowe wsparcie są ograniczone), więc odpowiedź może chwilę potrwać. Jeśli potrzebujesz gwarantowanego czasu odpowiedzi lub priorytetowej uwagi, rozważ %ssubskrypcję MCP for J Pro%s."

COM_CSMCPFORJ_SUPPORT_FORM_HEADING="Napisz do nas"
COM_CSMCPFORJ_SUPPORT_FORM_INTRO="Twoja wiadomość trafia bezpośrednio na <code>support@cybersalt.com</code>. Dane o środowisku (adres URL Twojej witryny, wersja MCP for J, wersje Joomla i PHP, zainstalowane add-ony i stan Twojej subskrypcji Pro) są dołączane automatycznie, abyśmy mogli szybciej pomóc &mdash; pełną listę widać na pasku bocznym."

COM_CSMCPFORJ_SUPPORT_FIELD_TYPE_LABEL="Jaki to rodzaj wiadomości?"
COM_CSMCPFORJ_SUPPORT_FIELD_TYPE_HINT="Wybierz to, co najlepiej pasuje &mdash; dalej sami przekażemy sprawę."
COM_CSMCPFORJ_SUPPORT_TYPE_BUG="🐛 Zgłoszenie błędu &mdash; coś nie działa"
COM_CSMCPFORJ_SUPPORT_TYPE_FEATURE="✨ Prośba o funkcję &mdash; coś nowego, czego bym chciał(a)"
COM_CSMCPFORJ_SUPPORT_TYPE_QUESTION="❓ Pytanie &mdash; potrzebuję pomocy, żeby coś zrozumieć"
COM_CSMCPFORJ_SUPPORT_TYPE_IDEA="💡 Pomysł &mdash; myśl, którą chcę się podzielić"
COM_CSMCPFORJ_SUPPORT_TYPE_OTHER="💬 Inne &mdash; coś innego"

