COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="Konektor MCP (konfiguracja ręczna)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="Dodaj ręcznie jako konektor MCP"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="Dla Claude Desktop (plik konfiguracyjny), Claude Code, Cursor, Codex, Cline, Copilot, Gemini CLI lub dowolnego klienta, którego konfigurację wolisz edytować bezpośrednio. Konfiguruje się raz i działa we wszystkich rozmowach. (Własne konektory claude.ai i ChatGPT nie mogą wysłać klucza API: łączą się przez logowanie. Zobacz <strong>Połącz przez logowanie (OAuth)</strong> na tej stronie.)"
