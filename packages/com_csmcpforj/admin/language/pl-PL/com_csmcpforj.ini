COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="Przewodnik konfiguracji"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="Przewodnik konfiguracji"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for J — Przewodnik konfiguracji"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Podłącz AI do tej witryny Joomla"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for J ma ułatwić podłączenie do Twojej witryny Joomla asystenta AI, takiego jak Codex, Claude, ChatGPT czy Cursor &mdash; aby AI mogło czytać Twoje artykuły, zarządzać użytkownikami, publikować treści i nie tylko, wszystko w zwykłym czacie AI. Nie trzeba mieć wiedzy technicznej. Prosty sposób poniżej wystarczy większości osób; opcje zaawansowane są niżej na stronie, jeśli będą potrzebne."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ Prosty sposób"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Bez plików konfiguracyjnych. Bez nagłówków. Bez żargonu. Po prostu skopiuj gotowy prompt konfiguracyjny z panelu i wklej go do nowego czatu z AI. Resztą zajmie się AI &mdash; sprawdzi połączenie i w klientach, które to obsługują, zaproponuje zapisanie go na stałe."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Zdobądź swój klucz API</strong> (osobiste hasło, które pozwala Twojemu AI działać w tej witrynie). Jeśli go jeszcze nie masz, instrukcja jest poniżej."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Przejdź do panelu</strong> (przycisk poniżej) i wklej tam swój klucz API w pole."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Kliknij przycisk &ldquo;Kopiuj prompt&rdquo;</strong> w panelu. Twój klucz jest automatycznie wstawiany do promptu przed skopiowaniem."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Wklej go do nowego czatu</strong> z AI (Claude, ChatGPT, Cursor, Copilot, Gemini itd.) i wyślij. AI potwierdzi, że połączenie działa, i zaproponuje jego zapisanie."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Przejdź do panelu"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="To wszystko. Twoje AI jest podłączone. Jeśli chcesz dowiedzieć się więcej o tym, jak to wszystko działa, albo wolisz skonfigurować AI ręcznie, czytaj dalej &mdash; ale nie musisz."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Zdobądź swój klucz API"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="<strong>Klucz API</strong> to osobiste hasło, które pozwala Twojemu AI działać w tej witrynie Joomla jako TY. Każdy, kto ma klucz, może zrobić wszystko, co może Twoje konto użytkownika Joomla &mdash; traktuj go więc jako poufny. Oto jak go wygenerować:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sKliknij tutaj, aby otworzyć swój profil użytkownika Joomla%s. Otworzy się w nowej karcie. Znajdź tam kartę o nazwie <strong>Token Joomla</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="Na tej karcie kliknij przycisk <strong>Wyczyść</strong>. Joomla wygeneruje długi ciąg liter i cyfr i wstawi go w pole pod przyciskiem. To jest Twój klucz."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Kliknij małą <strong>ikonę oka</strong> obok pola, aby pokazać klucz, a następnie skopiuj cały ciąg."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Wklej go w poniższe pole na tej stronie (jest zapisywany tylko w Twojej przeglądarce, aby przyciski kopiowania na tej stronie mogły go same wstawiać) ALBO wklej go bezpośrednio w pole klucza API w panelu, jeśli idziesz tam po prostą konfigurację."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Traktuj ten klucz jak hasło."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Nie wklejaj go do udostępnianych dokumentów, zrzutów ekranu ani kodu, który opublikujesz. Jeśli kiedykolwiek wycieknie, wróć na kartę Token Joomla i ponownie kliknij Wyczyść &mdash; stary klucz natychmiast przestanie działać."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Wklej tutaj swój klucz API (do kopiowania jednym kliknięciem na tej stronie)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Twój klucz jest zapamiętywany tylko w tej przeglądarce</strong> &mdash; nigdy nie opuszcza Twojego komputera. Przycisk kosza go usuwa. Jeśli zostawisz to pole puste, przyciski kopiowania na tej stronie nadal będą działać, ale klucz trzeba będzie wkleić do skopiowanego fragmentu ręcznie."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Pokaż/ukryj klucz"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Zapomnij zapisany klucz"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Zaawansowane: podłącz AI ręcznie (większość osób tego nie potrzebuje)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Ta sekcja jest dla osób, które chcą ręcznie skonfigurować połączenie swojego klienta AI z tą witryną &mdash; zwykle przez edycję małego pliku tekstowego, tzw. &ldquo;pliku konfiguracyjnego&rdquo;. Jeśli prosta konfiguracja powyżej zadziałała, możesz spokojnie pominąć całą tę sekcję. Jeśli chcesz obejść prompt konfiguracyjny i zarejestrować połączenie bezpośrednio w kliencie AI, czytaj dalej."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="Adres URL połączenia tej witryny"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="To adres, którego potrzebuje Twój klient AI. Wkleisz go w ustawieniach klienta razem ze swoim kluczem API."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Wybierz swojego klienta AI"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="Adres URL połączenia i klucz API są takie same dla każdego AI &mdash; różni się tylko <em>miejsce, w które je wklejasz</em>, zależnie od klienta. Wybierz poniżej swojego klienta, aby zobaczyć dokładne instrukcje."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, rozszerzenie IDE lub aplikacja na komputer)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex obsługuje ten punkt końcowy natywnie jako serwer MCP Streamable HTTP. Najpierw zapisz klucz API Joomla w osobnej zmiennej środowiskowej dla tej witryny, a potem zarejestruj punkt końcowy, podając nazwę tej zmiennej. Klucz nigdy nie jest zapisywany w <code>config.toml</code>. Jeśli użyjesz przycisku kopiowania po wklejeniu klucza powyżej, skopiowane polecenie środowiskowe będzie zawierać ten klucz, więc nie pokazuj go we współdzielonych terminalach, nagraniach ani zgłoszeniach do wsparcia."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; zapisz klucz dla przyszłych procesów Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Po ustawieniu trwałej zmiennej środowiskowej Windows otwórz nowy terminal. Działające już procesy Codex i terminala jej nie widzą."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; ustaw klucz dla tego terminala (w razie potrzeby zapisz go na stałe w bezpiecznym środowisku powłoki)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Zarejestruj tę witrynę Joomla w Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Uruchom <code>codex mcp list</code>, uruchom Codex ponownie (lub sprawdź stan MCP w jego interfejsie), a potem wywołaj nieszkodliwe narzędzie tylko do odczytu <code>get_joomla_version</code>. To sprawdza inicjalizację, uwierzytelnianie, wykrywanie narzędzi i ich wywołanie. Jeśli chcesz połączenia tylko do odczytu, włącz też tryb tylko do odczytu po stronie serwera w MCP for J; ustawienia zatwierdzania w kliencie nie mogą obejść uprawnień serwera."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Nieprawidłowy token na cPanel lub PHP-FPM?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Serwer WWW może usuwać standardowy nagłówek Authorization. Zastąp wpis utworzony powyżej w <code>~/.codex/config.toml</code> tym blokiem, aby Codex czytał tę samą zmienną środowiskową i wysyłał ją jako <code>X-Joomla-Token</code>, a potem uruchom Codex ponownie."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Uwaga &mdash; okno &ldquo;Add custom connector&rdquo; w Claude wymaga OAuth, a w tej witrynie jest ono wyłączone."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Wbudowane okno &ldquo;Add custom connector&rdquo; w Claude Desktop i claude.ai łączy się przez logowanie (OAuth) i nie ma pola na klucz API. Super User może włączyć logowanie OAuth w opcjach MCP for J; wtedy to okno zadziała. Do tego czasu instrukcje dla Claude Desktop poniżej korzystają ze zmiany w pliku konfiguracyjnym. (Albo skorzystaj z prostej konfiguracji powyżej &mdash; działa też z Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Cztery kroki: utwórz mały plik pomocniczy, tzw. &ldquo;skrypt opakowujący&rdquo;, z poleceniem połączenia, wskaż go w pliku konfiguracyjnym Claude Desktop i uruchom Claude Desktop ponownie."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Po co skrypt opakowujący zamiast wpisania połączenia bezpośrednio w konfiguracji Claude Desktop? Claude Desktop 1.30096+ (sierpień 2026) odrzuca wpisy konfiguracji, których argumenty polecenia wyglądają na dane uwierzytelniające &mdash; to dobrze pomyślane zabezpieczenie, które niestety blokuje prosty sposób. Przeniesienie polecenia do małego pliku pomocniczego omija problem (Claude Desktop widzi zwykłe polecenie bez widocznych argumentów), a klucz API pozostaje dokładnie tak samo bezpieczny jak wcześniej &mdash; plik pomocniczy leży w Twoim folderze użytkownika, obok konfiguracji samego Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Jednorazowy wymóg &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Te instrukcje zakładają, że na komputerze jest zainstalowany Node.js (zawiera polecenie <code>npx</code>). Większość środowisk programistycznych już go ma; jeśli nie, zainstaluj go z <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> za pomocą instalatora LTS. Poniższy plik opakowujący oczekuje Node.js w standardowej ścieżce instalacji Windows <code>C:\Program Files\nodejs\</code>. Jeśli zainstalowano go gdzie indziej, po skopiowaniu popraw tę ścieżkę w pliku opakowującym."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Krok 1 &mdash; utwórz skrypt opakowujący"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Na razie tylko dla Windows (użytkownicy Mac/Linux &mdash; zobacz FAQ). Skopiuj poniższy blok do nowego pliku tekstowego. Zapisz go w swoim folderze użytkownika (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) pod nazwą <code>claude-mcp-joomla-{sitename}.cmd</code>, zastępując <code>{sitename}</code> krótką nazwą swojej witryny (np. <code>cybersaltorg</code>). Upewnij się, że <code>.cmd</code> to naprawdę rozszerzenie, a nie część nazwy &mdash; w Notatniku wybierz &ldquo;Zapisz jako typ: Wszystkie pliki&rdquo;, aby nie dopisał <code>.txt</code>. Jeśli wklejono klucz API w pole na górze tej strony, przycisk kopiowania wstawi go za Ciebie."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Nie znasz swojej nazwy użytkownika Windows? Otwórz Eksplorator plików, przejdź do <code>C:\Users\</code> i spójrz na nazwy folderów &mdash; jeden z nich jest Twój."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Krok 2 &mdash; otwórz plik konfiguracyjny Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Plik ustawień Claude Desktop znajduje się w stałym miejscu zależnym od systemu operacyjnego. Otwórz go dowolnym edytorem tekstu (VS Code, Notatnik, TextEdit, Sublime &mdash; jakim masz):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop ma przycisk Settings &rarr; Developer &rarr; <strong>Edit Config</strong>, który powinien otworzyć ten plik. Jeśli po kliknięciu nic się nie dzieje, komputer nie wie, jakim programem otwierać pliki <code>.json</code>. Nic nie szkodzi &mdash; po prostu otwórz plik samodzielnie edytorem tekstu, korzystając z jednej ze ścieżek powyżej. Jeśli pliku jeszcze nie ma, utwórz go i użyj poniższego bloku jako całej zawartości (opakowanego w <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Krok 3 &mdash; dodaj ten blok do konfiguracji Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Wklej to do <code>claude_desktop_config.json</code>. Jeśli plik ma już obiekt <code>mcpServers</code> z innymi serwerami, dodaj wpis <code>joomla-...</code> obok nich (nie wklejaj drugiego obiektu <code>mcpServers</code>). Jeśli plik jest pusty albo go nie ma, użyj całego poniższego bloku jako zawartości. <strong>Ważne:</strong> zastąp <code>YOUR_WINDOWS_USERNAME</code> swoją prawdziwą nazwą użytkownika Windows."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Ta konfiguracja tylko wskazuje Claude Desktop skrypt opakowujący utworzony w kroku 1. Twój klucz API zostaje w pliku opakowującym, a nie w konfiguracji Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Krok 4 &mdash; całkowicie zamknij Claude Desktop i otwórz go ponownie"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop czyta plik konfiguracyjny tylko przy uruchamianiu. Zamknij go całkowicie &mdash; w Windows kliknij prawym przyciskiem ikonę Claude w zasobniku systemowym (prawy dolny róg; może być trzeba najpierw kliknąć małą strzałkę w górę) i wybierz Quit. Odczekaj kilka sekund i uruchom go ponownie. W dowolnej rozmowie kliknij ikonę narzędzi (albo zapytaj &ldquo;jakie masz narzędzia?&rdquo;) &mdash; narzędzia witryny powinny być na liście. Jeśli nie, zobacz Rozwiązywanie problemów poniżej."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (terminal lub VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Jeśli używasz Claude Code, połączenie tworzy jedno polecenie terminala &mdash; bez edycji pliku konfiguracyjnego. Wklej klucz API w pole powyżej, aby przycisk kopiowania poniżej go wstawił, potem wklej polecenie do terminala i naciśnij Enter. Claude Code od razu potwierdzi połączenie i się przeładuje."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (wersja w przeglądarce)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="Okno <strong>Add custom connector</strong> w claude.ai łączy się przez logowanie (OAuth), które w tej witrynie jest wyłączone. Super User może je włączyć w opcjach MCP for J i wtedy claude.ai uzyska stałe połączenie. Do tego czasu prosta konfiguracja powyżej (wklejenie promptu) działa tylko w bieżącym czacie."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor przechowuje połączenia MCP w pliku konfiguracyjnym <code>mcp.json</code>. Otwórz go w edytorze tekstu, wklej poniższy blok do obiektu <code>mcpServers</code> i zapisz. Zwykle Cursor uwzględnia zmianę bez ponownego uruchamiania."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Położenie pliku konfiguracyjnego: <code>~/.cursor/mcp.json</code> (dla wszystkich Twoich projektów) lub <code>.cursor/mcp.json</code> w folderze konkretnego projektu (tylko dla tego projektu)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Własne serwery MCP w ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="Okno <strong>Add custom MCP server</strong> w ChatGPT może łączyć się tylko przez logowanie (OAuth) albo bez uwierzytelniania; nie ma pola na klucz API ani nagłówek. Logowanie OAuth jest w tej witrynie wyłączone, więc ChatGPT nie może się jeszcze połączyć. Super User może je włączyć w opcjach MCP for J. Do tego czasu używaj Codex (agenta programistycznego OpenAI), który wysyła klucz API ze zmiennej środowiskowej."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Dodanie własnego serwera MCP wymaga płatnego planu ChatGPT. Działa w planie Plus (sprawdzono w październiku 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI i Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Zarówno Gemini CLI (terminalowy asystent AI Google), jak i rozszerzenie Gemini Code Assist (dla VS Code / JetBrains) czytają ten sam plik konfiguracyjny MCP. Dwa kroki: edytuj ten plik, dodając tę witrynę Joomla jako serwer MCP, a potem uruchom Gemini ponownie."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Serwer możesz dodać globalnie (widzi go każda sesja Gemini) albo tylko w jednym folderze projektu. Fragment jest identyczny &mdash; zmienia się tylko położenie pliku."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Otwórz (lub utwórz) plik ustawień Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Wybierz jedno z dwóch miejsc:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Globalnie (każdy projekt):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Tylko projekt:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (w folderze projektu)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Wklej ten blok do pliku."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Jeśli plik ma już sekcję <code>mcpServers</code>, dodaj wpis <code>&quot;joomla-...&quot;</code> do istniejącej &mdash; nie dubluj zewnętrznego klucza <code>mcpServers</code>. Jeśli plik jest pusty lub zupełnie nowy, wklej cały fragment bez zmian."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini używa <code>httpUrl</code> dla serwerów MCP przez HTTP (takich jak ten) &mdash; inaczej niż klucz <code>url</code> w Cursor. Skopiuj dokładnie ten fragment, zamiast używać tego dla Cursor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Uruchom Gemini ponownie."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Zamknij i ponownie uruchom <code>gemini</code> w terminalu albo przeładuj okno VS Code / JetBrains. Wpisz <code>/mcp</code> w Gemini CLI, aby zobaczyć podłączone serwery i potwierdzić, że Twoja witryna Joomla jest na liście."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="Aplikacja internetowa <code>gemini.google.com</code> według stanu na sierpień 2026 nie obsługuje własnych serwerów MCP &mdash; ten przewodnik dotyczy tylko Gemini CLI i Gemini Code Assist. Jeśli Google doda taką obsługę w interfejsie internetowym, opiszemy ją tutaj."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Inni klienci AI obsługujący MCP (Cline, Continue, GitHub Copilot w trybie agenta, Windsurf, mcp-cli itd.) też działają &mdash; adres URL połączenia i klucz API są identyczne, różni się tylko dokładne miejsce, w które je wklejasz. Z czasem dodamy instrukcje dla kolejnych klientów; jeśli utkniesz, FAQ poniżej zawiera ogólne wskazówki."

