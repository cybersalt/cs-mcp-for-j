COM_CSMCPFORJ_SUPPORT_FIELD_SUBJECT_PLACEHOLDER="Krótkie podsumowanie wiadomości"

COM_CSMCPFORJ_SUPPORT_FIELD_DESCRIPTION_LABEL="Wiadomość"
COM_CSMCPFORJ_SUPPORT_FIELD_DESCRIPTION_PLACEHOLDER="Opisz, co się dzieje. Przy zgłoszeniu błędu: czego się spodziewano, a co faktycznie się stało? Przy prośbie o funkcję: jaki problem by to rozwiązało? Im więcej kontekstu, tym szybciej pomożemy."
COM_CSMCPFORJ_SUPPORT_FIELD_DESCRIPTION_HINT="Zwykły tekst wystarczy &mdash; nie trzeba specjalnego formatowania."

COM_CSMCPFORJ_SUPPORT_FIELD_EMAIL_LABEL="Odpowiedź na adres"
COM_CSMCPFORJ_SUPPORT_FIELD_EMAIL_HINT="Gdzie mamy wysłać odpowiedź? Wpisaliśmy adres e-mail Twojego konta Joomla; zmień go, jeśli odpowiedź ma trafić gdzie indziej."

