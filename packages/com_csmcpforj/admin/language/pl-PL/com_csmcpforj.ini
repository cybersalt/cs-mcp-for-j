COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Wygeneruj token API Joomla w Moim profilu (link po prawej)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Kliknij poniżej &lsquo;Kopiuj prompt&rsquo;."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Wklej go do nowej rozmowy z asystentem AI. Jeśli pominięto krok 2, najpierw zastąp <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> swoim prawdziwym tokenem."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Wyślij. AI sprawdzi połączenie i w klientach, które to obsługują, zaproponuje jego utrwalenie."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Ten prompt działa w każdym kliencie AI z narzędziem powłoki lub terminala: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (tryb agenta), Gemini CLI, Windsurf, mcp-cli itd. Nie działa w czatach tylko w przeglądarce (claude.ai, chatgpt.com, gemini.google.com), które nie mają dostępu do powłoki &mdash; dla nich użyj karty Konektor MCP."

