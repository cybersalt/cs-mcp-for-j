; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Bezpieczeństwo i udostępnianie"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="Twój klucz API TO JEST logowanie &mdash; kto go ma, może zrobić wszystko, co może Twoje konto użytkownika Joomla. Nie ma dostępu anonimowego. Jeśli włączysz <strong>logowanie OAuth</strong>, aplikacja AI może też połączyć się, kierując Cię na zwykłą stronę logowania tej witryny; potem działa jako konto, które się zalogowało, dokładnie z jego uprawnieniami, dopóki nie odłączysz jej w panelu."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Udostępnianie dostępu MCP innym osobom"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Są dwa sposoby &mdash; wybierz ten, który pasuje:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Jeden klucz na osobę (najbezpieczniej)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Utwórz użytkownika Joomla dla każdej osoby, umieść go w grupie tylko z potrzebnymi uprawnieniami (np. tylko do odczytu), wygeneruj klucz dla tego użytkownika i prześlij go prywatnie. Każda osoba ma własny ślad w dziennikach; możesz odwołać dowolny klucz bez wpływu na pozostałe."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Jeden wspólny klucz (najprościej, ale najmniej bezpiecznie)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Utwórz jednego ograniczonego użytkownika (np. <code>mcp-demo-guest</code>) w grupie tylko do odczytu, wygeneruj jeden klucz i udostępnij go szerzej. Łatwiej rozdać; trudniej sprawdzić, kto go używa, albo odebrać dostęp jednej osobie. Dobre na publiczne demo; nie do wrażliwego dostępu."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Odwoływanie klucza"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="Aby istniejący klucz od razu przestał działać, przejdź do Użytkownicy &rarr; dany użytkownik &rarr; karta Token Joomla &rarr; kliknij <strong>Wyczyść</strong>. Stary klucz przestaje działać w chwili kliknięcia. Przekaż tej osobie nowy klucz albo zostaw ją bez dostępu."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Rozwiązywanie problemów"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Znajdź rodzaj aplikacji, którą łączysz, i otwórz problem pasujący do tego, co widzisz. Komunikaty o błędach i blokady zapory mogą wystąpić w każdej aplikacji, dlatego mają osobną grupę na końcu."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; lub &ldquo;Authentication failed&rdquo; (błąd 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="Twoje AI dociera do witryny, ale klucz API jest nieprawidłowy. Sprawdź: (1) czy klucz nie został wyczyszczony od czasu skopiowania (każde wyczyszczenie unieważnia poprzedni klucz); (2) czy skopiowano go w całości, bez brakujących znaków i dodatkowych spacji; (3) jeśli edytowano plik konfiguracyjny &mdash; czy przed kluczem jest słowo <code>Bearer </code> (ze spacją po nim). W razie wątpliwości wygeneruj nowy klucz i spróbuj ponownie."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; lub &ldquo;Could not match accept header&rdquo; (błąd 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Starsze wersje MCP for J (przed 2.3.4) miały błąd, który uniemożliwiał połączenie niektórym klientom AI. Zaktualizuj MCP for J do najnowszej wersji &mdash; sprawdź System &rarr; Aktualizuj &rarr; Rozszerzenia w panelu administracyjnym Joomla."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;Połączono, ale w AI nie pojawiają się żadne narzędzia&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Zwykle chodzi o jedną z trzech rzeczy: (1) grupa użytkownika nie ma <strong>Logowania do usług internetowych</strong> &mdash; ustaw je w System &rarr; Konfiguracja globalna &rarr; Uprawnienia (domyślnie ma je tylko Super User); (2) grupa nie ma uprawnień MCP &mdash; Super User ma je zawsze, a Administrator dzięki domyślnym ustawieniom Joomla, ale grupy Manager i inne potrzebują Używania punktu końcowego MCP (i Zapisu przez punkt końcowy MCP dla zmian) w Opcje &rarr; Uprawnienia tego komponentu; (3) klient AI zapamiętał pustą listę narzędzi &mdash; odłącz i ponownie podłącz serwer MCP w kliencie, aby wymusić ponowne sprawdzenie."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; lub adres URL zwraca błąd (błąd 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Albo adres URL jest błędny (sprawdź go &mdash; powinien kończyć się na <code>/api/index.php/v1/mcp</code>), ALBO dodatek usług internetowych dla MCP jest w Twojej witrynie Joomla wyłączony. W panelu administracyjnym Joomla: System &rarr; Zarządzanie &rarr; Rozszerzenia &rarr; wyszukaj <code>csmcpforj</code> &rarr; upewnij się, że dodatek usług internetowych jest włączony. Jeśli już jest włączony, ścieżkę <code>/api/</code> może blokować plik <code>.htaccess</code> Twojej witryny &mdash; to problem u dostawcy hostingu albo we wtyczce bezpieczeństwa."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; lub &ldquo;Malware detected&rdquo; (błąd 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Rozszerzenie bezpieczeństwa w Twojej witrynie Joomla (RSFirewall, Admin Tools Pro, Securitycheck Pro) blokuje żądanie MCP. W RSFirewall dodaj dwa wyjątki: <code>csmcpforj_oauth</code> oraz <code>api\/index\.php\/v1\/mcp</code> jako wyrażenie regularne (pierwszy służy do logowania). W pozostałych zezwól na <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> i adresy URL zawierające <code>csmcpforj_oauth</code>. Aby potwierdzić przyczynę, na chwilę wyłącz rozszerzenie bezpieczeństwa, spróbuj ponownie, a potem włącz je z powrotem razem z wyjątkami. Przycisk <strong>Sprawdź połączenie</strong> w panelu pokazuje, który adres jest blokowany."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Przycisk &ldquo;Edit Config&rdquo; w Claude Desktop nic nie robi po kliknięciu"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Ten przycisk próbuje przekazać <code>claude_desktop_config.json</code> programowi, którym Twój komputer otwiera pliki <code>.json</code>. Jeśli nie jest to ustawione, przycisk po cichu nic nie robi. Obejście: otwórz plik samodzielnie dowolnym edytorem tekstu. Ścieżki dla każdego systemu operacyjnego są w sekcji Claude w części Zaawansowane powyżej. Jeśli pliku jeszcze nie ma, utwórz go i użyj fragmentu z tamtej sekcji jako całej zawartości (opakuj go w <code>{&quot;mcpServers&quot;: { ... }}</code>). Nie trzeba zmieniać uprawnień &mdash; plik leży w Twoim folderze użytkownika."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="Okno &ldquo;Add custom connector&rdquo; w Claude lub &ldquo;Add custom MCP server&rdquo; w ChatGPT nie ma pola na klucz API"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Te okna są przeznaczone do łączenia przez logowanie (OAuth); nie ma tam gdzie wkleić klucza API MCP for J. W tej witrynie logowanie OAuth jest wyłączone. Super User może je włączyć w Komponenty &rarr; MCP for J &rarr; Opcje &rarr; <strong>Logowanie OAuth</strong> i wtedy oba okna zadziałają. Do tego czasu: Claude Desktop może użyć metody ze skryptem opakowującym powyżej, claude.ai prostej konfiguracji, a użytkownicy ChatGPT &mdash; Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop przy uruchamianiu pokazuje &ldquo;Some MCP servers could not be loaded&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (sierpień 2026) zaostrzył sprawdzanie pliku konfiguracyjnego i teraz odrzuca wpisy, których argumenty polecenia wyglądają, jakby mogły zawierać dane uwierzytelniające. Blokuje to oba oczywiste sposoby skonfigurowania serwera MCP z tokenem bearer bezpośrednio w <code>claude_desktop_config.json</code>: natywną postać <code>type: http</code> ORAZ uruchomienie <code>mcp-remote</code> z argumentem <code>--header &quot;Authorization: Bearer ...&quot;</code>. Oba wyglądają w pliku poprawnie, ale walidator schematu Claude Desktop odrzuca je przy wczytywaniu. <strong>Rozwiązanie:</strong> użyj metody ze skryptem opakowującym opisanej w sekcji Claude w części Zaawansowane powyżej &mdash; umieść całe polecenie w małym pliku <code>.cmd</code>, a w konfiguracji Claude Desktop tylko wskaż ten plik. Claude Desktop widzi zwykłe polecenie bez widocznych argumentów i je akceptuje. Klucz API pozostaje dokładnie tak samo bezpieczny jak wcześniej &mdash; plik opakowujący leży w Twoim folderze użytkownika."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Uruchomiłem ponownie Claude Desktop, ale nadal nie widzi nowego połączenia"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="W Windows zamknięcie okna Claude Desktop tylko chowa je do zasobnika systemowego &mdash; cała aplikacja działa dalej ze STARĄ konfiguracją w pamięci. Kliknięcie później ikony na pasku zadań tylko przywraca okno tego już działającego procesu. Claude Desktop czyta plik konfiguracyjny ponownie tylko przy prawdziwym ponownym uruchomieniu aplikacji. Aby naprawdę uruchomić ją ponownie: kliknij prawym przyciskiem ikonę Claude w zasobniku systemowym (prawy dolny róg; może być trzeba kliknąć małą strzałkę w górę, aby zobaczyć ukryte ikony) &rarr; wybierz <strong>Quit</strong> &rarr; odczekaj około 3 sekund, aż proces całkiem się zakończy &rarr; uruchom Claude Desktop ponownie z menu Start. Dopiero wtedy zmiany w pliku konfiguracyjnym zaczną działać."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Często zadawane pytania"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Czy ktoś może używać tego połączenia bez klucza API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="Nie. Każde żądanie musi zawierać prawidłowy klucz API albo token dostępu OAuth, jeśli logowanie OAuth jest włączone. Żądania bez nich są odrzucane. Tak ma być &mdash; AI może wykonywać w Twojej witrynie prawdziwe czynności (tworzyć artykuły, edytować użytkowników itd.), więc dostęp anonimowy byłby katastrofą dla bezpieczeństwa."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Czy jeden użytkownik Joomla może mieć kilka aktywnych kluczy API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="Nie. Joomla przechowuje dokładnie jeden klucz API na użytkownika. Kliknięcie Wyczyść generuje nowy i unieważnia stary. Jeśli potrzebujesz kilku kluczy (po jednym na urządzenie, na narzędzie AI itd.), utwórz osobnych użytkowników Joomla."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Czy jest limit użycia?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="Sam MCP for J nie ma limitu. Obowiązują zwykłe limity hostingu (pamięć PHP, połączenia MariaDB itd.). Jeśli generujesz duży ruch (duże operacje wsadowe na wielu witrynach), porozmawiaj z dostawcą hostingu o zwiększeniu współbieżności PHP-FPM."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Czy muszę otwierać porty w zaporze lub konfigurować coś specjalnego?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="Nie. MCP używa zwykłego HTTPS na porcie 443. Jeśli Twoja witryna jest już publicznie dostępna pod adresem <code>https://yoursite.com/</code>, punkt końcowy MCP jest osiągalny dla każdego klienta AI w internecie bez dodatkowej konfiguracji."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="Jak regularnie zmieniać klucz API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Nie ma automatycznego harmonogramu &mdash; zmieniasz go ręcznie, kiedy chcesz. Przejdź do Użytkownicy &rarr; użytkownik &rarr; karta Token Joomla &rarr; kliknij Wyczyść. Następnie zaktualizuj konfigurację klienta AI nowym kluczem. Dobry nawyk: zmieniaj każdy klucz, który choć raz pojawił się na zrzucie ekranu, w dzienniku lub w zgłoszeniu błędu."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Używam klienta AI, którego nie ma na liście powyżej &mdash; czy zadziała?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Niemal na pewno tak, o ile obsługuje standardowy MCP przez HTTPS i pozwala dodać własny nagłówek Authorization albo umie logować się przez OAuth (włącz logowanie OAuth w Opcjach). Adres URL jest wszędzie ten sam &mdash; różni się tylko ekran konfiguracji klienta. Klienci, o których wiemy, że działają, ale dla których nie napisaliśmy jeszcze instrukcji krok po kroku: Continue.dev, Windsurf, edytor Zed, mcp-cli, MCP Inspector, LibreChat, Open WebUI (przez mostek <code>mcpo</code>) i różni agenci oparci na Ollama."

