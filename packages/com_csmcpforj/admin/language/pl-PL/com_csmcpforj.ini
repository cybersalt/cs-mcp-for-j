COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Użyj dokładnie tego adresu: <code>%s</code>. Z <em>www</em> lub bez &mdash; musi się zgadzać z tym, jak odpowiada witryna, <strong>bez przekierowań</strong> po drodze (z www na domenę bez www lub z http na https). Przycisk <strong>Sprawdź połączenie</strong> w panelu zgłasza przekierowanie."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="Logowanie OAuth jest w tej witrynie włączone. claude.ai może łączyć się tylko przez logowanie, więc musi ono pozostać włączone."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>Logowanie OAuth jest w tej witrynie wyłączone.</strong> claude.ai może łączyć się tylko przez logowanie, więc Super User musi je najpierw włączyć: Komponenty &rarr; MCP for J &rarr; Opcje &rarr; <strong>Logowanie OAuth</strong>. Dopóki jest wyłączone, claude.ai zgłasza &ldquo;cannot register&rdquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="W oknie <strong>Add custom connector</strong> wybierz <strong>Sign in now</strong>. Dla klienta OAuth działają oba warianty, <strong>Use Claude's published identity</strong> i <strong>Register automatically</strong> (opublikowana tożsamość wymaga na serwerze rozszerzenia PHP curl). Zostaw client ID i secret puste. Jeśli jeden sposób się nie uda, usuń konektor i dodaj go ponownie drugim sposobem."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>Nie dodawaj nagłówków żądania.</strong> claude.ai nie akceptuje nagłówka <code>X-Joomla-Token</code>, więc nie można tam użyć klucza API. Logowanie to jedyny sposób na wejście z claude.ai."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Zapory muszą przepuszczać serwery claude.ai. Łączą się one z <code>160.79.104.0/21</code>, a nie z Twojej przeglądarki. RSFirewall potrzebuje dwóch wyjątków: <code>csmcpforj_oauth</code> oraz <code>api\/index\.php\/v1\/mcp</code> jako wyrażenia regularnego. Admin Tools, Securitycheck i zapory hostingu, takie jak o2switch TigerProtect (które odpowiada 503), też mogą blokować. <strong>Cloudflare</strong>: Browser Integrity Check i Security Level mogą blokować serwery aplikacji. Dodaj własną regułę WAF (Security &rarr; WAF &rarr; Custom rules) z akcją <strong>Skip</strong> dla żądań, których ścieżka URI zawiera <code>/api/index.php/v1/mcp</code> lub <code>/.well-known/oauth-</code> albo których query string zawiera <code>csmcpforj_oauth</code>, i zaznacz <em>Browser Integrity Check</em> oraz <em>Security Level</em>. Bot Fight Mode nie da się pominąć regułą, więc wyłącz go, jeśli blokuje. Przycisk <strong>Sprawdź połączenie</strong> w panelu pokazuje, co odpowiada."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> i inne rozszerzenia SEO przepisujące adresy URL mogą przechwytywać adresy logowania (<code>index.php?csmcpforj_oauth=&hellip;</code>) i odpowiadać stroną główną, przez co aplikacja nie może się zarejestrować i nie podaje jasnego powodu. Jeśli <strong>Sprawdź połączenie</strong> pokazuje stronę główną dla punktów logowania, wyklucz w tym rozszerzeniu adresy URL zawierające <code>csmcpforj_oauth</code> albo wyłącz jego dodatek systemowy."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Zaloguj się na konto, które może używać MCP (zobacz <em>Kto może używać tego punktu końcowego?</em> w panelu). Jeśli nie działa tylko u jednej osoby, sprawdź, czy jej konto nie jest zablokowane i czy nie ma ustawionego <em>Wymagane zresetowanie hasła</em>."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="Nadal nie działa? Komponenty &rarr; MCP for J &rarr; <strong>Dzienniki</strong> pokazuje każdy krok logowania i powód odrzucenia kroku."
