; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Zapory i rozszerzenia URL"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall jest włączony."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="Może blokować żądania MCP (&ldquo;403 Access Forbidden &mdash; Malware detected&rdquo;) i logowanie claude.ai. W RSFirewall dodaj dwa wyjątki: <code>csmcpforj_oauth</code> oraz <code>api\/index\.php\/v1\/mcp</code> jako wyrażenie regularne."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools jest włączony."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="Jego Web Application Firewall może blokować żądania MCP i logowanie. Jeśli <strong>Sprawdź połączenie</strong> pokazuje blokadę, znajdź regułę w Blocked Requests Log w Admin Tools i dodaj wyjątek WAF albo wyłącz tę regułę. Zezwól na <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> i adresy URL zawierające <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck jest włączony."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="Jego zapora może blokować żądania MCP i logowanie. Jeśli <strong>Sprawdź połączenie</strong> pokazuje blokadę, znajdź żądanie w jego dziennikach i dodaj wyjątek dla <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> i adresów URL zawierających <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 jest włączony."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="To rozszerzenie SEO może przechwytywać adresy logowania (<code>index.php?csmcpforj_oauth=&hellip;</code>) i odpowiadać stroną główną, przez co claude.ai lub ChatGPT nie może się zarejestrować i nie podaje jasnego powodu. Jeśli <strong>Sprawdź połączenie</strong> pokazuje stronę główną dla punktów logowania, wyklucz w Route 66 adresy URL zawierające <code>csmcpforj_oauth</code> albo wyłącz jego dodatek systemowy."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Blokować mogą też zapory prowadzone przez hosting: o2switch TigerProtect odpowiada 503, a reguły Imunify360, ModSecurity lub Cloudflare odpowiadają 403. Poproś hosting o zezwolenie na powyższe adresy albo o przepuszczanie serwerów Anthropic (<code>160.79.104.0/21</code>) dla claude.ai. <strong>Cloudflare</strong>: Browser Integrity Check i Security Level mogą blokować serwery aplikacji. Dodaj własną regułę WAF (Security &rarr; WAF &rarr; Custom rules) z akcją <strong>Skip</strong> dla żądań, których ścieżka URI zawiera <code>/api/index.php/v1/mcp</code> lub <code>/.well-known/oauth-</code> albo których query string zawiera <code>csmcpforj_oauth</code>, i zaznacz <em>Browser Integrity Check</em> oraz <em>Security Level</em>. Bot Fight Mode nie da się pominąć regułą, więc wyłącz go, jeśli blokuje."

