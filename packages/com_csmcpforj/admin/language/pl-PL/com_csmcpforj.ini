COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Wklej go do konfiguracji MCP swojego klienta AI &mdash; Claude Desktop: <code>claude_desktop_config.json</code>; Claude Code: <code>claude mcp add</code>; Cursor: <code>~/.cursor/mcp.json</code>; GitHub Copilot: ustawienia MCP w VS Code / JetBrains; Cline / Continue: ustawienia JSON rozszerzenia. Po zapisaniu uruchom klienta ponownie. (Okna &ldquo;Add custom connector&rdquo; w claude.ai i ChatGPT nie mają na to pola; tam użyj logowania OAuth.)"
