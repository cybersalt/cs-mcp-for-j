COM_CSMCPFORJ_ACTIONLOG_OAUTH_REVOKE="Użytkownik <a href=&quot;{accountlink}&quot;>{username}</a> odłączył aplikację &ldquo;{title}&rdquo; od MCP for J (OAuth)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="Połącz przez logowanie (najprościej)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Nie trzeba kopiować klucza API. W aplikacji AI dodaj konektor i wklej <strong>adres URL punktu końcowego</strong> tej witryny (poniżej). Po kliknięciu Connect aplikacja sama otworzy stronę logowania tej witryny: zaloguj się swoim loginem i hasłem do tej witryny, a potem kliknij <strong>Zezwól</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai i Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Nadaj nazwę, wklej adres URL punktu końcowego i kliknij Continue. Zostaw <em>Sign in now</em>; dla klienta OAuth działają oba warianty, <em>Use Claude's published identity</em> i <em>Register automatically</em>. Nie dodawaj nagłówków żądania. Kliknij Add, a potem <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> <strong>Plugins</strong> na lewym pasku bocznym &rarr; <strong>Add</strong> (w prawym górnym rogu) &rarr; <strong>Add custom MCP server</strong>. Nadaj nazwę, wklej adres URL punktu końcowego, zostaw Authentication na <strong>OAuth</strong>, zaznacz pole wyboru, kliknij <strong>Create as a plugin</strong>, a potem <strong>Connect</strong>. Wymaga płatnego planu ChatGPT (Plus działa)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>, potem wpisz <code>/mcp</code>, wybierz serwer i wybierz <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> Paleta poleceń &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; wklej adres URL punktu końcowego. VS Code poprosi o zalogowanie."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> dodaj <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> w <code>mcpServers</code> w <code>mcp.json</code> (bez nagłówków), a potem kliknij <strong>Login</strong> obok serwera w Settings &rarr; MCP."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> dodaj dla serwera <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> w <code>settings.json</code>, a potem uruchom <code>/mcp auth &lt;name&gt;</code>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Codex sam otworzy stronę logowania (jeśli nie, uruchom <code>codex mcp login joomla</code>). Kliknij Zezwól w ciągu kilku minut, w przeglądarce na tym samym komputerze co Codex. Jeśli potem przeglądarka zgłosi, że 127.0.0.1 odmówił połączenia, użyj <code>codex mcp login joomla --no-browser</code> i wklej adres tej strony do terminala albo dalej korzystaj z metody z kluczem API poniżej."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, wklej adres URL punktu końcowego, a potem kliknij <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="Po kliknięciu Zezwól aplikacja działa jako konto, na które się zalogowano, i może robić dokładnie to, co to konto może w tej witrynie, łącznie z wprowadzaniem zmian, jeśli konto ma takie uprawnienia. Grupy Administrator i Manager najpierw potrzebują uprawnienia <em>Logowanie do usług internetowych</em> (zobacz Uprawnienia w panelu). Każda podłączona aplikacja jest widoczna w panelu, gdzie można ją od razu odłączyć."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="Wolisz klucz API albo Twój klient nie może otworzyć przeglądarki? Metoda z kluczem API w sekcji <strong>Konfiguracja zaawansowana</strong> poniżej nadal działa z każdym klientem."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT (&ldquo;Add custom MCP server&rdquo;) i claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) mogą łączyć się tylko przez skierowanie Cię na stronę logowania tej witryny. W tej witrynie jest to wyłączone. Gdy jest włączone, łączenie wygląda tak: wklej adres tej witryny w aplikacji, zaloguj się, kliknij Zezwól."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="Włącz w Opcjach"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Poproś Super Usera o włączenie <strong>logowania OAuth</strong> w opcjach MCP for J. Do tego czasu używaj metody z kluczem API poniżej."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="Najprościej: okno &ldquo;Add custom connector&rdquo; w Claude działa w tej witrynie."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="Logowanie jest w tej witrynie włączone, więc w Claude Desktop lub claude.ai przejdź do <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, wklej adres MCP tej witryny, kliknij Continue, zostaw wykryte ustawienia logowania, kliknij Add, a potem Connect, zaloguj się swoim loginem i hasłem do tej witryny i kliknij Zezwól. Metoda z plikiem konfiguracyjnym poniżej jest potrzebna tylko wtedy, gdy wolisz klucz API."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai łączy się na stałe przez <strong>Add custom connector</strong>: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, wklej adres MCP tej witryny, kliknij Continue, zostaw wykryte ustawienia logowania, kliknij Add, a potem Connect. Zaloguj się swoim loginem i hasłem do tej witryny i kliknij Zezwól. Połączenie pozostanie dostępne w każdym czacie."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="W ChatGPT kliknij <strong>Plugins</strong> na lewym pasku bocznym, a potem <strong>Add</strong> (w prawym górnym rogu) &rarr; <strong>Add custom MCP server</strong>. Nadaj nazwę (np. &ldquo;Moja witryna Joomla&rdquo;), wklej adres MCP tej witryny, zostaw Authentication na <strong>OAuth</strong>, zaznacz &ldquo;I understand and want to continue&rdquo; i kliknij <strong>Create as a plugin</strong>. Kliknij <strong>Connect</strong>, a ChatGPT otworzy stronę logowania tej witryny: zaloguj się swoim loginem i hasłem do tej witryny i kliknij Zezwól. Następnie w czacie wpisz <strong>@</strong> i wybierz wtyczkę. Nie trzeba wklejać klucza API."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="Okno &ldquo;Add custom connector&rdquo; się łączy, ale logowanie się nie udaje"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Sprawdź po kolei: (1) czy konto, na które się zalogowano, może używać MCP &mdash; Administrator potrzebuje <em>Logowania do usług internetowych</em>, a Manager tego oraz <em>Używania punktu końcowego MCP</em> w Opcje &rarr; Uprawnienia (zobacz kartę <em>Kto może używać tego punktu końcowego?</em> w panelu); jeśli nie, strona logowania to powie; (2) czy karta &ldquo;Łączenie aplikacji AI przez logowanie&rdquo; w panelu pokazuje <strong>Gotowe</strong>; (3) czy zapora przepuszcza do witryny serwery aplikacji (zobacz następny punkt). Nie wpisuj client ID ani secret: aplikacja rejestruje się sama. (4) Kliknij Zezwól wkrótce po otwarciu strony logowania: aplikacje po pewnym czasie rezygnują z logowania (Codex po około 5 minutach), a spóźnione Zezwól kończy się błędem. Uruchom Connect ponownie i zadziała."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai lub ChatGPT nie może dotrzeć do witryny albo logowanie przerywa się w połowie"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai i ChatGPT łączą się z własnych serwerów, a nie z Twojej przeglądarki, więc witryna musi być dostępna przez publiczny HTTPS. Zapora aplikacji internetowych (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 albo zapora hostingu, np. TigerProtect w o2switch, która odpowiada 503) może blokować te żądania. Zezwól na żądania do <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> i <code>index.php?csmcpforj_oauth=&hellip;</code> (punkty rejestracji, tokenu i odwołania). W RSFirewall wystarczą te dwa wyjątki: <code>csmcpforj_oauth</code> oraz <code>api\/index\.php\/v1\/mcp</code> jako wyrażenie regularne. claude.ai łączy się z <code>160.79.104.0/21</code>. <strong>Cloudflare</strong>: Browser Integrity Check i Security Level mogą blokować serwery aplikacji. Dodaj własną regułę WAF (Security &rarr; WAF &rarr; Custom rules) z akcją <strong>Skip</strong> dla żądań, których ścieżka URI zawiera <code>/api/index.php/v1/mcp</code> lub <code>/.well-known/oauth-</code> albo których query string zawiera <code>csmcpforj_oauth</code>, i zaznacz <em>Browser Integrity Check</em> oraz <em>Security Level</em>. Bot Fight Mode nie da się pominąć regułą, więc wyłącz go, jeśli blokuje. <strong>Route 66</strong> i inne rozszerzenia SEO przepisujące adresy URL mogą przechwytywać adresy logowania (<code>index.php?csmcpforj_oauth=&hellip;</code>) i odpowiadać stroną główną, przez co aplikacja nie może się zarejestrować i nie podaje jasnego powodu. Jeśli <strong>Sprawdź połączenie</strong> pokazuje stronę główną dla punktów logowania, wyklucz w tym rozszerzeniu adresy URL zawierające <code>csmcpforj_oauth</code> albo wyłącz jego dodatek systemowy. Sama strona logowania otwiera się w Twojej własnej przeglądarce."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="Panel informuje, że aplikacje AI nie znajdują strony logowania tej witryny (Niegotowe)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="Klienci AI szukają danych logowania pod adresem <code>/.well-known/oauth-authorization-server</code> w Twojej domenie. Joomla odpowiada tam tylko wtedy, gdy w Konfiguracja globalna &rarr; <strong>Zastosuj przepisywanie URL</strong> jest włączone, a plik <code>.htaccess</code> witryny jest na miejscu (zmień nazwę <code>htaccess.txt</code>), albo gdy nginx przekazuje nieznane ścieżki do <code>index.php</code>. Nie wpływa to na AutoSSL w cPanel, który używa <code>/.well-known/acme-challenge/</code>. Witryna zainstalowana w podfolderze (na przykład <code>example.com/joomla</code>) potrzebuje też reguły w katalogu głównym domeny, która kieruje <code>/.well-known/oauth-authorization-server/joomla</code> do tego podfolderu."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Logowanie z serwera lub komputera bez przeglądarki"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Klienci na komputery (Claude Code, Codex, Cursor, Gemini CLI) otwierają przeglądarkę na tym samym komputerze i czekają na odpowiedź pod lokalnym adresem, więc logowanie OAuth wymaga tam przeglądarki. Na serwerze bez ekranu lub przez SSH użyj zamiast tego metody z kluczem API z sekcji Konfiguracja zaawansowana; działa wszędzie."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="W aplikacji AI dodaj nowy konektor (claude.ai i Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector; ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server) i wklej ten <strong>adres URL punktu końcowego</strong>: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Kliknij Connect.</strong> Aplikacja sama otworzy stronę logowania tej witryny. Zaloguj się swoim loginem i hasłem do tej witryny."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Kliknij Zezwól.</strong> Wrócisz do aplikacji, już połączonej. Aplikacja może robić wszystko, na co Twoje konto ma pozwolenie w tej witrynie."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Podłącz aplikację AI do tej witryny"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Są trzy sposoby. Kliknij jeden, aby otworzyć jego ponumerowane kroki. Większość osób wybiera pierwszy."
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. Zaloguj się (najprościej) &mdash; ChatGPT, claude.ai, Claude Desktop i większość innych aplikacji AI"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Wklej prompt konfiguracyjny &mdash; dla czatu AI, który umie wykonywać polecenia"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. Plik konfiguracyjny lub wiersz poleceń &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI i inne"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Działa w aplikacjach AI, które umieją wykonywać polecenia (Codex, Claude Code, Cursor, Cline, tryb agenta Copilot i podobne). AI samo sprawdza połączenie i może zaproponować jego utrwalenie."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="Dla aplikacji konfigurowanych plikiem ustawień lub poleceniem. Robisz to raz i połączenie zostaje."
