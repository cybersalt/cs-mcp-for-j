COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="Logowanie OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Pozwala aplikacjom AI łączyć się przez skierowanie Cię na stronę logowania tej witryny, zamiast kopiowania do nich klucza API. ChatGPT (&ldquo;Add custom MCP server&rdquo;) i claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) mogą łączyć się tylko w ten sposób. Połączenia z kluczem API działają tak czy inaczej."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="Włącz logowanie OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Gdy włączone: wklejasz adres MCP tej witryny w aplikacji AI, aplikacja otwiera stronę logowania tej witryny, logujesz się swoim zwykłym loginem i hasłem i klikasz Zezwól. Od tej chwili aplikacja działa w Twoim imieniu, dokładnie z Twoimi uprawnieniami w tej witrynie. Podłączone aplikacje są widoczne w panelu, gdzie każdą można odłączyć. Wyłączenie tej opcji natychmiast odłącza je wszystkie."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Ważność tokenu dostępu (sekundy)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Jak długo ważny jest każdy token dostępu, zanim aplikacja po cichu go odnowi. Domyślnie 3600 (jedna godzina). Od 300 do 86400."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Pozostań zalogowany przez (dni)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Jak długo aplikacja może odnawiać dostęp bez ponownego logowania użytkownika. Każde odnowienie zeruje licznik. Domyślnie 30."
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="Łączenie aplikacji AI przez logowanie"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="Niektóre aplikacje AI, w tym ChatGPT i claude.ai, mogą połączyć się z witryną tylko przez skierowanie Cię na jej stronę logowania. W tej witrynie jest to wyłączone, więc te aplikacje nie mogą się jeszcze połączyć. Włącz <strong>logowanie OAuth</strong> w Opcjach, aby na to pozwolić. Połączenia z kluczem API działają tak czy inaczej."
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="Otwórz Opcje, aby to włączyć"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="Klucz API nie jest potrzebny. Kopiujesz tylko <strong>adres URL punktu końcowego</strong> tej witryny."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="Sprawdzanie, czy aplikacje AI znajdują stronę logowania tej witryny&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>Gotowe.</strong> Aplikacje AI znajdują stronę logowania tej witryny."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>Niegotowe.</strong> Aplikacje AI nie znajdują strony logowania tej witryny, więc nie będą mogły się połączyć. Aby to naprawić, włącz <strong>Zastosuj przepisywanie URL</strong> w System &rarr; Konfiguracja globalna i upewnij się, że plik .htaccess witryny jest na miejscu. Szczegóły są w sekcji Rozwiązywanie problemów przewodnika konfiguracji."
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_HEADING="Podłączone aplikacje"
