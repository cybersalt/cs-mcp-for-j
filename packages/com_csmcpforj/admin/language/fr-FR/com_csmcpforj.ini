; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Qui peut utiliser ce point d'accès ?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="Les droits sont vérifiés pour le compte utilisateur Joomla auquel appartient le jeton API. Le client MCP (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl ou autre) ne fait que relayer &mdash; le même jeton se comporte de la même façon quel que soit le client."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Important :"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="La personne qui génère le jeton obtient via le point d'accès MCP le même accès que partout ailleurs dans l'administration de Joomla. Ne générez de jetons que pour des utilisateurs à qui vous confieriez directement ces actions."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Groupe d'utilisateurs Joomla"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Fonctionne d'emblée ?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Pourquoi"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Oui"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Droit explicite nécessaire"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Les Super Users passent toujours toutes les vérifications de droits dans Joomla."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="A core.manage grâce aux droits par défaut de Joomla, que le contrôle MCP accepte pour les outils de lecture et d'écriture (les outils qui modifient les droits, les extensions, les réglages des plugins ou Joomla lui-même exigent toujours un Super User) &mdash; mais le groupe a quand même besoin de <strong>Connexion aux services Web</strong> pour que Joomla le laisse s'authentifier."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="N'a aucun droit MCP par défaut. Accordez au groupe <strong>Connexion aux services Web</strong> dans Système &rarr; Configuration globale &rarr; Droits, puis Utiliser le point d'accès MCP et (si besoin) Écrire via le point d'accès MCP dans <strong>Paramètres &rarr; Droits</strong> de ce composant."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Nécessite Connexion aux services Web"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Avant tout le reste :"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla protège toute l'API par un droit distinct appelé <strong>Connexion aux services Web</strong> (<code>core.login.api</code>), et <strong>par défaut seuls les Super Users l'ont</strong>. Tous les autres groupes &mdash; y compris Administrator et Manager &mdash; reçoivent <code>403 Forbidden</code> de chaque outil tant que vous ne l'accordez pas, quoi qu'ils puissent faire par ailleurs dans l'administration. Réglez-le dans <strong>Système &rarr; Configuration globale &rarr; Droits</strong>, sur le groupe, pas sur ce composant."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / groupe personnalisé"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Accordez au groupe <strong>Connexion aux services Web</strong> dans Système &rarr; Configuration globale &rarr; Droits, puis Utiliser le point d'accès MCP et (si besoin) Écrire via le point d'accès MCP dans <strong>Paramètres &rarr; Droits</strong> de ce composant."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Connecter un assistant d'IA à ce site"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Deux façons de faire. La première (copier-coller un prompt) est la plus simple &mdash; elle fonctionne sans configurer le client et, une fois que votre IA a confirmé que tout marche, elle propose généralement d'installer ce site comme connecteur permanent, sans modifier de JSON à la main. La seconde est pour ceux qui préfèrent modifier directement la configuration de leur client."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Copier un prompt de configuration (recommandé)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Collez un prompt de configuration dans votre assistant d'IA"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Aucune configuration du client n'est nécessaire. Copiez le prompt ci-dessous dans une nouvelle conversation avec votre assistant d'IA (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini, etc.). L'IA fera un test avec curl, confirmera la connexion et &mdash; sur les clients qui le permettent &mdash; proposera de rendre la connexion permanente, sans fichier JSON à modifier ni commande de terminal à retenir."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="En prime :"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Si votre client d'IA dispose d'un outil shell (Codex, Claude Code, Cursor Composer, Cline, Continue, le mode agent de GitHub Copilot, etc.), le prompt inclut une proposition d'auto-installation. Dites simplement &lsquo;rends-la permanente&rsquo; une fois que l'IA a confirmé que la connexion fonctionne, et elle lancera la commande adaptée au client pour enregistrer le serveur MCP (par exemple <code>codex mcp add</code> ou <code>claude mcp add</code>). Après un redémarrage du client, ce site apparaît comme des outils MCP natifs dans chaque conversation &mdash; plus jamais besoin de prompt."
; Shared "type here" field pattern - see FieldStyleHelper.
COM_CSMCPFORJ_FIELD_OPTIONAL="Facultatif"
COM_CSMCPFORJ_FIELD_REQUIRED="Obligatoire"

COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Générez un jeton API Joomla dans Mon profil (lien à droite)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Cliquez sur &lsquo;Copier le prompt&rsquo; ci-dessous."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Collez-le dans une nouvelle conversation avec votre assistant d'IA. Si vous avez sauté l'étape 2, remplacez d'abord <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> par votre vrai jeton."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Envoyez. L'IA testera la connexion et, sur les clients qui le permettent, proposera de la rendre permanente."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Ce prompt fonctionne dans tout client d'IA doté d'un outil shell ou terminal : <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (mode agent), Gemini CLI, Windsurf, mcp-cli, etc. Il ne fonctionne pas dans les chats uniquement web (claude.ai, chatgpt.com, gemini.google.com) sans accès shell &mdash; pour ceux-là, utilisez l'onglet Connecteur MCP."

; Tab 2 — manual MCP connector configuration
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="Connecteur MCP (configuration manuelle)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="Ajouter manuellement comme connecteur MCP"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="Pour Claude Desktop (fichier de configuration), Claude Code, Cursor, Codex, Cline, Copilot, Gemini CLI ou tout client dont vous préférez modifier directement la configuration. À configurer une fois, valable pour toutes les conversations. (Les connecteurs personnalisés de claude.ai et ChatGPT ne peuvent pas envoyer de clé API : ils se connectent par identification. Voir <strong>Se connecter par identification (OAuth)</strong> sur cette page.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="Générez un jeton API Joomla dans Mon profil."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="Copiez l'extrait de configuration ci-dessous."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP3="Remplacez <code>YOUR_JOOMLA_API_TOKEN</code> par le jeton que vous avez généré."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Collez-le dans la configuration MCP de votre client d'IA &mdash; Claude Desktop : <code>claude_desktop_config.json</code> ; Claude Code : <code>claude mcp add</code> ; Cursor : <code>~/.cursor/mcp.json</code> ; GitHub Copilot : réglages MCP dans VS Code / JetBrains ; Cline / Continue : réglages JSON de l'extension. Redémarrez le client après l'enregistrement. (Les boîtes de dialogue &ldquo;Add custom connector&rdquo; de claude.ai et ChatGPT n'ont pas de champ pour cela ; utilisez-y la connexion OAuth.)"
