COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="Connexion OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Permet aux applications d'IA de se connecter en vous envoyant sur la page de connexion de ce site, au lieu que vous y copiiez une clé API. ChatGPT (&ldquo;Add custom MCP server&rdquo;) et claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) ne peuvent se connecter que de cette façon. Les connexions par clé API continuent de fonctionner dans tous les cas."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="Activer la connexion OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Une fois activée, vous collez l'adresse MCP de ce site dans une application d'IA, l'application ouvre la page de connexion de ce site, vous vous connectez avec votre identifiant et votre mot de passe habituels, puis vous cliquez sur Autoriser. L'application agit ensuite en votre nom, avec exactement vos droits sur ce site. Les applications connectées sont listées sur le tableau de bord, où chacune peut être déconnectée. Désactiver ceci les déconnecte toutes immédiatement."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Durée de vie du jeton d'accès (secondes)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Durée de validité de chaque jeton d'accès avant que l'application ne le renouvelle discrètement. Par défaut 3600 (une heure). Entre 300 et 86400."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Rester connecté pendant (jours)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Combien de temps une application peut continuer à renouveler sans que l'utilisateur se reconnecte. Chaque renouvellement remet le compteur à zéro. Par défaut 30."
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="Connecter des applications d'IA par identification"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="Certaines applications d'IA, dont ChatGPT et claude.ai, ne peuvent se connecter à un site qu'en vous envoyant sur la page de connexion de ce site. C'est désactivé sur ce site, donc ces applications ne peuvent pas encore se connecter. Activez la <strong>connexion OAuth</strong> dans les Paramètres pour l'autoriser. Les connexions par clé API continuent de fonctionner dans tous les cas."
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="Ouvrir les Paramètres pour l'activer"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="Aucune clé API nécessaire. La seule chose à copier est l'<strong>URL du point d'accès</strong> de ce site."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="Vérification que les applications d'IA trouvent la page de connexion de ce site&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>Prêt.</strong> Les applications d'IA trouvent la page de connexion de ce site."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>Pas prêt.</strong> Les applications d'IA ne trouvent pas la page de connexion de ce site et ne pourront donc pas se connecter. Pour corriger cela, activez <strong>Réécriture au 'vol' des URL</strong> dans Système &rarr; Configuration globale et vérifiez que le fichier .htaccess du site est en place. La section Dépannage du guide de configuration donne les détails."
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_HEADING="Applications connectées"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_NONE="Aucune application d'IA n'est encore connectée. Une application apparaît ici après que quelqu'un s'est connecté et a cliqué sur Autoriser."
