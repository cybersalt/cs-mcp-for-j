COM_CSMCPFORJ_DASHBOARD_PRO_HEADING="Lier votre compte Cybersalt Extensions"
COM_CSMCPFORJ_DASHBOARD_PRO_INTRO="Lier votre compte Cybersalt Extensions permet à ce site d'installer et de mettre à jour automatiquement les add-ons MCP Pro que vous avez achetés &mdash; qu'il s'agisse de l'abonnement All-Access ou d'un add-on acheté à l'unité.<br><br>Quand vous cliquez sur <strong>Lier le compte</strong>, ce site enregistre un <strong>identifiant de téléchargement</strong> (qui contient votre domaine) auprès de <code>cybersalt.com</code> et le lie à l'adresse e-mail utilisée pour l'achat. Ce lien autorise chaque téléchargement et chaque mise à jour Pro des add-ons que possède votre compte. Votre adresse e-mail et le domaine de ce site sont envoyés à cybersalt.com pour cela ; aucun mot de passe n'est envoyé &mdash; l'e-mail est la clé."
