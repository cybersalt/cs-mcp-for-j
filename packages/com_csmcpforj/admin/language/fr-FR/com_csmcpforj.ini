COM_CSMCPFORJ_CHECK_OAUTH_ENDPOINTS="Points d'accès de connexion (index.php?csmcpforj_oauth=...)"
COM_CSMCPFORJ_CHECK_OK_ENDPOINT="Joignable. Il demande aux applications de s'identifier ou d'envoyer un jeton, comme il se doit."
