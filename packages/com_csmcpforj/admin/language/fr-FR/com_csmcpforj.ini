; ============================================================
; Setup Guide view (v2.4.1 — restructured 2026-08-13 to lead with
; the Dashboard easy-way method and push technical / config-file
; setup into a collapsed Advanced section. Non-technical audience.)
; ============================================================

COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="Guide de configuration"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="Guide de configuration"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for J — Guide de configuration"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Connecter une IA à ce site Joomla"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for J a été conçu pour qu'il soit facile de connecter un assistant d'IA comme Codex, Claude, ChatGPT ou Cursor à votre site Joomla &mdash; pour que l'IA puisse lire vos articles, gérer les utilisateurs, publier du contenu et plus encore, le tout depuis le chat habituel de l'IA. Inutile d'être technicien. La méthode simple ci-dessous convient à la plupart des gens ; descendez pour les options avancées si vous en avez besoin."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ La méthode simple"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Pas de fichiers de configuration. Pas d'en-têtes. Pas de jargon. Copiez simplement un prompt de configuration prêt à l'emploi depuis le tableau de bord et collez-le dans un nouveau chat avec votre IA. L'IA fait le reste &mdash; elle teste la connexion et, sur les clients qui le permettent, propose de l'enregistrer définitivement pour vous."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Obtenez votre clé API</strong> (un mot de passe personnel qui permet à votre IA d'agir sur ce site). Les instructions sont ci-dessous si vous n'en avez pas encore."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Allez sur le tableau de bord</strong> (bouton ci-dessous) et collez votre clé API dans le champ prévu."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Cliquez sur le bouton &ldquo;Copier le prompt&rdquo;</strong> du tableau de bord. Votre clé est insérée automatiquement dans le prompt avant la copie."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Collez-le dans un nouveau chat</strong> avec votre IA (Claude, ChatGPT, Cursor, Copilot, Gemini, etc.) et envoyez. L'IA confirmera que la connexion fonctionne et proposera de l'enregistrer."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Aller au tableau de bord"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="C'est tout. Votre IA est connectée. Si vous voulez en savoir plus sur la façon dont tout s'articule, ou si vous préférez configurer votre IA à la main, lisez la suite ci-dessous &mdash; mais ce n'est pas obligatoire."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Obtenir votre clé API"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="Une <strong>clé API</strong> est un mot de passe personnel qui permet à votre IA d'agir sur ce site Joomla en tant que VOUS. Quiconque possède la clé peut faire tout ce que peut faire votre compte utilisateur Joomla &mdash; gardez-la donc pour vous. Voici comment en générer une :"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sCliquez ici pour ouvrir votre profil utilisateur Joomla%s. Il s'ouvre dans un nouvel onglet. Cherchez-y l'onglet nommé <strong>Jeton Joomla</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="Dans cet onglet, cliquez sur le bouton <strong>Réinitialiser</strong>. Joomla génère une longue suite de lettres et de chiffres et la place dans le champ sous le bouton. C'est votre clé."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Cliquez sur la petite <strong>icône en forme d'œil</strong> à côté du champ pour afficher la clé, puis copiez la chaîne entière."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Collez-la dans le champ ci-dessous sur cette page (elle n'est enregistrée que dans votre navigateur, pour que les boutons de copie de cette page puissent la remplir automatiquement), OU collez-la directement dans le champ de clé API du tableau de bord si vous y allez pour la configuration simple."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Traitez cette clé comme un mot de passe."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Ne la collez pas dans des documents partagés, des captures d'écran ou du code que vous publierez. Si elle fuit un jour, revenez à l'onglet Jeton Joomla et cliquez à nouveau sur Réinitialiser &mdash; l'ancienne clé devient aussitôt invalide."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Collez votre clé API ici (pour copier en un clic sur cette page)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Votre clé n'est mémorisée que dans ce navigateur</strong> &mdash; elle ne quitte jamais votre ordinateur. Utilisez le bouton corbeille pour l'oublier. Si vous laissez ce champ vide, les boutons de copie de cette page fonctionnent quand même, mais vous devrez coller votre clé vous-même dans l'extrait copié."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Afficher/masquer la clé"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Oublier la clé enregistrée"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Avancé : connecter une IA manuellement (la plupart des gens n'en ont pas besoin)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Cette section s'adresse à ceux qui veulent configurer à la main la connexion de leur client d'IA à ce site &mdash; en général en modifiant un petit fichier texte appelé &ldquo;fichier de configuration&rdquo;. Si la configuration simple ci-dessus a fonctionné, vous pouvez ignorer toute cette section. Si vous voulez vous passer du prompt de configuration et enregistrer la connexion directement dans votre client d'IA, lisez la suite."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="L'URL de connexion de ce site"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="C'est l'adresse dont votre client d'IA a besoin. Vous la collerez dans la configuration du client avec votre clé API."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Choisissez votre client d'IA"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="L'URL de connexion et la clé API sont les mêmes pour toutes les IA &mdash; seul <em>l'endroit où vous les collez</em> change selon le client. Choisissez votre client ci-dessous pour les instructions précises."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, extension d'IDE ou application de bureau)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex prend en charge ce point d'accès nativement comme serveur MCP Streamable HTTP. Enregistrez d'abord la clé API Joomla dans une variable d'environnement propre à ce site, puis enregistrez le point d'accès avec le nom de cette variable. La clé n'est jamais écrite dans <code>config.toml</code>. Si vous utilisez le bouton de copie après avoir collé une clé ci-dessus, la commande d'environnement copiée contient cette clé ; tenez-la donc à l'écart des terminaux partagés, des enregistrements et des demandes d'assistance."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; enregistrer la clé pour les prochains processus Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Ouvrez un nouveau terminal après avoir défini une variable d'environnement Windows permanente. Les processus Codex et terminal déjà ouverts ne la voient pas."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; définir la clé pour ce terminal (conservez-la dans votre environnement shell sécurisé si besoin)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Enregistrer ce site Joomla dans Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Lancez <code>codex mcp list</code>, redémarrez Codex (ou consultez l'état MCP dans son interface), puis appelez l'outil inoffensif en lecture seule <code>get_joomla_version</code>. Cela vérifie l'initialisation, l'authentification, la découverte des outils et leur appel. Pour une connexion en lecture seule, activez aussi le mode lecture seule côté serveur de MCP for J ; les réglages d'approbation du client ne peuvent pas passer outre les droits du serveur."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Jeton invalide sur cPanel ou PHP-FPM ?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Le serveur web supprime peut-être l'en-tête standard Authorization. Remplacez l'entrée créée ci-dessus dans <code>~/.codex/config.toml</code> par ce bloc, pour que Codex lise la même variable d'environnement et l'envoie comme <code>X-Joomla-Token</code>, puis redémarrez Codex."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Attention &mdash; la boîte de dialogue &ldquo;Add custom connector&rdquo; de Claude a besoin d'OAuth, désactivé sur ce site."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="La boîte de dialogue &ldquo;Add custom connector&rdquo; intégrée à Claude Desktop et claude.ai se connecte par identification (OAuth) et n'a pas de champ pour une clé API. Un Super User peut activer la connexion OAuth dans les paramètres de MCP for J ; cette boîte de dialogue fonctionne alors. D'ici là, les instructions pour Claude Desktop ci-dessous passent par une modification du fichier de configuration. (Ou utilisez la configuration simple ci-dessus &mdash; elle fonctionne aussi avec Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Quatre étapes : créez un petit fichier d'aide appelé &ldquo;script enveloppe&rdquo; qui contient la commande de connexion, faites pointer le fichier de configuration de Claude Desktop vers lui, puis redémarrez Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Pourquoi un script enveloppe plutôt que de mettre la connexion directement dans la configuration de Claude Desktop ? Claude Desktop 1.30096+ (août 2026) refuse les entrées de configuration dont les arguments de commande semblent contenir des identifiants &mdash; une mesure de sécurité bien intentionnée qui bloque malheureusement la méthode directe. Placer la commande dans un petit fichier d'aide contourne cela (Claude Desktop ne voit qu'une commande simple sans arguments visibles) tout en gardant votre clé API exactement aussi sûre qu'avant &mdash; le fichier d'aide se trouve dans votre propre dossier utilisateur, à côté de la configuration de Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Prérequis, une seule fois &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Ces instructions supposent que Node.js est installé sur votre ordinateur (il fournit une commande appelée <code>npx</code>). La plupart des environnements de développement l'ont déjà ; sinon, installez-le depuis <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> avec l'installateur LTS. Le fichier enveloppe ci-dessous s'attend à trouver Node.js dans le chemin d'installation standard de Windows, <code>C:\Program Files\nodejs\</code>. Si vous l'avez installé ailleurs, modifiez ce chemin dans le fichier enveloppe après la copie."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Étape 1 &mdash; créer le script enveloppe"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Windows uniquement pour l'instant (utilisateurs Mac/Linux : voir la FAQ). Copiez le bloc ci-dessous dans un nouveau fichier texte. Enregistrez-le dans votre dossier utilisateur (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) sous le nom <code>claude-mcp-joomla-{sitename}.cmd</code>, en remplaçant <code>{sitename}</code> par un nom court pour votre site (par ex. <code>cybersaltorg</code>). Vérifiez que <code>.cmd</code> est bien l'extension et pas une partie du nom &mdash; dans le Bloc-notes, choisissez &ldquo;Type : Tous les fichiers&rdquo; pour qu'il n'ajoute pas <code>.txt</code>. Si vous avez collé votre clé API dans le champ en haut de cette page, le bouton de copie l'insère pour vous."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Vous ne connaissez pas votre nom d'utilisateur Windows ? Ouvrez l'Explorateur de fichiers, allez dans <code>C:\Users\</code> et regardez les noms des dossiers &mdash; l'un d'eux est le vôtre."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Étape 2 &mdash; ouvrir le fichier de configuration de Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Le fichier de réglages de Claude Desktop se trouve à un emplacement fixe selon le système d'exploitation. Ouvrez-le avec n'importe quel éditeur de texte (VS Code, Bloc-notes, TextEdit, Sublime, celui que vous avez) :"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop a un bouton dans Settings &rarr; Developer &rarr; <strong>Edit Config</strong> censé ouvrir le fichier pour vous. Si rien ne se passe quand vous cliquez, c'est que votre ordinateur ne sait pas avec quel programme ouvrir les fichiers <code>.json</code>. Pas de problème &mdash; ouvrez simplement le fichier vous-même avec un éditeur de texte via l'un des chemins ci-dessus. Si le fichier n'existe pas encore, créez-le et utilisez le bloc ci-dessous comme contenu complet (encadré par <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Étape 3 &mdash; ajouter ce bloc à la configuration de Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Collez ceci dans <code>claude_desktop_config.json</code>. Si le fichier contient déjà un objet <code>mcpServers</code> avec d'autres serveurs, ajoutez l'entrée <code>joomla-...</code> à côté d'eux (ne collez pas un second objet <code>mcpServers</code>). Si le fichier est vide ou absent, utilisez tout le bloc ci-dessous comme contenu. <strong>Important :</strong> remplacez <code>YOUR_WINDOWS_USERNAME</code> par votre vrai nom d'utilisateur Windows."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Cette configuration se contente de faire pointer Claude Desktop vers le script enveloppe créé à l'étape 1. Votre clé API reste dans le fichier enveloppe, pas dans la configuration de Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Étape 4 &mdash; quitter complètement Claude Desktop et le rouvrir"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop ne lit son fichier de configuration qu'au démarrage. Fermez-le complètement &mdash; sous Windows, faites un clic droit sur l'icône de Claude dans la zone de notification (en bas à droite ; il faut parfois cliquer d'abord sur la petite flèche vers le haut) et choisissez Quit. Attendez quelques secondes, puis relancez-le. Dans une conversation, cliquez sur l'icône des outils (ou demandez &ldquo;quels outils as-tu ?&rdquo;) &mdash; les outils du site doivent apparaître. Sinon, voir Dépannage ci-dessous."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (terminal ou VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Si vous utilisez Claude Code, une seule commande de terminal crée la connexion &mdash; sans modifier de fichier de configuration. Collez votre clé API dans le champ ci-dessus pour que le bouton de copie ci-dessous l'insère, puis collez la commande dans un terminal et appuyez sur Entrée. Claude Code confirme aussitôt la connexion et se recharge."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (la version web)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="La boîte de dialogue <strong>Add custom connector</strong> de claude.ai se connecte par identification (OAuth), ce qui est désactivé sur ce site. Un Super User peut l'activer dans les paramètres de MCP for J, et claude.ai obtient alors une connexion permanente. D'ici là, la configuration simple ci-dessus (coller un prompt) ne vaut que pour le chat en cours."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor enregistre ses connexions MCP dans un fichier de configuration appelé <code>mcp.json</code>. Ouvrez-le dans un éditeur de texte, collez le bloc ci-dessous dans l'objet <code>mcpServers</code> et enregistrez. Dans la plupart des cas, Cursor prend en compte le changement sans redémarrage."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Emplacement du fichier de configuration : <code>~/.cursor/mcp.json</code> (pour tous vos projets) ou <code>.cursor/mcp.json</code> dans un dossier de projet précis (pour ce projet seulement)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Serveurs MCP personnalisés dans ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="La boîte de dialogue <strong>Add custom MCP server</strong> de ChatGPT ne peut se connecter que par identification (OAuth) ou sans authentification ; elle n'a pas de champ pour une clé API ni pour un en-tête. La connexion OAuth est désactivée sur ce site, donc ChatGPT ne peut pas encore se connecter. Un Super User peut l'activer dans les paramètres de MCP for J. D'ici là, utilisez Codex (l'agent de programmation d'OpenAI), qui envoie la clé API depuis une variable d'environnement."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Ajouter un serveur MCP personnalisé nécessite une formule ChatGPT payante. Cela fonctionne avec Plus (vérifié en octobre 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI et Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Gemini CLI (l'assistant d'IA de Google pour le terminal) comme l'extension Gemini Code Assist (pour VS Code / JetBrains) lisent le même fichier de configuration MCP. Deux étapes : modifiez ce fichier pour ajouter ce site Joomla comme serveur MCP, puis redémarrez Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Vous pouvez ajouter le serveur globalement (toutes les sessions Gemini le voient) ou seulement dans un dossier de projet. L'extrait est identique &mdash; seul l'emplacement du fichier change."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Ouvrez (ou créez) votre fichier de réglages Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Choisissez l'un de ces deux emplacements :"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Global (tous les projets) :"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Projet uniquement :"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (dans un dossier de projet)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Collez ce bloc dans le fichier."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Si le fichier contient déjà une section <code>mcpServers</code>, ajoutez l'entrée <code>&quot;joomla-...&quot;</code> dans la section existante &mdash; ne dupliquez pas la clé extérieure <code>mcpServers</code>. Si le fichier est vide ou tout neuf, collez l'extrait entier tel quel."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini utilise <code>httpUrl</code> pour les serveurs MCP en HTTP (comme celui-ci) &mdash; ce n'est pas la clé <code>url</code> de Cursor. Copiez exactement cet extrait plutôt que de réutiliser celui de Cursor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Redémarrez Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Quittez et relancez <code>gemini</code> dans le terminal, ou rechargez la fenêtre de VS Code / JetBrains. Tapez <code>/mcp</code> dans Gemini CLI pour voir les serveurs connectés et vérifier que votre site Joomla figure dans la liste."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="L'application web <code>gemini.google.com</code> ne prend pas en charge les serveurs MCP personnalisés en août 2026 &mdash; ce guide ne couvre que Gemini CLI et Gemini Code Assist. Si Google ajoute cette prise en charge dans l'interface web, nous la documenterons ici."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="D'autres clients d'IA compatibles MCP (Cline, Continue, GitHub Copilot en mode agent, Windsurf, mcp-cli, etc.) fonctionnent aussi &mdash; l'URL de connexion et la clé API sont identiques, seul l'endroit exact où les coller change. Nous ajouterons des guides pour d'autres clients au fil du temps ; si vous êtes bloqué, la FAQ ci-dessous donne des conseils généraux."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Copier"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Copié"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Copié (avec votre clé)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Sécurité et partage"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="Votre clé API EST l'identification &mdash; quiconque la détient peut faire tout ce que peut faire votre compte utilisateur Joomla. Il n'y a pas d'accès anonyme. Si vous activez la <strong>connexion OAuth</strong>, une application d'IA peut aussi se connecter en vous envoyant sur la page de connexion normale de ce site ; elle agit alors en tant que compte qui s'est connecté, avec exactement les droits de ce compte, jusqu'à ce que vous la déconnectiez sur le tableau de bord."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Donner un accès MCP à d'autres personnes"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Deux façons de faire &mdash; choisissez celle qui vous convient :"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Une clé par personne (le plus sûr)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Créez un utilisateur Joomla pour chaque personne, placez-le dans un groupe qui n'a que les droits souhaités (par ex. lecture seule), générez une clé pour cet utilisateur et envoyez-la-lui en privé. Chaque personne laisse sa propre trace dans les journaux ; vous pouvez révoquer une clé sans toucher aux autres."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Une clé partagée (le plus simple, mais le moins sûr)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Créez un utilisateur limité (par ex. <code>mcp-demo-guest</code>) dans un groupe en lecture seule, générez une clé et partagez-la plus largement. Plus simple à distribuer ; plus difficile de savoir qui l'utilise ou de retirer l'accès à une seule personne. Convient à une démo publique ; pas à un accès sensible."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Révoquer une clé"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="Pour qu'une clé existante cesse immédiatement de fonctionner, allez dans Utilisateurs &rarr; l'utilisateur concerné &rarr; onglet Jeton Joomla &rarr; cliquez sur <strong>Réinitialiser</strong>. L'ancienne clé devient invalide dès le clic. Donnez la nouvelle clé à la personne ou laissez-la sans accès."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Dépannage"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Repérez le type d'application que vous connectez, puis ouvrez le problème qui correspond à ce que vous voyez. Les messages d'erreur et les blocages de pare-feu peuvent survenir dans n'importe quelle application ; ils ont donc leur propre groupe à la fin."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; ou &ldquo;Authentication failed&rdquo; (erreur 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="Votre IA atteint le site, mais la clé API n'est pas bonne. Vérifiez : (1) que la clé n'a pas été réinitialisée depuis que vous l'avez copiée (chaque réinitialisation invalide la clé précédente) ; (2) qu'elle a été copiée en entier, sans caractère manquant ni espace en trop ; (3) si vous avez modifié un fichier de configuration, que le mot <code>Bearer </code> (suivi d'un espace) précède la clé. En cas de doute, générez une nouvelle clé et réessayez."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; ou &ldquo;Could not match accept header&rdquo; (erreur 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Les anciennes versions de MCP for J (avant la 2.3.4) avaient un bogue qui empêchait certains clients d'IA de se connecter. Mettez MCP for J à jour vers la dernière version &mdash; voyez Système &rarr; Mise à jour &rarr; Extensions dans l'administration de Joomla."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;Connecté, mais aucun outil n'apparaît dans l'IA&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="En général, l'une de ces trois causes : (1) le groupe de l'utilisateur n'a pas <strong>Connexion aux services Web</strong> &mdash; réglez-le dans Système &rarr; Configuration globale &rarr; Droits (par défaut, seuls les Super Users l'ont) ; (2) le groupe n'a pas de droit MCP &mdash; les Super Users l'ont toujours et les Administrators grâce aux valeurs par défaut de Joomla, mais les Managers et les autres groupes ont besoin d'Utiliser le point d'accès MCP (et d'Écrire via le point d'accès MCP pour les modifications) dans Paramètres &rarr; Droits de ce composant ; (3) le client d'IA a mis en cache une liste d'outils vide &mdash; déconnectez puis reconnectez le serveur MCP dans le client pour l'obliger à revérifier."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; ou l'URL renvoie une erreur (erreur 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Soit l'URL est fausse (vérifiez-la &mdash; elle doit se terminer par <code>/api/index.php/v1/mcp</code>), SOIT le plugin Services Web de MCP est désactivé sur votre site Joomla. Dans l'administration de Joomla : Système &rarr; Gestion &rarr; Extensions &rarr; cherchez <code>csmcpforj</code> &rarr; vérifiez que le plugin Services Web est activé. S'il l'est déjà, le <code>.htaccess</code> de votre site bloque peut-être le chemin <code>/api/</code> &mdash; un problème d'hébergeur ou de plugin de sécurité."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; ou &ldquo;Malware detected&rdquo; (erreur 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Un plugin de sécurité de votre site Joomla (RSFirewall, Admin Tools Pro, Securitycheck Pro) bloque la requête MCP. Dans RSFirewall, ajoutez deux exceptions : <code>csmcpforj_oauth</code>, et <code>api\/index\.php\/v1\/mcp</code> comme expression régulière (la première sert à la connexion). Dans les autres, autorisez <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> et les URL contenant <code>csmcpforj_oauth</code>. Pour confirmer la cause, désactivez un instant le plugin de sécurité, réessayez, puis réactivez-le avec les exceptions en place. Le bouton <strong>Vérifier la connexion</strong> du tableau de bord indique quelle adresse est bloquée."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Le bouton &ldquo;Edit Config&rdquo; de Claude Desktop ne fait rien quand je clique"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Ce bouton essaie de confier <code>claude_desktop_config.json</code> au programme avec lequel votre ordinateur ouvre les fichiers <code>.json</code>. Si ce n'est pas configuré, le bouton ne fait rien, sans message. Solution : ouvrez le fichier vous-même avec n'importe quel éditeur de texte. Les chemins par système d'exploitation figurent dans la section Claude de la partie Avancé ci-dessus. Si le fichier n'existe pas encore, créez-le et utilisez l'extrait de cette section comme contenu complet (encadrez-le par <code>{&quot;mcpServers&quot;: { ... }}</code>). Aucun changement de droits n'est nécessaire &mdash; le fichier se trouve dans votre propre dossier utilisateur."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="La boîte de dialogue &ldquo;Add custom connector&rdquo; de Claude ou &ldquo;Add custom MCP server&rdquo; de ChatGPT n'a pas de champ pour la clé API"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Ces boîtes de dialogue sont prévues pour se connecter par identification (OAuth) ; il n'y a nulle part où coller une clé API MCP for J. La connexion OAuth est désactivée sur ce site. Un Super User peut l'activer sous Composants &rarr; MCP for J &rarr; Paramètres &rarr; <strong>Connexion OAuth</strong>, et les deux boîtes de dialogue fonctionnent alors. D'ici là : Claude Desktop peut utiliser la méthode du script enveloppe ci-dessus, claude.ai la configuration simple, et les utilisateurs de ChatGPT, Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop affiche &ldquo;Some MCP servers could not be loaded&rdquo; au démarrage"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (août 2026) a durci la validation de son fichier de configuration et refuse désormais les entrées dont les arguments de commande semblent contenir des identifiants. Cela bloque les deux façons évidentes de configurer directement dans <code>claude_desktop_config.json</code> un serveur MCP avec jeton bearer : la forme native <code>type: http</code> ET le passage de <code>mcp-remote</code> avec un argument <code>--header &quot;Authorization: Bearer ...&quot;</code>. Les deux semblent correctes dans le fichier, mais le validateur de schéma de Claude Desktop les écarte au chargement. <strong>Solution :</strong> utilisez la méthode du script enveloppe décrite dans la section Claude de la partie Avancé ci-dessus &mdash; placez toute la commande dans un petit fichier <code>.cmd</code>, puis faites simplement référence à ce fichier dans la configuration de Claude Desktop. Claude Desktop voit une commande simple sans arguments visibles et l'accepte. Votre clé API reste exactement aussi sûre qu'avant &mdash; le fichier enveloppe se trouve dans votre propre dossier utilisateur."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="J'ai redémarré Claude Desktop, mais il ne voit toujours pas la nouvelle connexion"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="Sous Windows, fermer la fenêtre de Claude Desktop ne fait que la réduire dans la zone de notification &mdash; toute l'application continue de tourner avec l'ANCIENNE configuration en mémoire. Cliquer ensuite sur l'icône de la barre des tâches ne fait que ramener la fenêtre de ce processus déjà lancé. Claude Desktop ne relit son fichier de configuration qu'au vrai redémarrage de l'application. Pour vraiment redémarrer : clic droit sur l'icône de Claude dans la zone de notification (coin inférieur droit ; il faut parfois cliquer sur la petite flèche vers le haut pour voir les icônes masquées) &rarr; choisissez <strong>Quit</strong> &rarr; attendez environ 3 secondes que le processus se termine complètement &rarr; relancez Claude Desktop depuis le menu Démarrer. Ce n'est qu'à ce moment que les modifications de votre fichier de configuration prennent effet."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Questions fréquentes"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Quelqu'un peut-il utiliser cette connexion sans clé API ?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="Non. Chaque requête doit porter une clé API valide, ou un jeton d'accès OAuth si la connexion OAuth est activée. Les requêtes sans sont refusées. C'est voulu &mdash; l'IA peut effectuer de vraies actions sur votre site (créer des articles, modifier des utilisateurs, etc.), un accès anonyme serait donc une catastrophe de sécurité."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Un utilisateur Joomla peut-il avoir plusieurs clés API actives ?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="Non. Joomla conserve exactement une clé API par utilisateur. Cliquer sur Réinitialiser en génère une nouvelle et invalide l'ancienne. Si vous avez besoin de plusieurs clés (une par appareil, une par outil d'IA, etc.), créez des utilisateurs Joomla distincts."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Y a-t-il une limite d'utilisation ?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="MCP for J lui-même n'impose aucune limite. Les limites habituelles de l'hébergement s'appliquent (mémoire PHP, connexions MariaDB, etc.). Si vous générez beaucoup de trafic (gros traitements par lots sur de nombreux sites), voyez avec votre hébergeur pour augmenter la concurrence de PHP-FPM."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Dois-je ouvrir des ports dans le pare-feu ou configurer quelque chose de spécial ?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="Non. MCP utilise simplement le HTTPS standard sur le port 443. Si votre site est déjà accessible publiquement à <code>https://yoursite.com/</code>, le point d'accès MCP est joignable depuis n'importe quel client d'IA sur Internet, sans configuration supplémentaire."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="Comment changer régulièrement ma clé API ?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Il n'y a pas de planification automatique &mdash; vous la changez à la main quand vous le souhaitez. Allez dans Utilisateurs &rarr; l'utilisateur &rarr; onglet Jeton Joomla &rarr; cliquez sur Réinitialiser. Mettez ensuite à jour la configuration du client d'IA avec la nouvelle clé. Bonne habitude : changez toute clé apparue un jour dans une capture d'écran, un journal ou un rapport de bogue."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="J'utilise un client d'IA qui n'est pas listé ci-dessus &mdash; fonctionnera-t-il ?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Presque sûrement, s'il prend en charge le MCP standard en HTTPS et vous permet d'ajouter un en-tête Authorization personnalisé ou sait se connecter avec OAuth (activez la connexion OAuth dans les Paramètres). L'URL est la même partout &mdash; seul l'écran de configuration du client diffère. Clients dont nous savons qu'ils fonctionnent mais pour lesquels nous n'avons pas encore écrit de guide pas à pas : Continue.dev, Windsurf, l'éditeur Zed, mcp-cli, MCP Inspector, LibreChat, Open WebUI (via la passerelle <code>mcpo</code>) et divers agents basés sur Ollama."

