COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="Se connecter par identification (le plus simple)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Aucune clé API à copier. Dans votre application d'IA, ajoutez un connecteur et collez l'<strong>URL du point d'accès</strong> de ce site (ci-dessous). Quand vous cliquez sur Connect, l'application ouvre d'elle-même la page de connexion de ce site : connectez-vous avec votre identifiant et votre mot de passe pour ce site, puis cliquez sur <strong>Autoriser</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai et Claude Desktop :</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Donnez-lui un nom, collez l'URL du point d'accès et cliquez sur Continue. Gardez <em>Sign in now</em> ; pour le client OAuth, <em>Use Claude's published identity</em> et <em>Register automatically</em> fonctionnent tous les deux. N'ajoutez pas d'en-têtes de requête. Cliquez sur Add, puis sur <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT :</strong> <strong>Plugins</strong> dans la barre latérale gauche &rarr; <strong>Add</strong> (en haut à droite) &rarr; <strong>Add custom MCP server</strong>. Donnez-lui un nom, collez l'URL du point d'accès, laissez Authentication sur <strong>OAuth</strong>, cochez la case, cliquez sur <strong>Create as a plugin</strong>, puis sur <strong>Connect</strong>. Nécessite une formule ChatGPT payante (Plus fonctionne)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code :</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>, puis tapez <code>/mcp</code>, choisissez le serveur et sélectionnez <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot :</strong> Palette de commandes &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; collez l'URL du point d'accès. VS Code vous demande de vous connecter."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor :</strong> ajoutez <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> sous <code>mcpServers</code> dans <code>mcp.json</code> (sans en-têtes), puis cliquez sur <strong>Login</strong> à côté du serveur dans Settings &rarr; MCP."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI :</strong> ajoutez <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> pour le serveur dans <code>settings.json</code>, puis lancez <code>/mcp auth &lt;name&gt;</code>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex :</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Codex ouvre lui-même la page de connexion (sinon, lancez <code>codex mcp login joomla</code>). Cliquez sur Autoriser dans les quelques minutes, dans un navigateur du même ordinateur que Codex. Si le navigateur indique ensuite que 127.0.0.1 a refusé la connexion, utilisez <code>codex mcp login joomla --no-browser</code> et collez l'adresse de cette page dans le terminal, ou continuez avec la méthode par clé API ci-dessous."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline :</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, collez l'URL du point d'accès, puis cliquez sur <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="Quand vous cliquez sur Autoriser, l'application agit en tant que compte avec lequel vous vous êtes connecté et peut faire exactement ce que ce compte peut faire sur ce site, y compris des modifications si le compte en a le droit. Les Administrators et les Managers ont d'abord besoin du droit <em>Connexion aux services Web</em> (voir les Droits sur le tableau de bord). Chaque application connectée est listée sur le tableau de bord, où elle peut être déconnectée immédiatement."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="Vous préférez une clé API, ou votre client ne peut pas ouvrir de navigateur ? La méthode par clé API dans <strong>Configuration avancée</strong> ci-dessous fonctionne toujours avec tous les clients."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT (&ldquo;Add custom MCP server&rdquo;) et claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) ne peuvent se connecter qu'en vous envoyant sur la page de connexion de ce site. C'est désactivé sur ce site. Une fois activé, la connexion se fait ainsi : collez l'adresse de ce site dans l'application, connectez-vous, cliquez sur Autoriser."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="L'activer dans les Paramètres"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Demandez à un Super User d'activer la <strong>connexion OAuth</strong> dans les paramètres de MCP for J. D'ici là, utilisez la méthode par clé API ci-dessous."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="Le plus simple : la boîte de dialogue &ldquo;Add custom connector&rdquo; de Claude fonctionne sur ce site."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="La connexion par identification est activée sur ce site : dans Claude Desktop ou claude.ai, allez dans <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, collez l'adresse MCP de ce site, cliquez sur Continue, gardez les réglages de connexion détectés, cliquez sur Add puis sur Connect, connectez-vous avec votre identifiant et votre mot de passe pour ce site et cliquez sur Autoriser. La méthode par fichier de configuration ci-dessous ne sert que si vous préférez une clé API."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai se connecte durablement via <strong>Add custom connector</strong> : <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, collez l'adresse MCP de ce site, cliquez sur Continue, gardez les réglages de connexion détectés, cliquez sur Add puis sur Connect. Connectez-vous avec votre identifiant et votre mot de passe pour ce site et cliquez sur Autoriser. La connexion reste disponible dans tous les chats."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="Dans ChatGPT, cliquez sur <strong>Plugins</strong> dans la barre latérale gauche, puis sur <strong>Add</strong> (en haut à droite) &rarr; <strong>Add custom MCP server</strong>. Donnez-lui un nom (par exemple &ldquo;Mon site Joomla&rdquo;), collez l'adresse MCP de ce site, laissez Authentication sur <strong>OAuth</strong>, cochez &ldquo;I understand and want to continue&rdquo; et cliquez sur <strong>Create as a plugin</strong>. Cliquez sur <strong>Connect</strong> : ChatGPT ouvre la page de connexion de ce site ; connectez-vous avec votre identifiant et votre mot de passe pour ce site et cliquez sur Autoriser. Ensuite, dans un chat, tapez <strong>@</strong> et choisissez le plugin. Il n'y a aucune clé API à coller."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="La boîte de dialogue &ldquo;Add custom connector&rdquo; se connecte, mais l'identification échoue"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Vérifiez dans l'ordre : (1) que le compte avec lequel vous vous êtes connecté peut utiliser MCP &mdash; les Administrators ont besoin de <em>Connexion aux services Web</em>, et les Managers de ce droit plus <em>Utiliser le point d'accès MCP</em> dans Paramètres &rarr; Droits (voir la carte <em>Qui peut utiliser ce point d'accès ?</em> du tableau de bord) ; la page de connexion vous le signale si ce n'est pas le cas ; (2) que la carte &ldquo;Connecter des applications d'IA par identification&rdquo; du tableau de bord indique <strong>Prêt</strong> ; (3) que votre pare-feu laisse les serveurs de l'application joindre le site (voir l'entrée suivante). Ne saisissez ni client ID ni secret : l'application s'enregistre elle-même. (4) Cliquez sur Autoriser peu après l'ouverture de la page de connexion : les applications abandonnent une identification au bout d'un moment (Codex après environ 5 minutes), et un Autoriser tardif se termine par une erreur. Relancez Connect et cela fonctionnera."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai ou ChatGPT n'arrive pas à joindre le site, ou l'identification s'arrête à mi-chemin"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai et ChatGPT se connectent depuis leurs propres serveurs, pas depuis votre navigateur ; le site doit donc être joignable en HTTPS public. Un pare-feu applicatif (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 ou un pare-feu de l'hébergeur comme TigerProtect d'o2switch, qui répond 503) peut bloquer ces requêtes. Autorisez les requêtes vers <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> et <code>index.php?csmcpforj_oauth=&hellip;</code> (les points d'accès d'enregistrement, de jeton et de révocation). Dans RSFirewall, ces deux exceptions suffisent : <code>csmcpforj_oauth</code>, et <code>api\/index\.php\/v1\/mcp</code> comme expression régulière. claude.ai se connecte depuis <code>160.79.104.0/21</code>. <strong>Cloudflare</strong> : Browser Integrity Check et Security Level peuvent bloquer les serveurs des applications. Ajoutez une règle personnalisée du WAF (Security &rarr; WAF &rarr; Custom rules) avec l'action <strong>Skip</strong> pour les requêtes dont le chemin d'URI contient <code>/api/index.php/v1/mcp</code> ou <code>/.well-known/oauth-</code>, ou dont la chaîne de requête contient <code>csmcpforj_oauth</code>, et cochez <em>Browser Integrity Check</em> et <em>Security Level</em>. Bot Fight Mode ne peut pas être contourné par une règle ; désactivez-le s'il bloque. <strong>Route 66</strong> et d'autres extensions SEO qui réécrivent les URL peuvent intercepter les adresses de connexion (<code>index.php?csmcpforj_oauth=&hellip;</code>) et répondre par la page d'accueil, si bien que l'application ne peut pas s'enregistrer et ne donne aucune raison claire. Si <strong>Vérifier la connexion</strong> montre la page d'accueil pour les points d'accès de connexion, excluez dans cette extension les URL contenant <code>csmcpforj_oauth</code>, ou désactivez son plugin système. La page de connexion elle-même s'ouvre dans votre propre navigateur."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="Le tableau de bord indique que les applications d'IA ne trouvent pas la page de connexion de ce site (Pas prêt)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="Les clients d'IA cherchent les informations de connexion à l'adresse <code>/.well-known/oauth-authorization-server</code> de votre domaine. Joomla n'y répond que si Configuration globale &rarr; <strong>Réécriture au 'vol' des URL</strong> est activé et que le <code>.htaccess</code> du site est en place (renommez <code>htaccess.txt</code>), ou si nginx envoie les chemins inconnus à <code>index.php</code>. Cela n'affecte pas l'AutoSSL de cPanel, qui utilise <code>/.well-known/acme-challenge/</code>. Un site installé dans un sous-dossier (par exemple <code>example.com/joomla</code>) a aussi besoin d'une règle à la racine du domaine qui envoie <code>/.well-known/oauth-authorization-server/joomla</code> vers le sous-dossier."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Se connecter depuis un serveur ou une machine sans navigateur"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Les clients de bureau (Claude Code, Codex, Cursor, Gemini CLI) ouvrent un navigateur sur la même machine et attendent la réponse sur une adresse locale ; la connexion OAuth a donc besoin d'un navigateur sur place. Sur un serveur sans écran ou via SSH, utilisez plutôt la méthode par clé API de la Configuration avancée ; elle fonctionne partout."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="Dans l'application d'IA, ajoutez un nouveau connecteur (claude.ai et Claude Desktop : Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector ; ChatGPT : Plugins &rarr; Add &rarr; Add custom MCP server) et collez cette <strong>URL du point d'accès</strong> : %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Cliquez sur Connect.</strong> L'application ouvre d'elle-même la page de connexion de ce site. Connectez-vous avec votre identifiant et votre mot de passe pour ce site."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Cliquez sur Autoriser.</strong> Vous revenez dans l'application, connecté. L'application peut faire tout ce que votre compte est autorisé à faire sur ce site."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Connecter une application d'IA à ce site"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Il y a trois façons. Cliquez sur l'une d'elles pour afficher ses étapes numérotées. La plupart des gens veulent la première."
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. Se connecter par identification (le plus simple) &mdash; ChatGPT, claude.ai, Claude Desktop et la plupart des autres applications d'IA"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Coller un prompt de configuration &mdash; pour un chat d'IA capable d'exécuter des commandes"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. Fichier de configuration ou ligne de commande &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI et autres"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Fonctionne dans les applications d'IA capables d'exécuter des commandes (Codex, Claude Code, Cursor, Cline, le mode agent de Copilot et similaires). L'IA teste elle-même la connexion et peut proposer de la rendre permanente."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="Pour les applications qui se configurent avec un fichier de réglages ou une commande. Vous le faites une fois et la connexion reste en place."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>Obtenez votre jeton API.</strong> Cliquez sur le bouton : votre profil utilisateur s'ouvre dans un nouvel onglet. Ouvrez-y l'onglet <strong>Jeton Joomla</strong>, cliquez sur l'icône en forme d'œil pour afficher le jeton et copiez-le. Revenez ensuite à cet onglet."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="Obtenir mon jeton API (ouvre un nouvel onglet)"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>Copiez le prompt.</strong> Votre jeton y est déjà."
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="<strong>Collez-le dans une nouvelle conversation</strong> avec votre application d'IA et envoyez. L'IA teste la connexion et, si elle le peut, propose de la rendre permanente."
COM_CSMCPFORJ_DASHBOARD_WAY3_STEP_COPY="<strong>Copiez la configuration.</strong> Votre jeton y est déjà."
COM_CSMCPFORJ_DASHBOARD_WAY3_GUIDE_LINK="Les instructions pas à pas pour chaque application sont dans le guide de configuration &rarr;"
COM_CSMCPFORJ_DASHBOARD_COPY_URL_BUTTON="Copier"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1_COPY="<strong>Copiez l'URL du point d'accès.</strong>"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2_ADD="<strong>Ajoutez l'URL du point d'accès comme connecteur dans votre application d'IA.</strong> L'endroit dépend de l'application :"
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN="Se connecter par identification"
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN_ON="Les applications d'IA peuvent se connecter par identification."

