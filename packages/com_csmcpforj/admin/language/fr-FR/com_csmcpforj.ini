COM_CSMCPFORJ_CHECK_REDIRECT="Redirigé (HTTP %d) vers %s. Les applications d'IA doivent utiliser exactement l'adresse à laquelle le site répond, sans redirection. Utilisez cette adresse dans l'application, ou modifiez le site pour qu'il ne redirige pas."
COM_CSMCPFORJ_CHECK_UNEXPECTED="Autre chose que MCP for J a répondu (HTTP %d) : '%s'. La cause habituelle est un pare-feu ; voir Dépannage ci-dessous."
COM_CSMCPFORJ_CHECK_CLOUDFLARE="Ce site est derrière Cloudflare. Si cette réponse est une page Cloudflare, ajoutez une règle personnalisée du WAF avec l'action Skip pour les adresses MCP et de connexion, en cochant Browser Integrity Check et Security Level (voir Dépannage ci-dessous)."
COM_CSMCPFORJ_CHECK_UNREACHABLE="Le serveur web n'a pas pu joindre sa propre adresse publique (%s). Certains hébergeurs ne le permettent pas, cette vérification ne peut donc pas conclure. Essayez de vous connecter depuis l'application et consultez les journaux."

; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Pare-feu et extensions d'URL"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall est activé."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="Il peut bloquer les requêtes MCP (&ldquo;403 Access Forbidden &mdash; Malware detected&rdquo;) et la connexion de claude.ai. Dans RSFirewall, ajoutez deux exceptions : <code>csmcpforj_oauth</code>, et <code>api\/index\.php\/v1\/mcp</code> comme expression régulière."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools est activé."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="Son Web Application Firewall peut bloquer les requêtes MCP et la connexion. Si <strong>Vérifier la connexion</strong> montre un blocage, retrouvez la règle dans le Blocked Requests Log d'Admin Tools et ajoutez une exception WAF, ou désactivez cette règle. Autorisez <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> et les URL contenant <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck est activé."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="Son pare-feu peut bloquer les requêtes MCP et la connexion. Si <strong>Vérifier la connexion</strong> montre un blocage, retrouvez la requête dans ses journaux et ajoutez une exception pour <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> et les URL contenant <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 est activé."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Cette extension SEO peut intercepter les adresses de connexion (<code>index.php?csmcpforj_oauth=&hellip;</code>) et répondre par la page d'accueil, si bien que claude.ai ou ChatGPT ne peut pas s'enregistrer et ne donne aucune raison claire. Si <strong>Vérifier la connexion</strong> montre la page d'accueil pour les points d'accès de connexion, excluez dans Route 66 les URL contenant <code>csmcpforj_oauth</code>, ou désactivez son plugin système."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Les pare-feu gérés par l'hébergeur peuvent aussi bloquer : o2switch TigerProtect répond 503, et les règles d'Imunify360, de ModSecurity ou de Cloudflare répondent 403. Demandez à l'hébergeur d'autoriser les adresses ci-dessus, ou de laisser passer les serveurs d'Anthropic (<code>160.79.104.0/21</code>) pour claude.ai. <strong>Cloudflare</strong> : Browser Integrity Check et Security Level peuvent bloquer les serveurs des applications. Ajoutez une règle personnalisée du WAF (Security &rarr; WAF &rarr; Custom rules) avec l'action <strong>Skip</strong> pour les requêtes dont le chemin d'URI contient <code>/api/index.php/v1/mcp</code> ou <code>/.well-known/oauth-</code>, ou dont la chaîne de requête contient <code>csmcpforj_oauth</code>, et cochez <em>Browser Integrity Check</em> et <em>Security Level</em>. Bot Fight Mode ne peut pas être contourné par une règle ; désactivez-le s'il bloque."

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Liste de vérification claude.ai : &ldquo;cannot register&rdquo;, &ldquo;Authorization failed&rdquo; ou &ldquo;Couldn't reach the MCP server&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Passez-les dans l'ordre. Chacun de ces points a déjà coûté des heures à quelqu'un."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Utilisez exactement cette adresse : <code>%s</code>. Avec ou sans <em>www</em> doit correspondre à la façon dont le site répond, <strong>sans redirection</strong> entre les deux (de www vers le domaine nu, ou de http vers https). Le bouton <strong>Vérifier la connexion</strong> du tableau de bord signale une redirection."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="La connexion OAuth est activée sur ce site. claude.ai ne peut se connecter que par identification, elle doit donc rester activée."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>La connexion OAuth est désactivée sur ce site.</strong> claude.ai ne peut se connecter que par identification, donc un Super User doit d'abord l'activer : Composants &rarr; MCP for J &rarr; Paramètres &rarr; <strong>Connexion OAuth</strong>. Tant qu'elle est désactivée, claude.ai indique &ldquo;cannot register&rdquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="Dans la boîte de dialogue <strong>Add custom connector</strong>, choisissez <strong>Sign in now</strong>. Pour le client OAuth, <strong>Use Claude's published identity</strong> et <strong>Register automatically</strong> fonctionnent tous les deux (l'identité publiée nécessite l'extension curl de PHP sur le serveur). Laissez le client ID et le secret vides. Si une méthode échoue, supprimez le connecteur et ajoutez-le à nouveau avec l'autre."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>N'ajoutez pas d'en-têtes de requête.</strong> claude.ai n'accepte pas d'en-tête <code>X-Joomla-Token</code>, une clé API ne peut donc pas y être utilisée. L'identification est le seul moyen d'entrer depuis claude.ai."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Les pare-feu doivent laisser passer les serveurs de claude.ai. Ils se connectent depuis <code>160.79.104.0/21</code>, pas depuis votre navigateur. RSFirewall a besoin de deux exceptions : <code>csmcpforj_oauth</code>, et <code>api\/index\.php\/v1\/mcp</code> comme expression régulière. Admin Tools, Securitycheck et les pare-feu d'hébergeur comme o2switch TigerProtect (qui répond 503) peuvent aussi le bloquer. <strong>Cloudflare</strong> : Browser Integrity Check et Security Level peuvent bloquer les serveurs des applications. Ajoutez une règle personnalisée du WAF (Security &rarr; WAF &rarr; Custom rules) avec l'action <strong>Skip</strong> pour les requêtes dont le chemin d'URI contient <code>/api/index.php/v1/mcp</code> ou <code>/.well-known/oauth-</code>, ou dont la chaîne de requête contient <code>csmcpforj_oauth</code>, et cochez <em>Browser Integrity Check</em> et <em>Security Level</em>. Bot Fight Mode ne peut pas être contourné par une règle ; désactivez-le s'il bloque. Le bouton <strong>Vérifier la connexion</strong> du tableau de bord montre ce qui répond."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> et d'autres extensions SEO qui réécrivent les URL peuvent intercepter les adresses de connexion (<code>index.php?csmcpforj_oauth=&hellip;</code>) et répondre par la page d'accueil, si bien que l'application ne peut pas s'enregistrer et ne donne aucune raison claire. Si <strong>Vérifier la connexion</strong> montre la page d'accueil pour les points d'accès de connexion, excluez dans cette extension les URL contenant <code>csmcpforj_oauth</code>, ou désactivez son plugin système."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Connectez-vous avec un compte autorisé à utiliser MCP (voir <em>Qui peut utiliser ce point d'accès ?</em> sur le tableau de bord). Si cela échoue pour une seule personne, vérifiez que son compte n'est pas bloqué et que <em>Forcer la réinitialisation du mot de passe</em> n'est pas activé."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="Toujours bloqué ? Composants &rarr; MCP for J &rarr; <strong>Journaux</strong> montre chaque étape de l'identification et pourquoi une étape a été refusée."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_JUMP="Aller à :"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_LOGIN="claude.ai, ChatGPT et les autres applications qui se connectent par identification"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_DESKTOP="Claude Desktop avec un fichier de configuration"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_ERRORS="Messages d'erreur, dans toutes les applications"
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_ALL_LINK="Tout le dépannage, regroupé par application &rarr;"
