COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Affiche les add-ons Pro dans le catalogue même si vous n'avez pas d'abonnement Pro en ce moment. Pratique pour voir ce qui existe ; choisissez Non pour les masquer complètement."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Revérifier l'abonnement toutes les (secondes)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="À quelle fréquence le tableau de bord redemande à cybersalt.com si l'adresse e-mail liée a toujours l'accès Pro. 86400 = une fois par jour (recommandé). Minimum 60, maximum 604800 = une fois par semaine."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="Serveur MCP"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Réglages côté serveur pour le point d'accès MCP. Ils déterminent ce que les clients MCP voient et peuvent appeler."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Mode lecture seule"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="Sur OUI, le point d'accès MCP n'annonce et n'accepte que les outils dont les ToolAnnotations MCP indiquent la lecture seule (list_*, get_*, read_*, check_*, validate_*, fetch_*, plus joomla_update_healthcheck). Utile si vous voulez qu'un client d'IA explore le site sans pouvoir modifier le contenu. Les écritures renvoient une erreur expliquant que le serveur est en mode lecture seule. Le réglage est un plancher : un client MCP peut aussi ajouter ?read_only=1 à l'URL du point d'accès pour se restreindre davantage, mais ne peut PAS débloquer les écritures sur un site réglé sur OUI."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Confidentialité lors des captures d'écran"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Réglages du floutage des secrets sur le tableau de bord (le jeton API Joomla dans l'aperçu du prompt, l'e-mail de l'abonnement Pro). Le floutage est actif par défaut ; ces options ajustent l'affichage au survol pour qu'un passage de souris anodin ne révèle pas le secret par accident pendant un partage ou une capture d'écran."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Délai d'affichage au survol (secondes)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Combien de secondes vous devez garder le pointeur sur un secret flouté avant qu'il s'affiche. Pendant que vous le maintenez, un petit compte à rebours apparaît à côté du secret pour montrer que le minuteur tourne. Éloigner la souris annule l'affichage et remet le minuteur à zéro &mdash; le survol suivant repart d'un compte à rebours complet. Mettez 0 pour un affichage immédiat au survol (cela supprime la protection contre les survols accidentels mais rétablit le comportement classique). Par défaut : 3 secondes."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Masquer automatiquement après affichage (secondes)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Combien de secondes un secret affiché au survol reste visible avant d'être flouté à nouveau automatiquement &mdash; même si la souris est toujours dessus. Une précaution de plus pour les cas du genre &ldquo;j'ai regardé, je l'ai lu, puis j'ai été distrait&rdquo;, où un navigateur laissé sans surveillance laisserait sinon le secret visible indéfiniment. Éloigner la souris le floute toujours aussitôt, quel que soit ce réglage. Mettez 0 pour désactiver le masquage automatique (les secrets affichés restent visibles jusqu'à ce que vous éloigniez la souris). Par défaut : 8 secondes &mdash; assez pour lire tranquillement un jeton base64 complet, assez court pour qu'une session sans surveillance n'expose pas le secret."

