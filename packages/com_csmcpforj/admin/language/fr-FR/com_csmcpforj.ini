COM_CSMCPFORJ_SUPPORT_BANNER_PRO_HEADING="Vous avez un abonnement MCP for J Pro actif &mdash; merci !"
COM_CSMCPFORJ_SUPPORT_BANNER_PRO_BODY="Les abonnés Pro bénéficient d'une assistance prioritaire. Vos messages arrivent dans notre boîte de réception avec une étiquette Pro, nous les voyons donc en premier et répondons aussi vite que possible. Demandez-nous ce que vous voulez &mdash; rapports de bogues, demandes de fonctionnalités, questions, idées &mdash; tout est bienvenu."

COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_HEADING="Nous aimons avoir de vos nouvelles"
COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_BODY="Envoyez-nous vos rapports de bogues, demandes de fonctionnalités, questions et idées &mdash; nous les lisons tous et apprécions vos retours. L'assistance pour la version gratuite est assurée au mieux (nos ressources pour l'assistance gratuite sont limitées), les réponses peuvent donc prendre du temps. Si vous avez besoin de délais de réponse garantis ou d'une attention prioritaire, envisagez %sun abonnement MCP for J Pro%s."

