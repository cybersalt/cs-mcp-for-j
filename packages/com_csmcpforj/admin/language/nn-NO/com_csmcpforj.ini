COM_CSMCPFORJ_DASHBOARD_OAUTH_REFUSED_TITLE="Ein KI-app prøvde å kople til ved å logge inn."
COM_CSMCPFORJ_DASHBOARD_OAUTH_REFUSED_BODY="Denne nettstaden avviste %d innloggingsførespurnad(er) dei siste 24 timane fordi OAuth-innlogging er slått av. claude.ai rapporterer dette som &laquo;cannot register&raquo;. Slå det på, og kople deretter til på nytt frå appen."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OFF_OK="Slått av, så claude.ai og ChatGPT kan ikkje kople til enno. Sjølve innloggingsadressa verkar, så du treng berre å slå det på."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OFF_FAIL="Slått av. KI-appar kan heller ikkje nå innloggingsadressa på denne nettstaden, så etter at du har slått det på, slår du også på <strong>Bruk omskriving av nettadresse</strong> i System &rarr; Globale innstillingar og kontrollerer at .htaccess-fila til nettstaden er på plass."
COM_CSMCPFORJ_DASHBOARD_CLAUDE_CHECKLIST_LINK="Koplar du til claude.ai? Gå gjennom sjekklista &rarr;"
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_TITLE="403, 503 eller &laquo;Malware detected&raquo; frå nettstaden"
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_BODY="Ein brannmur blokkerer førespurnaden før MCP for J ser han. Klikk på <strong>Kontroller tilkoplinga</strong> ovanfor for å sjå kva adresse som er blokkert. I RSFirewall legg du til unntak for <code>csmcpforj_oauth</code> og <code>api\/index\.php\/v1\/mcp</code> (regulært uttrykk). Brannmurar hos vertsleverandøren (o2switch TigerProtect, Imunify360) må tillate dei same adressene. <strong>Cloudflare</strong>: Browser Integrity Check og Security Level kan blokkere tenarane til appane. Legg til ein eigendefinert WAF-regel (Security &rarr; WAF &rarr; Custom rules) med handlinga <strong>Skip</strong> for førespurnader der URI-stien inneheld <code>/api/index.php/v1/mcp</code> eller <code>/.well-known/oauth-</code>, eller der spørjestrengen inneheld <code>csmcpforj_oauth</code>, og kryss av for <em>Browser Integrity Check</em> og <em>Security Level</em>. Bot Fight Mode kan ikkje hoppast over med ein regel, så slå det av viss det blokkerer."
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_CLAUDE_TITLE="claude.ai seier &laquo;cannot register&raquo;, eller autorisasjonen mislukkast"

