COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_LABEL="Katalog"
COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_DESC="Innstillingar for katalogen over MCP-tillegg."
COM_CSMCPFORJ_CONFIG_CATALOG_URL_LABEL="Endepunkt-URL for katalogen"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_DESC="Kvar katalogen over MCP-tillegg blir henta frå. La standardverdien stå med mindre du køyrer ein privat spegel av katalogen; ein rein basis-URL får /catalog.json lagt til."
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="Levetid for katalogbuffer (timar)"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="Kor lenge den henta catalog.json blir bufra før ho blir henta på nytt. Ein manuell oppdateringsknapp på katalogsida omgår dette. Område 1&ndash;168 (éi veke)."
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="Vis utilgjengelege Pro-tillegg"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Vis Pro-tillegg i katalogen sjølv om du for augneblinken ikkje har Pro-medlemskap. Nyttig for å sjå kva som finst; set til Nei for å skjule dei heilt."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Kontroller medlemskapet på nytt kvart (sekund)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="Kor ofte oversikta spør cybersalt.com på nytt om den kopla e-postadressa framleis har Pro-tilgang. 86400 = éin gong om dagen (tilrådd). Minimum 60, maksimum 604800 = éin gong i veka."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="MCP-tenar"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Kontrollar på tenarsida for MCP-endepunktet. Påverkar kva MCP-klientar ser og kan kalle."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Skriveverna modus"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="Når JA, kunngjer og godtek MCP-endepunktet berre verktøy som MCP ToolAnnotations angir som skriveverna (list_*, get_*, read_*, check_*, validate_*, fetch_* og joomla_update_healthcheck). Nyttig når du vil at ein KI-klient skal utforske nettstaden utan å kunne endre innhald. Skriving gjev ein feil som forklarer at tenaren er i skriveverna modus. Innstillinga er eit golv: ein MCP-klient kan også sende ?read_only=1 på endepunkt-URL-en for å avgrense vidare, men kan ikkje LÅSE OPP skriving på ein nettstad som har dette sett til JA."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Personvern ved skjermopptak"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Kontrollar for vern av løyndomar med uskarpheit på oversikta (Joomla API-token i førehandsvisinga av prompten, e-post for Pro-medlemskap). Uskarpheit er på som standard; desse alternativa justerer visning ved å halde musa over, slik at ei tilfeldig muserørsle ikkje avslører løyndomen ved skjermdeling eller skjermopptak."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Forseinking før visning ved musepeikar (sekund)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Kor mange sekund du må halde musepeikaren over ein uskarp løyndom før han blir vist. Ei lita nedteljing blir vist ved sida av løyndomen medan du held peikaren der, så du veit at tidtakaren går. Flyttar du musa bort, blir visninga avbroten og tidtakaren nullstilt &mdash; neste gong startar ei ny nedteljing i full lengd. Set til 0 for å vise med ein gong (fjernar vernet mot tilfeldig muserørsle, men gjev tilbake den klassiske åtferda). Standard 3 sekund."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Skjul automatisk etter visning (sekund)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Når ein løyndom er vist ved å halde musepeikaren over han, kor mange sekund han er synleg før han automatisk blir uskarp igjen &mdash; sjølv om musa framleis er over han. Ekstra sikring for situasjonar der du &laquo;kikka, las og så vart avbroten&raquo;, der ein nettlesar utan tilsyn elles kunne late løyndomen stå synleg på ubestemt tid. Flyttar du musa bort, blir han alltid uskarp med ein gong uansett denne innstillinga. Set til 0 for å slå av automatisk skjuling (viste løyndomar er synlege til du flyttar musa). Standard 8 sekund &mdash; lenge nok til å lese eit heilt base64-token i ro og mak, kort nok til at ei økt utan tilsyn ikkje avslører løyndomen."

