COM_CSMCPFORJ_OAUTH_REVOKE_NOTHING="Den appen hadde ingen aktiv tilgang å kople frå."
COM_CSMCPFORJ_ACTIONLOG_OAUTH_CONSENT="Brukaren <a href=&quot;{accountlink}&quot;>{username}</a> kopla appen &laquo;{title}&raquo; til MCP for J (OAuth)"
