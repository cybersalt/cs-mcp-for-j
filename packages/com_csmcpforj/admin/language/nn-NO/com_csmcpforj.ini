COM_CSMCPFORJ_SUPPORT_BANNER_PRO_HEADING="Du har eit aktivt MCP for J Pro-medlemskap &mdash; takk!"
COM_CSMCPFORJ_SUPPORT_BANNER_PRO_BODY="Pro-medlemmer får prioritert støtte. Meldingane dine kjem inn med ei Pro-støttemerking, så vi ser dei først og svarer så raskt vi kan. Spør oss om kva som helst &mdash; feilrapportar, funksjonsønske, spørsmål, idear &mdash; alt er velkome."

COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_HEADING="Vi set pris på å høyre frå deg"
COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_BODY="Send oss feilrapportar, funksjonsønske, spørsmål og idear &mdash; vi les alt og set pris på tilbakemeldingane. Støtte for gratisversjonen blir gitt etter beste evne (ressursane våre til gratis støtte er avgrensa), så svar kan ta litt tid. Viss du treng garanterte svartider eller prioritert merksemd, kan du vurdere %seit MCP for J Pro-medlemskap%s."

