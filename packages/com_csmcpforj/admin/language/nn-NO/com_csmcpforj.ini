; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Kven kan bruke dette endepunktet?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="Rettar blir kontrollerte mot Joomla-brukarkontoen som eig API-tokenet. MCP-klienten (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl eller noko anna) berre sender vidare &mdash; det same tokenet oppfører seg likt frå alle klientar."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Viktig:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Den som genererer tokenet, får den same tilgangen gjennom MCP-endepunktet som vedkomande har elles i Joomla-administrasjonen. Generer berre token for brukarar du ville stole på til å gjere desse handlingane direkte."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Joomla-brukargruppe"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Verkar det med ein gong?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Kvifor"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Ja"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Må givast uttrykkeleg"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Super Users består alltid alle rettskontrollar i Joomla."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Har core.manage gjennom standardrettane i Joomla, som MCP-kontrollen godtek for lese- og skriveverktøy (verktøya som endrar rettar, utvidingar, innstillingar for programtillegg eller sjølve Joomla, krev framleis ein Super User) &mdash; men gruppa treng framleis <strong>Innlogging for nettenester</strong> før Joomla i det heile lèt henne autentisere seg."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="Har ingen MCP-rett som standard. Gje gruppa <strong>Innlogging for nettenester</strong> i System &rarr; Globale innstillingar &rarr; Rettar, og deretter Bruke MCP-endepunktet og (valfritt) Skrive gjennom MCP-endepunktet under <strong>Innstillingar &rarr; Rettar</strong> for denne komponenten."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Treng Innlogging for nettenester"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Før noko av dette gjeld:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla vernar heile API-et med ein eigen rett som heiter <strong>Innlogging for nettenester</strong> (<code>core.login.api</code>), og <strong>berre Super Users har han som standard</strong>. Alle andre grupper &mdash; også Administrator og Manager &mdash; får <code>403 Forbidden</code> frå alle verktøy til du gjev dei retten, uansett kva anna dei kan gjere i administrasjonen. Set han i <strong>System &rarr; Globale innstillingar &rarr; Rettar</strong>, på gruppa, ikkje på denne komponenten."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / eigendefinert gruppe"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Gje gruppa <strong>Innlogging for nettenester</strong> i System &rarr; Globale innstillingar &rarr; Rettar, og deretter Bruke MCP-endepunktet og (valfritt) Skrive gjennom MCP-endepunktet under <strong>Innstillingar &rarr; Rettar</strong> for denne komponenten."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Kople ein KI-assistent til denne nettstaden"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Det er to måtar å gjere det på. Den første (kopier og lim inn ein prompt) er enklast &mdash; han verkar utan nokon klientkonfigurasjon, og når KI-en har stadfesta at metoden verkar, tilbyr KI-en vanlegvis å installere denne nettstaden som ei permanent kopling for deg utan manuell redigering av JSON. Den andre er for brukarar som heller vil redigere klientkonfigurasjonen direkte."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Kopier ein oppsettsprompt (tilrådd)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Lim inn ein oppsettsprompt i KI-assistenten din"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Du treng ingen klientkonfigurasjon. Kopier prompten nedanfor til ein ny samtale med KI-assistenten din (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini osb.). KI-en køyrer ein test med curl, stadfestar tilkoplinga og &mdash; i klientar som støttar det &mdash; tilbyr å gjere tilkoplinga permanent for deg, utan JSON-filer å redigere og utan terminalkommandoar å hugse."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Bonus:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Viss KI-klienten din har eit skalverktøy (Codex, Claude Code, Cursor Composer, Cline, Continue, agentmodus i GitHub Copilot osb.), inneheld prompten eit tilbod om sjølvinstallasjon. Sei berre &laquo;make it permanent&raquo; etter at KI-en har stadfesta at tilkoplinga verkar, så køyrer KI-en rett kommando for klienten for å registrere MCP-tenaren (til dømes <code>codex mcp add</code> eller <code>claude mcp add</code>). Etter ein omstart av klienten blir denne nettstaden vist som innebygde MCP-verktøy i alle samtalar &mdash; du treng aldri ein prompt igjen."
