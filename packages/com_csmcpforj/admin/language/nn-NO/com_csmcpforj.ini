COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Generer eit Joomla API-token i profilen din (lenkje til høgre)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Klikk på &laquo;Kopier prompt&raquo; nedanfor."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Lim han inn i ein ny samtale med KI-assistenten din. Viss du hoppa over steg 2, må du først byte ut <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> med det faktiske tokenet ditt."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Send. KI-en testar tilkoplinga og tilbyr, i klientar som støttar det, å gjere henne permanent."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Denne prompten verkar i alle KI-klientar med eit skal-/terminalverktøy: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (agentmodus), Gemini CLI, Windsurf, mcp-cli osb. Han verkar ikkje i reine nettbaserte chatgrensesnitt (claude.ai, chatgpt.com, gemini.google.com) som manglar skaltilgang &mdash; bruk fana MCP-kopling for desse."

; Tab 2 — manual MCP connector configuration
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="MCP-kopling (manuell konfigurasjon)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="Legg til manuelt som MCP-kopling"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="For Claude Desktop (konfigurasjonsfil), Claude Code, Cursor, Codex, Cline, Copilot, Gemini CLI eller kva klient som helst der du heller vil redigere konfigurasjonen direkte. Eingongsoppsett som gjeld for alle samtalar. (Eigendefinerte koplingar i claude.ai og ChatGPT kan ikkje sende ein API-nøkkel: dei koplar til ved innlogging. Sjå <strong>Kople til ved innlogging (OAuth)</strong> på denne sida.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="Generer eit Joomla API-token i profilen din."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="Kopier konfigurasjonsutdraget nedanfor."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP3="Byt ut <code>YOUR_JOOMLA_API_TOKEN</code> med tokenet du genererte."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Lim det inn i MCP-konfigurasjonen til KI-klienten din &mdash; Claude Desktop: <code>claude_desktop_config.json</code>; Claude Code: <code>claude mcp add</code>; Cursor: <code>~/.cursor/mcp.json</code>; GitHub Copilot: MCP-innstillingar i VS Code / JetBrains; Cline / Continue: innstillings-JSON for utvidinga. Start klienten på nytt etter at du har lagra. (Dialogane &laquo;Add custom connector&raquo; i claude.ai og ChatGPT har ikkje noko felt for dette; bruk OAuth-innlogging for desse.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_XHEADER_NOTE="Viss klienten din ikkje støttar eit Authorization-hovud, byter du ut headers-blokka med:"

