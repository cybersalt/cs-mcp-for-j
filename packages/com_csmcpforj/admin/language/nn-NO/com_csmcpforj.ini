COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="OAuth-innlogging"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Lèt KI-appar kople til ved å sende deg til innloggingssida på denne nettstaden, i staden for at du kopierer ein API-nøkkel inn i dei. ChatGPT (&laquo;Add custom MCP server&raquo;) og claude.ai / Claude Desktop (&laquo;Add custom connector&raquo;) kan berre kople til på denne måten. Tilkoplingar som brukar ein API-nøkkel, held fram med å verke uansett."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="Aktiver OAuth-innlogging"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Når dette er på, limer du MCP-adressa til denne nettstaden inn i ein KI-app, appen opnar innloggingssida på denne nettstaden, du loggar inn med det vanlege brukarnamnet og passordet ditt og klikkar på Tillat. Appen handlar deretter som deg, med nøyaktig dine rettar på denne nettstaden. Tilkopla appar er oppførte på oversikta, der kvar av dei kan koplast frå. Slår du av dette, blir alle kopla frå med ein gong."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Levetid for tilgangstoken (sekund)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Kor lenge kvart tilgangstoken varer før appen fornyar det i det stille. Standard 3600 (éin time). Mellom 300 og 86400."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Vere logga inn i (dagar)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Kor lenge ein app kan halde fram med å fornye utan at brukaren loggar inn på nytt. Kvar fornying nullstiller tida. Standard 30."
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="Kople til KI-appar ved å logge inn"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="Nokre KI-appar, mellom anna ChatGPT og claude.ai, kan berre kople til ein nettstad ved å sende deg til innloggingssida på den nettstaden. Dette er slått av på denne nettstaden, så desse appane kan ikkje kople til enno. Slå på <strong>OAuth-innlogging</strong> i Innstillingar for å tillate det. Tilkoplingar som brukar ein API-nøkkel, held fram med å verke uansett."
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="Opne Innstillingar for å slå det på"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="Du treng ingen API-nøkkel. Det einaste du kopierer, er <strong>endepunkt-URL-en</strong> til denne nettstaden."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="Kontrollerer at KI-appar kan finne innloggingssida på denne nettstaden&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>Klar.</strong> KI-appar kan finne innloggingssida på denne nettstaden."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>Ikkje klar.</strong> KI-appar finn ikkje innloggingssida på denne nettstaden, så dei kan ikkje kople til. For å løyse dette slår du på <strong>Bruk omskriving av nettadresse</strong> i System &rarr; Globale innstillingar og kontrollerer at .htaccess-fila til nettstaden er på plass. Feilsøkingsdelen i oppsettsrettleiinga har detaljane."
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_HEADING="Tilkopla appar"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_NONE="Ingen KI-appar er tilkopla enno. Ein app blir vist her etter at nokon har logga inn og klikka på Tillat."
