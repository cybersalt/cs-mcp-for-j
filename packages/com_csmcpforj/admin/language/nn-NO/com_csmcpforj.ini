; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Brannmur og URL-utvidingar"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall er slått på."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="Programmet kan blokkere MCP-førespurnader (&laquo;403 Access Forbidden &mdash; Malware detected&raquo;) og innlogginga til claude.ai. I RSFirewall legg du til to unntak: <code>csmcpforj_oauth</code>, og <code>api\/index\.php\/v1\/mcp</code> som regulært uttrykk."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools er slått på."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="Web Application Firewall i programmet kan blokkere MCP-førespurnader og innlogginga. Viss <strong>Kontroller tilkoplinga</strong> viser ei blokkering, finn du regelen i Blocked Requests Log i Admin Tools og legg til eit WAF-unntak, eller slår av den regelen. Tillat <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> og URL-ar som inneheld <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck er slått på."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="Brannmuren kan blokkere MCP-førespurnader og innlogginga. Viss <strong>Kontroller tilkoplinga</strong> viser ei blokkering, finn du førespurnaden i loggane og legg til eit unntak for <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> og URL-ar som inneheld <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 er slått på."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Denne SEO-utvidinga kan fange opp innloggingsadressene (<code>index.php?csmcpforj_oauth=&hellip;</code>) og svare med framsida, slik at claude.ai eller ChatGPT ikkje kan registrere seg og ikkje oppgjev nokon tydeleg grunn. Viss <strong>Kontroller tilkoplinga</strong> viser framsida for innloggingsendepunkta, utelèt du URL-ar som inneheld <code>csmcpforj_oauth</code> i Route 66, eller slår av systemprogramtillegget."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Brannmurar hos vertsleverandøren kan også blokkere: o2switch TigerProtect svarer 503, og reglar i Imunify360, ModSecurity eller Cloudflare svarer 403. Be vertsleverandøren om å tillate adressene ovanfor, eller om å sleppe gjennom tenarane til Anthropic (<code>160.79.104.0/21</code>) for claude.ai. <strong>Cloudflare</strong>: Browser Integrity Check og Security Level kan blokkere tenarane til appane. Legg til ein eigendefinert WAF-regel (Security &rarr; WAF &rarr; Custom rules) med handlinga <strong>Skip</strong> for førespurnader der URI-stien inneheld <code>/api/index.php/v1/mcp</code> eller <code>/.well-known/oauth-</code>, eller der spørjestrengen inneheld <code>csmcpforj_oauth</code>, og kryss av for <em>Browser Integrity Check</em> og <em>Security Level</em>. Bot Fight Mode kan ikkje hoppast over med ein regel, så slå det av viss det blokkerer."

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Sjekkliste for claude.ai: &laquo;cannot register&raquo;, &laquo;Authorization failed&raquo; eller &laquo;Couldn't reach the MCP server&raquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Gå gjennom desse i rekkjefølgje. Kvar av dei har kosta nokon timar."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Bruk nøyaktig denne adressa: <code>%s</code>. Med eller utan <em>www</em> må stemme med korleis nettstaden svarer, <strong>utan omdirigering</strong> imellom (frå www til det reine domenet, eller frå http til https). Knappen <strong>Kontroller tilkoplinga</strong> på oversikta varslar om ei omdirigering."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="OAuth-innlogging er slått på på denne nettstaden. claude.ai kan berre kople til ved innlogging, så dette må vere på."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>OAuth-innlogging er slått av på denne nettstaden.</strong> claude.ai kan berre kople til ved innlogging, så ein Super User må slå det på først: Komponentar &rarr; MCP for J &rarr; Innstillingar &rarr; <strong>OAuth-innlogging</strong>. Medan det er av, seier claude.ai &laquo;cannot register&raquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="I dialogen <strong>Add custom connector</strong> vel du <strong>Sign in now</strong>. For OAuth-klienten verkar både <strong>Use Claude's published identity</strong> og <strong>Register automatically</strong> (den publiserte identiteten krev PHP-utvidinga curl på tenaren). La klient-ID og løyndom stå tomme. Viss éin måte mislukkast, fjernar du koplinga og legg ho til på nytt med den andre."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>Ikkje legg til førespurnadshovud.</strong> claude.ai godtek ikkje eit <code>X-Joomla-Token</code>-hovud, så ein API-nøkkel kan ikkje brukast der. Innlogging er den einaste vegen inn frå claude.ai."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Brannmurar må sleppe gjennom tenarane til claude.ai. Dei koplar til frå <code>160.79.104.0/21</code>, ikkje frå nettlesaren din. RSFirewall treng to unntak: <code>csmcpforj_oauth</code>, og <code>api\/index\.php\/v1\/mcp</code> som regulært uttrykk. Admin Tools, Securitycheck og brannmurar hos vertsleverandøren, som o2switch TigerProtect (som svarer 503), kan også blokkere. <strong>Cloudflare</strong>: Browser Integrity Check og Security Level kan blokkere tenarane til appane. Legg til ein eigendefinert WAF-regel (Security &rarr; WAF &rarr; Custom rules) med handlinga <strong>Skip</strong> for førespurnader der URI-stien inneheld <code>/api/index.php/v1/mcp</code> eller <code>/.well-known/oauth-</code>, eller der spørjestrengen inneheld <code>csmcpforj_oauth</code>, og kryss av for <em>Browser Integrity Check</em> og <em>Security Level</em>. Bot Fight Mode kan ikkje hoppast over med ein regel, så slå det av viss det blokkerer. Knappen <strong>Kontroller tilkoplinga</strong> på oversikta viser kva som svarer."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> og andre SEO-utvidingar som skriv om URL-ar, kan fange opp innloggingsadressene (<code>index.php?csmcpforj_oauth=&hellip;</code>) og svare med framsida, slik at appen ikkje kan registrere seg og ikkje oppgjev nokon tydeleg grunn. Viss <strong>Kontroller tilkoplinga</strong> viser framsida for innloggingsendepunkta, utelèt du URL-ar som inneheld <code>csmcpforj_oauth</code> i den utvidinga, eller slår av systemprogramtillegget til utvidinga."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Logg inn med ein konto som har lov til å bruke MCP (sjå <em>Kven kan bruke dette endepunktet?</em> på oversikta). Viss det berre mislukkast for éin person, kontrollerer du at kontoen ikkje er blokkert og ikkje er sett til <em>Krev tilbakestilling av passord</em>."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="Står du framleis fast? Komponentar &rarr; MCP for J &rarr; <strong>Loggar</strong> viser kvart steg i innlogginga, og kvifor eit steg vart avvist."
