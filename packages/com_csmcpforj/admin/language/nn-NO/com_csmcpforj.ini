COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="Kople til ved å logge inn (enklast)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Ingen API-nøkkel å kopiere. I KI-appen din legg du til ei kopling og limer inn <strong>endepunkt-URL-en</strong> til denne nettstaden (nedanfor). Når du klikkar på Connect, opnar appen innloggingssida på denne nettstaden av seg sjølv: logg inn med brukarnamnet og passordet ditt for denne nettstaden, og klikk deretter på <strong>Tillat</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai og Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Gje koplinga eit namn, lim inn endepunkt-URL-en og klikk på Continue. Behald <em>Sign in now</em>; for OAuth-klienten verkar både <em>Use Claude's published identity</em> og <em>Register automatically</em>. Ikkje legg til førespurnadshovud. Klikk på Add og deretter på <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> <strong>Plugins</strong> i venstre sidepanel &rarr; <strong>Add</strong> (øvst til høgre) &rarr; <strong>Add custom MCP server</strong>. Gje tenaren eit namn, lim inn endepunkt-URL-en, la Authentication stå på <strong>OAuth</strong>, kryss av i boksen, klikk på <strong>Create as a plugin</strong> og deretter på <strong>Connect</strong>. Krev eit betalt ChatGPT-abonnement (Plus verkar)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>, skriv deretter <code>/mcp</code>, vel tenaren og vel <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> Command Palette &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; lim inn endepunkt-URL-en. VS Code ber deg logge inn."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> legg til <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> under <code>mcpServers</code> i <code>mcp.json</code> (utan hovud), og klikk deretter på <strong>Login</strong> ved sida av tenaren i Settings &rarr; MCP."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> legg til <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> for tenaren i <code>settings.json</code>, og køyr deretter <code>/mcp auth &lt;name&gt;</code>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Codex opnar innloggingssida av seg sjølv (viss ikkje, køyr <code>codex mcp login joomla</code>). Klikk på Tillat innan nokre minutt, i ein nettlesar på same datamaskin som Codex. Viss nettlesaren då seier at 127.0.0.1 nekta tilkopling, brukar du <code>codex mcp login joomla --no-browser</code> og limer adressa til den sida inn i terminalen, eller held fram med å bruke metoden med API-nøkkel nedanfor."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, lim inn endepunkt-URL-en, og klikk deretter på <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="Når du klikkar på Tillat, handlar appen som kontoen du logga inn med, og kan gjere nøyaktig det den kontoen kan på denne nettstaden, inkludert å gjere endringar viss kontoen har lov til det. Administrators og Managerar treng først retten <em>Innlogging for nettenester</em> (sjå Rettar på oversikta). Alle tilkopla appar er oppførte på oversikta, der dei kan koplast frå med ein gong."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="Føretrekkjer du ein API-nøkkel, eller kan ikkje klienten din opne ein nettlesar? Metoden med API-nøkkel under <strong>Avansert oppsett</strong> nedanfor verkar framleis for alle klientar."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT (&laquo;Add custom MCP server&raquo;) og claude.ai / Claude Desktop (&laquo;Add custom connector&raquo;) kan berre kople til ved å sende deg til innloggingssida på denne nettstaden. Det er slått av på denne nettstaden. Når det er på, går tilkoplinga slik: lim inn adressa til denne nettstaden i appen, logg inn, klikk på Tillat."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="Slå det på i Innstillingar"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Be ein Super User om å slå på <strong>OAuth-innlogging</strong> i innstillingane for MCP for J. Inntil då brukar du metoden med API-nøkkel nedanfor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="Enklast: dialogen &laquo;Add custom connector&raquo; i Claude verkar på denne nettstaden."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="Innlogging er slått på for denne nettstaden, så i Claude Desktop eller claude.ai går du til <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, limer inn MCP-adressa til denne nettstaden, klikkar på Continue, beheld innloggingsinnstillingane appen oppdagar, klikkar på Add og deretter Connect, loggar inn med brukarnamnet og passordet ditt for denne nettstaden og klikkar på Tillat. Metoden med konfigurasjonsfil nedanfor trengst berre viss du føretrekkjer ein API-nøkkel."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai koplar til permanent gjennom <strong>Add custom connector</strong>: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, lim inn MCP-adressa til denne nettstaden, klikk på Continue, behald innloggingsinnstillingane appen oppdagar, klikk på Add og deretter Connect. Logg inn med brukarnamnet og passordet ditt for denne nettstaden og klikk på Tillat. Tilkoplinga er tilgjengeleg i alle chattar."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="I ChatGPT klikkar du på <strong>Plugins</strong> i venstre sidepanel, deretter <strong>Add</strong> (øvst til høgre) &rarr; <strong>Add custom MCP server</strong>. Gje tenaren eit namn (til dømes &laquo;Joomla-nettstaden min&raquo;), lim inn MCP-adressa til denne nettstaden, la Authentication stå på <strong>OAuth</strong>, kryss av for &laquo;I understand and want to continue&raquo; og klikk på <strong>Create as a plugin</strong>. Klikk på <strong>Connect</strong>, så opnar ChatGPT innloggingssida på denne nettstaden: logg inn med brukarnamnet og passordet ditt for denne nettstaden og klikk på Tillat. Skriv deretter <strong>@</strong> i ein chat og vel programtillegget. Det er ingen API-nøkkel å lime inn."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="Dialogen &laquo;Add custom connector&raquo; koplar til, men innlogginga mislukkast"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Kontroller i denne rekkjefølgja: (1) kontoen du logga inn med, har lov til å bruke MCP &mdash; Administrators treng <em>Innlogging for nettenester</em>, og Managerar treng det pluss <em>Bruke MCP-endepunktet</em> under Innstillingar &rarr; Rettar (sjå kortet <em>Kven kan bruke dette endepunktet?</em> på oversikta); innloggingssida seier frå viss ikkje; (2) kortet &laquo;Kople til KI-appar ved å logge inn&raquo; på oversikta viser <strong>Klar</strong>; (3) brannmuren din lèt dei eigne tenarane til appen nå nettstaden (sjå neste oppføring). Ikkje oppgje klient-ID eller -løyndom: appen registrerer seg sjølv. (4) Klikk på Tillat kort tid etter at innloggingssida blir opna: appar gjev opp ei innlogging etter ei stund (Codex etter omtrent 5 minutt), og ein sein Tillat endar i ein feil. Start Connect på nytt, så verkar det."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai eller ChatGPT når ikkje nettstaden, eller innlogginga stoppar halvvegs"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai og ChatGPT koplar til frå sine eigne tenarar, ikkje frå nettlesaren din, så nettstaden må kunne nåast over offentleg HTTPS. Ein brannmur for nettapplikasjonar (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 eller ein brannmur hos vertsleverandøren, som o2switch TigerProtect, som svarer 503) kan blokkere desse førespurnadene. Tillat førespurnader til <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> og <code>index.php?csmcpforj_oauth=&hellip;</code> (endepunkta for registrering, token og tilbakekalling). I RSFirewall er desse to unntaka nok: <code>csmcpforj_oauth</code>, og <code>api\/index\.php\/v1\/mcp</code> som regulært uttrykk. claude.ai koplar til frå <code>160.79.104.0/21</code>. <strong>Cloudflare</strong>: Browser Integrity Check og Security Level kan blokkere tenarane til appane. Legg til ein eigendefinert WAF-regel (Security &rarr; WAF &rarr; Custom rules) med handlinga <strong>Skip</strong> for førespurnader der URI-stien inneheld <code>/api/index.php/v1/mcp</code> eller <code>/.well-known/oauth-</code>, eller der spørjestrengen inneheld <code>csmcpforj_oauth</code>, og kryss av for <em>Browser Integrity Check</em> og <em>Security Level</em>. Bot Fight Mode kan ikkje hoppast over med ein regel, så slå det av viss det blokkerer. <strong>Route 66</strong> og andre SEO-utvidingar som skriv om URL-ar, kan fange opp innloggingsadressene (<code>index.php?csmcpforj_oauth=&hellip;</code>) og svare med framsida, slik at appen ikkje kan registrere seg og ikkje oppgjev nokon tydeleg grunn. Viss <strong>Kontroller tilkoplinga</strong> viser framsida for innloggingsendepunkta, utelèt du URL-ar som inneheld <code>csmcpforj_oauth</code> i den utvidinga, eller slår av systemprogramtillegget til utvidinga. Sjølve innloggingssida blir opna i din eigen nettlesar."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="Oversikta seier at KI-appar ikkje finn innloggingssida på denne nettstaden (Ikkje klar)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="KI-klientar ser etter innloggingsdetaljane på <code>/.well-known/oauth-authorization-server</code> på domenet ditt. Joomla svarer der berre når Globale innstillingar &rarr; <strong>Bruk omskriving av nettadresse</strong> er på og <code>.htaccess</code>-fila til nettstaden er på plass (gje <code>htaccess.txt</code> nytt namn), eller når nginx sender ukjende stiar til <code>index.php</code>. Dette påverkar ikkje AutoSSL i cPanel, som brukar <code>/.well-known/acme-challenge/</code>. Ein nettstad som er installert i ei undermappe (til dømes <code>example.com/joomla</code>), treng også ein regel i domenerota som sender <code>/.well-known/oauth-authorization-server/joomla</code> til undermappa."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Innlogging frå ein tenar eller ei maskin utan nettlesar"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Skrivebordsklientar (Claude Code, Codex, Cursor, Gemini CLI) opnar ein nettlesar på same maskin og lyttar etter svaret på ei lokal adresse, så OAuth-innlogging treng ein nettlesar der. På ein tenar utan grafisk grensesnitt eller over SSH brukar du i staden metoden med API-nøkkel under Avansert oppsett; han verkar overalt."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="I KI-appen legg du til ei ny kopling (claude.ai og Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector; ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server) og limer inn denne <strong>endepunkt-URL-en</strong>: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Klikk på Connect.</strong> Appen opnar innloggingssida på denne nettstaden av seg sjølv. Logg inn med brukarnamnet og passordet ditt for denne nettstaden."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Klikk på Tillat.</strong> Du blir send tilbake til appen, tilkopla. Appen kan gjere alt kontoen din har lov til på denne nettstaden."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Kople ein KI-app til denne nettstaden"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Det er tre måtar. Klikk på ein for å opne dei nummererte stega. Dei fleste vil ha den første."
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. Logg inn (enklast) &mdash; ChatGPT, claude.ai, Claude Desktop og dei fleste andre KI-appar"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Lim inn ein oppsettsprompt &mdash; for ein KI-chat som kan køyre kommandoar"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. Konfigurasjonsfil eller kommandolinje &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI og andre"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Verkar i KI-appar som kan køyre kommandoar (Codex, Claude Code, Cursor, Cline, agentmodus i Copilot og liknande). KI-en testar tilkoplinga sjølv og kan tilby å gjere henne permanent."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="For appar du set opp med ei innstillingsfil eller ein kommando. Du gjer det éin gong, og så er appen tilkopla."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>Skaff API-tokenet ditt.</strong> Klikk på knappen: brukarprofilen din blir opna i ei ny fane. Opne fana <strong>Joomla API-token</strong>, klikk på augeikonet for å vise tokenet og kopier det. Kom deretter tilbake til denne fana."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="Skaff API-tokenet mitt (opnar ei ny fane)"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>Kopier prompten.</strong> Tokenet ditt er allereie i han."
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="<strong>Lim han inn i ein ny samtale</strong> med KI-appen din og send. KI-en testar tilkoplinga og tilbyr, viss det går, å gjere henne permanent."
COM_CSMCPFORJ_DASHBOARD_WAY3_STEP_COPY="<strong>Kopier konfigurasjonen.</strong> Tokenet ditt er allereie i han."
COM_CSMCPFORJ_DASHBOARD_WAY3_GUIDE_LINK="Stegvise instruksjonar for kvar app finst i oppsettsrettleiinga &rarr;"
COM_CSMCPFORJ_DASHBOARD_COPY_URL_BUTTON="Kopier"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1_COPY="<strong>Kopier endepunkt-URL-en.</strong>"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2_ADD="<strong>Legg til endepunkt-URL-en i KI-appen din som ei kopling.</strong> Kvar du gjer det, kjem an på appen:"
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN="Kople til ved å logge inn"
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN_ON="KI-appar kan kople til ved å logge inn."

