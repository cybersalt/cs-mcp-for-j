COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Kople ein KI til denne Joomla-nettstaden"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for J er laga for å gjere det enkelt å kople ein KI-assistent som Codex, Claude, ChatGPT eller Cursor til Joomla-nettstaden din &mdash; slik at KI-en kan lese artiklane dine, administrere brukarar, publisere innhald og meir, alt gjennom det vanlege chatgrensesnittet til KI-en. Du treng ikkje vere teknisk. Den enkle metoden nedanfor verkar for dei fleste; bla ned for avanserte alternativ viss du treng dei."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ Den enkle måten"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Ingen konfigurasjonsfiler. Ingen hovud. Ingen sjargong. Berre kopier ein ferdig oppsettsprompt frå oversikta og lim han inn i ein ny chat med KI-en din. KI-en gjer resten &mdash; testar tilkoplinga og tilbyr, i klientar som støttar det, å lagre tilkoplinga permanent for deg."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Skaff API-nøkkelen din</strong> (eit personleg passord som lèt KI-en din handle på denne nettstaden). Instruksjonar finst nedanfor viss du ikkje har ein enno."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Gå til oversikta</strong> (knappen nedanfor) og lim inn API-nøkkelen din i feltet der."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Klikk på knappen &laquo;Kopier prompt&raquo;</strong> på oversikta. Nøkkelen din blir automatisk sett inn i prompten før han blir kopiert."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Lim han inn i ein ny chat</strong> med KI-en din (Claude, ChatGPT, Cursor, Copilot, Gemini osb.) og send. KI-en stadfestar at tilkoplinga verkar og tilbyr å lagre henne."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Gå til oversikta"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="Det var det. KI-en din er tilkopla. Viss du vil vite meir om korleis delane heng saman, eller heller vil konfigurere KI-en manuelt, kan du lese vidare nedanfor &mdash; men du må ikkje."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Skaff API-nøkkelen din"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="Ein <strong>API-nøkkel</strong> er eit personleg passord som lèt KI-en din handle på denne Joomla-nettstaden som DEG. Alle som har nøkkelen, kan gjere alt Joomla-brukarkontoen din kan &mdash; så handsam han som privat. Slik genererer du ein:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sKlikk her for å opne Joomla-brukarprofilen din%s. Han blir opna i ei ny fane. Der ser du etter fana som heiter <strong>Joomla API-token</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="På den fana klikkar du på knappen <strong>Tilbakestill</strong>. Joomla genererer ei lang rekkje bokstavar og tal og set henne i feltet under knappen. Dette er nøkkelen din."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Klikk på det vesle <strong>augeikonet</strong> ved sida av feltet for å vise nøkkelen, og kopier deretter heile strengen."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Lim han inn i feltet nedanfor på denne sida (han blir lagra berre i nettlesaren din, slik at kopieringsknappane på denne sida kan fylle han inn automatisk), ELLER lim han rett inn i feltet for API-nøkkel på oversikta viss du er på veg dit for det enkle oppsettet."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Handsam denne nøkkelen som eit passord."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Ikkje lim han inn i delte dokument, skjermbilete eller kode du skal publisere. Viss han nokon gong lekk, går du tilbake til fana Joomla API-token og klikkar på Tilbakestill igjen &mdash; den gamle nøkkelen blir ugyldig med ein gong."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Lim inn API-nøkkelen din her (for kopiering med eitt klikk på denne sida)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Nøkkelen din blir hugsa berre i denne nettlesaren</strong> &mdash; han forlèt aldri datamaskina di. Bruk søppelbøtteknappen for å gløyme han. Viss du lèt dette stå tomt, verkar kopieringsknappane på denne sida framleis, men du må lime nøkkelen inn i det kopierte utdraget manuelt."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Vis/skjul nøkkelen"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Gløym den lagra nøkkelen"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Avansert: kople til ein KI manuelt (dei fleste treng ikkje dette)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Denne delen er for dei som vil konfigurere tilkoplinga mellom KI-klienten og denne nettstaden for hand &mdash; vanlegvis ved å redigere ei lita tekstfil som blir kalla ei &laquo;konfigurasjonsfil&raquo;. Viss det enkle oppsettet ovanfor verka for deg, kan du trygt hoppe over heile denne delen. Viss du vil gå utanom oppsettsprompten og registrere tilkoplinga direkte i KI-klienten, les du vidare."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="Tilkoplings-URL for denne nettstaden"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="Dette er adressa KI-klienten din treng. Du limer henne inn i oppsettet til klienten saman med API-nøkkelen din."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Vel KI-klienten din"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="Tilkoplings-URL-en + API-nøkkelen er den same for alle KI-ar &mdash; berre <em>kvar du limer dei inn</em> varierer frå klient til klient. Vel klienten din nedanfor for å få dei konkrete instruksjonane."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, IDE-utviding eller skrivebordsapp)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex støttar dette endepunktet direkte som ein MCP-tenar med Streamable HTTP. Lagre først Joomla API-nøkkelen i ein miljøvariabel for denne nettstaden, og registrer deretter endepunktet med namnet på miljøvariabelen. Nøkkelen blir aldri skriven til <code>config.toml</code>. Viss du brukar kopieringsknappen etter å ha limt inn ein nøkkel ovanfor, inneheld den kopierte miljøkommandoen denne nøkkelen, så hald han unna delte terminalar, opptak og støttesaker."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; lagre nøkkelen for framtidige Codex-prosessar"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Opne ein ny terminal etter å ha sett ein permanent miljøvariabel i Windows. Eksisterande Codex- og terminalprosessar kan ikkje sjå han."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; set nøkkelen for denne terminalen (gjer han permanent i det sikre skalmiljøet ditt ved behov)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Registrer denne Joomla-nettstaden i Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Køyr <code>codex mcp list</code>, start Codex på nytt (eller sjekk MCP-statusen i grensesnittet) og kall deretter det harmlause skriveverna verktøyet <code>get_joomla_version</code>. Dette stadfestar initialisering, autentisering, oppdaging av verktøy og kall. For ei skriveverna tilkopling slår du også på den skriveverna modusen på tenarsida i MCP for J; godkjenningsinnstillingar i klienten kan ikkje overstyre rettane på tenaren."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Ugyldig token på cPanel eller PHP-FPM?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Nettenaren kan fjerne det vanlege Authorization-hovudet. Byt ut oppføringa du oppretta ovanfor i <code>~/.codex/config.toml</code> med denne blokka, slik at Codex les den same miljøvariabelen og sender han som <code>X-Joomla-Token</code>, og start deretter Codex på nytt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Merk &mdash; dialogen &laquo;Add custom connector&raquo; i Claude treng OAuth, som er slått av på denne nettstaden."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Den innebygde dialogen &laquo;Add custom connector&raquo; i Claude Desktop og claude.ai koplar til ved innlogging (OAuth) og har ikkje noko felt for API-nøkkel. Ein Super User kan slå på OAuth-innlogging i innstillingane for MCP for J; då verkar dialogen. Inntil då brukar instruksjonane for Claude Desktop nedanfor redigering av konfigurasjonsfila i staden. (Eller bruk det enkle oppsettet ovanfor &mdash; det verkar også med Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Fire steg: lag ei lita hjelpefil som blir kalla eit &laquo;wrapper-skript&raquo; og som inneheld tilkoplingskommandoen, peik konfigurasjonsfila til Claude Desktop på henne, og start Claude Desktop på nytt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Kvifor eit wrapper-skript i staden for å setje tilkoplinga rett i konfigurasjonen til Claude Desktop? Claude Desktop 1.30096+ (august 2026) avviser konfigurasjonsoppføringar der kommandoargumenta ser ut til å innehalde legitimasjon &mdash; ein velmeint tryggleiksfunksjon som dessverre blokkerer den direkte metoden. Å flytte kommandoen til ei lita hjelpefil omgår dette (Claude Desktop ser berre ein vanleg kommando utan synlege argument), og API-nøkkelen din er like trygg som før &mdash; hjelpefila ligg i di eiga brukarmappe saman med konfigurasjonen til Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Eingongsføresetnad &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Desse instruksjonane føreset at du har Node.js installert på datamaskina (som følgjer med ein kommando som heiter <code>npx</code>). Dei fleste utviklaroppsett har det allereie; viss ikkje, installerer du det frå <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> med LTS-installasjonsprogrammet. Wrapper-fila nedanfor forventar Node.js på standard installasjonssti i Windows, <code>C:\Program Files\nodejs\</code>. Viss du installerte det ein annan stad, redigerer du stien i wrapper-fila etter kopiering."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Steg 1 &mdash; lag wrapper-skriptet"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Førebels berre for Windows (Mac-/Linux-brukarar, sjå FAQ). Kopier blokka nedanfor til ei ny rein tekstfil. Lagre henne i brukarmappa di (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) med filnamnet <code>claude-mcp-joomla-{sitename}.cmd</code>, der du byter ut <code>{sitename}</code> med ei kort nemning på nettstaden din (t.d. <code>cybersaltorg</code>). Pass på at <code>.cmd</code> faktisk er filtypen, ikkje ein del av filnamnet &mdash; i Notisblokk vel du &laquo;Filtype: Alle filer&raquo;, så han ikkje legg til <code>.txt</code>. Viss du limte inn API-nøkkelen din i feltet øvst på denne sida, set kopieringsknappen han inn for deg."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Usikker på kva Windows-brukarnamnet ditt er? Opne Filutforskar, gå til <code>C:\Users\</code> og sjå på mappenamna &mdash; ei av dei er di."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Steg 2 &mdash; opne konfigurasjonsfila til Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Innstillingsfila til Claude Desktop ligg på ein fast sti i kvart operativsystem. Opne henne i kva tekstredigeringsprogram som helst (VS Code, Notisblokk, TextEdit, Sublime, det du har):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop har ein knapp under Settings &rarr; Developer &rarr; <strong>Edit Config</strong> som skal opne fila for deg. Viss du klikkar på han og ingenting skjer, er det fordi datamaskina ikkje veit kva program ho skal opne <code>.json</code>-filer med. Ikkje noko problem &mdash; opne berre fila sjølv i eit tekstredigeringsprogram med ein av stiane ovanfor. Viss fila ikkje finst enno, opprettar du henne og brukar blokka nedanfor som heile innhaldet (pakka inn som <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Steg 3 &mdash; legg til denne blokka i konfigurasjonen til Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Lim dette inn i <code>claude_desktop_config.json</code>. Viss fila allereie har eit <code>mcpServers</code>-objekt med andre tenarar, legg du til <code>joomla-...</code>-oppføringa ved sida av dei (ikkje lim inn eit nytt <code>mcpServers</code>-objekt). Viss fila er tom eller manglar, brukar du heile blokka nedanfor som innhald. <strong>Viktig:</strong> byt ut <code>YOUR_WINDOWS_USERNAME</code> med det faktiske Windows-brukarnamnet ditt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Denne konfigurasjonen peikar berre Claude Desktop til wrapper-skriptet du laga i steg 1. API-nøkkelen din blir verande i wrapper-fila, ikkje i konfigurasjonen til Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Steg 4 &mdash; avslutt Claude Desktop heilt og opne appen igjen"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop les konfigurasjonsfila berre når appen startar. Lukk appen heilt &mdash; i Windows høgreklikkar du på Claude-ikonet i systemstatusfeltet (nede til høgre, du må kanskje klikke på den vesle pila opp) og vel Quit. Vent nokre sekund og start appen på nytt. I kva samtale som helst klikkar du på verktøyikonet (eller spør &laquo;what tools do you have?&raquo;) &mdash; verktøya til nettstaden skal vere oppførte. Viss dei ikkje er det, sjå Feilsøking nedanfor."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (terminal eller VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Viss du brukar Claude Code, set éin terminalkommando opp tilkoplinga &mdash; utan redigering av konfigurasjonsfiler. Lim inn API-nøkkelen din i feltet ovanfor, så fyller kopieringsknappen nedanfor han inn, lim deretter kommandoen inn i ein terminal og trykk på Enter. Claude Code stadfestar tilkoplinga med ein gong og lastar inn på nytt."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (nettversjonen)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="Dialogen <strong>Add custom connector</strong> i claude.ai koplar til ved innlogging (OAuth), som er slått av på denne nettstaden. Ein Super User kan slå det på i innstillingane for MCP for J, og då får claude.ai ei permanent tilkopling. Inntil då verkar det enkle oppsettet ovanfor (lim inn ein prompt) berre for den gjeldande chatten."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor lagrar MCP-tilkoplingane sine i ei konfigurasjonsfil som heiter <code>mcp.json</code>. Opne henne i eit tekstredigeringsprogram, lim inn blokka nedanfor i <code>mcpServers</code>-objektet og lagre. Cursor oppdagar endringa utan omstart i dei fleste tilfelle."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Plassering av konfigurasjonsfila: <code>~/.cursor/mcp.json</code> (for alle prosjekta dine) eller <code>.cursor/mcp.json</code> i ei bestemt prosjektmappe (berre for det prosjektet)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Eigendefinerte MCP-tenarar i ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="Dialogen <strong>Add custom MCP server</strong> i ChatGPT kan berre kople til ved innlogging (OAuth) eller utan autentisering; han har ikkje noko felt for API-nøkkel eller hovud. OAuth-innlogging er slått av på denne nettstaden, så ChatGPT kan ikkje kople til enno. Ein Super User kan slå det på i innstillingane for MCP for J. Inntil då brukar du Codex (kodeagenten frå OpenAI), som sender API-nøkkelen frå ein miljøvariabel."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Å leggje til ein eigendefinert MCP-tenar krev eit betalt ChatGPT-abonnement. Det verkar med Plus (kontrollert oktober 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI og Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Både Gemini CLI (KI-assistenten frå Google for terminalen) og utvidinga Gemini Code Assist (for VS Code / JetBrains) les den same MCP-konfigurasjonsfila. To steg: rediger fila for å leggje til denne Joomla-nettstaden som ein MCP-tenar, og start deretter Gemini på nytt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Du kan leggje til tenaren globalt (slik at alle Gemini-økter ser han) eller berre i éi prosjektmappe. Utdraget er det same &mdash; berre plasseringa av fila er ulik."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Opne (eller opprett) innstillingsfila for Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Vel ei av desse to plasseringane:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Globalt (alle prosjekt):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Berre prosjektet:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (i ei prosjektmappe)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Lim inn denne blokka i fila."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Viss fila allereie har ein <code>mcpServers</code>-seksjon, legg du til <code>&quot;joomla-...&quot;</code>-oppføringa i den eksisterande &mdash; ikkje dupliser den ytre <code>mcpServers</code>-nøkkelen. Viss fila er tom eller heilt ny, limer du inn heile utdraget som det er."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini brukar <code>httpUrl</code> for HTTP-baserte MCP-tenarar (som denne) &mdash; det er ulikt <code>url</code>-nøkkelen i Cursor. Kopier dette utdraget nøyaktig i staden for å bruke det for Cursor om att."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Start Gemini på nytt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Avslutt og start <code>gemini</code> på nytt i terminalen, eller last VS Code- / JetBrains-vindauget på nytt. Skriv <code>/mcp</code> i Gemini CLI for å sjå dei tilkopla tenarane og stadfeste at Joomla-nettstaden din er oppført."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="Nettappen <code>gemini.google.com</code> støttar ikkje eigendefinerte MCP-tenarar per august 2026 &mdash; denne rettleiinga dekkjer berre Gemini CLI og Gemini Code Assist. Viss Google legg til støtte i nettgrensesnittet seinare, dokumenterer vi det her."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Andre KI-klientar med MCP-støtte (Cline, Continue, GitHub Copilot i agentmodus, Windsurf, mcp-cli osb.) verkar også &mdash; tilkoplings-URL-en og API-nøkkelen er dei same, berre den nøyaktige staden du limer dei inn, er ulik. Vi legg til konkrete rettleiingar for fleire klientar etter kvart; står du fast, har FAQ nedanfor generell rettleiing."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Kopier"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Kopiert"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Kopiert (med nøkkelen din)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Tryggleik og deling"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="API-nøkkelen din ER innlogginga &mdash; den som har han, kan gjere alt Joomla-brukarkontoen din kan. Det finst ingen anonym tilgang. Viss du slår på <strong>OAuth-innlogging</strong>, kan ein KI-app også kople til ved å sende deg til den vanlege innloggingssida på denne nettstaden; appen handlar då som kontoen som logga inn, med nøyaktig rettane til den kontoen, til du koplar appen frå på oversikta."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Gje MCP-tilgang til andre"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Det er to måtar å gjere det på &mdash; vel det som passar:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Éin nøkkel per person (tryggast)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Opprett ein Joomla-brukar for kvar person, plasser vedkomande i ei gruppe med berre dei rettane du vil gje (t.d. skriveverna), generer ein nøkkel for brukaren og send han privat. Kvar person har sitt eige revisjonsspor; du kan trekkje tilbake éin enkelt nøkkel utan å påverke dei andre."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Éin delt nøkkel (enklast, men minst trygg)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Opprett éin avgrensa brukar (t.d. <code>mcp-demo-guest</code>) i ei skriveverna gruppe, generer éin nøkkel og del han breiare. Enklare å distribuere; vanskelegare å vite kven som brukar han eller å trekkje tilbake tilgangen for berre éin person. Greitt for ein offentleg demo; ikkje for sensitiv tilgang."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Trekkje tilbake ein nøkkel"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="For å få ein eksisterande nøkkel til å slutte å verke med ein gong går du til Brukarar &rarr; den aktuelle brukaren &rarr; fana Joomla API-token &rarr; klikk på <strong>Tilbakestill</strong>. Den gamle nøkkelen blir ugyldig i det du klikkar. Gje den nye nøkkelen til vedkomande, eller la vedkomande stå utan tilgang."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Feilsøking"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Finn typen app du koplar til, og opne deretter problemet som passar med det du ser. Feilmeldingar og blokkeringar i brannmurar kan dukke opp i alle appar, så dei har si eiga gruppe til slutt."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&laquo;Unauthorized&raquo; eller &laquo;Authentication failed&raquo; (feil 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="KI-en din når nettstaden, men API-nøkkelen er ikkje rett. Kontroller: (1) nøkkelen er ikkje tilbakestilt sidan du kopierte han (kvar tilbakestilling gjer den førre nøkkelen ugyldig); (2) nøkkelen vart kopiert heil, utan manglande teikn eller ekstra mellomrom; (3) viss du redigerte ei konfigurasjonsfil, står ordet <code>Bearer </code> (med mellomrom etter) framfor nøkkelen. Viss du er usikker, genererer du ein ny nøkkel og prøver igjen."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&laquo;Not Acceptable&raquo; eller &laquo;Could not match accept header&raquo; (feil 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Eldre versjonar av MCP for J (før 2.3.4) hadde ein feil som hindra nokre KI-klientar i å kople til. Oppdater MCP for J til siste versjon &mdash; sjekk System &rarr; Oppdater &rarr; Utvidingar i Joomla-administrasjonen."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&laquo;Tilkopla, men ingen verktøy blir viste i KI-en&raquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Vanlegvis er det éin av tre ting: (1) gruppa til brukaren har ikkje <strong>Innlogging for nettenester</strong> &mdash; set det i System &rarr; Globale innstillingar &rarr; Rettar (berre Super Users har det som standard); (2) gruppa har ingen MCP-rett &mdash; Super Users har det alltid og Administrators gjennom standardinnstillingane i Joomla, men Managerar og andre grupper treng Bruke MCP-endepunktet (og Skrive gjennom MCP-endepunktet for endringar) under Innstillingar &rarr; Rettar for denne komponenten; (3) KI-klienten har bufra ei tom verktøyliste &mdash; kople MCP-tenaren frå og til igjen i klienten for å tvinge fram ein ny kontroll."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&laquo;Not Found&raquo;, eller URL-en gjev ein feil (feil 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Anten er URL-en feil (kontroller han &mdash; han skal slutte med <code>/api/index.php/v1/mcp</code>), ELLER programtillegget for nettenester for MCP er deaktivert på Joomla-nettstaden din. I Joomla-administrasjonen: System &rarr; Administrer &rarr; Utvidingar &rarr; søk etter <code>csmcpforj</code> &rarr; kontroller at programtillegget Web Services er aktivert. Viss det allereie er aktivert, kan <code>.htaccess</code>-fila på nettstaden blokkere stien <code>/api/</code> &mdash; eit problem hos vertsleverandøren eller med eit tryggleikstillegg."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&laquo;Forbidden&raquo; eller &laquo;Malware detected&raquo; (feil 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Eit tryggleikstillegg på Joomla-nettstaden din (RSFirewall, Admin Tools Pro, Securitycheck Pro) blokkerer MCP-førespurnaden. I RSFirewall legg du til to unntak: <code>csmcpforj_oauth</code>, og <code>api\/index\.php\/v1\/mcp</code> som regulært uttrykk (det første er for innlogging). I dei andre tillèt du <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> og URL-ar som inneheld <code>csmcpforj_oauth</code>. For å stadfeste årsaka slår du av tryggleikstillegget ei lita stund, prøver igjen og slår det på igjen med unntaka på plass. Knappen <strong>Kontroller tilkoplinga</strong> på oversikta viser kva adresse som er blokkert."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Knappen &laquo;Edit Config&raquo; i Claude Desktop gjer ingenting når eg klikkar på han"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Den knappen prøver å gje <code>claude_desktop_config.json</code> til programmet datamaskina di opnar <code>.json</code>-filer med. Viss du ikkje har sett opp det, gjer knappen stille ingenting. Løysing: opne fila sjølv i kva tekstredigeringsprogram som helst. Stiar per operativsystem står i Claude-delen under Avansert ovanfor. Viss fila ikkje finst enno, opprettar du henne og brukar utdraget frå den delen som heile innhaldet (pakk utdraget inn som <code>{&quot;mcpServers&quot;: { ... }}</code>). Inga endring av løyve er naudsynt &mdash; fila ligg i di eiga brukarmappe."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="Dialogen &laquo;Add custom connector&raquo; i Claude eller &laquo;Add custom MCP server&raquo; i ChatGPT har ikkje noko felt for API-nøkkelen"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Desse dialogane er laga for å kople til ved innlogging (OAuth); det finst ingen stad å lime inn ein API-nøkkel for MCP for J. Denne nettstaden har OAuth-innlogging slått av. Ein Super User kan slå det på under Komponentar &rarr; MCP for J &rarr; Innstillingar &rarr; <strong>OAuth-innlogging</strong>, og då verkar begge dialogane. Inntil då: Claude Desktop kan bruke metoden med wrapper-skript ovanfor, claude.ai det enkle oppsettet, og ChatGPT-brukarar Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop viser &laquo;Some MCP servers could not be loaded&raquo; ved oppstart"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (august 2026) stramma inn valideringa av konfigurasjonsfila og avviser no oppføringar der kommandoargumenta ser ut til å kunne innehalde legitimasjon. Dette blokkerer dei to opplagde måtane å konfigurere ein MCP-tenar med Bearer-token direkte i <code>claude_desktop_config.json</code>: den innebygde forma <code>type: http</code> OG å sende <code>mcp-remote</code> med argumentet <code>--header &quot;Authorization: Bearer ...&quot;</code>. Begge ser rette ut i konfigurasjonsfila, men skjemavalidatoren i Claude Desktop forkastar dei ved innlasting. <strong>Løysing:</strong> bruk metoden med wrapper-skript som er skildra i Claude-delen under Avansert ovanfor &mdash; legg heile kommandoen i ei lita <code>.cmd</code>-fil, og la konfigurasjonen til Claude Desktop berre vise til fila. Claude Desktop ser ein vanleg kommando utan synlege argument og godtek han. API-nøkkelen din er like trygg som før &mdash; wrapper-fila ligg i di eiga brukarmappe."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Eg starta Claude Desktop på nytt, men appen ser framleis ikkje den nye tilkoplinga"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="I Windows skjuler lukking av Claude Desktop-vindauget berre appen i systemstatusfeltet &mdash; heile appen held fram med å køyre med den GAMLE konfigurasjonen i minnet. Å klikke på ikonet på oppgåvelinja seinare hentar berre vindauget tilbake frå den allereie køyrande prosessen. Claude Desktop les konfigurasjonsfila på nytt berre ved ein ekte omstart av appen. Slik startar du appen verkeleg på nytt: høgreklikk på Claude-ikonet i systemstatusfeltet (nede til høgre, du må kanskje klikke på den vesle pila opp for å sjå skjulte ikon) &rarr; vel <strong>Quit</strong> &rarr; vent ca. 3 sekund til prosessen er heilt avslutta &rarr; start Claude Desktop igjen frå Start-menyen. Først då får endringane i konfigurasjonsfila verknad."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Vanlege spørsmål"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Kan nokon bruke denne tilkoplinga utan ein API-nøkkel?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="Nei. Alle førespurnader må ha ein gyldig API-nøkkel, eller eit OAuth-tilgangstoken viss OAuth-innlogging er slått på. Førespurnader utan blir avviste. Dette er med vilje &mdash; KI-en kan utføre reelle handlingar på nettstaden din (opprette artiklar, redigere brukarar osb.), så anonym tilgang ville vore ein tryggleikskatastrofe."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Kan éin Joomla-brukar ha fleire aktive API-nøklar?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="Nei. Joomla lagrar nøyaktig éin API-nøkkel per brukar. Å klikke på Tilbakestill genererer ein ny og gjer den gamle ugyldig. Viss du treng fleire nøklar (éin per eining, éin per KI-verktøy osb.), opprettar du separate Joomla-brukarar."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Er det ei grense for kor mykje eg kan bruke det?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="MCP for J har inga fartsgrense i seg sjølv. Vanlege grenser hos vertsleverandøren gjeld (PHP-minne, MariaDB-tilkoplingar osb.). Viss du genererer tung trafikk (store satsvise operasjonar på mange nettstader), kan du snakke med vertsleverandøren om å auke samtidigheita i PHP-FPM."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Må eg opne portar i brannmuren eller konfigurere noko spesielt?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="Nei. MCP brukar berre vanleg HTTPS på port 443. Viss nettstaden din allereie er offentleg tilgjengeleg på <code>https://yoursite.com/</code>, kan MCP-endepunktet nåast frå alle KI-klientar på internett utan ekstra oppsett."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="Korleis byter (roterer) eg API-nøkkelen min regelmessig?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Det finst ingen automatisk planleggjar &mdash; du roterer manuelt når du vil. Gå til Brukarar &rarr; brukaren &rarr; fana Joomla API-token &rarr; klikk på Tilbakestill. Oppdater deretter konfigurasjonen til KI-klienten med den nye nøkkelen. God vane: roter alle nøklar som nokon gong har vore synlege i eit skjermbilete, ein logg eller ein feilrapport."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Eg brukar ein KI-klient som ikkje står ovanfor &mdash; vil han verke?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Nesten heilt sikkert, så lenge han støttar standard MCP over HTTPS og anten lèt deg leggje til eit eige Authorization-hovud eller kan logge inn med OAuth (slå på OAuth-innlogging i Innstillingar). URL-en er den same overalt &mdash; berre oppsettsgrensesnittet i klienten er ulikt. Klientar vi veit verkar, men som vi ikkje har skrive stegvise rettleiingar for: Continue.dev, Windsurf, Zed-editoren, mcp-cli, MCP Inspector, LibreChat, Open WebUI (via <code>mcpo</code>-brua) og ymse Ollama-baserte agentar."

