; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Vem kan använda denna anslutningspunkt?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="Behörigheter kontrolleras mot det Joomla-konto som äger API-token. MCP-klienten (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl eller någon annan) förmedlar bara anropen &mdash; samma token fungerar likadant från alla klienter."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Viktigt:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Den som skapar en token får samma åtkomst via MCP-anslutningspunkten som i Joomlas administration. Skapa bara token för användare som du litar på kan utföra åtgärderna direkt."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Användargrupp i Joomla"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Fungerar direkt?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Orsak"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Ja"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Kräver uttrycklig behörighet"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Superanvändare godkänns alltid i alla behörighetskontroller i Joomla."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Har core.manage genom Joomlas standardbehörigheter, vilket MCP-kontrollen godtar för läs- och skrivverktyg (verktyg som ändrar behörigheter, tillägg, plugininställningar eller själva Joomla kräver fortfarande en superanvändare) &mdash; men gruppen behöver också <strong>Webbtjänstinloggning</strong> för att Joomla ska tillåta autentisering."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="Har ingen MCP-behörighet som standard. Ge gruppen <strong>Webbtjänstinloggning</strong> under System &rarr; Globala inställningar &rarr; Behörigheter och därefter Använd MCP-anslutningspunkt samt vid behov Skriv via MCP-anslutningspunkt under komponentens <strong>Inställningar &rarr; Behörigheter</strong>."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Kräver webbtjänstinloggning"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Innan något av detta gäller:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla skyddar hela API:et med den separata behörigheten <strong>Webbtjänstinloggning</strong> (<code>core.login.api</code>), och <strong>endast superanvändare har den som standard</strong>. Alla andra grupper &mdash; även Administrator och Manager &mdash; får <code>403 Forbidden</code> från alla verktyg tills du ger dem denna behörighet, oavsett vad de får göra i administrationen. Ställ in den för gruppen under <strong>System &rarr; Globala inställningar &rarr; Behörigheter</strong>, inte för denna komponent."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Författare / Registrerad / egen grupp"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Ge gruppen <strong>Webbtjänstinloggning</strong> under System &rarr; Globala inställningar &rarr; Behörigheter och därefter Använd MCP-anslutningspunkt samt vid behov Skriv via MCP-anslutningspunkt under komponentens <strong>Inställningar &rarr; Behörigheter</strong>."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Anslut en AI-assistent till denna webbplats"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Det finns två sätt. Det första, att kopiera och klistra in en instruktion, är enklast &mdash; det kräver ingen klientkonfiguration. När AI:n har bekräftat anslutningen erbjuder den vanligtvis att spara webbplatsen som en permanent anslutning utan manuell JSON-redigering. Det andra sättet passar dig som vill redigera klientens konfiguration direkt."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Kopiera en anslutningsinstruktion (rekommenderas)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Klistra in en anslutningsinstruktion i din AI-assistent"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Ingen klientkonfiguration behövs. Kopiera instruktionen nedan till en ny konversation med din AI-assistent (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini med flera). AI:n testar med curl, bekräftar anslutningen och erbjuder &mdash; i klienter som stöder det &mdash; att göra anslutningen permanent utan att du behöver redigera JSON-filer eller komma ihåg terminalkommandon."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Dessutom:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Om din AI-klient har ett skalverktyg (Codex, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot i agentläge med flera) innehåller instruktionen ett erbjudande om automatisk registrering. Säg bara &lsquo;gör den permanent&rsquo; när AI:n har bekräftat anslutningen, så kör den rätt kommando för klienten för att registrera MCP-servern (till exempel <code>codex mcp add</code> eller <code>claude mcp add</code>). När klienten har startats om visas webbplatsen som inbyggda MCP-verktyg i varje konversation &mdash; ingen instruktion behövs igen."
; Shared "type here" field pattern - see FieldStyleHelper.
COM_CSMCPFORJ_FIELD_OPTIONAL="Valfritt"
COM_CSMCPFORJ_FIELD_REQUIRED="Obligatoriskt"

COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Skapa en Joomla API-token i Min profil (länken till höger)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Klicka på &lsquo;Kopiera instruktion&rsquo; nedan."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Klistra in den i en ny konversation med din AI-assistent. Om du hoppade över steg 2 ersätter du först <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> med din egen token."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Skicka. AI:n testar anslutningen och erbjuder, i klienter som stöder det, att göra den permanent."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Instruktionen fungerar i AI-klienter med ett skal- eller terminalverktyg: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (agentläge), Gemini CLI, Windsurf, mcp-cli med flera. Den fungerar inte i chattgränssnitt enbart på webben (claude.ai, chatgpt.com, gemini.google.com) som saknar skalåtkomst &mdash; använd fliken MCP-anslutning för dem."

