COM_CSMCPFORJ_ACTIONLOG_OAUTH_REVOKE="Användaren <a href=&quot;{accountlink}&quot;>{username}</a> har kopplat från appen &ldquo;{title}&rdquo; från MCP for J (OAuth)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="Anslut genom att logga in (enklast)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Ingen API-nyckel behöver kopieras. Lägg till en anslutning i din AI-app och klistra in webbplatsens <strong>anslutningsadress</strong> (nedan). När du klickar på Connect öppnar appen webbplatsens inloggningssida automatiskt: logga in med ditt användarnamn och lösenord för webbplatsen och klicka sedan på <strong>Tillåt</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai och Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Ange ett namn, klistra in anslutningsadressen och klicka på Continue. Behåll <em>Sign in now</em>. För OAuth-klienten fungerar både <em>Use Claude's published identity</em> och <em>Register automatically</em>. Lägg inte till begärandehuvuden. Klicka på Add och sedan på <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> <strong>Plugins</strong> i vänster sidofält &rarr; <strong>Add</strong> (uppe till höger) &rarr; <strong>Add custom MCP server</strong>. Ange ett namn, klistra in anslutningsadressen, låt Authentication stå på <strong>OAuth</strong>, markera rutan, klicka på <strong>Create as a plugin</strong> och sedan på <strong>Connect</strong>. Kräver ett betalt ChatGPT-abonnemang (Plus fungerar)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>. Skriv sedan <code>/mcp</code>, välj servern och välj <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> Kommandopaletten &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; klistra in anslutningsadressen. VS Code ber dig logga in."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> Lägg till <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> under <code>mcpServers</code> i <code>mcp.json</code> (utan huvuden) och klicka sedan på <strong>Login</strong> bredvid servern under Settings &rarr; MCP."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> Lägg till <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> för servern i <code>settings.json</code> och kör sedan <code>/mcp auth &lt;name&gt;</code>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Codex öppnar inloggningssidan automatiskt (om det inte sker kör du <code>codex mcp login joomla</code>). Klicka på Tillåt inom några minuter i en webbläsare på samma dator som Codex. Om webbläsaren sedan visar att 127.0.0.1 nekade anslutningen använder du <code>codex mcp login joomla --no-browser</code> och klistrar in sidans adress i terminalen, eller fortsätter använda metoden med API-nyckel nedan."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP. Klistra in anslutningsadressen och klicka sedan på <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="När du klickar på Tillåt agerar appen som kontot du loggade in med och kan göra exakt det kontot får göra på webbplatsen, inklusive ändringar om kontot har behörighet till det. Administratörer och managers behöver först behörigheten <em>Webbtjänstinloggning</em> (se Behörigheter på kontrollpanelen). Alla anslutna appar visas på kontrollpanelen, där de kan kopplas från omedelbart."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="Föredrar du en API-nyckel, eller kan din klient inte öppna en webbläsare? Metoden med API-nyckel under <strong>Avancerad anslutning</strong> nedan fungerar fortfarande för alla klienter."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT (&ldquo;Add custom MCP server&rdquo;) och claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) kan bara ansluta genom att öppna webbplatsens inloggningssida. Funktionen är avstängd på denna webbplats. När den är aktiverad ansluter du genom att klistra in webbplatsens adress i appen, logga in och klicka på Tillåt."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="Aktivera funktionen i Inställningar"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Be en superanvändare aktivera <strong>OAuth-inloggning</strong> i inställningarna för MCP for J. Använd metoden med API-nyckel nedan tills dess."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="Enklast: Dialogrutan &ldquo;Add custom connector&rdquo; i Claude fungerar på denna webbplats."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="Inloggning är aktiverad på webbplatsen. Gå till <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong> i Claude Desktop eller claude.ai, klistra in webbplatsens MCP-adress, klicka på Continue, behåll de identifierade inloggningsinställningarna, klicka på Add och sedan på Connect. Logga in med ditt användarnamn och lösenord för webbplatsen och klicka på Tillåt. Metoden med konfigurationsfil nedan behövs bara om du föredrar en API-nyckel."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai ansluter permanent via <strong>Add custom connector</strong>: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Klistra in webbplatsens MCP-adress, klicka på Continue, behåll de identifierade inloggningsinställningarna, klicka på Add och sedan på Connect. Logga in med ditt användarnamn och lösenord för webbplatsen och klicka på Tillåt. Anslutningen finns sedan tillgänglig i alla chattar."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="Klicka på <strong>Plugins</strong> i ChatGPT:s vänstra sidofält och sedan på <strong>Add</strong> (uppe till höger) &rarr; <strong>Add custom MCP server</strong>. Ange ett namn (till exempel &ldquo;Min Joomla-webbplats&rdquo;), klistra in webbplatsens MCP-adress, låt Authentication stå på <strong>OAuth</strong>, markera &ldquo;I understand and want to continue&rdquo; och klicka på <strong>Create as a plugin</strong>. Klicka på <strong>Connect</strong> så öppnar ChatGPT webbplatsens inloggningssida. Logga in med ditt användarnamn och lösenord för webbplatsen och klicka på Tillåt. Skriv sedan <strong>@</strong> i en chatt och välj pluginen. Ingen API-nyckel behöver klistras in."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="Dialogrutan &ldquo;Add custom connector&rdquo; ansluter men inloggningen misslyckas"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Kontrollera i denna ordning: (1) Att kontot du loggade in med får använda MCP &mdash; administratörer behöver <em>Webbtjänstinloggning</em> och managers behöver dessutom <em>Använd MCP-anslutningspunkten</em> under Inställningar &rarr; Behörigheter (se kortet <em>Vem får använda anslutningspunkten?</em> på kontrollpanelen). Inloggningssidan visar om behörigheten saknas. (2) Att kortet &ldquo;Anslut AI-appar genom att logga in&rdquo; på kontrollpanelen visar <strong>Klar</strong>. (3) Att brandväggen låter appens egna servrar nå webbplatsen (se nästa avsnitt). Ange inget klient-ID eller någon klienthemlighet: appen registrerar sig själv. (4) Klicka på Tillåt strax efter att inloggningssidan öppnas. Appar avbryter inloggningsförsök efter en stund (Codex efter cirka 5 minuter), och ett sent godkännande ger ett fel. Starta anslutningen igen."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai eller ChatGPT kan inte nå webbplatsen, eller inloggningen avbryts halvvägs"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai och ChatGPT ansluter från sina egna servrar, så webbplatsen måste vara tillgänglig offentligt via HTTPS. En brandvägg för webbapplikationer (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 eller webbhotellets brandvägg, till exempel o2switch TigerProtect som svarar med 503) kan blockera begärandena. Tillåt begäranden till <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> och <code>index.php?csmcpforj_oauth=&hellip;</code> (anslutningspunkterna register, token och revoke). I RSFirewall räcker två undantag: <code>csmcpforj_oauth</code> och <code>api\/index\.php\/v1\/mcp</code> som reguljärt uttryck. claude.ai ansluter från <code>160.79.104.0/21</code>. <strong>Cloudflare</strong>: Browser Integrity Check och Security Level kan blockera apparnas servrar. Lägg till en anpassad WAF-regel (Security &rarr; WAF &rarr; Custom rules) med åtgärden <strong>Skip</strong> för begäranden vars URI-sökväg innehåller <code>/api/index.php/v1/mcp</code> eller <code>/.well-known/oauth-</code>, eller vars frågesträng innehåller <code>csmcpforj_oauth</code>, och markera <em>Browser Integrity Check</em> och <em>Security Level</em>. Bot Fight Mode kan inte undantas genom en regel, så stäng av funktionen om den blockerar. <strong>Route 66</strong> och andra SEO-tillägg som skriver om URL:er kan fånga inloggningsadresserna (<code>index.php?csmcpforj_oauth=&hellip;</code>) och svara med startsidan, vilket gör att appen inte kan registrera sig och inte visar någon tydlig orsak. Om <strong>Kontrollera anslutning</strong> visar startsidan för inloggningens anslutningspunkter undantar du URL:er som innehåller <code>csmcpforj_oauth</code> i tillägget eller stänger av dess systemplugin. Själva inloggningssidan öppnas i din egen webbläsare."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="Kontrollpanelen visar att AI-appar inte kan hitta webbplatsens inloggningssida (Inte klar)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="AI-klienter söker efter inloggningsinformation på <code>/.well-known/oauth-authorization-server</code> på din domän. Joomla svarar där endast när <strong>Använd URL-omskrivning</strong> är aktiverat i Globala inställningar och webbplatsens <code>.htaccess</code> finns på plats (byt namn på <code>htaccess.txt</code>), eller när nginx skickar okända sökvägar till <code>index.php</code>. Detta påverkar inte AutoSSL i cPanel, som använder <code>/.well-known/acme-challenge/</code>. En webbplats som är installerad i en undermapp (till exempel <code>example.com/joomla</code>) behöver också en regel i domänroten som skickar <code>/.well-known/oauth-authorization-server/joomla</code> till undermappen."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Logga in från en server eller en dator utan webbläsare"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Skrivbordsklienter (Claude Code, Codex, Cursor och Gemini CLI) öppnar en webbläsare på samma dator och lyssnar efter svaret på en lokal adress. OAuth-inloggning kräver därför en webbläsare där. På en server utan grafiskt gränssnitt eller via SSH använder du i stället metoden med API-nyckel under Avancerad anslutning. Den fungerar överallt."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="Lägg till en ny anslutning i AI-appen (claude.ai och Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector; ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server) och klistra in denna <strong>anslutningsadress</strong>: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Klicka på Connect.</strong> Appen öppnar webbplatsens inloggningssida automatiskt. Logga in med ditt användarnamn och lösenord för webbplatsen."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Klicka på Tillåt.</strong> Du återvänder till appen och anslutningen är klar. Appen kan göra allt som ditt konto har behörighet till på webbplatsen."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Anslut en AI-app till webbplatsen"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Det finns tre sätt. Klicka på ett av dem för att visa stegen. Det första passar de flesta."
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. Logga in (enklast) &mdash; ChatGPT, claude.ai, Claude Desktop och de flesta andra AI-appar"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Klistra in en anslutningsinstruktion &mdash; för en AI-chatt som kan köra kommandon"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. Konfigurationsfil eller kommandorad &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI med flera"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Fungerar i AI-appar som kan köra kommandon (Codex, Claude Code, Cursor, Cline, Copilots agentläge och liknande). AI:n testar själv anslutningen och kan erbjuda sig att göra den permanent."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="För appar som du ansluter med en inställningsfil eller ett kommando. Du gör det en gång och anslutningen finns sedan kvar."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>Hämta din API-token.</strong> Klicka på knappen så öppnas din användarprofil i en ny flik. Öppna fliken <strong>Joomla API-token</strong>, klicka på ögonikonen för att visa token och kopiera den. Återvänd sedan till denna flik."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="Hämta min API-token (öppnas i en ny flik)"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>Kopiera instruktionen.</strong> Din token finns redan i den."
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="<strong>Klistra in den i en ny konversation</strong> i din AI-app och skicka den. AI:n testar anslutningen och erbjuder sig, om möjligt, att göra den permanent."
COM_CSMCPFORJ_DASHBOARD_WAY3_STEP_COPY="<strong>Kopiera konfigurationen.</strong> Din token finns redan i den."
COM_CSMCPFORJ_DASHBOARD_WAY3_GUIDE_LINK="Stegvisa instruktioner för varje app finns i anslutningsguiden &rarr;"
COM_CSMCPFORJ_DASHBOARD_COPY_URL_BUTTON="Kopiera"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1_COPY="<strong>Kopiera anslutningsadressen.</strong>"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2_ADD="<strong>Lägg till anslutningsadressen som en anslutning i din AI-app.</strong> Var du gör det beror på appen:"
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN="Anslut genom att logga in"
