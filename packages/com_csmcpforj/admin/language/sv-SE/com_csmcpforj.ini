COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_HEADING="Vi hör gärna från dig"
COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_BODY="Skicka felrapporter, funktionsönskemål, frågor och idéer &mdash; vi läser allt och uppskattar återkopplingen. Support för gratisversionen ges efter förmåga eftersom resurserna är begränsade, så svar kan dröja. Om du behöver garanterade svarstider eller prioritet kan du överväga %sett MCP for J Pro-medlemskap%s."

