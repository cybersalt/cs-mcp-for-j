COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_LABEL="Katalog"
COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_DESC="Inställningar för katalogen över MCP-integrationer."
COM_CSMCPFORJ_CONFIG_CATALOG_URL_LABEL="Katalogens anslutnings-URL"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_DESC="Adressen som katalogen över MCP-integrationer hämtas från. Behåll standardvärdet om du inte använder en privat katalogspegel. Till en basadress läggs /catalog.json till."
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="Katalogcachens livslängd (timmar)"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="Hur länge hämtad catalog.json sparas i cachen innan den hämtas igen. Knappen för manuell uppdatering på katalogsidan åsidosätter detta. Intervall 1&ndash;168 (en vecka)."
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="Visa otillgängliga Pro-integrationer"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Visa Pro-integrationer i katalogen även om du inte har ett Pro-medlemskap. Det gör det möjligt att se vad som finns. Välj Nej för att dölja dem helt."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Kontrollera medlemskap igen efter (sekunder)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="Hur ofta kontrollpanelen frågar cybersalt.com om den kopplade e-postadressen fortfarande har Pro-åtkomst. 86400 = en gång per dag (rekommenderas). Minst 60, högst 604800 = en gång per vecka."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="MCP-server"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Serverinställningar för MCP-anslutningspunkten. Påverkar vad MCP-klienter kan se och anropa."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Skrivskyddat läge"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="När JA är valt visar och godtar MCP-anslutningspunkten endast verktyg vars MCP ToolAnnotations anger att de är skrivskyddade (list_*, get_*, read_*, check_*, validate_*, fetch_* samt joomla_update_healthcheck). Användbart när en AI-klient ska undersöka webbplatsen utan att kunna ändra innehåll. Skrivförsök ger ett fel som förklarar att servern är skrivskyddad. Inställningen är en miniminivå: en MCP-klient kan även lägga till ?read_only=1 i anslutningspunktens URL för att begränsa åtkomsten ytterligare, men kan inte AKTIVERA skrivåtkomst om JA är valt på webbplatsen."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Sekretess vid skärmdelning"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Inställningar för skyddet som suddar ut hemliga uppgifter på kontrollpanelen (Joomla API-token i instruktionsförhandsvisningen och e-postadress för Pro-medlemskap). Utsuddning är aktiverad som standard. Alternativen styr visning när muspekaren hålls över uppgiften, så att den inte råkar röjas vid skärmdelning eller skärminspelning."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Fördröjning före visning vid pekning (sekunder)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Hur många sekunder muspekaren måste hållas över en utsuddad hemlig uppgift innan den visas. En liten nedräkning visas bredvid uppgiften. Om muspekaren flyttas bort avbryts visningen och timern återställs &mdash; nästa pekning startar en ny fullständig nedräkning. Ange 0 för omedelbar visning vid pekning (tar bort skyddet mot oavsiktlig visning men återställer det tidigare beteendet). Standardvärde: 3 sekunder."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Dölj automatiskt efter visning (sekunder)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Hur länge en hemlig uppgift är synlig efter att muspekaren har hållits över den innan den suddas ut igen &mdash; även om muspekaren ligger kvar. Detta ger extra skydd om du läser uppgiften och sedan blir distraherad, så att den inte förblir synlig obegränsat i en obevakad webbläsare. Om muspekaren flyttas bort suddas uppgiften omedelbart ut oavsett denna inställning. Ange 0 för att stänga av automatisk döljning (uppgiften förblir synlig tills muspekaren flyttas bort). Standardvärde: 8 sekunder &mdash; tillräckligt för att läsa en hel base64-token, men kort nog för att begränsa exponeringen i en obevakad session."

