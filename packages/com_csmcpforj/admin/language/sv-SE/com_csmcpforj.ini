COM_CSMCPFORJ_CHECK_CLOUDFLARE="Webbplatsen använder Cloudflare. Om svaret är en Cloudflare-sida lägger du till en anpassad WAF-regel med åtgärden Skip för MCP- och inloggningsadresserna och markerar Browser Integrity Check och Security Level (se Felsökning nedan)."
