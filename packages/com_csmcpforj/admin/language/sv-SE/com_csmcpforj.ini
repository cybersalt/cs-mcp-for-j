COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="Anslutningsguide"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="Anslutningsguide"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for J — Anslutningsguide"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Anslut en AI till denna Joomla-webbplats"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for J gör det enkelt att ansluta en AI-assistent som Codex, Claude, ChatGPT eller Cursor till din Joomla-webbplats &mdash; så att AI:n kan läsa artiklar, hantera användare, publicera innehåll och mer via sitt vanliga chattgränssnitt. Du behöver inga tekniska kunskaper. Den enkla metoden nedan fungerar för de flesta. Längre ned finns avancerade alternativ om du behöver dem."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ Det enkla sättet"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Inga konfigurationsfiler, huvuden eller fackuttryck. Kopiera bara en färdig anslutningsinstruktion från kontrollpanelen och klistra in den i en ny chatt med din AI. AI:n gör resten &mdash; testar anslutningen och erbjuder, i klienter som stöder det, att spara anslutningen permanent."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Hämta din API-nyckel</strong> (ett personligt lösenord som låter din AI agera på webbplatsen). Se instruktionerna nedan om du inte har någon ännu."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Gå till kontrollpanelen</strong> (knappen nedan) och klistra in din API-nyckel i fältet där."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Klicka på knappen &ldquo;Kopiera anslutningsinstruktion&rdquo;</strong> på kontrollpanelen. Nyckeln infogas automatiskt i instruktionen före kopieringen."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Klistra in i en ny chatt</strong> med din AI (Claude, ChatGPT, Cursor, Copilot, Gemini med flera) och skicka. AI:n bekräftar att anslutningen fungerar och erbjuder att spara den."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Gå till kontrollpanelen"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="Klart. Din AI är ansluten. Fortsätt läsa nedan om du vill veta mer om hur delarna hänger ihop eller vill ställa in din AI manuellt &mdash; men det behövs inte."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Hämta din API-nyckel"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="En <strong>API-nyckel</strong> är ett personligt lösenord som låter din AI agera som DIG på denna Joomla-webbplats. Alla som har nyckeln kan göra det som ditt Joomla-konto får göra &mdash; håll den därför hemlig. Så här skapar du en:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sKlicka här för att öppna din användarprofil i Joomla%s. Den öppnas i en ny flik. Välj fliken <strong>Joomla API-token</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="Klicka på <strong>Återställ</strong> på fliken. Joomla skapar en lång sträng med bokstäver och siffror i fältet under knappen. Det är din nyckel."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Klicka på den lilla <strong>ögonikonen</strong> bredvid fältet för att visa nyckeln och kopiera sedan hela strängen."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Klistra in den i fältet nedan på denna sida (den sparas endast i webbläsaren så att sidans kopieringsknappar kan fylla i den automatiskt), ELLER direkt i kontrollpanelens fält för API-nyckel om du använder den enkla anslutningen."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Behandla nyckeln som ett lösenord."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Klistra inte in den i delade dokument, skärmbilder eller kod som ska publiceras. Om den röjs går du till fliken Joomla API-token och klickar på Återställ igen &mdash; den gamla nyckeln blir omedelbart ogiltig."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Klistra in din API-nyckel här (för kopiering med ett klick på denna sida)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Nyckeln sparas endast i denna webbläsare</strong> &mdash; den lämnar aldrig din dator. Använd papperskorgsknappen för att ta bort den. Om fältet lämnas tomt fungerar kopieringsknapparna ändå, men du måste klistra in nyckeln manuellt i det kopierade exemplet."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Visa/dölj nyckeln"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Ta bort den sparade nyckeln"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Avancerat: anslut en AI manuellt (behövs sällan)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Detta avsnitt är för dig som vill ställa in AI-klientens anslutning till webbplatsen manuellt &mdash; vanligtvis genom att redigera en liten textfil som kallas konfigurationsfil. Om den enkla anslutningen ovan fungerade kan du hoppa över hela avsnittet. Läs vidare om du vill registrera anslutningen direkt i AI-klienten utan anslutningsinstruktionen."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="Webbplatsens anslutnings-URL"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="Detta är adressen din AI-klient behöver. Klistra in den i klientens inställningar tillsammans med din API-nyckel."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Välj din AI-klient"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="Anslutnings-URL och API-nyckel är desamma för alla AI-klienter &mdash; bara <em>var du klistrar in dem</em> skiljer sig åt. Välj din klient nedan för särskilda instruktioner."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, IDE-tillägg eller skrivbordsapp)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex har inbyggt stöd för denna anslutningspunkt som MCP-server via Streamable HTTP. Spara först Joomla API-nyckeln i en miljövariabel för webbplatsen och registrera sedan anslutningspunkten med miljövariabelns namn. Nyckeln skrivs aldrig till <code>config.toml</code>. Om du använder kopieringsknappen efter att ha klistrat in nyckeln ovan innehåller det kopierade miljökommandot nyckeln. Håll det därför borta från delade terminaler, inspelningar och supportärenden."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; spara nyckeln för framtida Codex-processer"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Öppna en ny terminal när du har angett en beständig Windows-miljövariabel. Befintliga Codex- och terminalprocesser kan inte se den."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; ange nyckeln för denna terminal (spara den i en säker skalmiljö vid behov)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Registrera denna Joomla-webbplats i Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Kör <code>codex mcp list</code>, starta om Codex (eller kontrollera MCP-statusen i gränssnittet) och anropa sedan det skrivskyddade verktyget <code>get_joomla_version</code>. Detta verifierar initiering, autentisering, verktygsidentifiering och anrop. För en skrivskyddad anslutning aktiverar du också MCP for J:s skrivskyddade serverläge. Klientens inställningar för godkännande kan inte åsidosätta serverns behörigheter."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Ogiltig token med cPanel eller PHP-FPM?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Webbservern kan ta bort standardhuvudet Authorization. Ersätt posten som skapades ovan i <code>~/.codex/config.toml</code> med detta block så att Codex läser samma miljövariabel och skickar den som <code>X-Joomla-Token</code>. Starta sedan om Codex."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Observera &mdash; Claudes dialog &ldquo;Add custom connector&rdquo; kräver OAuth, som är avstängt på webbplatsen."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Den inbyggda dialogen &ldquo;Add custom connector&rdquo; i Claude Desktop och claude.ai ansluter genom inloggning (OAuth) och saknar fält för API-nyckel. En superanvändare kan aktivera OAuth-inloggning i MCP for J:s inställningar. Då fungerar dialogen. Tills dess använder instruktionerna för Claude Desktop nedan en redigerad konfigurationsfil. (Du kan också använda den enkla anslutningen ovan &mdash; den fungerar även med Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Fyra steg: skapa en liten hjälpfil, ett så kallat omslutningsskript, med anslutningskommandot, hänvisa till den från Claude Desktops konfigurationsfil och starta sedan om Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Varför ett omslutningsskript i stället för anslutningen direkt i Claude Desktops konfiguration? Claude Desktop 1.30096+ (augusti 2026) avvisar konfigurationsposter vars kommandoargument ser ut att innehålla inloggningsuppgifter. Denna säkerhetsfunktion blockerar därför direktmetoden. Genom att flytta kommandot till en liten hjälpfil kan den begränsningen kringgås (Claude Desktop ser bara ett vanligt kommando utan synliga argument), samtidigt som API-nyckeln skyddas på samma sätt som tidigare &mdash; hjälpfilen ligger i din användarmapp tillsammans med Claude Desktops egen konfiguration."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Engångsförberedelse &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Instruktionerna förutsätter att Node.js är installerat på din dator (det innehåller kommandot <code>npx</code>). Det finns redan i de flesta utvecklingsmiljöer. Installera det annars från <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> med LTS-installationsprogrammet. Hjälpfilen nedan förutsätter att Node.js finns på Windows standardsökväg <code>C:\Program Files\nodejs\</code>. Om du har installerat det någon annanstans ändrar du sökvägen i hjälpfilen efter kopieringen."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Steg 1 &mdash; skapa omslutningsskriptet"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Gäller tills vidare endast Windows (se vanliga frågor för Mac/Linux). Kopiera blocket nedan till en ny oformaterad textfil. Spara den i din användarmapp (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) med filnamnet <code>claude-mcp-joomla-{sitename}.cmd</code>. Ersätt <code>{sitename}</code> med ett kort namn för din webbplats (till exempel <code>cybersaltorg</code>). Kontrollera att <code>.cmd</code> verkligen är filändelsen och inte en del av filnamnet &mdash; välj &ldquo;Spara som typ: Alla filer&rdquo; i Anteckningar så att <code>.txt</code> inte läggs till. Om du har klistrat in API-nyckeln i fältet överst på sidan infogar kopieringsknappen den automatiskt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Osäker på ditt Windows-användarnamn? Öppna Utforskaren, gå till <code>C:\Users\</code> och titta på mappnamnen &mdash; en mapp tillhör dig."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Steg 2 &mdash; öppna Claude Desktops konfigurationsfil"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Claude Desktops inställningsfil har en bestämd sökväg för varje operativsystem. Öppna den med en textredigerare (VS Code, Anteckningar, TextEdit, Sublime eller den du har):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop har en knapp under Settings &rarr; Developer &rarr; <strong>Edit Config</strong> som ska öppna filen. Om inget händer vet datorn inte vilket program som ska öppna <code>.json</code>-filer. Öppna då filen själv med en textredigerare och en av sökvägarna ovan. Om filen saknas skapar du den och använder hela blocket nedan som innehåll (omslutet av <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Steg 3 &mdash; lägg till detta block i Claude Desktops konfiguration"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Klistra in detta i <code>claude_desktop_config.json</code>. Om filen redan har ett <code>mcpServers</code>-objekt med andra servrar lägger du till posten <code>joomla-...</code> bredvid dem (klistra inte in ett andra <code>mcpServers</code>-objekt). Om filen är tom eller saknas använder du hela blocket nedan som innehåll. <strong>Viktigt:</strong> ersätt <code>YOUR_WINDOWS_USERNAME</code> med ditt faktiska Windows-användarnamn."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Denna konfiguration hänvisar bara Claude Desktop till omslutningsskriptet från steg 1. API-nyckeln stannar i hjälpfilen och läggs inte i Claude Desktops konfiguration."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Steg 4 &mdash; avsluta Claude Desktop helt och öppna det igen"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop läser konfigurationsfilen endast vid start. Avsluta programmet helt &mdash; högerklicka i Windows på Claude-ikonen i meddelandefältet (längst ned till höger; du kan behöva klicka på uppåtpilen) och välj Quit. Vänta några sekunder och starta sedan igen. Klicka på verktygsikonen i en konversation (eller fråga &ldquo;vilka verktyg har du?&rdquo;) &mdash; webbplatsens verktyg ska finnas i listan. Se Felsökning nedan om de saknas."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (terminal eller VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Med Claude Code skapas anslutningen med ett enda terminalkommando &mdash; ingen konfigurationsfil behöver redigeras. Klistra in API-nyckeln i fältet ovan så att kopieringsknappen nedan fyller i den. Klistra sedan in kommandot i en terminal och tryck på Enter. Claude Code bekräftar anslutningen direkt och läser in på nytt."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (webbversionen)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="Dialogen <strong>Add custom connector</strong> i claude.ai ansluter genom inloggning (OAuth), som är avstängt på denna webbplats. En superanvändare kan aktivera det i MCP for J:s inställningar, så får claude.ai en permanent anslutning. Tills dess fungerar den enkla anslutningen ovan (metoden med inklistrad instruktion) endast i den aktuella chatten."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor sparar sina MCP-anslutningar i konfigurationsfilen <code>mcp.json</code>. Öppna den i en textredigerare, klistra in blocket nedan i objektet <code>mcpServers</code> och spara. Cursor läser vanligtvis in ändringen utan omstart."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Konfigurationsfilens plats: <code>~/.cursor/mcp.json</code> (för alla projekt) eller <code>.cursor/mcp.json</code> i en särskild projektmapp (endast för det projektet)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Anpassade MCP-servrar i ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="Dialogen <strong>Add custom MCP server</strong> i ChatGPT kan endast ansluta genom inloggning (OAuth) eller utan autentisering. Den saknar fält för API-nyckel och huvuden. OAuth-inloggning är avstängt på webbplatsen, så ChatGPT kan ännu inte ansluta. En superanvändare kan aktivera det i MCP for J:s inställningar. Använd tills dess Codex (OpenAI:s kodningsagent), som skickar API-nyckeln från en miljövariabel."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="En anpassad MCP-server kräver ett betalt ChatGPT-abonnemang. Det fungerar med Plus (kontrollerat i oktober 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI och Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Både Gemini CLI (Googles AI-assistent för terminalen) och tillägget Gemini Code Assist (för VS Code / JetBrains) läser samma MCP-konfigurationsfil. Två steg: redigera filen för att lägga till denna Joomla-webbplats som MCP-server och starta sedan om Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Du kan lägga till servern globalt (så att den syns i alla Gemini-sessioner) eller endast i en projektmapp. Exemplet är identiskt &mdash; bara filens plats skiljer sig åt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Öppna eller skapa Geminis inställningsfil."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Välj en av dessa två platser:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Globalt (alla projekt):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Endast projektet:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (i en projektmapp)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Klistra in detta block i filen."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Om filen redan har ett avsnitt <code>mcpServers</code> lägger du till posten <code>&quot;joomla-...&quot;</code> i det befintliga avsnittet &mdash; skapa inte en andra yttre <code>mcpServers</code>-nyckel. Om filen är tom eller ny klistrar du in hela exemplet som det är."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini använder <code>httpUrl</code> för HTTP-baserade MCP-servrar (som denna), till skillnad från Cursors nyckel <code>url</code>. Kopiera detta exempel exakt i stället för att återanvända Cursors exempel."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Starta om Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Avsluta och starta <code>gemini</code> igen i terminalen eller läs in VS Code-/JetBrains-fönstret på nytt. Skriv <code>/mcp</code> i Gemini CLI för att se anslutna servrar och kontrollera att din Joomla-webbplats finns i listan."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="Webbappen <code>gemini.google.com</code> stöder inte anpassade MCP-servrar i augusti 2026 &mdash; denna guide gäller endast Gemini CLI och Gemini Code Assist. Om Google senare lägger till stöd i webbgränssnittet dokumenterar vi det här."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Andra AI-klienter med MCP-stöd (Cline, Continue, GitHub Copilot i agentläge, Windsurf, mcp-cli med flera) fungerar också &mdash; anslutnings-URL och API-nyckel är desamma, bara platsen där du klistrar in dem skiljer sig åt. Vi lägger till särskilda guider för fler klienter efterhand. Se vanliga frågor nedan om du behöver allmän vägledning."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Kopiera"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Har kopierats"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Har kopierats (med din nyckel)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Säkerhet &amp; delning"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="Din API-nyckel ÄR inloggningen &mdash; den som har den kan göra allt som ditt Joomla-konto får göra. Ingen anonym åtkomst tillåts. Om du aktiverar <strong>OAuth-inloggning</strong> kan en AI-app även ansluta genom att skicka dig till webbplatsens vanliga inloggningssida. Appen agerar sedan som det inloggade kontot med exakt det kontots behörigheter tills du kopplar från den på kontrollpanelen."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Ge andra personer MCP-åtkomst"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Det finns två sätt &mdash; välj det som passar:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="En nyckel per person (säkrast)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Skapa en Joomla-användare för varje person och placera dem i en grupp med endast de behörigheter de ska ha (till exempel skrivskyddad åtkomst). Skapa en nyckel för användaren och skicka den privat. Varje person får en egen aktivitetshistorik, och du kan återkalla en nyckel utan att påverka de andra."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="En gemensam nyckel (enklast men minst säkert)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Skapa en begränsad användare (till exempel <code>mcp-demo-guest</code>) i en skrivskyddad grupp, skapa en nyckel och dela den med flera. Det är enklare att dela ut men svårare att veta vem som använder den eller att återkalla åtkomsten för en enda person. Passar för en offentlig demonstration, inte för känslig åtkomst."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Återkalla en nyckel"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="För att omedelbart sluta godta en befintlig nyckel går du till Användare &rarr; den berörda användaren &rarr; fliken Joomla API-token &rarr; klickar på <strong>Återställ</strong>. Den gamla nyckeln blir ogiltig direkt. Ge personen den nya nyckeln eller lämna kontot utan åtkomst."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Felsökning"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Hitta typen av app du ansluter och öppna sedan det problem som motsvarar det du ser. Felmeddelanden och brandväggsblockeringar kan förekomma i alla appar och har därför en egen grupp sist."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; eller &ldquo;Authentication failed&rdquo; (fel 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="Din AI når webbplatsen men API-nyckeln stämmer inte. Kontrollera att: (1) nyckeln inte har återställts sedan du kopierade den (varje återställning gör den föregående nyckeln ogiltig); (2) hela nyckeln har kopierats utan saknade tecken eller extra mellanslag; (3) ordet <code>Bearer </code> (med efterföljande mellanslag) står före nyckeln om du har redigerat en konfigurationsfil. Skapa en ny nyckel och försök igen om du är osäker."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; eller &ldquo;Could not match accept header&rdquo; (fel 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Äldre versioner av MCP for J (före 2.3.4) hade ett fel som hindrade vissa AI-klienter från att ansluta. Uppdatera MCP for J till den senaste versionen &mdash; se System &rarr; Uppdatera &rarr; Tillägg i Joomlas administration."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;Ansluten, men inga verktyg visas i AI:n&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Vanligtvis beror det på en av tre saker: (1) användargruppen saknar <strong>Webbtjänstinloggning</strong> &mdash; ställ in den under System &rarr; Globala inställningar &rarr; Behörigheter (endast superanvändare har den som standard); (2) gruppen saknar MCP-behörighet &mdash; superanvändare har den alltid och administratörer genom Joomlas standardinställningar, men Manager och andra grupper behöver Använd MCP-anslutningspunkt (och Skriv via MCP-anslutningspunkt för ändringar) under komponentens Inställningar &rarr; Behörigheter; (3) AI-klienten har sparat en tom verktygslista i cachen &mdash; koppla från MCP-servern i klienten och anslut igen för att tvinga fram en ny kontroll."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; eller adressen ger ett fel (fel 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Antingen är adressen fel (kontrollera att den slutar med <code>/api/index.php/v1/mcp</code>) ELLER så är Joomla-webbplatsens MCP-plugin för webbtjänster inaktiverad. I Joomlas administration: System &rarr; Hantera &rarr; Tillägg &rarr; sök efter <code>csmcpforj</code> &rarr; kontrollera att webbtjänstpluginen är aktiverad. Om den redan är aktiverad kan webbplatsens <code>.htaccess</code> blockera sökvägen <code>/api/</code> &mdash; ett problem hos webbhotellet eller i en säkerhetsplugin."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; eller &ldquo;Malware detected&rdquo; (fel 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="En säkerhetsplugin på Joomla-webbplatsen (RSFirewall, Admin Tools Pro, Securitycheck Pro) blockerar MCP-begäran. Lägg till två undantag i RSFirewall: <code>csmcpforj_oauth</code> och <code>api\/index\.php\/v1\/mcp</code> som reguljärt uttryck (det första gäller inloggning). Tillåt i de andra tilläggen <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> och adresser som innehåller <code>csmcpforj_oauth</code>. Bekräfta orsaken genom att kort stänga av säkerhetspluginen, testa igen och sedan aktivera den med undantagen på plats. Knappen <strong>Kontrollera anslutning</strong> på kontrollpanelen visar vilken adress som blockeras."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Inget händer när jag klickar på Claude Desktops knapp &ldquo;Edit Config&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Knappen försöker öppna <code>claude_desktop_config.json</code> med det program som datorn använder för <code>.json</code>-filer. Om inget sådant har angetts händer inget och inget fel visas. Lösning: öppna filen själv med en textredigerare. Sökvägar för varje operativsystem finns i Claude-avsnittet under Avancerat ovan. Om filen saknas skapar du den och använder hela exemplet från det avsnittet som innehåll (omslut exemplet med <code>{&quot;mcpServers&quot;: { ... }}</code>). Inga behörigheter behöver ändras &mdash; filen finns i din egen användarmapp."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="Dialogerna &ldquo;Add custom connector&rdquo; i Claude och &ldquo;Add custom MCP server&rdquo; i ChatGPT saknar fält för API-nyckel"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Dessa dialoger är byggda för att ansluta genom inloggning (OAuth). Det finns ingenstans att klistra in en API-nyckel för MCP for J. OAuth-inloggning är avstängt på webbplatsen. En superanvändare kan aktivera det under Komponenter &rarr; MCP for J &rarr; Inställningar &rarr; <strong>OAuth-inloggning</strong>, och då fungerar båda dialogerna. Tills dess kan Claude Desktop använda metoden med omslutningsskript ovan, claude.ai den enkla anslutningen och ChatGPT-användare Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop visar &ldquo;Some MCP servers could not be loaded&rdquo; vid start"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (augusti 2026) har striktare validering av konfigurationsfiler och avvisar poster vars kommandoargument ser ut att innehålla inloggningsuppgifter. Det blockerar de två uppenbara sätten att ställa in en MCP-server med bearer-token direkt i <code>claude_desktop_config.json</code>: den inbyggda formen <code>type: http</code> OCH <code>mcp-remote</code> med argumentet <code>--header &quot;Authorization: Bearer ...&quot;</code>. Båda ser riktiga ut i konfigurationsfilen men utelämnas av Claude Desktops schemavalidering vid inläsning. <strong>Lösning:</strong> använd metoden med omslutningsskript som beskrivs i Claude-avsnittet under Avancerat ovan &mdash; lägg hela kommandot i en liten <code>.cmd</code>-fil och låt konfigurationen hänvisa till filen. Claude Desktop ser ett vanligt kommando utan synliga argument och godtar det. API-nyckeln skyddas som tidigare &mdash; hjälpfilen ligger i din egen användarmapp."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Jag har startat om Claude Desktop men den nya anslutningen syns fortfarande inte"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="I Windows döljs Claude Desktop bara i meddelandefältet när du stänger fönstret &mdash; appen fortsätter att köras med den GAMLA konfigurationen i minnet. Om du klickar på ikonen i aktivitetsfältet visas bara fönstret från den redan körande processen igen. Claude Desktop läser endast om konfigurationsfilen vid en verklig omstart. Gör så här: högerklicka på Claude-ikonen i meddelandefältet (längst ned till höger; du kan behöva klicka på uppåtpilen för dolda ikoner) &rarr; välj <strong>Quit</strong> &rarr; vänta cirka 3 sekunder tills processen har avslutats &rarr; starta Claude Desktop från Start-menyn. Först då börjar ändringarna gälla."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Vanliga frågor"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Kan någon använda anslutningen utan API-nyckel?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="Nej. Varje begäran måste innehålla en giltig API-nyckel eller en OAuth-åtkomsttoken om OAuth-inloggning är aktiverad. Begäranden utan dessa avvisas. Detta är avsiktligt &mdash; AI:n kan utföra verkliga åtgärder på webbplatsen (skapa artiklar, redigera användare med mera), så anonym åtkomst skulle innebära en allvarlig säkerhetsrisk."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Kan en Joomla-användare ha flera aktiva API-nycklar?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="Nej. Joomla sparar exakt en API-nyckel per användare. Återställ skapar en ny och gör den gamla ogiltig. Om du behöver flera nycklar (en per enhet, en per AI-verktyg med mera) skapar du separata Joomla-användare."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Finns det någon gräns för hur mycket jag får använda anslutningen?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="MCP for J har ingen egen anropsbegränsning. Webbhotellets vanliga begränsningar gäller (PHP-minne, MariaDB-anslutningar med mera). Om du orsakar mycket trafik, till exempel stora massåtgärder på många webbplatser, kan du kontakta webbhotellet om högre kapacitet för samtidiga PHP-FPM-processer."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Behöver jag öppna portar i brandväggen eller göra särskilda inställningar?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="Nej. MCP använder vanlig HTTPS på port 443. Om webbplatsen redan kan nås offentligt på <code>https://yoursite.com/</code> kan MCP-anslutningspunkten nås från AI-klienter på internet utan extra inställningar."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="Hur byter jag API-nyckel regelbundet?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Det finns ingen automatisk schemaläggning &mdash; du byter manuellt när du vill. Gå till Användare &rarr; användaren &rarr; fliken Joomla API-token &rarr; klicka på Återställ. Uppdatera sedan AI-klientens konfiguration med den nya nyckeln. En bra vana är att byta alla nycklar som har synts i en skärmbild, logg eller felrapport."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Fungerar en AI-klient som inte finns i listan ovan?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Nästan säkert, om den stöder vanlig MCP via HTTPS och låter dig lägga till ett eget Authorization-huvud eller logga in med OAuth (aktivera OAuth-inloggning i inställningarna). Adressen är densamma överallt &mdash; bara klientens inställningsgränssnitt skiljer sig åt. Klienter som vi vet fungerar men ännu inte har skrivit stegvisa guider för: Continue.dev, Windsurf, Zed editor, mcp-cli, MCP Inspector, LibreChat, Open WebUI (via <code>mcpo</code>-brygga) och olika Ollama-baserade agenter."

