COM_CSMCPFORJ_OAUTH_REVOKED="Appen har kopplats från. Den förlorar åtkomsten vid nästa begäran och måste godkännas igen för att återansluta."
COM_CSMCPFORJ_OAUTH_REVOKE_NOTHING="Appen hade ingen aktiv åtkomst att koppla från."
