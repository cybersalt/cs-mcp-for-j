COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="OAuth-inloggning"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Låter AI-appar ansluta genom att öppna webbplatsens inloggningssida, utan att du behöver kopiera en API-nyckel till dem. ChatGPT (&ldquo;Add custom MCP server&rdquo;) och claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) kan bara ansluta på detta sätt. Anslutningar med API-nyckel fungerar oavsett inställning."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="Aktivera OAuth-inloggning"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="När funktionen är aktiverad klistrar du in webbplatsens MCP-adress i en AI-app. Appen öppnar webbplatsens inloggningssida, där du loggar in med ditt vanliga användarnamn och lösenord och klickar på Tillåt. Appen agerar sedan som du, med exakt dina behörigheter på webbplatsen. Anslutna appar visas på kontrollpanelen, där du kan koppla från dem var för sig. Om funktionen stängs av kopplas samtliga från omedelbart."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Åtkomsttokens giltighetstid (sekunder)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Hur länge varje åtkomsttoken gäller innan appen förnyar den automatiskt. Standardvärdet är 3600 (en timme). Mellan 300 och 86400."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Förbli inloggad i (dagar)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Hur länge en app får fortsätta förnya åtkomsten utan att användaren loggar in igen. Tiden börjar om vid varje förnyelse. Standardvärdet är 30."
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="Anslut AI-appar genom att logga in"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="Vissa AI-appar, däribland ChatGPT och claude.ai, kan bara ansluta till en webbplats genom att öppna dess inloggningssida. Funktionen är avstängd på denna webbplats, så dessa appar kan ännu inte ansluta. Aktivera <strong>OAuth-inloggning</strong> i Inställningar för att tillåta det. Anslutningar med API-nyckel fungerar oavsett inställning."
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="Öppna Inställningar för att aktivera funktionen"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="Ingen API-nyckel behövs. Det enda du kopierar är webbplatsens <strong>anslutningsadress</strong>."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="Kontrollerar att AI-appar kan hitta webbplatsens inloggningssida&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>Klar.</strong> AI-appar kan hitta webbplatsens inloggningssida."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>Inte klar.</strong> AI-appar kan inte hitta webbplatsens inloggningssida och kan därför inte ansluta. Aktivera <strong>Använd URL-omskrivning</strong> under System &rarr; Globala inställningar och kontrollera att webbplatsens .htaccess-fil finns på plats. Mer information finns i anslutningsguidens felsökningsavsnitt."
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_HEADING="Anslutna appar"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_NONE="Inga AI-appar är anslutna ännu. En app visas här när någon har loggat in och klickat på Tillåt."
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_APP="App"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_USER="Inloggad som"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_CONNECTED="Ansluten"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_LAST_USED="Senast använd"
