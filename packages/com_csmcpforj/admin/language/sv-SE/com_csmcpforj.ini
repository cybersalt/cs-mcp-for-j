COM_CSMCPFORJ_CHECK_OK_ENDPOINT="Tillgänglig. Ber appar att logga in eller skicka en token, som den ska."
COM_CSMCPFORJ_CHECK_OK_DISCOVERY="Tillgänglig. Appar kan hämta information om hur de loggar in."
