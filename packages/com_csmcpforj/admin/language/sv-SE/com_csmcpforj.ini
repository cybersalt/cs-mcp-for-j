COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="För Claude Desktop (konfigurationsfil), Claude Code, Cursor, Codex, Cline, Copilot, Gemini CLI eller andra klienter där du vill redigera konfigurationen direkt. Inställningen görs en gång och gäller i alla konversationer. (Anpassade anslutningar i claude.ai och ChatGPT kan inte skicka en API-nyckel: de ansluter genom inloggning. Se <strong>Anslut genom inloggning (OAuth)</strong> på denna sida.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="Skapa en Joomla API-token i Min profil."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="Kopiera konfigurationsexemplet nedan."
