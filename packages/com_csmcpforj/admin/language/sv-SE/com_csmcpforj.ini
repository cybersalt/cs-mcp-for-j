; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Brandväggar och URL-tillägg"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall är aktiverat."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="Det kan blockera MCP-begäranden (&ldquo;403 Access Forbidden &mdash; Malware detected&rdquo;) och inloggningen från claude.ai. Lägg till två undantag i RSFirewall: <code>csmcpforj_oauth</code> och <code>api\/index\.php\/v1\/mcp</code> som reguljärt uttryck."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools är aktiverat."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="Dess brandvägg för webbapplikationer kan blockera MCP-begäranden och inloggningen. Om <strong>Kontrollera anslutning</strong> visar en blockering söker du upp regeln i Blocked Requests Log i Admin Tools och lägger till ett WAF-undantag eller stänger av den regeln. Tillåt <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> och URL:er som innehåller <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck är aktiverat."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="Dess brandvägg kan blockera MCP-begäranden och inloggningen. Om <strong>Kontrollera anslutning</strong> visar en blockering söker du upp begäran i dess loggar och lägger till ett undantag för <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> och URL:er som innehåller <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 är aktiverat."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Detta SEO-tillägg kan fånga inloggningsadresserna (<code>index.php?csmcpforj_oauth=&hellip;</code>) och svara med startsidan, vilket gör att claude.ai eller ChatGPT inte kan registrera sig och inte visar någon tydlig orsak. Om <strong>Kontrollera anslutning</strong> visar startsidan för inloggningens anslutningspunkter undantar du URL:er som innehåller <code>csmcpforj_oauth</code> i Route 66 eller stänger av dess systemplugin."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Även webbhotellets brandväggar kan blockera: o2switch TigerProtect svarar med 503, medan Imunify360, ModSecurity och Cloudflare-regler svarar med 403. Be webbhotellet tillåta adresserna ovan eller släppa igenom Anthropics servrar (<code>160.79.104.0/21</code>) för claude.ai. <strong>Cloudflare</strong>: Browser Integrity Check och Security Level kan blockera apparnas servrar. Lägg till en anpassad WAF-regel (Security &rarr; WAF &rarr; Custom rules) med åtgärden <strong>Skip</strong> för begäranden vars URI-sökväg innehåller <code>/api/index.php/v1/mcp</code> eller <code>/.well-known/oauth-</code>, eller vars frågesträng innehåller <code>csmcpforj_oauth</code>, och markera <em>Browser Integrity Check</em> och <em>Security Level</em>. Bot Fight Mode kan inte undantas genom en regel, så stäng av funktionen om den blockerar."

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Checklista för claude.ai: &ldquo;cannot register&rdquo;, &ldquo;Authorization failed&rdquo; eller &ldquo;Couldn't reach the MCP server&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Gå igenom punkterna i ordning. Var och en av dem har kostat någon flera timmar."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Använd exakt denna adress: <code>%s</code>. Adressen måste ha eller sakna <em>www</em> på samma sätt som webbplatsen svarar, <strong>utan omdirigering</strong> däremellan (från www till domänen utan www eller från http till https). Knappen <strong>Kontrollera anslutning</strong> på kontrollpanelen rapporterar omdirigeringar."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="OAuth-inloggning är aktiverad på webbplatsen. claude.ai kan bara ansluta genom att logga in, så funktionen måste förbli aktiverad."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>OAuth-inloggning är avstängd på webbplatsen.</strong> claude.ai kan bara ansluta genom att logga in, så en superanvändare måste först aktivera funktionen: Komponenter &rarr; MCP for J &rarr; Inställningar &rarr; <strong>OAuth-inloggning</strong>. När funktionen är avstängd visar claude.ai &ldquo;cannot register&rdquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="Välj <strong>Sign in now</strong> i dialogrutan <strong>Add custom connector</strong>. För OAuth-klienten fungerar både <strong>Use Claude's published identity</strong> och <strong>Register automatically</strong> (den publicerade identiteten kräver PHP:s curl-tillägg på servern). Lämna klient-ID och klienthemlighet tomma. Om det ena sättet misslyckas tar du bort anslutningen och lägger till den igen med det andra."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>Lägg inte till begärandehuvuden.</strong> claude.ai accepterar inte ett <code>X-Joomla-Token</code>-huvud, så en API-nyckel kan inte användas där. Inloggning är det enda sättet att ansluta från claude.ai."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Brandväggar måste släppa igenom servrarna för claude.ai. De ansluter från <code>160.79.104.0/21</code>. RSFirewall behöver två undantag: <code>csmcpforj_oauth</code> och <code>api\/index\.php\/v1\/mcp</code> som reguljärt uttryck. Admin Tools, Securitycheck och webbhotellets brandväggar, till exempel o2switch TigerProtect (som svarar med 503), kan också blockera. <strong>Cloudflare</strong>: Browser Integrity Check och Security Level kan blockera apparnas servrar. Lägg till en anpassad WAF-regel (Security &rarr; WAF &rarr; Custom rules) med åtgärden <strong>Skip</strong> för begäranden vars URI-sökväg innehåller <code>/api/index.php/v1/mcp</code> eller <code>/.well-known/oauth-</code>, eller vars frågesträng innehåller <code>csmcpforj_oauth</code>, och markera <em>Browser Integrity Check</em> och <em>Security Level</em>. Bot Fight Mode kan inte undantas genom en regel, så stäng av funktionen om den blockerar. Knappen <strong>Kontrollera anslutning</strong> på kontrollpanelen visar vad som svarar."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> och andra SEO-tillägg som skriver om URL:er kan fånga inloggningsadresserna (<code>index.php?csmcpforj_oauth=&hellip;</code>) och svara med startsidan, vilket gör att appen inte kan registrera sig och inte visar någon tydlig orsak. Om <strong>Kontrollera anslutning</strong> visar startsidan för inloggningens anslutningspunkter undantar du URL:er som innehåller <code>csmcpforj_oauth</code> i tillägget eller stänger av dess systemplugin."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Logga in med ett konto som får använda MCP (se <em>Vem får använda anslutningspunkten?</em> på kontrollpanelen). Om det bara misslyckas för en person kontrollerar du att kontot inte är blockerat och att <em>Kräv lösenordsåterställning</em> inte är aktiverat."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="Fortfarande problem? Komponenter &rarr; MCP for J &rarr; <strong>Loggar</strong> visar varje steg i inloggningen och varför ett steg har nekats."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_JUMP="Gå till:"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_LOGIN="claude.ai, ChatGPT och andra appar som ansluter genom att logga in"
