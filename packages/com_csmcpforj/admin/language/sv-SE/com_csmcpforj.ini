COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Klistra in exemplet i AI-klientens MCP-konfiguration &mdash; Claude Desktop: <code>claude_desktop_config.json</code>; Claude Code: <code>claude mcp add</code>; Cursor: <code>~/.cursor/mcp.json</code>; GitHub Copilot: MCP-inställningarna i VS Code / JetBrains; Cline / Continue: tilläggets JSON-inställningar. Starta om klienten när du har sparat. (Dialogerna &ldquo;Add custom connector&rdquo; i claude.ai och ChatGPT har inget fält för detta; använd OAuth-inloggning där.)"
