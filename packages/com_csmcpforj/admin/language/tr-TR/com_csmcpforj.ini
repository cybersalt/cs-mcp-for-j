COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="OAuth ile oturum açma"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Yapay zekâ uygulamalarının, siz onlara bir API anahtarı kopyalamak yerine sizi bu web sitesinin giriş sayfasına göndererek bağlanmasını sağlar. ChatGPT (&ldquo;Add custom MCP server&rdquo;) ve claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) yalnızca bu şekilde bağlanabilir. API anahtarı kullanan bağlantılar her iki durumda da çalışmaya devam eder."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="OAuth ile oturum açmayı etkinleştir"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Açık olduğunda bu sitenin MCP adresini bir yapay zekâ uygulamasına yapıştırırsınız, uygulama bu web sitesinin giriş sayfasını açar, her zamanki kullanıcı adınız ve parolanızla oturum açar ve İzin ver'e tıklarsınız. Ardından uygulama sizin olarak, bu sitedeki izinlerinizin tam aynısıyla işlem yapar. Bağlı uygulamalar Kontrol Paneli'nde listelenir ve her birinin bağlantısı kesilebilir. Bunu kapatmak hepsinin bağlantısını hemen keser."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Erişim belirteci ömrü (saniye)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Uygulama sessizce yenilemeden önce her erişim belirtecinin ne kadar süre geçerli olacağı. Varsayılan 3600 (bir saat). 300 ile 86400 arası."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Oturum açık kalma süresi (gün)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Bir uygulamanın, kullanıcı yeniden oturum açmadan ne kadar süre yenilemeye devam edebileceği. Her yenileme süreyi sıfırlar. Varsayılan 30."
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="Yapay zekâ uygulamalarını oturum açarak bağlayın"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="ChatGPT ve claude.ai dahil bazı yapay zekâ uygulamaları bir web sitesine yalnızca sizi o sitenin giriş sayfasına göndererek bağlanabilir. Bu sitede bu kapalı, bu yüzden o uygulamalar henüz bağlanamaz. İzin vermek için Seçenekler'de <strong>OAuth ile oturum açmayı</strong> açın. API anahtarı kullanan bağlantılar her iki durumda da çalışmaya devam eder."
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="Açmak için Seçenekler'i açın"
