COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>İzin ver'e tıklayın.</strong> Bağlanmış olarak uygulamaya geri dönersiniz. Uygulama, hesabınızın bu sitede yapmasına izin verilen her şeyi yapabilir."
