COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="Oturum açarak bağlanın (en kolayı)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Kopyalanacak API anahtarı yok. Yapay zekâ uygulamanızda bir bağlayıcı ekleyin ve bu sitenin <strong>Uç nokta URL'sini</strong> (aşağıda) yapıştırın. Connect'e tıkladığınızda uygulama bu web sitesinin giriş sayfasını kendisi açar: bu web sitesindeki kullanıcı adınız ve parolanızla oturum açın, ardından <strong>İzin ver</strong>'e tıklayın."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai ve Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Bir ad verin, Uç nokta URL'sini yapıştırın ve Continue'ya tıklayın. <em>Sign in now</em> seçili kalsın; OAuth istemcisi için <em>Use Claude's published identity</em> ve <em>Register automatically</em> seçeneklerinin ikisi de çalışır. İstek başlığı eklemeyin. Add'e, ardından <strong>Connect</strong>'e tıklayın."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> sol kenar çubuğunda <strong>Plugins</strong> &rarr; <strong>Add</strong> (sağ üst) &rarr; <strong>Add custom MCP server</strong>. Bir ad verin, Uç nokta URL'sini yapıştırın, Authentication'ı <strong>OAuth</strong> olarak bırakın, kutuyu işaretleyin, <strong>Create as a plugin</strong>'e ve ardından <strong>Connect</strong>'e tıklayın. Ücretli bir ChatGPT planı gerekir (Plus çalışır)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>, ardından <code>/mcp</code> yazın, sunucuyu seçin ve <strong>Authenticate</strong>'i seçin."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> Komut Paleti &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; Uç nokta URL'sini yapıştırın. VS Code sizden oturum açmanızı ister."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> <code>mcp.json</code> içinde <code>mcpServers</code> altına <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> ekleyin (başlık yok), ardından Settings &rarr; MCP içinde sunucunun yanındaki <strong>Login</strong>'e tıklayın."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> <code>settings.json</code> içinde sunucu için <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> ekleyin, ardından <code>/mcp auth &lt;name&gt;</code> komutunu çalıştırın."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Codex giriş sayfasını kendisi açar (açmazsa <code>codex mcp login joomla</code> komutunu çalıştırın). Birkaç dakika içinde, Codex ile aynı bilgisayardaki bir tarayıcıda İzin ver'e tıklayın. Tarayıcı daha sonra 127.0.0.1'in bağlantıyı reddettiğini söylerse <code>codex mcp login joomla --no-browser</code> kullanın ve o sayfanın adresini terminale yapıştırın ya da aşağıdaki API anahtarı yöntemini kullanmaya devam edin."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, Uç nokta URL'sini yapıştırın, ardından <strong>Authenticate</strong>'e tıklayın."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="İzin ver'e tıkladığınızda uygulama, oturum açtığınız hesap olarak işlem yapar ve o hesabın bu sitede yapabildiklerinin tam aynısını yapabilir; hesabın izni varsa değişiklik yapmak da buna dahildir. Administrator ve Manager'ların önce <em>Web Servisleri Girişi</em> iznine ihtiyacı vardır (Kontrol Paneli'ndeki İzinler bölümüne bakın). Bağlı her uygulama Kontrol Paneli'nde listelenir ve oradan anında bağlantısı kesilebilir."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="API anahtarını mı tercih ediyorsunuz ya da istemciniz tarayıcı açamıyor mu? Aşağıdaki <strong>Gelişmiş kurulum</strong> altındaki API anahtarı yöntemi her istemci için hâlâ çalışır."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT (&ldquo;Add custom MCP server&rdquo;) ve claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) yalnızca sizi bu web sitesinin giriş sayfasına göndererek bağlanabilir. Bu sitede bu kapalı. Açık olduğunda bağlanmak şöyledir: bu sitenin adresini uygulamaya yapıştırın, oturum açın, İzin ver'e tıklayın."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="Seçenekler'den açın"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Bir Super User'dan MCP for J Seçenekleri'nde <strong>OAuth ile oturum açmayı</strong> açmasını isteyin. O zamana kadar aşağıdaki API anahtarı yöntemini kullanın."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="En kolayı: Claude'un &ldquo;Add custom connector&rdquo; iletişim kutusu bu sitede çalışır."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="Bu sitede oturum açarak bağlanma açık; bu yüzden Claude Desktop'ta veya claude.ai'de <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong> yolunu izleyin, bu sitenin MCP adresini yapıştırın, Continue'ya tıklayın, algıladığı oturum açma ayarlarını koruyun, Add'e ve ardından Connect'e tıklayın, bu web sitesindeki kullanıcı adınız ve parolanızla oturum açın ve İzin ver'e tıklayın. Aşağıdaki yapılandırma dosyası yöntemi yalnızca API anahtarını tercih ediyorsanız gerekir."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai, <strong>Add custom connector</strong> üzerinden kalıcı olarak bağlanır: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, bu sitenin MCP adresini yapıştırın, Continue'ya tıklayın, algıladığı oturum açma ayarlarını koruyun, Add'e ve ardından Connect'e tıklayın. Bu web sitesindeki kullanıcı adınız ve parolanızla oturum açın ve İzin ver'e tıklayın. Bağlantı her sohbette kullanılabilir kalır."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="ChatGPT'de sol kenar çubuğunda <strong>Plugins</strong>'e, ardından <strong>Add</strong> (sağ üst) &rarr; <strong>Add custom MCP server</strong>'a tıklayın. Bir ad verin (örneğin &ldquo;Joomla sitem&rdquo;), bu sitenin MCP adresini yapıştırın, Authentication'ı <strong>OAuth</strong> olarak bırakın, &ldquo;I understand and want to continue&rdquo; kutusunu işaretleyin ve <strong>Create as a plugin</strong>'e tıklayın. <strong>Connect</strong>'e tıklayın; ChatGPT bu web sitesinin giriş sayfasını açar: bu web sitesindeki kullanıcı adınız ve parolanızla oturum açın ve İzin ver'e tıklayın. Ardından bir sohbette <strong>@</strong> yazın ve eklentiyi seçin. Yapıştırılacak API anahtarı yoktur."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="&ldquo;Add custom connector&rdquo; iletişim kutusu bağlanıyor ama oturum açma başarısız oluyor"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Sırasıyla kontrol edin: (1) oturum açtığınız hesabın MCP kullanmasına izin verilmiş olmalı &mdash; Administrator'ların <em>Web Servisleri Girişi</em> iznine, Manager'ların ise buna ek olarak Seçenekler &rarr; İzinler bölümünde <em>MCP uç noktasını kullan</em> iznine ihtiyacı vardır (Kontrol Paneli'ndeki <em>Bu uç noktayı kim kullanabilir?</em> kartına bakın); izin yoksa giriş sayfası bunu söyler; (2) Kontrol Paneli'ndeki &ldquo;Yapay zekâ uygulamalarını oturum açarak bağlayın&rdquo; kartı <strong>Hazır</strong> diyor; (3) güvenlik duvarınız uygulamanın kendi sunucularının siteye ulaşmasına izin veriyor (bir sonraki maddeye bakın). İstemci kimliği veya gizli anahtar girmeyin: uygulama kendini kaydeder. (4) Giriş sayfası açıldıktan kısa süre sonra İzin ver'e tıklayın: uygulamalar bir süre sonra oturum açmaktan vazgeçer (Codex yaklaşık 5 dakika sonra) ve geç verilen bir İzin ver hatayla sonuçlanır. Connect'i yeniden başlatın, çalışır."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai veya ChatGPT siteye ulaşamıyor ya da oturum açma yarıda kalıyor"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai ve ChatGPT tarayıcınızdan değil kendi sunucularından bağlanır, bu yüzden siteye herkese açık HTTPS üzerinden ulaşılabilmelidir. Bir web uygulaması güvenlik duvarı (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 veya 503 yanıtı veren o2switch TigerProtect gibi bir barındırma güvenlik duvarı) bu istekleri engelleyebilir. <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> ve <code>index.php?csmcpforj_oauth=&hellip;</code> (kayıt, belirteç ve iptal uç noktaları) adreslerine yapılan isteklere izin verin. RSFirewall'da şu iki istisna yeterlidir: <code>csmcpforj_oauth</code> ve düzenli ifade olarak <code>api\/index\.php\/v1\/mcp</code>. claude.ai, <code>160.79.104.0/21</code> aralığından bağlanır. <strong>Cloudflare</strong>: Browser Integrity Check ve Security Level uygulamaların sunucularını engelleyebilir. URI yolu <code>/api/index.php/v1/mcp</code> veya <code>/.well-known/oauth-</code> içeren ya da sorgu dizesi <code>csmcpforj_oauth</code> içeren istekler için eylemi <strong>Skip</strong> olan bir WAF özel kuralı ekleyin (Security &rarr; WAF &rarr; Custom rules) ve <em>Browser Integrity Check</em> ile <em>Security Level</em> seçeneklerini işaretleyin. Bot Fight Mode bir kuralla atlanamaz; engelliyorsa kapatın. <strong>Route 66</strong> ve URL'leri yeniden yazan diğer SEO eklentileri oturum açma adreslerini (<code>index.php?csmcpforj_oauth=&hellip;</code>) yakalayıp ana sayfayla yanıt verebilir; bu durumda uygulama kayıt olamaz ve net bir neden belirtmez. <strong>Bağlantıyı denetle</strong> oturum açma uç noktaları için ana sayfayı gösteriyorsa o eklentide <code>csmcpforj_oauth</code> içeren URL'leri hariç tutun veya sistem eklentisini kapatın. Giriş sayfasının kendisi sizin tarayıcınızda açılır."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="Kontrol Paneli, yapay zekâ uygulamalarının bu web sitesinin giriş sayfasını bulamadığını söylüyor (Hazır değil)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="Yapay zekâ istemcileri oturum açma bilgilerini alan adınızdaki <code>/.well-known/oauth-authorization-server</code> adresinde arar. Joomla orada yalnızca Genel Yapılandırma &rarr; <strong>URL Yeniden Yazmayı Kullan</strong> açıkken ve sitenin <code>.htaccess</code> dosyası yerindeyken (<code>htaccess.txt</code> dosyasını yeniden adlandırın) ya da nginx bilinmeyen yolları <code>index.php</code>'ye gönderiyorken yanıt verir. Bu, <code>/.well-known/acme-challenge/</code> kullanan cPanel AutoSSL'i etkilemez. Bir alt klasöre kurulmuş bir site (örneğin <code>example.com/joomla</code>) ayrıca alan adı kökünde <code>/.well-known/oauth-authorization-server/joomla</code> adresini alt klasöre gönderen bir kurala ihtiyaç duyar."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Bir sunucudan veya tarayıcısı olmayan bir makineden oturum açmak"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Masaüstü istemcileri (Claude Code, Codex, Cursor, Gemini CLI) aynı makinede bir tarayıcı açar ve yanıtı yerel bir adreste bekler; bu yüzden OAuth ile oturum açma o makinede bir tarayıcı gerektirir. Arayüzsüz bir sunucuda veya SSH üzerinden bunun yerine Gelişmiş kurulum altındaki API anahtarı yöntemini kullanın; her yerde çalışır."
