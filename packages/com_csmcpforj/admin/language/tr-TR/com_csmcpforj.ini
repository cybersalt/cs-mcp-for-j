COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="claude.ai kontrol listesi: &ldquo;cannot register&rdquo;, &ldquo;Authorization failed&rdquo; veya &ldquo;Couldn't reach the MCP server&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Bunları sırayla gözden geçirin. Her biri birilerine saatlere mal oldu."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Tam olarak bu adresi kullanın: <code>%s</code>. <em>www</em> olup olmaması sitenin yanıt verdiği biçimle eşleşmeli ve arada <strong>yönlendirme olmamalıdır</strong> (www'den çıplak alan adına veya http'den https'e). Kontrol Paneli'ndeki <strong>Bağlantıyı denetle</strong> düğmesi bir yönlendirmeyi bildirir."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="Bu sitede OAuth ile oturum açma açık. claude.ai yalnızca oturum açarak bağlanabilir, bu yüzden bunun açık kalması gerekir."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>Bu sitede OAuth ile oturum açma kapalı.</strong> claude.ai yalnızca oturum açarak bağlanabilir, bu yüzden önce bir Super User'ın bunu açması gerekir: Bileşenler &rarr; MCP for J &rarr; Seçenekler &rarr; <strong>OAuth ile oturum açma</strong>. Kapalıyken claude.ai &ldquo;cannot register&rdquo; der."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="<strong>Add custom connector</strong> iletişim kutusunda <strong>Sign in now</strong>'ı seçin. OAuth istemcisi için <strong>Use Claude's published identity</strong> ve <strong>Register automatically</strong> seçeneklerinin ikisi de çalışır (yayımlanmış kimlik, sunucuda PHP'nin curl eklentisini gerektirir). İstemci kimliğini ve gizli anahtarı boş bırakın. Bir yol başarısız olursa bağlayıcıyı kaldırın ve diğeriyle yeniden ekleyin."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>İstek başlığı eklemeyin.</strong> claude.ai bir <code>X-Joomla-Token</code> başlığını kabul etmez, bu yüzden orada API anahtarı kullanılamaz. claude.ai'den girmenin tek yolu oturum açmaktır."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Güvenlik duvarları claude.ai'nin sunucularını geçirmelidir. Bunlar tarayıcınızdan değil, <code>160.79.104.0/21</code> aralığından bağlanır. RSFirewall'da iki istisna gerekir: <code>csmcpforj_oauth</code> ve düzenli ifade olarak <code>api\/index\.php\/v1\/mcp</code>. Admin Tools, Securitycheck ve o2switch TigerProtect (503 yanıtı verir) gibi barındırma güvenlik duvarları da onu engelleyebilir. <strong>Cloudflare</strong>: Browser Integrity Check ve Security Level uygulamaların sunucularını engelleyebilir. URI yolu <code>/api/index.php/v1/mcp</code> veya <code>/.well-known/oauth-</code> içeren ya da sorgu dizesi <code>csmcpforj_oauth</code> içeren istekler için eylemi <strong>Skip</strong> olan bir WAF özel kuralı ekleyin (Security &rarr; WAF &rarr; Custom rules) ve <em>Browser Integrity Check</em> ile <em>Security Level</em> seçeneklerini işaretleyin. Bot Fight Mode bir kuralla atlanamaz; engelliyorsa kapatın. Kontrol Paneli'ndeki <strong>Bağlantıyı denetle</strong> düğmesi neyin yanıt verdiğini gösterir."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> ve URL'leri yeniden yazan diğer SEO eklentileri oturum açma adreslerini (<code>index.php?csmcpforj_oauth=&hellip;</code>) yakalayıp ana sayfayla yanıt verebilir; bu durumda uygulama kayıt olamaz ve net bir neden belirtmez. <strong>Bağlantıyı denetle</strong> oturum açma uç noktaları için ana sayfayı gösteriyorsa o eklentide <code>csmcpforj_oauth</code> içeren URL'leri hariç tutun veya sistem eklentisini kapatın."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="MCP kullanmasına izin verilen bir hesapla oturum açın (Kontrol Paneli'ndeki <em>Bu uç noktayı kim kullanabilir?</em> bölümüne bakın). Yalnızca bir kişi için başarısız oluyorsa hesabının engellenmediğini ve <em>Şifre Sıfırlama Gerektir</em> olarak ayarlanmadığını kontrol edin."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="Hâlâ takıldınız mı? Bileşenler &rarr; MCP for J &rarr; <strong>Günlükler</strong>, oturum açmanın her adımını ve bir adımın neden reddedildiğini gösterir."
