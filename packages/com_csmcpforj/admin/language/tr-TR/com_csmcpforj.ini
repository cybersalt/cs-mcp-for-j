COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="Kurulum Kılavuzu"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="Kurulum Kılavuzu"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for J — Kurulum Kılavuzu"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Bu Joomla sitesine bir yapay zekâ bağlayın"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for J; Codex, Claude, ChatGPT veya Cursor gibi bir yapay zekâ asistanını Joomla sitenize bağlamayı kolaylaştırmak için tasarlandı &mdash; böylece yapay zekâ yazılarınızı okuyabilir, kullanıcıları yönetebilir, içerik yayımlayabilir ve daha fazlasını yapabilir; hepsi yapay zekânın normal sohbet arayüzü üzerinden. Teknik bilgiye ihtiyacınız yok. Aşağıdaki kolay yöntem çoğu kişi için işe yarar; gerekirse gelişmiş seçenekler için aşağı kaydırın."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ Kolay yol"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Yapılandırma dosyası yok. Başlık yok. Teknik terim yok. Kontrol Paneli'nden hazır bir kurulum komutunu kopyalayın ve yapay zekânızla yeni bir sohbete yapıştırın. Gerisini yapay zekâ halleder &mdash; bağlantıyı test eder ve destekleyen istemcilerde bağlantıyı sizin için kalıcı olarak kaydetmeyi önerir."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>API anahtarınızı alın</strong> (yapay zekânızın bu sitede işlem yapmasını sağlayan kişisel bir parola). Henüz yoksa talimatlar aşağıda."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Kontrol Paneli'ne gidin</strong> (aşağıdaki düğme) ve API anahtarınızı oradaki alana yapıştırın."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="Kontrol Paneli'ndeki <strong>&ldquo;Kurulum Komutunu Kopyala&rdquo; düğmesine tıklayın</strong>. Anahtarınız kopyalanmadan önce komuta otomatik olarak eklenir."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="Yapay zekânızla (Claude, ChatGPT, Cursor, Copilot, Gemini vb.) <strong>yeni bir sohbete yapıştırın</strong> ve gönderin. Yapay zekâ bağlantının çalıştığını onaylar ve kaydetmeyi önerir."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Kontrol Paneli'ne git"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="Hepsi bu. Yapay zekânız bağlandı. Parçaların nasıl bir araya geldiğini daha ayrıntılı öğrenmek istiyorsanız ya da yapay zekânızı elle yapılandırmayı tercih ediyorsanız aşağıda okumaya devam edin &mdash; ama zorunda değilsiniz."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="API anahtarınızı alın"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="<strong>API anahtarı</strong>, yapay zekânızın bu Joomla sitesinde SİZİN olarak işlem yapmasını sağlayan kişisel bir paroladır. Anahtara sahip olan herkes Joomla kullanıcı hesabınızın yapabildiği her şeyi yapabilir &mdash; bu yüzden onu gizli tutun. Nasıl oluşturacağınız aşağıda:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sJoomla kullanıcı profilinizi açmak için buraya tıklayın%s. Yeni bir sekmede açılır. Orada <strong>Joomla API Belirteç</strong> adlı sekmeyi bulun."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="O sekmede <strong>Sıfırla</strong> düğmesine tıklayın. Joomla uzun bir harf ve rakam dizisi oluşturur ve düğmenin altındaki alana yerleştirir. Bu sizin anahtarınızdır."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Anahtarı göstermek için alanın yanındaki küçük <strong>göz simgesine</strong> tıklayın, ardından dizinin tamamını kopyalayın."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Bu sayfada aşağıdaki alana yapıştırın (yalnızca tarayıcınıza kaydedilir, böylece bu sayfadaki kopyalama düğmeleri onu otomatik doldurabilir) VEYA kolay kurulum için Kontrol Paneli'ne gidiyorsanız doğrudan oradaki API anahtarı alanına yapıştırın."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Bu anahtara bir parola gibi davranın."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Paylaşılan belgelere, ekran görüntülerine veya yayımlayacağınız koda yapıştırmayın. Bir gün sızarsa Joomla API Belirteç sekmesine dönün ve yeniden Sıfırla'ya tıklayın &mdash; eski anahtar anında geçersiz olur."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="API anahtarınızı buraya yapıştırın (bu sayfada tek tıkla kopyalama için)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Anahtarınız yalnızca bu tarayıcıda hatırlanır</strong> &mdash; bilgisayarınızdan asla çıkmaz. Unutmak için çöp kutusu düğmesini kullanın. Boş bırakırsanız bu sayfadaki kopyalama düğmeleri yine çalışır, ancak anahtarınızı kopyalanan parçaya elle yapıştırmanız gerekir."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Anahtarı göster/gizle"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Kayıtlı anahtarı unut"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Gelişmiş: bir yapay zekâyı elle bağlayın (çoğu kişinin buna ihtiyacı yoktur)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Bu bölüm, yapay zekâ istemcilerinin bu siteye bağlantısını elle yapılandırmak isteyenler içindir &mdash; genellikle &ldquo;yapılandırma dosyası&rdquo; denen küçük bir metin dosyasını düzenleyerek. Yukarıdaki Kolay Kurulum sizin için işe yaradıysa bu bölümün tamamını gönül rahatlığıyla atlayabilirsiniz. Kurulum komutunu atlayıp bağlantıyı doğrudan yapay zekâ istemcinize kaydetmek istiyorsanız okumaya devam edin."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="Bu sitenin bağlantı URL'si"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="Yapay zekâ istemcinizin ihtiyaç duyduğu adres budur. Bunu API anahtarınızla birlikte istemcinin kurulumuna yapıştıracaksınız."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Yapay zekâ istemcinizi seçin"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="Bağlantı URL'si ve API anahtarı her yapay zekâ için aynıdır &mdash; yalnızca <em>nereye yapıştırdığınız</em> istemciye göre değişir. Özel talimatlar için aşağıdan istemcinizi seçin."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, IDE eklentisi veya masaüstü uygulaması)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex bu uç noktayı yerel olarak bir Streamable HTTP MCP sunucusu şeklinde destekler. Önce Joomla API anahtarını siteye özgü bir ortam değişkenine kaydedin, sonra uç noktayı ortam değişkeninin adıyla kaydedin. Anahtar asla <code>config.toml</code> dosyasına yazılmaz. Yukarıya bir anahtar yapıştırdıktan sonra kopyalama düğmesini kullanırsanız kopyalanan ortam komutu o anahtarı içerir; bu yüzden onu paylaşılan terminallerden, kayıtlardan ve destek taleplerinden uzak tutun."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; anahtarı gelecekteki Codex işlemleri için kaydedin"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Kalıcı bir Windows ortam değişkeni ayarladıktan sonra yeni bir terminal açın. Çalışmakta olan Codex ve terminal işlemleri onu göremez."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; anahtarı bu terminal için ayarlayın (gerekirse güvenli kabuk ortamınızda kalıcı hâle getirin)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Bu Joomla sitesini Codex'e kaydedin"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="<code>codex mcp list</code> komutunu çalıştırın, Codex'i yeniden başlatın (veya MCP durum arayüzüne bakın), ardından zararsız, salt okunur <code>get_joomla_version</code> aracını çağırın. Bu; başlatmayı, kimlik doğrulamayı, araç keşfini ve çağırmayı doğrular. Salt okunur bir bağlantı için MCP for J'nin sunucu tarafı salt okunur modunu da açın; istemci onay ayarları sunucu izinlerini geçersiz kılamaz."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="cPanel veya PHP-FPM'de geçersiz belirteç mi?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Web sunucusu standart Authorization başlığını siliyor olabilir. <code>~/.codex/config.toml</code> içinde yukarıda oluşturulan girdiyi bu blokla değiştirin; böylece Codex aynı ortam değişkenini okur ve onu <code>X-Joomla-Token</code> olarak gönderir. Ardından Codex'i yeniden başlatın."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Dikkat &mdash; Claude'un &ldquo;Add custom connector&rdquo; iletişim kutusu OAuth gerektirir ve bu sitede OAuth kapalı."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Claude Desktop'ın ve claude.ai'nin yerleşik &ldquo;Add custom connector&rdquo; iletişim kutusu oturum açarak (OAuth) bağlanır ve API anahtarı için bir alanı yoktur. Bir Super User, MCP for J Seçenekleri'nde OAuth ile oturum açmayı açabilir; o zaman bu iletişim kutusu çalışır. O zamana kadar aşağıdaki Claude Desktop talimatları bunun yerine yapılandırma dosyası düzenlemesini kullanır. (Ya da yukarıdaki Kolay Kurulum'u kullanın &mdash; Claude ile de çalışır.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Dört adım: bağlantı komutunu tutan, &ldquo;sarmalayıcı betik&rdquo; denen küçük bir yardımcı dosya oluşturun, ardından Claude Desktop'ın yapılandırma dosyasını ona yönlendirin, sonra Claude Desktop'ı yeniden başlatın."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Neden bağlantıyı doğrudan Claude Desktop'ın yapılandırmasına yazmak yerine bir sarmalayıcı betik? Claude Desktop 1.30096+ (Ağustos 2026), komut argümanları kimlik bilgisi içeriyormuş gibi görünen yapılandırma girdilerini reddeder &mdash; iyi niyetli bir güvenlik özelliği ama ne yazık ki doğrudan yöntemi engelliyor. Komutu küçük bir yardımcı dosyaya taşımak bunu aşar (Claude Desktop görünür argümanı olmayan düz bir komut görür) ve API anahtarınızı önceki kadar güvende tutar &mdash; yardımcı dosya, Claude Desktop'ın kendi yapılandırmasıyla birlikte sizin kullanıcı klasörünüzde durur."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Tek seferlik ön koşul &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Bu talimatlar bilgisayarınızda Node.js'in kurulu olduğunu varsayar (<code>npx</code> adlı bir komutla birlikte gelir). Çoğu geliştirici ortamında zaten vardır; yoksa <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> adresinden LTS kurucusuyla kurun. Aşağıdaki sarmalayıcı dosya, Node.js'in standart Windows kurulum yolunda, <code>C:\Program Files\nodejs\</code> konumunda olduğunu varsayar. Başka bir yere kurduysanız kopyaladıktan sonra sarmalayıcı dosyadaki bu yolu düzenleyin."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="1. Adım &mdash; sarmalayıcı betiği oluşturun"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Şimdilik yalnızca Windows (Mac/Linux kullanıcıları SSS'ye bakın). Aşağıdaki bloğu yeni bir düz metin dosyasına kopyalayın. Onu kullanıcı klasörünüzün içine (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) <code>claude-mcp-joomla-{sitename}.cmd</code> dosya adıyla kaydedin; burada <code>{sitename}</code> kısmını siteniz için kısa bir etiketle değiştirin (ör. <code>cybersaltorg</code>). <code>.cmd</code> uzantısının dosya adının bir parçası değil, gerçekten uzantı olduğundan emin olun &mdash; Not Defteri'nde &ldquo;Kayıt türü: Tüm Dosyalar&rdquo; seçeneğini seçin ki <code>.txt</code> eklemesin. API anahtarınızı bu sayfanın üstündeki alana yapıştırdıysanız kopyalama düğmesi onu sizin için yerleştirir."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Windows kullanıcı adınızdan emin değil misiniz? Dosya Gezgini'ni açın, <code>C:\Users\</code> konumuna gidin ve klasör adlarına bakın &mdash; biri sizindir."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="2. Adım &mdash; Claude Desktop'ın yapılandırma dosyasını açın"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Claude Desktop'ın ayar dosyası her işletim sisteminde belirli bir yoldadır. Herhangi bir metin düzenleyiciyle açın (VS Code, Not Defteri, TextEdit, Sublime, elinizde ne varsa):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop'ta Settings &rarr; Developer altında dosyayı sizin için açması gereken bir <strong>Edit Config</strong> düğmesi vardır. Tıkladığınızda hiçbir şey olmuyorsa bunun nedeni bilgisayarınızın <code>.json</code> dosyalarını hangi programla açacağını bilmemesidir. Sorun değil &mdash; yukarıdaki yollardan birini kullanarak dosyayı bir metin düzenleyiciyle kendiniz açın. Dosya henüz yoksa oluşturun ve aşağıdaki bloğu dosyanın tüm içeriği olarak kullanın (<code>{&quot;mcpServers&quot;: { ... }}</code> içine sarılmış hâlde)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="3. Adım &mdash; bu bloğu Claude Desktop'ın yapılandırmasına ekleyin"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Bunu <code>claude_desktop_config.json</code> dosyasına yapıştırın. Dosyada içinde başka sunucular olan bir <code>mcpServers</code> nesnesi zaten varsa <code>joomla-...</code> girdisini onların yanına ekleyin (ikinci bir <code>mcpServers</code> nesnesi yapıştırmayın). Dosya boşsa veya yoksa aşağıdaki bloğun tamamını içerik olarak kullanın. <strong>Önemli:</strong> <code>YOUR_WINDOWS_USERNAME</code> kısmını gerçek Windows kullanıcı adınızla değiştirin."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Bu yapılandırma yalnızca Claude Desktop'ı 1. Adımda oluşturduğunuz sarmalayıcı betiğe yönlendirir. API anahtarınız Claude Desktop'ın yapılandırmasında değil, sarmalayıcı dosyada kalır."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="4. Adım &mdash; Claude Desktop'tan tamamen çıkın ve yeniden açın"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop yapılandırma dosyasını yalnızca başlarken okur. Tamamen kapatın &mdash; Windows'ta sistem tepsisindeki Claude simgesine sağ tıklayın (sağ altta, küçük yukarı oka tıklamanız gerekebilir) ve Quit'i seçin. Birkaç saniye bekleyin, sonra yeniden başlatın. Herhangi bir sohbette araçlar simgesine tıklayın (veya &ldquo;hangi araçların var?&rdquo; diye sorun) &mdash; sitenin araçları listelenmelidir. Listelenmiyorsa aşağıdaki Sorun Giderme bölümüne bakın."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (terminal veya VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Claude Code kullanıyorsanız tek bir terminal komutu bağlantıyı kurar &mdash; yapılandırma dosyası düzenlemeye gerek yok. Aşağıdaki kopyalama düğmesinin onu doldurması için API anahtarınızı yukarıdaki alana yapıştırın, ardından komutu bir terminale yapıştırıp Enter'a basın. Claude Code bağlantıyı hemen onaylar ve yeniden yükler."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (web sürümü)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="claude.ai'nin <strong>Add custom connector</strong> iletişim kutusu oturum açarak (OAuth) bağlanır ve bu sitede bu kapalı. Bir Super User bunu MCP for J Seçenekleri'nde açabilir; o zaman claude.ai kalıcı bir bağlantı kurar. O zamana kadar yukarıdaki Kolay Kurulum (komut yapıştırma yöntemi) yalnızca geçerli sohbet için çalışır."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor MCP bağlantılarını <code>mcp.json</code> adlı bir yapılandırma dosyasında saklar. Bir metin düzenleyiciyle açın, aşağıdaki bloğu <code>mcpServers</code> nesnesinin içine yapıştırın ve kaydedin. Cursor çoğu durumda yeniden başlatmadan değişikliği algılar."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Yapılandırma dosyasının yeri: <code>~/.cursor/mcp.json</code> (tüm projeleriniz için) veya belirli bir proje klasöründe <code>.cursor/mcp.json</code> (yalnızca o proje için)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="ChatGPT özel MCP sunucuları"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="ChatGPT'nin <strong>Add custom MCP server</strong> iletişim kutusu yalnızca oturum açarak (OAuth) veya kimlik doğrulamasız bağlanabilir; API anahtarı ya da başlık için bir alanı yoktur. Bu sitede OAuth ile oturum açma kapalı, bu yüzden ChatGPT henüz bağlanamaz. Bir Super User bunu MCP for J Seçenekleri'nde açabilir. O zamana kadar API anahtarını bir ortam değişkeninden gönderen Codex'i (OpenAI'nin kodlama ajanı) kullanın."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Özel bir MCP sunucusu eklemek ücretli bir ChatGPT planı gerektirir. Plus'ta çalışır (Ekim 2026'da kontrol edildi)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI ve Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Hem Gemini CLI (Google'ın terminal yapay zekâ asistanı) hem de Gemini Code Assist eklentisi (VS Code / JetBrains için) aynı MCP yapılandırma dosyasını okur. İki adım: bu Joomla sitesini MCP sunucusu olarak eklemek için o dosyayı düzenleyin, sonra Gemini'yi yeniden başlatın."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Sunucuyu genel olarak (her Gemini oturumu görsün diye) veya yalnızca tek bir proje klasöründe ekleyebilirsiniz. Parça aynıdır &mdash; yalnızca dosyanın yeri değişir."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Gemini ayar dosyanızı açın (veya oluşturun)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Bu iki konumdan birini seçin:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Genel (tüm projeler):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Yalnızca proje:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (bir proje klasöründe)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Bu bloğu dosyanın içine yapıştırın."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Dosyada zaten bir <code>mcpServers</code> bölümü varsa <code>&quot;joomla-...&quot;</code> girdisini mevcut bölümün içine ekleyin &mdash; dıştaki <code>mcpServers</code> anahtarını yinelemeyin. Dosya boşsa veya yepyeniyse parçanın tamamını olduğu gibi yapıştırın."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini, HTTP tabanlı MCP sunucuları (bunun gibi) için <code>httpUrl</code> kullanır &mdash; bu, Cursor'un <code>url</code> anahtarından farklıdır. Cursor'unkini yeniden kullanmak yerine bu parçayı aynen kopyalayın."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Gemini'yi yeniden başlatın."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Terminalde <code>gemini</code> uygulamasından çıkıp yeniden başlatın veya VS Code / JetBrains penceresini yeniden yükleyin. Bağlı sunucuları görmek ve Joomla sitenizin listede olduğunu doğrulamak için Gemini CLI'da <code>/mcp</code> yazın."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="<code>gemini.google.com</code> web uygulaması Ağustos 2026 itibarıyla özel MCP sunucularını desteklemiyor &mdash; bu kılavuz yalnızca Gemini CLI ve Gemini Code Assist'i kapsar. Google ileride web arayüzüne destek eklerse burada belgeleyeceğiz."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="MCP destekleyen diğer yapay zekâ istemcileri (Cline, Continue, agent modunda GitHub Copilot, Windsurf, mcp-cli vb.) de çalışır &mdash; bağlantı URL'si ve API anahtarı aynıdır, yalnızca onları yapıştırdığınız yer değişir. Zamanla daha fazla istemci için özel kılavuzlar ekleyeceğiz; takılırsanız aşağıdaki SSS genel yönlendirme içerir."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Kopyala"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Kopyalandı"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Kopyalandı (anahtarınızla birlikte)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Güvenlik &amp; paylaşım"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="API anahtarınız oturum açmanın TA KENDİSİDİR &mdash; ona sahip olan, Joomla kullanıcı hesabınızın yapabildiği her şeyi yapabilir. Anonim erişim yoktur. <strong>OAuth ile oturum açmayı</strong> açarsanız bir yapay zekâ uygulaması sizi bu sitenin normal giriş sayfasına göndererek de bağlanabilir; ardından siz Kontrol Paneli'nden bağlantısını kesene kadar, oturum açan hesap olarak ve tam o hesabın izinleriyle işlem yapar."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Başkalarına MCP erişimi vermek"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Bunu yapmanın iki yolu var &mdash; hangisi uygunsa onu seçin:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Kişi başına bir anahtar (en güvenli)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Her kişi için bir Joomla kullanıcısı oluşturun, onları yalnızca sahip olmalarını istediğiniz izinlere sahip bir gruba koyun (ör. salt okunur), o kullanıcı için bir anahtar oluşturun ve ona özel olarak gönderin. Her kişinin kendi denetim kaydı olur; diğerlerini etkilemeden herhangi bir anahtarı tek başına iptal edebilirsiniz."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Tek bir ortak anahtar (en basit ama en az güvenli)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Salt okunur bir grupta sınırlı bir kullanıcı oluşturun (ör. <code>mcp-demo-guest</code>), tek bir anahtar oluşturun ve daha geniş çapta paylaşın. Dağıtması daha basit; ama kimin kullandığını bilmek veya yalnızca bir kişinin erişimini iptal etmek daha zor. Herkese açık bir demo için uygundur; hassas erişim için uygun değildir."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Bir anahtarı iptal etmek"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="Mevcut bir anahtarın hemen çalışmayı bırakması için Kullanıcılar &rarr; ilgili kullanıcı &rarr; Joomla API Belirteç sekmesi &rarr; <strong>Sıfırla</strong> düğmesine tıklayın. Tıkladığınız anda eski anahtar geçersiz olur. Yeni anahtarı o kişiye verin ya da erişimsiz bırakın."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Sorun giderme"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Bağladığınız uygulamanın türünü bulun, ardından gördüğünüz duruma uyan sorunu açın. Hata mesajları ve güvenlik duvarı engellemeleri her uygulamada çıkabildiği için sonda kendi grupları vardır."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; veya &ldquo;Authentication failed&rdquo; (hata 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="Yapay zekânız siteye ulaşıyor ama API anahtarı doğru değil. Kontrol edin: (1) kopyaladığınızdan beri anahtar sıfırlanmadı (her Sıfırla önceki anahtarı geçersiz kılar); (2) anahtar eksik karakter veya fazladan boşluk olmadan bütün olarak kopyalandı; (3) bir yapılandırma dosyası düzenlediyseniz anahtarın önünde <code>Bearer </code> sözcüğü (arkasında bir boşlukla) var. Emin değilseniz yeni bir anahtar oluşturup yeniden deneyin."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; veya &ldquo;Could not match accept header&rdquo; (hata 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="MCP for J'nin eski sürümlerinde (2.3.4 öncesi) bazı yapay zekâ istemcilerinin bağlanmasını engelleyen bir hata vardı. MCP for J'yi en son sürüme güncelleyin &mdash; Joomla yönetim panelinizde Sistem &rarr; Güncelle &rarr; Eklentiler bölümüne bakın."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;Bağlandı ama yapay zekâda hiç araç görünmüyor&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Genellikle şu üç şeyden biridir: (1) kullanıcının grubunda <strong>Web Servisleri Girişi</strong> izni yok &mdash; Sistem &rarr; Genel Yapılandırma &rarr; İzinler bölümünden ayarlayın (varsayılan olarak yalnızca Super User'larda vardır); (2) grubun MCP izni yok &mdash; Super User'larda her zaman, Administrator'larda Joomla'nın varsayılanları sayesinde vardır, ancak Manager ve diğer grupların bu bileşenin Seçenekler &rarr; İzinler bölümünde MCP uç noktasını kullan (değişiklikler için ayrıca MCP uç noktası üzerinden yaz) iznine ihtiyacı vardır; (3) yapay zekâ istemcisi boş bir araç listesini önbelleğe aldı &mdash; yeniden denetlemesini sağlamak için istemcide MCP sunucusunun bağlantısını kesip yeniden bağlayın."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; veya URL bir hata döndürüyor (hata 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Ya URL yanlış (tekrar kontrol edin &mdash; <code>/api/index.php/v1/mcp</code> ile bitmelidir) YA DA Joomla sitenizin MCP için Web Servisleri eklentisi devre dışı. Joomla yönetim panelinde: Sistem &rarr; Yönet &rarr; Eklentiler &rarr; <code>csmcpforj</code> arayın &rarr; Web Servisleri eklentisinin etkin olduğundan emin olun. Zaten etkinse sitenizin <code>.htaccess</code> dosyası <code>/api/</code> yolunu engelliyor olabilir &mdash; bu bir barındırma sağlayıcısı veya güvenlik eklentisi sorunudur."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; veya &ldquo;Malware detected&rdquo; (hata 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Joomla sitenizdeki bir güvenlik eklentisi (RSFirewall, Admin Tools Pro, Securitycheck Pro) MCP isteğini engelliyor. RSFirewall'da iki istisna ekleyin: <code>csmcpforj_oauth</code> ve düzenli ifade olarak <code>api\/index\.php\/v1\/mcp</code> (ilki oturum açma içindir). Diğerlerinde <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> adreslerine ve <code>csmcpforj_oauth</code> içeren URL'lere izin verin. Nedeni doğrulamak için güvenlik eklentisini kısa bir süreliğine kapatın, yeniden deneyin, sonra istisnalar yerindeyken tekrar açın. Kontrol Paneli'ndeki <strong>Bağlantıyı denetle</strong> düğmesi hangi adresin engellendiğini gösterir."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Claude Desktop'ın &ldquo;Edit Config&rdquo; düğmesine tıkladığımda hiçbir şey olmuyor"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Bu düğme <code>claude_desktop_config.json</code> dosyasını, bilgisayarınızın <code>.json</code> dosyalarını açtığı programa vermeye çalışır. Bunu ayarlamadıysanız düğme sessizce hiçbir şey yapmaz. Çözüm: dosyayı herhangi bir metin düzenleyiciyle kendiniz açın. İşletim sistemine göre yollar, yukarıdaki Gelişmiş açılır bölümündeki Claude kısmında listelenmiştir. Dosya henüz yoksa oluşturun ve o bölümdeki parçayı dosyanın tüm içeriği olarak kullanın (parçayı <code>{&quot;mcpServers&quot;: { ... }}</code> içine sarın). İzin değişikliği gerekmez &mdash; dosya sizin kullanıcı klasörünüzdedir."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="Claude'un &ldquo;Add custom connector&rdquo; veya ChatGPT'nin &ldquo;Add custom MCP server&rdquo; iletişim kutusunda API anahtarı için bir alan yok"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Bu iletişim kutuları oturum açarak (OAuth) bağlanmak için tasarlanmıştır; bir MCP for J API anahtarını yapıştıracak yer yoktur. Bu sitede OAuth ile oturum açma kapalı. Bir Super User bunu Bileşenler &rarr; MCP for J &rarr; Seçenekler &rarr; <strong>OAuth ile oturum açma</strong> altında açabilir; o zaman iki iletişim kutusu da çalışır. O zamana kadar: Claude Desktop yukarıdaki sarmalayıcı betik yöntemini, claude.ai Kolay Kurulum'u, ChatGPT kullanıcıları da Codex'i kullanabilir."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop başlarken &ldquo;Some MCP servers could not be loaded&rdquo; gösteriyor"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (Ağustos 2026) yapılandırma dosyası doğrulamasını sıkılaştırdı ve artık komut argümanları kimlik bilgisi içerebilecekmiş gibi görünen girdileri reddediyor. Bu, bir bearer belirteçli MCP sunucusunu doğrudan <code>claude_desktop_config.json</code> içinde yapılandırmanın iki bariz yolunu engelliyor: yerel <code>type: http</code> biçimi VE <code>mcp-remote</code>'a bir <code>--header &quot;Authorization: Bearer ...&quot;</code> argümanı vermek. İkisi de yapılandırma dosyasında doğru görünür ama Claude Desktop'ın şema doğrulayıcısı yüklerken onları atar. <strong>Çözüm:</strong> yukarıdaki Gelişmiş bölümünün Claude kısmında anlatılan sarmalayıcı betik yöntemini kullanın &mdash; komutun tamamını küçük bir <code>.cmd</code> dosyasına koyun, sonra Claude Desktop'ın yapılandırmasının yalnızca bu dosyaya başvurmasını sağlayın. Claude Desktop görünür argümanı olmayan düz bir komut görür ve kabul eder. API anahtarınız önceki kadar güvende kalır &mdash; sarmalayıcı dosya sizin kullanıcı klasörünüzdedir."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Claude Desktop'ı yeniden başlattım ama yeni bağlantıyı hâlâ görmüyor"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="Windows'ta Claude Desktop penceresini kapatmak onu yalnızca sistem tepsisine gizler &mdash; uygulamanın tamamı ESKİ yapılandırma bellekte yüklüyken çalışmaya devam eder. Sonradan görev çubuğu simgesine tıklamak pencereyi yalnızca bu zaten çalışan işlemden geri getirir. Claude Desktop yapılandırma dosyasını yalnızca uygulama gerçekten yeniden başlatıldığında tekrar okur. Gerçekten yeniden başlatmak için: sistem tepsisindeki Claude simgesine sağ tıklayın (sağ alt köşe, gizli simgeleri görmek için küçük yukarı oka tıklamanız gerekebilir) &rarr; <strong>Quit</strong>'i seçin &rarr; işlemin tamamen kapanması için ~3 saniye bekleyin &rarr; Claude Desktop'ı Başlat menüsünden yeniden başlatın. Yapılandırma dosyasındaki değişiklikleriniz ancak o zaman geçerli olur."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Sıkça sorulan sorular"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Biri bu bağlantıyı API anahtarı olmadan kullanabilir mi?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="Hayır. Her istek geçerli bir API anahtarı ya da OAuth ile oturum açma açıksa bir OAuth erişim belirteci taşımalıdır. Taşımayan istekler reddedilir. Bu bilinçli bir tasarımdır &mdash; yapay zekâ sitenizde gerçek işlemler yapabilir (yazı oluşturma, kullanıcı düzenleme vb.), bu yüzden anonim erişim bir güvenlik felaketi olurdu."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Bir Joomla kullanıcısının birden fazla etkin API anahtarı olabilir mi?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="Hayır. Joomla her kullanıcı için tam olarak bir API anahtarı saklar. Sıfırla'ya tıklamak yeni bir anahtar oluşturur ve eskisini geçersiz kılar. Birden fazla anahtara ihtiyacınız varsa (cihaz başına bir, yapay zekâ aracı başına bir vb.), ayrı Joomla kullanıcıları oluşturun."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Ne kadar kullanabileceğim konusunda bir sınır var mı?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="MCP for J'nin kendisinde bir hız sınırı yoktur. Normal barındırma sınırları (PHP belleği, MariaDB bağlantıları vb.) geçerlidir. Yoğun trafik oluşturuyorsanız (birçok sitede büyük toplu işlemler), PHP-FPM eşzamanlılığını artırmak için barındırma sağlayıcınızla konuşun."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Güvenlik duvarında port açmam veya özel bir şey yapılandırmam gerekir mi?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="Hayır. MCP yalnızca 443 numaralı porttaki standart HTTPS'i kullanır. Siteniz zaten <code>https://yoursite.com/</code> adresinden herkese açık olarak erişilebiliyorsa MCP uç noktasına internetteki her yapay zekâ istemcisinden ek kurulum olmadan erişilebilir."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="API anahtarımı düzenli aralıklarla nasıl değiştiririm (yenilerim)?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Otomatik bir zamanlayıcı yok &mdash; istediğiniz zaman elle yenilersiniz. Kullanıcılar &rarr; kullanıcı &rarr; Joomla API Belirteç sekmesi &rarr; Sıfırla'ya tıklayın. Ardından yapay zekâ istemcisinin yapılandırmasını yeni anahtarla güncelleyin. İyi bir alışkanlık: bir ekran görüntüsünde, günlükte veya hata raporunda görünmüş her anahtarı yenileyin."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Yukarıda listelenmeyen bir yapay zekâ istemcisi kullanıyorum &mdash; çalışır mı?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="HTTPS üzerinden standart MCP'yi desteklediği ve özel bir Authorization başlığı eklemenize izin verdiği ya da OAuth ile oturum açabildiği sürece (Seçenekler'de OAuth ile oturum açmayı açın) neredeyse kesinlikle evet. URL her yerde aynıdır &mdash; yalnızca istemcideki kurulum arayüzü farklıdır. Çalıştığını bildiğimiz ama adım adım kılavuz yazmadığımız istemciler: Continue.dev, Windsurf, Zed düzenleyici, mcp-cli, MCP Inspector, LibreChat, Open WebUI (<code>mcpo</code> köprüsüyle) ve Ollama tabanlı çeşitli ajanlar."

