; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Güvenlik duvarı ve URL eklentileri"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall açık."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="MCP isteklerini (&ldquo;403 Access Forbidden &mdash; Malware detected&rdquo;) ve claude.ai oturum açmasını engelleyebilir. RSFirewall'da iki istisna ekleyin: <code>csmcpforj_oauth</code> ve düzenli ifade olarak <code>api\/index\.php\/v1\/mcp</code>."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools açık."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="Web Uygulaması Güvenlik Duvarı MCP isteklerini ve oturum açmayı engelleyebilir. <strong>Bağlantıyı denetle</strong> bir engelleme gösteriyorsa kuralı Admin Tools'un Blocked Requests Log'unda bulun ve bir WAF istisnası ekleyin ya da o kuralı kapatın. <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> adreslerine ve <code>csmcpforj_oauth</code> içeren URL'lere izin verin."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck açık."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="Güvenlik duvarı MCP isteklerini ve oturum açmayı engelleyebilir. <strong>Bağlantıyı denetle</strong> bir engelleme gösteriyorsa isteği onun günlüklerinde bulun ve <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> adresleri ile <code>csmcpforj_oauth</code> içeren URL'ler için bir istisna ekleyin."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 açık."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Bu SEO eklentisi oturum açma adreslerini (<code>index.php?csmcpforj_oauth=&hellip;</code>) yakalayıp ana sayfayla yanıt verebilir; bu durumda claude.ai veya ChatGPT kayıt olamaz ve net bir neden belirtmez. <strong>Bağlantıyı denetle</strong> oturum açma uç noktaları için ana sayfayı gösteriyorsa Route 66'da <code>csmcpforj_oauth</code> içeren URL'leri hariç tutun veya sistem eklentisini kapatın."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Barındırıcının çalıştırdığı güvenlik duvarları da engelleyebilir: o2switch TigerProtect 503 yanıtı verir; Imunify360, ModSecurity veya Cloudflare kuralları ise 403 yanıtı verir. Barındırıcıdan yukarıdaki adreslere izin vermesini veya claude.ai için Anthropic'in sunucularını (<code>160.79.104.0/21</code>) geçirmesini isteyin. <strong>Cloudflare</strong>: Browser Integrity Check ve Security Level uygulamaların sunucularını engelleyebilir. URI yolu <code>/api/index.php/v1/mcp</code> veya <code>/.well-known/oauth-</code> içeren ya da sorgu dizesi <code>csmcpforj_oauth</code> içeren istekler için eylemi <strong>Skip</strong> olan bir WAF özel kuralı ekleyin (Security &rarr; WAF &rarr; Custom rules) ve <em>Browser Integrity Check</em> ile <em>Security Level</em> seçeneklerini işaretleyin. Bot Fight Mode bir kuralla atlanamaz; engelliyorsa kapatın."

