; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Bu uç noktayı kim kullanabilir?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="İzinler, API belirtecinin sahibi olan Joomla kullanıcı hesabına göre denetlenir. MCP istemcisi (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl veya başka herhangi biri) yalnızca bir aktarıcıdır &mdash; aynı belirteç her istemcide aynı şekilde davranır."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Önemli:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Belirteci oluşturan kişi, MCP uç noktası üzerinden Joomla yönetim panelinin başka her yerinde sahip olduğu erişimin aynısını alır. Belirteçleri yalnızca bu işlemleri doğrudan yapmasına güveneceğiniz kullanıcılar için oluşturun."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Joomla kullanıcı grubu"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Doğrudan çalışır mı?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Neden"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Evet"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Açık izin gerekir"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Super User'lar Joomla'da her izin denetiminden her zaman geçer."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Joomla'nın varsayılan izinleri sayesinde core.manage iznine sahiptir; MCP denetimi bunu okuma ve yazma araçları için kabul eder (izinleri, eklentileri, eklenti ayarlarını veya Joomla'nın kendisini değiştiren araçlar yine de Super User gerektirir) &mdash; ancak Joomla'nın kimlik doğrulamaya izin vermesi için grubun yine de <strong>Web Servisleri Girişi</strong> iznine ihtiyacı vardır."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="Varsayılan olarak hiçbir MCP izni yoktur. Gruba Sistem &rarr; Genel Yapılandırma &rarr; İzinler bölümünde <strong>Web Servisleri Girişi</strong> izni verin, ardından bu bileşenin <strong>Seçenekler &rarr; İzinler</strong> bölümünde MCP uç noktasını kullan ve (isteğe bağlı olarak) MCP uç noktası üzerinden yaz izinlerini verin."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Web Servisleri Girişi gerekir"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Bunlardan herhangi biri geçerli olmadan önce:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla tüm API'yi <strong>Web Servisleri Girişi</strong> (<code>core.login.api</code>) adlı ayrı bir izinle korur ve <strong>varsayılan olarak bu izin yalnızca Super User'larda vardır</strong>. Diğer tüm gruplar &mdash; Administrator ve Manager dahil &mdash; yönetim panelinde başka neler yapabilirlerse yapsınlar, bu izin verilene kadar her araçtan <code>403 Forbidden</code> alır. Bunu bu bileşende değil, grup üzerinde <strong>Sistem &rarr; Genel Yapılandırma &rarr; İzinler</strong> bölümünde ayarlayın."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / özel grup"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Gruba Sistem &rarr; Genel Yapılandırma &rarr; İzinler bölümünde <strong>Web Servisleri Girişi</strong> izni verin, ardından bu bileşenin <strong>Seçenekler &rarr; İzinler</strong> bölümünde MCP uç noktasını kullan ve (isteğe bağlı olarak) MCP uç noktası üzerinden yaz izinlerini verin."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Bir yapay zekâ asistanını bu siteye bağlayın"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Bunu yapmanın iki yolu var. İlki (kopyala-yapıştır komutu) en kolayıdır &mdash; hiçbir istemci yapılandırması gerektirmez ve yapay zekânız çalıştığını onayladıktan sonra genellikle bu siteyi sizin için kalıcı bir bağlayıcı olarak kurmayı önerir; JSON'u elle düzenlemeniz gerekmez. İkincisi, istemci yapılandırmasını doğrudan düzenlemeyi tercih eden kullanıcılar içindir."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Kurulum komutunu kopyala (önerilen)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Yapay zekâ asistanınıza bir kurulum komutu yapıştırın"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Hiçbir istemci yapılandırması gerekmez. Aşağıdaki komutu yapay zekâ asistanınızla (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini vb.) yeni bir sohbete kopyalayın. Yapay zekâ bir curl testi çalıştırır, bağlantıyı onaylar ve &mdash; destekleyen istemcilerde &mdash; bağlantıyı sizin için kalıcı hâle getirmeyi önerir; düzenlenecek JSON dosyası ya da hatırlanacak terminal komutu yoktur."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Bonus:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Yapay zekâ istemcinizde bir kabuk aracı varsa (Codex, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot agent modu vb.), komut kendi kendine kurulum önerisi içerir. Yapay zekâ bağlantının çalıştığını onayladıktan sonra &lsquo;make it permanent&rsquo; (kalıcı yap) demeniz yeterlidir; MCP sunucusunu kaydetmek için istemciye uygun komutu çalıştırır (örneğin <code>codex mcp add</code> veya <code>claude mcp add</code>). İstemci yeniden başlatıldıktan sonra bu site her sohbette yerel MCP araçları olarak görünür &mdash; bir daha komuta gerek kalmaz."
; Shared "type here" field pattern - see FieldStyleHelper.
COM_CSMCPFORJ_FIELD_OPTIONAL="İsteğe bağlı"
COM_CSMCPFORJ_FIELD_REQUIRED="Zorunlu"

COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Profilinizde bir Joomla API belirteci oluşturun (bağlantı sağda)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Aşağıdaki &lsquo;Komutu kopyala&rsquo; düğmesine tıklayın."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Yapay zekâ asistanınızla yeni bir sohbete yapıştırın. 2. adımı atladıysanız önce <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> kısmını gerçek belirtecinizle değiştirin."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Gönderin. Yapay zekâ bağlantıyı test eder ve destekleyen istemcilerde bağlantıyı kalıcı hâle getirmeyi önerir."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Bu komut, kabuk/terminal aracı olan her yapay zekâ istemcisinde çalışır: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (agent modu), Gemini CLI, Windsurf, mcp-cli vb. Kabuk erişimi olmayan yalnızca web tabanlı sohbet arayüzlerinde (claude.ai, chatgpt.com, gemini.google.com) çalışmaz &mdash; bunlar için MCP Bağlayıcı sekmesini kullanın."

; Tab 2 — manual MCP connector configuration
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="MCP Bağlayıcı (elle yapılandırma)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="Elle MCP bağlayıcısı olarak ekleyin"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="Claude Desktop (yapılandırma dosyası), Claude Code, Cursor, Codex, Cline, Copilot, Gemini CLI veya yapılandırmayı doğrudan düzenlemeyi tercih ettiğiniz herhangi bir istemci için. Bir kez kurulur, tüm sohbetlerde kalıcıdır. (claude.ai ve ChatGPT özel bağlayıcıları API anahtarı gönderemez: oturum açarak bağlanırlar. Bu sayfadaki <strong>Oturum açarak bağlan (OAuth)</strong> bölümüne bakın.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="Profilinizde bir Joomla API belirteci oluşturun."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="Aşağıdaki yapılandırma parçasını kopyalayın."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP3="<code>YOUR_JOOMLA_API_TOKEN</code> kısmını oluşturduğunuz belirteçle değiştirin."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Yapay zekâ istemcinizin MCP yapılandırmasına yapıştırın &mdash; Claude Desktop: <code>claude_desktop_config.json</code>; Claude Code: <code>claude mcp add</code>; Cursor: <code>~/.cursor/mcp.json</code>; GitHub Copilot: VS Code / JetBrains içindeki MCP ayarları; Cline / Continue: eklenti ayarları JSON. Kaydettikten sonra istemciyi yeniden başlatın. (claude.ai ve ChatGPT &ldquo;Add custom connector&rdquo; iletişim kutularında bunun için bir alan yoktur; bunlar için OAuth ile oturum açmayı kullanın.)"
