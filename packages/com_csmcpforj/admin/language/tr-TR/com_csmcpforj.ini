; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="MCP sunucusu"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="MCP uç noktası için sunucu tarafı denetimler. MCP istemcilerinin ne görüp neleri çağırabileceğini etkiler."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Salt okunur mod"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="EVET olduğunda MCP uç noktası yalnızca MCP ToolAnnotations içinde salt okunur olarak tanımlanan araçları duyurur ve kabul eder (list_*, get_*, read_*, check_*, validate_*, fetch_* ve joomla_update_healthcheck). Bir yapay zekâ istemcisinin içerikte değişiklik yapma imkânı olmadan siteyi incelemesini istediğinizde kullanışlıdır. Yazma işlemleri, sunucunun salt okunur modda olduğunu açıklayan bir hata döndürür. Bu ayar bir alt sınırdır: MCP istemcisi daha da kısıtlamak için uç nokta URL'sine ?read_only=1 ekleyebilir, ancak bu ayarı EVET olan bir sitede yazma işlemlerinin kilidini AÇAMAZ."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Ekran kaydı gizliliği"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Kontrol panelindeki bulanıklaştırılmış gizli bilgi korumasının denetimleri (komut önizlemesindeki Joomla API belirteci, Pro üyelik e-postası). Bulanıklaştırma varsayılan olarak açıktır; bu seçenekler, ekran paylaşımı veya ekran kaydı sırasında farenin rastgele üzerinden geçmesiyle gizli bilginin yanlışlıkla görünmemesi için üzerine gelince gösterme davranışını ayarlar."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Üzerine gelince gösterme gecikmesi (saniye)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Bulanıklaştırılmış bir gizli bilgi görünmeden önce fare işaretçisini kaç saniye üzerinde tutmanız gerektiği. Üzerinde tuttuğunuz sürece gizli bilginin yanında küçük bir geri sayım etiketi görünür, böylece sayacın çalıştığını bilirsiniz. Fareyi uzaklaştırmak göstermeyi iptal eder ve sayacı sıfırlar &mdash; bir sonraki üzerine gelme tam süreli yeni bir geri sayım başlatır. Üzerine gelince hemen göstermek için 0 yapın (yanlışlıkla fare geçişine karşı korumayı kaldırır ama klasik tek seferde gösterme davranışını geri getirir). Varsayılan 3 saniye."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Gösterdikten sonra otomatik gizle (saniye)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Bir gizli bilgi üzerine gelinerek gösterildikten sonra, fare hâlâ üzerinde olsa bile otomatik olarak yeniden bulanıklaşmadan önce kaç saniye görünür kalacağı. &ldquo;Baktım, okudum, sonra dikkatim dağıldı&rdquo; durumları için ek bir güvenlik önlemi; aksi hâlde başında kimse olmayan bir tarayıcı gizli bilgiyi süresiz olarak açıkta bırakabilir. Bu ayardan bağımsız olarak fareyi uzaklaştırmak her zaman hemen yeniden bulanıklaştırır. Otomatik gizlemeyi kapatmak için 0 yapın (gösterilen gizli bilgiler siz fareyi uzaklaştırana kadar görünür kalır). Varsayılan 8 saniye &mdash; tam bir base64 belirteci rahatça okumaya yetecek kadar uzun, başında kimse olmayan bir oturumun gizli bilgiyi açıkta bırakmayacağı kadar kısa."

