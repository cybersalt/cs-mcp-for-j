COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="Yapay zekâ uygulamalarının bu web sitesinin giriş sayfasını bulup bulamadığı kontrol ediliyor&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>Hazır.</strong> Yapay zekâ uygulamaları bu web sitesinin giriş sayfasını bulabilir."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>Hazır değil.</strong> Yapay zekâ uygulamaları bu web sitesinin giriş sayfasını bulamıyor, bu yüzden bağlanamayacaklar. Düzeltmek için Sistem &rarr; Genel Yapılandırma bölümünde <strong>URL Yeniden Yazmayı Kullan</strong> seçeneğini açın ve sitenin .htaccess dosyasının yerinde olduğundan emin olun. Kurulum Kılavuzu'nun Sorun Giderme bölümünde ayrıntılar var."
