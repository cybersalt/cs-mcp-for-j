COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="Login OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Permite que aplicativos de IA se conectem levando você à página de login deste site, em vez de você copiar uma chave de API para eles. O ChatGPT (&ldquo;Add custom MCP server&rdquo;) e o claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) só conseguem se conectar assim. Conexões com chave de API continuam funcionando de qualquer forma."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="Ativar o login OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Quando ativado, você cola o endereço MCP deste site num aplicativo de IA, o aplicativo abre a página de login deste site, você entra com seu usuário e senha de sempre e clica em Permitir. A partir daí o aplicativo age como você, com exatamente as suas permissões neste site. Os aplicativos conectados aparecem no painel, onde cada um pode ser desconectado. Desativar isto desconecta todos na hora."
