; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Quem pode usar este endpoint?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="As permissões são verificadas na conta de usuário do Joomla dona do token da API. O cliente MCP (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl ou qualquer outro) apenas repassa &mdash; o mesmo token se comporta igual em qualquer cliente."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Importante:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Quem gera o token recebe pelo endpoint MCP o mesmo acesso que tem em qualquer outro lugar da administração do Joomla. Só gere tokens para usuários a quem você confiaria essas ações diretamente."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Grupo de usuários do Joomla"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Funciona de cara?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Por quê"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Sim"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Precisa de permissão explícita"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Super Users sempre passam em qualquer verificação de permissão no Joomla."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Tem core.manage pelas permissões padrão do Joomla, que a verificação do MCP aceita para ferramentas de leitura e gravação (as ferramentas que alteram permissões, extensões, configurações de plugins ou o próprio Joomla ainda exigem um Super User) &mdash; mas o grupo ainda precisa de <strong>Autenticação nos Serviços Web</strong> antes que o Joomla deixe ele sequer se autenticar."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="Não tem permissão MCP por padrão. Dê ao grupo <strong>Autenticação nos Serviços Web</strong> em Sistema &rarr; Configurações globais &rarr; Permissões, e depois Usar o endpoint MCP e (opcionalmente) Gravar pelo endpoint MCP em <strong>Opções &rarr; Permissões</strong> deste componente."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Precisa de Autenticação nos Serviços Web"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Antes de qualquer coisa:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="O Joomla protege toda a API com uma permissão separada chamada <strong>Autenticação nos Serviços Web</strong> (<code>core.login.api</code>), e <strong>por padrão só os Super Users a têm</strong>. Qualquer outro grupo &mdash; inclusive Administrator e Manager &mdash; recebe <code>403 Forbidden</code> de todas as ferramentas até você concedê-la, não importa o que mais ele possa fazer na administração. Configure-a em <strong>Sistema &rarr; Configurações globais &rarr; Permissões</strong>, no grupo, não neste componente."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / grupo personalizado"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Dê ao grupo <strong>Autenticação nos Serviços Web</strong> em Sistema &rarr; Configurações globais &rarr; Permissões, e depois Usar o endpoint MCP e (opcionalmente) Gravar pelo endpoint MCP em <strong>Opções &rarr; Permissões</strong> deste componente."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Conectar um assistente de IA a este site"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Há duas formas. A primeira (copiar e colar um prompt) é a mais fácil &mdash; funciona sem configurar o cliente e, depois que sua IA confirma que deu certo, ela normalmente oferece instalar este site como conector permanente, sem editar JSON à mão. A segunda é para quem prefere editar a configuração do cliente diretamente."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Copiar um prompt de configuração (recomendado)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Cole um prompt de configuração no seu assistente de IA"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Não é preciso configurar o cliente. Copie o prompt abaixo para uma conversa nova com seu assistente de IA (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini etc.). A IA vai fazer um teste com curl, confirmar a conexão e &mdash; nos clientes que suportam &mdash; oferecer deixar a conexão permanente, sem arquivos JSON para editar e sem comandos de terminal para decorar."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Bônus:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Se o seu cliente de IA tem uma ferramenta de shell (Codex, Claude Code, Cursor Composer, Cline, Continue, o modo agente do GitHub Copilot etc.), o prompt inclui uma oferta de autoinstalação. É só dizer &lsquo;deixe permanente&rsquo; depois que a IA confirmar que a conexão funciona, e ela vai executar o comando certo para o cliente registrar o servidor MCP (por exemplo, <code>codex mcp add</code> ou <code>claude mcp add</code>). Depois de reiniciar o cliente, este site aparece como ferramentas MCP nativas em todas as conversas &mdash; nunca mais será preciso um prompt."
; Shared "type here" field pattern - see FieldStyleHelper.
COM_CSMCPFORJ_FIELD_OPTIONAL="Opcional"
COM_CSMCPFORJ_FIELD_REQUIRED="Obrigatório"

COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Gere uma chave da API Joomla em Meu perfil (link à direita)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Clique em &lsquo;Copiar prompt&rsquo; abaixo."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Cole-o numa conversa nova com seu assistente de IA. Se você pulou o passo 2, substitua antes <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> pelo seu token real."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Envie. A IA vai testar a conexão e, nos clientes que suportam, oferecer deixá-la permanente."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Este prompt funciona em qualquer cliente de IA com ferramenta de shell ou terminal: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (modo agente), Gemini CLI, Windsurf, mcp-cli etc. Não funciona em chats só na web (claude.ai, chatgpt.com, gemini.google.com) sem acesso a shell &mdash; para esses, use a aba Conector MCP."

; Tab 2 — manual MCP connector configuration
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="Conector MCP (configuração manual)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="Adicionar manualmente como conector MCP"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="Para Claude Desktop (arquivo de configuração), Claude Code, Cursor, Codex, Cline, Copilot, Gemini CLI ou qualquer cliente em que você prefira editar a configuração diretamente. Configura-se uma vez e vale para todas as conversas. (Os conectores personalizados do claude.ai e do ChatGPT não conseguem enviar uma chave de API: eles se conectam fazendo login. Veja <strong>Conectar fazendo login (OAuth)</strong> nesta página.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="Gere uma chave da API Joomla em Meu perfil."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="Copie o trecho de configuração abaixo."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP3="Substitua <code>YOUR_JOOMLA_API_TOKEN</code> pelo token que você gerou."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Cole-o na configuração MCP do seu cliente de IA &mdash; Claude Desktop: <code>claude_desktop_config.json</code>; Claude Code: <code>claude mcp add</code>; Cursor: <code>~/.cursor/mcp.json</code>; GitHub Copilot: configurações MCP no VS Code / JetBrains; Cline / Continue: configurações JSON da extensão. Reinicie o cliente depois de salvar. (As caixas &ldquo;Add custom connector&rdquo; do claude.ai e do ChatGPT não têm campo para isso; use o login OAuth nelas.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_XHEADER_NOTE="Se o seu cliente não suporta o cabeçalho Authorization, troque o bloco headers por:"

