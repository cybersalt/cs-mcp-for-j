COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="O Web Application Firewall dele pode bloquear requisições MCP e o login. Se <strong>Verificar conexão</strong> mostrar um bloqueio, encontre a regra no Blocked Requests Log do Admin Tools e adicione uma exceção no WAF, ou desative essa regra. Libere <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> e as URLs que contêm <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="O Securitycheck está ativado."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="O firewall dele pode bloquear requisições MCP e o login. Se <strong>Verificar conexão</strong> mostrar um bloqueio, encontre a requisição nos registros dele e adicione uma exceção para <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> e as URLs que contêm <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="O Route 66 está ativado."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Esta extensão de SEO pode capturar os endereços de login (<code>index.php?csmcpforj_oauth=&hellip;</code>) e responder com a página inicial, de modo que o claude.ai ou o ChatGPT não consegue se registrar e não dá um motivo claro. Se <strong>Verificar conexão</strong> mostrar a página inicial para os endpoints de login, exclua no Route 66 as URLs que contêm <code>csmcpforj_oauth</code>, ou desative o plugin de sistema dele."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Firewalls mantidos pela hospedagem também podem bloquear: o o2switch TigerProtect responde 503, e regras do Imunify360, do ModSecurity ou do Cloudflare respondem 403. Peça à hospedagem para liberar os endereços acima, ou para deixar passar os servidores da Anthropic (<code>160.79.104.0/21</code>) para o claude.ai. <strong>Cloudflare</strong>: Browser Integrity Check e Security Level podem bloquear os servidores dos aplicativos. Adicione uma regra personalizada do WAF (Security &rarr; WAF &rarr; Custom rules) com a ação <strong>Skip</strong> para as requisições cujo caminho de URI contenha <code>/api/index.php/v1/mcp</code> ou <code>/.well-known/oauth-</code>, ou cuja query string contenha <code>csmcpforj_oauth</code>, e marque <em>Browser Integrity Check</em> e <em>Security Level</em>. O Bot Fight Mode não pode ser pulado por uma regra, então desative-o se ele bloquear."

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Lista de verificação do claude.ai: &ldquo;cannot register&rdquo;, &ldquo;Authorization failed&rdquo; ou &ldquo;Couldn't reach the MCP server&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Confira estes itens nesta ordem. Cada um deles já custou horas a alguém."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Use exatamente este endereço: <code>%s</code>. Com ou sem <em>www</em> precisa bater com a forma como o site responde, <strong>sem redirecionamento</strong> no meio (de www para o domínio sem www, ou de http para https). O botão <strong>Verificar conexão</strong> do painel avisa quando há redirecionamento."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="O login OAuth está ativado neste site. O claude.ai só consegue se conectar fazendo login, então ele precisa continuar ativado."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>O login OAuth está desativado neste site.</strong> O claude.ai só consegue se conectar fazendo login, então um Super User precisa ativá-lo primeiro: Componentes &rarr; MCP for J &rarr; Opções &rarr; <strong>Login OAuth</strong>. Enquanto estiver desativado, o claude.ai diz &ldquo;cannot register&rdquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="Na caixa <strong>Add custom connector</strong>, escolha <strong>Sign in now</strong>. Para o cliente OAuth, tanto <strong>Use Claude's published identity</strong> quanto <strong>Register automatically</strong> funcionam (a identidade publicada precisa da extensão curl do PHP no servidor). Deixe o client ID e o secret em branco. Se uma forma falhar, remova o conector e adicione-o de novo com a outra."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>Não adicione cabeçalhos de requisição.</strong> O claude.ai não aceita um cabeçalho <code>X-Joomla-Token</code>, então não dá para usar uma chave de API ali. Fazer login é a única forma de entrar a partir do claude.ai."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Os firewalls precisam deixar passar os servidores do claude.ai. Eles se conectam a partir de <code>160.79.104.0/21</code>, não do seu navegador. O RSFirewall precisa de duas exceções: <code>csmcpforj_oauth</code> e <code>api\/index\.php\/v1\/mcp</code> como expressão regular. O Admin Tools, o Securitycheck e firewalls de hospedagem como o o2switch TigerProtect (que responde 503) também podem bloquear. <strong>Cloudflare</strong>: Browser Integrity Check e Security Level podem bloquear os servidores dos aplicativos. Adicione uma regra personalizada do WAF (Security &rarr; WAF &rarr; Custom rules) com a ação <strong>Skip</strong> para as requisições cujo caminho de URI contenha <code>/api/index.php/v1/mcp</code> ou <code>/.well-known/oauth-</code>, ou cuja query string contenha <code>csmcpforj_oauth</code>, e marque <em>Browser Integrity Check</em> e <em>Security Level</em>. O Bot Fight Mode não pode ser pulado por uma regra, então desative-o se ele bloquear. O botão <strong>Verificar conexão</strong> do painel mostra o que está respondendo."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="O <strong>Route 66</strong> e outras extensões de SEO que reescrevem URLs podem capturar os endereços de login (<code>index.php?csmcpforj_oauth=&hellip;</code>) e responder com a página inicial, de modo que o aplicativo não consegue se registrar e não dá um motivo claro. Se <strong>Verificar conexão</strong> mostrar a página inicial para os endpoints de login, exclua nessa extensão as URLs que contêm <code>csmcpforj_oauth</code>, ou desative o plugin de sistema dela."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Faça login com uma conta que possa usar o MCP (veja <em>Quem pode usar este endpoint?</em> no painel). Se falhar só para uma pessoa, confira se a conta dela não está bloqueada e não está com <em>Exigir redefinição da senha</em>."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="Ainda travado? Componentes &rarr; MCP for J &rarr; <strong>Registros</strong> mostra cada etapa do login e por que uma etapa foi recusada."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_JUMP="Ir para:"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_LOGIN="claude.ai, ChatGPT e outros aplicativos que se conectam fazendo login"
