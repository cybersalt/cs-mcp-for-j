COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Nenhuma chave de API para copiar. No seu aplicativo de IA, adicione um conector e cole a <strong>URL do endpoint</strong> deste site (abaixo). Quando você clicar em Connect, o aplicativo abre sozinho a página de login deste site: entre com seu usuário e senha deste site e depois clique em <strong>Permitir</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai e Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Dê um nome, cole a URL do endpoint e clique em Continue. Mantenha <em>Sign in now</em>; para o cliente OAuth, tanto <em>Use Claude's published identity</em> quanto <em>Register automatically</em> funcionam. Não adicione cabeçalhos de requisição. Clique em Add e depois em <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> <strong>Plugins</strong> na barra lateral esquerda &rarr; <strong>Add</strong> (no canto superior direito) &rarr; <strong>Add custom MCP server</strong>. Dê um nome, cole a URL do endpoint, deixe Authentication em <strong>OAuth</strong>, marque a caixa, clique em <strong>Create as a plugin</strong> e depois em <strong>Connect</strong>. Precisa de um plano pago do ChatGPT (Plus funciona)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>, depois digite <code>/mcp</code>, escolha o servidor e selecione <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> Paleta de Comandos &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; cole a URL do endpoint. O VS Code pede que você faça login."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> adicione <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> em <code>mcpServers</code> no <code>mcp.json</code> (sem cabeçalhos) e depois clique em <strong>Login</strong> ao lado do servidor em Settings &rarr; MCP."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> adicione <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> para o servidor em <code>settings.json</code> e depois execute <code>/mcp auth &lt;name&gt;</code>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. O Codex abre sozinho a página de login (se não abrir, execute <code>codex mcp login joomla</code>). Clique em Permitir em poucos minutos, num navegador no mesmo computador do Codex. Se o navegador disser depois que 127.0.0.1 recusou a conexão, use <code>codex mcp login joomla --no-browser</code> e cole o endereço dessa página no terminal, ou continue usando o método da chave de API abaixo."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, cole a URL do endpoint e depois clique em <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="Quando você clica em Permitir, o aplicativo age como a conta com que você fez login e pode fazer exatamente o que essa conta pode neste site, inclusive alterações se a conta tiver permissão. Administrators e Managers precisam antes da permissão <em>Autenticação nos Serviços Web</em> (veja Permissões no painel). Todo aplicativo conectado aparece no painel, onde pode ser desconectado na hora."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="Prefere uma chave de API, ou seu cliente não consegue abrir um navegador? O método da chave de API em <strong>Configuração avançada</strong>, abaixo, continua funcionando para qualquer cliente."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="O ChatGPT (&ldquo;Add custom MCP server&rdquo;) e o claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) só conseguem se conectar levando você à página de login deste site. Isso está desativado neste site. Quando estiver ativado, conectar é: colar o endereço deste site no aplicativo, fazer login e clicar em Permitir."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="Ativar em Opções"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Peça a um Super User para ativar o <strong>login OAuth</strong> nas opções do MCP for J. Até lá, use o método da chave de API abaixo."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="O mais fácil: a caixa &ldquo;Add custom connector&rdquo; do Claude funciona neste site."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="O login está ativado neste site, então no Claude Desktop ou no claude.ai vá em <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, cole o endereço MCP deste site, clique em Continue, mantenha as configurações de login detectadas, clique em Add e depois em Connect, entre com seu usuário e senha deste site e clique em Permitir. O método do arquivo de configuração abaixo só é necessário se você preferir uma chave de API."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="O claude.ai se conecta de forma permanente pelo <strong>Add custom connector</strong>: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, cole o endereço MCP deste site, clique em Continue, mantenha as configurações de login detectadas, clique em Add e depois em Connect. Entre com seu usuário e senha deste site e clique em Permitir. A conexão fica disponível em todos os chats."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="No ChatGPT, clique em <strong>Plugins</strong> na barra lateral esquerda e depois em <strong>Add</strong> (no canto superior direito) &rarr; <strong>Add custom MCP server</strong>. Dê um nome (por exemplo, &ldquo;Meu site Joomla&rdquo;), cole o endereço MCP deste site, deixe Authentication em <strong>OAuth</strong>, marque &ldquo;I understand and want to continue&rdquo; e clique em <strong>Create as a plugin</strong>. Clique em <strong>Connect</strong> e o ChatGPT abre a página de login deste site: entre com seu usuário e senha deste site e clique em Permitir. Depois, num chat, digite <strong>@</strong> e escolha o plugin. Não há chave de API para colar."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="A caixa &ldquo;Add custom connector&rdquo; se conecta, mas o login falha"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Confira, nesta ordem: (1) se a conta com que você fez login pode usar o MCP &mdash; Administrators precisam de <em>Autenticação nos Serviços Web</em>, e Managers precisam disso mais <em>Usar o endpoint MCP</em> em Opções &rarr; Permissões (veja o cartão <em>Quem pode usar este endpoint?</em> no painel); a página de login avisa se não for o caso; (2) se o cartão &ldquo;Conectar aplicativos de IA fazendo login&rdquo; no painel diz <strong>Pronto</strong>; (3) se o seu firewall deixa os servidores do aplicativo chegarem ao site (veja o próximo item). Não informe client ID nem secret: o aplicativo se registra sozinho. (4) Clique em Permitir logo depois que a página de login abrir: os aplicativos desistem de um login depois de um tempo (o Codex depois de uns 5 minutos), e um Permitir atrasado termina em erro. Inicie o Connect de novo e vai funcionar."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="O claude.ai ou o ChatGPT não chega ao site, ou o login para no meio"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="O claude.ai e o ChatGPT se conectam a partir dos próprios servidores, não do seu navegador, então o site precisa estar acessível por HTTPS público. Um firewall de aplicação web (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 ou um firewall da hospedagem como o TigerProtect da o2switch, que responde 503) pode bloquear essas requisições. Libere as requisições para <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> e <code>index.php?csmcpforj_oauth=&hellip;</code> (os endpoints de registro, token e revogação). No RSFirewall, estas duas exceções bastam: <code>csmcpforj_oauth</code> e <code>api\/index\.php\/v1\/mcp</code> como expressão regular. O claude.ai se conecta a partir de <code>160.79.104.0/21</code>. <strong>Cloudflare</strong>: Browser Integrity Check e Security Level podem bloquear os servidores dos aplicativos. Adicione uma regra personalizada do WAF (Security &rarr; WAF &rarr; Custom rules) com a ação <strong>Skip</strong> para as requisições cujo caminho de URI contenha <code>/api/index.php/v1/mcp</code> ou <code>/.well-known/oauth-</code>, ou cuja query string contenha <code>csmcpforj_oauth</code>, e marque <em>Browser Integrity Check</em> e <em>Security Level</em>. O Bot Fight Mode não pode ser pulado por uma regra, então desative-o se ele bloquear. O <strong>Route 66</strong> e outras extensões de SEO que reescrevem URLs podem capturar os endereços de login (<code>index.php?csmcpforj_oauth=&hellip;</code>) e responder com a página inicial, de modo que o aplicativo não consegue se registrar e não dá um motivo claro. Se <strong>Verificar conexão</strong> mostrar a página inicial para os endpoints de login, exclua nessa extensão as URLs que contêm <code>csmcpforj_oauth</code>, ou desative o plugin de sistema dela. A página de login em si é aberta no seu próprio navegador."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="O painel diz que os aplicativos de IA não encontram a página de login deste site (Não está pronto)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="Os clientes de IA procuram os dados de login em <code>/.well-known/oauth-authorization-server</code> do seu domínio. O Joomla só responde ali quando Configurações globais &rarr; <strong>Usar mod_rewrite do Apache</strong> está ativado e o <code>.htaccess</code> do site está no lugar (renomeie <code>htaccess.txt</code>), ou quando o nginx envia caminhos desconhecidos para <code>index.php</code>. Isso não afeta o AutoSSL do cPanel, que usa <code>/.well-known/acme-challenge/</code>. Um site instalado numa subpasta (por exemplo, <code>example.com/joomla</code>) também precisa de uma regra na raiz do domínio que envie <code>/.well-known/oauth-authorization-server/joomla</code> para a subpasta."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Fazer login a partir de um servidor ou de uma máquina sem navegador"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Os clientes de desktop (Claude Code, Codex, Cursor, Gemini CLI) abrem um navegador na mesma máquina e esperam a resposta num endereço local, então o login OAuth precisa de um navegador ali. Num servidor sem tela ou via SSH, use o método da chave de API em Configuração avançada; ele funciona em qualquer lugar."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="No aplicativo de IA, adicione um novo conector (claude.ai e Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector; ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server) e cole esta <strong>URL do endpoint</strong>: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Clique em Connect.</strong> O aplicativo abre sozinho a página de login deste site. Entre com seu usuário e senha deste site."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Clique em Permitir.</strong> Você volta ao aplicativo, já conectado. O aplicativo pode fazer tudo o que a sua conta pode fazer neste site."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Conectar um aplicativo de IA a este site"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Há três formas. Clique numa delas para abrir os passos numerados. A maioria das pessoas quer a primeira."
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. Fazer login (o mais fácil) &mdash; ChatGPT, claude.ai, Claude Desktop e a maioria dos outros aplicativos de IA"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Colar um prompt de configuração &mdash; para um chat de IA que consegue executar comandos"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. Arquivo de configuração ou linha de comando &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI e outros"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Funciona em aplicativos de IA que conseguem executar comandos (Codex, Claude Code, Cursor, Cline, o modo agente do Copilot e similares). A IA testa a conexão sozinha e pode oferecer deixá-la permanente."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="Para aplicativos que você configura com um arquivo de configurações ou um comando. Você faz uma vez e fica conectado."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>Obtenha seu token da API.</strong> Clique no botão: seu perfil de usuário abre numa nova aba. Lá, abra a aba <strong>Chave da API Joomla</strong>, clique no ícone do olho para exibir o token e copie-o. Depois volte para esta aba."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="Obter meu token da API (abre uma nova aba)"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>Copie o prompt.</strong> Seu token já está nele."
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="<strong>Cole numa conversa nova</strong> com seu aplicativo de IA e envie. A IA testa a conexão e, se puder, oferece deixá-la permanente."
COM_CSMCPFORJ_DASHBOARD_WAY3_STEP_COPY="<strong>Copie a configuração.</strong> Seu token já está nela."
COM_CSMCPFORJ_DASHBOARD_WAY3_GUIDE_LINK="As instruções passo a passo para cada aplicativo estão no guia de configuração &rarr;"
COM_CSMCPFORJ_DASHBOARD_COPY_URL_BUTTON="Copiar"
