COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_LABEL="Catálogo"
COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_DESC="Configurações do navegador do catálogo de complementos MCP."
COM_CSMCPFORJ_CONFIG_CATALOG_URL_LABEL="URL do endpoint do catálogo"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_DESC="De onde o catálogo de complementos MCP é obtido. Mantenha o padrão, a não ser que você mantenha um espelho privado do catálogo; a uma URL base simples é acrescentado /catalog.json."
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="Duração do cache do catálogo (horas)"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="Por quanto tempo o catalog.json obtido fica em cache antes de ser baixado de novo. O botão de atualizar na página do catálogo ignora isso. Intervalo 1&ndash;168 (uma semana)."
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="Mostrar complementos Pro indisponíveis"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Mostra os complementos Pro no catálogo mesmo que você não tenha uma assinatura Pro no momento. Útil para ver o que existe; escolha Não para ocultá-los totalmente."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Verificar a assinatura novamente a cada (segundos)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="Com que frequência o painel pergunta de novo à cybersalt.com se o e-mail vinculado ainda tem acesso Pro. 86400 = uma vez por dia (recomendado). Mínimo 60, máximo 604800 = uma vez por semana."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="Servidor MCP"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Controles do lado do servidor para o endpoint MCP. Definem o que os clientes MCP veem e podem chamar."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Modo somente leitura"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="Com SIM, o endpoint MCP anuncia e aceita apenas ferramentas cujas ToolAnnotations MCP as declaram somente leitura (list_*, get_*, read_*, check_*, validate_*, fetch_*, além de joomla_update_healthcheck). Útil quando você quer que um cliente de IA explore o site sem poder alterar conteúdo. As gravações retornam um erro explicando que o servidor está em modo somente leitura. A configuração é um piso: um cliente MCP também pode acrescentar ?read_only=1 à URL do endpoint para se limitar mais, mas NÃO consegue liberar gravações num site com SIM aqui."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Privacidade ao gravar a tela"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Controles do desfoque de segredos no painel (a chave da API Joomla na prévia do prompt, o e-mail da assinatura Pro). O desfoque vem ativado por padrão; estas opções ajustam o revelar ao passar o mouse para que um movimento casual não exponha o segredo sem querer numa tela compartilhada ou gravação."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Atraso para revelar ao passar o mouse (segundos)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Quantos segundos você precisa manter o ponteiro sobre um segredo desfocado antes que ele apareça. Enquanto você mantém, uma pequena contagem regressiva aparece ao lado do segredo para você saber que o cronômetro está correndo. Tirar o mouse cancela e zera o cronômetro &mdash; a próxima passagem começa uma contagem completa de novo. Use 0 para revelar na hora ao passar o mouse (isso remove a proteção contra passagens acidentais, mas volta ao comportamento clássico). Padrão: 3 segundos."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Ocultar automaticamente depois de revelar (segundos)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Por quantos segundos um segredo revelado ao passar o mouse continua visível antes de voltar a ficar desfocado sozinho &mdash; mesmo que o mouse continue em cima. Uma segurança a mais para situações como &ldquo;olhei, li e me distraí&rdquo;, em que um navegador sem ninguém deixaria o segredo à vista indefinidamente. Tirar o mouse sempre desfoca na hora, independentemente desta configuração. Use 0 para desativar o ocultar automático (segredos revelados ficam visíveis até você tirar o mouse). Padrão: 8 segundos &mdash; o suficiente para ler com calma um token base64 inteiro, curto o bastante para que uma sessão sem ninguém não exponha o segredo."

