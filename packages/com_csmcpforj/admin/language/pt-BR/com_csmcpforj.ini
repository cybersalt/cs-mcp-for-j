; ============================================================
; Setup Guide view (v2.4.1 — restructured 2026-08-13 to lead with
; the Dashboard easy-way method and push technical / config-file
; setup into a collapsed Advanced section. Non-technical audience.)
; ============================================================

COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="Guia de configuração"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="Guia de configuração"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for J — Guia de configuração"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Conectar uma IA a este site Joomla"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="O MCP for J foi feito para facilitar a conexão de um assistente de IA como Codex, Claude, ChatGPT ou Cursor ao seu site Joomla &mdash; para que a IA possa ler seus artigos, gerenciar usuários, publicar conteúdo e mais, tudo pelo chat normal da IA. Você não precisa ser técnico. O método fácil abaixo serve para a maioria das pessoas; role a página para ver as opções avançadas, se precisar."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ O jeito fácil"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Sem arquivos de configuração. Sem cabeçalhos. Sem jargão. É só copiar um prompt de configuração pronto no painel e colar num chat novo com sua IA. A IA faz o resto &mdash; ela testa a conexão e, nos clientes que suportam, oferece salvar a conexão de forma permanente para você."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Obtenha sua chave de API</strong> (uma senha pessoal que permite à sua IA agir neste site). As instruções estão abaixo, caso você ainda não tenha uma."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Vá ao painel</strong> (botão abaixo) e cole lá sua chave de API no campo."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Clique no botão &ldquo;Copiar prompt&rdquo;</strong> no painel. Sua chave é colocada automaticamente no prompt antes da cópia."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Cole num chat novo</strong> com sua IA (Claude, ChatGPT, Cursor, Copilot, Gemini etc.) e envie. A IA vai confirmar que a conexão funciona e oferecer salvá-la."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Ir para o painel"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="Pronto. Sua IA está conectada. Se você quiser saber mais sobre como as partes se encaixam, ou preferir configurar sua IA à mão, continue lendo abaixo &mdash; mas não é obrigatório."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Obtenha sua chave de API"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="Uma <strong>chave de API</strong> é uma senha pessoal que permite à sua IA agir neste site Joomla como VOCÊ. Quem tiver a chave pode fazer tudo o que a sua conta de usuário do Joomla pode &mdash; então trate-a como algo privado. Veja como gerar uma:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sClique aqui para abrir seu perfil de usuário do Joomla%s. Ele abre numa nova aba. Lá, procure a aba chamada <strong>Chave da API Joomla</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="Nessa aba, clique no botão <strong>Limpar</strong>. O Joomla gera uma longa sequência de letras e números e a coloca no campo abaixo do botão. Essa é a sua chave."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Clique no pequeno <strong>ícone do olho</strong> ao lado do campo para exibir a chave e depois copie a sequência inteira."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Cole-a no campo abaixo nesta página (ela fica salva só no seu navegador, para que os botões de copiar desta página a preencham sozinhos), OU cole-a direto no campo de chave de API do painel se você for fazer a configuração fácil por lá."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Trate esta chave como uma senha."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Não a cole em documentos compartilhados, capturas de tela ou código que você vai publicar. Se ela vazar algum dia, volte à aba Chave da API Joomla e clique em Limpar de novo &mdash; a chave antiga deixa de valer na hora."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Cole aqui sua chave de API (para copiar com um clique nesta página)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Sua chave fica guardada só neste navegador</strong> &mdash; ela nunca sai do seu computador. Use o botão da lixeira para esquecê-la. Se você deixar isto em branco, os botões de copiar desta página continuam funcionando, mas você terá de colar sua chave à mão no trecho copiado."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Mostrar/ocultar a chave"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Esquecer a chave salva"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Avançado: conectar uma IA manualmente (a maioria das pessoas não precisa disso)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Esta seção é para quem quer configurar à mão a conexão do cliente de IA com este site &mdash; normalmente editando um pequeno arquivo de texto chamado &ldquo;arquivo de configuração&rdquo;. Se a configuração fácil acima funcionou, pode ignorar esta seção inteira. Se você quer pular o prompt de configuração e registrar a conexão direto no seu cliente de IA, continue lendo."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="A URL de conexão deste site"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="Este é o endereço de que o seu cliente de IA precisa. Você vai colá-lo na configuração do cliente junto com sua chave de API."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Escolha seu cliente de IA"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="A URL de conexão e a chave de API são as mesmas para qualquer IA &mdash; só muda <em>onde você as cola</em> em cada cliente. Escolha seu cliente abaixo para ver as instruções específicas."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, extensão de IDE ou aplicativo de desktop)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="O Codex suporta este endpoint nativamente como servidor MCP Streamable HTTP. Primeiro guarde a chave de API do Joomla numa variável de ambiente própria deste site e depois registre o endpoint pelo nome dessa variável. A chave nunca é gravada em <code>config.toml</code>. Se você usar o botão de copiar depois de colar uma chave acima, o comando de ambiente copiado contém essa chave; mantenha-o longe de terminais compartilhados, gravações e chamados de suporte."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; salvar a chave para os próximos processos do Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Abra um novo terminal depois de definir uma variável de ambiente permanente no Windows. Processos do Codex e do terminal que já estão abertos não a enxergam."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; definir a chave para este terminal (guarde-a no seu ambiente de shell seguro se precisar que persista)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Registrar este site Joomla no Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Execute <code>codex mcp list</code>, reinicie o Codex (ou confira o status MCP na interface dele) e depois chame a ferramenta inofensiva e somente leitura <code>get_joomla_version</code>. Isso verifica a inicialização, a autenticação, a descoberta de ferramentas e a chamada. Para uma conexão somente leitura, ative também o modo somente leitura do lado do servidor do MCP for J; as configurações de aprovação do cliente não conseguem passar por cima das permissões do servidor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Token inválido no cPanel ou no PHP-FPM?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="O servidor web pode estar removendo o cabeçalho padrão Authorization. Substitua a entrada criada acima em <code>~/.codex/config.toml</code> por este bloco, para que o Codex leia a mesma variável de ambiente e a envie como <code>X-Joomla-Token</code>, e depois reinicie o Codex."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Atenção &mdash; a caixa &ldquo;Add custom connector&rdquo; do Claude precisa de OAuth, que está desativado neste site."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="A caixa &ldquo;Add custom connector&rdquo; integrada ao Claude Desktop e ao claude.ai se conecta fazendo login (OAuth) e não tem campo para chave de API. Um Super User pode ativar o login OAuth nas opções do MCP for J; aí essa caixa funciona. Até lá, as instruções do Claude Desktop abaixo usam uma alteração no arquivo de configuração. (Ou use a configuração fácil acima &mdash; ela também funciona com o Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Quatro passos: crie um pequeno arquivo auxiliar, um &ldquo;script wrapper&rdquo;, com o comando de conexão; faça o arquivo de configuração do Claude Desktop apontar para ele; e reinicie o Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Por que um script wrapper em vez de colocar a conexão direto na configuração do Claude Desktop? O Claude Desktop 1.30096+ (ago. 2026) recusa entradas de configuração cujos argumentos parecem conter credenciais &mdash; um recurso de segurança bem-intencionado que, infelizmente, bloqueia o caminho direto. Mover o comando para um pequeno arquivo auxiliar contorna isso (o Claude Desktop só vê um comando simples sem argumentos visíveis) e sua chave de API fica exatamente tão segura quanto antes &mdash; o arquivo auxiliar fica na sua própria pasta de usuário, ao lado da configuração do Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Pré-requisito, uma única vez &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Estas instruções supõem que o Node.js está instalado no seu computador (ele vem com um comando chamado <code>npx</code>). A maioria dos ambientes de desenvolvimento já tem; se não tiver, instale a partir de <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> com o instalador LTS. O arquivo wrapper abaixo espera o Node.js no caminho de instalação padrão do Windows, <code>C:\Program Files\nodejs\</code>. Se você instalou em outro lugar, altere esse caminho no arquivo wrapper depois de copiar."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Passo 1 &mdash; criar o script wrapper"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Por enquanto só para Windows (usuários de Mac/Linux: vejam as perguntas frequentes). Copie o bloco abaixo para um novo arquivo de texto. Salve-o na sua pasta de usuário (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) com o nome <code>claude-mcp-joomla-{sitename}.cmd</code>, trocando <code>{sitename}</code> por um rótulo curto para o seu site (ex.: <code>cybersaltorg</code>). Confira se <code>.cmd</code> é mesmo a extensão e não parte do nome &mdash; no Bloco de Notas, escolha &ldquo;Tipo: Todos os arquivos&rdquo; para que ele não acrescente <code>.txt</code>. Se você colou sua chave de API no campo no topo desta página, o botão de copiar a coloca para você."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Não sabe qual é o seu nome de usuário do Windows? Abra o Explorador de Arquivos, vá até <code>C:\Users\</code> e veja os nomes das pastas &mdash; uma delas é a sua."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Passo 2 &mdash; abrir o arquivo de configuração do Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="O arquivo de configurações do Claude Desktop fica num caminho fixo em cada sistema operacional. Abra-o com qualquer editor de texto (VS Code, Bloco de Notas, TextEdit, Sublime, o que você tiver):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="O Claude Desktop tem um botão em Settings &rarr; Developer &rarr; <strong>Edit Config</strong> que deveria abrir o arquivo para você. Se nada acontecer ao clicar, é porque o seu computador não sabe com qual programa abrir arquivos <code>.json</code>. Sem problema &mdash; abra o arquivo você mesmo com um editor de texto usando um dos caminhos acima. Se o arquivo ainda não existir, crie-o e use o bloco abaixo como conteúdo completo (envolvido em <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Passo 3 &mdash; adicionar este bloco à configuração do Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Cole isto em <code>claude_desktop_config.json</code>. Se o arquivo já tem um objeto <code>mcpServers</code> com outros servidores, adicione a entrada <code>joomla-...</code> ao lado deles (não cole um segundo objeto <code>mcpServers</code>). Se o arquivo estiver vazio ou não existir, use o bloco inteiro abaixo como conteúdo. <strong>Importante:</strong> troque <code>YOUR_WINDOWS_USERNAME</code> pelo seu nome de usuário real do Windows."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Esta configuração só faz o Claude Desktop apontar para o script wrapper que você criou no passo 1. Sua chave de API fica no arquivo wrapper, não na configuração do Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Passo 4 &mdash; fechar totalmente o Claude Desktop e abrir de novo"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="O Claude Desktop só lê o arquivo de configuração ao iniciar. Feche-o totalmente &mdash; no Windows, clique com o botão direito no ícone do Claude na bandeja do sistema (canto inferior direito; talvez seja preciso clicar antes na pequena seta para cima) e escolha Quit. Espere alguns segundos e abra de novo. Em qualquer conversa, clique no ícone de ferramentas (ou pergunte &ldquo;quais ferramentas você tem?&rdquo;) &mdash; as ferramentas do site devem aparecer. Se não aparecerem, veja Solução de problemas abaixo."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (terminal ou VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Se você usa o Claude Code, um único comando de terminal faz a conexão &mdash; sem editar arquivo de configuração. Cole sua chave de API no campo acima para que o botão de copiar abaixo a preencha, depois cole o comando num terminal e pressione Enter. O Claude Code confirma a conexão na hora e recarrega."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (a versão web)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="A caixa <strong>Add custom connector</strong> do claude.ai se conecta fazendo login (OAuth), que está desativado neste site. Um Super User pode ativá-lo nas opções do MCP for J, e então o claude.ai ganha uma conexão permanente. Até lá, a configuração fácil acima (colar um prompt) vale só para o chat atual."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="O Cursor guarda as conexões MCP num arquivo de configuração chamado <code>mcp.json</code>. Abra-o num editor de texto, cole o bloco abaixo dentro do objeto <code>mcpServers</code> e salve. Na maioria dos casos o Cursor aplica a mudança sem reiniciar."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Local do arquivo de configuração: <code>~/.cursor/mcp.json</code> (para todos os seus projetos) ou <code>.cursor/mcp.json</code> numa pasta de projeto específica (só para esse projeto)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Servidores MCP personalizados no ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="A caixa <strong>Add custom MCP server</strong> do ChatGPT só consegue se conectar fazendo login (OAuth) ou sem autenticação; ela não tem campo para chave de API nem para cabeçalho. O login OAuth está desativado neste site, então o ChatGPT ainda não consegue se conectar. Um Super User pode ativá-lo nas opções do MCP for J. Até lá, use o Codex (o agente de programação da OpenAI), que envia a chave de API a partir de uma variável de ambiente."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Para adicionar um servidor MCP personalizado é preciso um plano pago do ChatGPT. Funciona no Plus (verificado em outubro de 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI e Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Tanto o Gemini CLI (o assistente de IA do Google para o terminal) quanto a extensão Gemini Code Assist (para VS Code / JetBrains) leem o mesmo arquivo de configuração MCP. Dois passos: edite esse arquivo para adicionar este site Joomla como servidor MCP e depois reinicie o Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Você pode adicionar o servidor de forma global (todas as sessões do Gemini o veem) ou só dentro de uma pasta de projeto. O trecho é idêntico &mdash; só muda o local do arquivo."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Abra (ou crie) seu arquivo de configurações do Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Escolha um destes dois locais:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Global (todos os projetos):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Só um projeto:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (numa pasta de projeto)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Cole este bloco dentro do arquivo."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Se o arquivo já tem uma seção <code>mcpServers</code>, adicione a entrada <code>&quot;joomla-...&quot;</code> dentro da existente &mdash; não duplique a chave externa <code>mcpServers</code>. Se o arquivo estiver vazio ou for novo, cole o trecho inteiro como está."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="O Gemini usa <code>httpUrl</code> para servidores MCP via HTTP (como este) &mdash; é diferente da chave <code>url</code> do Cursor. Copie exatamente este trecho em vez de reaproveitar o do Cursor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Reinicie o Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Feche e abra de novo o <code>gemini</code> no terminal, ou recarregue a janela do VS Code / JetBrains. Digite <code>/mcp</code> no Gemini CLI para ver os servidores conectados e confirmar que seu site Joomla está na lista."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="O aplicativo web <code>gemini.google.com</code> não suporta servidores MCP personalizados em agosto de 2026 &mdash; este guia cobre apenas o Gemini CLI e o Gemini Code Assist. Se o Google adicionar suporte na interface web, vamos documentar aqui."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Outros clientes de IA compatíveis com MCP (Cline, Continue, GitHub Copilot no modo agente, Windsurf, mcp-cli etc.) também funcionam &mdash; a URL de conexão e a chave de API são idênticas, só muda o lugar exato onde colá-las. Vamos acrescentar guias para mais clientes com o tempo; se travar, as perguntas frequentes abaixo têm orientações gerais."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Copiar"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Copiado"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Copiado (com a sua chave)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Segurança e compartilhamento"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="Sua chave de API É o login &mdash; quem tiver a chave pode fazer tudo o que sua conta de usuário do Joomla pode. Não existe acesso anônimo. Se você ativar o <strong>login OAuth</strong>, um aplicativo de IA também pode se conectar levando você à página de login normal deste site; ele passa a agir como a conta que fez login, com exatamente as permissões dela, até você desconectá-lo no painel."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Dar acesso MCP a outras pessoas"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Há duas formas &mdash; escolha a que servir melhor:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Uma chave por pessoa (o mais seguro)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Crie um usuário do Joomla para cada pessoa, coloque-o num grupo só com as permissões que você quer dar (ex.: somente leitura), gere uma chave para esse usuário e envie em particular. Cada pessoa deixa o próprio rastro nos registros; você pode revogar qualquer chave sem afetar as outras."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Uma chave compartilhada (o mais simples, mas o menos seguro)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Crie um usuário limitado (ex.: <code>mcp-demo-guest</code>) num grupo somente leitura, gere uma chave e compartilhe de forma mais ampla. Mais fácil de distribuir; mais difícil saber quem está usando ou tirar o acesso de uma só pessoa. Serve para uma demonstração pública; não para acessos sensíveis."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Revogar uma chave"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="Para que uma chave existente pare de funcionar na hora, vá em Usuários &rarr; o usuário em questão &rarr; aba Chave da API Joomla &rarr; clique em <strong>Limpar</strong>. A chave antiga deixa de valer no momento do clique. Entregue a nova chave a essa pessoa ou deixe-a sem acesso."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Solução de problemas"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Encontre o tipo de aplicativo que você está conectando e abra o problema que corresponde ao que você vê. Mensagens de erro e bloqueios de firewall podem aparecer em qualquer aplicativo, por isso têm um grupo próprio no final."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; ou &ldquo;Authentication failed&rdquo; (erro 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="Sua IA chega ao site, mas a chave de API não está certa. Confira: (1) se a chave não foi limpa desde que você a copiou (cada limpeza invalida a chave anterior); (2) se ela foi copiada inteira, sem caracteres faltando nem espaços a mais; (3) se você editou um arquivo de configuração, se a palavra <code>Bearer </code> (com um espaço depois) vem antes da chave. Na dúvida, gere uma chave nova e tente de novo."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; ou &ldquo;Could not match accept header&rdquo; (erro 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Versões antigas do MCP for J (anteriores à 2.3.4) tinham um bug que impedia alguns clientes de IA de se conectar. Atualize o MCP for J para a versão mais recente &mdash; veja Sistema &rarr; Atualizar &rarr; Extensões na administração do Joomla."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;Conectado, mas nenhuma ferramenta aparece na IA&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Normalmente é uma de três coisas: (1) o grupo do usuário não tem <strong>Autenticação nos Serviços Web</strong> &mdash; configure em Sistema &rarr; Configurações globais &rarr; Permissões (por padrão só os Super Users têm); (2) o grupo não tem permissão MCP &mdash; Super Users sempre têm e Administrators têm pelos padrões do Joomla, mas Managers e outros grupos precisam de Usar o endpoint MCP (e Gravar pelo endpoint MCP para alterações) em Opções &rarr; Permissões deste componente; (3) o cliente de IA guardou em cache uma lista de ferramentas vazia &mdash; desconecte e reconecte o servidor MCP no cliente para forçar uma nova verificação."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; ou a URL retorna um erro (erro 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Ou a URL está errada (confira &mdash; ela deve terminar em <code>/api/index.php/v1/mcp</code>), OU o plugin de Serviços Web do MCP está desativado no seu site Joomla. Na administração do Joomla: Sistema &rarr; Gerenciar &rarr; Extensões &rarr; procure <code>csmcpforj</code> &rarr; confira se o plugin de Serviços Web está ativado. Se já estiver, o <code>.htaccess</code> do seu site pode estar bloqueando o caminho <code>/api/</code> &mdash; um problema da hospedagem ou de um plugin de segurança."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; ou &ldquo;Malware detected&rdquo; (erro 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Um plugin de segurança do seu site Joomla (RSFirewall, Admin Tools Pro, Securitycheck Pro) está bloqueando a requisição MCP. No RSFirewall, adicione duas exceções: <code>csmcpforj_oauth</code> e <code>api\/index\.php\/v1\/mcp</code> como expressão regular (a primeira é para o login). Nos outros, libere <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> e as URLs que contêm <code>csmcpforj_oauth</code>. Para confirmar a causa, desative o plugin de segurança por um instante, tente de novo e depois reative-o com as exceções configuradas. O botão <strong>Verificar conexão</strong> do painel mostra qual endereço está bloqueado."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="O botão &ldquo;Edit Config&rdquo; do Claude Desktop não faz nada quando clico"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Esse botão tenta entregar o <code>claude_desktop_config.json</code> ao programa com que o seu computador abre arquivos <code>.json</code>. Se isso não estiver configurado, o botão não faz nada, sem aviso. Solução: abra o arquivo você mesmo com qualquer editor de texto. Os caminhos de cada sistema operacional estão na seção Claude dentro de Avançado, acima. Se o arquivo ainda não existir, crie-o e use o trecho dessa seção como conteúdo completo (envolva o trecho em <code>{&quot;mcpServers&quot;: { ... }}</code>). Não é preciso mudar permissões &mdash; o arquivo fica na sua própria pasta de usuário."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="A caixa &ldquo;Add custom connector&rdquo; do Claude ou &ldquo;Add custom MCP server&rdquo; do ChatGPT não tem campo para a chave de API"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Essas caixas foram feitas para se conectar fazendo login (OAuth); não há onde colar uma chave de API do MCP for J. Este site está com o login OAuth desativado. Um Super User pode ativá-lo em Componentes &rarr; MCP for J &rarr; Opções &rarr; <strong>Login OAuth</strong>, e então as duas caixas funcionam. Até lá: o Claude Desktop pode usar o método do script wrapper acima, o claude.ai a configuração fácil e quem usa o ChatGPT, o Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="O Claude Desktop mostra &ldquo;Some MCP servers could not be loaded&rdquo; ao iniciar"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="O Claude Desktop 1.30096+ (ago. 2026) endureceu a validação do arquivo de configuração e agora recusa entradas cujos argumentos parecem conter credenciais. Isso bloqueia as duas formas óbvias de configurar um servidor MCP com token bearer direto no <code>claude_desktop_config.json</code>: o formato nativo <code>type: http</code> E passar <code>mcp-remote</code> com um argumento <code>--header &quot;Authorization: Bearer ...&quot;</code>. As duas parecem certas no arquivo, mas o validador de esquema do Claude Desktop as descarta ao carregar. <strong>Solução:</strong> use o método do script wrapper descrito na seção Claude dentro de Avançado, acima &mdash; coloque o comando inteiro num pequeno arquivo <code>.cmd</code> e faça a configuração do Claude Desktop apenas apontar para ele. O Claude Desktop vê um comando simples sem argumentos visíveis e o aceita. Sua chave de API fica exatamente tão segura quanto antes &mdash; o arquivo wrapper fica na sua própria pasta de usuário."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Reiniciei o Claude Desktop, mas ele ainda não vê a nova conexão"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="No Windows, fechar a janela do Claude Desktop só a esconde na bandeja do sistema &mdash; o aplicativo inteiro continua rodando com a configuração ANTIGA na memória. Clicar depois no ícone da barra de tarefas só traz de volta a janela desse processo que já está rodando. O Claude Desktop só relê o arquivo de configuração num reinício de verdade do aplicativo. Para reiniciar de verdade: clique com o botão direito no ícone do Claude na bandeja do sistema (canto inferior direito; talvez seja preciso clicar na pequena seta para cima para ver os ícones ocultos) &rarr; escolha <strong>Quit</strong> &rarr; espere uns 3 segundos até o processo terminar por completo &rarr; abra o Claude Desktop de novo pelo menu Iniciar. Só então as alterações no arquivo de configuração passam a valer."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Perguntas frequentes"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Alguém pode usar esta conexão sem uma chave de API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="Não. Toda requisição precisa levar uma chave de API válida, ou um token de acesso OAuth se o login OAuth estiver ativado. Requisições sem isso são recusadas. É de propósito &mdash; a IA pode fazer ações reais no seu site (criar artigos, editar usuários etc.), então o acesso anônimo seria um desastre de segurança."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Um usuário do Joomla pode ter várias chaves de API ativas?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="Não. O Joomla guarda exatamente uma chave de API por usuário. Clicar em Limpar gera uma nova e invalida a antiga. Se você precisa de várias chaves (uma por dispositivo, uma por ferramenta de IA etc.), crie usuários do Joomla separados."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Há limite de uso?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="O MCP for J em si não tem limite. Valem os limites normais da hospedagem (memória do PHP, conexões do MariaDB etc.). Se você gera muito tráfego (grandes operações em lote em muitos sites), converse com a sua hospedagem sobre aumentar a concorrência do PHP-FPM."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Preciso abrir portas no firewall ou configurar algo especial?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="Não. O MCP usa simplesmente HTTPS padrão na porta 443. Se o seu site já está acessível publicamente em <code>https://yoursite.com/</code>, o endpoint MCP fica acessível a qualquer cliente de IA na internet, sem configuração extra."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="Como troco (renovo) minha chave de API regularmente?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Não há agendamento automático &mdash; você troca à mão quando quiser. Vá em Usuários &rarr; o usuário &rarr; aba Chave da API Joomla &rarr; clique em Limpar. Depois atualize a configuração do cliente de IA com a nova chave. Bom hábito: troque qualquer chave que já tenha aparecido numa captura de tela, num log ou num relatório de bug."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Uso um cliente de IA que não está na lista acima &mdash; vai funcionar?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Quase certamente sim, desde que ele suporte MCP padrão via HTTPS e deixe você adicionar um cabeçalho Authorization personalizado ou consiga fazer login com OAuth (ative o login OAuth em Opções). A URL é a mesma em todo lugar &mdash; só muda a tela de configuração do cliente. Clientes que sabemos que funcionam, mas para os quais ainda não escrevemos guias passo a passo: Continue.dev, Windsurf, o editor Zed, mcp-cli, MCP Inspector, LibreChat, Open WebUI (pela ponte <code>mcpo</code>) e vários agentes baseados no Ollama."

