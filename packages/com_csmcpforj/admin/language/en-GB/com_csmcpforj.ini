COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="How often the dashboard re-asks cs-release-manager whether the linked email still has Pro access. 86400 = once a day (recommended). 0 = check on every dashboard page load (good for testing membership state changes). Max 604800 = once a week."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="MCP server"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Server-side controls for the MCP endpoint. Affect what MCP clients see and can call."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Read-only mode"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="When YES, the MCP endpoint announces and accepts only tools whose MCP ToolAnnotations declare them read-only (list_*, get_*, check_*, validate_*, fetch_*). Useful when you want an AI client to explore the site without any ability to mutate content. Writes return an error explaining the server is in read-only mode. The setting is a floor: an MCP client can also pass ?read_only=1 on the endpoint URL to narrow further, but cannot UNLOCK writes from a site that has this set to YES."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Screencasting privacy"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Controls for blurred-secrets protection on the Dashboard (Joomla API token in the prompt preview, Pro membership email). Blur is on by default; these options tune the hover-to-reveal behaviour so a casual mouse-over doesn't accidentally expose the secret on a screenshare or screencast."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Hover-to-reveal delay (seconds)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="How many seconds you must hold the mouse pointer over a blurred secret before it reveals. A small countdown pill appears next to the secret while you're holding hover so you know the timer is running. Moving the mouse away cancels the reveal and resets the timer &mdash; the next hover starts a fresh full-length countdown. Set to 0 for immediate reveal on hover (removes the anti-accidental-mouse-over protection but restores classic single-hover behaviour). Default 3 seconds."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Auto-hide after reveal (seconds)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Once a secret has been revealed by holding hover, how many seconds it stays visible before automatically re-blurring &mdash; even if the mouse is still over it. Belt-and-braces for &ldquo;I glanced, read it, then got distracted&rdquo; scenarios where an unattended browser could otherwise leave the secret exposed indefinitely. Moving the mouse away always re-blurs immediately regardless of this setting. Set to 0 to disable auto-hide (revealed secrets stay visible until you mouse off). Default 8 seconds &mdash; long enough to read a full base64 token comfortably; short enough that an unattended session doesn't expose the secret."

