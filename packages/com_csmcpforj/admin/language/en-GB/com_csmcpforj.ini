; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Connect an AI assistant to this site"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Two ways to do it. The first one (copy-paste prompt) is the easiest &mdash; works without any client configuration, and after your AI confirms it works it will typically offer to install this site as a permanent connector for you with no manual JSON editing. The second is for users who prefer to edit their client config directly."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Copy a setup prompt (recommended)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Paste a setup prompt into your AI assistant"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="No client configuration needed. Copy the prompt below into a fresh conversation with your AI assistant (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini, etc.). The AI will run a test curl, confirm the connection, and &mdash; on clients that support it &mdash; offer to make the connection permanent for you with no JSON files to edit and no terminal commands to remember."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Bonus:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="If your AI client has a shell tool (Codex, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot agent mode, etc.), the prompt includes a self-install offer. Just say &lsquo;make it permanent&rsquo; after the AI confirms the connection works, and it will run the client-appropriate command to register the MCP server (for example, <code>codex mcp add</code> or <code>claude mcp add</code>). After a client restart, this site appears as native MCP tools in every conversation &mdash; no prompt needed ever again."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Generate a Joomla API token in My Profile (link on the right)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Click &lsquo;Copy prompt&rsquo; below."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Paste it into a new conversation with your AI assistant, then replace <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> with your actual token."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Send. The AI will test the connection and, on clients that support it, offer to make the connection permanent."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="This prompt works in any AI client with a shell/terminal tool: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (agent mode), Gemini CLI, Windsurf, mcp-cli, etc. It won't work in web-only chat UIs (claude.ai, chatgpt.com, gemini.google.com) that lack shell access &mdash; for those, use the MCP Connector tab."

; Tab 2 — manual MCP connector configuration
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="MCP Connector (manual config)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="Add as an MCP connector manually"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="For Claude Desktop, claude.ai, ChatGPT custom connectors, Cursor, Cline, Copilot, or any client where you'd rather edit the configuration directly. One-time setup, persistent across all conversations."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="Generate a Joomla API token in My Profile."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="Copy the configuration snippet below."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP3="Replace <code>YOUR_JOOMLA_API_TOKEN</code> with the token you generated."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Paste it into your AI client's MCP config &mdash; Claude Desktop: <code>claude_desktop_config.json</code>; claude.ai: Settings &rarr; Connectors &rarr; Add custom connector; Claude Code: <code>claude mcp add</code>; Cursor: <code>~/.cursor/mcp.json</code>; ChatGPT (Team/Enterprise/Pro): Settings &rarr; Connectors &rarr; Add custom connector; GitHub Copilot: MCP settings in VS Code / JetBrains; Cline / Continue: extension settings JSON. Restart the client after saving."
