; ============================================================
; Setup Guide view (v2.4.1 — restructured 2026-08-13 to lead with
; the Dashboard easy-way method and push technical / config-file
; setup into a collapsed Advanced section. Non-technical audience.)
; ============================================================

COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="Setup Guide"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="Setup Guide"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for Joomla &mdash; Setup Guide"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Connect an AI to this Joomla site"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for Joomla is designed to make it easy to connect an AI assistant like Codex, Claude, ChatGPT, or Cursor to your Joomla site &mdash; so the AI can read your articles, manage users, publish content, and more, all through the AI's normal chat interface. You don't need to be technical. The easy method below works for most people; scroll down for advanced options if you need them."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ The easy way"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="No config files. No headers. No jargon. Just copy a ready-to-go setup prompt from the Dashboard and paste it into a fresh chat with your AI. The AI does the rest &mdash; it tests the connection and, on clients that support it, offers to save the connection permanently for you."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Get your API key</strong> (a personal password that lets your AI act on this site). Instructions below if you don't have one yet."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Go to the Dashboard</strong> (button below) and paste your API key into the field there."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Click the &ldquo;Copy Setup Prompt&rdquo; button</strong> on the Dashboard. Your key gets substituted into the prompt automatically before it's copied."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Paste into a fresh chat</strong> with your AI (Claude, ChatGPT, Cursor, Copilot, Gemini, etc.) and send. The AI will confirm the connection works and offer to save it."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Go to the Dashboard"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="That's it. Your AI is connected. If you want to know more about how the pieces fit together, or you'd rather configure your AI manually, keep reading below &mdash; but you don't have to."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Get your API key"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="An <strong>API key</strong> is a personal password that lets your AI act on this Joomla site as YOU. Anyone with the key can do whatever your Joomla user account can do &mdash; so treat it as private. Here's how to generate one:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sClick here to open your Joomla user profile%s. It opens in a new tab. Once there, look for the tab called <strong>Joomla API Token</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="On that tab, click the <strong>Reset</strong> button. Joomla generates a long string of letters and numbers and puts it in the field below the button. This is your key."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Click the little <strong>eye icon</strong> next to the field to reveal the key, then copy the whole string."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Paste it into the field below on this page (it gets saved in your browser only, so copy buttons on this page can auto-fill it), OR paste it directly into the Dashboard's API key field if you're heading there for the easy setup."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Treat this key like a password."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Don't paste it into shared docs, screenshots, or code you'll publish. If it ever leaks, come back to the Joomla API Token tab and click Reset again &mdash; the old key becomes invalid instantly."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Paste your API key here (for one-click copying on this page)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Your key is remembered in this browser only</strong> &mdash; it never leaves your computer. Use the trash button to forget it. If you leave this blank, any copy buttons on this page will still work but you'll have to paste your key into the copied snippet manually."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Show/hide the key"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Forget the saved key"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Advanced: connect an AI manually (most people don't need this)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="This section is for people who want to configure their AI client's connection to this site by hand &mdash; usually by editing a small text file called a &ldquo;config file&rdquo;. If the Easy Setup above worked for you, you can safely ignore this whole section. If you want to bypass the setup prompt and register the connection directly in your AI client, read on."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="This site's connection URL"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="This is the address your AI client needs. You'll paste this into the client's setup along with your API key."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Pick your AI client"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="The connection URL + API key are the same for every AI &mdash; only <em>where you paste them</em> varies per client. Pick your client below for the specific instructions."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, IDE extension, or desktop host)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex supports this endpoint natively as a Streamable HTTP MCP server. First store the Joomla API key in a site-specific environment variable, then register the endpoint by environment-variable name. The key is never written into <code>config.toml</code>. If you use the copy button after pasting a key above, the copied environment command contains that key, so keep it out of shared terminals, recordings, and support tickets."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; save the key for future Codex processes"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Open a new terminal after setting a persistent Windows environment variable. Existing Codex and terminal processes cannot see it."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; set the key for this terminal (persist it in your secure shell environment if needed)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Register this Joomla site with Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Run <code>codex mcp list</code>, restart Codex (or check its MCP status UI), then call the harmless read-only <code>get_joomla_version</code> tool. This verifies initialization, authentication, tool discovery, and invocation. For a read-only connection, also enable MCP for Joomla's server-side read-only mode; client approval settings cannot override server permissions."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Invalid token on cPanel or PHP-FPM?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="The web server may be stripping the standard Authorization header. Replace the entry created above in <code>~/.codex/config.toml</code> with this block so Codex reads the same environment variable and sends it as <code>X-Joomla-Token</code>, then restart Codex."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Heads up &mdash; Claude's &ldquo;Add custom connector&rdquo; dialog won't work here."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Claude Desktop's and claude.ai's built-in &ldquo;Add custom connector&rdquo; dialog only supports a special login method called OAuth as of Aug 2026. This Joomla site uses a simpler API-key login that dialog doesn't have a field for &mdash; so filling in the dialog won't work. The Claude Desktop instructions below use a config-file edit instead. (Or just use the Easy Setup above &mdash; it works with Claude too.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Four steps: create a small helper file called a &ldquo;wrapper script&rdquo; that holds the connection command, then point Claude Desktop's config file at it, then restart Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Why a wrapper script instead of putting the connection directly in Claude Desktop's config? Claude Desktop 1.30096+ (Aug 2026) rejects config entries whose command arguments look like they contain credentials &mdash; a well-meant security feature that unfortunately blocks the direct approach. Moving the command into a small helper file gets around that (Claude Desktop just sees a plain command with no visible arguments) while keeping your API key exactly as safe as it was before &mdash; the helper file lives in your own user folder alongside Claude Desktop's own config."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="One-time prerequisite &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="These instructions assume you have Node.js installed on your computer (which comes with a command called <code>npx</code>). Most developer setups already have it; if not, install it from <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> using the LTS installer. The wrapper file below expects Node.js at the standard Windows install path <code>C:\\Program Files\\nodejs\\</code>. If you installed it somewhere else, edit that path in the wrapper file after copying."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Step 1 &mdash; create the wrapper script"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Windows only for now (Mac/Linux users, see the FAQ). Copy the block below into a new plain text file. Save it inside your user folder (<code>C:\\Users\\YOUR_WINDOWS_USERNAME\\</code>) with the filename <code>claude-mcp-joomla-{sitename}.cmd</code> where you replace <code>{sitename}</code> with a short label for your site (e.g. <code>cybersaltorg</code>). Make sure the <code>.cmd</code> extension is actually the extension, not part of the filename &mdash; in Notepad, choose &ldquo;Save as type: All Files&rdquo; so it doesn't add <code>.txt</code>. If you pasted your API key into the field at the top of this page, the copy button will substitute it for you."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Not sure what your Windows username is? Open File Explorer, navigate to <code>C:\\Users\\</code>, and look at the folder names &mdash; there's one for you."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Step 2 &mdash; open Claude Desktop's config file"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Claude Desktop's settings file lives at a predictable path per operating system. Open it with any text editor (VS Code, Notepad, TextEdit, Sublime, whatever you have):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop has a button at Settings &rarr; Developer &rarr; <strong>Edit Config</strong> that's supposed to open the file for you. If you click it and nothing happens, that's because your computer doesn't know what program to open <code>.json</code> files with. No problem &mdash; just open the file yourself with a text editor using one of the paths above. If the file doesn't exist yet, create it and use the block below as its whole contents (wrapped as <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Step 3 &mdash; add this block to Claude Desktop's config"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Paste this into <code>claude_desktop_config.json</code>. If the file already has an <code>mcpServers</code> object with other servers in it, add the <code>joomla-...</code> entry alongside them (don't paste a second <code>mcpServers</code> object). If the file is empty or missing, use the whole block below as its contents. <strong>Important:</strong> replace <code>YOUR_WINDOWS_USERNAME</code> with your actual Windows username."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="This config just points Claude Desktop at the wrapper script you created in Step 1. Your API key stays in the wrapper file, not in Claude Desktop's config."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Step 4 &mdash; fully quit and reopen Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop only reads its config file when it starts up. Close it completely &mdash; on Windows, right-click the Claude icon in the system tray (bottom-right, may need to click the small up-arrow) and choose Quit. Wait a couple of seconds, then relaunch. In any conversation, click the tools icon (or ask &ldquo;what tools do you have?&rdquo;) &mdash; the site's tools should be listed. If they're not, see Troubleshooting below."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (terminal or VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="If you use Claude Code, one terminal command wires up the connection &mdash; no config file editing. Paste your API key into the field above so the copy button below fills it in, then paste the command into a terminal and press Enter. Claude Code confirms the connection immediately and reloads."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (the web version)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="claude.ai's <strong>Add custom connector</strong> dialog has the same OAuth-only limitation as Claude Desktop, so a direct connection through claude.ai isn't currently possible for this Joomla site. If you're on claude.ai, the Easy Setup above (paste-a-prompt method) still works &mdash; Claude will read the prompt and use the connection for the current chat, though it won't be saved permanently across chats. For a permanent connection, install Claude Desktop or Claude Code and follow the instructions above."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor stores its MCP connections in a config file called <code>mcp.json</code>. Open it in a text editor, paste the block below into the <code>mcpServers</code> object, save. Cursor picks up the change without a restart in most cases."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Config file location: <code>~/.cursor/mcp.json</code> (for all your projects) or <code>.cursor/mcp.json</code> in a specific project folder (for that project only)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="ChatGPT custom connectors"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="In ChatGPT, go to Settings &rarr; <strong>Connectors</strong> &rarr; <strong>Add custom connector</strong>. Enter a memorable name (like &ldquo;My Joomla site&rdquo;), paste the URL, add the Authorization header exactly as shown below (replacing the placeholder with your actual API key), save. Then in a chat, click the connector icon and enable the new connector."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Custom connectors require a ChatGPT Team, Enterprise, or Pro plan as of Aug 2026 &mdash; the free tier can't add MCP connectors."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Other MCP-aware AI clients (Cline, Continue, GitHub Copilot in agent mode, Gemini CLI, Windsurf, mcp-cli, etc.) also work &mdash; the connection URL and API key are identical, only the exact spot where you paste them differs. We'll add specific walkthroughs for more clients over time; if you're stuck, the FAQ below has general guidance."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Copy"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Copied"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Copied (with your key)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Security &amp; sharing"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="Your API key IS the login &mdash; whoever holds it can do everything your Joomla user account can do. There's no separate login flow, no anonymous access. This is intentional and matches how the rest of Joomla's API works."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Giving MCP access to other people"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Two ways to do it &mdash; pick whichever fits:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="One key per person (most secure)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Create a Joomla user for each person, put them in a group with only the permissions you want them to have (e.g. read-only), generate a key for that user, send it to them privately. Each person has their own audit trail; you can revoke any single key without affecting the others."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="One shared key (simplest but least secure)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Create one limited user (e.g. <code>mcp-demo-guest</code>) in a read-only group, generate one key, share it more widely. Simpler to distribute; harder to know who's using it or to revoke access for just one person. Fine for a public demo; not for sensitive access."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Revoking a key"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="To make an existing key stop working immediately, go to Users &rarr; the user in question &rarr; Joomla API Token tab &rarr; click <strong>Reset</strong>. The old key becomes invalid the moment you click. Issue the new key to that person or leave them without access."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Troubleshooting"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="If a connection isn't working, run through these one at a time &mdash; they cover the vast majority of first-time setup issues."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; or &ldquo;Authentication failed&rdquo; (error 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="Your AI is reaching the site but the API key isn't right. Check: (1) the key hasn't been Reset since you copied it (each Reset invalidates the previous key); (2) the key was copied whole with no missing characters or extra spaces; (3) if you edited a config file, the word <code>Bearer </code> (with a space after) comes before the key. If you're not sure, generate a fresh key and try again."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; or &ldquo;Could not match accept header&rdquo; (error 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Older versions of MCP for Joomla (before 2.3.4) had a bug that stopped some AI clients from connecting. Update MCP for Joomla to the latest version &mdash; check Extensions &rarr; Manage &rarr; Update in your Joomla admin."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;Connected but no tools show up in the AI&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Usually one of two things: (1) the Joomla user your key belongs to is in a user group that hasn't been granted MCP permissions &mdash; go to Users &rarr; Groups and make sure they're in Super Users, Administrators, or Managers (or a custom group with MCP permissions); (2) the AI client cached an empty tool list &mdash; disconnect and reconnect the MCP server in the client to force it to re-check."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; or the URL returns an error (error 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Either the URL is wrong (double-check it &mdash; it should end with <code>/api/index.php/v1/mcp</code>) OR your Joomla site's Web Services plugin for MCP is disabled. In Joomla admin: Extensions &rarr; Manage &rarr; filter by <code>csmcpforj</code> &rarr; make sure the Web Services plugin is enabled. If it's already enabled, your site's <code>.htaccess</code> might be blocking the <code>/api/</code> path &mdash; a hosting-provider or security-plugin problem."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; or &ldquo;Malware detected&rdquo; (error 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="A security plugin on your Joomla site (RSFirewall, Admin Tools Pro, Securitycheck Pro) is blocking the MCP request. In RSFirewall, add the path <code>/api/index.php/v1/mcp</code> to the &ldquo;Skip Filtering&rdquo; list. Or temporarily disable the security plugin to confirm it's the cause. Then re-enable and allow-list the path permanently."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Claude Desktop's &ldquo;Edit Config&rdquo; button does nothing when I click it"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="That button tries to hand <code>claude_desktop_config.json</code> off to whatever program your computer opens <code>.json</code> files with. If you haven't set that up, the button silently does nothing. Workaround: open the file yourself with any text editor. Paths per operating system are listed in the Claude section under the Advanced expander above. If the file doesn't exist yet, create it and use the snippet from that section as its whole contents (wrap the snippet as <code>{&quot;mcpServers&quot;: { ... }}</code>). No permission changes needed &mdash; the file lives inside your own user folder."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="Claude's &ldquo;Add custom connector&rdquo; dialog has no field for the API key"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="That dialog only supports a special login method called OAuth as of Aug 2026 &mdash; it doesn't work with the API-key login this Joomla site uses. There's no hidden field; leaving OAuth Client ID/Secret blank does NOT switch the dialog to API-key mode. For Claude Desktop, use the wrapper-script method (in the Claude section under Advanced above). For claude.ai's web version, use the Easy Setup instead. We'll ship an API-key path here the moment Anthropic adds a field for HTTP headers to that dialog."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop shows &ldquo;Some MCP servers could not be loaded&rdquo; on startup"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (Aug 2026) tightened its config-file validation and now rejects entries whose command arguments look like they might contain credentials. This blocks the two obvious ways to configure a bearer-token MCP server directly in <code>claude_desktop_config.json</code>: the native <code>type: http</code> shape AND passing <code>mcp-remote</code> with an <code>--header &quot;Authorization: Bearer ...&quot;</code> argument. Both look right in the config file but Claude Desktop's schema validator drops them on load. <strong>Fix:</strong> use the wrapper-script method described in the Claude section under Advanced above &mdash; put the whole command in a small <code>.cmd</code> file, then have Claude Desktop's config just reference the file. Claude Desktop sees a plain command with no visible arguments and accepts it. Your API key stays exactly as safe as before &mdash; the wrapper file lives in your own user folder."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="I restarted Claude Desktop but it still doesn't see the new connection"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="On Windows, closing the Claude Desktop window just hides it to the system tray &mdash; the whole app keeps running with the OLD config loaded in memory. Clicking the taskbar icon later just brings the window back from that already-running process. Claude Desktop only re-reads its config file on a true app restart. To actually restart: right-click the Claude icon in the system tray (bottom-right corner, may need to click the small up-arrow to see hidden icons) &rarr; choose <strong>Quit</strong> &rarr; wait ~3 seconds for the process to fully exit &rarr; relaunch Claude Desktop from the Start menu. Only then will your config file changes take effect."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Frequently asked questions"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Can someone use this connection without an API key?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="No. Every request has to carry a valid API key. Requests without one are rejected. This is by design &mdash; the AI can do real actions on your site (create articles, edit users, etc.), so anonymous access would be a security disaster."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Can one Joomla user have several active API keys?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="No. Joomla stores exactly one API key per user. Clicking Reset generates a new one and invalidates the old one. If you need multiple keys (one per device, one per AI tool, etc.), create separate Joomla users."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Is there a limit on how much I can use it?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="MCP for Joomla itself has no rate limit. Normal hosting limits (PHP memory, MariaDB connections, etc.) apply. If you're driving heavy traffic (large batch operations across many sites), talk to your hosting provider about bumping PHP-FPM concurrency."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Do I need to open any firewall ports or configure anything special?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="No. MCP just uses standard HTTPS on port 443. If your site is already publicly reachable at <code>https://yoursite.com/</code>, the MCP endpoint is reachable from any AI client on the internet with no extra setup."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="How do I change (rotate) my API key on a regular schedule?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="No automatic scheduler &mdash; you rotate manually when you want. Go to Users &rarr; the user &rarr; Joomla API Token tab &rarr; click Reset. Then update the AI client's config with the new key. Good habit: rotate any key that's ever appeared in a screenshot, log, or bug report."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="I use an AI client not listed above &mdash; will it work?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Almost certainly yes, as long as it supports the standard MCP over HTTPS and lets you add a custom Authorization header. The URL and API key are the same everywhere &mdash; only the setup UI in the client differs. Common clients we know work but haven't yet written specific walkthroughs for: Cline, Continue.dev, GitHub Copilot (in agent mode), Gemini CLI, Windsurf, Zed editor, mcp-cli, MCP Inspector, LibreChat, Open WebUI (via <code>mcpo</code> bridge), and various Ollama-based agents."

