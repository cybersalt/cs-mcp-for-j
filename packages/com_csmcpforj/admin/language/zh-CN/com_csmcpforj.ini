COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_LABEL="目录"
COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_DESC="MCP 附加组件目录浏览器的设置。"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_LABEL="目录端点 URL"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_DESC="获取 MCP 附加组件目录的地址。除非您运行私有的目录镜像，否则请保留默认值；只填基础 URL 时会自动加上 /catalog.json。"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="目录缓存时间（小时）"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="获取到的 catalog.json 在重新获取前缓存多长时间。目录页上的手动刷新按钮会绕过此设置。范围 1&ndash;168（一周）。"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="显示不可用的 Pro 附加组件"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="即使您目前没有 Pro 会员资格，也在目录中显示 Pro 附加组件。便于浏览有哪些可用；设为“否”则完全隐藏它们。"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="会员资格重新检查间隔（秒）"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="仪表盘多久向 cybersalt.com 重新确认一次关联的电子邮件是否仍有 Pro 访问权限。86400 = 每天一次（推荐）。最小 60，最大 604800 = 每周一次。"

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="MCP 服务器"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="MCP 端点的服务器端控制。影响 MCP 客户端能看到和调用的内容。"
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="只读模式"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="设为“是”时，MCP 端点只公布并接受那些在 MCP ToolAnnotations 中声明为只读的工具（list_*、get_*、read_*、check_*、validate_*、fetch_*，以及 joomla_update_healthcheck）。适合让 AI 客户端浏览网站、但不能修改任何内容的场景。写入操作会返回错误，说明服务器处于只读模式。此设置是一个下限：MCP 客户端也可以在端点 URL 上加 ?read_only=1 进一步收紧，但不能在设为“是”的网站上解锁写入。"

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="录屏隐私"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="控制仪表盘上的机密模糊保护（提示词预览中的 Joomla API 令牌、Pro 会员电子邮件）。模糊默认开启；这些选项调整悬停显示的行为，以免在屏幕共享或录屏时随手一划鼠标就意外泄露机密。"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="悬停显示延迟（秒）"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="鼠标指针需要在模糊的机密上停留多少秒才会显示它。停留期间，机密旁边会出现一个小的倒计时标记，让您知道计时正在进行。移开鼠标会取消显示并重置计时 &mdash; 下一次悬停会重新开始完整的倒计时。设为 0 表示悬停时立即显示（去掉防误触保护，恢复传统的一悬停即显示行为）。默认 3 秒。"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="显示后自动隐藏（秒）"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="机密通过悬停显示后，可见多少秒后自动重新模糊 &mdash; 即使鼠标仍停在上面。这是为 &ldquo;我看了一眼、读完了、然后走神了&rdquo; 这种情况准备的双重保险，否则无人看管的浏览器可能会一直暴露机密。无论此设置如何，移开鼠标总是会立即重新模糊。设为 0 表示禁用自动隐藏（显示后的机密保持可见，直到您移开鼠标）。默认 8 秒 &mdash; 足够从容地读完一个完整的 base64 令牌，又足够短，不会让无人看管的会话暴露机密。"

