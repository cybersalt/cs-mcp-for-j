COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>获取您的 API 密钥</strong>（一个让 AI 能在此网站上操作的个人密码）。如果您还没有，请看下面的说明。"
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>前往仪表盘</strong>（下方按钮），把您的 API 密钥粘贴到那里的字段中。"
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>点击仪表盘上的 &ldquo;复制设置提示词&rdquo; 按钮</strong>。复制之前，您的密钥会自动填入提示词。"
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>粘贴到与 AI 的新对话中</strong>（Claude、ChatGPT、Cursor、Copilot、Gemini 等），然后发送。AI 会确认连接可用，并主动提出保存它。"
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="前往仪表盘"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="就这么简单。您的 AI 已经连接上了。如果您想进一步了解各部分如何配合，或者更愿意手动配置 AI，请继续往下阅读 &mdash; 但这不是必需的。"

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="获取您的 API 密钥"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="<strong>API 密钥</strong> 是一个个人密码，让您的 AI 能以您的身份在此 Joomla 网站上操作。任何拿到密钥的人都能做您的 Joomla 用户账户能做的任何事 &mdash; 所以请把它当作私密信息。生成方法如下："
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%s点击这里打开您的 Joomla 个人资料%s。它会在新标签页中打开。打开后，找到名为 <strong>API 令牌</strong> 的标签页。"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="在该标签页上，点击 <strong>重置</strong> 按钮。Joomla 会生成一长串字母和数字，并放在按钮下方的字段中。这就是您的密钥。"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="点击字段旁边的小 <strong>眼睛图标</strong> 显示密钥，然后复制整个字符串。"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="把它粘贴到此页下方的字段中（它只保存在您的浏览器里，这样此页上的复制按钮就能自动填入），或者，如果您要去仪表盘进行简单设置，直接把它粘贴到仪表盘的 API 密钥字段中。"

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="请像对待密码一样对待此密钥。"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="不要把它粘贴到共享文档、截图或您要公开发布的代码中。如果它泄露了，请回到 API 令牌 标签页再点一次 重置 &mdash; 旧密钥会立即失效。"

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="在此粘贴您的 API 密钥（用于此页上的一键复制）"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>您的密钥只保存在此浏览器中</strong> &mdash; 它永远不会离开您的电脑。使用垃圾桶按钮可以清除它。如果留空，此页上的复制按钮仍然可用，但您需要手动把密钥粘贴到复制出来的片段中。"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="显示/隐藏密钥"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="清除已保存的密钥"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ 高级：手动连接 AI（大多数人不需要）"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="此部分适合想要手动配置 AI 客户端与此网站连接的人 &mdash; 通常是编辑一个叫 &ldquo;配置文件&rdquo; 的小文本文件。如果上面的简单设置对您有效，您完全可以忽略整个部分。如果您想跳过设置提示词，直接在 AI 客户端中注册连接，请继续阅读。"

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="此网站的连接 URL"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="这是您的 AI 客户端需要的地址。您需要把它和 API 密钥一起粘贴到客户端的设置中。"

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="选择您的 AI 客户端"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="连接 URL 和 API 密钥对每个 AI 都是一样的 &mdash; 只有 <em>粘贴的位置</em> 因客户端而异。在下面选择您的客户端查看具体说明。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex（CLI、IDE 扩展或桌面应用）"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex 原生支持把此端点作为 Streamable HTTP MCP 服务器使用。先把 Joomla API 密钥保存在一个专用于此网站的环境变量中，然后按环境变量名称注册端点。密钥永远不会写入 <code>config.toml</code>。如果您在上面粘贴了密钥后使用复制按钮，复制出来的环境变量命令会包含该密钥，所以请不要让它出现在共享终端、录屏和支持工单中。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; 为以后的 Codex 进程保存密钥"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="设置持久的 Windows 环境变量后，请打开一个新终端。已经在运行的 Codex 和终端进程看不到它。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; 为此终端设置密钥（如有需要，请在您安全的 shell 环境中持久保存）"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. 在 Codex 中注册此 Joomla 网站"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="运行 <code>codex mcp list</code>，重启 Codex（或查看它的 MCP 状态界面），然后调用无害的只读工具 <code>get_joomla_version</code>。这会验证初始化、认证、工具发现和调用。如果要只读连接，还请启用 MCP for J 的服务器端只读模式；客户端的审批设置无法覆盖服务器权限。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="在 cPanel 或 PHP-FPM 上提示令牌无效？"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Web 服务器可能会去掉标准的 Authorization 标头。请把 <code>~/.codex/config.toml</code> 中上面创建的条目替换为这段内容，让 Codex 读取同一个环境变量并以 <code>X-Joomla-Token</code> 发送，然后重启 Codex。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="注意 &mdash; Claude 的 &ldquo;添加自定义连接器&rdquo; 对话框需要 OAuth，而此网站上 OAuth 已关闭。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Claude Desktop 和 claude.ai 内置的 &ldquo;添加自定义连接器&rdquo; 对话框通过登录（OAuth）连接，没有填写 API 密钥的字段。Super User 可以在 MCP for J 的选项中开启 OAuth 登录；开启后该对话框就可以使用。在此之前，下面的 Claude Desktop 说明改用编辑配置文件的方式。（或者使用上面的简单设置 &mdash; 它同样适用于 Claude。）"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="四个步骤：创建一个叫 &ldquo;包装脚本&rdquo; 的小辅助文件来保存连接命令，然后让 Claude Desktop 的配置文件指向它，再重启 Claude Desktop。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="为什么要用包装脚本，而不是直接把连接写进 Claude Desktop 的配置？Claude Desktop 1.30096+（2026 年 8 月）会拒绝那些命令参数看起来包含凭据的配置条目 &mdash; 这是一个出于好意的安全功能，但不巧挡住了直接的做法。把命令移到一个小辅助文件中就能绕过它（Claude Desktop 只看到一条没有可见参数的普通命令），同时您的 API 密钥和以前一样安全 &mdash; 辅助文件就放在您自己的用户文件夹中，和 Claude Desktop 自己的配置在一起。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="一次性前提条件 &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="这些说明假设您的电脑上已安装 Node.js（它附带一个叫 <code>npx</code> 的命令）。大多数开发环境都已经有了；如果没有，请从 <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> 使用 LTS 安装程序安装。下面的包装文件假定 Node.js 位于 Windows 的标准安装路径 <code>C:\Program Files\nodejs\</code>。如果您装在别的地方，复制后请在包装文件中修改该路径。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="第 1 步 &mdash; 创建包装脚本"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="目前仅适用于 Windows（Mac/Linux 用户请看常见问题）。把下面的内容复制到一个新的纯文本文件中。把它保存在您的用户文件夹（<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>）中，文件名为 <code>claude-mcp-joomla-{sitename}.cmd</code>，其中把 <code>{sitename}</code> 替换为您网站的简短标签（例如 <code>cybersaltorg</code>）。请确保 <code>.cmd</code> 确实是扩展名，而不是文件名的一部分 &mdash; 在记事本中，选择 &ldquo;保存类型：所有文件&rdquo;，这样它就不会加上 <code>.txt</code>。如果您已在此页顶部的字段中粘贴了 API 密钥，复制按钮会自动帮您填入。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="不确定您的 Windows 用户名？打开文件资源管理器，进入 <code>C:\Users\</code>，看看文件夹名称 &mdash; 其中有一个就是您的。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="第 2 步 &mdash; 打开 Claude Desktop 的配置文件"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Claude Desktop 的设置文件在每个操作系统上都位于固定的路径。用任何文本编辑器打开它（VS Code、记事本、TextEdit、Sublime，手头有什么都行）："
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop 在 Settings &rarr; Developer 中有一个 <strong>Edit Config</strong> 按钮，本应帮您打开该文件。如果您点击后什么也没发生，那是因为您的电脑不知道用什么程序打开 <code>.json</code> 文件。没关系 &mdash; 用文本编辑器按上面的某个路径自己打开即可。如果文件还不存在，请创建它，并把下面的内容作为文件的全部内容（包在 <code>{&quot;mcpServers&quot;: { ... }}</code> 中）。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="第 3 步 &mdash; 把这段内容添加到 Claude Desktop 的配置中"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="把它粘贴到 <code>claude_desktop_config.json</code> 中。如果文件中已经有一个包含其他服务器的 <code>mcpServers</code> 对象，请把 <code>joomla-...</code> 条目加在它们旁边（不要再粘贴第二个 <code>mcpServers</code> 对象）。如果文件是空的或不存在，请把下面的整段内容作为它的内容。<strong>重要：</strong>把 <code>YOUR_WINDOWS_USERNAME</code> 替换为您真实的 Windows 用户名。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="这个配置只是让 Claude Desktop 指向您在第 1 步创建的包装脚本。您的 API 密钥保存在包装文件中，而不在 Claude Desktop 的配置里。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="第 4 步 &mdash; 完全退出并重新打开 Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop 只在启动时读取配置文件。请完全关闭它 &mdash; 在 Windows 上，右键点击系统托盘中的 Claude 图标（右下角，可能需要先点一下小的向上箭头），选择 Quit。等几秒钟，然后重新启动。在任意对话中点击工具图标（或者问 &ldquo;你有哪些工具？&rdquo;） &mdash; 应该会列出此网站的工具。如果没有，请查看下面的故障排除。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code（终端或 VS Code）"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="如果您使用 Claude Code，一条终端命令就能建立连接 &mdash; 无需编辑配置文件。把您的 API 密钥粘贴到上面的字段中，让下面的复制按钮自动填入，然后把命令粘贴到终端并按回车。Claude Code 会立即确认连接并重新加载。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai（网页版）"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="claude.ai 的 <strong>添加自定义连接器</strong> 对话框通过登录（OAuth）连接，而此网站上该功能已关闭。Super User 可以在 MCP for J 的选项中开启它，然后 claude.ai 就能获得永久连接。在此之前，上面的简单设置（粘贴提示词的方法）只对当前对话有效。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor 把它的 MCP 连接保存在一个叫 <code>mcp.json</code> 的配置文件中。用文本编辑器打开它，把下面的内容粘贴到 <code>mcpServers</code> 对象中，然后保存。大多数情况下，Cursor 无需重启就会识别更改。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="配置文件位置：<code>~/.cursor/mcp.json</code>（用于您的所有项目）或某个项目文件夹中的 <code>.cursor/mcp.json</code>（仅用于该项目）。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="ChatGPT 自定义 MCP 服务器"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="ChatGPT 的 <strong>添加自定义 MCP 服务器</strong> 对话框只能通过登录（OAuth）或无认证方式连接；它没有填写 API 密钥或标头的字段。此网站上 OAuth 登录已关闭，所以 ChatGPT 暂时无法连接。Super User 可以在 MCP for J 的选项中开启它。在此之前，请使用 Codex（OpenAI 的编程代理），它会从环境变量中发送 API 密钥。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="添加自定义 MCP 服务器需要付费的 ChatGPT 套餐。Plus 可以使用（2026 年 10 月确认）。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI 和 Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Gemini CLI（Google 的终端 AI 助手）和 Gemini Code Assist 扩展（用于 VS Code / JetBrains）读取同一个 MCP 配置文件。两个步骤：编辑该文件，把此 Joomla 网站添加为 MCP 服务器，然后重启 Gemini。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="您可以全局添加服务器（这样每个 Gemini 会话都能看到它），也可以只在某个项目文件夹中添加。片段完全相同 &mdash; 只是文件位置不同。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. 打开（或创建）您的 Gemini 设置文件。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="从下面两个位置中选择一个："
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="全局（所有项目）："
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="仅限项目："
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json（在项目文件夹中）"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. 把这段内容粘贴到文件中。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="如果文件中已经有 <code>mcpServers</code> 部分，请把 <code>&quot;joomla-...&quot;</code> 条目加在现有部分里面 &mdash; 不要重复外层的 <code>mcpServers</code> 键。如果文件是空的或全新的，请原样粘贴整个片段。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini 对基于 HTTP 的 MCP 服务器（比如这个）使用 <code>httpUrl</code> &mdash; 这与 Cursor 的 <code>url</code> 键不同。请准确复制这个片段，不要沿用 Cursor 的。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. 重启 Gemini。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="在终端中退出并重新启动 <code>gemini</code>，或者重新加载 VS Code / JetBrains 窗口。在 Gemini CLI 中输入 <code>/mcp</code> 查看已连接的服务器，确认您的 Joomla 网站在列表中。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="截至 2026 年 8 月，<code>gemini.google.com</code> 网页应用不支持自定义 MCP 服务器 &mdash; 本教程只涵盖 Gemini CLI 和 Gemini Code Assist。如果 Google 以后在网页界面中加入支持，我们会在这里说明。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="其他支持 MCP 的 AI 客户端（Cline、Continue、agent 模式下的 GitHub Copilot、Windsurf、mcp-cli 等）同样可用 &mdash; 连接 URL 和 API 密钥完全相同，只是粘贴的具体位置不同。我们会陆续为更多客户端添加具体教程；如果遇到困难，下面的常见问题中有通用的指导。"

COM_CSMCPFORJ_SETUPGUIDE_COPY="复制"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="已复制"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="已复制（包含您的密钥）"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="安全 &amp; 共享"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="您的 API 密钥就是登录凭据 &mdash; 持有它的人可以做您的 Joomla 用户账户能做的一切。不存在匿名访问。如果您开启了 <strong>OAuth 登录</strong>，AI 应用也可以通过把您带到此网站的普通登录页面来连接；之后它会以登录的那个账户的身份操作，权限与该账户完全相同，直到您在仪表盘上断开它的连接。"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="向其他人提供 MCP 访问权限"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="有两种方法 &mdash; 选择适合您的："
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="每人一个密钥（最安全）"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="为每个人创建一个 Joomla 用户，把他们放进一个只拥有您希望他们拥有的权限的用户组（例如只读），为该用户生成密钥，然后私下发给对方。每个人都有自己的审计记录；您可以撤销任何一个密钥而不影响其他人。"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="一个共享密钥（最简单但最不安全）"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="在只读用户组中创建一个受限用户（例如 <code>mcp-demo-guest</code>），生成一个密钥，然后更广泛地分享。分发起来更简单；但更难知道谁在使用，也更难只撤销某一个人的访问权限。适合公开演示；不适合敏感访问。"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="撤销密钥"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="要让现有密钥立即失效，请前往 用户管理 &rarr; 相应的用户 &rarr; API 令牌 标签页 &rarr; 点击 <strong>重置</strong>。点击的那一刻旧密钥就会失效。把新密钥发给那个人，或者让他们不再有访问权限。"

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="故障排除"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="先找到您要连接的应用类型，然后打开与您看到的情况相符的问题。错误消息和防火墙拦截可能出现在任何应用中，所以它们单独放在最后一组。"

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; 或 &ldquo;Authentication failed&rdquo;（错误 401）"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="您的 AI 能访问到网站，但 API 密钥不对。请检查：(1) 复制之后密钥没有被重置过（每次重置都会让之前的密钥失效）；(2) 密钥是完整复制的，没有缺少字符或多出空格；(3) 如果您编辑了配置文件，密钥前面要有 <code>Bearer </code> 这个词（后面带一个空格）。如果不确定，请生成一个新密钥再试一次。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; 或 &ldquo;Could not match accept header&rdquo;（错误 406）"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="旧版 MCP for J（2.3.4 之前）有一个缺陷，导致部分 AI 客户端无法连接。请把 MCP for J 更新到最新版本 &mdash; 在 Joomla 后台查看 系统设置 &rarr; 扩展升级 &rarr; 扩展管理。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;已连接，但 AI 中没有显示任何工具&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="通常是以下三种情况之一：(1) 用户所在的用户组没有 <strong>Web Services 登录</strong> &mdash; 请在 系统设置 &rarr; 全局配置 &rarr; 权限 中设置（默认只有 Super User 拥有）；(2) 该用户组没有 MCP 权限 &mdash; Super User 总是有，Administrator 通过 Joomla 的默认设置也有，但 Manager 和其他用户组需要在此组件的 选项 &rarr; 权限 中获得“使用 MCP 端点”（要进行修改还需要“通过 MCP 端点写入”）；(3) AI 客户端缓存了一个空的工具列表 &mdash; 在客户端中断开并重新连接 MCP 服务器，强制它重新检查。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; 或 URL 返回错误（错误 404）"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="要么 URL 不对（请再检查一遍 &mdash; 它应该以 <code>/api/index.php/v1/mcp</code> 结尾），要么您的 Joomla 网站中用于 MCP 的 Web Services 插件被禁用了。在 Joomla 后台：系统设置 &rarr; 功能管理 &rarr; 扩展管理 &rarr; 搜索 <code>csmcpforj</code> &rarr; 确认 Web Services 插件已启用。如果它已经启用，可能是网站的 <code>.htaccess</code> 拦截了 <code>/api/</code> 路径 &mdash; 这是主机商或安全插件的问题。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; 或 &ldquo;Malware detected&rdquo;（错误 403）"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="您 Joomla 网站上的某个安全插件（RSFirewall、Admin Tools Pro、Securitycheck Pro）拦截了 MCP 请求。在 RSFirewall 中添加两个例外：<code>csmcpforj_oauth</code>，以及作为正则表达式的 <code>api\/index\.php\/v1\/mcp</code>（第一个用于登录）。在其他插件中，放行 <code>/api/index.php/v1/mcp</code>、<code>/.well-known/oauth-protected-resource</code>、<code>/.well-known/oauth-authorization-server</code> 以及包含 <code>csmcpforj_oauth</code> 的 URL。要确认原因，可以暂时关闭安全插件，再试一次，然后在加好例外后重新开启它。仪表盘上的 <strong>检查连接</strong> 按钮会显示哪个地址被拦截了。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="点击 Claude Desktop 的 &ldquo;Edit Config&rdquo; 按钮没有任何反应"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="该按钮会尝试把 <code>claude_desktop_config.json</code> 交给您电脑上用来打开 <code>.json</code> 文件的程序。如果您没有设置过，按钮就会悄无声息地什么都不做。解决办法：用任意文本编辑器自己打开该文件。各操作系统的路径列在上面 高级 展开区中的 Claude 部分。如果文件还不存在，请创建它，并把该部分的片段作为文件的全部内容（把片段包在 <code>{&quot;mcpServers&quot;: { ... }}</code> 中）。不需要更改任何权限 &mdash; 该文件就在您自己的用户文件夹中。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="Claude 的 &ldquo;Add custom connector&rdquo; 或 ChatGPT 的 &ldquo;Add custom MCP server&rdquo; 对话框中没有填写 API 密钥的字段"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="这些对话框是为通过登录（OAuth）连接而设计的；没有地方可以粘贴 MCP for J 的 API 密钥。此网站的 OAuth 登录已关闭。Super User 可以在 组件设置 &rarr; MCP for J &rarr; 选项 &rarr; <strong>OAuth 登录</strong> 中开启它，然后两个对话框都能使用。在此之前：Claude Desktop 可以使用上面的包装脚本方法，claude.ai 可以使用简单设置，ChatGPT 用户可以使用 Codex。"

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop 启动时显示 &ldquo;Some MCP servers could not be loaded&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+（2026 年 8 月）收紧了配置文件验证，现在会拒绝那些命令参数看起来可能包含凭据的条目。这挡住了在 <code>claude_desktop_config.json</code> 中直接配置 bearer 令牌 MCP 服务器的两种常见方式：原生的 <code>type: http</code> 写法，以及给 <code>mcp-remote</code> 传一个 <code>--header &quot;Authorization: Bearer ...&quot;</code> 参数。两者在配置文件中看起来都没问题，但 Claude Desktop 的架构验证器在加载时会丢弃它们。<strong>解决办法：</strong>使用上面 高级 部分中 Claude 一节介绍的包装脚本方法 &mdash; 把整条命令放进一个小的 <code>.cmd</code> 文件，然后让 Claude Desktop 的配置只引用这个文件。Claude Desktop 看到的是一条没有可见参数的普通命令，于是接受它。您的 API 密钥和以前一样安全 &mdash; 包装文件就在您自己的用户文件夹中。"

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="我重启了 Claude Desktop，但它仍然看不到新的连接"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="在 Windows 上，关闭 Claude Desktop 窗口只是把它隐藏到系统托盘 &mdash; 整个应用仍在运行，内存中加载的还是旧配置。之后点击任务栏图标，只是把窗口从这个仍在运行的进程中调出来。Claude Desktop 只有在真正重启应用时才会重新读取配置文件。真正重启的方法：右键点击系统托盘中的 Claude 图标（右下角，可能需要点一下小的向上箭头才能看到隐藏的图标） &rarr; 选择 <strong>Quit</strong> &rarr; 等待约 3 秒让进程完全退出 &rarr; 从开始菜单重新启动 Claude Desktop。只有这样，您对配置文件的修改才会生效。"

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="常见问题"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="有人能不用 API 密钥就使用这个连接吗？"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="不能。每个请求都必须带有有效的 API 密钥，或者在开启了 OAuth 登录时带有 OAuth 访问令牌。没有的请求会被拒绝。这是有意的设计 &mdash; AI 可以在您的网站上执行真实的操作（创建文章、编辑用户等），所以匿名访问会是一场安全灾难。"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="一个 Joomla 用户可以同时拥有多个有效的 API 密钥吗？"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="不可以。Joomla 为每个用户只保存一个 API 密钥。点击重置会生成新密钥，并让旧密钥失效。如果您需要多个密钥（每台设备一个、每个 AI 工具一个等），请创建不同的 Joomla 用户。"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="使用量有限制吗？"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="MCP for J 本身没有速率限制。普通的主机限制（PHP 内存、MariaDB 连接数等）仍然适用。如果您的流量很大（跨多个网站的大批量操作），请联系您的主机商提高 PHP-FPM 的并发数。"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="我需要开放防火墙端口或做什么特殊配置吗？"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="不需要。MCP 只使用 443 端口上的标准 HTTPS。如果您的网站已经可以通过 <code>https://yoursite.com/</code> 公开访问，那么互联网上的任何 AI 客户端都可以访问 MCP 端点，无需额外设置。"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="如何定期更换（轮换）我的 API 密钥？"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="没有自动计划 &mdash; 您可以在需要时手动轮换。前往 用户管理 &rarr; 该用户 &rarr; API 令牌 标签页 &rarr; 点击 重置。然后用新密钥更新 AI 客户端的配置。好习惯：凡是出现在截图、日志或错误报告中的密钥，都要轮换。"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="我使用的 AI 客户端不在上面的列表中 &mdash; 它能用吗？"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="几乎肯定可以，只要它支持基于 HTTPS 的标准 MCP，并且允许您添加自定义 Authorization 标头，或者能通过 OAuth 登录（在选项中开启 OAuth 登录）。URL 在哪里都一样 &mdash; 只是客户端中的设置界面不同。我们知道可以使用、但还没有写分步教程的客户端：Continue.dev、Windsurf、Zed 编辑器、mcp-cli、MCP Inspector、LibreChat、Open WebUI（通过 <code>mcpo</code> 桥接），以及各种基于 Ollama 的代理。"

