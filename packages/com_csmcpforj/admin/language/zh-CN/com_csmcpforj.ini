COM_CSMCPFORJ_FIREWALL_HOST_NOTE="主机运行的防火墙也可能造成拦截：o2switch TigerProtect 会返回 503，Imunify360、ModSecurity 或 Cloudflare 的规则会返回 403。请让主机商放行上面的地址，或者为 claude.ai 放行 Anthropic 的服务器（<code>160.79.104.0/21</code>）。<strong>Cloudflare</strong>：Browser Integrity Check 和 Security Level 可能会拦截应用的服务器。添加一条 WAF 自定义规则（Security &rarr; WAF &rarr; Custom rules），对 URI 路径包含 <code>/api/index.php/v1/mcp</code> 或 <code>/.well-known/oauth-</code>、或者查询字符串包含 <code>csmcpforj_oauth</code> 的请求执行 <strong>Skip</strong> 操作，并勾选 <em>Browser Integrity Check</em> 和 <em>Security Level</em>。Bot Fight Mode 无法用规则跳过，所以如果它造成拦截，请把它关掉。"

