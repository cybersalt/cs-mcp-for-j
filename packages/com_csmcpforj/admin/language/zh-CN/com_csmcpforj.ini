; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="谁可以使用此端点？"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="权限依据拥有该 API 令牌的 Joomla 用户账户进行检查。MCP 客户端（Codex、Claude、Cursor、Cline、ChatGPT、Copilot、Gemini、curl 或其他任何客户端）只是中转 &mdash; 同一个令牌在任何客户端中的表现都完全相同。"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="重要："
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="生成令牌的人通过 MCP 端点获得的权限，与他们在 Joomla 后台其他地方拥有的权限相同。只为您信任能直接执行这些操作的用户生成令牌。"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Joomla 用户组"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="开箱即用？"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="原因"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="是"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="需要明确授权"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Super User 在 Joomla 中总是能通过所有权限检查。"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="通过 Joomla 的默认权限拥有 core.manage，MCP 权限检查对读取和写入工具都接受它（修改权限、扩展、插件设置或 Joomla 本身的工具仍然需要 Super User） &mdash; 但该用户组仍需要 <strong>Web Services 登录</strong> 权限，Joomla 才会允许它进行认证。"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="默认没有任何 MCP 权限。请在 系统设置 &rarr; 全局配置 &rarr; 权限 中为该用户组授予 <strong>Web Services 登录</strong>，然后在此组件的 <strong>选项 &rarr; 权限</strong> 中授予“使用 MCP 端点”以及（可选）“通过 MCP 端点写入”。"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="需要 Web Services 登录"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="在这些规则生效之前："
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla 用一个单独的权限 <strong>Web Services 登录</strong>（<code>core.login.api</code>）控制整个 API，并且 <strong>默认只有 Super User 拥有它</strong>。其他任何用户组 &mdash; 包括 Administrator 和 Manager &mdash; 在获得授权之前，调用每个工具都会得到 <code>403 Forbidden</code>，无论它们在后台能做什么。请在 <strong>系统设置 &rarr; 全局配置 &rarr; 权限</strong> 中为用户组设置，而不是在此组件中设置。"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / 自定义用户组"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="请在 系统设置 &rarr; 全局配置 &rarr; 权限 中为该用户组授予 <strong>Web Services 登录</strong>，然后在此组件的 <strong>选项 &rarr; 权限</strong> 中授予“使用 MCP 端点”以及（可选）“通过 MCP 端点写入”。"

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="将 AI 助手连接到此网站"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="有两种方法。第一种（复制粘贴提示词）最简单 &mdash; 不需要任何客户端配置，并且在 AI 确认连接成功后，它通常会主动提出帮您把此网站安装为永久连接器，无需手动编辑 JSON。第二种适合喜欢直接编辑客户端配置的用户。"

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="复制设置提示词（推荐）"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="把设置提示词粘贴到您的 AI 助手中"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="不需要任何客户端配置。把下面的提示词复制到与 AI 助手（Codex、Claude、Cursor、ChatGPT、Copilot、Gemini 等）的新对话中。AI 会运行一次 curl 测试，确认连接，并且 &mdash; 在支持的客户端上 &mdash; 主动提出帮您把连接设为永久，无需编辑 JSON 文件，也无需记住终端命令。"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="额外好处："
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="如果您的 AI 客户端有 shell 工具（Codex、Claude Code、Cursor Composer、Cline、Continue、GitHub Copilot agent 模式等），提示词中包含自动安装的选项。AI 确认连接可用后，只要说 &lsquo;make it permanent&rsquo;（设为永久），它就会运行适合该客户端的命令来注册 MCP 服务器（例如 <code>codex mcp add</code> 或 <code>claude mcp add</code>）。重启客户端后，此网站会在每次对话中以原生 MCP 工具的形式出现 &mdash; 再也不需要提示词。"
