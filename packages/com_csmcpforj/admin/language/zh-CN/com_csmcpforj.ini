COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="在 个人资料 中生成 Joomla API 令牌（链接在右侧）。"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="点击下方的 &lsquo;复制提示词&rsquo;。"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="把它粘贴到与 AI 助手的新对话中。如果您跳过了第 2 步，请先把 <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> 替换为您的真实令牌。"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="发送。AI 会测试连接，并在支持的客户端上主动提出把连接设为永久。"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="此提示词适用于任何带有 shell/终端工具的 AI 客户端：<strong>Codex</strong>、Claude Code、Cursor Composer、Cline、Continue、GitHub Copilot（agent 模式）、Gemini CLI、Windsurf、mcp-cli 等。它不适用于没有 shell 访问的纯网页聊天界面（claude.ai、chatgpt.com、gemini.google.com） &mdash; 对于这些，请使用 MCP 连接器 标签页。"

