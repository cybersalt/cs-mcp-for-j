COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="OAuth 登录"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="让 AI 应用通过把您带到此网站的登录页面来连接，而不必由您把 API 密钥复制给它们。ChatGPT（&ldquo;Add custom MCP server&rdquo;）和 claude.ai / Claude Desktop（&ldquo;Add custom connector&rdquo;）只能通过这种方式连接。使用 API 密钥的连接无论如何都能继续工作。"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="启用 OAuth 登录"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="开启后，您把此网站的 MCP 地址粘贴到 AI 应用中，应用会打开此网站的登录页面，您用平常的用户名和密码登录，然后点击“允许”。之后应用会以您的身份操作，权限与您在此网站上的权限完全相同。已连接的应用会列在仪表盘上，每一个都可以断开。关闭此选项会立即断开所有应用。"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="访问令牌有效期（秒）"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="每个访问令牌在应用自动续期之前的有效时长。默认 3600（一小时）。范围 300 到 86400。"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="保持登录（天）"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="应用在用户无需重新登录的情况下可以持续续期多久。每次续期都会重新计时。默认 30。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="通过登录连接 AI 应用"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="有些 AI 应用（包括 ChatGPT 和 claude.ai）只能通过把您带到网站的登录页面来连接网站。此网站上该功能已关闭，所以这些应用暂时无法连接。在选项中开启 <strong>OAuth 登录</strong> 即可允许。使用 API 密钥的连接无论如何都能继续工作。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="打开选项以开启"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="不需要 API 密钥。您唯一需要复制的是此网站的 <strong>端点 URL</strong>。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="正在检查 AI 应用能否找到此网站的登录页面&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>就绪。</strong>AI 应用可以找到此网站的登录页面。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>未就绪。</strong>AI 应用找不到此网站的登录页面，因此将无法连接。要解决这个问题，请在 系统设置 &rarr; 全局配置 中开启 <strong>启用 URL 重写(rewriting)</strong>，并确保网站的 .htaccess 文件已就位。设置指南的故障排除部分有详细说明。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_HEADING="已连接的应用"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_NONE="还没有连接任何 AI 应用。有人登录并点击“允许”后，应用就会出现在这里。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_APP="应用"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_USER="登录身份"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_CONNECTED="连接时间"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_LAST_USED="最后使用"
COM_CSMCPFORJ_DASHBOARD_OAUTH_REVOKE="断开连接"
COM_CSMCPFORJ_OAUTH_REVOKED="应用已断开连接。它在下一次请求时就会失去访问权限，需要重新获得允许才能再次连接。"
COM_CSMCPFORJ_OAUTH_REVOKE_NOTHING="该应用没有可断开的有效访问权限。"
COM_CSMCPFORJ_ACTIONLOG_OAUTH_CONSENT="用户 <a href=&quot;{accountlink}&quot;>{username}</a> 将应用 &ldquo;{title}&rdquo; 连接到了 MCP for J（OAuth）"
COM_CSMCPFORJ_ACTIONLOG_OAUTH_REVOKE="用户 <a href=&quot;{accountlink}&quot;>{username}</a> 将应用 &ldquo;{title}&rdquo; 从 MCP for J 断开了连接（OAuth）"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="通过登录连接（最简单）"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="没有需要复制的 API 密钥。在您的 AI 应用中添加一个连接器，并粘贴此网站的 <strong>端点 URL</strong>（见下方）。当您点击 Connect 时，应用会自动打开此网站的登录页面：用您在此网站的用户名和密码登录，然后点击 <strong>允许</strong>。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai 和 Claude Desktop：</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>。起一个名字，粘贴端点 URL，然后点击 Continue。保持 <em>Sign in now</em>；OAuth 客户端选择 <em>Use Claude's published identity</em> 或 <em>Register automatically</em> 都可以。不要添加请求标头。点击 Add，然后点击 <strong>Connect</strong>。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT：</strong> 左侧边栏中的 <strong>Plugins</strong> &rarr; <strong>Add</strong>（右上角） &rarr; <strong>Add custom MCP server</strong>。起一个名字，粘贴端点 URL，Authentication 保持为 <strong>OAuth</strong>，勾选复选框，点击 <strong>Create as a plugin</strong>，然后点击 <strong>Connect</strong>。需要付费的 ChatGPT 套餐（Plus 可以）。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code：</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>，然后输入 <code>/mcp</code>，选择该服务器并选择 <strong>Authenticate</strong>。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot：</strong> 命令面板 &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; 粘贴端点 URL。VS Code 会要求您登录。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor：</strong> 在 <code>mcp.json</code> 的 <code>mcpServers</code> 下添加 <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code>（不加标头），然后在 Settings &rarr; MCP 中点击该服务器旁边的 <strong>Login</strong>。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI：</strong> 在 <code>settings.json</code> 中为该服务器添加 <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code>，然后运行 <code>/mcp auth &lt;name&gt;</code>。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex：</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>。Codex 会自动打开登录页面（如果没有，请运行 <code>codex mcp login joomla</code>）。请在几分钟内，在与 Codex 同一台电脑上的浏览器中点击“允许”。如果浏览器随后提示 127.0.0.1 拒绝连接，请使用 <code>codex mcp login joomla --no-browser</code>，并把那个页面的地址粘贴到终端中，或者继续使用下面的 API 密钥方法。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline：</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP，粘贴端点 URL，然后点击 <strong>Authenticate</strong>。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="当您点击“允许”后，应用会以您登录的账户身份操作，能做的事情与该账户在此网站上能做的完全相同，如果账户有权限，也包括进行修改。Administrator 和 Manager 首先需要 <em>Web Services 登录</em> 权限（见仪表盘上的权限部分）。每个已连接的应用都会列在仪表盘上，可以随时立即断开。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="更喜欢用 API 密钥，或者您的客户端无法打开浏览器？下面 <strong>高级设置</strong> 中的 API 密钥方法对所有客户端都仍然有效。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT（&ldquo;Add custom MCP server&rdquo;）和 claude.ai / Claude Desktop（&ldquo;Add custom connector&rdquo;）只能通过把您带到此网站的登录页面来连接。此网站上该功能已关闭。开启后，连接只需：把此网站的地址粘贴到应用中，登录，点击“允许”。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="在选项中开启"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="请让 Super User 在 MCP for J 的选项中开启 <strong>OAuth 登录</strong>。在此之前，请使用下面的 API 密钥方法。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="最简单：Claude 的 &ldquo;Add custom connector&rdquo; 对话框在此网站上可以使用。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="此网站已开启登录连接，所以在 Claude Desktop 或 claude.ai 中前往 <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>，粘贴此网站的 MCP 地址，点击 Continue，保留它检测到的登录设置，点击 Add 然后点击 Connect，用您在此网站的用户名和密码登录，再点击“允许”。只有在您更喜欢使用 API 密钥时，才需要下面的配置文件方法。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai 通过 <strong>Add custom connector</strong> 建立永久连接：<strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>，粘贴此网站的 MCP 地址，点击 Continue，保留它检测到的登录设置，点击 Add，然后点击 Connect。用您在此网站的用户名和密码登录，然后点击“允许”。该连接在每次对话中都可以使用。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="在 ChatGPT 中，点击左侧边栏中的 <strong>Plugins</strong>，然后点击 <strong>Add</strong>（右上角） &rarr; <strong>Add custom MCP server</strong>。起一个名字（例如 &ldquo;我的 Joomla 网站&rdquo;），粘贴此网站的 MCP 地址，Authentication 保持为 <strong>OAuth</strong>，勾选 &ldquo;I understand and want to continue&rdquo;，然后点击 <strong>Create as a plugin</strong>。点击 <strong>Connect</strong>，ChatGPT 就会打开此网站的登录页面：用您在此网站的用户名和密码登录，然后点击“允许”。之后在对话中输入 <strong>@</strong> 并选择该插件。不需要粘贴 API 密钥。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="&ldquo;Add custom connector&rdquo; 对话框能连接，但登录失败"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="请按顺序检查：(1) 您登录的账户被允许使用 MCP &mdash; Administrator 需要 <em>Web Services 登录</em>，Manager 除此之外还需要在 选项 &rarr; 权限 中获得 <em>使用 MCP 端点</em>（见仪表盘上的 <em>谁可以使用此端点？</em> 卡片）；如果不被允许，登录页面会告诉您；(2) 仪表盘上的 &ldquo;通过登录连接 AI 应用&rdquo; 卡片显示 <strong>就绪</strong>；(3) 您的防火墙允许应用自己的服务器访问网站（见下一条）。不要输入客户端 ID 或密钥：应用会自己注册。(4) 登录页面打开后请尽快点击“允许”：应用等待一段时间后就会放弃登录（Codex 大约 5 分钟），太晚点击“允许”会以错误告终。重新开始 Connect 就能成功。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai 或 ChatGPT 无法访问网站，或者登录中途停止"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai 和 ChatGPT 是从它们自己的服务器连接的，而不是从您的浏览器，所以网站必须能通过公网 HTTPS 访问。Web 应用防火墙（RSFirewall、Admin Tools、Cloudflare、CSF、ModSecurity、Imunify360，或者主机防火墙，例如会返回 503 的 o2switch TigerProtect）可能会拦截这些请求。请放行对 <code>/api/index.php/v1/mcp</code>、<code>/.well-known/oauth-authorization-server</code>、<code>/.well-known/oauth-protected-resource</code> 以及 <code>index.php?csmcpforj_oauth=&hellip;</code>（注册、令牌和撤销端点）的请求。在 RSFirewall 中，这两个例外就足够了：<code>csmcpforj_oauth</code>，以及作为正则表达式的 <code>api\/index\.php\/v1\/mcp</code>。claude.ai 从 <code>160.79.104.0/21</code> 连接。<strong>Cloudflare</strong>：Browser Integrity Check 和 Security Level 可能会拦截应用的服务器。添加一条 WAF 自定义规则（Security &rarr; WAF &rarr; Custom rules），对 URI 路径包含 <code>/api/index.php/v1/mcp</code> 或 <code>/.well-known/oauth-</code>、或者查询字符串包含 <code>csmcpforj_oauth</code> 的请求执行 <strong>Skip</strong> 操作，并勾选 <em>Browser Integrity Check</em> 和 <em>Security Level</em>。Bot Fight Mode 无法用规则跳过，所以如果它造成拦截，请把它关掉。<strong>Route 66</strong> 和其他会改写 URL 的 SEO 扩展可能会截获登录地址（<code>index.php?csmcpforj_oauth=&hellip;</code>）并返回首页，导致应用无法注册，而且不会给出明确的原因。如果 <strong>检查连接</strong> 对登录端点显示的是首页，请在该扩展中排除包含 <code>csmcpforj_oauth</code> 的 URL，或者关闭它的系统插件。登录页面本身是在您自己的浏览器中打开的。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="仪表盘提示 AI 应用找不到此网站的登录页面（未就绪）"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="AI 客户端会在您域名的 <code>/.well-known/oauth-authorization-server</code> 查找登录信息。只有当 全局配置 &rarr; <strong>启用 URL 重写(rewriting)</strong> 已开启并且网站的 <code>.htaccess</code> 已就位（重命名 <code>htaccess.txt</code>），或者 nginx 把未知路径交给 <code>index.php</code> 时，Joomla 才会在那里响应。这不会影响 cPanel 的 AutoSSL，它使用的是 <code>/.well-known/acme-challenge/</code>。安装在子文件夹中的网站（例如 <code>example.com/joomla</code>）还需要在域名根目录添加一条规则，把 <code>/.well-known/oauth-authorization-server/joomla</code> 转到该子文件夹。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="从服务器或没有浏览器的机器上登录"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="桌面客户端（Claude Code、Codex、Cursor、Gemini CLI）会在同一台机器上打开浏览器，并在本地地址上等待回复，所以 OAuth 登录需要那台机器上有浏览器。在无界面的服务器上或通过 SSH 时，请改用 高级设置 中的 API 密钥方法；它在任何地方都能用。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="在 AI 应用中添加一个新的连接器（claude.ai 和 Claude Desktop：Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector；ChatGPT：Plugins &rarr; Add &rarr; Add custom MCP server），然后粘贴这个 <strong>端点 URL</strong>：%s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>点击 Connect。</strong>应用会自动打开此网站的登录页面。用您在此网站的用户名和密码登录。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>点击“允许”。</strong>您会被带回应用，并且已经连接。应用可以做您的账户在此网站上被允许做的任何事。"
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="将 AI 应用连接到此网站"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="有三种方法。点击其中一种即可展开它的编号步骤。大多数人需要的是第一种。"
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. 登录（最简单） &mdash; ChatGPT、claude.ai、Claude Desktop 以及大多数其他 AI 应用"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. 粘贴设置提示词 &mdash; 适用于能运行命令的 AI 聊天"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. 配置文件或命令行 &mdash; Claude Code、Cursor、Codex、VS Code、Gemini CLI 等"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="适用于能运行命令的 AI 应用（Codex、Claude Code、Cursor、Cline、Copilot agent 模式等）。AI 会自己测试连接，并可以主动提出把连接设为永久。"
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="适用于通过设置文件或命令来配置的应用。只需设置一次，就会一直保持连接。"
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>获取您的 API 令牌。</strong>点击按钮：您的个人资料会在新标签页中打开。打开其中的 <strong>API 令牌</strong> 标签页，点击眼睛图标显示令牌，然后复制。之后回到此标签页。"
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="获取我的 API 令牌（在新标签页中打开）"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>复制提示词。</strong>您的令牌已经在里面了。"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="<strong>把它粘贴到与 AI 应用的新对话中</strong>，然后发送。AI 会测试连接，如果可以，还会主动提出把连接设为永久。"
COM_CSMCPFORJ_DASHBOARD_WAY3_STEP_COPY="<strong>复制配置。</strong>您的令牌已经在里面了。"
COM_CSMCPFORJ_DASHBOARD_WAY3_GUIDE_LINK="每个应用的分步说明都在设置指南中 &rarr;"
COM_CSMCPFORJ_DASHBOARD_COPY_URL_BUTTON="复制"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1_COPY="<strong>复制端点 URL。</strong>"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2_ADD="<strong>把端点 URL 作为连接器添加到您的 AI 应用中。</strong>在哪里添加取决于应用："
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN="通过登录连接"
