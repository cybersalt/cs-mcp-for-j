COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="Přihlašování OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Umožňuje aplikacím AI připojit se tak, že vás pošlou na přihlašovací stránku tohoto webu, místo abyste do nich kopírovali klíč API. ChatGPT (&bdquo;Add custom MCP server&ldquo;) a claude.ai / Claude Desktop (&bdquo;Add custom connector&ldquo;) se mohou připojit jen tímto způsobem. Připojení pomocí klíče API fungují v obou případech dál."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="Povolit přihlašování OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Když je zapnuto, vložíte adresu MCP tohoto webu do aplikace AI, aplikace otevře přihlašovací stránku tohoto webu, přihlásíte se svým obvyklým uživatelským jménem a heslem a kliknete na Povolit. Aplikace pak jedná jako vy, s přesně vašimi oprávněními na tomto webu. Připojené aplikace jsou uvedeny na přehledu, kde lze každou odpojit. Vypnutím této volby se všechny okamžitě odpojí."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Platnost přístupového tokenu (sekundy)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Jak dlouho každý přístupový token platí, než ho aplikace tiše obnoví. Výchozí hodnota 3600 (jedna hodina). Mezi 300 a 86400."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Zůstat přihlášen (dny)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Jak dlouho smí aplikace obnovovat přístup, aniž by se uživatel znovu přihlásil. Každé obnovení odpočet vynuluje. Výchozí hodnota 30."
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="Připojení aplikací AI přihlášením"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="Některé aplikace AI, včetně ChatGPT a claude.ai, se k webu mohou připojit jen tak, že vás pošlou na jeho přihlašovací stránku. Na tomto webu je to vypnuté, takže se tyto aplikace zatím připojit nemohou. Chcete-li to povolit, zapněte <strong>přihlašování OAuth</strong> v Možnostech. Připojení pomocí klíče API fungují v obou případech dál."
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="Otevřít Možnosti a zapnout"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="Žádný klíč API není potřeba. Kopírujete jen <strong>URL koncového bodu</strong> tohoto webu."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="Kontroluje se, zda aplikace AI najdou přihlašovací stránku tohoto webu&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>Připraveno.</strong> Aplikace AI najdou přihlašovací stránku tohoto webu."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>Nepřipraveno.</strong> Aplikace AI nenajdou přihlašovací stránku tohoto webu, takže se nebudou moci připojit. Opravíte to zapnutím <strong>Použít přepis URL</strong> v Systém &rarr; Globální nastavení a kontrolou, že je na místě soubor .htaccess webu. Podrobnosti najdete v části Řešení problémů v Průvodci nastavením."
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_HEADING="Připojené aplikace"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_NONE="Zatím nejsou připojeny žádné aplikace AI. Aplikace se zde objeví, jakmile se někdo přihlásí a klikne na Povolit."
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_APP="Aplikace"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_USER="Přihlášen jako"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_CONNECTED="Připojeno"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_LAST_USED="Naposledy použito"
COM_CSMCPFORJ_DASHBOARD_OAUTH_REVOKE="Odpojit"
COM_CSMCPFORJ_OAUTH_REVOKED="Aplikace odpojena. Přístup ztratí hned při dalším požadavku a pro opětovné připojení musí být znovu schválena."
COM_CSMCPFORJ_OAUTH_REVOKE_NOTHING="Tato aplikace neměla žádný aktivní přístup k odpojení."
COM_CSMCPFORJ_ACTIONLOG_OAUTH_CONSENT="Uživatel <a href=&quot;{accountlink}&quot;>{username}</a> připojil aplikaci &bdquo;{title}&ldquo; k MCP for J (OAuth)"
COM_CSMCPFORJ_ACTIONLOG_OAUTH_REVOKE="Uživatel <a href=&quot;{accountlink}&quot;>{username}</a> odpojil aplikaci &bdquo;{title}&ldquo; od MCP for J (OAuth)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="Připojení přihlášením (nejjednodušší)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Žádný klíč API ke kopírování. Ve své aplikaci AI přidejte konektor a vložte <strong>URL koncového bodu</strong> tohoto webu (níže). Když kliknete na Connect, aplikace sama otevře přihlašovací stránku tohoto webu: přihlaste se svým uživatelským jménem a heslem pro tento web a pak klikněte na <strong>Povolit</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai a Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Pojmenujte ho, vložte URL koncového bodu a klikněte na Continue. Ponechte <em>Sign in now</em>; pro klienta OAuth fungují obě volby, <em>Use Claude's published identity</em> i <em>Register automatically</em>. Nepřidávejte hlavičky požadavku. Klikněte na Add a pak na <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> <strong>Plugins</strong> v levém postranním panelu &rarr; <strong>Add</strong> (vpravo nahoře) &rarr; <strong>Add custom MCP server</strong>. Pojmenujte ho, vložte URL koncového bodu, ponechte Authentication na <strong>OAuth</strong>, zaškrtněte políčko, klikněte na <strong>Create as a plugin</strong> a pak na <strong>Connect</strong>. Vyžaduje placený plán ChatGPT (Plus funguje)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>, pak napište <code>/mcp</code>, vyberte server a zvolte <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> Command Palette &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; vložte URL koncového bodu. VS Code vás požádá o přihlášení."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> přidejte <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> pod <code>mcpServers</code> v <code>mcp.json</code> (bez hlaviček) a pak klikněte na <strong>Login</strong> vedle serveru v Settings &rarr; MCP."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> přidejte pro server <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> do <code>settings.json</code> a pak spusťte <code>/mcp auth &lt;name&gt;</code>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Codex sám otevře přihlašovací stránku (pokud ne, spusťte <code>codex mcp login joomla</code>). Klikněte na Povolit během několika minut, v prohlížeči na stejném počítači jako Codex. Pokud pak prohlížeč hlásí, že 127.0.0.1 odmítl připojení, použijte <code>codex mcp login joomla --no-browser</code> a adresu té stránky vložte do terminálu, nebo dál používejte postup s klíčem API níže."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, vložte URL koncového bodu a pak klikněte na <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="Když kliknete na Povolit, aplikace jedná jako účet, se kterým jste se přihlásili, a může dělat přesně to, co tento účet na webu smí, včetně provádění změn, pokud je účet smí provádět. Administrators a Manageři nejprve potřebují oprávnění <em>Přihlásit se k webovým službám</em> (viz Oprávnění na přehledu). Každá připojená aplikace je uvedena na přehledu, kde ji lze okamžitě odpojit."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="Dáváte přednost klíči API, nebo váš klient neumí otevřít prohlížeč? Postup s klíčem API v části <strong>Pokročilé nastavení</strong> níže stále funguje pro každého klienta."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT (&bdquo;Add custom MCP server&ldquo;) a claude.ai / Claude Desktop (&bdquo;Add custom connector&ldquo;) se mohou připojit jen tak, že vás pošlou na přihlašovací stránku tohoto webu. Na tomto webu je to vypnuté. Když je to zapnuté, připojení vypadá takto: vložte adresu tohoto webu do aplikace, přihlaste se, klikněte na Povolit."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="Zapnout v Možnostech"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Požádejte Super User, aby v Možnostech MCP for J zapnul <strong>přihlašování OAuth</strong>. Do té doby použijte postup s klíčem API níže."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="Nejjednodušší: dialog Claude &bdquo;Add custom connector&ldquo; na tomto webu funguje."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="Přihlašování je na tomto webu zapnuté, takže v Claude Desktop nebo claude.ai přejděte na <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, vložte adresu MCP tohoto webu, klikněte na Continue, ponechte zjištěná nastavení přihlášení, klikněte na Add a pak na Connect, přihlaste se svým uživatelským jménem a heslem pro tento web a klikněte na Povolit. Postup s konfiguračním souborem níže je potřeba jen tehdy, pokud dáváte přednost klíči API."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai se trvale připojí přes <strong>Add custom connector</strong>: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, vložte adresu MCP tohoto webu, klikněte na Continue, ponechte zjištěná nastavení přihlášení, klikněte na Add a pak na Connect. Přihlaste se svým uživatelským jménem a heslem pro tento web a klikněte na Povolit. Připojení zůstane dostupné v každém chatu."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="V ChatGPT klikněte na <strong>Plugins</strong> v levém postranním panelu, pak na <strong>Add</strong> (vpravo nahoře) &rarr; <strong>Add custom MCP server</strong>. Pojmenujte ho (třeba &bdquo;Můj web Joomla&ldquo;), vložte adresu MCP tohoto webu, ponechte Authentication na <strong>OAuth</strong>, zaškrtněte &bdquo;I understand and want to continue&ldquo; a klikněte na <strong>Create as a plugin</strong>. Klikněte na <strong>Connect</strong> a ChatGPT otevře přihlašovací stránku tohoto webu: přihlaste se svým uživatelským jménem a heslem pro tento web a klikněte na Povolit. Pak v chatu napište <strong>@</strong> a vyberte plugin. Žádný klíč API vkládat nemusíte."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="Dialog &bdquo;Add custom connector&ldquo; se připojí, ale přihlášení selže"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Zkontrolujte popořadě: (1) účet, se kterým jste se přihlásili, smí používat MCP &mdash; Administrators potřebují <em>Přihlásit se k webovým službám</em> a Manageři navíc <em>Používat koncový bod MCP</em> v Možnosti &rarr; Oprávnění (viz karta <em>Kdo může tento koncový bod používat?</em> na přehledu); pokud ne, přihlašovací stránka vám to řekne; (2) karta &bdquo;Připojení aplikací AI přihlášením&ldquo; na přehledu ukazuje <strong>Připraveno</strong>; (3) váš firewall pouští k webu vlastní servery aplikace (viz další položka). Nezadávejte ID klienta ani tajný klíč: aplikace se zaregistruje sama. (4) Klikněte na Povolit brzy po otevření přihlašovací stránky: aplikace se po chvíli přihlašování vzdají (Codex asi po 5 minutách) a pozdní Povolit skončí chybou. Spusťte Connect znovu a bude to fungovat."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai nebo ChatGPT se k webu nedostane, nebo se přihlašování zastaví v půlce"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai a ChatGPT se připojují ze svých vlastních serverů, ne z vašeho prohlížeče, takže web musí být dostupný přes veřejné HTTPS. Webový aplikační firewall (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 nebo firewall hostingu, jako je o2switch TigerProtect, který odpovídá 503) může tyto požadavky blokovat. Povolte požadavky na <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> a <code>index.php?csmcpforj_oauth=&hellip;</code> (koncové body pro registraci, token a odvolání). V RSFirewall stačí tyto dvě výjimky: <code>csmcpforj_oauth</code> a <code>api\/index\.php\/v1\/mcp</code> jako regulární výraz. claude.ai se připojuje z <code>160.79.104.0/21</code>. <strong>Cloudflare</strong>: Browser Integrity Check a Security Level mohou servery aplikací blokovat. Přidejte vlastní pravidlo WAF (Security &rarr; WAF &rarr; Custom rules) s akcí <strong>Skip</strong> pro požadavky, jejichž cesta URI obsahuje <code>/api/index.php/v1/mcp</code> nebo <code>/.well-known/oauth-</code>, nebo jejichž řetězec dotazu obsahuje <code>csmcpforj_oauth</code>, a zaškrtněte <em>Browser Integrity Check</em> a <em>Security Level</em>. Bot Fight Mode nelze pravidlem přeskočit, takže ho vypněte, pokud blokuje. <strong>Route 66</strong> a další rozšíření SEO, která přepisují URL, mohou zachytit přihlašovací adresy (<code>index.php?csmcpforj_oauth=&hellip;</code>) a odpovědět domovskou stránkou, takže se aplikace nemůže zaregistrovat a neuvede jasný důvod. Pokud <strong>Zkontrolovat připojení</strong> ukazuje u přihlašovacích koncových bodů domovskou stránku, vyřaďte v tom rozšíření URL obsahující <code>csmcpforj_oauth</code>, nebo vypněte jeho systémový plugin. Samotná přihlašovací stránka se otevírá ve vašem vlastním prohlížeči."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="Přehled hlásí, že aplikace AI nenajdou přihlašovací stránku tohoto webu (Nepřipraveno)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="Klienti AI hledají údaje pro přihlášení na <code>/.well-known/oauth-authorization-server</code> ve vaší doméně. Joomla tam odpovídá jen tehdy, když je v Globální nastavení &rarr; zapnuto <strong>Použít přepis URL</strong> a na místě je soubor <code>.htaccess</code> webu (přejmenujte <code>htaccess.txt</code>), nebo když nginx posílá neznámé cesty na <code>index.php</code>. Netýká se to AutoSSL v cPanelu, které používá <code>/.well-known/acme-challenge/</code>. Web nainstalovaný v podsložce (například <code>example.com/joomla</code>) navíc potřebuje v kořeni domény pravidlo, které posílá <code>/.well-known/oauth-authorization-server/joomla</code> do podsložky."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Přihlašování ze serveru nebo z počítače bez prohlížeče"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Desktopoví klienti (Claude Code, Codex, Cursor, Gemini CLI) otevírají prohlížeč na stejném počítači a čekají na odpověď na místní adrese, takže přihlašování OAuth tam potřebuje prohlížeč. Na serveru bez grafického rozhraní nebo přes SSH použijte místo toho postup s klíčem API v části Pokročilé nastavení; funguje všude."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="V aplikaci AI přidejte nový konektor (claude.ai a Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector; ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server) a vložte tuto <strong>URL koncového bodu</strong>: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Klikněte na Connect.</strong> Aplikace sama otevře přihlašovací stránku tohoto webu. Přihlaste se svým uživatelským jménem a heslem pro tento web."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Klikněte na Povolit.</strong> Vrátíte se do aplikace, připojení. Aplikace může dělat cokoli, co váš účet na tomto webu smí."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Připojte k tomuto webu aplikaci AI"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Jsou tři způsoby. Kliknutím na jeden otevřete jeho očíslované kroky. Většina lidí chce ten první."
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. Přihlášením (nejjednodušší) &mdash; ChatGPT, claude.ai, Claude Desktop a většina dalších aplikací AI"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Vložením promptu k nastavení &mdash; pro chat s AI, který umí spouštět příkazy"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. Konfiguračním souborem nebo příkazovou řádkou &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI a další"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Funguje v aplikacích AI, které umějí spouštět příkazy (Codex, Claude Code, Cursor, Cline, režim agenta Copilot a podobné). AI sama otestuje připojení a může nabídnout, že ho udělá trvalým."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="Pro aplikace, které nastavujete souborem nastavení nebo příkazem. Uděláte to jednou a připojení zůstane."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>Získejte svůj token API.</strong> Klikněte na tlačítko: v nové kartě se otevře váš uživatelský profil. Otevřete jeho kartu <strong>Joomla API Token</strong>, kliknutím na ikonu oka token zobrazte a zkopírujte ho. Pak se vraťte na tuto kartu."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="Získat můj token API (otevře novou kartu)"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>Zkopírujte prompt.</strong> Váš token v něm už je."
