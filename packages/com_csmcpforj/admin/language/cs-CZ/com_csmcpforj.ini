COM_CSMCPFORJ_SUPPORT_TYPE_QUESTION="❓ Dotaz &mdash; potřebuji pomoc s pochopením něčeho"
COM_CSMCPFORJ_SUPPORT_TYPE_IDEA="💡 Nápad &mdash; myšlenka, o kterou se chci podělit"
COM_CSMCPFORJ_SUPPORT_TYPE_OTHER="💬 Jiné &mdash; něco jiného"

