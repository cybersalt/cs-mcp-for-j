COM_CSMCPFORJ_SUPPORT_FIELD_DESCRIPTION_PLACEHOLDER="Popište nám, co se děje. U hlášení chyb: co jste očekávali, že se stane, a co se stalo doopravdy? U požadavků na funkce: jaký problém by to vyřešilo? Čím víc souvislostí, tím rychleji můžeme pomoci."
