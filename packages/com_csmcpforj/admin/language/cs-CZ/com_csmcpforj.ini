COM_CSMCPFORJ_SUPPORT_BANNER_PRO_HEADING="Máte aktivní členství MCP for J Pro &mdash; děkujeme!"
COM_CSMCPFORJ_SUPPORT_BANNER_PRO_BODY="Členové Pro mají prioritní podporu. Vaše zprávy přicházejí do naší schránky se štítkem podpory Pro, takže je vidíme jako první a odpovídáme co nejrychleji. Ptejte se na cokoli &mdash; hlášení chyb, požadavky na funkce, dotazy, nápady &mdash; vše je vítáno."

COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_HEADING="Rádi o vás slyšíme"
COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_BODY="Posílejte nám hlášení chyb, požadavky na funkce, dotazy a nápady &mdash; čteme každou zprávu a zpětné vazby si vážíme. Podpora bezplatné verze je poskytována podle možností (naše zdroje pro bezplatnou podporu jsou omezené), takže odpověď může chvíli trvat. Pokud potřebujete zaručenou dobu odezvy nebo prioritní pozornost, zvažte %sčlenství MCP for J Pro%s."

COM_CSMCPFORJ_SUPPORT_FORM_HEADING="Pošlete nám zprávu"
COM_CSMCPFORJ_SUPPORT_FORM_INTRO="Vaše zpráva jde přímo na <code>support@cybersalt.com</code>. Údaje o prostředí (URL vašeho webu, verze MCP for J, verze Joomla + PHP, nainstalované doplňky a stav vašeho členství Pro) se připojí automaticky, abychom vám mohli pomoci rychleji &mdash; úplný seznam uvidíte v postranním panelu."

COM_CSMCPFORJ_SUPPORT_FIELD_TYPE_LABEL="O jaký druh zprávy jde?"
COM_CSMCPFORJ_SUPPORT_FIELD_TYPE_HINT="Vyberte, co nejlépe sedí &mdash; dál to nasměrujeme my."
COM_CSMCPFORJ_SUPPORT_TYPE_BUG="🐛 Hlášení chyby &mdash; něco nefunguje"
