COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OFF_FAIL="Vypnuto. Aplikace AI se navíc nedostanou na přihlašovací adresu tohoto webu, takže po zapnutí zapněte také <strong>Použít přepis URL</strong> v Systém &rarr; Globální nastavení a zkontrolujte, že je na místě soubor .htaccess webu."
COM_CSMCPFORJ_DASHBOARD_CLAUDE_CHECKLIST_LINK="Připojujete claude.ai? Projděte kontrolní seznam &rarr;"
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_TITLE="403, 503 nebo &bdquo;Malware detected&ldquo; od webu"
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_BODY="Firewall blokuje požadavek dřív, než ho MCP for J uvidí. Kliknutím na <strong>Zkontrolovat připojení</strong> výše zjistíte, která adresa je blokována. V RSFirewall přidejte výjimky pro <code>csmcpforj_oauth</code> a <code>api\/index\.php\/v1\/mcp</code> (regulární výraz). Firewally hostingu (o2switch TigerProtect, Imunify360) potřebují povolit stejné adresy. <strong>Cloudflare</strong>: Browser Integrity Check a Security Level mohou servery aplikací blokovat. Přidejte vlastní pravidlo WAF (Security &rarr; WAF &rarr; Custom rules) s akcí <strong>Skip</strong> pro požadavky, jejichž cesta URI obsahuje <code>/api/index.php/v1/mcp</code> nebo <code>/.well-known/oauth-</code>, nebo jejichž řetězec dotazu obsahuje <code>csmcpforj_oauth</code>, a zaškrtněte <em>Browser Integrity Check</em> a <em>Security Level</em>. Bot Fight Mode nelze pravidlem přeskočit, takže ho vypněte, pokud blokuje."
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_CLAUDE_TITLE="claude.ai hlásí, že &bdquo;cannot register&ldquo;, nebo autorizace selhala"

