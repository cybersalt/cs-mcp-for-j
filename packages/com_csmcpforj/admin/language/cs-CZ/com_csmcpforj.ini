; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ Jednoduchý způsob"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Žádné konfigurační soubory. Žádné hlavičky. Žádný žargon. Stačí zkopírovat připravený prompt k nastavení z přehledu a vložit ho do nového chatu s vaší AI. O zbytek se postará AI &mdash; otestuje připojení a v klientech, které to podporují, nabídne, že ho za vás trvale uloží."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Získejte svůj klíč API</strong> (osobní heslo, které vaší AI umožňuje jednat na tomto webu). Pokud ho ještě nemáte, návod najdete níže."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Přejděte na přehled</strong> (tlačítko níže) a vložte tam svůj klíč API do pole."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Klikněte na přehledu na tlačítko &bdquo;Zkopírovat prompt&ldquo;</strong>. Váš klíč se do promptu před zkopírováním doplní automaticky."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Vložte ho do nového chatu</strong> se svou AI (Claude, ChatGPT, Cursor, Copilot, Gemini atd.) a odešlete. AI potvrdí, že připojení funguje, a nabídne jeho uložení."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Přejít na přehled"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="To je vše. Vaše AI je připojená. Pokud chcete vědět víc o tom, jak do sebe části zapadají, nebo raději nastavíte AI ručně, čtěte dál &mdash; ale nemusíte."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Získejte svůj klíč API"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="<strong>Klíč API</strong> je osobní heslo, které vaší AI umožňuje jednat na tomto webu Joomla jako VY. Kdokoli s klíčem může dělat cokoli, co může váš uživatelský účet Joomla &mdash; proto ho držte v soukromí. Takto ho vygenerujete:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sKliknutím sem otevřete svůj uživatelský profil Joomla%s. Otevře se na nové kartě. Tam najděte kartu s názvem <strong>Joomla API Token</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="Na této kartě klikněte na tlačítko <strong>Obnovit</strong>. Joomla vygeneruje dlouhý řetězec písmen a číslic a vloží ho do pole pod tlačítkem. To je váš klíč."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Klikněte na malou <strong>ikonu oka</strong> vedle pole, tím klíč zobrazíte, a pak zkopírujte celý řetězec."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Vložte ho do pole níže na této stránce (uloží se jen ve vašem prohlížeči, aby ho tlačítka pro kopírování na této stránce mohla doplnit), NEBO ho vložte přímo do pole pro klíč API na přehledu, pokud tam míříte kvůli jednoduchému nastavení."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Zacházejte s tímto klíčem jako s heslem."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Nevkládejte ho do sdílených dokumentů, snímků obrazovky ani do kódu, který zveřejníte. Pokud někdy unikne, vraťte se na kartu Joomla API Token a znovu klikněte na Obnovit &mdash; starý klíč okamžitě přestane platit."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Sem vložte svůj klíč API (pro kopírování jedním kliknutím na této stránce)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Váš klíč si pamatuje jen tento prohlížeč</strong> &mdash; nikdy neopustí váš počítač. Tlačítkem koše ho zapomenete. Pokud pole necháte prázdné, tlačítka pro kopírování na této stránce budou stále fungovat, ale klíč budete muset do zkopírované ukázky vložit ručně."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Zobrazit/skrýt klíč"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Zapomenout uložený klíč"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Pokročilé: ruční připojení AI (většina lidí to nepotřebuje)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Tato část je pro ty, kdo chtějí připojení svého klienta AI k tomuto webu nastavit ručně &mdash; obvykle úpravou malého textového souboru zvaného &bdquo;konfigurační soubor&ldquo;. Pokud vám jednoduché nastavení výše fungovalo, můžete celou tuto část klidně přeskočit. Pokud chcete prompt k nastavení obejít a zaregistrovat připojení přímo ve svém klientovi AI, čtěte dál."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="URL připojení tohoto webu"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="Tuto adresu potřebuje váš klient AI. Vložíte ji do nastavení klienta spolu se svým klíčem API."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Vyberte svého klienta AI"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="URL připojení + klíč API jsou stejné pro každou AI &mdash; liší se jen <em>místo, kam je vložíte</em>. Níže vyberte svého klienta a zobrazí se konkrétní pokyny."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, rozšíření IDE nebo desktopová aplikace)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex tento koncový bod nativně podporuje jako server MCP se Streamable HTTP. Nejprve uložte klíč Joomla API do proměnné prostředí určené pro tento web a pak zaregistrujte koncový bod podle názvu proměnné prostředí. Klíč se nikdy nezapisuje do <code>config.toml</code>. Pokud použijete tlačítko pro kopírování po vložení klíče výše, zkopírovaný příkaz prostředí tento klíč obsahuje, takže ho nedávejte do sdílených terminálů, nahrávek ani požadavků na podporu."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; uložte klíč pro budoucí procesy Codexu"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Po nastavení trvalé proměnné prostředí Windows otevřete nový terminál. Stávající procesy Codexu a terminálu ji nevidí."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; nastavte klíč pro tento terminál (v případě potřeby ho trvale uložte do svého zabezpečeného prostředí shellu)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Zaregistrujte tento web Joomla v Codexu"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Spusťte <code>codex mcp list</code>, restartujte Codex (nebo zkontrolujte jeho rozhraní stavu MCP) a pak zavolejte neškodný nástroj jen pro čtení <code>get_joomla_version</code>. Tím ověříte inicializaci, ověření, vyhledání nástrojů a jejich volání. Pro připojení jen pro čtení zapněte také režim jen pro čtení na straně serveru v MCP for J; nastavení schvalování v klientovi nemůže přepsat oprávnění serveru."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Neplatný token na cPanelu nebo PHP-FPM?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Webový server možná odstraňuje standardní hlavičku Authorization. Nahraďte výše vytvořený záznam v <code>~/.codex/config.toml</code> tímto blokem, aby Codex četl stejnou proměnnou prostředí a posílal ji jako <code>X-Joomla-Token</code>, a pak Codex restartujte."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Pozor &mdash; dialog Claude &bdquo;Add custom connector&ldquo; potřebuje OAuth, které je na tomto webu vypnuté."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Vestavěný dialog &bdquo;Add custom connector&ldquo; v Claude Desktop a claude.ai se připojuje přihlášením (OAuth) a nemá pole pro klíč API. Super User může přihlašování OAuth zapnout v Možnostech MCP for J; pak tento dialog funguje. Do té doby pokyny pro Claude Desktop níže používají místo toho úpravu konfiguračního souboru. (Nebo použijte jednoduché nastavení výše &mdash; funguje i s Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Čtyři kroky: vytvořte malý pomocný soubor zvaný &bdquo;wrapper skript&ldquo;, který obsahuje příkaz pro připojení, pak na něj nasměrujte konfigurační soubor Claude Desktop a poté Claude Desktop restartujte."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Proč wrapper skript místo zapsání připojení přímo do konfigurace Claude Desktop? Claude Desktop 1.30096+ (srpen 2026) odmítá konfigurační záznamy, jejichž argumenty příkazu vypadají, že obsahují přihlašovací údaje &mdash; dobře míněná bezpečnostní funkce, která bohužel přímý postup blokuje. Přesunutí příkazu do malého pomocného souboru to obejde (Claude Desktop vidí jen prostý příkaz bez viditelných argumentů) a váš klíč API zůstane přesně tak bezpečný jako dřív &mdash; pomocný soubor leží ve vaší vlastní uživatelské složce vedle konfigurace Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Jednorázový předpoklad &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Tyto pokyny předpokládají, že máte na počítači nainstalovaný Node.js (který obsahuje příkaz <code>npx</code>). Většina vývojářských prostředí ho už má; pokud ne, nainstalujte ho z <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> pomocí instalátoru LTS. Níže uvedený wrapper soubor očekává Node.js ve standardní instalační cestě Windows <code>C:\Program Files\nodejs\</code>. Pokud jste ho nainstalovali jinam, upravte po zkopírování tuto cestu ve wrapper souboru."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Krok 1 &mdash; vytvořte wrapper skript"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Zatím jen pro Windows (uživatelé Macu/Linuxu, viz FAQ). Zkopírujte níže uvedený blok do nového prostého textového souboru. Uložte ho do své uživatelské složky (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) s názvem <code>claude-mcp-joomla-{sitename}.cmd</code>, kde <code>{sitename}</code> nahradíte krátkým označením svého webu (např. <code>cybersaltorg</code>). Ujistěte se, že <code>.cmd</code> je skutečně přípona, ne část názvu souboru &mdash; v Poznámkovém bloku zvolte &bdquo;Uložit jako typ: Všechny soubory&ldquo;, aby nepřidal <code>.txt</code>. Pokud jste svůj klíč API vložili do pole nahoře na této stránce, tlačítko pro kopírování ho doplní za vás."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Nevíte, jaké je vaše uživatelské jméno ve Windows? Otevřete Průzkumníka souborů, přejděte do <code>C:\Users\</code> a podívejte se na názvy složek &mdash; jedna z nich je vaše."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Krok 2 &mdash; otevřete konfigurační soubor Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Soubor nastavení Claude Desktop leží v každém operačním systému na předvídatelné cestě. Otevřete ho v libovolném textovém editoru (VS Code, Poznámkový blok, TextEdit, Sublime, cokoli máte):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop má v Settings &rarr; Developer tlačítko <strong>Edit Config</strong>, které by vám měl soubor otevřít. Pokud na něj kliknete a nic se nestane, je to proto, že váš počítač neví, jakým programem soubory <code>.json</code> otevírat. Nevadí &mdash; otevřete soubor sami v textovém editoru pomocí jedné z cest výše. Pokud soubor ještě neexistuje, vytvořte ho a jako celý jeho obsah použijte níže uvedený blok (obalený jako <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Krok 3 &mdash; přidejte tento blok do konfigurace Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Vložte toto do <code>claude_desktop_config.json</code>. Pokud soubor už obsahuje objekt <code>mcpServers</code> s jinými servery, přidejte záznam <code>joomla-...</code> vedle nich (nevkládejte druhý objekt <code>mcpServers</code>). Pokud je soubor prázdný nebo chybí, použijte jako jeho obsah celý blok níže. <strong>Důležité:</strong> nahraďte <code>YOUR_WINDOWS_USERNAME</code> svým skutečným uživatelským jménem ve Windows."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Tato konfigurace jen nasměruje Claude Desktop na wrapper skript, který jste vytvořili v kroku 1. Váš klíč API zůstává ve wrapper souboru, ne v konfiguraci Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Krok 4 &mdash; Claude Desktop úplně ukončete a znovu otevřete"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop čte svůj konfigurační soubor jen při spuštění. Úplně ho zavřete &mdash; ve Windows klikněte pravým tlačítkem na ikonu Claude v oznamovací oblasti (vpravo dole, možná budete muset kliknout na malou šipku nahoru) a zvolte Quit. Počkejte pár sekund a pak ho znovu spusťte. V libovolné konverzaci klikněte na ikonu nástrojů (nebo se zeptejte &bdquo;what tools do you have?&ldquo;) &mdash; nástroje webu by měly být uvedeny. Pokud nejsou, viz Řešení problémů níže."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (terminál nebo VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Pokud používáte Claude Code, připojení nastaví jediný příkaz v terminálu &mdash; bez úprav konfiguračního souboru. Vložte svůj klíč API do pole výše, aby ho tlačítko pro kopírování níže doplnilo, pak příkaz vložte do terminálu a stiskněte Enter. Claude Code připojení okamžitě potvrdí a načte se znovu."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (webová verze)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="Dialog <strong>Add custom connector</strong> v claude.ai se připojuje přihlášením (OAuth), které je na tomto webu vypnuté. Super User ho může zapnout v Možnostech MCP for J a pak claude.ai získá trvalé připojení. Do té doby jednoduché nastavení výše (vložení promptu) funguje jen pro aktuální chat."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor ukládá svá připojení MCP do konfiguračního souboru <code>mcp.json</code>. Otevřete ho v textovém editoru, vložte níže uvedený blok do objektu <code>mcpServers</code> a uložte. Cursor změnu ve většině případů načte bez restartu."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Umístění konfiguračního souboru: <code>~/.cursor/mcp.json</code> (pro všechny vaše projekty) nebo <code>.cursor/mcp.json</code> v konkrétní složce projektu (jen pro tento projekt)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Vlastní servery MCP v ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="Dialog <strong>Add custom MCP server</strong> v ChatGPT se umí připojit jen přihlášením (OAuth) nebo bez ověření; nemá pole pro klíč API ani hlavičku. Přihlašování OAuth je na tomto webu vypnuté, takže se ChatGPT zatím připojit nemůže. Super User ho může zapnout v Možnostech MCP for J. Do té doby použijte Codex (programovacího agenta od OpenAI), který posílá klíč API z proměnné prostředí."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Přidání vlastního serveru MCP vyžaduje placený plán ChatGPT. Funguje s Plus (ověřeno v říjnu 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI a Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Gemini CLI (terminálový asistent AI od Googlu) i rozšíření Gemini Code Assist (pro VS Code / JetBrains) čtou stejný konfigurační soubor MCP. Dva kroky: upravte tento soubor a přidejte tento web Joomla jako server MCP, pak Gemini restartujte."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Server můžete přidat globálně (aby ho viděla každá relace Gemini), nebo jen v jedné složce projektu. Ukázka je stejná &mdash; liší se jen umístění souboru."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Otevřete (nebo vytvořte) soubor nastavení Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Vyberte jedno z těchto dvou umístění:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Globálně (každý projekt):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Jen projekt:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (ve složce projektu)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Vložte tento blok do souboru."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Pokud soubor už má sekci <code>mcpServers</code>, přidejte záznam <code>&quot;joomla-...&quot;</code> do té stávající &mdash; nezdvojujte vnější klíč <code>mcpServers</code>. Pokud je soubor prázdný nebo úplně nový, vložte celou ukázku tak, jak je."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini používá pro servery MCP přes HTTP (jako je tento) klíč <code>httpUrl</code> &mdash; to se liší od klíče <code>url</code> v Cursoru. Zkopírujte přesně tuto ukázku a nepoužívejte tu pro Cursor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Restartujte Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Ukončete a znovu spusťte <code>gemini</code> v terminálu, nebo znovu načtěte okno VS Code / JetBrains. V Gemini CLI napište <code>/mcp</code>, zobrazí se připojené servery, a ověřte, že je mezi nimi váš web Joomla."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="Webová aplikace <code>gemini.google.com</code> k srpnu 2026 vlastní servery MCP nepodporuje &mdash; tento návod pokrývá jen Gemini CLI a Gemini Code Assist. Pokud Google podporu ve webovém rozhraní později přidá, popíšeme ji zde."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Fungují i další klienti AI s podporou MCP (Cline, Continue, GitHub Copilot v režimu agenta, Windsurf, mcp-cli atd.) &mdash; URL připojení a klíč API jsou stejné, liší se jen přesné místo, kam je vložíte. Postupně přidáme konkrétní návody pro další klienty; pokud si nevíte rady, obecné pokyny najdete v FAQ níže."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Kopírovat"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Zkopírováno"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Zkopírováno (s vaším klíčem)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Zabezpečení a sdílení"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="Váš klíč API JE přihlášení &mdash; kdo ho má, může dělat vše, co může váš uživatelský účet Joomla. Anonymní přístup neexistuje. Pokud zapnete <strong>přihlašování OAuth</strong>, může se aplikace AI připojit také tak, že vás pošle na běžnou přihlašovací stránku tohoto webu; pak jedná jako účet, který se přihlásil, s přesně jeho oprávněními, dokud ji na přehledu neodpojíte."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Udělení přístupu MCP dalším lidem"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Jsou dva způsoby &mdash; vyberte, který vám vyhovuje:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Jeden klíč na osobu (nejbezpečnější)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Vytvořte pro každou osobu uživatele Joomla, zařaďte ho do skupiny jen s oprávněními, která mu chcete dát (např. jen pro čtení), vygenerujte pro tohoto uživatele klíč a pošlete mu ho soukromě. Každá osoba má vlastní auditní stopu; kterýkoli jednotlivý klíč můžete zrušit, aniž byste ovlivnili ostatní."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Jeden sdílený klíč (nejjednodušší, ale nejméně bezpečný)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Vytvořte jednoho omezeného uživatele (např. <code>mcp-demo-guest</code>) ve skupině jen pro čtení, vygenerujte jeden klíč a sdílejte ho šířeji. Snadněji se rozdává; hůř se pozná, kdo ho používá, a hůř se zruší přístup jen jedné osobě. Vhodné pro veřejné demo; ne pro citlivý přístup."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Zrušení klíče"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="Aby stávající klíč okamžitě přestal fungovat, přejděte do Uživatelé &rarr; dotyčný uživatel &rarr; karta Joomla API Token &rarr; klikněte na <strong>Obnovit</strong>. Starý klíč přestane platit ve chvíli, kdy kliknete. Nový klíč dejte dané osobě, nebo ji nechte bez přístupu."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Řešení problémů"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Najděte druh aplikace, kterou připojujete, a pak otevřete problém, který odpovídá tomu, co vidíte. Chybové zprávy a blokování firewallem se mohou objevit v jakékoli aplikaci, proto mají na konci vlastní skupinu."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&bdquo;Unauthorized&ldquo; nebo &bdquo;Authentication failed&ldquo; (chyba 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="Vaše AI se k webu dostane, ale klíč API není správný. Zkontrolujte: (1) klíč nebyl od zkopírování obnoven (každé Obnovit zneplatní předchozí klíč); (2) klíč byl zkopírován celý, bez chybějících znaků a nadbytečných mezer; (3) pokud jste upravovali konfigurační soubor, před klíčem je slovo <code>Bearer </code> (s mezerou za ním). Pokud si nejste jistí, vygenerujte nový klíč a zkuste to znovu."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&bdquo;Not Acceptable&ldquo; nebo &bdquo;Could not match accept header&ldquo; (chyba 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Starší verze MCP for J (před 2.3.4) měly chybu, která některým klientům AI bránila v připojení. Aktualizujte MCP for J na nejnovější verzi &mdash; zkontrolujte Systém &rarr; Aktualizovat &rarr; Rozšíření v administraci Joomla."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&bdquo;Připojeno, ale v AI se nezobrazují žádné nástroje&ldquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Obvykle jde o jednu ze tří věcí: (1) skupina uživatele nemá <strong>Přihlásit se k webovým službám</strong> &mdash; nastavte to v Systém &rarr; Globální nastavení &rarr; Oprávnění (ve výchozím stavu to mají jen Super Users); (2) skupina nemá žádné oprávnění MCP &mdash; Super Users ho mají vždy a Administrators díky výchozím nastavením Joomla, ale Manageři a další skupiny potřebují Používat koncový bod MCP (a pro změny Zapisovat přes koncový bod MCP) v Možnosti &rarr; Oprávnění této komponenty; (3) klient AI si uložil do mezipaměti prázdný seznam nástrojů &mdash; odpojte a znovu připojte server MCP v klientovi, aby ho donutil znovu zkontrolovat."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&bdquo;Not Found&ldquo; nebo URL vrací chybu (chyba 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Buď je URL špatně (zkontrolujte ji &mdash; měla by končit na <code>/api/index.php/v1/mcp</code>), NEBO je na vašem webu Joomla zakázaný plugin webových služeb pro MCP. V administraci Joomla: Systém &rarr; Spravovat &rarr; Rozšíření &rarr; vyhledejte <code>csmcpforj</code> &rarr; ujistěte se, že je plugin Web Services povolen. Pokud už povolený je, může cestu <code>/api/</code> blokovat soubor <code>.htaccess</code> vašeho webu &mdash; problém poskytovatele hostingu nebo bezpečnostního pluginu."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&bdquo;Forbidden&ldquo; nebo &bdquo;Malware detected&ldquo; (chyba 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Požadavek MCP blokuje bezpečnostní plugin na vašem webu Joomla (RSFirewall, Admin Tools Pro, Securitycheck Pro). V RSFirewall přidejte dvě výjimky: <code>csmcpforj_oauth</code> a <code>api\/index\.php\/v1\/mcp</code> jako regulární výraz (první je pro přihlašování). V ostatních povolte <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> a URL obsahující <code>csmcpforj_oauth</code>. Pro ověření příčiny bezpečnostní plugin na chvíli vypněte, zkuste to znovu a pak ho s nastavenými výjimkami znovu zapněte. Tlačítko <strong>Zkontrolovat připojení</strong> na přehledu ukáže, která adresa je blokována."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Tlačítko &bdquo;Edit Config&ldquo; v Claude Desktop po kliknutí nic nedělá"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Toto tlačítko se snaží předat <code>claude_desktop_config.json</code> programu, kterým váš počítač otevírá soubory <code>.json</code>. Pokud jste to nenastavili, tlačítko tiše nedělá nic. Řešení: otevřete soubor sami v libovolném textovém editoru. Cesty pro jednotlivé operační systémy jsou uvedeny v části Claude v rozbalovací sekci Pokročilé výše. Pokud soubor ještě neexistuje, vytvořte ho a jako celý jeho obsah použijte ukázku z té části (obalte ji jako <code>{&quot;mcpServers&quot;: { ... }}</code>). Žádné změny oprávnění nejsou potřeba &mdash; soubor leží ve vaší vlastní uživatelské složce."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="Dialog &bdquo;Add custom connector&ldquo; v Claude nebo &bdquo;Add custom MCP server&ldquo; v ChatGPT nemá pole pro klíč API"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Tyto dialogy jsou postavené na připojení přihlášením (OAuth); klíč API MCP for J do nich nejde vložit. Tento web má přihlašování OAuth vypnuté. Super User ho může zapnout v Komponenty &rarr; MCP for J &rarr; Možnosti &rarr; <strong>Přihlašování OAuth</strong> a pak oba dialogy fungují. Do té doby: Claude Desktop může použít postup s wrapper skriptem výše, claude.ai jednoduché nastavení a uživatelé ChatGPT Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop při spuštění hlásí &bdquo;Some MCP servers could not be loaded&ldquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (srpen 2026) zpřísnil kontrolu konfiguračního souboru a nyní odmítá záznamy, jejichž argumenty příkazu vypadají, že by mohly obsahovat přihlašovací údaje. Tím jsou zablokovány dva zřejmé způsoby, jak nastavit server MCP s tokenem Bearer přímo v <code>claude_desktop_config.json</code>: nativní tvar <code>type: http</code> A předání <code>mcp-remote</code> s argumentem <code>--header &quot;Authorization: Bearer ...&quot;</code>. Obojí v konfiguračním souboru vypadá správně, ale validátor schématu Claude Desktop je při načítání zahodí. <strong>Oprava:</strong> použijte postup s wrapper skriptem popsaný v části Claude v sekci Pokročilé výše &mdash; vložte celý příkaz do malého souboru <code>.cmd</code> a v konfiguraci Claude Desktop se na tento soubor jen odkažte. Claude Desktop vidí prostý příkaz bez viditelných argumentů a přijme ho. Váš klíč API zůstane přesně tak bezpečný jako dřív &mdash; wrapper soubor leží ve vaší vlastní uživatelské složce."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Restartoval(a) jsem Claude Desktop, ale nové připojení stále nevidí"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="Ve Windows zavření okna Claude Desktop aplikaci jen skryje do oznamovací oblasti &mdash; celá aplikace dál běží se STAROU konfigurací v paměti. Kliknutí na ikonu na hlavním panelu později jen vrátí okno z tohoto už běžícího procesu. Claude Desktop znovu načte svůj konfigurační soubor jen při skutečném restartu aplikace. Jak ji opravdu restartovat: klikněte pravým tlačítkem na ikonu Claude v oznamovací oblasti (pravý dolní roh, možná budete muset kliknout na malou šipku nahoru, aby se zobrazily skryté ikony) &rarr; zvolte <strong>Quit</strong> &rarr; počkejte asi 3 sekundy, než se proces úplně ukončí &rarr; spusťte Claude Desktop znovu z nabídky Start. Teprve pak se změny konfiguračního souboru projeví."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Často kladené dotazy"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Může někdo toto připojení použít bez klíče API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="Ne. Každý požadavek musí nést platný klíč API, nebo přístupový token OAuth, pokud je zapnuté přihlašování OAuth. Požadavky bez nich se odmítají. Je to záměr &mdash; AI může na vašem webu provádět skutečné akce (vytvářet články, upravovat uživatele atd.), takže anonymní přístup by byl bezpečnostní katastrofou."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Může mít jeden uživatel Joomla několik aktivních klíčů API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="Ne. Joomla ukládá pro každého uživatele přesně jeden klíč API. Kliknutí na Obnovit vygeneruje nový a starý zneplatní. Pokud potřebujete více klíčů (jeden na zařízení, jeden na nástroj AI atd.), vytvořte samostatné uživatele Joomla."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Je nějaký limit, kolik to můžu používat?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="Samotné MCP for J žádný limit požadavků nemá. Platí běžné limity hostingu (paměť PHP, připojení MariaDB atd.). Pokud generujete velký provoz (rozsáhlé dávkové operace napříč mnoha weby), domluvte se s poskytovatelem hostingu na zvýšení souběžnosti PHP-FPM."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Musím otevírat nějaké porty ve firewallu nebo nastavovat něco zvláštního?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="Ne. MCP používá jen standardní HTTPS na portu 443. Pokud je váš web už veřejně dostupný na <code>https://yoursite.com/</code>, je koncový bod MCP dostupný z jakéhokoli klienta AI na internetu bez dalšího nastavení."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="Jak pravidelně měnit (rotovat) svůj klíč API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Automatický plánovač neexistuje &mdash; rotujete ručně, kdy chcete. Přejděte do Uživatelé &rarr; uživatel &rarr; karta Joomla API Token &rarr; klikněte na Obnovit. Pak aktualizujte konfiguraci klienta AI novým klíčem. Dobrý zvyk: rotujte každý klíč, který se kdy objevil na snímku obrazovky, v protokolu nebo v hlášení chyby."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Používám klienta AI, který není uveden výše &mdash; bude fungovat?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Téměř jistě ano, pokud podporuje standardní MCP přes HTTPS a buď umožňuje přidat vlastní hlavičku Authorization, nebo se umí přihlásit přes OAuth (zapněte přihlašování OAuth v Možnostech). URL je všude stejná &mdash; liší se jen rozhraní nastavení v klientovi. Klienti, o kterých víme, že fungují, ale nenapsali jsme pro ně podrobné návody: Continue.dev, Windsurf, editor Zed, mcp-cli, MCP Inspector, LibreChat, Open WebUI (přes most <code>mcpo</code>) a různí agenti založení na Ollama."

