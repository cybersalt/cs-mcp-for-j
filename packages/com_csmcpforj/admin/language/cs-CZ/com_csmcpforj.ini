; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Firewall a rozšíření pro URL"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall je zapnutý."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="Může blokovat požadavky MCP (&bdquo;403 Access Forbidden &mdash; Malware detected&ldquo;) a přihlašování claude.ai. V RSFirewall přidejte dvě výjimky: <code>csmcpforj_oauth</code> a <code>api\/index\.php\/v1\/mcp</code> jako regulární výraz."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools je zapnutý."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="Jeho Web Application Firewall může blokovat požadavky MCP a přihlašování. Pokud <strong>Zkontrolovat připojení</strong> ukáže blokování, najděte pravidlo v Blocked Requests Log v Admin Tools a přidejte výjimku WAF, nebo pravidlo vypněte. Povolte <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> a URL obsahující <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck je zapnutý."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="Jeho firewall může blokovat požadavky MCP a přihlašování. Pokud <strong>Zkontrolovat připojení</strong> ukáže blokování, najděte požadavek v jeho protokolech a přidejte výjimku pro <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> a URL obsahující <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 je zapnutý."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Toto rozšíření SEO může zachytit přihlašovací adresy (<code>index.php?csmcpforj_oauth=&hellip;</code>) a odpovědět domovskou stránkou, takže se claude.ai nebo ChatGPT nemůže zaregistrovat a neuvede jasný důvod. Pokud <strong>Zkontrolovat připojení</strong> ukazuje u přihlašovacích koncových bodů domovskou stránku, vyřaďte v Route 66 URL obsahující <code>csmcpforj_oauth</code>, nebo vypněte jeho systémový plugin."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Blokovat mohou i firewally provozované hostingem: o2switch TigerProtect odpovídá 503 a pravidla Imunify360, ModSecurity nebo Cloudflare odpovídají 403. Požádejte hosting, aby povolil výše uvedené adresy, nebo aby pro claude.ai pustil servery Anthropic (<code>160.79.104.0/21</code>). <strong>Cloudflare</strong>: Browser Integrity Check a Security Level mohou servery aplikací blokovat. Přidejte vlastní pravidlo WAF (Security &rarr; WAF &rarr; Custom rules) s akcí <strong>Skip</strong> pro požadavky, jejichž cesta URI obsahuje <code>/api/index.php/v1/mcp</code> nebo <code>/.well-known/oauth-</code>, nebo jejichž řetězec dotazu obsahuje <code>csmcpforj_oauth</code>, a zaškrtněte <em>Browser Integrity Check</em> a <em>Security Level</em>. Bot Fight Mode nelze pravidlem přeskočit, takže ho vypněte, pokud blokuje."

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Kontrolní seznam pro claude.ai: &bdquo;cannot register&ldquo;, &bdquo;Authorization failed&ldquo; nebo &bdquo;Couldn't reach the MCP server&ldquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Projděte je popořadě. Každý z nich už někoho stál hodiny."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Použijte přesně tuto adresu: <code>%s</code>. S <em>www</em> nebo bez musí odpovídat tomu, jak web odpovídá, <strong>bez přesměrování</strong> mezi tím (z www na holou doménu nebo z http na https). Tlačítko <strong>Zkontrolovat připojení</strong> na přehledu přesměrování nahlásí."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="Přihlašování OAuth je na tomto webu zapnuté. claude.ai se může připojit jen přihlášením, takže musí zůstat zapnuté."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>Přihlašování OAuth je na tomto webu vypnuté.</strong> claude.ai se může připojit jen přihlášením, takže ho Super User musí nejprve zapnout: Komponenty &rarr; MCP for J &rarr; Možnosti &rarr; <strong>Přihlašování OAuth</strong>. Dokud je vypnuté, claude.ai hlásí, že &bdquo;cannot register&ldquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="V dialogu <strong>Add custom connector</strong> zvolte <strong>Sign in now</strong>. Pro klienta OAuth fungují obě volby, <strong>Use Claude's published identity</strong> i <strong>Register automatically</strong> (zveřejněná identita vyžaduje na serveru rozšíření PHP curl). ID klienta a tajný klíč nechte prázdné. Pokud jeden způsob selže, odeberte konektor a přidejte ho znovu tím druhým."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>Nepřidávejte hlavičky požadavku.</strong> claude.ai nepřijímá hlavičku <code>X-Joomla-Token</code>, takže klíč API tam použít nejde. Přihlášení je jediná cesta dovnitř z claude.ai."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Firewally musí pustit servery claude.ai. Připojují se z <code>160.79.104.0/21</code>, ne z vašeho prohlížeče. RSFirewall potřebuje dvě výjimky: <code>csmcpforj_oauth</code> a <code>api\/index\.php\/v1\/mcp</code> jako regulární výraz. Blokovat mohou i Admin Tools, Securitycheck a firewally hostingu, jako je o2switch TigerProtect (který odpovídá 503). <strong>Cloudflare</strong>: Browser Integrity Check a Security Level mohou servery aplikací blokovat. Přidejte vlastní pravidlo WAF (Security &rarr; WAF &rarr; Custom rules) s akcí <strong>Skip</strong> pro požadavky, jejichž cesta URI obsahuje <code>/api/index.php/v1/mcp</code> nebo <code>/.well-known/oauth-</code>, nebo jejichž řetězec dotazu obsahuje <code>csmcpforj_oauth</code>, a zaškrtněte <em>Browser Integrity Check</em> a <em>Security Level</em>. Bot Fight Mode nelze pravidlem přeskočit, takže ho vypněte, pokud blokuje. Tlačítko <strong>Zkontrolovat připojení</strong> na přehledu ukáže, co odpovídá."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> a další rozšíření SEO, která přepisují URL, mohou zachytit přihlašovací adresy (<code>index.php?csmcpforj_oauth=&hellip;</code>) a odpovědět domovskou stránkou, takže se aplikace nemůže zaregistrovat a neuvede jasný důvod. Pokud <strong>Zkontrolovat připojení</strong> ukazuje u přihlašovacích koncových bodů domovskou stránku, vyřaďte v tom rozšíření URL obsahující <code>csmcpforj_oauth</code>, nebo vypněte jeho systémový plugin."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Přihlaste se účtem, který smí používat MCP (viz <em>Kdo může tento koncový bod používat?</em> na přehledu). Pokud to selhává jen jedné osobě, zkontrolujte, že její účet není zablokovaný a nemá nastaveno <em>Vyžadovat obnovení hesla</em>."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="Stále si nevíte rady? Komponenty &rarr; MCP for J &rarr; <strong>Protokoly</strong> ukazuje každý krok přihlašování a proč byl krok odmítnut."
