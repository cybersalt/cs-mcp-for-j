; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Kdo může tento koncový bod používat?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="Oprávnění se kontrolují podle uživatelského účtu Joomla, kterému token API patří. Klient MCP (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl a cokoli dalšího) jen předává požadavky &mdash; stejný token se v každém klientovi chová stejně."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Důležité:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Kdo token vygeneruje, získá přes koncový bod MCP stejný přístup, jaký má kdekoli jinde v administraci Joomla. Generujte tokeny jen pro uživatele, kterým byste tyto akce svěřili i přímo."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Skupina uživatelů Joomla"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Funguje hned po instalaci?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Proč"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Ano"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Vyžaduje výslovné udělení"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Super User v Joomla vždy projde každou kontrolou oprávnění."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Má core.manage díky výchozím oprávněním Joomla, což brána MCP přijímá pro nástroje ke čtení i zápisu (nástroje, které mění oprávnění, rozšíření, nastavení pluginů nebo samotnou Joomla, stále vyžadují Super User) &mdash; skupina ale stále potřebuje <strong>Přihlásit se k webovým službám</strong>, jinak ji Joomla vůbec nenechá ověřit."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="Ve výchozím stavu nemá žádné oprávnění MCP. Udělte skupině <strong>Přihlásit se k webovým službám</strong> v Systém &rarr; Globální nastavení &rarr; Oprávnění, poté Používat koncový bod MCP a (volitelně) Zapisovat přes koncový bod MCP v <strong>Možnosti &rarr; Oprávnění</strong> této komponenty."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Vyžaduje Přihlásit se k webovým službám"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Než cokoli z toho začne platit:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla chrání celé API samostatným oprávněním <strong>Přihlásit se k webovým službám</strong> (<code>core.login.api</code>) a <strong>ve výchozím stavu ho mají jen Super Users</strong>. Každá jiná skupina &mdash; včetně Administrator a Manager &mdash; dostane od každého nástroje <code>403 Forbidden</code>, dokud ho neudělíte, bez ohledu na to, co dalšího v administraci smí. Nastavte ho v <strong>Systém &rarr; Globální nastavení &rarr; Oprávnění</strong>, u skupiny, ne u této komponenty."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / vlastní skupina"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Udělte skupině <strong>Přihlásit se k webovým službám</strong> v Systém &rarr; Globální nastavení &rarr; Oprávnění, poté Používat koncový bod MCP a (volitelně) Zapisovat přes koncový bod MCP v <strong>Možnosti &rarr; Oprávnění</strong> této komponenty."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Připojte k tomuto webu asistenta AI"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Jsou dva způsoby. První (zkopírovat a vložit prompt) je nejjednodušší &mdash; funguje bez jakékoli konfigurace klienta a poté, co vaše AI potvrdí, že funguje, vám obvykle nabídne nainstalovat tento web jako trvalý konektor bez ručních úprav JSON. Druhý je pro uživatele, kteří raději upravují konfiguraci klienta přímo."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Zkopírovat prompt k nastavení (doporučeno)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Vložte prompt k nastavení do svého asistenta AI"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Žádná konfigurace klienta není potřeba. Zkopírujte níže uvedený prompt do nové konverzace se svým asistentem AI (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini atd.). AI spustí testovací curl, potvrdí připojení a &mdash; v klientech, které to podporují &mdash; vám nabídne udělat připojení trvalým, bez úprav souborů JSON a bez pamatování příkazů terminálu."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Bonus:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Pokud má váš klient AI nástroj shell (Codex, Claude Code, Cursor Composer, Cline, Continue, režim agenta GitHub Copilot atd.), obsahuje prompt nabídku samoinstalace. Jakmile AI potvrdí, že připojení funguje, stačí říct &bdquo;make it permanent&ldquo; a AI spustí příkaz vhodný pro daného klienta, který server MCP zaregistruje (například <code>codex mcp add</code> nebo <code>claude mcp add</code>). Po restartu klienta se tento web objeví jako nativní nástroje MCP v každé konverzaci &mdash; prompt už nikdy nebude potřeba."
