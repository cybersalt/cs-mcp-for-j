COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_LABEL="Katalog"
COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_DESC="Nastavení prohlížeče katalogu doplňků MCP."
COM_CSMCPFORJ_CONFIG_CATALOG_URL_LABEL="URL koncového bodu katalogu"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_DESC="Odkud se katalog doplňků MCP načítá. Ponechte výchozí hodnotu, pokud neprovozujete soukromé zrcadlo katalogu; k samotné základní URL se přidá /catalog.json."
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="Doba platnosti mezipaměti katalogu (hodiny)"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="Jak dlouho se načtený catalog.json uchovává v mezipaměti, než se načte znovu. Tlačítko ručního obnovení na stránce katalogu toto obchází. Rozsah 1&ndash;168 (jeden týden)."
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="Zobrazit nedostupné doplňky Pro"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Zobrazovat doplňky Pro v katalogu, i když momentálně nemáte členství Pro. Hodí se k procházení nabídky; nastavte Ne, chcete-li je úplně skrýt."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Znovu ověřit členství každých (sekund)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="Jak často se přehled znovu ptá cybersalt.com, zda propojený e-mail stále má přístup Pro. 86400 = jednou denně (doporučeno). Minimum 60, maximum 604800 = jednou týdně."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="Server MCP"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Ovládání koncového bodu MCP na straně serveru. Ovlivňuje, co klienti MCP vidí a mohou volat."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Režim jen pro čtení"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="Při ANO koncový bod MCP nabízí a přijímá jen nástroje, které jejich MCP ToolAnnotations označují jako jen pro čtení (list_*, get_*, read_*, check_*, validate_*, fetch_* a joomla_update_healthcheck). Hodí se, když chcete, aby klient AI web prozkoumal bez jakékoli možnosti měnit obsah. Zápisy vrátí chybu s vysvětlením, že server je v režimu jen pro čtení. Nastavení je spodní hranice: klient MCP může na URL koncového bodu předat ?read_only=1 a omezit se ještě víc, ale nemůže ODEMKNOUT zápisy na webu, který má toto nastaveno na ANO."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Soukromí při nahrávání obrazovky"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Nastavení ochrany rozmazáním tajných údajů na přehledu (token Joomla API v náhledu promptu, e-mail členství Pro). Rozmazání je ve výchozím stavu zapnuté; tyto možnosti ladí odhalení najetím myší, aby náhodné přejetí myší tajný údaj omylem neodhalilo při sdílení obrazovky nebo nahrávání."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Prodleva odhalení najetím (sekundy)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Kolik sekund musíte držet ukazatel myši nad rozmazaným tajným údajem, než se odhalí. Zatímco myš držíte, zobrazí se vedle údaje malý odpočet, abyste věděli, že časovač běží. Odjetí myší odhalení zruší a časovač vynuluje &mdash; další najetí spustí nový odpočet v plné délce. Nastavte 0 pro okamžité odhalení při najetí (odstraní ochranu proti náhodnému přejetí myší, ale vrátí klasické chování na jedno najetí). Výchozí hodnota 3 sekundy."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Automaticky skrýt po odhalení (sekundy)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Jakmile se tajný údaj odhalí podržením myši, kolik sekund zůstane viditelný, než se automaticky znovu rozmaže &mdash; i když je myš stále nad ním. Pojistka pro situace typu &bdquo;podíval jsem se, přečetl to a pak mě něco vyrušilo&ldquo;, kdy by jinak opuštěný prohlížeč mohl nechat tajný údaj odhalený neomezeně dlouho. Odjetí myší vždy okamžitě znovu rozmaže bez ohledu na toto nastavení. Nastavte 0 pro vypnutí automatického skrytí (odhalené údaje zůstanou viditelné, dokud myší neodjedete). Výchozí hodnota 8 sekund &mdash; dost dlouho na pohodlné přečtení celého tokenu base64, dost krátce na to, aby opuštěná relace tajný údaj neodhalila."

; Countdown pill copy — the {seconds} token gets substituted at render
