COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Vygenerujte token Joomla API ve svém profilu (odkaz vpravo)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Klikněte níže na &bdquo;Zkopírovat prompt&ldquo;."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Vložte ho do nové konverzace se svým asistentem AI. Pokud jste přeskočili krok 2, nejprve nahraďte <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> svým skutečným tokenem."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Odešlete. AI otestuje připojení a v klientech, které to podporují, nabídne udělat připojení trvalým."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Tento prompt funguje v každém klientovi AI s nástrojem shell/terminál: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (režim agenta), Gemini CLI, Windsurf, mcp-cli atd. Nefunguje ve webových chatech (claude.ai, chatgpt.com, gemini.google.com), které přístup k shellu nemají &mdash; pro ty použijte kartu Konektor MCP."

