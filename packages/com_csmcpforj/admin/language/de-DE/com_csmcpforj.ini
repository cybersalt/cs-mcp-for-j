; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Firewall- und URL-Erweiterungen"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall ist eingeschaltet."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="Es kann MCP-Anfragen (&ldquo;403 Access Forbidden &mdash; Malware detected&rdquo;) und die Anmeldung von claude.ai blockieren. Fügen Sie in RSFirewall zwei Ausnahmen hinzu: <code>csmcpforj_oauth</code> und <code>api\/index\.php\/v1\/mcp</code> als regulären Ausdruck."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools ist eingeschaltet."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="Seine Web Application Firewall kann MCP-Anfragen und die Anmeldung blockieren. Wenn <strong>Verbindung prüfen</strong> eine Sperre zeigt, suchen Sie die Regel im Blocked Requests Log von Admin Tools und fügen Sie eine WAF-Ausnahme hinzu, oder schalten Sie die Regel aus. Erlauben Sie <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> und URLs, die <code>csmcpforj_oauth</code> enthalten."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck ist eingeschaltet."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="Seine Firewall kann MCP-Anfragen und die Anmeldung blockieren. Wenn <strong>Verbindung prüfen</strong> eine Sperre zeigt, suchen Sie die Anfrage in seinen Protokollen und fügen Sie eine Ausnahme für <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> und URLs mit <code>csmcpforj_oauth</code> hinzu."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 ist eingeschaltet."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Diese SEO-Erweiterung kann die Anmeldeadressen (<code>index.php?csmcpforj_oauth=&hellip;</code>) abfangen und mit der Startseite antworten, sodass sich claude.ai oder ChatGPT nicht registrieren kann und keinen klaren Grund nennt. Wenn <strong>Verbindung prüfen</strong> für die Anmelde-Endpunkte die Startseite zeigt, schließen Sie in Route 66 URLs mit <code>csmcpforj_oauth</code> aus oder schalten Sie sein System-Plugin aus."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Auch Firewalls des Hosters können blockieren: o2switch TigerProtect antwortet mit 503, Regeln von Imunify360, ModSecurity oder Cloudflare antworten mit 403. Bitten Sie den Hoster, die Adressen oben zu erlauben oder die Server von Anthropic (<code>160.79.104.0/21</code>) für claude.ai durchzulassen. <strong>Cloudflare</strong>: Browser Integrity Check und Security Level können die Server der Apps blockieren. Legen Sie eine benutzerdefinierte WAF-Regel an (Security &rarr; WAF &rarr; Custom rules) mit der Aktion <strong>Skip</strong> für Anfragen, deren URI-Pfad <code>/api/index.php/v1/mcp</code> oder <code>/.well-known/oauth-</code> enthält oder deren Query-String <code>csmcpforj_oauth</code> enthält, und setzen Sie die Häkchen bei <em>Browser Integrity Check</em> und <em>Security Level</em>. Bot Fight Mode lässt sich nicht per Regel überspringen; schalten Sie es also aus, wenn es blockiert."

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Checkliste für claude.ai: &ldquo;cannot register&rdquo;, &ldquo;Authorization failed&rdquo; oder &ldquo;Couldn't reach the MCP server&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Gehen Sie diese Punkte der Reihe nach durch. Jeder davon hat schon jemanden Stunden gekostet."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Verwenden Sie genau diese Adresse: <code>%s</code>. Mit oder ohne <em>www</em> muss dazu passen, wie die Website antwortet, <strong>ohne Weiterleitung</strong> dazwischen (von www zur Domain ohne www, oder von http zu https). Die Schaltfläche <strong>Verbindung prüfen</strong> im Dashboard meldet eine Weiterleitung."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="Die OAuth-Anmeldung ist auf dieser Website eingeschaltet. claude.ai kann sich nur per Anmeldung verbinden, daher muss sie eingeschaltet bleiben."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>Die OAuth-Anmeldung ist auf dieser Website ausgeschaltet.</strong> claude.ai kann sich nur per Anmeldung verbinden, daher muss ein Super User sie zuerst einschalten: Komponenten &rarr; MCP for J &rarr; Optionen &rarr; <strong>OAuth-Anmeldung</strong>. Solange sie aus ist, meldet claude.ai &ldquo;cannot register&rdquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="Wählen Sie im Dialog <strong>Add custom connector</strong> die Option <strong>Sign in now</strong>. Für den OAuth-Client funktionieren <strong>Use Claude's published identity</strong> und <strong>Register automatically</strong> beide (die veröffentlichte Identität braucht die curl-Erweiterung von PHP auf dem Server). Lassen Sie Client-ID und Secret leer. Wenn ein Weg fehlschlägt, entfernen Sie den Konnektor und fügen Sie ihn mit dem anderen erneut hinzu."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>Fügen Sie keine Request-Header hinzu.</strong> claude.ai akzeptiert keinen Header <code>X-Joomla-Token</code>, daher kann dort kein API-Schlüssel verwendet werden. Die Anmeldung ist der einzige Weg von claude.ai aus."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Firewalls müssen die Server von claude.ai durchlassen. Diese verbinden sich von <code>160.79.104.0/21</code> aus, nicht aus Ihrem Browser. RSFirewall braucht zwei Ausnahmen: <code>csmcpforj_oauth</code> und <code>api\/index\.php\/v1\/mcp</code> als regulären Ausdruck. Admin Tools, Securitycheck und Firewalls des Hosters wie o2switch TigerProtect (das mit 503 antwortet) können es ebenfalls blockieren. <strong>Cloudflare</strong>: Browser Integrity Check und Security Level können die Server der Apps blockieren. Legen Sie eine benutzerdefinierte WAF-Regel an (Security &rarr; WAF &rarr; Custom rules) mit der Aktion <strong>Skip</strong> für Anfragen, deren URI-Pfad <code>/api/index.php/v1/mcp</code> oder <code>/.well-known/oauth-</code> enthält oder deren Query-String <code>csmcpforj_oauth</code> enthält, und setzen Sie die Häkchen bei <em>Browser Integrity Check</em> und <em>Security Level</em>. Bot Fight Mode lässt sich nicht per Regel überspringen; schalten Sie es also aus, wenn es blockiert. Die Schaltfläche <strong>Verbindung prüfen</strong> im Dashboard zeigt, was antwortet."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> und andere SEO-Erweiterungen, die URLs umschreiben, können die Anmeldeadressen (<code>index.php?csmcpforj_oauth=&hellip;</code>) abfangen und mit der Startseite antworten, sodass sich die App nicht registrieren kann und keinen klaren Grund nennt. Wenn <strong>Verbindung prüfen</strong> für die Anmelde-Endpunkte die Startseite zeigt, schließen Sie in dieser Erweiterung URLs mit <code>csmcpforj_oauth</code> aus oder schalten Sie ihr System-Plugin aus."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Melden Sie sich mit einem Konto an, das MCP verwenden darf (siehe <em>Wer kann diesen Endpunkt verwenden?</em> im Dashboard). Wenn es nur bei einer Person fehlschlägt, prüfen Sie, ob ihr Konto nicht gesperrt ist und nicht auf <em>Passwortzurücksetzung erfordern</em> steht."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="Immer noch nicht weiter? Komponenten &rarr; MCP for J &rarr; <strong>Protokolle</strong> zeigt jeden Schritt der Anmeldung und warum ein Schritt abgelehnt wurde."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_JUMP="Springen zu:"
