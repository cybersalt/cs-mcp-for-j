COM_CSMCPFORJ_DASHBOARD_PRO_INTRO="Wenn Sie Ihr Cybersalt-Extensions-Konto verknüpfen, kann diese Website die Pro-MCP-Add-ons, die Sie gekauft haben, installieren und automatisch aktualisieren &mdash; egal ob All-Access-Mitgliedschaft oder ein einzeln gekauftes Add-on.<br><br>Wenn Sie auf <strong>Konto verknüpfen</strong> klicken, registriert diese Website eine <strong>Download-ID</strong> (die Ihre Domain enthält) bei <code>cybersalt.com</code> und verknüpft sie mit der E-Mail-Adresse, mit der Sie gekauft haben. Diese Verknüpfung berechtigt jeden Pro-Download und jedes Pro-Update für die Add-ons, die Ihr Konto besitzt. Dafür werden Ihre E-Mail-Adresse und die Domain dieser Website an cybersalt.com gesendet; es wird kein Passwort gesendet &mdash; die E-Mail-Adresse ist der Schlüssel."
