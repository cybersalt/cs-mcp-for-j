COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="OAuth-Anmeldung"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Lässt KI-Apps sich verbinden, indem sie Sie zur Anmeldeseite dieser Website schicken, statt dass Sie einen API-Schlüssel in sie kopieren. ChatGPT (&ldquo;Add custom MCP server&rdquo;) und claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) können sich nur auf diesem Weg verbinden. Verbindungen mit API-Schlüssel funktionieren in jedem Fall weiter."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="OAuth-Anmeldung einschalten"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Wenn eingeschaltet, fügen Sie die MCP-Adresse dieser Website in eine KI-App ein, die App öffnet die Anmeldeseite dieser Website, Sie melden sich mit Ihrem üblichen Benutzernamen und Passwort an und klicken auf Erlauben. Die App handelt dann als Sie, mit genau Ihren Berechtigungen auf dieser Website. Verbundene Apps werden im Dashboard aufgelistet, wo jede getrennt werden kann. Wenn Sie dies ausschalten, werden alle sofort getrennt."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Gültigkeit des Zugriffstokens (Sekunden)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Wie lange jedes Zugriffstoken gilt, bevor die App es unbemerkt erneuert. Standard 3600 (eine Stunde). Zwischen 300 und 86400."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Angemeldet bleiben für (Tage)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Wie lange eine App weiter erneuern darf, ohne dass sich der Benutzer erneut anmeldet. Jede Erneuerung setzt die Uhr zurück. Standard 30."
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="KI-Apps per Anmeldung verbinden"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="Manche KI-Apps, darunter ChatGPT und claude.ai, können sich nur mit einer Website verbinden, indem sie Sie zur Anmeldeseite dieser Website schicken. Das ist auf dieser Website ausgeschaltet, daher können sich diese Apps noch nicht verbinden. Schalten Sie in den Optionen die <strong>OAuth-Anmeldung</strong> ein, um es zu erlauben. Verbindungen mit API-Schlüssel funktionieren in jedem Fall weiter."
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="Optionen öffnen, um es einzuschalten"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="Kein API-Schlüssel nötig. Das Einzige, was Sie kopieren, ist die <strong>Endpunkt-URL</strong> dieser Website."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="Prüfe, ob KI-Apps die Anmeldeseite dieser Website finden können&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>Bereit.</strong> KI-Apps können die Anmeldeseite dieser Website finden."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>Nicht bereit.</strong> KI-Apps finden die Anmeldeseite dieser Website nicht und können sich daher nicht verbinden. Zur Behebung schalten Sie unter System &rarr; Konfiguration <strong>URL-Rewrite nutzen</strong> ein und stellen sicher, dass die .htaccess-Datei der Website vorhanden ist. Die Einzelheiten stehen im Abschnitt Fehlerbehebung der Einrichtungsanleitung."
