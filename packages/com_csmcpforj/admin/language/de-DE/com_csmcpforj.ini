COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Kein API-Schlüssel zu kopieren. Fügen Sie in Ihrer KI-App einen Konnektor hinzu und fügen Sie die <strong>Endpunkt-URL</strong> dieser Website ein (unten). Wenn Sie auf Connect klicken, öffnet die App selbst die Anmeldeseite dieser Website: Melden Sie sich mit Ihrem Benutzernamen und Passwort für diese Website an und klicken Sie dann auf <strong>Erlauben</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai und Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Geben Sie einen Namen ein, fügen Sie die Endpunkt-URL ein und klicken Sie auf Continue. Lassen Sie <em>Sign in now</em> stehen; für den OAuth-Client funktionieren <em>Use Claude's published identity</em> und <em>Register automatically</em> beide. Fügen Sie keine Request-Header hinzu. Klicken Sie auf Add und dann auf <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> <strong>Plugins</strong> in der linken Seitenleiste &rarr; <strong>Add</strong> (oben rechts) &rarr; <strong>Add custom MCP server</strong>. Geben Sie einen Namen ein, fügen Sie die Endpunkt-URL ein, lassen Sie Authentication auf <strong>OAuth</strong>, setzen Sie das Häkchen, klicken Sie auf <strong>Create as a plugin</strong> und dann auf <strong>Connect</strong>. Braucht einen kostenpflichtigen ChatGPT-Tarif (Plus funktioniert)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>, dann <code>/mcp</code> eingeben, den Server wählen und <strong>Authenticate</strong> wählen."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> Befehlspalette &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; Endpunkt-URL einfügen. VS Code fordert Sie zur Anmeldung auf."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> Fügen Sie <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> unter <code>mcpServers</code> in <code>mcp.json</code> hinzu (ohne Header) und klicken Sie dann in Settings &rarr; MCP neben dem Server auf <strong>Login</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> Fügen Sie für den Server <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> in <code>settings.json</code> hinzu und führen Sie dann <code>/mcp auth &lt;name&gt;</code> aus."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Codex öffnet die Anmeldeseite selbst (falls nicht, führen Sie <code>codex mcp login joomla</code> aus). Klicken Sie innerhalb weniger Minuten auf Erlauben, in einem Browser auf demselben Computer wie Codex. Wenn der Browser dann meldet, dass 127.0.0.1 die Verbindung verweigert hat, verwenden Sie <code>codex mcp login joomla --no-browser</code> und fügen die Adresse dieser Seite ins Terminal ein, oder bleiben Sie bei der API-Schlüssel-Methode unten."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, Endpunkt-URL einfügen und dann auf <strong>Authenticate</strong> klicken."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="Wenn Sie auf Erlauben klicken, handelt die App als das Konto, mit dem Sie sich angemeldet haben, und kann genau das, was dieses Konto auf dieser Website kann, einschließlich Änderungen, falls das Konto sie vornehmen darf. Administratoren und Manager brauchen zuerst die Berechtigung <em>Web-Services-Anmeldung</em> (siehe Berechtigungen im Dashboard). Jede verbundene App wird im Dashboard aufgelistet, wo sie sofort getrennt werden kann."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="Lieber einen API-Schlüssel, oder kann Ihr Client keinen Browser öffnen? Die API-Schlüssel-Methode unter <strong>Erweiterte Einrichtung</strong> unten funktioniert weiterhin für jeden Client."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT (&ldquo;Add custom MCP server&rdquo;) und claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) können sich nur verbinden, indem sie Sie zur Anmeldeseite dieser Website schicken. Das ist auf dieser Website ausgeschaltet. Wenn es eingeschaltet ist, geht das Verbinden so: Adresse dieser Website in die App einfügen, anmelden, auf Erlauben klicken."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="In den Optionen einschalten"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Bitten Sie einen Super User, die <strong>OAuth-Anmeldung</strong> in den Optionen von MCP for J einzuschalten. Bis dahin verwenden Sie die API-Schlüssel-Methode unten."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="Am einfachsten: Claudes Dialog &ldquo;Add custom connector&rdquo; funktioniert auf dieser Website."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="Die Anmeldung ist auf dieser Website eingeschaltet. Gehen Sie also in Claude Desktop oder claude.ai zu <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, fügen Sie die MCP-Adresse dieser Website ein, klicken Sie auf Continue, behalten Sie die erkannten Anmeldeeinstellungen, klicken Sie auf Add und dann auf Connect, melden Sie sich mit Ihrem Benutzernamen und Passwort für diese Website an und klicken Sie auf Erlauben. Die Methode mit der Konfigurationsdatei unten brauchen Sie nur, wenn Sie lieber einen API-Schlüssel verwenden."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai verbindet sich dauerhaft über <strong>Add custom connector</strong>: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, MCP-Adresse dieser Website einfügen, auf Continue klicken, die erkannten Anmeldeeinstellungen behalten, auf Add und dann auf Connect klicken. Melden Sie sich mit Ihrem Benutzernamen und Passwort für diese Website an und klicken Sie auf Erlauben. Die Verbindung steht dann in jedem Chat zur Verfügung."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="Klicken Sie in ChatGPT in der linken Seitenleiste auf <strong>Plugins</strong>, dann auf <strong>Add</strong> (oben rechts) &rarr; <strong>Add custom MCP server</strong>. Geben Sie einen Namen ein (etwa &ldquo;Meine Joomla-Website&rdquo;), fügen Sie die MCP-Adresse dieser Website ein, lassen Sie Authentication auf <strong>OAuth</strong>, setzen Sie das Häkchen bei &ldquo;I understand and want to continue&rdquo; und klicken Sie auf <strong>Create as a plugin</strong>. Klicken Sie auf <strong>Connect</strong>, und ChatGPT öffnet die Anmeldeseite dieser Website: Melden Sie sich mit Ihrem Benutzernamen und Passwort für diese Website an und klicken Sie auf Erlauben. Geben Sie dann in einem Chat <strong>@</strong> ein und wählen Sie das Plugin. Es gibt keinen API-Schlüssel einzufügen."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="Der Dialog &ldquo;Add custom connector&rdquo; verbindet sich, aber die Anmeldung schlägt fehl"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Prüfen Sie der Reihe nach: (1) Das Konto, mit dem Sie sich angemeldet haben, darf MCP verwenden &mdash; Administratoren brauchen <em>Web-Services-Anmeldung</em>, Manager brauchen das plus <em>MCP-Endpunkt verwenden</em> unter Optionen &rarr; Berechtigungen (siehe die Karte <em>Wer kann diesen Endpunkt verwenden?</em> im Dashboard); die Anmeldeseite sagt es Ihnen, wenn nicht; (2) die Karte &ldquo;KI-Apps per Anmeldung verbinden&rdquo; im Dashboard zeigt <strong>Bereit</strong>; (3) Ihre Firewall lässt die Server der App zur Website durch (siehe nächster Eintrag). Geben Sie keine Client-ID und kein Secret ein: Die App registriert sich selbst. (4) Klicken Sie bald nach dem Öffnen der Anmeldeseite auf Erlauben: Apps geben eine Anmeldung nach einer Weile auf (Codex nach etwa 5 Minuten), und ein spätes Erlauben endet mit einem Fehler. Starten Sie Connect erneut, dann klappt es."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai oder ChatGPT erreicht die Website nicht, oder die Anmeldung bricht mittendrin ab"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai und ChatGPT verbinden sich von ihren eigenen Servern aus, nicht aus Ihrem Browser, daher muss die Website über öffentliches HTTPS erreichbar sein. Eine Web Application Firewall (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 oder eine Firewall des Hosters wie o2switch TigerProtect, die mit 503 antwortet) kann diese Anfragen blockieren. Erlauben Sie Anfragen an <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> und <code>index.php?csmcpforj_oauth=&hellip;</code> (die Endpunkte für Registrierung, Token und Widerruf). In RSFirewall genügen diese zwei Ausnahmen: <code>csmcpforj_oauth</code> und <code>api\/index\.php\/v1\/mcp</code> als regulärer Ausdruck. claude.ai verbindet sich von <code>160.79.104.0/21</code> aus. <strong>Cloudflare</strong>: Browser Integrity Check und Security Level können die Server der Apps blockieren. Legen Sie eine benutzerdefinierte WAF-Regel an (Security &rarr; WAF &rarr; Custom rules) mit der Aktion <strong>Skip</strong> für Anfragen, deren URI-Pfad <code>/api/index.php/v1/mcp</code> oder <code>/.well-known/oauth-</code> enthält oder deren Query-String <code>csmcpforj_oauth</code> enthält, und setzen Sie die Häkchen bei <em>Browser Integrity Check</em> und <em>Security Level</em>. Bot Fight Mode lässt sich nicht per Regel überspringen; schalten Sie es also aus, wenn es blockiert. <strong>Route 66</strong> und andere SEO-Erweiterungen, die URLs umschreiben, können die Anmeldeadressen (<code>index.php?csmcpforj_oauth=&hellip;</code>) abfangen und mit der Startseite antworten, sodass sich die App nicht registrieren kann und keinen klaren Grund nennt. Wenn <strong>Verbindung prüfen</strong> für die Anmelde-Endpunkte die Startseite zeigt, schließen Sie in dieser Erweiterung URLs mit <code>csmcpforj_oauth</code> aus oder schalten Sie ihr System-Plugin aus. Die Anmeldeseite selbst wird in Ihrem eigenen Browser geöffnet."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="Das Dashboard meldet, dass KI-Apps die Anmeldeseite dieser Website nicht finden (Nicht bereit)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="KI-Clients suchen die Anmeldedaten unter <code>/.well-known/oauth-authorization-server</code> auf Ihrer Domain. Joomla antwortet dort nur, wenn unter Konfiguration &rarr; <strong>URL-Rewrite nutzen</strong> eingeschaltet ist und die <code>.htaccess</code> der Website vorhanden ist (<code>htaccess.txt</code> umbenennen), oder wenn nginx unbekannte Pfade an <code>index.php</code> weitergibt. Das beeinträchtigt AutoSSL von cPanel nicht, das <code>/.well-known/acme-challenge/</code> verwendet. Eine Website, die in einem Unterordner installiert ist (zum Beispiel <code>example.com/joomla</code>), braucht außerdem im Stammverzeichnis der Domain eine Regel, die <code>/.well-known/oauth-authorization-server/joomla</code> an den Unterordner weiterleitet."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Anmeldung von einem Server oder einem Rechner ohne Browser"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Desktop-Clients (Claude Code, Codex, Cursor, Gemini CLI) öffnen einen Browser auf demselben Rechner und warten auf einer lokalen Adresse auf die Antwort, daher braucht die OAuth-Anmeldung dort einen Browser. Auf einem Server ohne Bildschirm oder über SSH verwenden Sie stattdessen die API-Schlüssel-Methode unter Erweiterte Einrichtung; sie funktioniert überall."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="Fügen Sie in der KI-App einen neuen Konnektor hinzu (claude.ai und Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector; ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server) und fügen Sie diese <strong>Endpunkt-URL</strong> ein: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Klicken Sie auf Connect.</strong> Die App öffnet selbst die Anmeldeseite dieser Website. Melden Sie sich mit Ihrem Benutzernamen und Passwort für diese Website an."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Klicken Sie auf Erlauben.</strong> Sie kommen verbunden zur App zurück. Die App kann alles, was Ihr Konto auf dieser Website darf."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Eine KI-App mit dieser Website verbinden"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Es gibt drei Wege. Klicken Sie auf einen, um seine nummerierten Schritte zu öffnen. Die meisten wollen den ersten."
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. Anmelden (am einfachsten) &mdash; ChatGPT, claude.ai, Claude Desktop und die meisten anderen KI-Apps"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Einen Einrichtungs-Prompt einfügen &mdash; für einen KI-Chat, der Befehle ausführen kann"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. Konfigurationsdatei oder Befehlszeile &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI und andere"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Funktioniert in KI-Apps, die Befehle ausführen können (Codex, Claude Code, Cursor, Cline, Agentenmodus von Copilot und ähnliche). Die KI testet die Verbindung selbst und kann anbieten, sie dauerhaft einzurichten."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="Für Apps, die Sie mit einer Einstellungsdatei oder einem Befehl einrichten. Sie machen es einmal, dann bleibt die Verbindung bestehen."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>Holen Sie Ihr API-Token.</strong> Klicken Sie auf die Schaltfläche: Ihr Benutzerprofil öffnet sich in einem neuen Tab. Öffnen Sie dort den Reiter <strong>Joomla API Token</strong>, klicken Sie auf das Augensymbol, um das Token anzuzeigen, und kopieren Sie es. Kommen Sie dann zu diesem Tab zurück."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="Mein API-Token holen (öffnet einen neuen Tab)"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>Kopieren Sie den Prompt.</strong> Ihr Token ist bereits enthalten."
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="<strong>Fügen Sie ihn in eine neue Unterhaltung</strong> mit Ihrer KI-App ein und senden Sie ihn ab. Die KI testet die Verbindung und bietet, wenn möglich, an, sie dauerhaft einzurichten."
COM_CSMCPFORJ_DASHBOARD_WAY3_STEP_COPY="<strong>Kopieren Sie die Konfiguration.</strong> Ihr Token ist bereits enthalten."
COM_CSMCPFORJ_DASHBOARD_WAY3_GUIDE_LINK="Schritt-für-Schritt-Anleitungen für jede App stehen in der Einrichtungsanleitung &rarr;"
COM_CSMCPFORJ_DASHBOARD_COPY_URL_BUTTON="Kopieren"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1_COPY="<strong>Kopieren Sie die Endpunkt-URL.</strong>"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2_ADD="<strong>Fügen Sie die Endpunkt-URL als Konnektor in Ihrer KI-App hinzu.</strong> Wo das geht, hängt von der App ab:"
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN="Per Anmeldung verbinden"
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN_ON="KI-Apps können sich per Anmeldung verbinden."

