COM_CSMCPFORJ_CONFIG_CATALOG_URL_LABEL="Endpunkt-URL des Katalogs"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_DESC="Woher der Katalog der MCP-Add-ons geladen wird. Behalten Sie den Standard bei, es sei denn, Sie betreiben einen eigenen Spiegel des Katalogs; an eine reine Basis-URL wird /catalog.json angehängt."
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="Cache-Dauer des Katalogs (Stunden)"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="Wie lange die geladene catalog.json zwischengespeichert wird, bevor sie neu geladen wird. Die Schaltfläche zum Aktualisieren auf der Katalogseite umgeht das. Bereich 1&ndash;168 (eine Woche)."
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="Nicht verfügbare Pro-Add-ons anzeigen"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Pro-Add-ons im Katalog anzeigen, auch wenn Sie derzeit keine Pro-Mitgliedschaft haben. Praktisch, um zu sehen, was es gibt; wählen Sie Nein, um sie ganz auszublenden."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Mitgliedschaft erneut prüfen alle (Sekunden)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="Wie oft das Dashboard bei cybersalt.com nachfragt, ob die verknüpfte E-Mail-Adresse noch Pro-Zugang hat. 86400 = einmal täglich (empfohlen). Mindestens 60, höchstens 604800 = einmal pro Woche."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="MCP-Server"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Serverseitige Einstellungen für den MCP-Endpunkt. Sie bestimmen, was MCP-Clients sehen und aufrufen können."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Nur-Lese-Modus"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="Bei JA bietet und akzeptiert der MCP-Endpunkt nur Werkzeuge, deren MCP-ToolAnnotations sie als nur lesend ausweisen (list_*, get_*, read_*, check_*, validate_*, fetch_*, dazu joomla_update_healthcheck). Praktisch, wenn ein KI-Client die Website erkunden soll, ohne Inhalte ändern zu können. Schreibzugriffe liefern einen Fehler mit dem Hinweis, dass der Server im Nur-Lese-Modus ist. Die Einstellung ist eine Untergrenze: Ein MCP-Client kann zusätzlich ?read_only=1 an die Endpunkt-URL anhängen, um weiter einzuschränken, kann aber auf einer Website mit JA hier Schreibzugriffe NICHT freischalten."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Datenschutz bei Bildschirmaufnahmen"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Einstellungen für das Verwischen von Geheimnissen im Dashboard (das Joomla API Token in der Prompt-Vorschau, die E-Mail-Adresse der Pro-Mitgliedschaft). Das Verwischen ist standardmäßig an; mit diesen Optionen passen Sie das Aufdecken per Mauszeiger an, damit eine zufällige Mausbewegung das Geheimnis bei einer Bildschirmfreigabe oder -aufnahme nicht versehentlich zeigt."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Verzögerung beim Aufdecken per Mauszeiger (Sekunden)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Wie viele Sekunden Sie den Mauszeiger über einem verwischten Geheimnis halten müssen, bevor es sichtbar wird. Solange Sie den Zeiger darüber halten, erscheint neben dem Geheimnis eine kleine Countdown-Anzeige, damit Sie sehen, dass der Timer läuft. Wenn Sie die Maus wegbewegen, wird das Aufdecken abgebrochen und der Timer zurückgesetzt &mdash; beim nächsten Mal beginnt der Countdown wieder von vorn. Mit 0 wird sofort aufgedeckt (das entfernt den Schutz vor versehentlichem Überfahren, stellt aber das klassische Verhalten wieder her). Standard: 3 Sekunden."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Nach dem Aufdecken automatisch verbergen (Sekunden)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Wie viele Sekunden ein per Mauszeiger aufgedecktes Geheimnis sichtbar bleibt, bevor es automatisch wieder verwischt wird &mdash; auch wenn die Maus noch darüber steht. Doppelte Absicherung für Fälle wie &ldquo;Ich habe kurz hingesehen, es gelesen und wurde dann abgelenkt&rdquo;, in denen ein unbeaufsichtigter Browser das Geheimnis sonst dauerhaft offenlegen würde. Wenn Sie die Maus wegbewegen, wird es unabhängig von dieser Einstellung immer sofort wieder verwischt. Mit 0 wird das automatische Verbergen abgeschaltet (aufgedeckte Geheimnisse bleiben sichtbar, bis Sie die Maus wegbewegen). Standard: 8 Sekunden &mdash; lang genug, um ein vollständiges Base64-Token in Ruhe zu lesen, kurz genug, dass eine unbeaufsichtigte Sitzung das Geheimnis nicht offenlegt."

