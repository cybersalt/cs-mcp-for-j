; Setup Guide view (v2.4.1 — restructured 2026-08-13 to lead with
; the Dashboard easy-way method and push technical / config-file
; setup into a collapsed Advanced section. Non-technical audience.)
; ============================================================

COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="Einrichtungsanleitung"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="Einrichtungsanleitung"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for J — Einrichtungsanleitung"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Eine KI mit dieser Joomla-Website verbinden"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for J soll es einfach machen, einen KI-Assistenten wie Codex, Claude, ChatGPT oder Cursor mit Ihrer Joomla-Website zu verbinden &mdash; damit die KI Ihre Beiträge lesen, Benutzer verwalten, Inhalte veröffentlichen und mehr kann, alles über den gewohnten Chat der KI. Technisches Wissen brauchen Sie nicht. Der einfache Weg unten funktioniert für die meisten; weiter unten finden Sie erweiterte Optionen, falls Sie sie brauchen."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ Der einfache Weg"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Keine Konfigurationsdateien. Keine Header. Kein Fachjargon. Kopieren Sie einfach einen fertigen Einrichtungs-Prompt aus dem Dashboard und fügen Sie ihn in einen neuen Chat mit Ihrer KI ein. Den Rest erledigt die KI &mdash; sie testet die Verbindung und bietet bei Clients, die das unterstützen, an, die Verbindung dauerhaft für Sie zu speichern."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Holen Sie sich Ihren API-Schlüssel</strong> (ein persönliches Passwort, mit dem Ihre KI auf dieser Website handeln kann). Wie das geht, steht unten, falls Sie noch keinen haben."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Gehen Sie zum Dashboard</strong> (Schaltfläche unten) und fügen Sie dort Ihren API-Schlüssel in das Feld ein."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Klicken Sie im Dashboard auf &ldquo;Prompt kopieren&rdquo;</strong>. Ihr Schlüssel wird vor dem Kopieren automatisch in den Prompt eingesetzt."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Fügen Sie ihn in einen neuen Chat</strong> mit Ihrer KI ein (Claude, ChatGPT, Cursor, Copilot, Gemini usw.) und senden Sie ihn ab. Die KI bestätigt, dass die Verbindung funktioniert, und bietet an, sie zu speichern."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Zum Dashboard"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="Das war's. Ihre KI ist verbunden. Wenn Sie mehr darüber wissen möchten, wie alles zusammenspielt, oder Ihre KI lieber von Hand einrichten, lesen Sie unten weiter &mdash; aber Sie müssen nicht."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Ihren API-Schlüssel holen"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="Ein <strong>API-Schlüssel</strong> ist ein persönliches Passwort, mit dem Ihre KI auf dieser Joomla-Website als SIE handeln kann. Wer den Schlüssel hat, kann alles, was Ihr Joomla-Benutzerkonto kann &mdash; behandeln Sie ihn also vertraulich. So erzeugen Sie einen:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sKlicken Sie hier, um Ihr Joomla-Benutzerprofil zu öffnen%s. Es öffnet sich in einem neuen Tab. Suchen Sie dort den Reiter <strong>Joomla API Token</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="Klicken Sie auf diesem Reiter auf die Schaltfläche <strong>Zurücksetzen</strong>. Joomla erzeugt eine lange Folge aus Buchstaben und Ziffern und setzt sie in das Feld unter der Schaltfläche. Das ist Ihr Schlüssel."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Klicken Sie auf das kleine <strong>Augensymbol</strong> neben dem Feld, um den Schlüssel anzuzeigen, und kopieren Sie dann die ganze Zeichenfolge."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Fügen Sie ihn unten auf dieser Seite in das Feld ein (er wird nur in Ihrem Browser gespeichert, damit die Kopier-Schaltflächen auf dieser Seite ihn automatisch einsetzen können), ODER fügen Sie ihn direkt in das API-Schlüssel-Feld im Dashboard ein, wenn Sie dort die einfache Einrichtung machen."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Behandeln Sie diesen Schlüssel wie ein Passwort."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Fügen Sie ihn nicht in geteilte Dokumente, Screenshots oder Code ein, den Sie veröffentlichen. Falls er jemals bekannt wird, gehen Sie zurück zum Reiter Joomla API Token und klicken erneut auf Zurücksetzen &mdash; der alte Schlüssel ist dann sofort ungültig."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Fügen Sie hier Ihren API-Schlüssel ein (zum Kopieren mit einem Klick auf dieser Seite)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Ihr Schlüssel wird nur in diesem Browser gespeichert</strong> &mdash; er verlässt Ihren Computer nie. Mit der Papierkorb-Schaltfläche vergessen Sie ihn. Wenn Sie das Feld leer lassen, funktionieren die Kopier-Schaltflächen auf dieser Seite trotzdem, aber Sie müssen Ihren Schlüssel dann selbst in den kopierten Ausschnitt einfügen."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Schlüssel anzeigen/verbergen"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Gespeicherten Schlüssel vergessen"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Erweitert: eine KI manuell verbinden (die meisten brauchen das nicht)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Dieser Abschnitt ist für alle, die die Verbindung ihres KI-Clients mit dieser Website von Hand einrichten möchten &mdash; meist durch Bearbeiten einer kleinen Textdatei, einer &ldquo;Konfigurationsdatei&rdquo;. Wenn die einfache Einrichtung oben funktioniert hat, können Sie diesen ganzen Abschnitt ignorieren. Wenn Sie den Einrichtungs-Prompt umgehen und die Verbindung direkt in Ihrem KI-Client registrieren möchten, lesen Sie weiter."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="Die Verbindungs-URL dieser Website"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="Das ist die Adresse, die Ihr KI-Client braucht. Sie fügen sie zusammen mit Ihrem API-Schlüssel in die Einrichtung des Clients ein."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Wählen Sie Ihren KI-Client"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="Verbindungs-URL und API-Schlüssel sind für jede KI gleich &mdash; nur <em>wo Sie sie einfügen</em>, ist je nach Client verschieden. Wählen Sie unten Ihren Client für die genaue Anleitung."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, IDE-Erweiterung oder Desktop-App)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex unterstützt diesen Endpunkt direkt als Streamable-HTTP-MCP-Server. Speichern Sie zuerst den Joomla-API-Schlüssel in einer eigenen Umgebungsvariable für diese Website und registrieren Sie dann den Endpunkt mit dem Namen dieser Umgebungsvariable. Der Schlüssel wird nie in <code>config.toml</code> geschrieben. Wenn Sie die Kopier-Schaltfläche verwenden, nachdem Sie oben einen Schlüssel eingefügt haben, enthält der kopierte Umgebungsbefehl diesen Schlüssel; halten Sie ihn also aus geteilten Terminals, Aufzeichnungen und Support-Anfragen heraus."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; den Schlüssel für künftige Codex-Prozesse speichern"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Öffnen Sie ein neues Terminal, nachdem Sie eine dauerhafte Windows-Umgebungsvariable gesetzt haben. Bereits laufende Codex- und Terminal-Prozesse sehen sie nicht."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; den Schlüssel für dieses Terminal setzen (bei Bedarf in Ihrer sicheren Shell-Umgebung dauerhaft hinterlegen)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Diese Joomla-Website bei Codex registrieren"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Führen Sie <code>codex mcp list</code> aus, starten Sie Codex neu (oder prüfen Sie dessen MCP-Status in der Oberfläche) und rufen Sie dann das harmlose Nur-Lese-Werkzeug <code>get_joomla_version</code> auf. Das prüft Initialisierung, Authentifizierung, das Finden der Werkzeuge und den Aufruf. Für eine Nur-Lese-Verbindung schalten Sie zusätzlich den serverseitigen Nur-Lese-Modus von MCP for J ein; Freigabeeinstellungen im Client können Serverberechtigungen nicht aufheben."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Ungültiges Token bei cPanel oder PHP-FPM?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Der Webserver entfernt möglicherweise den Standard-Header Authorization. Ersetzen Sie den oben angelegten Eintrag in <code>~/.codex/config.toml</code> durch diesen Block, damit Codex dieselbe Umgebungsvariable liest und als <code>X-Joomla-Token</code> sendet, und starten Sie Codex dann neu."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Hinweis &mdash; Claudes Dialog &ldquo;Add custom connector&rdquo; braucht OAuth, und das ist auf dieser Website ausgeschaltet."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Der eingebaute Dialog &ldquo;Add custom connector&rdquo; von Claude Desktop und claude.ai verbindet sich per Anmeldung (OAuth) und hat kein Feld für einen API-Schlüssel. Ein Super User kann die OAuth-Anmeldung in den Optionen von MCP for J einschalten; dann funktioniert dieser Dialog. Bis dahin verwendet die Anleitung für Claude Desktop unten eine Änderung an der Konfigurationsdatei. (Oder nutzen Sie die einfache Einrichtung oben &mdash; sie funktioniert auch mit Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Vier Schritte: Erstellen Sie eine kleine Hilfsdatei, ein &ldquo;Wrapper-Skript&rdquo;, das den Verbindungsbefehl enthält, lassen Sie die Konfigurationsdatei von Claude Desktop darauf verweisen und starten Sie Claude Desktop neu."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Warum ein Wrapper-Skript statt die Verbindung direkt in die Konfiguration von Claude Desktop zu schreiben? Claude Desktop 1.30096+ (Aug. 2026) lehnt Konfigurationseinträge ab, deren Befehlsargumente nach Zugangsdaten aussehen &mdash; eine gut gemeinte Sicherheitsfunktion, die leider den direkten Weg blockiert. Wenn der Befehl in eine kleine Hilfsdatei wandert, umgeht das die Sperre (Claude Desktop sieht nur einen einfachen Befehl ohne sichtbare Argumente), und Ihr API-Schlüssel bleibt genauso sicher wie vorher &mdash; die Hilfsdatei liegt in Ihrem eigenen Benutzerordner, neben der Konfiguration von Claude Desktop selbst."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Einmalige Voraussetzung &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Diese Anleitung setzt voraus, dass Node.js auf Ihrem Computer installiert ist (es bringt einen Befehl namens <code>npx</code> mit). Die meisten Entwicklerumgebungen haben es bereits; falls nicht, installieren Sie es von <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> mit dem LTS-Installer. Die Wrapper-Datei unten erwartet Node.js im Standard-Installationspfad von Windows, <code>C:\Program Files\nodejs\</code>. Wenn Sie es woanders installiert haben, passen Sie den Pfad in der Wrapper-Datei nach dem Kopieren an."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Schritt 1 &mdash; das Wrapper-Skript erstellen"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Vorerst nur für Windows (Mac- und Linux-Benutzer: siehe FAQ). Kopieren Sie den Block unten in eine neue Textdatei. Speichern Sie sie in Ihrem Benutzerordner (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) unter dem Dateinamen <code>claude-mcp-joomla-{sitename}.cmd</code>, wobei Sie <code>{sitename}</code> durch eine kurze Bezeichnung für Ihre Website ersetzen (z. B. <code>cybersaltorg</code>). Achten Sie darauf, dass <code>.cmd</code> wirklich die Dateiendung ist und nicht Teil des Dateinamens &mdash; wählen Sie im Editor &ldquo;Dateityp: Alle Dateien&rdquo;, damit kein <code>.txt</code> angehängt wird. Wenn Sie Ihren API-Schlüssel oben auf dieser Seite in das Feld eingefügt haben, setzt die Kopier-Schaltfläche ihn für Sie ein."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Sie wissen Ihren Windows-Benutzernamen nicht? Öffnen Sie den Datei-Explorer, gehen Sie zu <code>C:\Users\</code> und sehen Sie sich die Ordnernamen an &mdash; einer davon gehört Ihnen."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Schritt 2 &mdash; die Konfigurationsdatei von Claude Desktop öffnen"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Die Einstellungsdatei von Claude Desktop liegt je nach Betriebssystem an einem festen Ort. Öffnen Sie sie mit einem beliebigen Texteditor (VS Code, Editor, TextEdit, Sublime oder was Sie haben):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop hat unter Settings &rarr; Developer eine Schaltfläche <strong>Edit Config</strong>, die die Datei für Sie öffnen soll. Wenn beim Klicken nichts passiert, weiß Ihr Computer nicht, mit welchem Programm <code>.json</code>-Dateien geöffnet werden. Kein Problem &mdash; öffnen Sie die Datei einfach selbst mit einem Texteditor über einen der Pfade oben. Falls die Datei noch nicht existiert, legen Sie sie an und verwenden Sie den Block unten als gesamten Inhalt (eingefasst als <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Schritt 3 &mdash; diesen Block zur Konfiguration von Claude Desktop hinzufügen"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Fügen Sie dies in <code>claude_desktop_config.json</code> ein. Wenn die Datei schon ein <code>mcpServers</code>-Objekt mit anderen Servern enthält, fügen Sie den Eintrag <code>joomla-...</code> daneben ein (kein zweites <code>mcpServers</code>-Objekt einfügen). Wenn die Datei leer ist oder fehlt, verwenden Sie den ganzen Block unten als Inhalt. <strong>Wichtig:</strong> Ersetzen Sie <code>YOUR_WINDOWS_USERNAME</code> durch Ihren tatsächlichen Windows-Benutzernamen."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Diese Konfiguration lässt Claude Desktop nur auf das Wrapper-Skript aus Schritt 1 verweisen. Ihr API-Schlüssel bleibt in der Wrapper-Datei, nicht in der Konfiguration von Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Schritt 4 &mdash; Claude Desktop vollständig beenden und neu öffnen"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop liest seine Konfigurationsdatei nur beim Start. Beenden Sie es vollständig &mdash; klicken Sie unter Windows mit der rechten Maustaste auf das Claude-Symbol im Infobereich der Taskleiste (unten rechts, eventuell zuerst auf den kleinen Pfeil nach oben klicken) und wählen Sie Quit. Warten Sie ein paar Sekunden und starten Sie es neu. Klicken Sie in einer beliebigen Unterhaltung auf das Werkzeugsymbol (oder fragen Sie &ldquo;Welche Werkzeuge hast du?&rdquo;) &mdash; die Werkzeuge der Website sollten aufgelistet sein. Falls nicht, siehe Fehlerbehebung unten."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (Terminal oder VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Wenn Sie Claude Code verwenden, richtet ein einziger Terminalbefehl die Verbindung ein &mdash; ohne eine Konfigurationsdatei zu bearbeiten. Fügen Sie Ihren API-Schlüssel oben in das Feld ein, damit die Kopier-Schaltfläche unten ihn einsetzt, fügen Sie den Befehl dann in ein Terminal ein und drücken Sie die Eingabetaste. Claude Code bestätigt die Verbindung sofort und lädt neu."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (die Webversion)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="Der Dialog <strong>Add custom connector</strong> von claude.ai verbindet sich per Anmeldung (OAuth), und das ist auf dieser Website ausgeschaltet. Ein Super User kann es in den Optionen von MCP for J einschalten, dann bekommt claude.ai eine dauerhafte Verbindung. Bis dahin funktioniert die einfache Einrichtung oben (einen Prompt einfügen) nur für den aktuellen Chat."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor speichert seine MCP-Verbindungen in einer Konfigurationsdatei namens <code>mcp.json</code>. Öffnen Sie sie in einem Texteditor, fügen Sie den Block unten in das <code>mcpServers</code>-Objekt ein und speichern Sie. Cursor übernimmt die Änderung meist ohne Neustart."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Ort der Konfigurationsdatei: <code>~/.cursor/mcp.json</code> (für alle Ihre Projekte) oder <code>.cursor/mcp.json</code> in einem bestimmten Projektordner (nur für dieses Projekt)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Benutzerdefinierte MCP-Server in ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="Der Dialog <strong>Add custom MCP server</strong> von ChatGPT kann sich nur per Anmeldung (OAuth) oder ohne Authentifizierung verbinden; er hat kein Feld für einen API-Schlüssel oder Header. Die OAuth-Anmeldung ist auf dieser Website ausgeschaltet, daher kann sich ChatGPT noch nicht verbinden. Ein Super User kann sie in den Optionen von MCP for J einschalten. Bis dahin verwenden Sie Codex (den Coding-Agenten von OpenAI), der den API-Schlüssel aus einer Umgebungsvariable sendet."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Für einen benutzerdefinierten MCP-Server braucht man einen kostenpflichtigen ChatGPT-Tarif. Mit Plus funktioniert es (geprüft im Oktober 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI und Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Sowohl Gemini CLI (der KI-Assistent von Google für das Terminal) als auch die Erweiterung Gemini Code Assist (für VS Code / JetBrains) lesen dieselbe MCP-Konfigurationsdatei. Zwei Schritte: Bearbeiten Sie diese Datei, um diese Joomla-Website als MCP-Server hinzuzufügen, und starten Sie Gemini dann neu."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Sie können den Server global hinzufügen (dann sieht ihn jede Gemini-Sitzung) oder nur in einem Projektordner. Der Ausschnitt ist identisch &mdash; nur der Ort der Datei ist anders."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Öffnen (oder erstellen) Sie Ihre Gemini-Einstellungsdatei."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Wählen Sie einen dieser beiden Orte:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Global (jedes Projekt):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Nur für ein Projekt:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (in einem Projektordner)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Fügen Sie diesen Block in die Datei ein."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Wenn die Datei schon einen Abschnitt <code>mcpServers</code> hat, fügen Sie den Eintrag <code>&quot;joomla-...&quot;</code> in den vorhandenen ein &mdash; den äußeren Schlüssel <code>mcpServers</code> nicht doppeln. Ist die Datei leer oder ganz neu, fügen Sie den ganzen Ausschnitt unverändert ein."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini verwendet <code>httpUrl</code> für HTTP-basierte MCP-Server (wie diesen) &mdash; das ist anders als der Schlüssel <code>url</code> bei Cursor. Kopieren Sie genau diesen Ausschnitt, statt den von Cursor wiederzuverwenden."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Starten Sie Gemini neu."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Beenden Sie <code>gemini</code> im Terminal und starten Sie es neu, oder laden Sie das Fenster von VS Code / JetBrains neu. Geben Sie in Gemini CLI <code>/mcp</code> ein, um die verbundenen Server zu sehen und zu prüfen, ob Ihre Joomla-Website aufgeführt ist."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="Die Web-App <code>gemini.google.com</code> unterstützt seit Aug. 2026 keine benutzerdefinierten MCP-Server &mdash; diese Anleitung behandelt nur Gemini CLI und Gemini Code Assist. Falls Google später Unterstützung in der Weboberfläche ergänzt, beschreiben wir sie hier."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Andere MCP-fähige KI-Clients (Cline, Continue, GitHub Copilot im Agentenmodus, Windsurf, mcp-cli usw.) funktionieren ebenfalls &mdash; Verbindungs-URL und API-Schlüssel sind gleich, nur die genaue Stelle zum Einfügen ist verschieden. Wir ergänzen nach und nach Anleitungen für weitere Clients; wenn Sie nicht weiterkommen, hilft die FAQ unten allgemein weiter."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Kopieren"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Kopiert"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Kopiert (mit Ihrem Schlüssel)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Sicherheit &amp; Weitergabe"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="Ihr API-Schlüssel IST die Anmeldung &mdash; wer ihn hat, kann alles, was Ihr Joomla-Benutzerkonto kann. Es gibt keinen anonymen Zugriff. Wenn Sie die <strong>OAuth-Anmeldung</strong> einschalten, kann sich eine KI-App auch verbinden, indem sie Sie zur normalen Anmeldeseite dieser Website schickt; sie handelt dann als das angemeldete Konto, mit genau dessen Berechtigungen, bis Sie die Verbindung im Dashboard trennen."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Anderen Personen MCP-Zugang geben"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Es gibt zwei Wege &mdash; wählen Sie, was passt:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Ein Schlüssel pro Person (am sichersten)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Legen Sie für jede Person einen Joomla-Benutzer an, stecken Sie ihn in eine Gruppe mit genau den Berechtigungen, die er haben soll (z. B. nur lesen), erzeugen Sie für diesen Benutzer einen Schlüssel und schicken Sie ihn vertraulich. Jede Person hat ihre eigene Spur im Protokoll; Sie können jeden einzelnen Schlüssel widerrufen, ohne die anderen zu beeinträchtigen."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Ein gemeinsamer Schlüssel (am einfachsten, aber am wenigsten sicher)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Legen Sie einen eingeschränkten Benutzer an (z. B. <code>mcp-demo-guest</code>) in einer Nur-Lese-Gruppe, erzeugen Sie einen Schlüssel und geben Sie ihn breiter weiter. Einfacher zu verteilen; schwerer zu erkennen, wer ihn nutzt, oder einer einzelnen Person den Zugang zu entziehen. Gut für eine öffentliche Demo; nicht für sensiblen Zugriff."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Einen Schlüssel widerrufen"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="Damit ein vorhandener Schlüssel sofort nicht mehr funktioniert, gehen Sie zu Benutzer &rarr; dem betreffenden Benutzer &rarr; Reiter Joomla API Token &rarr; klicken Sie auf <strong>Zurücksetzen</strong>. Der alte Schlüssel ist ab dem Klick ungültig. Geben Sie der Person den neuen Schlüssel oder lassen Sie sie ohne Zugang."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Fehlerbehebung"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Suchen Sie die Art von App, die Sie verbinden, und öffnen Sie dann das Problem, das zu dem passt, was Sie sehen. Fehlermeldungen und Sperren durch eine Firewall können in jeder App auftreten, daher haben sie am Ende eine eigene Gruppe."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; oder &ldquo;Authentication failed&rdquo; (Fehler 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="Ihre KI erreicht die Website, aber der API-Schlüssel stimmt nicht. Prüfen Sie: (1) ob der Schlüssel seit dem Kopieren zurückgesetzt wurde (jedes Zurücksetzen macht den vorigen Schlüssel ungültig); (2) ob der Schlüssel vollständig kopiert wurde, ohne fehlende Zeichen oder zusätzliche Leerzeichen; (3) wenn Sie eine Konfigurationsdatei bearbeitet haben, ob das Wort <code>Bearer </code> (mit einem Leerzeichen danach) vor dem Schlüssel steht. Im Zweifel erzeugen Sie einen neuen Schlüssel und versuchen es erneut."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; oder &ldquo;Could not match accept header&rdquo; (Fehler 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Ältere Versionen von MCP for J (vor 2.3.4) hatten einen Fehler, der manche KI-Clients am Verbinden hinderte. Aktualisieren Sie MCP for J auf die neueste Version &mdash; siehe System &rarr; Updates &rarr; Erweiterungen in Ihrer Joomla-Administration."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;Verbunden, aber in der KI erscheinen keine Werkzeuge&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Meist eins von drei Dingen: (1) Die Gruppe des Benutzers hat keine <strong>Web-Services-Anmeldung</strong> &mdash; stellen Sie sie unter System &rarr; Konfiguration &rarr; Berechtigungen ein (standardmäßig haben sie nur Super User); (2) die Gruppe hat keine MCP-Berechtigung &mdash; Super User haben sie immer und Administratoren über die Standards von Joomla, aber Manager und andere Gruppen brauchen MCP-Endpunkt verwenden (und Über MCP-Endpunkt schreiben für Änderungen) unter Optionen &rarr; Berechtigungen dieser Komponente; (3) der KI-Client hat eine leere Werkzeugliste zwischengespeichert &mdash; trennen Sie den MCP-Server im Client und verbinden Sie ihn neu, damit er erneut prüft."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; oder die URL liefert einen Fehler (Fehler 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Entweder ist die URL falsch (prüfen Sie sie &mdash; sie sollte auf <code>/api/index.php/v1/mcp</code> enden) ODER das Web-Services-Plugin für MCP ist auf Ihrer Joomla-Website deaktiviert. In der Joomla-Administration: System &rarr; Verwalten &rarr; Erweiterungen &rarr; nach <code>csmcpforj</code> suchen &rarr; prüfen, ob das Web-Services-Plugin aktiviert ist. Ist es schon aktiviert, blockiert möglicherweise die <code>.htaccess</code> Ihrer Website den Pfad <code>/api/</code> &mdash; ein Problem beim Hoster oder bei einem Sicherheits-Plugin."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; oder &ldquo;Malware detected&rdquo; (Fehler 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Ein Sicherheits-Plugin auf Ihrer Joomla-Website (RSFirewall, Admin Tools Pro, Securitycheck Pro) blockiert die MCP-Anfrage. Fügen Sie in RSFirewall zwei Ausnahmen hinzu: <code>csmcpforj_oauth</code> und <code>api\/index\.php\/v1\/mcp</code> als regulären Ausdruck (die erste ist für die Anmeldung). In den anderen erlauben Sie <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> und URLs, die <code>csmcpforj_oauth</code> enthalten. Um die Ursache zu bestätigen, schalten Sie das Sicherheits-Plugin kurz aus, versuchen es erneut und schalten es dann mit den Ausnahmen wieder ein. Die Schaltfläche <strong>Verbindung prüfen</strong> im Dashboard zeigt, welche Adresse blockiert wird."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Die Schaltfläche &ldquo;Edit Config&rdquo; von Claude Desktop tut beim Klicken nichts"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Diese Schaltfläche versucht, <code>claude_desktop_config.json</code> an das Programm zu übergeben, mit dem Ihr Computer <code>.json</code>-Dateien öffnet. Ist das nicht eingerichtet, tut die Schaltfläche stillschweigend nichts. Abhilfe: Öffnen Sie die Datei selbst mit einem beliebigen Texteditor. Die Pfade je Betriebssystem stehen im Claude-Abschnitt unter Erweitert oben. Falls die Datei noch nicht existiert, legen Sie sie an und verwenden den Ausschnitt aus diesem Abschnitt als gesamten Inhalt (eingefasst als <code>{&quot;mcpServers&quot;: { ... }}</code>). Keine Berechtigungsänderungen nötig &mdash; die Datei liegt in Ihrem eigenen Benutzerordner."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="Claudes Dialog &ldquo;Add custom connector&rdquo; oder ChatGPTs Dialog &ldquo;Add custom MCP server&rdquo; hat kein Feld für den API-Schlüssel"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Diese Dialoge sind dafür gebaut, sich per Anmeldung (OAuth) zu verbinden; es gibt keinen Ort, um einen API-Schlüssel von MCP for J einzufügen. Auf dieser Website ist die OAuth-Anmeldung ausgeschaltet. Ein Super User kann sie unter Komponenten &rarr; MCP for J &rarr; Optionen &rarr; <strong>OAuth-Anmeldung</strong> einschalten, dann funktionieren beide Dialoge. Bis dahin: Claude Desktop kann die Wrapper-Skript-Methode oben verwenden, claude.ai die einfache Einrichtung und ChatGPT-Nutzer Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop zeigt beim Start &ldquo;Some MCP servers could not be loaded&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (Aug. 2026) prüft die Konfigurationsdatei strenger und lehnt jetzt Einträge ab, deren Befehlsargumente aussehen, als könnten sie Zugangsdaten enthalten. Das blockiert die beiden naheliegenden Wege, einen MCP-Server mit Bearer-Token direkt in <code>claude_desktop_config.json</code> einzurichten: die native Form <code>type: http</code> UND <code>mcp-remote</code> mit einem Argument <code>--header &quot;Authorization: Bearer ...&quot;</code>. Beide sehen in der Konfigurationsdatei richtig aus, aber die Schema-Prüfung von Claude Desktop verwirft sie beim Laden. <strong>Lösung:</strong> Verwenden Sie die Wrapper-Skript-Methode aus dem Claude-Abschnitt unter Erweitert oben &mdash; legen Sie den ganzen Befehl in eine kleine <code>.cmd</code>-Datei und lassen Sie die Konfiguration von Claude Desktop nur auf diese Datei verweisen. Claude Desktop sieht einen einfachen Befehl ohne sichtbare Argumente und akzeptiert ihn. Ihr API-Schlüssel bleibt genauso sicher wie vorher &mdash; die Wrapper-Datei liegt in Ihrem eigenen Benutzerordner."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Ich habe Claude Desktop neu gestartet, aber es sieht die neue Verbindung immer noch nicht"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="Unter Windows wird das Fenster von Claude Desktop beim Schließen nur in den Infobereich der Taskleiste verschoben &mdash; die ganze App läuft mit der ALTEN Konfiguration im Speicher weiter. Ein späterer Klick auf das Symbol in der Taskleiste holt nur das Fenster aus diesem laufenden Prozess zurück. Claude Desktop liest seine Konfigurationsdatei nur bei einem echten Neustart der App neu ein. So starten Sie wirklich neu: Rechtsklick auf das Claude-Symbol im Infobereich (unten rechts, eventuell auf den kleinen Pfeil nach oben klicken, um ausgeblendete Symbole zu sehen) &rarr; <strong>Quit</strong> wählen &rarr; etwa 3 Sekunden warten, bis der Prozess ganz beendet ist &rarr; Claude Desktop über das Startmenü neu starten. Erst dann greifen Ihre Änderungen an der Konfigurationsdatei."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Häufige Fragen"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Kann jemand diese Verbindung ohne API-Schlüssel nutzen?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="Nein. Jede Anfrage muss einen gültigen API-Schlüssel enthalten, oder ein OAuth-Zugriffstoken, wenn die OAuth-Anmeldung eingeschaltet ist. Anfragen ohne werden abgelehnt. Das ist so gewollt &mdash; die KI kann echte Aktionen auf Ihrer Website ausführen (Beiträge erstellen, Benutzer bearbeiten usw.), anonymer Zugriff wäre also ein Sicherheitsdesaster."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Kann ein Joomla-Benutzer mehrere aktive API-Schlüssel haben?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="Nein. Joomla speichert genau einen API-Schlüssel pro Benutzer. Ein Klick auf Zurücksetzen erzeugt einen neuen und macht den alten ungültig. Wenn Sie mehrere Schlüssel brauchen (einen pro Gerät, einen pro KI-Werkzeug usw.), legen Sie getrennte Joomla-Benutzer an."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Gibt es eine Grenze, wie viel ich es nutzen kann?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="MCP for J selbst hat keine Begrenzung. Es gelten die üblichen Grenzen des Hostings (PHP-Speicher, MariaDB-Verbindungen usw.). Wenn Sie viel Last erzeugen (große Stapelvorgänge über viele Websites), sprechen Sie mit Ihrem Hoster über eine höhere Parallelität von PHP-FPM."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Muss ich Firewall-Ports öffnen oder etwas Besonderes einrichten?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="Nein. MCP verwendet einfach normales HTTPS auf Port 443. Wenn Ihre Website schon öffentlich unter <code>https://yoursite.com/</code> erreichbar ist, ist der MCP-Endpunkt ohne weitere Einrichtung von jedem KI-Client im Internet erreichbar."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="Wie wechsle ich meinen API-Schlüssel regelmäßig?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Es gibt keinen automatischen Zeitplan &mdash; Sie wechseln ihn von Hand, wann Sie möchten. Gehen Sie zu Benutzer &rarr; dem Benutzer &rarr; Reiter Joomla API Token &rarr; klicken Sie auf Zurücksetzen. Aktualisieren Sie dann die Konfiguration des KI-Clients mit dem neuen Schlüssel. Gute Gewohnheit: Wechseln Sie jeden Schlüssel, der jemals in einem Screenshot, Protokoll oder Fehlerbericht aufgetaucht ist."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Ich nutze einen KI-Client, der oben nicht aufgeführt ist &mdash; funktioniert er?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Fast sicher ja, solange er Standard-MCP über HTTPS unterstützt und Sie entweder einen eigenen Authorization-Header hinzufügen lässt oder sich per OAuth anmelden kann (OAuth-Anmeldung in den Optionen einschalten). Die URL ist überall gleich &mdash; nur die Einrichtungsoberfläche des Clients ist anders. Clients, von denen wir wissen, dass sie funktionieren, für die wir aber noch keine Schritt-für-Schritt-Anleitung geschrieben haben: Continue.dev, Windsurf, der Editor Zed, mcp-cli, MCP Inspector, LibreChat, Open WebUI (über die Brücke <code>mcpo</code>) und verschiedene Agenten auf Basis von Ollama."

