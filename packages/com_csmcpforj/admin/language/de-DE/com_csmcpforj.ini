COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN_OFF="claude.ai und ChatGPT können sich nicht verbinden."
COM_CSMCPFORJ_DASHBOARD_OAUTH_REFUSED_TITLE="Eine KI-App hat versucht, sich per Anmeldung zu verbinden."
COM_CSMCPFORJ_DASHBOARD_OAUTH_REFUSED_BODY="Diese Website hat in den letzten 24 Stunden %d Anmeldeanfrage(n) abgelehnt, weil die OAuth-Anmeldung ausgeschaltet ist. claude.ai meldet das als &ldquo;cannot register&rdquo;. Schalten Sie sie ein und verbinden Sie sich dann erneut aus der App."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OFF_OK="Ausgeschaltet, daher können sich claude.ai und ChatGPT noch nicht verbinden. Die Anmeldeadresse selbst funktioniert, Einschalten ist also alles, was nötig ist."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OFF_FAIL="Ausgeschaltet. KI-Apps erreichen außerdem die Anmeldeadresse dieser Website nicht. Schalten Sie daher nach dem Einschalten unter System &rarr; Konfiguration <strong>URL-Rewrite nutzen</strong> ein und stellen Sie sicher, dass die .htaccess-Datei der Website vorhanden ist."
COM_CSMCPFORJ_DASHBOARD_CLAUDE_CHECKLIST_LINK="claude.ai verbinden? Gehen Sie die Checkliste durch &rarr;"
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_TITLE="403, 503 oder &ldquo;Malware detected&rdquo; von der Website"
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_BODY="Eine Firewall blockiert die Anfrage, bevor MCP for J sie sieht. Klicken Sie oben auf <strong>Verbindung prüfen</strong>, um zu sehen, welche Adresse blockiert wird. Fügen Sie in RSFirewall Ausnahmen für <code>csmcpforj_oauth</code> und <code>api\/index\.php\/v1\/mcp</code> (regulärer Ausdruck) hinzu. Firewalls des Hosters (o2switch TigerProtect, Imunify360) müssen dieselben Adressen erlauben. <strong>Cloudflare</strong>: Browser Integrity Check und Security Level können die Server der Apps blockieren. Legen Sie eine benutzerdefinierte WAF-Regel an (Security &rarr; WAF &rarr; Custom rules) mit der Aktion <strong>Skip</strong> für Anfragen, deren URI-Pfad <code>/api/index.php/v1/mcp</code> oder <code>/.well-known/oauth-</code> enthält oder deren Query-String <code>csmcpforj_oauth</code> enthält, und setzen Sie die Häkchen bei <em>Browser Integrity Check</em> und <em>Security Level</em>. Bot Fight Mode lässt sich nicht per Regel überspringen; schalten Sie es also aus, wenn es blockiert."
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_CLAUDE_TITLE="claude.ai meldet &ldquo;cannot register&rdquo;, oder die Autorisierung ist fehlgeschlagen"

