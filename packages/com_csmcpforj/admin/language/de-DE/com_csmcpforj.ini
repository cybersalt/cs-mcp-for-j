; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Wer kann diesen Endpunkt verwenden?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="Berechtigungen werden für das Joomla-Benutzerkonto geprüft, dem das API-Token gehört. Der MCP-Client (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl oder etwas anderes) leitet nur weiter &mdash; dasselbe Token verhält sich in jedem Client genau gleich."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Wichtig:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Wer das Token erzeugt, erhält über den MCP-Endpunkt denselben Zugriff, den er überall sonst in der Joomla-Administration hat. Erzeugen Sie Tokens nur für Benutzer, denen Sie diese Aktionen auch direkt anvertrauen würden."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Joomla-Benutzergruppe"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Funktioniert sofort?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Warum"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Ja"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Braucht ausdrückliche Freigabe"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Super User bestehen in Joomla immer jede Berechtigungsprüfung."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Hat core.manage über die Standardberechtigungen von Joomla, was die MCP-Prüfung für Lese- und Schreibwerkzeuge akzeptiert (die Werkzeuge, die Berechtigungen, Erweiterungen, Plugin-Einstellungen oder Joomla selbst ändern, brauchen weiterhin einen Super User) &mdash; aber die Gruppe braucht trotzdem <strong>Web-Services-Anmeldung</strong>, bevor Joomla überhaupt eine Authentifizierung zulässt."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="Hat standardmäßig keine MCP-Berechtigung. Geben Sie der Gruppe <strong>Web-Services-Anmeldung</strong> unter System &rarr; Konfiguration &rarr; Berechtigungen, danach MCP-Endpunkt verwenden und (optional) Über MCP-Endpunkt schreiben unter <strong>Optionen &rarr; Berechtigungen</strong> dieser Komponente."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Braucht Web-Services-Anmeldung"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Bevor irgendetwas davon gilt:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla sperrt die gesamte API hinter einer eigenen Berechtigung namens <strong>Web-Services-Anmeldung</strong> (<code>core.login.api</code>), und <strong>standardmäßig haben sie nur Super User</strong>. Jede andere Gruppe &mdash; auch Administrator und Manager &mdash; erhält von jedem Werkzeug <code>403 Forbidden</code>, bis Sie sie freigeben, egal was sie sonst in der Administration dürfen. Stellen Sie sie unter <strong>System &rarr; Konfiguration &rarr; Berechtigungen</strong> ein, bei der Gruppe, nicht bei dieser Komponente."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / eigene Gruppe"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Geben Sie der Gruppe <strong>Web-Services-Anmeldung</strong> unter System &rarr; Konfiguration &rarr; Berechtigungen, danach MCP-Endpunkt verwenden und (optional) Über MCP-Endpunkt schreiben unter <strong>Optionen &rarr; Berechtigungen</strong> dieser Komponente."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Einen KI-Assistenten mit dieser Website verbinden"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Es gibt zwei Wege. Der erste (einen Prompt kopieren und einfügen) ist der einfachste &mdash; er funktioniert ohne Client-Konfiguration, und nachdem Ihre KI bestätigt hat, dass es klappt, bietet sie meist an, diese Website als dauerhaften Konnektor einzurichten, ganz ohne JSON von Hand zu bearbeiten. Der zweite ist für alle, die ihre Client-Konfiguration lieber direkt bearbeiten."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Einrichtungs-Prompt kopieren (empfohlen)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Fügen Sie einen Einrichtungs-Prompt in Ihren KI-Assistenten ein"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Keine Client-Konfiguration nötig. Kopieren Sie den Prompt unten in eine neue Unterhaltung mit Ihrem KI-Assistenten (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini usw.). Die KI führt einen Test mit curl aus, bestätigt die Verbindung und bietet &mdash; bei Clients, die das unterstützen &mdash; an, die Verbindung dauerhaft einzurichten, ohne JSON-Dateien zu bearbeiten und ohne sich Terminalbefehle merken zu müssen."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Bonus:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Wenn Ihr KI-Client ein Shell-Werkzeug hat (Codex, Claude Code, Cursor Composer, Cline, Continue, der Agentenmodus von GitHub Copilot usw.), enthält der Prompt ein Angebot zur Selbstinstallation. Sagen Sie einfach &lsquo;dauerhaft einrichten&rsquo;, nachdem die KI die Verbindung bestätigt hat, und sie führt den passenden Befehl für den Client aus, um den MCP-Server zu registrieren (zum Beispiel <code>codex mcp add</code> oder <code>claude mcp add</code>). Nach einem Neustart des Clients erscheint diese Website in jeder Unterhaltung als native MCP-Werkzeuge &mdash; nie wieder ein Prompt nötig."
; Shared "type here" field pattern - see FieldStyleHelper.
COM_CSMCPFORJ_FIELD_OPTIONAL="Optional"
COM_CSMCPFORJ_FIELD_REQUIRED="Erforderlich"

COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Erzeugen Sie ein Joomla API Token in Mein Profil (Link rechts)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Klicken Sie unten auf &lsquo;Prompt kopieren&rsquo;."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Fügen Sie ihn in eine neue Unterhaltung mit Ihrem KI-Assistenten ein. Wenn Sie Schritt 2 übersprungen haben, ersetzen Sie zuerst <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> durch Ihr tatsächliches Token."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Absenden. Die KI testet die Verbindung und bietet bei Clients, die das unterstützen, an, sie dauerhaft einzurichten."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Dieser Prompt funktioniert in jedem KI-Client mit Shell- oder Terminalwerkzeug: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (Agentenmodus), Gemini CLI, Windsurf, mcp-cli usw. In reinen Web-Chats ohne Shell-Zugriff (claude.ai, chatgpt.com, gemini.google.com) funktioniert er nicht &mdash; verwenden Sie dafür den Reiter MCP-Konnektor."

; Tab 2 — manual MCP connector configuration
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="MCP-Konnektor (manuelle Konfiguration)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="Manuell als MCP-Konnektor hinzufügen"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="Für Claude Desktop (Konfigurationsdatei), Claude Code, Cursor, Codex, Cline, Copilot, Gemini CLI oder jeden Client, bei dem Sie die Konfiguration lieber direkt bearbeiten. Einmal einrichten, dauerhaft in allen Unterhaltungen. (Benutzerdefinierte Konnektoren von claude.ai und ChatGPT können keinen API-Schlüssel senden: Sie verbinden sich per Anmeldung. Siehe <strong>Per Anmeldung verbinden (OAuth)</strong> auf dieser Seite.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="Erzeugen Sie ein Joomla API Token in Mein Profil."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="Kopieren Sie den Konfigurationsausschnitt unten."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP3="Ersetzen Sie <code>YOUR_JOOMLA_API_TOKEN</code> durch das erzeugte Token."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Fügen Sie ihn in die MCP-Konfiguration Ihres KI-Clients ein &mdash; Claude Desktop: <code>claude_desktop_config.json</code>; Claude Code: <code>claude mcp add</code>; Cursor: <code>~/.cursor/mcp.json</code>; GitHub Copilot: MCP-Einstellungen in VS Code / JetBrains; Cline / Continue: JSON-Einstellungen der Erweiterung. Starten Sie den Client nach dem Speichern neu. (Die Dialoge &ldquo;Add custom connector&rdquo; von claude.ai und ChatGPT haben dafür kein Feld; verwenden Sie dort die OAuth-Anmeldung.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_XHEADER_NOTE="Wenn Ihr Client keinen Authorization-Header unterstützt, ersetzen Sie den headers-Block durch:"

