COM_CSMCPFORJ_SUPPORT_BANNER_PRO_HEADING="Sie haben eine aktive Pro-Mitgliedschaft für MCP for J &mdash; vielen Dank!"
COM_CSMCPFORJ_SUPPORT_BANNER_PRO_BODY="Pro-Mitglieder erhalten bevorzugten Support. Ihre Nachrichten landen mit einer Pro-Kennzeichnung in unserem Posteingang, sodass wir sie zuerst sehen und so schnell wie möglich antworten. Fragen Sie uns alles &mdash; Fehlerberichte, Funktionswünsche, Fragen, Ideen &mdash; alles ist willkommen."

COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_HEADING="Wir freuen uns, von Ihnen zu hören"
COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_BODY="Schicken Sie uns Ihre Fehlerberichte, Funktionswünsche, Fragen und Ideen &mdash; wir lesen jede Nachricht und schätzen das Feedback. Support für die kostenlose Version erfolgt nach bestem Bemühen (unsere Mittel für kostenlosen Support sind begrenzt), daher kann eine Antwort etwas dauern. Wenn Sie garantierte Antwortzeiten oder bevorzugte Behandlung brauchen, ziehen Sie %seine Pro-Mitgliedschaft für MCP for J%s in Betracht."

COM_CSMCPFORJ_SUPPORT_FORM_HEADING="Schreiben Sie uns"
