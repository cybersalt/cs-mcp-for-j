; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="ファイアウォールと URL 系エクステンション"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall が有効です。"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="MCP のリクエスト（&ldquo;403 Access Forbidden &mdash; Malware detected&rdquo;）や claude.ai のサインインをブロックすることがあります。RSFirewall で例外を2つ追加してください: <code>csmcpforj_oauth</code> と、正規表現として <code>api\/index\.php\/v1\/mcp</code>。"
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools が有効です。"
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="その Web Application Firewall が MCP のリクエストやサインインをブロックすることがあります。<strong>接続を確認</strong> でブロックが表示されたら、Admin Tools の Blocked Requests Log で該当ルールを探し、WAF の例外を追加するか、そのルールをオフにしてください。<code>/api/index.php/v1/mcp</code>、<code>/.well-known/oauth-protected-resource</code>、<code>/.well-known/oauth-authorization-server</code>、および <code>csmcpforj_oauth</code> を含む URL を許可してください。"
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck が有効です。"
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="そのファイアウォールが MCP のリクエストやサインインをブロックすることがあります。<strong>接続を確認</strong> でブロックが表示されたら、そのログで該当リクエストを探し、<code>/api/index.php/v1/mcp</code>、<code>/.well-known/oauth-protected-resource</code>、<code>/.well-known/oauth-authorization-server</code>、および <code>csmcpforj_oauth</code> を含む URL の例外を追加してください。"
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 が有効です。"
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="この SEO エクステンションはサインイン用アドレス（<code>index.php?csmcpforj_oauth=&hellip;</code>）を横取りしてトップページを返すことがあり、その場合 claude.ai や ChatGPT は登録できず、分かりやすい理由も示しません。<strong>接続を確認</strong> でサインイン用エンドポイントにトップページが表示されたら、Route 66 で <code>csmcpforj_oauth</code> を含む URL を除外するか、そのシステムプラグインをオフにしてください。"
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="ホスティング会社が運用するファイアウォールもブロックすることがあります: o2switch TigerProtect は 503 を返し、Imunify360、ModSecurity、Cloudflare のルールは 403 を返します。上のアドレスを許可するか、claude.ai のために Anthropic のサーバー（<code>160.79.104.0/21</code>）を通すよう、ホスティング会社に依頼してください。<strong>Cloudflare</strong>: Browser Integrity Check と Security Level がアプリのサーバーをブロックすることがあります。URI パスに <code>/api/index.php/v1/mcp</code> または <code>/.well-known/oauth-</code> を含むか、クエリ文字列に <code>csmcpforj_oauth</code> を含むリクエストに対して、アクション <strong>Skip</strong> の WAF カスタムルール（Security &rarr; WAF &rarr; Custom rules）を追加し、<em>Browser Integrity Check</em> と <em>Security Level</em> にチェックを入れてください。Bot Fight Mode はルールでスキップできないので、ブロックする場合はオフにしてください。"

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="claude.ai のチェックリスト: &ldquo;cannot register&rdquo;、&ldquo;Authorization failed&rdquo;、&ldquo;Couldn't reach the MCP server&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="順番に確認してください。どの項目も、誰かが何時間も悩んだものです。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="このアドレスをそのまま使ってください: <code>%s</code>。<em>www</em> の有無はサイトの応答と一致させ、途中に <strong>リダイレクトがない</strong> ようにしてください（www から www なしへ、または http から https へ）。ダッシュボードの <strong>接続を確認</strong> ボタンがリダイレクトを知らせます。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="このサイトでは OAuth サインインが有効です。claude.ai はサインインでしか接続できないので、有効のままにしておく必要があります。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>このサイトでは OAuth サインインが無効です。</strong> claude.ai はサインインでしか接続できないので、まず Super User が有効にする必要があります: コンポーネント &rarr; MCP for J &rarr; オプション &rarr; <strong>OAuth サインイン</strong>。無効の間、claude.ai は &ldquo;cannot register&rdquo; と表示します。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="<strong>Add custom connector</strong> ダイアログで <strong>Sign in now</strong> を選びます。OAuth クライアントは <strong>Use Claude's published identity</strong> と <strong>Register automatically</strong> のどちらでも使えます（公開 ID にはサーバーの PHP curl 拡張が必要です）。クライアント ID とシークレットは空のままにします。一方の方法で失敗したら、コネクタを削除してもう一方の方法で追加し直してください。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>リクエストヘッダーは追加しないでください。</strong> claude.ai は <code>X-Joomla-Token</code> ヘッダーを受け付けないので、そこで API キーは使えません。claude.ai から入る方法はサインインだけです。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="ファイアウォールは claude.ai のサーバーを通す必要があります。サーバーはブラウザーからではなく <code>160.79.104.0/21</code> から接続します。RSFirewall には例外が2つ必要です: <code>csmcpforj_oauth</code> と、正規表現として <code>api\/index\.php\/v1\/mcp</code>。Admin Tools、Securitycheck、o2switch TigerProtect（503 を返します）のようなホスティングのファイアウォールもブロックすることがあります。<strong>Cloudflare</strong>: Browser Integrity Check と Security Level がアプリのサーバーをブロックすることがあります。URI パスに <code>/api/index.php/v1/mcp</code> または <code>/.well-known/oauth-</code> を含むか、クエリ文字列に <code>csmcpforj_oauth</code> を含むリクエストに対して、アクション <strong>Skip</strong> の WAF カスタムルール（Security &rarr; WAF &rarr; Custom rules）を追加し、<em>Browser Integrity Check</em> と <em>Security Level</em> にチェックを入れてください。Bot Fight Mode はルールでスキップできないので、ブロックする場合はオフにしてください。ダッシュボードの <strong>接続を確認</strong> ボタンで、何が応答しているか分かります。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> など URL を書き換える SEO エクステンションは、サインイン用アドレス（<code>index.php?csmcpforj_oauth=&hellip;</code>）を横取りしてトップページを返すことがあり、その場合アプリは登録できず、分かりやすい理由も示しません。<strong>接続を確認</strong> でサインイン用エンドポイントにトップページが表示されたら、そのエクステンションで <code>csmcpforj_oauth</code> を含む URL を除外するか、そのシステムプラグインをオフにしてください。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="MCP を使えるアカウントでログインしてください（ダッシュボードの <em>このエンドポイントを使えるのは誰ですか？</em> を参照）。特定の1人だけ失敗する場合は、そのアカウントがブロックされていないか、<em>パスワードリセットの要求</em> が設定されていないか確認してください。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="それでも解決しませんか？ コンポーネント &rarr; MCP for J &rarr; <strong>ログ</strong> に、サインインの各ステップと、ステップが拒否された理由が表示されます。"
