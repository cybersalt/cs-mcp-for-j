COM_CSMCPFORJ_CATALOG_INTRO_BODY="アドオンは、AI アシスタントが扱える範囲を特定の Joomla エクステンション（RSTicketsPro、4SEO、Akeeba Backup など）へ広げます。必要なものだけをインストールしてください &mdash; 本体のエクステンションは軽いままです。"
