COM_CSMCPFORJ_DASHBOARD_QUICKSTART_HEADING="クイックスタート"
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP1_TITLE="1. API トークンを生成する"
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP1_BODY="MCP クライアントに代わりに操作させたいユーザーとしてサインインします。マイプロフィールを開き、「Joomla API トークン」タブに切り替え、目のアイコンをクリックして表示します。"
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP2_TITLE="2. 権限を確認する"
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP2_BODY="Super User はすぐに使えます。それ以外のグループは Administrator と Manager も含め、まず システム &rarr; グローバル設定 &rarr; 権限 で <strong>Webサービスログイン</strong> が必要です。Manager などのグループは、このコンポーネントの オプション &rarr; 権限 で「使用」/「書き込み」も必要です。"
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP3_TITLE="3. クライアントに貼り付ける"
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP3_BODY="設定スニペットをコピーして MCP クライアントに貼り付け、クライアントを再起動します。tools/list を試して接続を確認してください。"

