; Component config — catalog fieldset
COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_LABEL="カタログ"
COM_CSMCPFORJ_CONFIG_CATALOG_FIELDSET_DESC="MCP アドオンのカタログ閲覧に関する設定です。"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_LABEL="カタログのエンドポイント URL"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_DESC="MCP アドオンのカタログを取得する場所です。カタログのプライベートミラーを運用していない限り、既定値のままにしてください。ベース URL だけを指定すると /catalog.json が付け加えられます。"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="カタログのキャッシュ期間（時間）"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="取得した catalog.json を再取得までキャッシュしておく時間です。カタログページの更新ボタンはこれを無視します。範囲は 1&ndash;168（1週間）。"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="利用できない Pro アドオンも表示"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="現在 Pro メンバーシップがなくても、カタログに Pro アドオンを表示します。何があるか見るのに便利です。すべて隠すには「いいえ」を選んでください。"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="メンバーシップを再確認する間隔（秒）"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="リンクされたメールアドレスにまだ Pro アクセスがあるか、ダッシュボードが cybersalt.com に問い合わせ直す間隔です。86400 = 1日1回（推奨）。最小 60、最大 604800 = 週1回。"

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="MCP サーバー"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="MCP エンドポイントのサーバー側の設定です。MCP クライアントに何が見え、何を呼び出せるかを決めます。"
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="読み取り専用モード"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="「はい」にすると、MCP エンドポイントは MCP の ToolAnnotations で読み取り専用と宣言されたツール（list_*、get_*、read_*、check_*、validate_*、fetch_*、および joomla_update_healthcheck）だけを公開・受け付けます。AI クライアントにコンテンツを変更させずにサイトを調べさせたいときに便利です。書き込みは、サーバーが読み取り専用モードであることを説明するエラーを返します。この設定は下限です: MCP クライアントはエンドポイント URL に ?read_only=1 を付けてさらに制限できますが、ここが「はい」のサイトで書き込みを解除することはできません。"

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="画面録画時のプライバシー"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="ダッシュボード上の秘密情報（プロンプトのプレビュー内の Joomla API トークン、Pro メンバーシップのメールアドレス）をぼかして守るための設定です。ぼかしは既定で有効です。これらのオプションでマウスを重ねたときの表示を調整し、画面共有や録画中にうっかりマウスが触れても秘密が見えてしまわないようにします。"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="マウスを重ねてから表示するまでの時間（秒）"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="ぼかした秘密情報にマウスポインターを何秒重ね続けると表示されるかです。重ねている間は秘密の横に小さなカウントダウンが出るので、タイマーが動いていることが分かります。マウスを離すと表示は取り消されてタイマーもリセットされ &mdash; 次に重ねたときは最初から数え直します。0 にすると重ねた瞬間に表示されます（うっかり触れたときの保護はなくなりますが、従来どおりの動作に戻ります）。既定値: 3 秒。"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="表示後に自動で隠すまでの時間（秒）"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="マウスを重ねて表示した秘密情報が、マウスがまだ上にあっても自動的に再びぼかされるまでの秒数です &mdash; &ldquo;ちらっと見て読んだら、ほかのことに気を取られた&rdquo; ような場面で、放置されたブラウザーが秘密を表示し続けないための念のための対策です。マウスを離せば、この設定に関係なく必ずすぐにぼかされます。0 にすると自動で隠す機能をオフにします（表示した秘密は、マウスを離すまで見えたままになります）。既定値: 8 秒 &mdash; base64 のトークン全体を落ち着いて読める長さで、放置されたセッションで秘密がさらされない短さです。"

