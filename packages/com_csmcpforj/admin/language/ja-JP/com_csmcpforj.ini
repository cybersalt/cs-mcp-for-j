COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="OAuth サインイン"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="API キーを AI アプリにコピーする代わりに、このサイトのログインページへ案内することで AI アプリが接続できるようにします。ChatGPT（&ldquo;Add custom MCP server&rdquo;）と claude.ai / Claude Desktop（&ldquo;Add custom connector&rdquo;）は、この方法でしか接続できません。API キーを使う接続はどちらの場合も動作し続けます。"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="OAuth サインインを有効にする"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="有効にすると、このサイトの MCP アドレスを AI アプリに貼り付けるだけで、アプリがこのサイトのログインページを開き、いつものユーザー名とパスワードでログインして「許可」をクリックすれば完了です。以後、アプリはあなたとして、このサイトでのあなたの権限そのままで動作します。接続中のアプリはダッシュボードに一覧表示され、それぞれ接続を解除できます。これをオフにすると、すべての接続がすぐに解除されます。"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="アクセストークンの有効期間（秒）"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="アプリが自動で更新するまでの、各アクセストークンの有効期間です。既定値 3600（1時間）。300〜86400 の範囲です。"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="サインインを保持する期間（日）"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="ユーザーが再度サインインしなくても、アプリが更新を続けられる期間です。更新のたびに期間はリセットされます。既定値 30。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="ログインで AI アプリを接続する"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="ChatGPT や claude.ai など一部の AI アプリは、そのサイトのログインページへ案内することでしかサイトに接続できません。このサイトではそれが無効になっているので、それらのアプリはまだ接続できません。許可するには、オプションで <strong>OAuth サインイン</strong> を有効にしてください。API キーを使う接続はどちらの場合も動作し続けます。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="オプションを開いて有効にする"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="API キーは不要です。コピーするのはこのサイトの <strong>エンドポイント URL</strong> だけです。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="AI アプリがこのサイトのログインページを見つけられるか確認しています&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>準備完了。</strong> AI アプリはこのサイトのログインページを見つけられます。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>準備ができていません。</strong> AI アプリがこのサイトのログインページを見つけられないため、接続できません。修正するには、システム &rarr; グローバル設定 で <strong>URLリライトの使用</strong> をオンにし、サイトの .htaccess ファイルが配置されていることを確認してください。詳しくはセットアップガイドのトラブルシューティングにあります。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_HEADING="接続中のアプリ"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_NONE="まだ接続中の AI アプリはありません。誰かがログインして「許可」をクリックすると、ここにアプリが表示されます。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_APP="アプリ"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_USER="ログインユーザー"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_CONNECTED="接続日時"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_LAST_USED="最終使用"
COM_CSMCPFORJ_DASHBOARD_OAUTH_REVOKE="接続を解除"
COM_CSMCPFORJ_OAUTH_REVOKED="アプリの接続を解除しました。次のリクエストでアクセスを失い、再接続するにはもう一度許可が必要です。"
COM_CSMCPFORJ_OAUTH_REVOKE_NOTHING="そのアプリには、解除できる有効なアクセスがありませんでした。"
COM_CSMCPFORJ_ACTIONLOG_OAUTH_CONSENT="ユーザー <a href=&quot;{accountlink}&quot;>{username}</a> がアプリ &ldquo;{title}&rdquo; を MCP for J に接続しました（OAuth）"
COM_CSMCPFORJ_ACTIONLOG_OAUTH_REVOKE="ユーザー <a href=&quot;{accountlink}&quot;>{username}</a> がアプリ &ldquo;{title}&rdquo; の MCP for J への接続を解除しました（OAuth）"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="サインインで接続（いちばん簡単）"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="コピーする API キーはありません。AI アプリでコネクタを追加し、このサイトの <strong>エンドポイント URL</strong>（下）を貼り付けます。Connect をクリックすると、アプリが自分でこのサイトのログインページを開くので、このサイトのユーザー名とパスワードでログインし、<strong>許可</strong> をクリックしてください。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai と Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>。名前を付け、エンドポイント URL を貼り付けて Continue をクリックします。<em>Sign in now</em> のままにし、OAuth クライアントは <em>Use Claude's published identity</em> と <em>Register automatically</em> のどちらでも使えます。リクエストヘッダーは追加しないでください。Add をクリックしてから <strong>Connect</strong> をクリックします。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> 左サイドバーの <strong>Plugins</strong> &rarr; <strong>Add</strong>（右上） &rarr; <strong>Add custom MCP server</strong>。名前を付け、エンドポイント URL を貼り付け、Authentication は <strong>OAuth</strong> のまま、チェックボックスにチェックを入れて <strong>Create as a plugin</strong>、続けて <strong>Connect</strong> をクリックします。ChatGPT の有料プランが必要です（Plus で動作します）。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code> を実行し、<code>/mcp</code> と入力してサーバーを選び、<strong>Authenticate</strong> を選びます。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> コマンドパレット &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; エンドポイント URL を貼り付けます。VS Code がログインを求めます。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> <code>mcp.json</code> の <code>mcpServers</code> に <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> を追加し（ヘッダーなし）、Settings &rarr; MCP でサーバーの横の <strong>Login</strong> をクリックします。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> <code>settings.json</code> でサーバーに <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> を追加し、<code>/mcp auth &lt;name&gt;</code> を実行します。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>。Codex が自分でログインページを開きます（開かない場合は <code>codex mcp login joomla</code> を実行）。Codex と同じコンピューターのブラウザーで、数分以内に「許可」をクリックしてください。その後ブラウザーに 127.0.0.1 が接続を拒否したと表示された場合は、<code>codex mcp login joomla --no-browser</code> を使ってそのページのアドレスをターミナルに貼り付けるか、下の API キーの方法を使い続けてください。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP で、エンドポイント URL を貼り付けてから <strong>Authenticate</strong> をクリックします。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="「許可」をクリックすると、アプリはログインしたアカウントとして動作し、そのアカウントがこのサイトでできることをそのまま行えます。アカウントに権限があれば変更も行えます。Administrator と Manager には、まず <em>Webサービスログイン</em> の権限が必要です（ダッシュボードの「権限」を参照）。接続中のアプリはすべてダッシュボードに一覧表示され、すぐに接続を解除できます。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="API キーのほうがよい、またはクライアントがブラウザーを開けない？ 下の <strong>上級者向けの設定</strong> にある API キーの方法は、どのクライアントでも引き続き使えます。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT（&ldquo;Add custom MCP server&rdquo;）と claude.ai / Claude Desktop（&ldquo;Add custom connector&rdquo;）は、このサイトのログインページへ案内することでしか接続できません。このサイトではそれが無効になっています。有効なら、接続はこうなります: このサイトのアドレスをアプリに貼り付け、ログインし、「許可」をクリックする。"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="オプションで有効にする"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Super User に、MCP for J のオプションで <strong>OAuth サインイン</strong> を有効にしてもらってください。それまでは下の API キーの方法を使ってください。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="いちばん簡単: Claude の &ldquo;Add custom connector&rdquo; ダイアログがこのサイトで使えます。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="このサイトではログインが有効なので、Claude Desktop または claude.ai で <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong> を開き、このサイトの MCP アドレスを貼り付けて Continue をクリックし、検出されたサインイン設定はそのままで Add、続けて Connect をクリックします。このサイトのユーザー名とパスワードでログインし、「許可」をクリックしてください。下の設定ファイルの方法は、API キーを使いたい場合にだけ必要です。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai は <strong>Add custom connector</strong> で常設の接続ができます: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong> で、このサイトの MCP アドレスを貼り付けて Continue をクリックし、検出されたサインイン設定はそのままで Add、続けて Connect をクリックします。このサイトのユーザー名とパスワードでログインし、「許可」をクリックしてください。接続はすべてのチャットで使えるようになります。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="ChatGPT で、左サイドバーの <strong>Plugins</strong> をクリックし、<strong>Add</strong>（右上） &rarr; <strong>Add custom MCP server</strong> を選びます。名前（例: &ldquo;自分の Joomla サイト&rdquo;）を付け、このサイトの MCP アドレスを貼り付け、Authentication は <strong>OAuth</strong> のまま、&ldquo;I understand and want to continue&rdquo; にチェックを入れて <strong>Create as a plugin</strong> をクリックします。<strong>Connect</strong> をクリックすると ChatGPT がこのサイトのログインページを開くので、このサイトのユーザー名とパスワードでログインし、「許可」をクリックします。その後、チャットで <strong>@</strong> と入力してプラグインを選んでください。貼り付ける API キーはありません。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="&ldquo;Add custom connector&rdquo; ダイアログは接続するが、サインインに失敗する"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="順に確認してください: (1) ログインしたアカウントが MCP を使える &mdash; Administrator には <em>Webサービスログイン</em>、Manager にはそれに加えて オプション &rarr; 権限 の <em>MCP エンドポイントを使用</em> が必要です（ダッシュボードの <em>このエンドポイントを使えるのは誰ですか？</em> カードを参照）。使えない場合はログインページがそう伝えます。(2) ダッシュボードの &ldquo;ログインで AI アプリを接続する&rdquo; カードが <strong>準備完了</strong> になっている。(3) ファイアウォールがアプリのサーバーからサイトへのアクセスを通している（次の項目を参照）。クライアント ID やシークレットは入力しないでください: アプリが自分で登録します。(4) ログインページが開いたら早めに「許可」をクリックする: アプリはしばらくするとサインインをあきらめ（Codex は約 5 分）、遅れて「許可」するとエラーになります。もう一度 Connect を始めれば動きます。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai や ChatGPT がサイトに届かない、またはサインインが途中で止まる"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai と ChatGPT はブラウザーからではなく自社のサーバーから接続するので、サイトは公開の HTTPS で到達できる必要があります。Web アプリケーションファイアウォール（RSFirewall、Admin Tools、Cloudflare、CSF、ModSecurity、Imunify360、または 503 を返す o2switch の TigerProtect のようなホスティングのファイアウォール）がそのリクエストをブロックすることがあります。<code>/api/index.php/v1/mcp</code>、<code>/.well-known/oauth-authorization-server</code>、<code>/.well-known/oauth-protected-resource</code>、<code>index.php?csmcpforj_oauth=&hellip;</code>（登録、トークン、取り消しのエンドポイント）へのリクエストを許可してください。RSFirewall では次の2つの例外で足ります: <code>csmcpforj_oauth</code> と、正規表現として <code>api\/index\.php\/v1\/mcp</code>。claude.ai は <code>160.79.104.0/21</code> から接続します。<strong>Cloudflare</strong>: Browser Integrity Check と Security Level がアプリのサーバーをブロックすることがあります。URI パスに <code>/api/index.php/v1/mcp</code> または <code>/.well-known/oauth-</code> を含むか、クエリ文字列に <code>csmcpforj_oauth</code> を含むリクエストに対して、アクション <strong>Skip</strong> の WAF カスタムルール（Security &rarr; WAF &rarr; Custom rules）を追加し、<em>Browser Integrity Check</em> と <em>Security Level</em> にチェックを入れてください。Bot Fight Mode はルールでスキップできないので、ブロックする場合はオフにしてください。<strong>Route 66</strong> など URL を書き換える SEO エクステンションは、サインイン用アドレス（<code>index.php?csmcpforj_oauth=&hellip;</code>）を横取りしてトップページを返すことがあり、その場合アプリは登録できず、分かりやすい理由も示しません。<strong>接続を確認</strong> でサインイン用エンドポイントにトップページが表示されたら、そのエクステンションで <code>csmcpforj_oauth</code> を含む URL を除外するか、そのシステムプラグインをオフにしてください。サインインページ自体は、あなたのブラウザーで開きます。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="ダッシュボードに、AI アプリがこのサイトのログインページを見つけられない（準備ができていません）と表示される"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="AI クライアントは、ドメインの <code>/.well-known/oauth-authorization-server</code> でサインイン情報を探します。Joomla がそこで応答するのは、グローバル設定 &rarr; <strong>URLリライトの使用</strong> がオンで、サイトの <code>.htaccess</code> が配置されている（<code>htaccess.txt</code> の名前を変更）場合か、nginx が不明なパスを <code>index.php</code> に渡す場合だけです。これは <code>/.well-known/acme-challenge/</code> を使う cPanel の AutoSSL には影響しません。サブフォルダー（例: <code>example.com/joomla</code>）にインストールしたサイトでは、<code>/.well-known/oauth-authorization-server/joomla</code> をそのサブフォルダーへ送るルールもドメインのルートに必要です。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="サーバーやブラウザーのないマシンからサインインする"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="デスクトップのクライアント（Claude Code、Codex、Cursor、Gemini CLI）は同じマシンでブラウザーを開き、ローカルのアドレスで応答を待つので、OAuth サインインにはそのマシンにブラウザーが必要です。画面のないサーバーや SSH 越しでは、代わりに上級者向けの設定にある API キーの方法を使ってください。どこでも使えます。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="AI アプリで新しいコネクタを追加し（claude.ai と Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector、ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server）、この <strong>エンドポイント URL</strong> を貼り付けます: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Connect をクリックします。</strong> アプリが自分でこのサイトのログインページを開きます。このサイトのユーザー名とパスワードでログインしてください。"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>「許可」をクリックします。</strong> 接続された状態でアプリに戻ります。アプリは、あなたのアカウントがこのサイトで許可されていることを何でも行えます。"
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="AI アプリをこのサイトに接続する"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="方法は3つあります。どれかをクリックすると番号付きの手順が開きます。たいていの方は1つ目を選びます。"
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. ログインする（いちばん簡単） &mdash; ChatGPT、claude.ai、Claude Desktop など、ほとんどの AI アプリ"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. セットアッププロンプトを貼り付ける &mdash; コマンドを実行できる AI チャット向け"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. 設定ファイルまたはコマンドライン &mdash; Claude Code、Cursor、Codex、VS Code、Gemini CLI など"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="コマンドを実行できる AI アプリ（Codex、Claude Code、Cursor、Cline、Copilot のエージェントモードなど）で使えます。AI が自分で接続をテストし、常設にしようかと提案することもあります。"
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="設定ファイルやコマンドで設定するアプリ向けです。一度設定すれば接続したままになります。"
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>API トークンを取得します。</strong> ボタンをクリックすると、ユーザープロフィールが新しいタブで開きます。そこで <strong>Joomla API トークン</strong> タブを開き、目のアイコンをクリックしてトークンを表示し、コピーします。その後、このタブに戻ってください。"
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="自分の API トークンを取得（新しいタブで開く）"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>プロンプトをコピーします。</strong> トークンはすでに入っています。"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="AI アプリとの <strong>新しい会話に貼り付けて</strong> 送信します。AI が接続をテストし、可能なら常設にしようかと提案します。"
COM_CSMCPFORJ_DASHBOARD_WAY3_STEP_COPY="<strong>設定をコピーします。</strong> トークンはすでに入っています。"
