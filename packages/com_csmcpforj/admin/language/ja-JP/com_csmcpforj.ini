; ============================================================
; Setup Guide view (v2.4.1 — restructured 2026-08-13 to lead with
; the Dashboard easy-way method and push technical / config-file
; setup into a collapsed Advanced section. Non-technical audience.)
; ============================================================

COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="セットアップガイド"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="セットアップガイド"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for J — セットアップガイド"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="この Joomla サイトに AI を接続する"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for J は、Codex、Claude、ChatGPT、Cursor などの AI アシスタントを Joomla サイトに簡単に接続できるように作られています &mdash; AI が記事を読み、ユーザーを管理し、コンテンツを公開するなど、すべてをいつもの AI のチャットで行えます。技術的な知識は要りません。下の簡単な方法でたいていの方は大丈夫です。必要なら、下にスクロールすると上級者向けのオプションがあります。"

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ 簡単な方法"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="設定ファイルも、ヘッダーも、専門用語も不要です。ダッシュボードから用意済みのセットアッププロンプトをコピーし、AI との新しいチャットに貼り付けるだけです。あとは AI がやってくれます &mdash; 接続をテストし、対応しているクライアントでは接続を常設として保存しようかと提案します。"
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>API キーを取得します</strong>（AI がこのサイトで操作するための個人用パスワードです）。まだお持ちでなければ、手順は下にあります。"
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>ダッシュボードを開き</strong>（下のボタン）、その欄に API キーを貼り付けます。"
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="ダッシュボードの <strong>&ldquo;プロンプトをコピー&rdquo; ボタンをクリックします</strong>。コピーの前に、キーが自動的にプロンプトへ入ります。"
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="AI（Claude、ChatGPT、Cursor、Copilot、Gemini など）との <strong>新しいチャットに貼り付けて</strong> 送信します。AI が接続の動作を確認し、保存しようかと提案します。"
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="ダッシュボードへ"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="以上です。AI が接続されました。仕組みをもっと知りたい場合や、AI を手動で設定したい場合は、この先も読んでください &mdash; ただし、読まなくてもかまいません。"

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="API キーを取得する"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="<strong>API キー</strong> は、AI がこの Joomla サイトで「あなた」として操作するための個人用パスワードです。キーを持つ人は、あなたの Joomla ユーザーアカウントができることをすべてできます &mdash; ですから他人に知られないようにしてください。生成方法は次のとおりです:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sここをクリックして Joomla のユーザープロフィールを開きます%s。新しいタブで開きます。そこで <strong>Joomla API トークン</strong> というタブを探してください。"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="そのタブで <strong>リセット</strong> ボタンをクリックします。Joomla が長い英数字の文字列を生成し、ボタンの下の欄に入れます。これがあなたのキーです。"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="欄の横にある小さな <strong>目のアイコン</strong> をクリックしてキーを表示し、文字列全体をコピーします。"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="このページの下の欄に貼り付ける（ブラウザーにだけ保存され、このページのコピーボタンが自動で入力できるようになります）か、簡単な設定のためにダッシュボードへ行くなら、ダッシュボードの API キーの欄に直接貼り付けてください。"

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="このキーはパスワードと同じように扱ってください。"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="共有ドキュメント、スクリーンショット、公開するコードに貼り付けないでください。万一漏れた場合は、「Joomla API トークン」タブに戻ってもう一度「リセット」をクリックしてください &mdash; 古いキーはすぐに無効になります。"

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="ここに API キーを貼り付け（このページでワンクリックコピーするため）"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>キーはこのブラウザーにだけ記憶されます</strong> &mdash; コンピューターの外には出ません。ごみ箱ボタンで消去できます。空欄のままでもこのページのコピーボタンは使えますが、コピーしたスニペットにキーを手で貼り付ける必要があります。"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="キーを表示 / 非表示"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="保存したキーを消去"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ 上級者向け: AI を手動で接続する（ほとんどの方には不要です）"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="このセクションは、AI クライアントとこのサイトの接続を手作業で設定したい方向けです &mdash; 通常は &ldquo;設定ファイル&rdquo; と呼ばれる小さなテキストファイルを編集します。上の簡単な設定でうまくいったなら、このセクションは丸ごと読み飛ばしてかまいません。セットアッププロンプトを使わずに AI クライアントへ直接接続を登録したい場合は、続きをお読みください。"

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="このサイトの接続 URL"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="AI クライアントに必要なアドレスです。API キーと一緒にクライアントの設定に貼り付けます。"

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="AI クライアントを選ぶ"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="接続 URL と API キーはどの AI でも同じです &mdash; クライアントによって違うのは <em>どこに貼り付けるか</em> だけです。下でクライアントを選ぶと、具体的な手順が表示されます。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex（CLI、IDE 拡張機能、デスクトップアプリ）"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex はこのエンドポイントを Streamable HTTP の MCP サーバーとしてネイティブに扱えます。まず Joomla の API キーをこのサイト専用の環境変数に保存し、その環境変数名を指定してエンドポイントを登録します。キーが <code>config.toml</code> に書き込まれることはありません。上でキーを貼り付けてからコピーボタンを使うと、コピーした環境変数のコマンドにそのキーが含まれるので、共有ターミナル、録画、サポートへの問い合わせには出さないでください。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; 今後の Codex プロセス用にキーを保存する"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Windows の永続的な環境変数を設定したら、新しいターミナルを開いてください。すでに動いている Codex やターミナルのプロセスからは見えません。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; このターミナル用にキーを設定する（必要なら安全なシェル環境に永続化してください）"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. この Joomla サイトを Codex に登録する"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="<code>codex mcp list</code> を実行し、Codex を再起動（または MCP の状態表示を確認）してから、無害な読み取り専用ツール <code>get_joomla_version</code> を呼び出してください。これで初期化、認証、ツールの検出、呼び出しを確認できます。読み取り専用で接続したい場合は、MCP for J のサーバー側の読み取り専用モードも有効にしてください。クライアント側の承認設定でサーバーの権限を上書きすることはできません。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="cPanel や PHP-FPM でトークンが無効になる？"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Web サーバーが標準の Authorization ヘッダーを取り除いている可能性があります。<code>~/.codex/config.toml</code> で上の手順で作られた項目をこのブロックに置き換えると、Codex が同じ環境変数を読み、<code>X-Joomla-Token</code> として送信します。その後 Codex を再起動してください。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="ご注意 &mdash; Claude の &ldquo;Add custom connector&rdquo; ダイアログには OAuth が必要ですが、このサイトでは無効になっています。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Claude Desktop と claude.ai に組み込まれた &ldquo;Add custom connector&rdquo; ダイアログはサインイン（OAuth）で接続し、API キーの欄がありません。Super User が MCP for J のオプションで OAuth サインインを有効にすれば、そのダイアログが使えるようになります。それまでは、下の Claude Desktop の手順では設定ファイルを編集する方法を使います。（または上の簡単な設定を使ってください &mdash; Claude でも使えます。）"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="4 つの手順です: 接続コマンドを入れた小さな補助ファイル（&ldquo;ラッパースクリプト&rdquo;）を作り、Claude Desktop の設定ファイルからそれを指定し、Claude Desktop を再起動します。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="なぜ接続を Claude Desktop の設定に直接書かず、ラッパースクリプトを使うのでしょうか？ Claude Desktop 1.30096 以降（2026年8月）は、コマンドの引数に認証情報が含まれていそうな設定項目を拒否します &mdash; 善意のセキュリティ機能ですが、残念ながら直接書く方法が使えなくなります。コマンドを小さな補助ファイルに移せばこれを回避でき（Claude Desktop には引数の見えない単純なコマンドだけが見えます）、API キーの安全性も以前とまったく変わりません &mdash; 補助ファイルは Claude Desktop 自体の設定と同じく、あなたのユーザーフォルダーにあります。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="最初に一度だけ必要なもの &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="この手順は、コンピューターに Node.js（<code>npx</code> というコマンドが付属）がインストールされていることを前提にしています。たいていの開発環境には入っていますが、なければ <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> から LTS 版のインストーラーで入れてください。下のラッパーファイルは、Windows の標準インストール先 <code>C:\Program Files\nodejs\</code> に Node.js があることを想定しています。別の場所に入れた場合は、コピー後にラッパーファイル内のパスを変更してください。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="手順 1 &mdash; ラッパースクリプトを作る"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="今のところ Windows のみです（Mac/Linux の方は FAQ を参照）。下のブロックを新しいテキストファイルにコピーします。ユーザーフォルダー（<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>）に <code>claude-mcp-joomla-{sitename}.cmd</code> というファイル名で保存し、<code>{sitename}</code> はサイトを表す短い名前（例: <code>cybersaltorg</code>）に置き換えます。<code>.cmd</code> がファイル名の一部ではなく本当に拡張子になっていることを確認してください &mdash; メモ帳では &ldquo;ファイルの種類: すべてのファイル&rdquo; を選ぶと <code>.txt</code> が付きません。このページの上の欄に API キーを貼り付けてあれば、コピーボタンが代わりに入れてくれます。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Windows のユーザー名が分からない場合は、エクスプローラーで <code>C:\Users\</code> を開き、フォルダー名を見てください &mdash; その中のひとつがあなたのものです。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="手順 2 &mdash; Claude Desktop の設定ファイルを開く"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Claude Desktop の設定ファイルは、OS ごとに決まった場所にあります。お好きなテキストエディター（VS Code、メモ帳、TextEdit、Sublime など）で開いてください:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop の Settings &rarr; Developer &rarr; <strong>Edit Config</strong> ボタンは、このファイルを開いてくれるはずのものです。クリックしても何も起きない場合は、コンピューターが <code>.json</code> ファイルを開くプログラムを知らないためです。大丈夫です &mdash; 上のいずれかのパスを使って、テキストエディターで自分で開いてください。ファイルがまだない場合は作成し、下のブロックを中身全体として使います（<code>{&quot;mcpServers&quot;: { ... }}</code> で囲みます）。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="手順 3 &mdash; このブロックを Claude Desktop の設定に追加する"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="これを <code>claude_desktop_config.json</code> に貼り付けます。ファイルにすでに他のサーバーを含む <code>mcpServers</code> オブジェクトがある場合は、その隣に <code>joomla-...</code> の項目を追加してください（2つ目の <code>mcpServers</code> オブジェクトは貼り付けないでください）。ファイルが空か存在しない場合は、下のブロック全体を中身として使います。<strong>重要:</strong> <code>YOUR_WINDOWS_USERNAME</code> を実際の Windows のユーザー名に置き換えてください。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="この設定は、手順 1 で作ったラッパースクリプトを Claude Desktop に指定するだけです。API キーは Claude Desktop の設定ではなく、ラッパーファイルの中に残ります。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="手順 4 &mdash; Claude Desktop を完全に終了して開き直す"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop は起動時にしか設定ファイルを読みません。完全に終了してください &mdash; Windows では、通知領域（右下。先に小さな上向き矢印をクリックする必要がある場合があります）の Claude アイコンを右クリックして Quit を選びます。数秒待ってから起動し直します。どの会話でもツールのアイコンをクリックする（または &ldquo;どんなツールがある？&rdquo; と尋ねる）と &mdash; サイトのツールが一覧に出るはずです。出ない場合は、下のトラブルシューティングを参照してください。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code（ターミナルまたは VS Code）"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Claude Code を使っているなら、ターミナルのコマンド1つで接続できます &mdash; 設定ファイルの編集は不要です。上の欄に API キーを貼り付けると下のコピーボタンがそれを入れてくれるので、コマンドをターミナルに貼り付けて Enter を押してください。Claude Code はすぐに接続を確認して再読み込みします。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai（Web 版）"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="claude.ai の <strong>Add custom connector</strong> ダイアログはサインイン（OAuth）で接続しますが、このサイトでは無効になっています。Super User が MCP for J のオプションで有効にすれば、claude.ai は常設の接続を使えるようになります。それまでは、上の簡単な設定（プロンプトを貼り付ける方法）は今のチャットでしか使えません。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor は MCP の接続を <code>mcp.json</code> という設定ファイルに保存します。テキストエディターで開き、下のブロックを <code>mcpServers</code> オブジェクトの中に貼り付けて保存します。たいていの場合、Cursor は再起動しなくても変更を反映します。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="設定ファイルの場所: <code>~/.cursor/mcp.json</code>（すべてのプロジェクト用）または特定のプロジェクトフォルダー内の <code>.cursor/mcp.json</code>（そのプロジェクトだけ）。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="ChatGPT のカスタム MCP サーバー"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="ChatGPT の <strong>Add custom MCP server</strong> ダイアログは、サインイン（OAuth）か認証なしでしか接続できず、API キーやヘッダーの欄がありません。このサイトでは OAuth サインインが無効なので、ChatGPT はまだ接続できません。Super User が MCP for J のオプションで有効にできます。それまでは、環境変数から API キーを送る Codex（OpenAI のコーディングエージェント）を使ってください。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="カスタム MCP サーバーの追加には ChatGPT の有料プランが必要です。Plus で動作します（2026年10月に確認）。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI と Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Gemini CLI（Google のターミナル用 AI アシスタント）も Gemini Code Assist 拡張機能（VS Code / JetBrains 用）も、同じ MCP 設定ファイルを読みます。手順は2つ: そのファイルを編集してこの Joomla サイトを MCP サーバーとして追加し、Gemini を再起動します。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="サーバーはグローバルに追加する（すべての Gemini セッションで見える）ことも、1つのプロジェクトフォルダーの中だけに追加することもできます。スニペットは同じです &mdash; 違うのはファイルの場所だけです。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Gemini の設定ファイルを開きます（なければ作成します）。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="次の2か所のどちらかを選びます:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="グローバル（すべてのプロジェクト）:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="プロジェクトのみ:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json（プロジェクトフォルダー内）"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. このブロックをファイルに貼り付けます。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="ファイルにすでに <code>mcpServers</code> セクションがある場合は、既存のものの中に <code>&quot;joomla-...&quot;</code> の項目を追加してください &mdash; 外側の <code>mcpServers</code> キーを重複させないでください。ファイルが空か新規なら、スニペット全体をそのまま貼り付けます。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini は HTTP 方式の MCP サーバー（これもそうです）に <code>httpUrl</code> を使います &mdash; Cursor の <code>url</code> キーとは違います。Cursor 用のものを流用せず、このスニペットをそのままコピーしてください。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Gemini を再起動します。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="ターミナルで <code>gemini</code> を終了して起動し直すか、VS Code / JetBrains のウィンドウを再読み込みします。Gemini CLI で <code>/mcp</code> と入力すると、接続中のサーバーが表示され、Joomla サイトが含まれていることを確認できます。"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="Web アプリの <code>gemini.google.com</code> は 2026年8月時点でカスタム MCP サーバーに対応していません &mdash; この手順は Gemini CLI と Gemini Code Assist だけを対象にしています。Google が今後 Web 画面で対応したら、ここに追記します。"

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="その他の MCP 対応 AI クライアント（Cline、Continue、エージェントモードの GitHub Copilot、Windsurf、mcp-cli など）も使えます &mdash; 接続 URL と API キーは同じで、違うのは貼り付ける場所だけです。今後、ほかのクライアントの手順も追加していきます。行き詰まったら、下の FAQ に一般的なヒントがあります。"

COM_CSMCPFORJ_SETUPGUIDE_COPY="コピー"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="コピーしました"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="コピーしました（キー込み）"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="セキュリティと共有"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="API キーそのものがログインです &mdash; キーを持つ人は、あなたの Joomla ユーザーアカウントができることをすべてできます。匿名アクセスはありません。<strong>OAuth サインイン</strong> を有効にすると、AI アプリはこのサイトの通常のログインページへあなたを送ることでも接続できます。その後は、ダッシュボードで接続を解除するまで、ログインしたアカウントとして、そのアカウントの権限そのままで動作します。"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="ほかの人に MCP のアクセスを与える"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="方法は2つあります &mdash; 合うほうを選んでください:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="1人につき1つのキー（最も安全）"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="1人ずつ Joomla ユーザーを作り、与えたい権限だけを持つグループ（例: 読み取り専用）に入れ、そのユーザーのキーを生成して個別に渡します。それぞれの操作が別々に記録され、ほかのキーに影響を与えずに1つだけ取り消せます。"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="共有の1つのキー（最も簡単、ただし最も安全性が低い）"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="読み取り専用グループに制限付きのユーザー（例: <code>mcp-demo-guest</code>）を1人作り、キーを1つ生成して広く共有します。配るのは簡単ですが、誰が使っているか分かりにくく、1人だけのアクセスを取り消すのも難しくなります。公開デモには向いていますが、重要なアクセスには向きません。"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="キーを取り消す"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="既存のキーをすぐに使えなくするには、ユーザー &rarr; 対象のユーザー &rarr; 「Joomla API トークン」タブ &rarr; <strong>リセット</strong> をクリックします。クリックした瞬間に古いキーは無効になります。新しいキーをその人に渡すか、アクセスなしのままにしてください。"

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="トラブルシューティング"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="接続しようとしているアプリの種類を見つけ、表示されている内容に合う問題を開いてください。エラーメッセージやファイアウォールによるブロックはどのアプリでも起こりうるので、最後に別のグループにまとめています。"

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; または &ldquo;Authentication failed&rdquo;（エラー 401）"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="AI はサイトに届いていますが、API キーが正しくありません。確認してください: (1) コピーした後にキーをリセットしていないか（リセットするたびに前のキーは無効になります）、(2) 文字の欠けや余分な空白なしでキー全体をコピーしたか、(3) 設定ファイルを編集した場合、キーの前に <code>Bearer </code>（後ろに空白1つ）があるか。迷ったら新しいキーを生成してもう一度試してください。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; または &ldquo;Could not match accept header&rdquo;（エラー 406）"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="古いバージョンの MCP for J（2.3.4 より前）には、一部の AI クライアントが接続できない不具合がありました。MCP for J を最新バージョンに更新してください &mdash; Joomla 管理画面の システム &rarr; アップデート &rarr; エクステンション を確認してください。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;接続できたのに AI にツールが表示されない&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="たいていは次の3つのどれかです: (1) ユーザーのグループに <strong>Webサービスログイン</strong> がない &mdash; システム &rarr; グローバル設定 &rarr; 権限 で設定します（既定で持つのは Super User だけです）。(2) グループに MCP の権限がない &mdash; Super User は常に、Administrator は Joomla の既定値で持っていますが、Manager などのグループには、このコンポーネントの オプション &rarr; 権限 で「MCP エンドポイントを使用」（変更には「MCP エンドポイント経由で書き込み」も）が必要です。(3) AI クライアントが空のツール一覧をキャッシュしている &mdash; クライアントで MCP サーバーの接続を一度解除して接続し直し、確認し直させてください。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; または URL がエラーを返す（エラー 404）"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="URL が間違っている（確認してください &mdash; <code>/api/index.php/v1/mcp</code> で終わるはずです）か、Joomla サイトで MCP 用の Webサービスプラグインが無効になっています。Joomla 管理画面で: システム &rarr; 管理 &rarr; エクステンション &rarr; <code>csmcpforj</code> を検索 &rarr; Webサービスプラグインが有効か確認します。すでに有効なら、サイトの <code>.htaccess</code> が <code>/api/</code> パスをブロックしている可能性があります &mdash; ホスティング会社かセキュリティプラグインの問題です。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; または &ldquo;Malware detected&rdquo;（エラー 403）"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Joomla サイトのセキュリティ系エクステンション（RSFirewall、Admin Tools Pro、Securitycheck Pro）が MCP のリクエストをブロックしています。RSFirewall では例外を2つ追加します: <code>csmcpforj_oauth</code> と、正規表現として <code>api\/index\.php\/v1\/mcp</code>（前者はサインイン用）。ほかのものでは、<code>/api/index.php/v1/mcp</code>、<code>/.well-known/oauth-protected-resource</code>、<code>/.well-known/oauth-authorization-server</code>、および <code>csmcpforj_oauth</code> を含む URL を許可してください。原因を確かめるには、セキュリティ系エクステンションを一時的にオフにして試し、その後、例外を設定したうえでオンに戻します。ダッシュボードの <strong>接続を確認</strong> ボタンで、どのアドレスがブロックされているか分かります。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Claude Desktop の &ldquo;Edit Config&rdquo; ボタンを押しても何も起きない"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="このボタンは、<code>claude_desktop_config.json</code> を、コンピューターが <code>.json</code> ファイルを開くのに使うプログラムへ渡そうとします。それが設定されていないと、ボタンは何も言わずに何もしません。回避策: 任意のテキストエディターで自分でファイルを開いてください。OS ごとのパスは、上の「上級者向け」内の Claude のセクションにあります。ファイルがまだない場合は作成し、そのセクションのスニペットを中身全体として使います（スニペットを <code>{&quot;mcpServers&quot;: { ... }}</code> で囲みます）。権限の変更は不要です &mdash; ファイルはあなたのユーザーフォルダーにあります。"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="Claude の &ldquo;Add custom connector&rdquo; や ChatGPT の &ldquo;Add custom MCP server&rdquo; に API キーの欄がない"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="これらのダイアログはサインイン（OAuth）で接続するためのもので、MCP for J の API キーを貼り付ける場所はありません。このサイトでは OAuth サインインが無効です。Super User が コンポーネント &rarr; MCP for J &rarr; オプション &rarr; <strong>OAuth サインイン</strong> で有効にすれば、両方のダイアログが使えるようになります。それまでは: Claude Desktop は上のラッパースクリプトの方法、claude.ai は簡単な設定、ChatGPT を使う方は Codex を使えます。"

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop の起動時に &ldquo;Some MCP servers could not be loaded&rdquo; と表示される"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096 以降（2026年8月）は設定ファイルの検証を厳しくし、コマンドの引数に認証情報が含まれていそうな項目を拒否するようになりました。そのため、Bearer トークンを使う MCP サーバーを <code>claude_desktop_config.json</code> に直接設定する2つの分かりやすい方法 &mdash; ネイティブの <code>type: http</code> 形式と、<code>--header &quot;Authorization: Bearer ...&quot;</code> 引数付きの <code>mcp-remote</code> &mdash; がどちらも使えません。どちらも設定ファイル上は正しく見えますが、Claude Desktop のスキーマ検証が読み込み時に捨ててしまいます。<strong>対処法:</strong> 上の「上級者向け」内の Claude のセクションで説明しているラッパースクリプトの方法を使ってください &mdash; コマンド全体を小さな <code>.cmd</code> ファイルに入れ、Claude Desktop の設定ではそのファイルを指定するだけにします。Claude Desktop には引数の見えない単純なコマンドだけが見えるので、受け付けられます。API キーの安全性は以前とまったく同じです &mdash; ラッパーファイルはあなたのユーザーフォルダーにあります。"

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Claude Desktop を再起動したのに、新しい接続が認識されない"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="Windows では、Claude Desktop のウィンドウを閉じても通知領域に隠れるだけです &mdash; アプリ全体は古い設定をメモリに読み込んだまま動き続けます。あとでタスクバーのアイコンをクリックしても、すでに動いているそのプロセスのウィンドウが戻ってくるだけです。Claude Desktop が設定ファイルを読み直すのは、アプリを本当に再起動したときだけです。本当に再起動するには: 通知領域の Claude アイコンを右クリック（右下。隠れたアイコンを表示するには小さな上向き矢印をクリックする必要がある場合があります） &rarr; <strong>Quit</strong> を選ぶ &rarr; プロセスが完全に終わるまで約 3 秒待つ &rarr; スタートメニューから Claude Desktop を起動し直す。そこで初めて、設定ファイルの変更が反映されます。"

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="よくある質問"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="API キーなしでこの接続を使える人はいますか？"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="いいえ。すべてのリクエストには有効な API キー、または OAuth サインインが有効な場合は OAuth アクセストークンが必要です。それがないリクエストは拒否されます。これは意図的な設計です &mdash; AI はサイトで実際の操作（記事の作成、ユーザーの編集など）を行えるので、匿名アクセスはセキュリティ上の大惨事になります。"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="1人の Joomla ユーザーが複数の有効な API キーを持てますか？"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="いいえ。Joomla はユーザーごとに API キーをちょうど1つだけ保存します。「リセット」をクリックすると新しいキーが生成され、古いキーは無効になります。複数のキー（端末ごと、AI ツールごとなど）が必要なら、別々の Joomla ユーザーを作成してください。"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="使える量に上限はありますか？"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="MCP for J 自体に上限はありません。通常のホスティングの制限（PHP のメモリ、MariaDB の接続数など）は適用されます。多くのサイトにまたがる大量の一括処理など、大きな負荷をかける場合は、PHP-FPM の同時実行数を増やせないかホスティング会社に相談してください。"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="ファイアウォールのポートを開けたり、特別な設定をしたりする必要はありますか？"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="いいえ。MCP はポート 443 の標準的な HTTPS を使うだけです。サイトがすでに <code>https://yoursite.com/</code> で公開されていれば、追加の設定なしで、インターネット上のどの AI クライアントからも MCP エンドポイントにアクセスできます。"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="API キーを定期的に変更（ローテーション）するには？"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="自動のスケジュールはありません &mdash; 好きなときに手動で変更します。ユーザー &rarr; 対象のユーザー &rarr; 「Joomla API トークン」タブ &rarr; 「リセット」をクリックします。その後、AI クライアントの設定を新しいキーで更新します。よい習慣: スクリーンショット、ログ、バグ報告に一度でも写ったキーは変更しましょう。"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="上に載っていない AI クライアントを使っています &mdash; 動きますか？"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="HTTPS 経由の標準的な MCP に対応し、独自の Authorization ヘッダーを追加できるか、OAuth でサインインできれば（オプションで OAuth サインインを有効にしてください）、ほぼ確実に動きます。URL はどこでも同じです &mdash; 違うのはクライアントの設定画面だけです。動作は確認済みでも、まだ手順を書いていないクライアント: Continue.dev、Windsurf、Zed エディター、mcp-cli、MCP Inspector、LibreChat、Open WebUI（<code>mcpo</code> ブリッジ経由）、各種 Ollama ベースのエージェント。"

