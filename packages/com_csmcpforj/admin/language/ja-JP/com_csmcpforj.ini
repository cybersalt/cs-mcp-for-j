COM_CSMCPFORJ_SUPPORT_BANNER_PRO_HEADING="MCP for J Pro メンバーシップが有効です &mdash; ありがとうございます！"
COM_CSMCPFORJ_SUPPORT_BANNER_PRO_BODY="Pro メンバーは優先サポートを受けられます。お問い合わせは Pro サポートのタグ付きで届くので、真っ先に確認し、できるだけ早くお返事します。何でもお尋ねください &mdash; 不具合の報告、機能の要望、質問、アイデア &mdash; どれも歓迎です。"

