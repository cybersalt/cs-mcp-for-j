COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_BODY="不具合の報告、機能の要望、質問、アイデアをお送りください &mdash; すべて読み、フィードバックに感謝しています。無料版のサポートはできる範囲での対応となる（無料サポートに割けるリソースは限られています）ため、お返事に時間がかかることがあります。回答時間の保証や優先対応が必要な場合は、%sMCP for J Pro メンバーシップ%s をご検討ください。"

