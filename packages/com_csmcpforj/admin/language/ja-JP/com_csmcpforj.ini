; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="このエンドポイントを使えるのは誰ですか？"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="権限は、API トークンを所有する Joomla ユーザーアカウントに対して確認されます。MCP クライアント（Codex、Claude、Cursor、Cline、ChatGPT、Copilot、Gemini、curl など）は中継するだけです &mdash; 同じトークンなら、どのクライアントから使っても同じように動作します。"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="重要:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="トークンを生成した人は、Joomla 管理画面のどこでも持っているのと同じアクセス権を、MCP エンドポイント経由でも持ちます。それらの操作を直接任せられるユーザーにだけトークンを生成してください。"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Joomla ユーザーグループ"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="そのまま使える？"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="理由"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="はい"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="明示的な許可が必要"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Super User は Joomla のあらゆる権限チェックを常に通過します。"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Joomla の既定の権限により core.manage を持っており、MCP のチェックは読み取り・書き込みツールについてこれを認めます（権限、エクステンション、プラグイン設定、Joomla 自体を変更するツールには引き続き Super User が必要です） &mdash; ただし、Joomla がそもそも認証を許すには、グループに <strong>Webサービスログイン</strong> が必要です。"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="既定では MCP の権限がありません。システム &rarr; グローバル設定 &rarr; 権限 でグループに <strong>Webサービスログイン</strong> を与え、このコンポーネントの <strong>オプション &rarr; 権限</strong> で「MCP エンドポイントを使用」と（必要に応じて）「MCP エンドポイント経由で書き込み」を与えてください。"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Webサービスログインが必要"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="その前に:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla は API 全体を <strong>Webサービスログイン</strong>（<code>core.login.api</code>）という別の権限で守っており、<strong>既定でこれを持つのは Super User だけです</strong>。それ以外のグループ &mdash; Administrator や Manager も含め &mdash; は、管理画面で何ができるかに関係なく、この権限を与えるまでどのツールからも <code>403 Forbidden</code> を受け取ります。設定は <strong>システム &rarr; グローバル設定 &rarr; 権限</strong> で、このコンポーネントではなくグループに対して行います。"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / カスタムグループ"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="システム &rarr; グローバル設定 &rarr; 権限 でグループに <strong>Webサービスログイン</strong> を与え、このコンポーネントの <strong>オプション &rarr; 権限</strong> で「MCP エンドポイントを使用」と（必要に応じて）「MCP エンドポイント経由で書き込み」を与えてください。"

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="AI アシスタントをこのサイトに接続する"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="方法は2つあります。1つ目（プロンプトをコピーして貼り付ける）がいちばん簡単です &mdash; クライアントの設定は不要で、AI が動作を確認すると、たいてい JSON を手で編集することなく、このサイトを常設のコネクタとしてインストールしようかと提案してくれます。2つ目は、クライアントの設定を自分で直接編集したい方向けです。"

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="セットアッププロンプトをコピー（推奨）"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="AI アシスタントにセットアッププロンプトを貼り付ける"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="クライアントの設定は不要です。下のプロンプトを、AI アシスタント（Codex、Claude、Cursor、ChatGPT、Copilot、Gemini など）との新しい会話にコピーしてください。AI がテスト用の curl を実行して接続を確認し、 &mdash; 対応しているクライアントでは &mdash; 接続を常設にしようかと提案します。JSON ファイルの編集も、ターミナルのコマンドを覚える必要もありません。"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="さらに:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="AI クライアントにシェルツールがある場合（Codex、Claude Code、Cursor Composer、Cline、Continue、GitHub Copilot のエージェントモードなど）、プロンプトには自己インストールの提案が含まれます。接続が動作することを AI が確認したら &lsquo;常設にして&rsquo; と伝えるだけで、クライアントに合ったコマンド（例: <code>codex mcp add</code> や <code>claude mcp add</code>）を実行して MCP サーバーを登録します。クライアントを再起動すると、このサイトがすべての会話でネイティブの MCP ツールとして使えるようになります &mdash; プロンプトはもう要りません。"
; Shared "type here" field pattern - see FieldStyleHelper.
COM_CSMCPFORJ_FIELD_OPTIONAL="任意"
COM_CSMCPFORJ_FIELD_REQUIRED="必須"

COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="マイプロフィール（右のリンク）で Joomla API トークンを生成します。"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="下の &lsquo;プロンプトをコピー&rsquo; をクリックします。"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="AI アシスタントとの新しい会話に貼り付けます。手順 2 を飛ばした場合は、先に <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> を実際のトークンに置き換えてください。"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="送信します。AI が接続をテストし、対応しているクライアントでは接続を常設にしようかと提案します。"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="このプロンプトは、シェルやターミナルのツールを持つあらゆる AI クライアントで使えます: <strong>Codex</strong>、Claude Code、Cursor Composer、Cline、Continue、GitHub Copilot（エージェントモード）、Gemini CLI、Windsurf、mcp-cli など。シェルを使えない Web のみのチャット（claude.ai、chatgpt.com、gemini.google.com）では動作しません &mdash; それらには MCP コネクタのタブを使ってください。"

; Tab 2 — manual MCP connector configuration
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="MCP コネクタ（手動設定）"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="MCP コネクタとして手動で追加する"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="Claude Desktop（設定ファイル）、Claude Code、Cursor、Codex、Cline、Copilot、Gemini CLI など、設定を直接編集したいクライアント向けです。一度設定すれば、すべての会話で使えます。（claude.ai と ChatGPT のカスタムコネクタは API キーを送れず、サインインで接続します。このページの <strong>サインインで接続（OAuth）</strong> を参照してください。）"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="マイプロフィールで Joomla API トークンを生成します。"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="下の設定スニペットをコピーします。"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP3="<code>YOUR_JOOMLA_API_TOKEN</code> を、生成したトークンに置き換えます。"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="AI クライアントの MCP 設定に貼り付けます &mdash; Claude Desktop: <code>claude_desktop_config.json</code>、Claude Code: <code>claude mcp add</code>、Cursor: <code>~/.cursor/mcp.json</code>、GitHub Copilot: VS Code / JetBrains の MCP 設定、Cline / Continue: 拡張機能の JSON 設定。保存後にクライアントを再起動してください。（claude.ai と ChatGPT の &ldquo;Add custom connector&rdquo; ダイアログにはこの欄がないので、そちらでは OAuth サインインを使ってください。）"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_XHEADER_NOTE="クライアントが Authorization ヘッダーに対応していない場合は、headers ブロックを次のものに置き換えてください:"

