COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Een AI met deze Joomla-site verbinden"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for J is gemaakt om het makkelijk te maken een AI-assistent zoals Codex, Claude, ChatGPT of Cursor met je Joomla-site te verbinden &mdash; zodat de AI je artikelen kan lezen, gebruikers kan beheren, inhoud kan publiceren en meer, allemaal via de gewone chat van de AI. Je hoeft niet technisch te zijn. De makkelijke methode hieronder werkt voor de meeste mensen; scroll naar beneden voor geavanceerde opties als je die nodig hebt."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ De makkelijke manier"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Geen configuratiebestanden. Geen headers. Geen vakjargon. Kopieer gewoon een kant-en-klare installatieprompt van het dashboard en plak hem in een nieuwe chat met je AI. De AI doet de rest &mdash; hij test de verbinding en biedt, bij clients die dat ondersteunen, aan de verbinding blijvend voor je op te slaan."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Haal je API-sleutel op</strong> (een persoonlijk wachtwoord waarmee je AI op deze site kan handelen). Hieronder staat hoe, als je er nog geen hebt."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Ga naar het dashboard</strong> (knop hieronder) en plak je API-sleutel daar in het veld."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Klik op de knop &ldquo;Prompt kopiëren&rdquo;</strong> op het dashboard. Je sleutel wordt automatisch in de prompt ingevuld voordat hij wordt gekopieerd."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Plak hem in een nieuwe chat</strong> met je AI (Claude, ChatGPT, Cursor, Copilot, Gemini enz.) en verstuur. De AI bevestigt dat de verbinding werkt en biedt aan hem op te slaan."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Naar het dashboard"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="Dat is alles. Je AI is verbonden. Wil je meer weten over hoe de onderdelen samenwerken, of configureer je je AI liever handmatig, lees dan hieronder verder &mdash; maar het hoeft niet."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Je API-sleutel ophalen"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="Een <strong>API-sleutel</strong> is een persoonlijk wachtwoord waarmee je AI op deze Joomla-site als JIJ kan handelen. Iedereen met de sleutel kan alles wat jouw Joomla-gebruikersaccount kan &mdash; behandel hem dus als privé. Zo maak je er een aan:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sKlik hier om je Joomla-gebruikersprofiel te openen%s. Het opent in een nieuw tabblad. Zoek daar het tabblad <strong>Joomla API token</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="Klik op dat tabblad op de knop <strong>Herstellen</strong>. Joomla maakt een lange reeks letters en cijfers aan en zet die in het veld onder de knop. Dat is je sleutel."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Klik op het kleine <strong>oogpictogram</strong> naast het veld om de sleutel te tonen, en kopieer dan de hele reeks."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Plak hem in het veld hieronder op deze pagina (hij wordt alleen in je browser opgeslagen, zodat de kopieerknoppen op deze pagina hem automatisch kunnen invullen), OF plak hem direct in het API-sleutelveld van het dashboard als je daar de makkelijke installatie gaat doen."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Behandel deze sleutel als een wachtwoord."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Plak hem niet in gedeelde documenten, schermafbeeldingen of code die je publiceert. Als hij ooit uitlekt, ga dan terug naar het tabblad Joomla API token en klik opnieuw op Herstellen &mdash; de oude sleutel werkt dan meteen niet meer."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Plak hier je API-sleutel (om op deze pagina met één klik te kopiëren)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Je sleutel wordt alleen in deze browser onthouden</strong> &mdash; hij verlaat je computer nooit. Gebruik de prullenbakknop om hem te vergeten. Als je dit leeg laat, werken de kopieerknoppen op deze pagina nog steeds, maar moet je je sleutel zelf in het gekopieerde fragment plakken."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Sleutel tonen/verbergen"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Opgeslagen sleutel vergeten"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Geavanceerd: een AI handmatig verbinden (de meeste mensen hebben dit niet nodig)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Dit gedeelte is voor wie de verbinding van de AI-client met deze site met de hand wil instellen &mdash; meestal door een klein tekstbestand te bewerken, een &ldquo;configuratiebestand&rdquo;. Als de makkelijke installatie hierboven werkte, kun je dit hele gedeelte gerust overslaan. Wil je de installatieprompt overslaan en de verbinding rechtstreeks in je AI-client registreren, lees dan verder."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="De verbindings-URL van deze site"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="Dit is het adres dat je AI-client nodig heeft. Je plakt dit samen met je API-sleutel in de instellingen van de client."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Kies je AI-client"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="De verbindings-URL en API-sleutel zijn voor elke AI hetzelfde &mdash; alleen <em>waar je ze plakt</em> verschilt per client. Kies hieronder je client voor de specifieke instructies."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, IDE-extensie of desktopapp)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex ondersteunt dit endpoint rechtstreeks als Streamable HTTP MCP-server. Sla eerst de Joomla API-sleutel op in een omgevingsvariabele voor deze site, en registreer daarna het endpoint met de naam van die omgevingsvariabele. De sleutel wordt nooit in <code>config.toml</code> geschreven. Als je de kopieerknop gebruikt nadat je hierboven een sleutel hebt geplakt, bevat de gekopieerde omgevingsopdracht die sleutel; houd hem dus weg uit gedeelde terminals, opnames en supportverzoeken."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; sla de sleutel op voor toekomstige Codex-processen"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Open een nieuwe terminal nadat je een blijvende Windows-omgevingsvariabele hebt ingesteld. Bestaande Codex- en terminalprocessen zien hem niet."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; stel de sleutel in voor deze terminal (bewaar hem zo nodig in je beveiligde shellomgeving)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Registreer deze Joomla-site bij Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Voer <code>codex mcp list</code> uit, start Codex opnieuw (of bekijk de MCP-status in de interface) en roep daarna de onschuldige alleen-lezen tool <code>get_joomla_version</code> aan. Zo controleer je initialisatie, authenticatie, het vinden van tools en het aanroepen ervan. Wil je een alleen-lezen verbinding, schakel dan ook de alleen-lezenmodus aan de serverkant van MCP for J in; goedkeuringsinstellingen in de client kunnen de serverrechten niet opheffen."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Ongeldig token op cPanel of PHP-FPM?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="De webserver haalt mogelijk de standaard Authorization-header weg. Vervang het item dat hierboven is aangemaakt in <code>~/.codex/config.toml</code> door dit blok, zodat Codex dezelfde omgevingsvariabele leest en als <code>X-Joomla-Token</code> verstuurt, en start Codex daarna opnieuw."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Let op &mdash; het dialoogvenster &ldquo;Add custom connector&rdquo; van Claude heeft OAuth nodig, en dat staat op deze site uit."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Het ingebouwde dialoogvenster &ldquo;Add custom connector&rdquo; van Claude Desktop en claude.ai verbindt door aan te melden (OAuth) en heeft geen veld voor een API-sleutel. Een Super User kan OAuth-aanmelding inschakelen in de opties van MCP for J; daarna werkt dat dialoogvenster. Tot die tijd gebruiken de instructies voor Claude Desktop hieronder een aanpassing van het configuratiebestand. (Of gebruik de makkelijke installatie hierboven &mdash; die werkt ook met Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Vier stappen: maak een klein hulpbestand, een &ldquo;wrapper-script&rdquo;, dat de verbindingsopdracht bevat, laat het configuratiebestand van Claude Desktop ernaar verwijzen en start Claude Desktop opnieuw."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Waarom een wrapper-script in plaats van de verbinding rechtstreeks in de configuratie van Claude Desktop te zetten? Claude Desktop 1.30096+ (aug. 2026) weigert configuratie-items waarvan de opdrachtargumenten op inloggegevens lijken &mdash; een goedbedoelde beveiliging die helaas de directe aanpak blokkeert. Door de opdracht naar een klein hulpbestand te verplaatsen omzeil je dat (Claude Desktop ziet alleen een gewone opdracht zonder zichtbare argumenten), terwijl je API-sleutel precies even veilig blijft als voorheen &mdash; het hulpbestand staat in je eigen gebruikersmap, naast de configuratie van Claude Desktop zelf."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Eenmalige voorwaarde &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Deze instructies gaan ervan uit dat Node.js op je computer is geïnstalleerd (dat bevat een opdracht met de naam <code>npx</code>). De meeste ontwikkelomgevingen hebben het al; zo niet, installeer het dan van <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> met het LTS-installatieprogramma. Het wrapper-bestand hieronder verwacht Node.js op het standaard installatiepad van Windows, <code>C:\Program Files\nodejs\</code>. Heb je het ergens anders geïnstalleerd, pas dat pad dan aan in het wrapper-bestand nadat je het hebt gekopieerd."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Stap 1 &mdash; maak het wrapper-script"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Voorlopig alleen voor Windows (Mac- en Linux-gebruikers: zie de FAQ). Kopieer het blok hieronder naar een nieuw tekstbestand. Sla het op in je gebruikersmap (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) met de bestandsnaam <code>claude-mcp-joomla-{sitename}.cmd</code>, waarbij je <code>{sitename}</code> vervangt door een korte naam voor je site (bijv. <code>cybersaltorg</code>). Zorg dat <code>.cmd</code> echt de extensie is en geen deel van de bestandsnaam &mdash; kies in Kladblok &ldquo;Opslaan als type: Alle bestanden&rdquo;, zodat er geen <code>.txt</code> achter komt. Als je je API-sleutel bovenaan deze pagina in het veld hebt geplakt, vult de kopieerknop hem voor je in."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Weet je je Windows-gebruikersnaam niet? Open Verkenner, ga naar <code>C:\Users\</code> en bekijk de mapnamen &mdash; er is er een van jou."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Stap 2 &mdash; open het configuratiebestand van Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Het instellingenbestand van Claude Desktop staat per besturingssysteem op een vaste plek. Open het met een willekeurige teksteditor (VS Code, Kladblok, TextEdit, Sublime, wat je maar hebt):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop heeft onder Settings &rarr; Developer een knop <strong>Edit Config</strong> die het bestand voor je zou moeten openen. Als er niets gebeurt wanneer je erop klikt, weet je computer niet met welk programma <code>.json</code>-bestanden moeten worden geopend. Geen probleem &mdash; open het bestand gewoon zelf met een teksteditor via een van de paden hierboven. Bestaat het bestand nog niet, maak het dan aan en gebruik het blok hieronder als volledige inhoud (verpakt als <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Stap 3 &mdash; voeg dit blok toe aan de configuratie van Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Plak dit in <code>claude_desktop_config.json</code>. Als het bestand al een <code>mcpServers</code>-object met andere servers bevat, voeg het item <code>joomla-...</code> dan daarnaast toe (plak geen tweede <code>mcpServers</code>-object). Is het bestand leeg of ontbreekt het, gebruik dan het hele blok hieronder als inhoud. <strong>Belangrijk:</strong> vervang <code>YOUR_WINDOWS_USERNAME</code> door je echte Windows-gebruikersnaam."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Deze configuratie laat Claude Desktop alleen verwijzen naar het wrapper-script dat je in stap 1 hebt gemaakt. Je API-sleutel blijft in het wrapper-bestand, niet in de configuratie van Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Stap 4 &mdash; sluit Claude Desktop volledig af en open het opnieuw"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop leest het configuratiebestand alleen bij het opstarten. Sluit het volledig af &mdash; klik in Windows met de rechtermuisknop op het Claude-pictogram in het systeemvak (rechtsonder, misschien moet je eerst op het pijltje omhoog klikken) en kies Quit. Wacht een paar seconden en start het opnieuw. Klik in een willekeurig gesprek op het toolspictogram (of vraag &ldquo;welke tools heb je?&rdquo;) &mdash; de tools van de site horen erin te staan. Zo niet, zie Problemen oplossen hieronder."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (terminal of VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Gebruik je Claude Code, dan legt één terminalopdracht de verbinding &mdash; zonder configuratiebestand te bewerken. Plak je API-sleutel in het veld hierboven, zodat de kopieerknop hieronder hem invult, plak de opdracht daarna in een terminal en druk op Enter. Claude Code bevestigt de verbinding meteen en laadt opnieuw."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (de webversie)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="Het dialoogvenster <strong>Add custom connector</strong> van claude.ai verbindt door aan te melden (OAuth), en dat staat op deze site uit. Een Super User kan het inschakelen in de opties van MCP for J, en dan krijgt claude.ai een blijvende verbinding. Tot die tijd werkt de makkelijke installatie hierboven (een prompt plakken) alleen voor de huidige chat."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor bewaart zijn MCP-verbindingen in een configuratiebestand met de naam <code>mcp.json</code>. Open het in een teksteditor, plak het blok hieronder in het <code>mcpServers</code>-object en sla op. Cursor neemt de wijziging meestal over zonder herstart."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Locatie van het configuratiebestand: <code>~/.cursor/mcp.json</code> (voor al je projecten) of <code>.cursor/mcp.json</code> in een specifieke projectmap (alleen voor dat project)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Aangepaste MCP-servers in ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="Het dialoogvenster <strong>Add custom MCP server</strong> van ChatGPT kan alleen verbinden door aan te melden (OAuth) of zonder authenticatie; het heeft geen veld voor een API-sleutel of header. OAuth-aanmelding staat op deze site uit, dus ChatGPT kan nog niet verbinden. Een Super User kan het inschakelen in de opties van MCP for J. Gebruik tot die tijd Codex (de programmeeragent van OpenAI), die de API-sleutel uit een omgevingsvariabele verstuurt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Voor het toevoegen van een aangepaste MCP-server is een betaald ChatGPT-abonnement nodig. Het werkt met Plus (gecontroleerd in oktober 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI en Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Zowel Gemini CLI (de AI-assistent van Google voor de terminal) als de extensie Gemini Code Assist (voor VS Code / JetBrains) lezen hetzelfde MCP-configuratiebestand. Twee stappen: bewerk dat bestand om deze Joomla-site als MCP-server toe te voegen en start Gemini daarna opnieuw."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Je kunt de server globaal toevoegen (zodat elke Gemini-sessie hem ziet) of alleen binnen één projectmap. Het fragment is hetzelfde &mdash; alleen de locatie van het bestand verschilt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Open (of maak) je Gemini-instellingenbestand."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Kies een van deze twee locaties:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Globaal (elk project):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Alleen dit project:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (in een projectmap)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Plak dit blok in het bestand."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Als het bestand al een <code>mcpServers</code>-gedeelte heeft, voeg het item <code>&quot;joomla-...&quot;</code> dan toe binnen het bestaande gedeelte &mdash; maak de buitenste sleutel <code>mcpServers</code> niet dubbel. Is het bestand leeg of gloednieuw, plak dan het hele fragment zoals het is."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini gebruikt <code>httpUrl</code> voor MCP-servers via HTTP (zoals deze) &mdash; dat is anders dan de sleutel <code>url</code> van Cursor. Kopieer dit fragment precies in plaats van dat van Cursor te hergebruiken."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Start Gemini opnieuw."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Sluit <code>gemini</code> in de terminal af en start het opnieuw, of laad het venster van VS Code / JetBrains opnieuw. Typ <code>/mcp</code> in Gemini CLI om de verbonden servers te zien en te controleren of je Joomla-site erbij staat."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="De webapp <code>gemini.google.com</code> ondersteunt sinds aug. 2026 geen aangepaste MCP-servers &mdash; deze uitleg gaat alleen over Gemini CLI en Gemini Code Assist. Als Google later ondersteuning in de webinterface toevoegt, beschrijven we die hier."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Andere AI-clients die MCP kennen (Cline, Continue, GitHub Copilot in agentmodus, Windsurf, mcp-cli enz.) werken ook &mdash; de verbindings-URL en API-sleutel zijn hetzelfde, alleen de plek waar je ze plakt verschilt. We voegen in de loop van de tijd uitleg voor meer clients toe; kom je er niet uit, dan staat er algemene hulp in de FAQ hieronder."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Kopiëren"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Gekopieerd"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Gekopieerd (met je sleutel)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Beveiliging &amp; delen"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="Je API-sleutel IS de aanmelding &mdash; wie hem heeft, kan alles wat jouw Joomla-gebruikersaccount kan. Er is geen anonieme toegang. Als je <strong>OAuth-aanmelding</strong> inschakelt, kan een AI-app ook verbinden door je naar de gewone inlogpagina van deze site te sturen; de app handelt dan als het account dat zich heeft aangemeld, met precies de rechten van dat account, totdat je de verbinding op het dashboard verbreekt."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="MCP-toegang aan anderen geven"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Er zijn twee manieren &mdash; kies wat past:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Eén sleutel per persoon (het veiligst)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Maak voor elke persoon een Joomla-gebruiker aan, zet die in een groep met alleen de rechten die je wilt geven (bijv. alleen-lezen), maak een sleutel aan voor die gebruiker en stuur hem privé. Elke persoon heeft een eigen spoor in de logboeken; je kunt één sleutel intrekken zonder de andere te raken."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Eén gedeelde sleutel (het eenvoudigst, maar het minst veilig)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Maak één beperkte gebruiker aan (bijv. <code>mcp-demo-guest</code>) in een alleen-lezengroep, maak één sleutel aan en deel die breder. Makkelijker te verspreiden; lastiger om te weten wie hem gebruikt of om de toegang voor één persoon in te trekken. Prima voor een openbare demo; niet voor gevoelige toegang."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Een sleutel intrekken"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="Om een bestaande sleutel meteen te laten stoppen, ga je naar Gebruikers &rarr; de betreffende gebruiker &rarr; tabblad Joomla API token &rarr; klik op <strong>Herstellen</strong>. De oude sleutel werkt niet meer op het moment dat je klikt. Geef die persoon de nieuwe sleutel of laat hem of haar zonder toegang."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Problemen oplossen"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Zoek het soort app dat je verbindt en open dan het probleem dat past bij wat je ziet. Foutmeldingen en blokkades door een firewall kunnen in elke app voorkomen, dus die hebben aan het eind een eigen groep."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; of &ldquo;Authentication failed&rdquo; (fout 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="Je AI bereikt de site, maar de API-sleutel klopt niet. Controleer: (1) of de sleutel niet is gereset sinds je hem kopieerde (elke reset maakt de vorige sleutel ongeldig); (2) of de sleutel volledig is gekopieerd, zonder ontbrekende tekens of extra spaties; (3) als je een configuratiebestand hebt bewerkt, of het woord <code>Bearer </code> (met een spatie erna) vóór de sleutel staat. Twijfel je, maak dan een nieuwe sleutel aan en probeer het opnieuw."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; of &ldquo;Could not match accept header&rdquo; (fout 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Oudere versies van MCP for J (vóór 2.3.4) hadden een fout waardoor sommige AI-clients geen verbinding konden maken. Werk MCP for J bij naar de nieuwste versie &mdash; kijk onder Systeem &rarr; Update &rarr; Extensies in je Joomla-beheer."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;Verbonden, maar de AI toont geen tools&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Meestal een van drie dingen: (1) de groep van de gebruiker heeft geen <strong>Web services inloggen</strong> &mdash; stel dat in onder Systeem &rarr; Algemene instellingen &rarr; Rechten (standaard hebben alleen Super Users het); (2) de groep heeft geen MCP-rechten &mdash; Super Users hebben die altijd en Administrators via de standaardinstellingen van Joomla, maar Managers en andere groepen hebben MCP-endpoint gebruiken nodig (en Schrijven via MCP-endpoint voor wijzigingen) in de Opties &rarr; Rechten van deze component; (3) de AI-client heeft een lege lijst met tools in de cache &mdash; verbreek de verbinding met de MCP-server in de client en maak hem opnieuw, zodat hij opnieuw controleert."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; of de URL geeft een fout (fout 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Ofwel de URL klopt niet (controleer hem &mdash; hij moet eindigen op <code>/api/index.php/v1/mcp</code>), OF de Web Services-plugin voor MCP is op je Joomla-site uitgeschakeld. In het Joomla-beheer: Systeem &rarr; Beheren &rarr; Extensies &rarr; zoek op <code>csmcpforj</code> &rarr; zorg dat de Web Services-plugin is ingeschakeld. Is hij al ingeschakeld, dan blokkeert de <code>.htaccess</code> van je site misschien het pad <code>/api/</code> &mdash; een probleem bij de hostingprovider of een beveiligingsplugin."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; of &ldquo;Malware detected&rdquo; (fout 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Een beveiligingsplugin op je Joomla-site (RSFirewall, Admin Tools Pro, Securitycheck Pro) blokkeert het MCP-verzoek. Voeg in RSFirewall twee uitzonderingen toe: <code>csmcpforj_oauth</code>, en <code>api\/index\.php\/v1\/mcp</code> als reguliere expressie (de eerste is voor het aanmelden). Sta in de andere plugins <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> en URL's met <code>csmcpforj_oauth</code> toe. Om de oorzaak te bevestigen, schakel je de beveiligingsplugin even uit, probeer je het opnieuw en schakel je hem daarna weer in met de uitzonderingen erbij. De knop <strong>Verbinding controleren</strong> op het dashboard laat zien welk adres wordt geblokkeerd."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="De knop &ldquo;Edit Config&rdquo; van Claude Desktop doet niets als ik erop klik"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Die knop probeert <code>claude_desktop_config.json</code> door te geven aan het programma waarmee je computer <code>.json</code>-bestanden opent. Heb je dat niet ingesteld, dan doet de knop zonder melding niets. Oplossing: open het bestand zelf met een willekeurige teksteditor. De paden per besturingssysteem staan in het Claude-gedeelte onder Geavanceerd hierboven. Bestaat het bestand nog niet, maak het dan aan en gebruik het fragment uit dat gedeelte als volledige inhoud (verpak het fragment als <code>{&quot;mcpServers&quot;: { ... }}</code>). Er zijn geen rechten nodig &mdash; het bestand staat in je eigen gebruikersmap."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="Het dialoogvenster &ldquo;Add custom connector&rdquo; van Claude of &ldquo;Add custom MCP server&rdquo; van ChatGPT heeft geen veld voor de API-sleutel"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Die dialoogvensters zijn gemaakt om te verbinden door aan te melden (OAuth); er is geen plek om een API-sleutel van MCP for J te plakken. Op deze site staat OAuth-aanmelding uit. Een Super User kan het inschakelen onder Componenten &rarr; MCP for J &rarr; Opties &rarr; <strong>OAuth-aanmelding</strong>, en dan werken beide dialoogvensters. Tot die tijd: Claude Desktop kan de wrapper-scriptmethode hierboven gebruiken, claude.ai de makkelijke installatie en ChatGPT-gebruikers Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop toont bij het opstarten &ldquo;Some MCP servers could not be loaded&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (aug. 2026) controleert het configuratiebestand strenger en weigert nu items waarvan de opdrachtargumenten eruitzien alsof ze inloggegevens bevatten. Daardoor werken de twee voor de hand liggende manieren niet om een MCP-server met een bearer-token rechtstreeks in <code>claude_desktop_config.json</code> in te stellen: de ingebouwde vorm <code>type: http</code> EN <code>mcp-remote</code> met een argument <code>--header &quot;Authorization: Bearer ...&quot;</code>. Beide zien er in het configuratiebestand goed uit, maar de schemacontrole van Claude Desktop laat ze bij het laden vallen. <strong>Oplossing:</strong> gebruik de wrapper-scriptmethode uit het Claude-gedeelte onder Geavanceerd hierboven &mdash; zet de hele opdracht in een klein <code>.cmd</code>-bestand en laat de configuratie van Claude Desktop alleen naar dat bestand verwijzen. Claude Desktop ziet een gewone opdracht zonder zichtbare argumenten en accepteert die. Je API-sleutel blijft precies even veilig als voorheen &mdash; het wrapper-bestand staat in je eigen gebruikersmap."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Ik heb Claude Desktop opnieuw gestart, maar het ziet de nieuwe verbinding nog steeds niet"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="In Windows wordt het venster van Claude Desktop bij sluiten alleen naar het systeemvak verplaatst &mdash; de hele app blijft draaien met de OUDE configuratie in het geheugen. Klik je later op het pictogram in de taakbalk, dan komt het venster gewoon terug uit dat al draaiende proces. Claude Desktop leest het configuratiebestand alleen opnieuw bij een echte herstart van de app. Zo start je echt opnieuw: klik met de rechtermuisknop op het Claude-pictogram in het systeemvak (rechtsonder, misschien moet je op het pijltje omhoog klikken om verborgen pictogrammen te zien) &rarr; kies <strong>Quit</strong> &rarr; wacht ongeveer 3 seconden tot het proces helemaal is gestopt &rarr; start Claude Desktop opnieuw vanuit het Startmenu. Pas dan worden je wijzigingen in het configuratiebestand actief."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Veelgestelde vragen"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Kan iemand deze verbinding gebruiken zonder API-sleutel?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="Nee. Elk verzoek moet een geldige API-sleutel bevatten, of een OAuth-toegangstoken als OAuth-aanmelding is ingeschakeld. Verzoeken zonder worden geweigerd. Dat is zo bedoeld &mdash; de AI kan echte acties op je site uitvoeren (artikelen aanmaken, gebruikers bewerken enz.), dus anonieme toegang zou een beveiligingsramp zijn."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Kan één Joomla-gebruiker meerdere actieve API-sleutels hebben?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="Nee. Joomla bewaart precies één API-sleutel per gebruiker. Klikken op Herstellen maakt een nieuwe aan en maakt de oude ongeldig. Heb je meerdere sleutels nodig (één per apparaat, één per AI-tool enz.), maak dan aparte Joomla-gebruikers aan."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Is er een grens aan hoeveel ik het kan gebruiken?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="MCP for J zelf heeft geen limiet. De gewone hostinglimieten (PHP-geheugen, MariaDB-verbindingen enz.) gelden wel. Zorg je voor veel verkeer (grote batchbewerkingen over veel sites), overleg dan met je hostingprovider over het verhogen van de gelijktijdigheid van PHP-FPM."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Moet ik firewallpoorten openen of iets bijzonders instellen?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="Nee. MCP gebruikt gewoon standaard HTTPS op poort 443. Als je site al openbaar bereikbaar is op <code>https://yoursite.com/</code>, is het MCP-endpoint vanuit elke AI-client op internet bereikbaar, zonder extra instellingen."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="Hoe vervang ik mijn API-sleutel regelmatig?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Er is geen automatische planning &mdash; je vervangt hem handmatig wanneer je wilt. Ga naar Gebruikers &rarr; de gebruiker &rarr; tabblad Joomla API token &rarr; klik op Herstellen. Werk daarna de configuratie van de AI-client bij met de nieuwe sleutel. Goede gewoonte: vervang elke sleutel die ooit in een schermafbeelding, logboek of foutrapport is verschenen."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Ik gebruik een AI-client die hierboven niet staat &mdash; werkt die?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Vrijwel zeker wel, zolang hij standaard MCP via HTTPS ondersteunt en je een eigen Authorization-header laat toevoegen of zich met OAuth kan aanmelden (schakel OAuth-aanmelding in bij Opties). De URL is overal hetzelfde &mdash; alleen het instellingenscherm van de client verschilt. Clients waarvan we weten dat ze werken, maar waarvoor we nog geen stapsgewijze uitleg hebben geschreven: Continue.dev, Windsurf, de editor Zed, mcp-cli, MCP Inspector, LibreChat, Open WebUI (via de brug <code>mcpo</code>) en diverse agents op basis van Ollama."

