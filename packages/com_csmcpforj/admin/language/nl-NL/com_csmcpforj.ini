; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Firewall- en URL-extensies"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall is ingeschakeld."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="Het kan MCP-verzoeken blokkeren (&ldquo;403 Access Forbidden &mdash; Malware detected&rdquo;) en ook de aanmelding van claude.ai. Voeg in RSFirewall twee uitzonderingen toe: <code>csmcpforj_oauth</code>, en <code>api\/index\.php\/v1\/mcp</code> als reguliere expressie."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools is ingeschakeld."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="De Web Application Firewall ervan kan MCP-verzoeken en de aanmelding blokkeren. Als <strong>Verbinding controleren</strong> een blokkade toont, zoek de regel dan op in het Blocked Requests Log van Admin Tools en voeg een WAF-uitzondering toe, of schakel die regel uit. Sta <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> en URL's met <code>csmcpforj_oauth</code> toe."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck is ingeschakeld."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="De firewall ervan kan MCP-verzoeken en de aanmelding blokkeren. Als <strong>Verbinding controleren</strong> een blokkade toont, zoek het verzoek dan op in de logboeken ervan en voeg een uitzondering toe voor <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> en URL's met <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 is ingeschakeld."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Deze SEO-extensie kan de aanmeldadressen (<code>index.php?csmcpforj_oauth=&hellip;</code>) onderscheppen en met de homepage antwoorden, waardoor claude.ai of ChatGPT zich niet kan registreren en geen duidelijke reden geeft. Als <strong>Verbinding controleren</strong> de homepage toont voor de aanmeld-endpoints, sluit dan URL's met <code>csmcpforj_oauth</code> uit in Route 66, of schakel de systeemplugin ervan uit."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Ook firewalls van de host kunnen blokkeren: o2switch TigerProtect antwoordt met 503, en regels van Imunify360, ModSecurity of Cloudflare antwoorden met 403. Vraag de host om de adressen hierboven toe te staan, of om de servers van Anthropic door te laten (<code>160.79.104.0/21</code>) voor claude.ai. <strong>Cloudflare</strong>: Browser Integrity Check en Security Level kunnen de servers van de apps blokkeren. Voeg een aangepaste WAF-regel toe (Security &rarr; WAF &rarr; Custom rules) met de actie <strong>Skip</strong> voor verzoeken waarvan het URI-pad <code>/api/index.php/v1/mcp</code> of <code>/.well-known/oauth-</code> bevat, of waarvan de querystring <code>csmcpforj_oauth</code> bevat, en vink <em>Browser Integrity Check</em> en <em>Security Level</em> aan. Bot Fight Mode kan niet met een regel worden overgeslagen, dus zet het uit als het blokkeert."

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Checklist voor claude.ai: &ldquo;cannot register&rdquo;, &ldquo;Authorization failed&rdquo; of &ldquo;Couldn't reach the MCP server&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Loop ze in deze volgorde door. Elk ervan heeft iemand al uren gekost."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Gebruik precies dit adres: <code>%s</code>. Met of zonder <em>www</em> moet overeenkomen met hoe de site antwoordt, <strong>zonder doorsturen</strong> ertussen (van www naar het kale domein, of van http naar https). De knop <strong>Verbinding controleren</strong> op het dashboard meldt een doorsturing."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="OAuth-aanmelding is op deze site ingeschakeld. claude.ai kan alleen verbinden door aan te melden, dus dit moet aan blijven."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>OAuth-aanmelding staat op deze site uit.</strong> claude.ai kan alleen verbinden door aan te melden, dus een Super User moet het eerst inschakelen: Componenten &rarr; MCP for J &rarr; Opties &rarr; <strong>OAuth-aanmelding</strong>. Zolang het uitstaat, meldt claude.ai &ldquo;cannot register&rdquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="Kies in het dialoogvenster <strong>Add custom connector</strong> voor <strong>Sign in now</strong>. Voor de OAuth-client werken <strong>Use Claude's published identity</strong> en <strong>Register automatically</strong> allebei (de gepubliceerde identiteit heeft de curl-extensie van PHP op de server nodig). Laat de client-ID en het secret leeg. Mislukt de ene manier, verwijder de connector dan en voeg hem opnieuw toe met de andere."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>Voeg geen request-headers toe.</strong> claude.ai accepteert geen header <code>X-Joomla-Token</code>, dus een API-sleutel kan daar niet worden gebruikt. Aanmelden is de enige manier om vanuit claude.ai binnen te komen."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Firewalls moeten de servers van claude.ai doorlaten. Die verbinden vanaf <code>160.79.104.0/21</code>, niet vanuit je browser. RSFirewall heeft twee uitzonderingen nodig: <code>csmcpforj_oauth</code>, en <code>api\/index\.php\/v1\/mcp</code> als reguliere expressie. Admin Tools, Securitycheck en firewalls van de host zoals o2switch TigerProtect (die met 503 antwoordt) kunnen het ook blokkeren. <strong>Cloudflare</strong>: Browser Integrity Check en Security Level kunnen de servers van de apps blokkeren. Voeg een aangepaste WAF-regel toe (Security &rarr; WAF &rarr; Custom rules) met de actie <strong>Skip</strong> voor verzoeken waarvan het URI-pad <code>/api/index.php/v1/mcp</code> of <code>/.well-known/oauth-</code> bevat, of waarvan de querystring <code>csmcpforj_oauth</code> bevat, en vink <em>Browser Integrity Check</em> en <em>Security Level</em> aan. Bot Fight Mode kan niet met een regel worden overgeslagen, dus zet het uit als het blokkeert. De knop <strong>Verbinding controleren</strong> op het dashboard laat zien wat er antwoordt."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> en andere SEO-extensies die URL's herschrijven, kunnen de aanmeldadressen (<code>index.php?csmcpforj_oauth=&hellip;</code>) onderscheppen en met de homepage antwoorden, waardoor de app zich niet kan registreren en geen duidelijke reden geeft. Als <strong>Verbinding controleren</strong> de homepage toont voor de aanmeld-endpoints, sluit dan URL's met <code>csmcpforj_oauth</code> uit in die extensie, of schakel de systeemplugin ervan uit."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Meld je aan met een account dat MCP mag gebruiken (zie <em>Wie kan dit endpoint gebruiken?</em> op het dashboard). Mislukt het voor maar één persoon, controleer dan of het account niet is geblokkeerd en niet op <em>Herinstellen wachtwoord verplichten</em> staat."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="Kom je er nog steeds niet uit? Componenten &rarr; MCP for J &rarr; <strong>Logboeken</strong> toont elke stap van het aanmelden, en waarom een stap werd geweigerd."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_JUMP="Ga naar:"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_LOGIN="claude.ai, ChatGPT en andere apps die verbinden door aan te melden"
