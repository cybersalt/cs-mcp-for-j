COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="Cacheduur catalogus (uren)"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="Hoe lang de opgehaalde catalog.json in de cache blijft voordat hij opnieuw wordt opgehaald. De vernieuwknop op de cataloguspagina negeert dit. Bereik 1&ndash;168 (één week)."
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="Niet-beschikbare Pro-add-ons tonen"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Toon Pro-add-ons in de catalogus, ook als je op dit moment geen Pro-lidmaatschap hebt. Handig om te zien wat er is; kies Nee om ze helemaal te verbergen."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Lidmaatschap opnieuw controleren elke (seconden)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="Hoe vaak het dashboard cybersalt.com opnieuw vraagt of het gekoppelde e-mailadres nog Pro-toegang heeft. 86400 = eens per dag (aanbevolen). Minimaal 60, maximaal 604800 = eens per week."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="MCP-server"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Instellingen aan de serverkant voor het MCP-endpoint. Bepalen wat MCP-clients zien en kunnen aanroepen."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Alleen-lezenmodus"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="Bij JA biedt en accepteert het MCP-endpoint alleen tools waarvan de MCP-ToolAnnotations aangeven dat ze alleen lezen (list_*, get_*, read_*, check_*, validate_*, fetch_*, plus joomla_update_healthcheck). Handig als je een AI-client de site wilt laten verkennen zonder dat hij inhoud kan wijzigen. Schrijfacties geven een foutmelding dat de server in alleen-lezenmodus staat. De instelling is een ondergrens: een MCP-client kan ook ?read_only=1 aan de endpoint-URL toevoegen om verder te beperken, maar kan schrijfacties NIET ontgrendelen op een site waar dit op JA staat."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Privacy bij schermopnames"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Instellingen voor het vervagen van geheimen op het dashboard (het Joomla API-token in de promptvoorbeeldweergave, het e-mailadres van het Pro-lidmaatschap). Vervagen staat standaard aan; met deze opties stem je het onthullen bij aanwijzen af, zodat een toevallige muisbeweging het geheim niet per ongeluk laat zien tijdens schermdelen of een schermopname."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Vertraging voor onthullen bij aanwijzen (seconden)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Hoeveel seconden je de muisaanwijzer boven een vervaagd geheim moet houden voordat het zichtbaar wordt. Zolang je de aanwijzer erboven houdt, verschijnt naast het geheim een klein aftellabel, zodat je ziet dat de timer loopt. Beweeg je de muis weg, dan wordt het onthullen geannuleerd en de timer gereset &mdash; de volgende keer begint het aftellen weer helemaal opnieuw. Kies 0 om meteen te onthullen bij aanwijzen (dat haalt de bescherming tegen per ongeluk aanwijzen weg, maar herstelt het klassieke gedrag). Standaard 3 seconden."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Automatisch verbergen na onthullen (seconden)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Hoeveel seconden een geheim dat door aanwijzen is onthuld zichtbaar blijft voordat het automatisch weer vervaagt &mdash; ook als de muis er nog boven staat. Extra zekerheid voor situaties als &ldquo;ik keek even, las het en werd toen afgeleid&rdquo;, waarin een onbeheerde browser het geheim anders onbeperkt zichtbaar zou laten. Als je de muis weghaalt, vervaagt het altijd meteen, ongeacht deze instelling. Kies 0 om automatisch verbergen uit te schakelen (onthulde geheimen blijven zichtbaar tot je de muis weghaalt). Standaard 8 seconden &mdash; lang genoeg om een volledig base64-token rustig te lezen, kort genoeg dat een onbeheerde sessie het geheim niet blootlegt."

