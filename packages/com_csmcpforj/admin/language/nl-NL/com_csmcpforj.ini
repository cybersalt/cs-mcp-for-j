COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Een installatieprompt plakken &mdash; voor een AI-chat die opdrachten kan uitvoeren"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. Configuratiebestand of opdrachtregel &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI en andere"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Werkt in AI-apps die opdrachten kunnen uitvoeren (Codex, Claude Code, Cursor, Cline, de agentmodus van Copilot en vergelijkbare). De AI test de verbinding zelf en kan aanbieden hem blijvend te maken."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="Voor apps die je instelt met een instellingenbestand of een opdracht. Je doet het één keer en het blijft verbonden."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>Haal je API-token op.</strong> Klik op de knop: je gebruikersprofiel opent in een nieuw tabblad. Open daar het tabblad <strong>Joomla API token</strong>, klik op het oogpictogram om het token te tonen en kopieer het. Kom daarna terug naar dit tabblad."
