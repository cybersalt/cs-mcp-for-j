COM_CSMCPFORJ_ACTIONLOG_OAUTH_REVOKE="Gebruiker <a href=&quot;{accountlink}&quot;>{username}</a> heeft de app &ldquo;{title}&rdquo; losgekoppeld van MCP for J (OAuth)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="Verbinden door aan te melden (het makkelijkst)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Geen API-sleutel om te kopiëren. Voeg in je AI-app een connector toe en plak de <strong>endpoint-URL</strong> van deze site (hieronder). Als je op Connect klikt, opent de app zelf de inlogpagina van deze website: meld je aan met je gebruikersnaam en wachtwoord voor deze website en klik daarna op <strong>Toestaan</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai en Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Geef een naam op, plak de endpoint-URL en klik op Continue. Laat <em>Sign in now</em> staan; voor de OAuth-client werken <em>Use Claude's published identity</em> en <em>Register automatically</em> allebei. Voeg geen request-headers toe. Klik op Add en daarna op <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> <strong>Plugins</strong> in de linkerzijbalk &rarr; <strong>Add</strong> (rechtsboven) &rarr; <strong>Add custom MCP server</strong>. Geef een naam op, plak de endpoint-URL, laat Authentication op <strong>OAuth</strong> staan, vink het vakje aan, klik op <strong>Create as a plugin</strong> en daarna op <strong>Connect</strong>. Vereist een betaald ChatGPT-abonnement (Plus werkt)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>, typ daarna <code>/mcp</code>, kies de server en kies <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> Command Palette &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; plak de endpoint-URL. VS Code vraagt je om je aan te melden."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> voeg <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> toe onder <code>mcpServers</code> in <code>mcp.json</code> (zonder headers) en klik daarna op <strong>Login</strong> naast de server in Settings &rarr; MCP."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> voeg <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> toe voor de server in <code>settings.json</code> en voer daarna <code>/mcp auth &lt;name&gt;</code> uit."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Codex opent zelf de inlogpagina (als dat niet gebeurt, voer je <code>codex mcp login joomla</code> uit). Klik binnen een paar minuten op Toestaan, in een browser op dezelfde computer als Codex. Meldt de browser daarna dat 127.0.0.1 de verbinding weigerde, gebruik dan <code>codex mcp login joomla --no-browser</code> en plak het adres van die pagina in de terminal, of blijf de API-sleutelmethode hieronder gebruiken."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, plak de endpoint-URL en klik daarna op <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="Als je op Toestaan klikt, handelt de app als het account waarmee je je hebt aangemeld en kan hij precies wat dat account op deze site kan, inclusief wijzigingen maken als het account dat mag. Administrators en Managers hebben eerst het recht <em>Web services inloggen</em> nodig (zie Rechten op het dashboard). Elke verbonden app staat op het dashboard, waar je hem meteen kunt loskoppelen."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="Liever een API-sleutel, of kan je client geen browser openen? De API-sleutelmethode onder <strong>Geavanceerde installatie</strong> hieronder werkt nog steeds voor elke client."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT (&ldquo;Add custom MCP server&rdquo;) en claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) kunnen alleen verbinden door je naar de inlogpagina van deze website te sturen. Dat staat op deze site uit. Als het aanstaat, is verbinden: plak het adres van deze site in de app, meld je aan, klik op Toestaan."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="Inschakelen bij Opties"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Vraag een Super User om <strong>OAuth-aanmelding</strong> in te schakelen in de opties van MCP for J. Gebruik tot die tijd de API-sleutelmethode hieronder."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="Het makkelijkst: het dialoogvenster &ldquo;Add custom connector&rdquo; van Claude werkt op deze site."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="Aanmelden staat op deze site aan, dus ga in Claude Desktop of claude.ai naar <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, plak het MCP-adres van deze site, klik op Continue, laat de aanmeldinstellingen die het vindt staan, klik op Add en daarna op Connect, meld je aan met je gebruikersnaam en wachtwoord voor deze website en klik op Toestaan. De methode met het configuratiebestand hieronder is alleen nodig als je liever een API-sleutel gebruikt."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai verbindt blijvend via <strong>Add custom connector</strong>: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, plak het MCP-adres van deze site, klik op Continue, laat de aanmeldinstellingen die het vindt staan, klik op Add en daarna op Connect. Meld je aan met je gebruikersnaam en wachtwoord voor deze website en klik op Toestaan. De verbinding blijft in elke chat beschikbaar."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="Klik in ChatGPT op <strong>Plugins</strong> in de linkerzijbalk en daarna op <strong>Add</strong> (rechtsboven) &rarr; <strong>Add custom MCP server</strong>. Geef een naam op (bijvoorbeeld &ldquo;Mijn Joomla-site&rdquo;), plak het MCP-adres van deze site, laat Authentication op <strong>OAuth</strong> staan, vink &ldquo;I understand and want to continue&rdquo; aan en klik op <strong>Create as a plugin</strong>. Klik op <strong>Connect</strong>, en ChatGPT opent de inlogpagina van deze website: meld je aan met je gebruikersnaam en wachtwoord voor deze website en klik op Toestaan. Typ daarna in een chat <strong>@</strong> en kies de plugin. Er is geen API-sleutel om te plakken."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="Het dialoogvenster &ldquo;Add custom connector&rdquo; maakt verbinding, maar het aanmelden mislukt"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Controleer in deze volgorde: (1) het account waarmee je je hebt aangemeld mag MCP gebruiken &mdash; Administrators hebben <em>Web services inloggen</em> nodig, en Managers hebben dat nodig plus <em>MCP-endpoint gebruiken</em> in Opties &rarr; Rechten (zie de kaart <em>Wie kan dit endpoint gebruiken?</em> op het dashboard); de inlogpagina meldt het als dat niet zo is; (2) de kaart &ldquo;AI-apps verbinden door aan te melden&rdquo; op het dashboard zegt <strong>Klaar</strong>; (3) je firewall laat de eigen servers van de app de site bereiken (zie het volgende item). Vul geen client-ID of secret in: de app registreert zichzelf. (4) Klik snel op Toestaan nadat de inlogpagina is geopend: apps geven een aanmelding na een tijdje op (Codex na ongeveer 5 minuten), en een late klik op Toestaan eindigt in een fout. Start Connect opnieuw en het werkt."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai of ChatGPT kan de site niet bereiken, of het aanmelden stopt halverwege"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai en ChatGPT verbinden vanaf hun eigen servers, niet vanuit je browser, dus de site moet bereikbaar zijn via openbare HTTPS. Een webapplicatiefirewall (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360, of een firewall van de host zoals TigerProtect van o2switch, die met 503 antwoordt) kan die verzoeken blokkeren. Sta verzoeken toe naar <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> en <code>index.php?csmcpforj_oauth=&hellip;</code> (de endpoints voor registreren, tokens en intrekken). In RSFirewall zijn deze twee uitzonderingen genoeg: <code>csmcpforj_oauth</code>, en <code>api\/index\.php\/v1\/mcp</code> als reguliere expressie. claude.ai verbindt vanaf <code>160.79.104.0/21</code>. <strong>Cloudflare</strong>: Browser Integrity Check en Security Level kunnen de servers van de apps blokkeren. Voeg een aangepaste WAF-regel toe (Security &rarr; WAF &rarr; Custom rules) met de actie <strong>Skip</strong> voor verzoeken waarvan het URI-pad <code>/api/index.php/v1/mcp</code> of <code>/.well-known/oauth-</code> bevat, of waarvan de querystring <code>csmcpforj_oauth</code> bevat, en vink <em>Browser Integrity Check</em> en <em>Security Level</em> aan. Bot Fight Mode kan niet met een regel worden overgeslagen, dus zet het uit als het blokkeert. <strong>Route 66</strong> en andere SEO-extensies die URL's herschrijven, kunnen de aanmeldadressen (<code>index.php?csmcpforj_oauth=&hellip;</code>) onderscheppen en met de homepage antwoorden, waardoor de app zich niet kan registreren en geen duidelijke reden geeft. Als <strong>Verbinding controleren</strong> de homepage toont voor de aanmeld-endpoints, sluit dan URL's met <code>csmcpforj_oauth</code> uit in die extensie, of schakel de systeemplugin ervan uit. De aanmeldpagina zelf wordt in je eigen browser geopend."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="Het dashboard meldt dat AI-apps de inlogpagina van deze website niet kunnen vinden (Niet klaar)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="AI-clients zoeken de aanmeldgegevens op <code>/.well-known/oauth-authorization-server</code> op je domein. Joomla antwoordt daar alleen als Algemene instellingen &rarr; <strong>Gebruik URL herschrijven</strong> aanstaat en de <code>.htaccess</code> van de site aanwezig is (hernoem <code>htaccess.txt</code>), of als nginx onbekende paden naar <code>index.php</code> stuurt. Dit heeft geen invloed op AutoSSL van cPanel, dat <code>/.well-known/acme-challenge/</code> gebruikt. Een site die in een submap is geïnstalleerd (bijvoorbeeld <code>example.com/joomla</code>) heeft ook een regel in de hoofdmap van het domein nodig die <code>/.well-known/oauth-authorization-server/joomla</code> naar de submap stuurt."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Aanmelden vanaf een server of een machine zonder browser"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Desktopclients (Claude Code, Codex, Cursor, Gemini CLI) openen een browser op dezelfde machine en wachten op het antwoord op een lokaal adres, dus OAuth-aanmelding heeft daar een browser nodig. Gebruik op een server zonder scherm of via SSH de API-sleutelmethode onder Geavanceerde installatie; die werkt overal."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="Voeg in de AI-app een nieuwe connector toe (claude.ai en Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector; ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server) en plak deze <strong>endpoint-URL</strong>: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Klik op Connect.</strong> De app opent zelf de inlogpagina van deze website. Meld je aan met je gebruikersnaam en wachtwoord voor deze website."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Klik op Toestaan.</strong> Je gaat terug naar de app, verbonden. De app kan alles wat jouw account op deze site mag."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Een AI-app met deze site verbinden"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Er zijn drie manieren. Klik op een ervan om de genummerde stappen te openen. De meeste mensen willen de eerste."
