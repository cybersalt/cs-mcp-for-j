COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_BODY="Een firewall blokkeert het verzoek voordat MCP for J het ziet. Klik hierboven op <strong>Verbinding controleren</strong> om te zien welk adres wordt geblokkeerd. Voeg in RSFirewall uitzonderingen toe voor <code>csmcpforj_oauth</code> en <code>api\/index\.php\/v1\/mcp</code> (reguliere expressie). Firewalls van de host (o2switch TigerProtect, Imunify360) moeten dezelfde adressen toestaan. <strong>Cloudflare</strong>: Browser Integrity Check en Security Level kunnen de servers van de apps blokkeren. Voeg een aangepaste WAF-regel toe (Security &rarr; WAF &rarr; Custom rules) met de actie <strong>Skip</strong> voor verzoeken waarvan het URI-pad <code>/api/index.php/v1/mcp</code> of <code>/.well-known/oauth-</code> bevat, of waarvan de querystring <code>csmcpforj_oauth</code> bevat, en vink <em>Browser Integrity Check</em> en <em>Security Level</em> aan. Bot Fight Mode kan niet met een regel worden overgeslagen, dus zet het uit als het blokkeert."
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_CLAUDE_TITLE="claude.ai meldt &ldquo;cannot register&rdquo;, of de autorisatie mislukte"

