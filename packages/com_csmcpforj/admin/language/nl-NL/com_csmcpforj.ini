COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="<strong>Plak hem in een nieuw gesprek</strong> met je AI-app en verstuur. De AI test de verbinding en biedt, als het kan, aan hem blijvend te maken."
