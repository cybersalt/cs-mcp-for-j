COM_CSMCPFORJ_SUPPORT_BANNER_PRO_HEADING="Je hebt een actief Pro-lidmaatschap voor MCP for J &mdash; bedankt!"
COM_CSMCPFORJ_SUPPORT_BANNER_PRO_BODY="Pro-leden krijgen voorrang bij ondersteuning. Je berichten komen bij ons binnen met een Pro-label, zodat we ze als eerste zien en zo snel mogelijk antwoorden. Vraag ons alles &mdash; foutmeldingen, wensen voor nieuwe functies, vragen, ideeën &mdash; alles is welkom."

COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_HEADING="We horen graag van je"
COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_BODY="Stuur ons je foutmeldingen, wensen voor nieuwe functies, vragen en ideeën &mdash; we lezen ze allemaal en waarderen de feedback. Ondersteuning voor de gratis versie is op basis van beste inspanning (onze middelen voor gratis ondersteuning zijn beperkt), dus een antwoord kan even duren. Heb je gegarandeerde reactietijden of voorrang nodig, overweeg dan %seen Pro-lidmaatschap voor MCP for J%s."

COM_CSMCPFORJ_SUPPORT_FORM_HEADING="Stuur ons een bericht"
COM_CSMCPFORJ_SUPPORT_FORM_INTRO="Je bericht gaat rechtstreeks naar <code>support@cybersalt.com</code>. Gegevens over je omgeving (de URL van je site, de versie van MCP for J, de versies van Joomla en PHP, geïnstalleerde add-ons en de status van je Pro-lidmaatschap) worden automatisch meegestuurd, zodat we je sneller kunnen helpen &mdash; de volledige lijst staat in de zijbalk."

