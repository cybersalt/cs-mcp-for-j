; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Wie kan dit endpoint gebruiken?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="Rechten worden gecontroleerd voor het Joomla-gebruikersaccount waartoe het API-token behoort. De MCP-client (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl of iets anders) geeft alleen door &mdash; hetzelfde token gedraagt zich vanuit elke client precies hetzelfde."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Belangrijk:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Wie het token aanmaakt, krijgt via het MCP-endpoint dezelfde toegang als overal elders in het Joomla-beheer. Maak alleen tokens aan voor gebruikers die je die acties ook rechtstreeks zou toevertrouwen."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Joomla-gebruikersgroep"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Werkt direct?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Waarom"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Ja"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Expliciete toestemming nodig"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Super Users slagen in Joomla altijd voor elke rechtencontrole."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Heeft core.manage via de standaardrechten van Joomla, wat de MCP-controle accepteert voor lees- en schrijftools (de tools die rechten, extensies, plugininstellingen of Joomla zelf wijzigen, vereisen nog steeds een Super User) &mdash; maar de groep heeft nog steeds <strong>Web services inloggen</strong> nodig voordat Joomla authenticatie überhaupt toestaat."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="Heeft standaard geen MCP-rechten. Geef de groep <strong>Web services inloggen</strong> onder Systeem &rarr; Algemene instellingen &rarr; Rechten, en daarna MCP-endpoint gebruiken en (optioneel) Schrijven via MCP-endpoint in de <strong>Opties &rarr; Rechten</strong> van deze component."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Heeft Web services inloggen nodig"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Voordat dit van toepassing is:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla schermt de hele API af met een apart recht, <strong>Web services inloggen</strong> (<code>core.login.api</code>), en <strong>standaard hebben alleen Super Users dat</strong>. Elke andere groep &mdash; ook Administrator en Manager &mdash; krijgt <code>403 Forbidden</code> van elke tool totdat je het toekent, wat ze verder ook in het beheer mogen. Stel het in onder <strong>Systeem &rarr; Algemene instellingen &rarr; Rechten</strong>, op de groep, niet op deze component."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / eigen groep"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Geef de groep <strong>Web services inloggen</strong> onder Systeem &rarr; Algemene instellingen &rarr; Rechten, en daarna MCP-endpoint gebruiken en (optioneel) Schrijven via MCP-endpoint in de <strong>Opties &rarr; Rechten</strong> van deze component."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Een AI-assistent met deze site verbinden"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Er zijn twee manieren. De eerste (een prompt kopiëren en plakken) is het makkelijkst &mdash; hij werkt zonder clientconfiguratie, en nadat je AI heeft bevestigd dat het werkt, biedt hij meestal aan deze site als vaste connector te installeren, zonder handmatig JSON te bewerken. De tweede is voor wie de clientconfiguratie liever zelf bewerkt."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Een installatieprompt kopiëren (aanbevolen)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Plak een installatieprompt in je AI-assistent"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Geen clientconfiguratie nodig. Kopieer de prompt hieronder naar een nieuw gesprek met je AI-assistent (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini enz.). De AI voert een test-curl uit, bevestigt de verbinding en biedt &mdash; bij clients die dat ondersteunen &mdash; aan de verbinding blijvend te maken, zonder JSON-bestanden te bewerken en zonder terminalopdrachten te onthouden."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Extra:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Als je AI-client een shell-tool heeft (Codex, Claude Code, Cursor Composer, Cline, Continue, de agentmodus van GitHub Copilot enz.), bevat de prompt een aanbod om zichzelf te installeren. Zeg gewoon &lsquo;maak het blijvend&rsquo; nadat de AI heeft bevestigd dat de verbinding werkt, en hij voert de juiste opdracht voor de client uit om de MCP-server te registreren (bijvoorbeeld <code>codex mcp add</code> of <code>claude mcp add</code>). Na een herstart van de client verschijnt deze site als ingebouwde MCP-tools in elk gesprek &mdash; nooit meer een prompt nodig."
; Shared "type here" field pattern - see FieldStyleHelper.
COM_CSMCPFORJ_FIELD_OPTIONAL="Optioneel"
COM_CSMCPFORJ_FIELD_REQUIRED="Verplicht"

COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Maak een Joomla API-token aan in Mijn profiel (link rechts)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Klik hieronder op &lsquo;Prompt kopiëren&rsquo;."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Plak hem in een nieuw gesprek met je AI-assistent. Als je stap 2 hebt overgeslagen, vervang dan eerst <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> door je echte token."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Verstuur hem. De AI test de verbinding en biedt, bij clients die dat ondersteunen, aan de verbinding blijvend te maken."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Deze prompt werkt in elke AI-client met een shell- of terminaltool: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (agentmodus), Gemini CLI, Windsurf, mcp-cli enz. Hij werkt niet in chatomgevingen die alleen in de browser draaien (claude.ai, chatgpt.com, gemini.google.com) en geen shelltoegang hebben &mdash; gebruik daarvoor het tabblad MCP-connector."

; Tab 2 — manual MCP connector configuration
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="MCP-connector (handmatige configuratie)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="Handmatig toevoegen als MCP-connector"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="Voor Claude Desktop (configuratiebestand), Claude Code, Cursor, Codex, Cline, Copilot, Gemini CLI of elke client waarbij je de configuratie liever rechtstreeks bewerkt. Eenmalig instellen, blijvend voor alle gesprekken. (Aangepaste connectors van claude.ai en ChatGPT kunnen geen API-sleutel meesturen: zij verbinden door aan te melden. Zie <strong>Verbinden door aan te melden (OAuth)</strong> op deze pagina.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="Maak een Joomla API-token aan in Mijn profiel."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="Kopieer het configuratiefragment hieronder."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP3="Vervang <code>YOUR_JOOMLA_API_TOKEN</code> door het token dat je hebt aangemaakt."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Plak het in de MCP-configuratie van je AI-client &mdash; Claude Desktop: <code>claude_desktop_config.json</code>; Claude Code: <code>claude mcp add</code>; Cursor: <code>~/.cursor/mcp.json</code>; GitHub Copilot: MCP-instellingen in VS Code / JetBrains; Cline / Continue: JSON-instellingen van de extensie. Start de client opnieuw na het opslaan. (De dialoogvensters &ldquo;Add custom connector&rdquo; van claude.ai en ChatGPT hebben hier geen veld voor; gebruik daar OAuth-aanmelding.)"
