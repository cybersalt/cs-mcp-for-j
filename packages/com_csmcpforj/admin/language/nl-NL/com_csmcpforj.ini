COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="OAuth-aanmelding"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Laat AI-apps verbinden door je naar de inlogpagina van deze website te sturen, in plaats van dat je er een API-sleutel in kopieert. ChatGPT (&ldquo;Add custom MCP server&rdquo;) en claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) kunnen alleen op deze manier verbinden. Verbindingen met een API-sleutel blijven hoe dan ook werken."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="OAuth-aanmelding inschakelen"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Als dit aanstaat, plak je het MCP-adres van deze site in een AI-app, opent de app de inlogpagina van deze website, meld je je aan met je gewone gebruikersnaam en wachtwoord en klik je op Toestaan. De app handelt dan als jij, met precies jouw rechten op deze site. Verbonden apps staan op het dashboard, waar je elke verbinding kunt verbreken. Zet je dit uit, dan worden ze allemaal meteen losgekoppeld."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Geldigheid van het toegangstoken (seconden)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Hoe lang elk toegangstoken geldig is voordat de app het ongemerkt vernieuwt. Standaard 3600 (één uur). Tussen 300 en 86400."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Aangemeld blijven (dagen)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Hoe lang een app mag blijven vernieuwen zonder dat de gebruiker zich opnieuw aanmeldt. Elke vernieuwing zet de klok terug. Standaard 30."
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="AI-apps verbinden door aan te melden"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="Sommige AI-apps, waaronder ChatGPT en claude.ai, kunnen alleen met een website verbinden door je naar de inlogpagina van die website te sturen. Dat staat op deze site uit, dus die apps kunnen nog niet verbinden. Schakel <strong>OAuth-aanmelding</strong> in bij Opties om het toe te staan. Verbindingen met een API-sleutel blijven hoe dan ook werken."
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="Opties openen om het in te schakelen"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="Geen API-sleutel nodig. Het enige wat je kopieert, is de <strong>endpoint-URL</strong> van deze site."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="Controleren of AI-apps de inlogpagina van deze website kunnen vinden&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>Klaar.</strong> AI-apps kunnen de inlogpagina van deze website vinden."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>Niet klaar.</strong> AI-apps kunnen de inlogpagina van deze website niet vinden en kunnen dus geen verbinding maken. Om dit op te lossen, zet je <strong>Gebruik URL herschrijven</strong> aan onder Systeem &rarr; Algemene instellingen en zorg je dat het .htaccess-bestand van de site aanwezig is. Het gedeelte Problemen oplossen in de installatiegids heeft de details."
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_HEADING="Verbonden apps"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_NONE="Er zijn nog geen AI-apps verbonden. Een app verschijnt hier nadat iemand zich heeft aangemeld en op Toestaan heeft geklikt."
