COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Genera un token API di Joomla in Il mio profilo (link a destra)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Clicca su &lsquo;Copia prompt&rsquo; qui sotto."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Incollalo in una nuova conversazione con il tuo assistente di IA. Se hai saltato il passo 2, sostituisci prima <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> con il tuo token reale."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Invia. L'IA testerà la connessione e, sui client che lo supportano, si offrirà di renderla permanente."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Questo prompt funziona in qualsiasi client di IA con uno strumento shell o terminale: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (modalità agente), Gemini CLI, Windsurf, mcp-cli, ecc. Non funziona nelle chat solo web (claude.ai, chatgpt.com, gemini.google.com) prive di accesso alla shell &mdash; per quelle, usa la scheda Connettore MCP."

