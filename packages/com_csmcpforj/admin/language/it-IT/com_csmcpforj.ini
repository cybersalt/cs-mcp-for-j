COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="Accesso OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Permette alle app di IA di collegarsi mandandoti alla pagina di accesso di questo sito, invece di farti copiare in esse una chiave API. ChatGPT (&ldquo;Add custom MCP server&rdquo;) e claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) possono collegarsi solo così. Le connessioni con chiave API continuano a funzionare in ogni caso."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="Attiva l'accesso OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Quando è attivo, incolli l'indirizzo MCP di questo sito in un'app di IA, l'app apre la pagina di accesso di questo sito, accedi con il tuo solito nome utente e password e clicchi su Consenti. Da quel momento l'app agisce come te, con esattamente i tuoi permessi su questo sito. Le app collegate sono elencate nel pannello di controllo, dove ognuna può essere scollegata. Disattivando questa opzione vengono scollegate tutte immediatamente."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Durata del token di accesso (secondi)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Quanto dura ogni token di accesso prima che l'app lo rinnovi in silenzio. Predefinito 3600 (un'ora). Tra 300 e 86400."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Resta collegato per (giorni)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Per quanto tempo un'app può continuare a rinnovare senza che l'utente rifaccia l'accesso. Ogni rinnovo azzera il conteggio. Predefinito 30."
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="Collega le app di IA con l'accesso"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="Alcune app di IA, tra cui ChatGPT e claude.ai, possono collegarsi a un sito solo mandandoti alla pagina di accesso di quel sito. Su questo sito è disattivato, quindi quelle app non possono ancora collegarsi. Attiva l'<strong>accesso OAuth</strong> nelle Opzioni per consentirlo. Le connessioni con chiave API continuano a funzionare in ogni caso."
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="Apri le Opzioni per attivarlo"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="Nessuna chiave API necessaria. L'unica cosa da copiare è l'<strong>URL dell'endpoint</strong> di questo sito."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="Verifica che le app di IA trovino la pagina di accesso di questo sito&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>Pronto.</strong> Le app di IA trovano la pagina di accesso di questo sito."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>Non pronto.</strong> Le app di IA non trovano la pagina di accesso di questo sito, quindi non potranno collegarsi. Per risolvere, attiva <strong>Riscrivi URL SEF</strong> in Sistema &rarr; Configurazione globale e verifica che il file .htaccess del sito sia presente. La sezione Risoluzione dei problemi della guida alla configurazione ha i dettagli."
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_HEADING="App collegate"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_NONE="Ancora nessuna app di IA collegata. Un'app compare qui dopo che qualcuno ha effettuato l'accesso e cliccato su Consenti."
