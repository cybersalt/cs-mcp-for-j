; ============================================================
; Setup Guide view (v2.4.1 — restructured 2026-08-13 to lead with
; the Dashboard easy-way method and push technical / config-file
; setup into a collapsed Advanced section. Non-technical audience.)
; ============================================================

COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="Guida alla configurazione"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="Guida alla configurazione"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for J — Guida alla configurazione"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Collega un'IA a questo sito Joomla"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="MCP for J è pensato per rendere facile collegare un assistente di IA come Codex, Claude, ChatGPT o Cursor al tuo sito Joomla &mdash; così l'IA può leggere i tuoi articoli, gestire gli utenti, pubblicare contenuti e altro, tutto dalla normale chat dell'IA. Non serve essere esperti. Il metodo facile qui sotto va bene per la maggior parte delle persone; scorri in basso per le opzioni avanzate se ti servono."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ Il modo facile"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Niente file di configurazione. Niente intestazioni. Niente gergo. Copia un prompt di configurazione già pronto dal pannello di controllo e incollalo in una nuova chat con la tua IA. Il resto lo fa l'IA &mdash; testa la connessione e, sui client che lo supportano, si offre di salvarla in modo permanente per te."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Ottieni la tua chiave API</strong> (una password personale che permette alla tua IA di agire su questo sito). Le istruzioni sono qui sotto se non ne hai ancora una."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Vai al pannello di controllo</strong> (pulsante qui sotto) e incolla lì la tua chiave API nel campo apposito."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Clicca sul pulsante &ldquo;Copia prompt&rdquo;</strong> nel pannello di controllo. La tua chiave viene inserita automaticamente nel prompt prima della copia."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Incollalo in una nuova chat</strong> con la tua IA (Claude, ChatGPT, Cursor, Copilot, Gemini, ecc.) e invia. L'IA confermerà che la connessione funziona e si offrirà di salvarla."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Vai al pannello di controllo"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="Fatto. La tua IA è collegata. Se vuoi sapere di più su come funziona il tutto, o preferisci configurare la tua IA a mano, continua a leggere qui sotto &mdash; ma non è necessario."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Ottieni la tua chiave API"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="Una <strong>chiave API</strong> è una password personale che permette alla tua IA di agire su questo sito Joomla come TE. Chiunque abbia la chiave può fare tutto ciò che può fare il tuo account utente Joomla &mdash; quindi tienila riservata. Ecco come generarne una:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sClicca qui per aprire il tuo profilo utente Joomla%s. Si apre in una nuova scheda. Lì cerca la scheda chiamata <strong>Token API di Joomla</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="In quella scheda clicca sul pulsante <strong>Resetta</strong>. Joomla genera una lunga sequenza di lettere e numeri e la inserisce nel campo sotto il pulsante. Quella è la tua chiave."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Clicca sulla piccola <strong>icona dell'occhio</strong> accanto al campo per mostrare la chiave, poi copia l'intera sequenza."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Incollala nel campo qui sotto in questa pagina (viene salvata solo nel tuo browser, così i pulsanti di copia di questa pagina possono inserirla da soli), OPPURE incollala direttamente nel campo della chiave API del pannello di controllo se stai andando lì per la configurazione facile."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Tratta questa chiave come una password."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Non incollarla in documenti condivisi, screenshot o codice che pubblicherai. Se dovesse mai trapelare, torna alla scheda Token API di Joomla e clicca di nuovo su Resetta &mdash; la vecchia chiave smette subito di essere valida."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Incolla qui la tua chiave API (per copiare con un clic in questa pagina)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>La tua chiave viene ricordata solo in questo browser</strong> &mdash; non lascia mai il tuo computer. Usa il pulsante cestino per dimenticarla. Se lasci il campo vuoto, i pulsanti di copia di questa pagina funzionano comunque, ma dovrai incollare la chiave a mano nel frammento copiato."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Mostra/nascondi la chiave"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Dimentica la chiave salvata"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Avanzato: collega un'IA manualmente (la maggior parte delle persone non ne ha bisogno)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Questa sezione è per chi vuole configurare a mano la connessione del proprio client di IA a questo sito &mdash; di solito modificando un piccolo file di testo chiamato &ldquo;file di configurazione&rdquo;. Se la configurazione facile qui sopra ha funzionato, puoi ignorare tranquillamente tutta questa sezione. Se vuoi saltare il prompt di configurazione e registrare la connessione direttamente nel tuo client di IA, continua a leggere."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="L'URL di connessione di questo sito"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="È l'indirizzo che serve al tuo client di IA. Lo incollerai nella configurazione del client insieme alla tua chiave API."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Scegli il tuo client di IA"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="L'URL di connessione e la chiave API sono le stesse per ogni IA &mdash; cambia solo <em>dove le incolli</em> a seconda del client. Scegli qui sotto il tuo client per le istruzioni specifiche."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, estensione per IDE o app desktop)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Codex supporta questo endpoint in modo nativo come server MCP Streamable HTTP. Salva prima la chiave API di Joomla in una variabile d'ambiente dedicata a questo sito, poi registra l'endpoint con il nome di quella variabile. La chiave non viene mai scritta in <code>config.toml</code>. Se usi il pulsante di copia dopo aver incollato una chiave qui sopra, il comando d'ambiente copiato contiene quella chiave; tienilo quindi lontano da terminali condivisi, registrazioni e richieste di assistenza."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; salva la chiave per i futuri processi di Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Apri un nuovo terminale dopo aver impostato una variabile d'ambiente permanente di Windows. I processi di Codex e del terminale già aperti non la vedono."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; imposta la chiave per questo terminale (salvala nel tuo ambiente shell sicuro se serve che resti)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Registra questo sito Joomla in Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Esegui <code>codex mcp list</code>, riavvia Codex (o controlla lo stato MCP nella sua interfaccia), poi chiama l'innocuo strumento di sola lettura <code>get_joomla_version</code>. Così verifichi inizializzazione, autenticazione, rilevamento degli strumenti e chiamata. Per una connessione di sola lettura, attiva anche la modalità sola lettura lato server di MCP for J; le impostazioni di approvazione del client non possono scavalcare i permessi del server."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Token non valido su cPanel o PHP-FPM?"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Il server web potrebbe eliminare l'intestazione standard Authorization. Sostituisci la voce creata sopra in <code>~/.codex/config.toml</code> con questo blocco, così Codex legge la stessa variabile d'ambiente e la invia come <code>X-Joomla-Token</code>, poi riavvia Codex."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Attenzione &mdash; la finestra &ldquo;Add custom connector&rdquo; di Claude richiede OAuth, che su questo sito è disattivato."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="La finestra integrata &ldquo;Add custom connector&rdquo; di Claude Desktop e claude.ai si collega tramite accesso (OAuth) e non ha un campo per la chiave API. Un Super User può attivare l'accesso OAuth nelle opzioni di MCP for J; dopo di che quella finestra funziona. Fino ad allora, le istruzioni per Claude Desktop qui sotto usano una modifica al file di configurazione. (Oppure usa la configurazione facile qui sopra &mdash; funziona anche con Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Quattro passi: crea un piccolo file di supporto, uno &ldquo;script wrapper&rdquo;, che contiene il comando di connessione; fai puntare a esso il file di configurazione di Claude Desktop; poi riavvia Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Perché uno script wrapper invece di mettere la connessione direttamente nella configurazione di Claude Desktop? Claude Desktop 1.30096+ (ago. 2026) rifiuta le voci di configurazione i cui argomenti sembrano contenere credenziali &mdash; una misura di sicurezza ben intenzionata che purtroppo blocca il metodo diretto. Spostare il comando in un piccolo file di supporto aggira il problema (Claude Desktop vede solo un comando semplice senza argomenti visibili) e la tua chiave API resta sicura esattamente come prima &mdash; il file di supporto si trova nella tua cartella utente, accanto alla configurazione di Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Prerequisito una tantum &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Queste istruzioni presuppongono che Node.js sia installato sul tuo computer (include un comando chiamato <code>npx</code>). La maggior parte degli ambienti di sviluppo ce l'ha già; altrimenti installalo da <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> con l'installer LTS. Il file wrapper qui sotto si aspetta Node.js nel percorso di installazione standard di Windows, <code>C:\Program Files\nodejs\</code>. Se l'hai installato altrove, modifica quel percorso nel file wrapper dopo averlo copiato."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Passo 1 &mdash; crea lo script wrapper"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Per ora solo Windows (utenti Mac/Linux: vedere le FAQ). Copia il blocco qui sotto in un nuovo file di testo. Salvalo nella tua cartella utente (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) con il nome <code>claude-mcp-joomla-{sitename}.cmd</code>, sostituendo <code>{sitename}</code> con un'etichetta breve per il tuo sito (es. <code>cybersaltorg</code>). Assicurati che <code>.cmd</code> sia davvero l'estensione e non parte del nome &mdash; nel Blocco note scegli &ldquo;Salva come: Tutti i file&rdquo; così non aggiunge <code>.txt</code>. Se hai incollato la tua chiave API nel campo in cima a questa pagina, il pulsante di copia la inserisce per te."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Non sai qual è il tuo nome utente di Windows? Apri Esplora file, vai in <code>C:\Users\</code> e guarda i nomi delle cartelle &mdash; una è la tua."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Passo 2 &mdash; apri il file di configurazione di Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Il file delle impostazioni di Claude Desktop si trova in un percorso fisso a seconda del sistema operativo. Aprilo con un qualsiasi editor di testo (VS Code, Blocco note, TextEdit, Sublime, quello che hai):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Claude Desktop ha un pulsante in Settings &rarr; Developer &rarr; <strong>Edit Config</strong> che dovrebbe aprire il file per te. Se cliccando non succede nulla, è perché il tuo computer non sa con quale programma aprire i file <code>.json</code>. Nessun problema &mdash; apri il file da solo con un editor di testo usando uno dei percorsi qui sopra. Se il file non esiste ancora, crealo e usa il blocco qui sotto come contenuto completo (racchiuso in <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Passo 3 &mdash; aggiungi questo blocco alla configurazione di Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Incolla questo in <code>claude_desktop_config.json</code>. Se il file ha già un oggetto <code>mcpServers</code> con altri server, aggiungi la voce <code>joomla-...</code> accanto a loro (non incollare un secondo oggetto <code>mcpServers</code>). Se il file è vuoto o non esiste, usa tutto il blocco qui sotto come contenuto. <strong>Importante:</strong> sostituisci <code>YOUR_WINDOWS_USERNAME</code> con il tuo vero nome utente di Windows."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Questa configurazione fa solo puntare Claude Desktop allo script wrapper che hai creato nel passo 1. La tua chiave API resta nel file wrapper, non nella configurazione di Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Passo 4 &mdash; chiudi completamente Claude Desktop e riaprilo"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Claude Desktop legge il file di configurazione solo all'avvio. Chiudilo completamente &mdash; su Windows, clicca con il tasto destro sull'icona di Claude nell'area di notifica (in basso a destra; potresti dover prima cliccare sulla piccola freccia verso l'alto) e scegli Quit. Aspetta un paio di secondi, poi riavvialo. In una qualsiasi conversazione, clicca sull'icona degli strumenti (o chiedi &ldquo;quali strumenti hai?&rdquo;) &mdash; dovrebbero comparire gli strumenti del sito. Altrimenti, vedi Risoluzione dei problemi qui sotto."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (terminale o VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Se usi Claude Code, un solo comando da terminale crea la connessione &mdash; senza modificare file di configurazione. Incolla la tua chiave API nel campo qui sopra perché il pulsante di copia qui sotto la inserisca, poi incolla il comando in un terminale e premi Invio. Claude Code conferma subito la connessione e si ricarica."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (la versione web)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="La finestra <strong>Add custom connector</strong> di claude.ai si collega tramite accesso (OAuth), che su questo sito è disattivato. Un Super User può attivarlo nelle opzioni di MCP for J, e allora claude.ai ottiene una connessione permanente. Fino ad allora, la configurazione facile qui sopra (incollare un prompt) vale solo per la chat corrente."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Cursor salva le sue connessioni MCP in un file di configurazione chiamato <code>mcp.json</code>. Aprilo in un editor di testo, incolla il blocco qui sotto nell'oggetto <code>mcpServers</code> e salva. Nella maggior parte dei casi Cursor applica la modifica senza riavvio."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Posizione del file di configurazione: <code>~/.cursor/mcp.json</code> (per tutti i tuoi progetti) o <code>.cursor/mcp.json</code> in una specifica cartella di progetto (solo per quel progetto)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Server MCP personalizzati in ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="La finestra <strong>Add custom MCP server</strong> di ChatGPT può collegarsi solo tramite accesso (OAuth) o senza autenticazione; non ha un campo per una chiave API o un'intestazione. Su questo sito l'accesso OAuth è disattivato, quindi ChatGPT non può ancora collegarsi. Un Super User può attivarlo nelle opzioni di MCP for J. Fino ad allora usa Codex (l'agente di programmazione di OpenAI), che invia la chiave API da una variabile d'ambiente."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Per aggiungere un server MCP personalizzato serve un piano ChatGPT a pagamento. Funziona con Plus (verificato a ottobre 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI e Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Sia Gemini CLI (l'assistente di IA di Google per il terminale) sia l'estensione Gemini Code Assist (per VS Code / JetBrains) leggono lo stesso file di configurazione MCP. Due passi: modifica quel file per aggiungere questo sito Joomla come server MCP, poi riavvia Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Puoi aggiungere il server a livello globale (lo vede ogni sessione di Gemini) o solo dentro una cartella di progetto. Il frammento è identico &mdash; cambia solo la posizione del file."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Apri (o crea) il file delle impostazioni di Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Scegli una di queste due posizioni:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Globale (tutti i progetti):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Solo progetto:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (in una cartella di progetto)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Incolla questo blocco nel file."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Se il file ha già una sezione <code>mcpServers</code>, aggiungi la voce <code>&quot;joomla-...&quot;</code> dentro quella esistente &mdash; non duplicare la chiave esterna <code>mcpServers</code>. Se il file è vuoto o nuovo, incolla l'intero frammento così com'è."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Gemini usa <code>httpUrl</code> per i server MCP via HTTP (come questo) &mdash; è diverso dalla chiave <code>url</code> di Cursor. Copia esattamente questo frammento invece di riutilizzare quello di Cursor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Riavvia Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Chiudi e riapri <code>gemini</code> nel terminale, oppure ricarica la finestra di VS Code / JetBrains. Digita <code>/mcp</code> in Gemini CLI per vedere i server collegati e controllare che il tuo sito Joomla sia nell'elenco."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="L'app web <code>gemini.google.com</code> non supporta i server MCP personalizzati ad agosto 2026 &mdash; questa guida copre solo Gemini CLI e Gemini Code Assist. Se Google aggiungerà il supporto nell'interfaccia web, lo documenteremo qui."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Funzionano anche altri client di IA compatibili con MCP (Cline, Continue, GitHub Copilot in modalità agente, Windsurf, mcp-cli, ecc.) &mdash; l'URL di connessione e la chiave API sono identici, cambia solo il punto preciso in cui incollarli. Aggiungeremo col tempo guide per altri client; se sei bloccato, le FAQ qui sotto danno indicazioni generali."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Copia"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Copiato"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Copiato (con la tua chiave)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Sicurezza e condivisione"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="La tua chiave API È l'accesso &mdash; chi la possiede può fare tutto ciò che può fare il tuo account utente Joomla. Non esiste un accesso anonimo. Se attivi l'<strong>accesso OAuth</strong>, un'app di IA può anche collegarsi mandandoti alla normale pagina di accesso di questo sito; poi agisce come l'account che ha effettuato l'accesso, con esattamente i suoi permessi, finché non la scolleghi dal pannello di controllo."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Dare accesso MCP ad altre persone"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Ci sono due modi &mdash; scegli quello che fa per te:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Una chiave per persona (il più sicuro)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Crea un utente Joomla per ogni persona, mettilo in un gruppo con solo i permessi che vuoi dargli (es. sola lettura), genera una chiave per quell'utente e inviagliela in privato. Ogni persona lascia la propria traccia nei registri; puoi revocare una singola chiave senza toccare le altre."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Una chiave condivisa (il più semplice, ma il meno sicuro)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Crea un utente limitato (es. <code>mcp-demo-guest</code>) in un gruppo di sola lettura, genera una chiave e condividila più ampiamente. Più semplice da distribuire; più difficile sapere chi la usa o togliere l'accesso a una sola persona. Va bene per una demo pubblica; non per accessi sensibili."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Revocare una chiave"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="Per far smettere subito di funzionare una chiave esistente, vai in Utenti &rarr; l'utente in questione &rarr; scheda Token API di Joomla &rarr; clicca su <strong>Resetta</strong>. La vecchia chiave smette di essere valida nel momento del clic. Dai la nuova chiave a quella persona oppure lasciala senza accesso."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Risoluzione dei problemi"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Trova il tipo di app che stai collegando, poi apri il problema che corrisponde a ciò che vedi. Messaggi di errore e blocchi del firewall possono comparire in qualsiasi app, quindi hanno un gruppo a parte alla fine."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; o &ldquo;Authentication failed&rdquo; (errore 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="La tua IA raggiunge il sito, ma la chiave API non è giusta. Controlla: (1) che la chiave non sia stata resettata da quando l'hai copiata (ogni reset rende non valida la chiave precedente); (2) che sia stata copiata per intero, senza caratteri mancanti o spazi in più; (3) se hai modificato un file di configurazione, che la parola <code>Bearer </code> (seguita da uno spazio) preceda la chiave. Nel dubbio, genera una nuova chiave e riprova."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; o &ldquo;Could not match accept header&rdquo; (errore 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Le versioni più vecchie di MCP for J (prima della 2.3.4) avevano un bug che impediva ad alcuni client di IA di collegarsi. Aggiorna MCP for J all'ultima versione &mdash; vedi Sistema &rarr; Aggiorna &rarr; Estensioni nell'amministrazione di Joomla."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;Collegato, ma nell'IA non compare nessuno strumento&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Di solito è una di tre cose: (1) il gruppo dell'utente non ha <strong>Accesso Web Service</strong> &mdash; impostalo in Sistema &rarr; Configurazione globale &rarr; Permessi (di default ce l'hanno solo i Super User); (2) il gruppo non ha permessi MCP &mdash; i Super User li hanno sempre e gli Administrator tramite le impostazioni predefinite di Joomla, ma Manager e altri gruppi hanno bisogno di Usa l'endpoint MCP (e di Scrivi tramite l'endpoint MCP per le modifiche) in Opzioni &rarr; Permessi di questo componente; (3) il client di IA ha in cache un elenco di strumenti vuoto &mdash; scollega e ricollega il server MCP nel client per costringerlo a ricontrollare."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; o l'URL restituisce un errore (errore 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="O l'URL è sbagliato (ricontrollalo &mdash; deve finire con <code>/api/index.php/v1/mcp</code>), OPPURE il plugin Web Service per MCP è disabilitato sul tuo sito Joomla. Nell'amministrazione di Joomla: Sistema &rarr; Gestisci &rarr; Estensioni &rarr; cerca <code>csmcpforj</code> &rarr; verifica che il plugin Web Service sia abilitato. Se è già abilitato, forse il <code>.htaccess</code> del tuo sito blocca il percorso <code>/api/</code> &mdash; un problema dell'hosting o di un plugin di sicurezza."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; o &ldquo;Malware detected&rdquo; (errore 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Un plugin di sicurezza del tuo sito Joomla (RSFirewall, Admin Tools Pro, Securitycheck Pro) sta bloccando la richiesta MCP. In RSFirewall aggiungi due eccezioni: <code>csmcpforj_oauth</code> e <code>api\/index\.php\/v1\/mcp</code> come espressione regolare (la prima serve per l'accesso). Negli altri, consenti <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> e gli URL che contengono <code>csmcpforj_oauth</code>. Per confermare la causa, disattiva per un momento il plugin di sicurezza, riprova, poi riattivalo con le eccezioni impostate. Il pulsante <strong>Verifica connessione</strong> del pannello di controllo mostra quale indirizzo è bloccato."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Il pulsante &ldquo;Edit Config&rdquo; di Claude Desktop non fa nulla quando lo clicco"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Quel pulsante prova a passare <code>claude_desktop_config.json</code> al programma con cui il tuo computer apre i file <code>.json</code>. Se non l'hai impostato, il pulsante non fa nulla senza avvisare. Soluzione: apri tu il file con un qualsiasi editor di testo. I percorsi per sistema operativo sono nella sezione Claude dentro Avanzato qui sopra. Se il file non esiste ancora, crealo e usa il frammento di quella sezione come contenuto completo (racchiudilo in <code>{&quot;mcpServers&quot;: { ... }}</code>). Non servono modifiche ai permessi &mdash; il file si trova nella tua cartella utente."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="La finestra &ldquo;Add custom connector&rdquo; di Claude o &ldquo;Add custom MCP server&rdquo; di ChatGPT non ha un campo per la chiave API"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Quelle finestre sono fatte per collegarsi tramite accesso (OAuth); non c'è dove incollare una chiave API di MCP for J. Su questo sito l'accesso OAuth è disattivato. Un Super User può attivarlo in Componenti &rarr; MCP for J &rarr; Opzioni &rarr; <strong>Accesso OAuth</strong>, e allora entrambe le finestre funzionano. Fino ad allora: Claude Desktop può usare il metodo dello script wrapper qui sopra, claude.ai la configurazione facile e chi usa ChatGPT, Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Claude Desktop mostra &ldquo;Some MCP servers could not be loaded&rdquo; all'avvio"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Claude Desktop 1.30096+ (ago. 2026) ha reso più severa la validazione del file di configurazione e ora rifiuta le voci i cui argomenti sembrano contenere credenziali. Questo blocca i due modi ovvi per configurare direttamente in <code>claude_desktop_config.json</code> un server MCP con token bearer: la forma nativa <code>type: http</code> E il passaggio di <code>mcp-remote</code> con un argomento <code>--header &quot;Authorization: Bearer ...&quot;</code>. Entrambi sembrano corretti nel file, ma il validatore dello schema di Claude Desktop li scarta al caricamento. <strong>Soluzione:</strong> usa il metodo dello script wrapper descritto nella sezione Claude dentro Avanzato qui sopra &mdash; metti l'intero comando in un piccolo file <code>.cmd</code> e fai sì che la configurazione di Claude Desktop faccia solo riferimento a quel file. Claude Desktop vede un comando semplice senza argomenti visibili e lo accetta. La tua chiave API resta sicura esattamente come prima &mdash; il file wrapper si trova nella tua cartella utente."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Ho riavviato Claude Desktop, ma non vede ancora la nuova connessione"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="Su Windows, chiudere la finestra di Claude Desktop la nasconde soltanto nell'area di notifica &mdash; l'intera app continua a girare con la VECCHIA configurazione in memoria. Cliccare poi sull'icona nella barra delle applicazioni riporta solo la finestra di quel processo già in esecuzione. Claude Desktop rilegge il file di configurazione solo con un vero riavvio dell'app. Per riavviarla davvero: clic destro sull'icona di Claude nell'area di notifica (in basso a destra; potrebbe servire cliccare sulla piccola freccia verso l'alto per vedere le icone nascoste) &rarr; scegli <strong>Quit</strong> &rarr; aspetta circa 3 secondi che il processo termini del tutto &rarr; riavvia Claude Desktop dal menu Start. Solo allora le modifiche al file di configurazione hanno effetto."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Domande frequenti"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Qualcuno può usare questa connessione senza una chiave API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="No. Ogni richiesta deve contenere una chiave API valida, oppure un token di accesso OAuth se l'accesso OAuth è attivo. Le richieste senza vengono rifiutate. È voluto &mdash; l'IA può compiere azioni reali sul tuo sito (creare articoli, modificare utenti, ecc.), quindi un accesso anonimo sarebbe un disastro per la sicurezza."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Un utente Joomla può avere più chiavi API attive?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="No. Joomla conserva esattamente una chiave API per utente. Cliccando su Resetta se ne genera una nuova e la vecchia diventa non valida. Se ti servono più chiavi (una per dispositivo, una per strumento di IA, ecc.), crea utenti Joomla separati."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="C'è un limite a quanto posso usarlo?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="MCP for J di per sé non ha limiti. Valgono i normali limiti dell'hosting (memoria PHP, connessioni MariaDB, ecc.). Se generi molto traffico (grandi operazioni in blocco su molti siti), parla con il tuo provider di hosting per aumentare la concorrenza di PHP-FPM."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Devo aprire porte nel firewall o configurare qualcosa di particolare?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="No. MCP usa semplicemente l'HTTPS standard sulla porta 443. Se il tuo sito è già raggiungibile pubblicamente su <code>https://yoursite.com/</code>, l'endpoint MCP è raggiungibile da qualsiasi client di IA su Internet senza configurazioni aggiuntive."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="Come cambio (ruoto) regolarmente la mia chiave API?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Non c'è una pianificazione automatica &mdash; la cambi a mano quando vuoi. Vai in Utenti &rarr; l'utente &rarr; scheda Token API di Joomla &rarr; clicca su Resetta. Poi aggiorna la configurazione del client di IA con la nuova chiave. Buona abitudine: cambia ogni chiave che sia mai comparsa in uno screenshot, in un log o in una segnalazione di bug."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Uso un client di IA che non è elencato qui sopra &mdash; funzionerà?"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Quasi certamente sì, purché supporti il MCP standard via HTTPS e ti permetta di aggiungere un'intestazione Authorization personalizzata oppure sappia accedere con OAuth (attiva l'accesso OAuth nelle Opzioni). L'URL è lo stesso ovunque &mdash; cambia solo la schermata di configurazione del client. Client che sappiamo funzionare ma per cui non abbiamo ancora scritto guide passo passo: Continue.dev, Windsurf, l'editor Zed, mcp-cli, MCP Inspector, LibreChat, Open WebUI (tramite il bridge <code>mcpo</code>) e vari agenti basati su Ollama."

