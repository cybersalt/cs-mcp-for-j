; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Chi può usare questo endpoint?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="I permessi vengono verificati sull'account utente Joomla a cui appartiene il token API. Il client MCP (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl o qualsiasi altro) fa solo da tramite &mdash; lo stesso token si comporta allo stesso modo da qualsiasi client."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Importante:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Chi genera il token ottiene tramite l'endpoint MCP lo stesso accesso che ha in qualsiasi altro punto dell'amministrazione di Joomla. Genera token solo per utenti a cui affideresti direttamente quelle azioni."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Gruppo utenti Joomla"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Funziona subito?"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Perché"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Sì"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Serve un permesso esplicito"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="I Super User superano sempre ogni controllo dei permessi in Joomla."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Ha core.manage grazie ai permessi predefiniti di Joomla, che il controllo MCP accetta per gli strumenti di lettura e scrittura (gli strumenti che modificano permessi, estensioni, impostazioni dei plugin o Joomla stesso richiedono comunque un Super User) &mdash; ma il gruppo ha comunque bisogno di <strong>Accesso Web Service</strong> prima che Joomla gli permetta anche solo di autenticarsi."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="Non ha permessi MCP di default. Concedi al gruppo <strong>Accesso Web Service</strong> in Sistema &rarr; Configurazione globale &rarr; Permessi, poi Usa l'endpoint MCP e (facoltativo) Scrivi tramite l'endpoint MCP in <strong>Opzioni &rarr; Permessi</strong> di questo componente."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Serve Accesso Web Service"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Prima di tutto il resto:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Joomla protegge l'intera API con un permesso separato chiamato <strong>Accesso Web Service</strong> (<code>core.login.api</code>), e <strong>di default ce l'hanno solo i Super User</strong>. Ogni altro gruppo &mdash; compresi Administrator e Manager &mdash; riceve <code>403 Forbidden</code> da ogni strumento finché non lo concedi, qualunque cosa possa fare per il resto nell'amministrazione. Impostalo in <strong>Sistema &rarr; Configurazione globale &rarr; Permessi</strong>, sul gruppo, non su questo componente."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / gruppo personalizzato"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Concedi al gruppo <strong>Accesso Web Service</strong> in Sistema &rarr; Configurazione globale &rarr; Permessi, poi Usa l'endpoint MCP e (facoltativo) Scrivi tramite l'endpoint MCP in <strong>Opzioni &rarr; Permessi</strong> di questo componente."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Collega un assistente di IA a questo sito"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Ci sono due modi. Il primo (copiare e incollare un prompt) è il più semplice &mdash; funziona senza configurare il client e, dopo che la tua IA ha confermato che funziona, di solito si offre di installare questo sito come connettore permanente, senza modificare JSON a mano. Il secondo è per chi preferisce modificare direttamente la configurazione del client."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Copia un prompt di configurazione (consigliato)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Incolla un prompt di configurazione nel tuo assistente di IA"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Non serve configurare il client. Copia il prompt qui sotto in una nuova conversazione con il tuo assistente di IA (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini, ecc.). L'IA eseguirà un test con curl, confermerà la connessione e &mdash; sui client che lo supportano &mdash; si offrirà di rendere la connessione permanente, senza file JSON da modificare né comandi da terminale da ricordare."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Bonus:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Se il tuo client di IA ha uno strumento shell (Codex, Claude Code, Cursor Composer, Cline, Continue, la modalità agente di GitHub Copilot, ecc.), il prompt include un'offerta di autoinstallazione. Di' semplicemente &lsquo;rendila permanente&rsquo; dopo che l'IA ha confermato che la connessione funziona, ed eseguirà il comando adatto al client per registrare il server MCP (per esempio <code>codex mcp add</code> o <code>claude mcp add</code>). Dopo il riavvio del client, questo sito compare come strumenti MCP nativi in ogni conversazione &mdash; non servirà mai più un prompt."
