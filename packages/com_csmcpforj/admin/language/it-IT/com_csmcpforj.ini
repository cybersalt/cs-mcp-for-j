COM_CSMCPFORJ_ACTIONLOG_OAUTH_REVOKE="L'utente <a href=&quot;{accountlink}&quot;>{username}</a> ha scollegato l'app &ldquo;{title}&rdquo; da MCP for J (OAuth)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="Collegati con l'accesso (il modo più facile)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Nessuna chiave API da copiare. Nella tua app di IA aggiungi un connettore e incolla l'<strong>URL dell'endpoint</strong> di questo sito (qui sotto). Quando clicchi su Connect, l'app apre da sola la pagina di accesso di questo sito: accedi con nome utente e password di questo sito, poi clicca su <strong>Consenti</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai e Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Dagli un nome, incolla l'URL dell'endpoint e clicca su Continue. Lascia <em>Sign in now</em>; per il client OAuth funzionano sia <em>Use Claude's published identity</em> sia <em>Register automatically</em>. Non aggiungere intestazioni di richiesta. Clicca su Add, poi su <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> <strong>Plugins</strong> nella barra laterale sinistra &rarr; <strong>Add</strong> (in alto a destra) &rarr; <strong>Add custom MCP server</strong>. Dagli un nome, incolla l'URL dell'endpoint, lascia Authentication su <strong>OAuth</strong>, spunta la casella, clicca su <strong>Create as a plugin</strong>, poi su <strong>Connect</strong>. Serve un piano ChatGPT a pagamento (Plus funziona)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>, poi digita <code>/mcp</code>, scegli il server e seleziona <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> Riquadro comandi &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; incolla l'URL dell'endpoint. VS Code ti chiede di accedere."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> aggiungi <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> sotto <code>mcpServers</code> in <code>mcp.json</code> (senza intestazioni), poi clicca su <strong>Login</strong> accanto al server in Settings &rarr; MCP."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> aggiungi <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> per il server in <code>settings.json</code>, poi esegui <code>/mcp auth &lt;name&gt;</code>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Codex apre da solo la pagina di accesso (se non lo fa, esegui <code>codex mcp login joomla</code>). Clicca su Consenti entro pochi minuti, in un browser sullo stesso computer di Codex. Se poi il browser dice che 127.0.0.1 ha rifiutato la connessione, usa <code>codex mcp login joomla --no-browser</code> e incolla l'indirizzo di quella pagina nel terminale, oppure continua a usare il metodo con la chiave API qui sotto."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, incolla l'URL dell'endpoint, poi clicca su <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="Quando clicchi su Consenti, l'app agisce come l'account con cui hai effettuato l'accesso e può fare esattamente ciò che quell'account può fare su questo sito, comprese le modifiche se l'account può farle. Administrator e Manager hanno prima bisogno del permesso <em>Accesso Web Service</em> (vedi Permessi nel pannello di controllo). Ogni app collegata è elencata nel pannello di controllo, dove può essere scollegata subito."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="Preferisci una chiave API, o il tuo client non può aprire un browser? Il metodo con la chiave API in <strong>Configurazione avanzata</strong> qui sotto funziona ancora con ogni client."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="ChatGPT (&ldquo;Add custom MCP server&rdquo;) e claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) possono collegarsi solo mandandoti alla pagina di accesso di questo sito. Su questo sito è disattivato. Quando è attivo, collegarsi significa: incolla l'indirizzo di questo sito nell'app, accedi, clicca su Consenti."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="Attivalo nelle Opzioni"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Chiedi a un Super User di attivare l'<strong>accesso OAuth</strong> nelle opzioni di MCP for J. Fino ad allora usa il metodo con la chiave API qui sotto."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="Il modo più facile: la finestra &ldquo;Add custom connector&rdquo; di Claude funziona su questo sito."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="L'accesso è attivo su questo sito, quindi in Claude Desktop o claude.ai vai in <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, incolla l'indirizzo MCP di questo sito, clicca su Continue, mantieni le impostazioni di accesso rilevate, clicca su Add e poi su Connect, accedi con nome utente e password di questo sito e clicca su Consenti. Il metodo con il file di configurazione qui sotto serve solo se preferisci una chiave API."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="claude.ai si collega in modo permanente tramite <strong>Add custom connector</strong>: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, incolla l'indirizzo MCP di questo sito, clicca su Continue, mantieni le impostazioni di accesso rilevate, clicca su Add e poi su Connect. Accedi con nome utente e password di questo sito e clicca su Consenti. La connessione resta disponibile in ogni chat."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="In ChatGPT clicca su <strong>Plugins</strong> nella barra laterale sinistra, poi su <strong>Add</strong> (in alto a destra) &rarr; <strong>Add custom MCP server</strong>. Dagli un nome (per esempio &ldquo;Il mio sito Joomla&rdquo;), incolla l'indirizzo MCP di questo sito, lascia Authentication su <strong>OAuth</strong>, spunta &ldquo;I understand and want to continue&rdquo; e clicca su <strong>Create as a plugin</strong>. Clicca su <strong>Connect</strong> e ChatGPT apre la pagina di accesso di questo sito: accedi con nome utente e password di questo sito e clicca su Consenti. Poi, in una chat, digita <strong>@</strong> e scegli il plugin. Non c'è nessuna chiave API da incollare."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="La finestra &ldquo;Add custom connector&rdquo; si collega, ma l'accesso non riesce"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Controlla, in ordine: (1) che l'account con cui hai effettuato l'accesso possa usare MCP &mdash; gli Administrator hanno bisogno di <em>Accesso Web Service</em>, i Manager di quello più <em>Usa l'endpoint MCP</em> in Opzioni &rarr; Permessi (vedi la scheda <em>Chi può usare questo endpoint?</em> nel pannello di controllo); se non è così te lo dice la pagina di accesso; (2) che la scheda &ldquo;Collega le app di IA con l'accesso&rdquo; nel pannello di controllo indichi <strong>Pronto</strong>; (3) che il tuo firewall lasci raggiungere il sito ai server dell'app (vedi la voce successiva). Non inserire client ID né secret: l'app si registra da sola. (4) Clicca su Consenti poco dopo l'apertura della pagina di accesso: le app abbandonano un accesso dopo un po' (Codex dopo circa 5 minuti), e un Consenti tardivo finisce in errore. Riavvia Connect e funzionerà."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="claude.ai o ChatGPT non raggiunge il sito, oppure l'accesso si ferma a metà"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="claude.ai e ChatGPT si collegano dai propri server, non dal tuo browser, quindi il sito deve essere raggiungibile via HTTPS pubblico. Un web application firewall (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 o un firewall dell'hosting come TigerProtect di o2switch, che risponde 503) può bloccare quelle richieste. Consenti le richieste a <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> e <code>index.php?csmcpforj_oauth=&hellip;</code> (gli endpoint di registrazione, token e revoca). In RSFirewall bastano queste due eccezioni: <code>csmcpforj_oauth</code> e <code>api\/index\.php\/v1\/mcp</code> come espressione regolare. claude.ai si collega da <code>160.79.104.0/21</code>. <strong>Cloudflare</strong>: Browser Integrity Check e Security Level possono bloccare i server delle app. Aggiungi una regola personalizzata del WAF (Security &rarr; WAF &rarr; Custom rules) con l'azione <strong>Skip</strong> per le richieste il cui percorso URI contiene <code>/api/index.php/v1/mcp</code> o <code>/.well-known/oauth-</code>, o la cui query string contiene <code>csmcpforj_oauth</code>, e spunta <em>Browser Integrity Check</em> e <em>Security Level</em>. Bot Fight Mode non si può saltare con una regola, quindi disattivalo se blocca. <strong>Route 66</strong> e altre estensioni SEO che riscrivono gli URL possono intercettare gli indirizzi di accesso (<code>index.php?csmcpforj_oauth=&hellip;</code>) e rispondere con la home page, così l'app non riesce a registrarsi e non dà un motivo chiaro. Se <strong>Verifica connessione</strong> mostra la home page per gli endpoint di accesso, escludi in quell'estensione gli URL che contengono <code>csmcpforj_oauth</code>, oppure disattiva il suo plugin di sistema. La pagina di accesso vera e propria si apre nel tuo browser."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="Il pannello di controllo dice che le app di IA non trovano la pagina di accesso di questo sito (Non pronto)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="I client di IA cercano i dati di accesso su <code>/.well-known/oauth-authorization-server</code> del tuo dominio. Joomla risponde lì solo quando Configurazione globale &rarr; <strong>Riscrivi URL SEF</strong> è attivo e il <code>.htaccess</code> del sito è presente (rinomina <code>htaccess.txt</code>), oppure quando nginx invia i percorsi sconosciuti a <code>index.php</code>. Questo non tocca l'AutoSSL di cPanel, che usa <code>/.well-known/acme-challenge/</code>. Un sito installato in una sottocartella (per esempio <code>example.com/joomla</code>) ha bisogno anche di una regola nella radice del dominio che invii <code>/.well-known/oauth-authorization-server/joomla</code> alla sottocartella."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Accedere da un server o da una macchina senza browser"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="I client desktop (Claude Code, Codex, Cursor, Gemini CLI) aprono un browser sulla stessa macchina e aspettano la risposta su un indirizzo locale, quindi l'accesso OAuth ha bisogno di un browser lì. Su un server senza schermo o tramite SSH, usa invece il metodo con la chiave API della Configurazione avanzata; funziona ovunque."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="Nell'app di IA aggiungi un nuovo connettore (claude.ai e Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector; ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server) e incolla questo <strong>URL dell'endpoint</strong>: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Clicca su Connect.</strong> L'app apre da sola la pagina di accesso di questo sito. Accedi con nome utente e password di questo sito."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Clicca su Consenti.</strong> Torni all'app, già collegata. L'app può fare tutto ciò che il tuo account può fare su questo sito."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Collega un'app di IA a questo sito"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Ci sono tre modi. Clicca su uno per aprire i suoi passi numerati. Quasi tutti vogliono il primo."
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. Accedi (il modo più facile) &mdash; ChatGPT, claude.ai, Claude Desktop e la maggior parte delle altre app di IA"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Incolla un prompt di configurazione &mdash; per una chat di IA che può eseguire comandi"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. File di configurazione o riga di comando &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI e altri"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Funziona nelle app di IA che possono eseguire comandi (Codex, Claude Code, Cursor, Cline, la modalità agente di Copilot e simili). L'IA testa da sola la connessione e può offrirsi di renderla permanente."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="Per le app che si configurano con un file di impostazioni o un comando. Lo fai una volta e resta collegato."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>Ottieni il tuo token API.</strong> Clicca sul pulsante: il tuo profilo utente si apre in una nuova scheda. Lì apri la scheda <strong>Token API di Joomla</strong>, clicca sull'icona dell'occhio per mostrare il token e copialo. Poi torna a questa scheda."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="Ottieni il mio token API (apre una nuova scheda)"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>Copia il prompt.</strong> Il tuo token è già incluso."
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="<strong>Incollalo in una nuova conversazione</strong> con la tua app di IA e invia. L'IA testa la connessione e, se può, si offre di renderla permanente."
COM_CSMCPFORJ_DASHBOARD_WAY3_STEP_COPY="<strong>Copia la configurazione.</strong> Il tuo token è già incluso."
COM_CSMCPFORJ_DASHBOARD_WAY3_GUIDE_LINK="Le istruzioni passo passo per ogni app sono nella guida alla configurazione &rarr;"
COM_CSMCPFORJ_DASHBOARD_COPY_URL_BUTTON="Copia"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1_COPY="<strong>Copia l'URL dell'endpoint.</strong>"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2_ADD="<strong>Aggiungi l'URL dell'endpoint alla tua app di IA come connettore.</strong> Dove farlo dipende dall'app:"
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN="Collegati con l'accesso"
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN_ON="Le app di IA possono collegarsi con l'accesso."

