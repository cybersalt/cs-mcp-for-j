COM_CSMCPFORJ_CHECK_UNEXPECTED="Ha risposto qualcosa di diverso da MCP for J (HTTP %d): '%s'. Di solito la causa è un firewall; vedi Risoluzione dei problemi qui sotto."
COM_CSMCPFORJ_CHECK_CLOUDFLARE="Questo sito è dietro Cloudflare. Se quella risposta è una pagina di Cloudflare, aggiungi una regola personalizzata del WAF con l'azione Skip per gli indirizzi MCP e di accesso, spuntando Browser Integrity Check e Security Level (vedi Risoluzione dei problemi qui sotto)."
COM_CSMCPFORJ_CHECK_UNREACHABLE="Il server web non è riuscito a raggiungere il proprio indirizzo pubblico (%s). Alcuni hosting non lo consentono, quindi questa verifica non può dirlo. Prova a collegarti dall'app e controlla i registri."

; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Firewall ed estensioni di URL"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="RSFirewall è attivo."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="Può bloccare le richieste MCP (&ldquo;403 Access Forbidden &mdash; Malware detected&rdquo;) e l'accesso di claude.ai. In RSFirewall aggiungi due eccezioni: <code>csmcpforj_oauth</code> e <code>api\/index\.php\/v1\/mcp</code> come espressione regolare."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Admin Tools è attivo."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="Il suo Web Application Firewall può bloccare le richieste MCP e l'accesso. Se <strong>Verifica connessione</strong> mostra un blocco, trova la regola nel Blocked Requests Log di Admin Tools e aggiungi un'eccezione WAF, oppure disattiva quella regola. Consenti <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> e gli URL che contengono <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Securitycheck è attivo."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="Il suo firewall può bloccare le richieste MCP e l'accesso. Se <strong>Verifica connessione</strong> mostra un blocco, trova la richiesta nei suoi registri e aggiungi un'eccezione per <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> e gli URL che contengono <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Route 66 è attivo."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Questa estensione SEO può intercettare gli indirizzi di accesso (<code>index.php?csmcpforj_oauth=&hellip;</code>) e rispondere con la home page, così claude.ai o ChatGPT non riesce a registrarsi e non dà un motivo chiaro. Se <strong>Verifica connessione</strong> mostra la home page per gli endpoint di accesso, escludi in Route 66 gli URL che contengono <code>csmcpforj_oauth</code>, oppure disattiva il suo plugin di sistema."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Anche i firewall gestiti dall'hosting possono bloccare: o2switch TigerProtect risponde 503, e le regole di Imunify360, ModSecurity o Cloudflare rispondono 403. Chiedi all'hosting di consentire gli indirizzi qui sopra, o di far passare i server di Anthropic (<code>160.79.104.0/21</code>) per claude.ai. <strong>Cloudflare</strong>: Browser Integrity Check e Security Level possono bloccare i server delle app. Aggiungi una regola personalizzata del WAF (Security &rarr; WAF &rarr; Custom rules) con l'azione <strong>Skip</strong> per le richieste il cui percorso URI contiene <code>/api/index.php/v1/mcp</code> o <code>/.well-known/oauth-</code>, o la cui query string contiene <code>csmcpforj_oauth</code>, e spunta <em>Browser Integrity Check</em> e <em>Security Level</em>. Bot Fight Mode non si può saltare con una regola, quindi disattivalo se blocca."

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Checklist per claude.ai: &ldquo;cannot register&rdquo;, &ldquo;Authorization failed&rdquo; o &ldquo;Couldn't reach the MCP server&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Controllali in quest'ordine. Ognuno di questi punti è già costato ore a qualcuno."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Usa esattamente questo indirizzo: <code>%s</code>. Con o senza <em>www</em> deve corrispondere a come risponde il sito, <strong>senza reindirizzamenti</strong> in mezzo (da www al dominio senza www, o da http a https). Il pulsante <strong>Verifica connessione</strong> del pannello di controllo segnala un reindirizzamento."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="L'accesso OAuth è attivo su questo sito. claude.ai può collegarsi solo tramite accesso, quindi deve restare attivo."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>L'accesso OAuth è disattivato su questo sito.</strong> claude.ai può collegarsi solo tramite accesso, quindi un Super User deve prima attivarlo: Componenti &rarr; MCP for J &rarr; Opzioni &rarr; <strong>Accesso OAuth</strong>. Finché è disattivato, claude.ai dice &ldquo;cannot register&rdquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="Nella finestra <strong>Add custom connector</strong> scegli <strong>Sign in now</strong>. Per il client OAuth funzionano sia <strong>Use Claude's published identity</strong> sia <strong>Register automatically</strong> (l'identità pubblicata richiede l'estensione curl di PHP sul server). Lascia vuoti client ID e secret. Se un modo non funziona, rimuovi il connettore e aggiungilo di nuovo con l'altro."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>Non aggiungere intestazioni di richiesta.</strong> claude.ai non accetta un'intestazione <code>X-Joomla-Token</code>, quindi lì non si può usare una chiave API. L'accesso è l'unico modo per entrare da claude.ai."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="I firewall devono far passare i server di claude.ai. Si collegano da <code>160.79.104.0/21</code>, non dal tuo browser. RSFirewall ha bisogno di due eccezioni: <code>csmcpforj_oauth</code> e <code>api\/index\.php\/v1\/mcp</code> come espressione regolare. Anche Admin Tools, Securitycheck e i firewall dell'hosting come o2switch TigerProtect (che risponde 503) possono bloccarlo. <strong>Cloudflare</strong>: Browser Integrity Check e Security Level possono bloccare i server delle app. Aggiungi una regola personalizzata del WAF (Security &rarr; WAF &rarr; Custom rules) con l'azione <strong>Skip</strong> per le richieste il cui percorso URI contiene <code>/api/index.php/v1/mcp</code> o <code>/.well-known/oauth-</code>, o la cui query string contiene <code>csmcpforj_oauth</code>, e spunta <em>Browser Integrity Check</em> e <em>Security Level</em>. Bot Fight Mode non si può saltare con una regola, quindi disattivalo se blocca. Il pulsante <strong>Verifica connessione</strong> del pannello di controllo mostra cosa risponde."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="<strong>Route 66</strong> e altre estensioni SEO che riscrivono gli URL possono intercettare gli indirizzi di accesso (<code>index.php?csmcpforj_oauth=&hellip;</code>) e rispondere con la home page, così l'app non riesce a registrarsi e non dà un motivo chiaro. Se <strong>Verifica connessione</strong> mostra la home page per gli endpoint di accesso, escludi in quell'estensione gli URL che contengono <code>csmcpforj_oauth</code>, oppure disattiva il suo plugin di sistema."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Accedi con un account che può usare MCP (vedi <em>Chi può usare questo endpoint?</em> nel pannello di controllo). Se non funziona per una sola persona, controlla che il suo account non sia bloccato e non abbia attivo <em>Richiedi reimpostazione password</em>."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_LOGS="Ancora bloccato? Componenti &rarr; MCP for J &rarr; <strong>Registri</strong> mostra ogni passaggio dell'accesso e perché un passaggio è stato rifiutato."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_JUMP="Vai a:"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_LOGIN="claude.ai, ChatGPT e altre app che si collegano con l'accesso"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_DESKTOP="Claude Desktop con un file di configurazione"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_GROUP_ERRORS="Messaggi di errore, in qualsiasi app"
