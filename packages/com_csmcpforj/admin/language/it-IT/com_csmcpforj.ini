COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="Durata della cache del catalogo (ore)"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="Per quanto tempo il catalog.json scaricato resta in cache prima di essere riscaricato. Il pulsante di aggiornamento nella pagina del catalogo lo ignora. Intervallo 1&ndash;168 (una settimana)."
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="Mostra gli add-on Pro non disponibili"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Mostra gli add-on Pro nel catalogo anche se al momento non hai un abbonamento Pro. Utile per vedere cosa c'è; scegli No per nasconderli del tutto."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Ricontrolla l'abbonamento ogni (secondi)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="Ogni quanto il pannello di controllo richiede a cybersalt.com se l'email collegata ha ancora l'accesso Pro. 86400 = una volta al giorno (consigliato). Minimo 60, massimo 604800 = una volta a settimana."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="Server MCP"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Controlli lato server per l'endpoint MCP. Determinano cosa vedono e possono chiamare i client MCP."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Modalità sola lettura"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="Con SÌ, l'endpoint MCP annuncia e accetta solo gli strumenti le cui ToolAnnotations MCP li dichiarano di sola lettura (list_*, get_*, read_*, check_*, validate_*, fetch_*, più joomla_update_healthcheck). Utile se vuoi che un client di IA esplori il sito senza poterne modificare i contenuti. Le scritture restituiscono un errore che spiega che il server è in modalità sola lettura. L'impostazione è un limite minimo: un client MCP può anche aggiungere ?read_only=1 all'URL dell'endpoint per limitarsi ulteriormente, ma NON può sbloccare le scritture su un sito impostato su SÌ."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Privacy durante la registrazione dello schermo"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Controlli per la sfocatura dei dati segreti nel pannello di controllo (il token API di Joomla nell'anteprima del prompt, l'email dell'abbonamento Pro). La sfocatura è attiva di default; queste opzioni regolano la visualizzazione al passaggio del mouse, così che un movimento casuale non riveli per sbaglio il segreto durante una condivisione o una registrazione dello schermo."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Ritardo di visualizzazione al passaggio del mouse (secondi)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Quanti secondi devi tenere il puntatore su un segreto sfocato prima che venga mostrato. Mentre lo tieni, accanto al segreto compare un piccolo conto alla rovescia, così sai che il timer sta andando. Spostando il mouse la visualizzazione si annulla e il timer si azzera &mdash; il passaggio successivo riparte da un conto alla rovescia completo. Imposta 0 per mostrarlo subito al passaggio del mouse (elimina la protezione contro i passaggi accidentali ma ripristina il comportamento classico). Predefinito: 3 secondi."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Nascondi automaticamente dopo la visualizzazione (secondi)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Per quanti secondi un segreto mostrato al passaggio del mouse resta visibile prima di tornare sfocato da solo &mdash; anche se il mouse è ancora sopra. Una sicurezza in più per i casi tipo &ldquo;ho guardato, l'ho letto e poi mi sono distratto&rdquo;, in cui un browser lasciato incustodito mostrerebbe altrimenti il segreto all'infinito. Spostando il mouse si sfoca sempre subito, indipendentemente da questa impostazione. Imposta 0 per disattivare l'occultamento automatico (i segreti mostrati restano visibili finché non sposti il mouse). Predefinito: 8 secondi &mdash; abbastanza per leggere con calma un intero token base64, abbastanza poco perché una sessione incustodita non esponga il segreto."

