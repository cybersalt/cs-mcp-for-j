COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_BODY="Mandaci segnalazioni di bug, richieste di funzionalità, domande e idee &mdash; le leggiamo tutte e apprezziamo il riscontro. L'assistenza per la versione gratuita è fornita al meglio delle nostre possibilità (le risorse per l'assistenza gratuita sono limitate), quindi le risposte possono richiedere un po' di tempo. Se ti servono tempi di risposta garantiti o attenzione prioritaria, valuta %sun abbonamento MCP for J Pro%s."

