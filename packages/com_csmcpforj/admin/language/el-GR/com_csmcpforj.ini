; Permissions card
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_HEADING="Ποιος μπορεί να χρησιμοποιήσει αυτό το τελικό σημείο;"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_INTRO="Τα δικαιώματα ελέγχονται με βάση τον λογαριασμό χρήστη Joomla στον οποίο ανήκει το διακριτικό API. Ο πελάτης MCP (Codex, Claude, Cursor, Cline, ChatGPT, Copilot, Gemini, curl ή οτιδήποτε άλλο) είναι απλώς ένας ενδιάμεσος &mdash; το ίδιο διακριτικό συμπεριφέρεται ακριβώς το ίδιο από οποιονδήποτε πελάτη."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_LABEL="Σημαντικό:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_KEY_FACT_BODY="Όποιος δημιουργεί το διακριτικό αποκτά μέσω του τελικού σημείου MCP την ίδια πρόσβαση που έχει παντού αλλού στη διαχείριση του Joomla. Δημιουργήστε διακριτικά μόνο για χρήστες που θα εμπιστευόσασταν να κάνουν αυτές τις ενέργειες απευθείας."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_GROUP="Ομάδα χρηστών Joomla"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_OUTOFBOX="Λειτουργεί αμέσως;"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_COL_REASON="Γιατί"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_YES="Ναι"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_GRANT="Χρειάζεται ρητή παραχώρηση"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_SUPER="Οι Super Users περνούν πάντα κάθε έλεγχο δικαιωμάτων στο Joomla."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_ADMIN="Έχει core.manage μέσω των προεπιλεγμένων δικαιωμάτων του Joomla, το οποίο ο έλεγχος MCP δέχεται για εργαλεία ανάγνωσης και εγγραφής (τα εργαλεία που αλλάζουν δικαιώματα, επεκτάσεις, ρυθμίσεις προσθέτων ή το ίδιο το Joomla χρειάζονται πάντα Super User) &mdash; αλλά η ομάδα χρειάζεται επίσης το <strong>Υπηρεσίες Διαδικτύου Είσοδος</strong> για να της επιτρέψει το Joomla να πιστοποιηθεί."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_MANAGER="Δεν έχει κανένα δικαίωμα MCP από προεπιλογή. Παραχωρήστε στην ομάδα το <strong>Υπηρεσίες Διαδικτύου Είσοδος</strong> στο Σύστημα &rarr; Γενικές Ρυθμίσεις &rarr; Δικαιώματα και έπειτα τα Χρήση τελικού σημείου MCP και (προαιρετικά) Εγγραφή μέσω τελικού σημείου MCP στις <strong>Επιλογές &rarr; Δικαιώματα</strong> αυτής της εφαρμογής."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_NEEDS_API_LOGIN="Χρειάζεται Υπηρεσίες Διαδικτύου Είσοδος"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_LABEL="Πριν ισχύσει οτιδήποτε από αυτά:"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_API_LOGIN_BODY="Το Joomla προστατεύει ολόκληρο το API με ένα ξεχωριστό δικαίωμα που ονομάζεται <strong>Υπηρεσίες Διαδικτύου Είσοδος</strong> (<code>core.login.api</code>) και <strong>από προεπιλογή το έχουν μόνο οι Super Users</strong>. Κάθε άλλη ομάδα &mdash; ακόμη και οι Administrator και Manager &mdash; λαμβάνει <code>403 Forbidden</code> από κάθε εργαλείο μέχρι να της το παραχωρήσετε, ό,τι κι αν μπορεί να κάνει στη διαχείριση. Ορίστε το στο <strong>Σύστημα &rarr; Γενικές Ρυθμίσεις &rarr; Δικαιώματα</strong>, στην ομάδα, όχι σε αυτή την εφαρμογή."
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_GROUP_OTHER="Author / Registered / προσαρμοσμένη ομάδα"
COM_CSMCPFORJ_DASHBOARD_PERMISSIONS_REASON_OTHER="Παραχωρήστε στην ομάδα το <strong>Υπηρεσίες Διαδικτύου Είσοδος</strong> στο Σύστημα &rarr; Γενικές Ρυθμίσεις &rarr; Δικαιώματα και έπειτα τα Χρήση τελικού σημείου MCP και (προαιρετικά) Εγγραφή μέσω τελικού σημείου MCP στις <strong>Επιλογές &rarr; Δικαιώματα</strong> αυτής της εφαρμογής."

; Setup methods card — tabs: prompt (recommended) and MCP connector (manual)
COM_CSMCPFORJ_DASHBOARD_METHODS_HEADING="Συνδέστε έναν βοηθό AI σε αυτόν τον ιστότοπο"
COM_CSMCPFORJ_DASHBOARD_METHODS_INTRO="Υπάρχουν δύο τρόποι. Ο πρώτος (αντιγραφή-επικόλληση εντολής) είναι ο ευκολότερος &mdash; λειτουργεί χωρίς καμία ρύθμιση πελάτη, και αφού το AI επιβεβαιώσει ότι λειτουργεί, συνήθως προσφέρεται να εγκαταστήσει αυτόν τον ιστότοπο ως μόνιμη σύνδεση για εσάς, χωρίς χειροκίνητη επεξεργασία JSON. Ο δεύτερος είναι για χρήστες που προτιμούν να επεξεργάζονται απευθείας τη ρύθμιση του πελάτη τους."

; Tab 1 — copy-paste prompt (default)
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_TAB="Αντιγραφή εντολής ρύθμισης (προτείνεται)"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HEADING="Επικολλήστε μια εντολή ρύθμισης στον βοηθό AI σας"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_INTRO="Δεν χρειάζεται καμία ρύθμιση πελάτη. Αντιγράψτε την παρακάτω εντολή σε μια νέα συνομιλία με τον βοηθό AI σας (Codex, Claude, Cursor, ChatGPT, Copilot, Gemini κ.λπ.). Το AI θα εκτελέσει μια δοκιμή curl, θα επιβεβαιώσει τη σύνδεση και &mdash; σε πελάτες που το υποστηρίζουν &mdash; θα προσφερθεί να κάνει τη σύνδεση μόνιμη για εσάς, χωρίς αρχεία JSON για επεξεργασία και χωρίς εντολές τερματικού για απομνημόνευση."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_LABEL="Μπόνους:"
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_BONUS_BODY="Αν ο πελάτης AI σας έχει εργαλείο κελύφους (Codex, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot σε λειτουργία agent κ.λπ.), η εντολή περιλαμβάνει πρόταση αυτόματης εγκατάστασης. Αρκεί να πείτε &lsquo;make it permanent&rsquo; (κάν' το μόνιμο) αφού το AI επιβεβαιώσει ότι η σύνδεση λειτουργεί, και θα εκτελέσει την κατάλληλη εντολή για τον πελάτη ώστε να καταχωρίσει τον διακομιστή MCP (για παράδειγμα <code>codex mcp add</code> ή <code>claude mcp add</code>). Μετά από επανεκκίνηση του πελάτη, αυτός ο ιστότοπος εμφανίζεται ως εγγενή εργαλεία MCP σε κάθε συνομιλία &mdash; δεν χρειάζεται ποτέ ξανά εντολή."
; Shared "type here" field pattern - see FieldStyleHelper.
COM_CSMCPFORJ_FIELD_OPTIONAL="Προαιρετικό"
COM_CSMCPFORJ_FIELD_REQUIRED="Υποχρεωτικό"

COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP1="Δημιουργήστε ένα διακριτικό Joomla API στο προφίλ σας (σύνδεσμος στα δεξιά)."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP2="Κάντε κλικ στο &lsquo;Αντιγραφή εντολής&rsquo; παρακάτω."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP3="Επικολλήστε την σε μια νέα συνομιλία με τον βοηθό AI σας. Αν παραλείψατε το βήμα 2, αντικαταστήστε πρώτα το <code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code> με το πραγματικό διακριτικό σας."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_STEP4="Αποστολή. Το AI θα δοκιμάσει τη σύνδεση και, σε πελάτες που το υποστηρίζουν, θα προσφερθεί να την κάνει μόνιμη."
COM_CSMCPFORJ_DASHBOARD_METHOD_PROMPT_HINT="Αυτή η εντολή λειτουργεί σε κάθε πελάτη AI με εργαλείο κελύφους/τερματικού: <strong>Codex</strong>, Claude Code, Cursor Composer, Cline, Continue, GitHub Copilot (λειτουργία agent), Gemini CLI, Windsurf, mcp-cli κ.λπ. Δεν λειτουργεί σε περιβάλλοντα συνομιλίας μόνο για web (claude.ai, chatgpt.com, gemini.google.com) που δεν έχουν πρόσβαση σε κέλυφος &mdash; για αυτά, χρησιμοποιήστε την καρτέλα Σύνδεση MCP."

; Tab 2 — manual MCP connector configuration
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_TAB="Σύνδεση MCP (χειροκίνητη ρύθμιση)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_HEADING="Χειροκίνητη προσθήκη ως σύνδεση MCP"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_INTRO="Για το Claude Desktop (αρχείο ρυθμίσεων), Claude Code, Cursor, Codex, Cline, Copilot, Gemini CLI ή οποιονδήποτε πελάτη όπου προτιμάτε να επεξεργαστείτε απευθείας τη ρύθμιση. Ρύθμιση μία φορά, μόνιμη σε όλες τις συνομιλίες. (Οι προσαρμοσμένες συνδέσεις του claude.ai και του ChatGPT δεν μπορούν να στείλουν κλειδί API: συνδέονται μέσω σύνδεσης χρήστη. Δείτε το <strong>Σύνδεση μέσω σύνδεσης χρήστη (OAuth)</strong> σε αυτή τη σελίδα.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP1="Δημιουργήστε ένα διακριτικό Joomla API στο προφίλ σας."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP2="Αντιγράψτε το παρακάτω απόσπασμα ρύθμισης."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP3="Αντικαταστήστε το <code>YOUR_JOOMLA_API_TOKEN</code> με το διακριτικό που δημιουργήσατε."
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_STEP4="Επικολλήστε το στη ρύθμιση MCP του πελάτη AI σας &mdash; Claude Desktop: <code>claude_desktop_config.json</code>· Claude Code: <code>claude mcp add</code>· Cursor: <code>~/.cursor/mcp.json</code>· GitHub Copilot: ρυθμίσεις MCP στο VS Code / JetBrains· Cline / Continue: JSON ρυθμίσεων της επέκτασης. Επανεκκινήστε τον πελάτη μετά την αποθήκευση. (Τα παράθυρα &ldquo;Add custom connector&rdquo; του claude.ai και του ChatGPT δεν έχουν πεδίο για αυτό· χρησιμοποιήστε σύνδεση OAuth για αυτά.)"
COM_CSMCPFORJ_DASHBOARD_METHOD_CONNECTOR_XHEADER_NOTE="Αν ο πελάτης σας δεν υποστηρίζει κεφαλίδα Authorization, αντικαταστήστε το μπλοκ headers με:"

