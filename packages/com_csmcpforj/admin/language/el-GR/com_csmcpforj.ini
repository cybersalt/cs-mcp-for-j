COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_LABEL="Σύνδεση OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_FIELDSET_DESC="Επιτρέπει στις εφαρμογές AI να συνδέονται στέλνοντάς σας στη σελίδα σύνδεσης αυτού του ιστότοπου, αντί να αντιγράφετε εσείς ένα κλειδί API σε αυτές. Το ChatGPT (&ldquo;Add custom MCP server&rdquo;) και το claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) μπορούν να συνδεθούν μόνο με αυτόν τον τρόπο. Οι συνδέσεις με κλειδί API συνεχίζουν να λειτουργούν σε κάθε περίπτωση."
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_LABEL="Ενεργοποίηση σύνδεσης OAuth"
COM_CSMCPFORJ_CONFIG_OAUTH_ENABLED_DESC="Όταν είναι ενεργή, επικολλάτε τη διεύθυνση MCP αυτού του ιστότοπου σε μια εφαρμογή AI, η εφαρμογή ανοίγει τη σελίδα σύνδεσης αυτού του ιστότοπου, συνδέεστε με το συνηθισμένο όνομα χρήστη και κωδικό σας και κάνετε κλικ στο Να επιτραπεί. Η εφαρμογή τότε ενεργεί ως εσείς, με ακριβώς τα δικαιώματά σας σε αυτόν τον ιστότοπο. Οι συνδεδεμένες εφαρμογές εμφανίζονται στον Πίνακα ελέγχου, όπου η καθεμία μπορεί να αποσυνδεθεί. Η απενεργοποίηση τις αποσυνδέει όλες αμέσως."
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_LABEL="Διάρκεια ζωής διακριτικού πρόσβασης (δευτερόλεπτα)"
COM_CSMCPFORJ_CONFIG_OAUTH_ACCESS_TTL_DESC="Πόσο διαρκεί κάθε διακριτικό πρόσβασης πριν το ανανεώσει αθόρυβα η εφαρμογή. Προεπιλογή 3600 (μία ώρα). Από 300 έως 86400."
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_LABEL="Παραμονή σε σύνδεση για (ημέρες)"
COM_CSMCPFORJ_CONFIG_OAUTH_REFRESH_DAYS_DESC="Για πόσο μια εφαρμογή μπορεί να συνεχίσει να ανανεώνει χωρίς ο χρήστης να συνδεθεί ξανά. Κάθε ανανέωση μηδενίζει τον χρόνο. Προεπιλογή 30."
COM_CSMCPFORJ_DASHBOARD_OAUTH_HEADING="Σύνδεση εφαρμογών AI μέσω σύνδεσης χρήστη"
COM_CSMCPFORJ_DASHBOARD_OAUTH_OFF="Ορισμένες εφαρμογές AI, όπως το ChatGPT και το claude.ai, μπορούν να συνδεθούν σε έναν ιστότοπο μόνο στέλνοντάς σας στη σελίδα σύνδεσης εκείνου του ιστότοπου. Αυτό είναι απενεργοποιημένο εδώ, οπότε αυτές οι εφαρμογές δεν μπορούν ακόμη να συνδεθούν. Ενεργοποιήστε τη <strong>Σύνδεση OAuth</strong> στις Επιλογές για να το επιτρέψετε. Οι συνδέσεις με κλειδί API συνεχίζουν να λειτουργούν σε κάθε περίπτωση."
COM_CSMCPFORJ_DASHBOARD_OAUTH_ENABLE="Άνοιγμα Επιλογών για ενεργοποίηση"
COM_CSMCPFORJ_DASHBOARD_OAUTH_ON="Δεν χρειάζεται κλειδί API. Το μόνο που αντιγράφετε είναι η <strong>URL τελικού σημείου</strong> αυτού του ιστότοπου."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_RUNNING="Γίνεται έλεγχος ότι οι εφαρμογές AI βρίσκουν τη σελίδα σύνδεσης αυτού του ιστότοπου&hellip;"
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OK="<strong>Έτοιμο.</strong> Οι εφαρμογές AI βρίσκουν τη σελίδα σύνδεσης αυτού του ιστότοπου."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_FAIL="<strong>Δεν είναι έτοιμο.</strong> Οι εφαρμογές AI δεν βρίσκουν τη σελίδα σύνδεσης αυτού του ιστότοπου, οπότε δεν θα μπορούν να συνδεθούν. Για να το διορθώσετε, ενεργοποιήστε την <strong>Αναδιατύπωση URL</strong> στο Σύστημα &rarr; Γενικές Ρυθμίσεις και βεβαιωθείτε ότι το αρχείο .htaccess του ιστότοπου είναι στη θέση του. Η ενότητα Αντιμετώπιση προβλημάτων του Οδηγού ρύθμισης έχει τις λεπτομέρειες."
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_HEADING="Συνδεδεμένες εφαρμογές"
COM_CSMCPFORJ_DASHBOARD_OAUTH_APPS_NONE="Δεν υπάρχουν ακόμη συνδεδεμένες εφαρμογές AI. Μια εφαρμογή εμφανίζεται εδώ αφού κάποιος συνδεθεί και κάνει κλικ στο Να επιτραπεί."
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_APP="Εφαρμογή"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_USER="Συνδεδεμένος ως"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_CONNECTED="Συνδέθηκε"
COM_CSMCPFORJ_DASHBOARD_OAUTH_COL_LAST_USED="Τελευταία χρήση"
COM_CSMCPFORJ_DASHBOARD_OAUTH_REVOKE="Αποσύνδεση"
COM_CSMCPFORJ_OAUTH_REVOKED="Η εφαρμογή αποσυνδέθηκε. Χάνει την πρόσβαση στο αμέσως επόμενο αίτημά της και πρέπει να εγκριθεί ξανά για να επανασυνδεθεί."
COM_CSMCPFORJ_OAUTH_REVOKE_NOTHING="Αυτή η εφαρμογή δεν είχε ενεργή πρόσβαση για αποσύνδεση."
COM_CSMCPFORJ_ACTIONLOG_OAUTH_CONSENT="Ο χρήστης <a href=&quot;{accountlink}&quot;>{username}</a> συνέδεσε την εφαρμογή &ldquo;{title}&rdquo; στο MCP for J (OAuth)"
COM_CSMCPFORJ_ACTIONLOG_OAUTH_REVOKE="Ο χρήστης <a href=&quot;{accountlink}&quot;>{username}</a> αποσύνδεσε την εφαρμογή &ldquo;{title}&rdquo; από το MCP for J (OAuth)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_HEADING="Σύνδεση μέσω σύνδεσης χρήστη (το ευκολότερο)"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_INTRO="Δεν υπάρχει κλειδί API για αντιγραφή. Στην εφαρμογή AI σας, προσθέστε μια σύνδεση και επικολλήστε την <strong>URL τελικού σημείου</strong> αυτού του ιστότοπου (παρακάτω). Όταν κάνετε κλικ στο Connect, η εφαρμογή ανοίγει μόνη της τη σελίδα σύνδεσης αυτού του ιστότοπου: συνδεθείτε με το όνομα χρήστη και τον κωδικό σας για αυτόν τον ιστότοπο και έπειτα κάντε κλικ στο <strong>Να επιτραπεί</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_AI="<strong>claude.ai και Claude Desktop:</strong> <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>. Δώστε ένα όνομα, επικολλήστε την URL τελικού σημείου και κάντε κλικ στο Continue. Κρατήστε το <em>Sign in now</em>· για τον πελάτη OAuth λειτουργούν και το <em>Use Claude's published identity</em> και το <em>Register automatically</em>. Μην προσθέσετε κεφαλίδες αιτήματος. Κάντε κλικ στο Add και έπειτα στο <strong>Connect</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CHATGPT="<strong>ChatGPT:</strong> <strong>Plugins</strong> στην αριστερή πλευρική στήλη &rarr; <strong>Add</strong> (πάνω δεξιά) &rarr; <strong>Add custom MCP server</strong>. Δώστε ένα όνομα, επικολλήστε την URL τελικού σημείου, αφήστε το Authentication σε <strong>OAuth</strong>, τσεκάρετε το πλαίσιο, κάντε κλικ στο <strong>Create as a plugin</strong> και έπειτα στο <strong>Connect</strong>. Απαιτεί επί πληρωμή πρόγραμμα ChatGPT (το Plus λειτουργεί)."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLAUDE_CODE="<strong>Claude Code:</strong> <code>claude mcp add --transport http joomla &lt;Endpoint URL&gt;</code>, έπειτα πληκτρολογήστε <code>/mcp</code>, επιλέξτε τον διακομιστή και επιλέξτε <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_VSCODE="<strong>VS Code + GitHub Copilot:</strong> Παλέτα εντολών &rarr; <strong>MCP: Add Server</strong> &rarr; HTTP &rarr; επικολλήστε την URL τελικού σημείου. Το VS Code σας ζητά να συνδεθείτε."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CURSOR="<strong>Cursor:</strong> προσθέστε <code>{&quot;url&quot;: &quot;&lt;Endpoint URL&gt;&quot;}</code> κάτω από το <code>mcpServers</code> στο <code>mcp.json</code> (χωρίς κεφαλίδες) και έπειτα κάντε κλικ στο <strong>Login</strong> δίπλα στον διακομιστή στο Settings &rarr; MCP."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_GEMINI="<strong>Gemini CLI:</strong> προσθέστε <code>&quot;httpUrl&quot;: &quot;&lt;Endpoint URL&gt;&quot;</code> για τον διακομιστή στο <code>settings.json</code> και έπειτα εκτελέστε <code>/mcp auth &lt;name&gt;</code>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CODEX="<strong>Codex:</strong> <code>codex mcp add joomla --url &lt;Endpoint URL&gt;</code>. Το Codex ανοίγει μόνο του τη σελίδα σύνδεσης (αν όχι, εκτελέστε <code>codex mcp login joomla</code>). Κάντε κλικ στο Να επιτραπεί μέσα σε λίγα λεπτά, σε πρόγραμμα περιήγησης στον ίδιο υπολογιστή με το Codex. Αν το πρόγραμμα περιήγησης πει μετά ότι το 127.0.0.1 αρνήθηκε τη σύνδεση, χρησιμοποιήστε <code>codex mcp login joomla --no-browser</code> και επικολλήστε τη διεύθυνση εκείνης της σελίδας στο τερματικό ή συνεχίστε με τη μέθοδο κλειδιού API παρακάτω."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_CLIENT_CLINE="<strong>Cline:</strong> MCP Servers &rarr; Remote Servers &rarr; Streamable HTTP, επικολλήστε την URL τελικού σημείου και έπειτα κάντε κλικ στο <strong>Authenticate</strong>."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_CONSENT_NOTE="Όταν κάνετε κλικ στο Να επιτραπεί, η εφαρμογή ενεργεί ως ο λογαριασμός με τον οποίο συνδεθήκατε και μπορεί να κάνει ακριβώς ό,τι μπορεί εκείνος ο λογαριασμός σε αυτόν τον ιστότοπο, συμπεριλαμβανομένων αλλαγών αν ο λογαριασμός τις επιτρέπει. Οι Administrators και Managers χρειάζονται πρώτα το δικαίωμα <em>Υπηρεσίες Διαδικτύου Είσοδος</em> (δείτε τα Δικαιώματα στον Πίνακα ελέγχου). Κάθε συνδεδεμένη εφαρμογή εμφανίζεται στον Πίνακα ελέγχου, όπου μπορεί να αποσυνδεθεί αμέσως."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_ON_ADVANCED_NOTE="Προτιμάτε κλειδί API ή ο πελάτης σας δεν μπορεί να ανοίξει πρόγραμμα περιήγησης; Η μέθοδος κλειδιού API στη <strong>Ρύθμιση για προχωρημένους</strong> παρακάτω λειτουργεί ακόμη για κάθε πελάτη."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_INTRO="Το ChatGPT (&ldquo;Add custom MCP server&rdquo;) και το claude.ai / Claude Desktop (&ldquo;Add custom connector&rdquo;) μπορούν να συνδεθούν μόνο στέλνοντάς σας στη σελίδα σύνδεσης αυτού του ιστότοπου. Αυτό είναι απενεργοποιημένο εδώ. Όταν είναι ενεργό, η σύνδεση γίνεται έτσι: επικολλάτε τη διεύθυνση αυτού του ιστότοπου στην εφαρμογή, συνδέεστε, κάνετε κλικ στο Να επιτραπεί."
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ENABLE_LINK="Ενεργοποιήστε το στις Επιλογές"
COM_CSMCPFORJ_SETUPGUIDE_OAUTH_OFF_ASK_ADMIN="Ζητήστε από έναν Super User να ενεργοποιήσει τη <strong>Σύνδεση OAuth</strong> στις Επιλογές του MCP for J. Μέχρι τότε, χρησιμοποιήστε τη μέθοδο κλειδιού API παρακάτω."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE_OAUTH="Το ευκολότερο: το παράθυρο &ldquo;Add custom connector&rdquo; του Claude λειτουργεί σε αυτόν τον ιστότοπο."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY_OAUTH="Η σύνδεση χρήστη είναι ενεργή σε αυτόν τον ιστότοπο, οπότε στο Claude Desktop ή στο claude.ai μεταβείτε στο <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, επικολλήστε τη διεύθυνση MCP αυτού του ιστότοπου, κάντε κλικ στο Continue, κρατήστε τις ρυθμίσεις σύνδεσης που εντοπίζει, κάντε κλικ στο Add και έπειτα στο Connect, συνδεθείτε με το όνομα χρήστη και τον κωδικό σας για αυτόν τον ιστότοπο και κάντε κλικ στο Να επιτραπεί. Η μέθοδος αρχείου ρυθμίσεων παρακάτω χρειάζεται μόνο αν προτιμάτε κλειδί API."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY_OAUTH="Το claude.ai συνδέεται μόνιμα μέσω του <strong>Add custom connector</strong>: <strong>Customize</strong> &rarr; <strong>Connectors</strong> &rarr; <strong>Add</strong> &rarr; <strong>Add custom connector</strong>, επικολλήστε τη διεύθυνση MCP αυτού του ιστότοπου, κάντε κλικ στο Continue, κρατήστε τις ρυθμίσεις σύνδεσης που εντοπίζει, κάντε κλικ στο Add και έπειτα στο Connect. Συνδεθείτε με το όνομα χρήστη και τον κωδικό σας για αυτόν τον ιστότοπο και κάντε κλικ στο Να επιτραπεί. Η σύνδεση μένει διαθέσιμη σε κάθε συνομιλία."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY_OAUTH="Στο ChatGPT, κάντε κλικ στο <strong>Plugins</strong> στην αριστερή πλευρική στήλη και έπειτα στο <strong>Add</strong> (πάνω δεξιά) &rarr; <strong>Add custom MCP server</strong>. Δώστε ένα όνομα (π.χ. &ldquo;Ο ιστότοπός μου Joomla&rdquo;), επικολλήστε τη διεύθυνση MCP αυτού του ιστότοπου, αφήστε το Authentication σε <strong>OAuth</strong>, τσεκάρετε το &ldquo;I understand and want to continue&rdquo; και κάντε κλικ στο <strong>Create as a plugin</strong>. Κάντε κλικ στο <strong>Connect</strong> και το ChatGPT ανοίγει τη σελίδα σύνδεσης αυτού του ιστότοπου: συνδεθείτε με το όνομα χρήστη και τον κωδικό σας για αυτόν τον ιστότοπο και κάντε κλικ στο Να επιτραπεί. Έπειτα, σε μια συνομιλία, πληκτρολογήστε <strong>@</strong> και επιλέξτε το plugin. Δεν υπάρχει κλειδί API για επικόλληση."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY_OAUTH="Το παράθυρο &ldquo;Add custom connector&rdquo; συνδέεται αλλά η σύνδεση χρήστη αποτυγχάνει"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY_OAUTH="Ελέγξτε με τη σειρά: (1) ο λογαριασμός με τον οποίο συνδεθήκατε επιτρέπεται να χρησιμοποιεί το MCP &mdash; οι Administrators χρειάζονται το <em>Υπηρεσίες Διαδικτύου Είσοδος</em> και οι Managers αυτό συν το <em>Χρήση τελικού σημείου MCP</em> στις Επιλογές &rarr; Δικαιώματα (δείτε την κάρτα <em>Ποιος μπορεί να χρησιμοποιήσει αυτό το τελικό σημείο;</em> στον Πίνακα ελέγχου)· η σελίδα σύνδεσης σάς ενημερώνει αν δεν επιτρέπεται· (2) η κάρτα &ldquo;Σύνδεση εφαρμογών AI μέσω σύνδεσης χρήστη&rdquo; του Πίνακα ελέγχου γράφει <strong>Έτοιμο</strong>· (3) το τείχος προστασίας σας αφήνει τους διακομιστές της εφαρμογής να φτάσουν στον ιστότοπο (δείτε την επόμενη καταχώριση). Μην εισαγάγετε αναγνωριστικό ή μυστικό πελάτη: η εφαρμογή εγγράφεται μόνη της. (4) Κάντε κλικ στο Να επιτραπεί λίγο μετά το άνοιγμα της σελίδας σύνδεσης: οι εφαρμογές εγκαταλείπουν μια σύνδεση μετά από λίγο (το Codex μετά από περίπου 5 λεπτά) και ένα καθυστερημένο Να επιτραπεί καταλήγει σε σφάλμα. Ξεκινήστε ξανά το Connect και θα λειτουργήσει."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_SUMMARY="Το claude.ai ή το ChatGPT δεν φτάνει στον ιστότοπο ή η σύνδεση σταματά στη μέση"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_FIREWALL_BODY="Το claude.ai και το ChatGPT συνδέονται από τους δικούς τους διακομιστές, όχι από το πρόγραμμα περιήγησής σας, οπότε ο ιστότοπος πρέπει να είναι προσβάσιμος μέσω δημόσιου HTTPS. Ένα τείχος προστασίας εφαρμογών web (RSFirewall, Admin Tools, Cloudflare, CSF, ModSecurity, Imunify360 ή τείχος προστασίας του παρόχου, όπως το o2switch TigerProtect που απαντά 503) μπορεί να μπλοκάρει αυτά τα αιτήματα. Επιτρέψτε τα αιτήματα προς <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-authorization-server</code>, <code>/.well-known/oauth-protected-resource</code> και <code>index.php?csmcpforj_oauth=&hellip;</code> (τα τελικά σημεία εγγραφής, διακριτικού και ανάκλησης). Στο RSFirewall αρκούν αυτές οι δύο εξαιρέσεις: <code>csmcpforj_oauth</code> και <code>api\/index\.php\/v1\/mcp</code> ως κανονική έκφραση. Το claude.ai συνδέεται από το <code>160.79.104.0/21</code>. <strong>Cloudflare</strong>: τα Browser Integrity Check και Security Level μπορεί να μπλοκάρουν τους διακομιστές των εφαρμογών. Προσθέστε έναν προσαρμοσμένο κανόνα WAF (Security &rarr; WAF &rarr; Custom rules) με ενέργεια <strong>Skip</strong> για αιτήματα των οποίων η διαδρομή URI περιέχει <code>/api/index.php/v1/mcp</code> ή <code>/.well-known/oauth-</code>, ή των οποίων η συμβολοσειρά ερωτήματος περιέχει <code>csmcpforj_oauth</code>, και τσεκάρετε τα <em>Browser Integrity Check</em> και <em>Security Level</em>. Το Bot Fight Mode δεν παρακάμπτεται με κανόνα, οπότε απενεργοποιήστε το αν μπλοκάρει. Το <strong>Route 66</strong> και άλλες επεκτάσεις SEO που ξαναγράφουν διευθύνσεις URL μπορεί να πιάνουν τις διευθύνσεις σύνδεσης (<code>index.php?csmcpforj_oauth=&hellip;</code>) και να απαντούν με την αρχική σελίδα, οπότε η εφαρμογή δεν μπορεί να εγγραφεί και δεν δίνει σαφή λόγο. Αν ο <strong>Έλεγχος σύνδεσης</strong> δείχνει την αρχική σελίδα για τα τελικά σημεία σύνδεσης, εξαιρέστε τις διευθύνσεις URL που περιέχουν <code>csmcpforj_oauth</code> σε εκείνη την επέκταση ή απενεργοποιήστε το πρόσθετο συστήματός της. Η ίδια η σελίδα σύνδεσης ανοίγει στο δικό σας πρόγραμμα περιήγησης."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_SUMMARY="Ο Πίνακας ελέγχου λέει ότι οι εφαρμογές AI δεν βρίσκουν τη σελίδα σύνδεσης αυτού του ιστότοπου (Δεν είναι έτοιμο)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_WELLKNOWN_BODY="Οι πελάτες AI αναζητούν τα στοιχεία σύνδεσης στο <code>/.well-known/oauth-authorization-server</code> του τομέα σας. Το Joomla απαντά εκεί μόνο όταν είναι ενεργή η Γενικές Ρυθμίσεις &rarr; <strong>Αναδιατύπωση URL</strong> και το <code>.htaccess</code> του ιστότοπου είναι στη θέση του (μετονομάστε το <code>htaccess.txt</code>) ή όταν το nginx στέλνει τις άγνωστες διαδρομές στο <code>index.php</code>. Αυτό δεν επηρεάζει το AutoSSL του cPanel, που χρησιμοποιεί το <code>/.well-known/acme-challenge/</code>. Ένας ιστότοπος εγκατεστημένος σε υποφάκελο (για παράδειγμα <code>example.com/joomla</code>) χρειάζεται επίσης έναν κανόνα στη ρίζα του τομέα που στέλνει το <code>/.well-known/oauth-authorization-server/joomla</code> στον υποφάκελο."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_SUMMARY="Σύνδεση από διακομιστή ή μηχάνημα χωρίς πρόγραμμα περιήγησης"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_HEADLESS_BODY="Οι πελάτες επιφάνειας εργασίας (Claude Code, Codex, Cursor, Gemini CLI) ανοίγουν πρόγραμμα περιήγησης στο ίδιο μηχάνημα και περιμένουν την απάντηση σε μια τοπική διεύθυνση, οπότε η σύνδεση OAuth χρειάζεται πρόγραμμα περιήγησης εκεί. Σε διακομιστή χωρίς γραφικό περιβάλλον ή μέσω SSH, χρησιμοποιήστε αντί γι' αυτό τη μέθοδο κλειδιού API στη Ρύθμιση για προχωρημένους· λειτουργεί παντού."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP1="Στην εφαρμογή AI, προσθέστε μια νέα σύνδεση (claude.ai και Claude Desktop: Customize &rarr; Connectors &rarr; Add &rarr; Add custom connector· ChatGPT: Plugins &rarr; Add &rarr; Add custom MCP server) και επικολλήστε αυτή την <strong>URL τελικού σημείου</strong>: %s"
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP2="<strong>Κάντε κλικ στο Connect.</strong> Η εφαρμογή ανοίγει μόνη της τη σελίδα σύνδεσης αυτού του ιστότοπου. Συνδεθείτε με το όνομα χρήστη και τον κωδικό σας για αυτόν τον ιστότοπο."
COM_CSMCPFORJ_DASHBOARD_OAUTH_STEP3="<strong>Κάντε κλικ στο Να επιτραπεί.</strong> Επιστρέφετε στην εφαρμογή, συνδεδεμένοι. Η εφαρμογή μπορεί να κάνει ό,τι επιτρέπεται στον λογαριασμό σας σε αυτόν τον ιστότοπο."
COM_CSMCPFORJ_DASHBOARD_CONNECT_HEADING="Συνδέστε μια εφαρμογή AI σε αυτόν τον ιστότοπο"
COM_CSMCPFORJ_DASHBOARD_CONNECT_INTRO="Υπάρχουν τρεις τρόποι. Κάντε κλικ σε έναν για να ανοίξουν τα αριθμημένα βήματά του. Οι περισσότεροι θέλουν τον πρώτο."
COM_CSMCPFORJ_DASHBOARD_WAY1_SUMMARY="1. Σύνδεση χρήστη (το ευκολότερο) &mdash; ChatGPT, claude.ai, Claude Desktop και οι περισσότερες άλλες εφαρμογές AI"
COM_CSMCPFORJ_DASHBOARD_WAY2_SUMMARY="2. Επικόλληση εντολής ρύθμισης &mdash; για συνομιλία AI που μπορεί να εκτελεί εντολές"
COM_CSMCPFORJ_DASHBOARD_WAY3_SUMMARY="3. Αρχείο ρυθμίσεων ή γραμμή εντολών &mdash; Claude Code, Cursor, Codex, VS Code, Gemini CLI και άλλα"
COM_CSMCPFORJ_DASHBOARD_WAY2_INTRO="Λειτουργεί σε εφαρμογές AI που μπορούν να εκτελούν εντολές (Codex, Claude Code, Cursor, Cline, Copilot σε λειτουργία agent και παρόμοια). Το AI δοκιμάζει μόνο του τη σύνδεση και μπορεί να προσφερθεί να την κάνει μόνιμη."
COM_CSMCPFORJ_DASHBOARD_WAY3_INTRO="Για εφαρμογές που ρυθμίζετε με αρχείο ρυθμίσεων ή εντολή. Το κάνετε μία φορά και μένει συνδεδεμένη."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_STEP="<strong>Πάρτε το διακριτικό API σας.</strong> Κάντε κλικ στο κουμπί: το προφίλ χρήστη σας ανοίγει σε νέα καρτέλα. Ανοίξτε την καρτέλα <strong>Διακριτικό Joomla API</strong>, κάντε κλικ στο εικονίδιο του ματιού για να εμφανιστεί το διακριτικό και αντιγράψτε το. Έπειτα επιστρέψτε σε αυτή την καρτέλα."
COM_CSMCPFORJ_DASHBOARD_GET_TOKEN_BTN="Λήψη του διακριτικού API μου (ανοίγει νέα καρτέλα)"
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_COPY="<strong>Αντιγράψτε την εντολή.</strong> Το διακριτικό σας είναι ήδη μέσα."
COM_CSMCPFORJ_DASHBOARD_WAY2_STEP_PASTE="<strong>Επικολλήστε την σε μια νέα συνομιλία</strong> με την εφαρμογή AI σας και στείλτε. Το AI δοκιμάζει τη σύνδεση και, αν μπορεί, προσφέρεται να την κάνει μόνιμη."
COM_CSMCPFORJ_DASHBOARD_WAY3_STEP_COPY="<strong>Αντιγράψτε τη ρύθμιση.</strong> Το διακριτικό σας είναι ήδη μέσα."
COM_CSMCPFORJ_DASHBOARD_WAY3_GUIDE_LINK="Οδηγίες βήμα προς βήμα για κάθε εφαρμογή υπάρχουν στον Οδηγό ρύθμισης &rarr;"
