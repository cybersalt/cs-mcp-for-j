COM_CSMCPFORJ_SUPPORT_SENT_SUCCESS="Το μήνυμα υποστήριξης %s στάλθηκε στο support@cybersalt.com. Θα σας απαντήσουμε το συντομότερο δυνατό &mdash; ελέγξτε το email απάντησης που δώσατε."
COM_CSMCPFORJ_SUPPORT_ERROR_NOT_LOGGED_IN="Πρέπει να είστε συνδεδεμένοι για να στείλετε μήνυμα υποστήριξης."
COM_CSMCPFORJ_SUPPORT_ERROR_INVALID_TYPE="Επιλέξτε έναν έγκυρο τύπο μηνύματος από τη λίστα."
COM_CSMCPFORJ_SUPPORT_ERROR_SUBJECT_TOO_SHORT="Το θέμα πρέπει να έχει τουλάχιστον %d χαρακτήρες."
COM_CSMCPFORJ_SUPPORT_ERROR_SUBJECT_TOO_LONG="Το θέμα πρέπει να έχει το πολύ %d χαρακτήρες."
COM_CSMCPFORJ_SUPPORT_ERROR_DESCRIPTION_TOO_SHORT="Το μήνυμα πρέπει να έχει τουλάχιστον %d χαρακτήρες &mdash; δώστε μας αρκετό πλαίσιο για να βοηθήσουμε."
COM_CSMCPFORJ_SUPPORT_ERROR_DESCRIPTION_TOO_LONG="Το μήνυμα πρέπει να έχει το πολύ %d χαρακτήρες. Αν έχετε πολύ πλαίσιο, επισυνάψτε το στο email απάντησής σας."
COM_CSMCPFORJ_SUPPORT_ERROR_INVALID_EMAIL="Δώστε μια έγκυρη διεύθυνση email απάντησης."
COM_CSMCPFORJ_SUPPORT_ERROR_MAILER_FAILED="Λυπούμαστε, δεν ήταν δυνατή η αποστολή του μηνύματός σας αυτή τη στιγμή. Η ρύθμιση αλληλογραφίας του ιστότοπού σας ίσως έχει πρόβλημα. Λεπτομέρειες σφάλματος: %s &mdash; στο μεταξύ μπορείτε να μας γράψετε απευθείας στο support@cybersalt.com."

