COM_CSMCPFORJ_SUPPORT_METADATA_HEADING="Πληροφορίες που θα επισυνάψουμε"
COM_CSMCPFORJ_SUPPORT_METADATA_INTRO="Αυτά τα στοιχεία περιβάλλοντος στέλνονται μαζί με το μήνυμά σας ώστε να μη χρειαστεί να σας τα ζητήσουμε. Τίποτε άλλο &mdash; χωρίς κωδικούς πρόσβασης, χωρίς διακριτικά, χωρίς προσωπικά δεδομένα πέρα από το όνομα και το email σας στο Joomla."
