; 2.10.x field report (agency user, 31 Oct 2026): #2, #51, #52, #53, #54
COM_CSMCPFORJ_DASHBOARD_FIELD_LOGIN_OFF="Το claude.ai και το ChatGPT δεν μπορούν να συνδεθούν."
COM_CSMCPFORJ_DASHBOARD_OAUTH_REFUSED_TITLE="Μια εφαρμογή AI προσπάθησε να συνδεθεί μέσω σύνδεσης χρήστη."
COM_CSMCPFORJ_DASHBOARD_OAUTH_REFUSED_BODY="Αυτός ο ιστότοπος απέρριψε %d αιτήματα σύνδεσης τις τελευταίες 24 ώρες επειδή η σύνδεση OAuth είναι απενεργοποιημένη. Το claude.ai το αναφέρει ως &ldquo;cannot register&rdquo;. Ενεργοποιήστε την και έπειτα συνδεθείτε ξανά από την εφαρμογή."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OFF_OK="Απενεργοποιημένη, οπότε το claude.ai και το ChatGPT δεν μπορούν ακόμη να συνδεθούν. Η ίδια η διεύθυνση σύνδεσης λειτουργεί, οπότε αρκεί μόνο η ενεργοποίηση."
COM_CSMCPFORJ_DASHBOARD_OAUTH_SELFTEST_OFF_FAIL="Απενεργοποιημένη. Επίσης οι εφαρμογές AI δεν φτάνουν στη διεύθυνση σύνδεσης αυτού του ιστότοπου, οπότε μετά την ενεργοποίηση, ενεργοποιήστε την <strong>Αναδιατύπωση URL</strong> στο Σύστημα &rarr; Γενικές Ρυθμίσεις και βεβαιωθείτε ότι το αρχείο .htaccess του ιστότοπου είναι στη θέση του."
COM_CSMCPFORJ_DASHBOARD_CLAUDE_CHECKLIST_LINK="Συνδέετε το claude.ai; Δείτε τη λίστα ελέγχου &rarr;"
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_TITLE="403, 503 ή &ldquo;Malware detected&rdquo; από τον ιστότοπο"
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_FIREWALL_BODY="Ένα τείχος προστασίας μπλοκάρει το αίτημα πριν το δει το MCP for J. Κάντε κλικ στον <strong>Έλεγχο σύνδεσης</strong> παραπάνω για να δείτε ποια διεύθυνση μπλοκάρεται. Στο RSFirewall, προσθέστε εξαιρέσεις για <code>csmcpforj_oauth</code> και <code>api\/index\.php\/v1\/mcp</code> (κανονική έκφραση). Τα τείχη προστασίας του παρόχου (o2switch TigerProtect, Imunify360) χρειάζονται τις ίδιες διευθύνσεις να επιτρέπονται. <strong>Cloudflare</strong>: τα Browser Integrity Check και Security Level μπορεί να μπλοκάρουν τους διακομιστές των εφαρμογών. Προσθέστε έναν προσαρμοσμένο κανόνα WAF (Security &rarr; WAF &rarr; Custom rules) με ενέργεια <strong>Skip</strong> για αιτήματα των οποίων η διαδρομή URI περιέχει <code>/api/index.php/v1/mcp</code> ή <code>/.well-known/oauth-</code>, ή των οποίων η συμβολοσειρά ερωτήματος περιέχει <code>csmcpforj_oauth</code>, και τσεκάρετε τα <em>Browser Integrity Check</em> και <em>Security Level</em>. Το Bot Fight Mode δεν παρακάμπτεται με κανόνα, οπότε απενεργοποιήστε το αν μπλοκάρει."
COM_CSMCPFORJ_DASHBOARD_TROUBLESHOOT_CLAUDE_TITLE="Το claude.ai λέει &ldquo;cannot register&rdquo; ή η εξουσιοδότηση απέτυχε"

; Check connection (#2). The details are shown as plain text, so no HTML or entities in them.
COM_CSMCPFORJ_CHECK_HINT="Ελέγξτε ότι οι εφαρμογές AI φτάνουν σε αυτόν τον ιστότοπο. Ο διακομιστής web ρωτά τη δική του δημόσια διεύθυνση ό,τι ρωτά μια εφαρμογή κατά τη σύνδεση. Δεν αλλάζει τίποτα."
COM_CSMCPFORJ_CHECK_BTN="Έλεγχος σύνδεσης"
COM_CSMCPFORJ_CHECK_RUNNING="Έλεγχος..."
COM_CSMCPFORJ_CHECK_FAILED="Ο ίδιος ο έλεγχος απέτυχε. Επαναφορτώστε τη σελίδα και δοκιμάστε ξανά."
COM_CSMCPFORJ_CHECK_ENDPOINT="Τελικό σημείο MCP"
COM_CSMCPFORJ_CHECK_DISCOVERY="Στοιχεία σύνδεσης (/.well-known/oauth-protected-resource)"
COM_CSMCPFORJ_CHECK_OAUTH_ENDPOINTS="Τελικά σημεία σύνδεσης (index.php?csmcpforj_oauth=...)"
COM_CSMCPFORJ_CHECK_OK_ENDPOINT="Προσβάσιμο. Ζητά από τις εφαρμογές να συνδεθούν ή να στείλουν διακριτικό, όπως πρέπει."
COM_CSMCPFORJ_CHECK_OK_DISCOVERY="Προσβάσιμο. Οι εφαρμογές μπορούν να μάθουν πώς να συνδεθούν."
COM_CSMCPFORJ_CHECK_OK_OAUTH="Προσβάσιμο. Οι εφαρμογές μπορούν να συνδεθούν εδώ."
COM_CSMCPFORJ_CHECK_OK_OFF="Προσβάσιμο. Λέει στις εφαρμογές ότι η σύνδεση είναι απενεργοποιημένη, που είναι σωστό όσο η σύνδεση OAuth είναι απενεργοποιημένη."
COM_CSMCPFORJ_CHECK_REDIRECT="Ανακατεύθυνση (HTTP %d) προς %s. Οι εφαρμογές AI πρέπει να χρησιμοποιούν ακριβώς τη διεύθυνση στην οποία απαντά ο ιστότοπος, χωρίς ανακατεύθυνση. Χρησιμοποιήστε εκείνη τη διεύθυνση στην εφαρμογή ή αλλάξτε τον ιστότοπο ώστε να μην κάνει ανακατεύθυνση."
COM_CSMCPFORJ_CHECK_UNEXPECTED="Απάντησε κάτι άλλο εκτός από το MCP for J (HTTP %d): '%s'. Η συνήθης αιτία είναι ένα τείχος προστασίας· δείτε την Αντιμετώπιση προβλημάτων παρακάτω."
COM_CSMCPFORJ_CHECK_CLOUDFLARE="Αυτός ο ιστότοπος βρίσκεται πίσω από το Cloudflare. Αν εκείνη η απάντηση είναι σελίδα του Cloudflare, προσθέστε έναν προσαρμοσμένο κανόνα WAF με ενέργεια Skip για τις διευθύνσεις MCP και σύνδεσης, τσεκάροντας τα Browser Integrity Check και Security Level (δείτε την Αντιμετώπιση προβλημάτων παρακάτω)."
COM_CSMCPFORJ_CHECK_UNREACHABLE="Ο διακομιστής web δεν μπόρεσε να φτάσει στη δική του δημόσια διεύθυνση (%s). Ορισμένοι πάροχοι δεν το επιτρέπουν, οπότε αυτός ο έλεγχος δεν μπορεί να αποφανθεί. Δοκιμάστε να συνδεθείτε από την εφαρμογή και δείτε τα Αρχεία καταγραφής."

; Firewalls switched on (#2)
COM_CSMCPFORJ_FIREWALL_HEADING="Τείχος προστασίας και επεκτάσεις URL"
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_TITLE="Το RSFirewall είναι ενεργό."
COM_CSMCPFORJ_FIREWALL_RSFIREWALL_BODY="Μπορεί να μπλοκάρει αιτήματα MCP (&ldquo;403 Access Forbidden &mdash; Malware detected&rdquo;) και τη σύνδεση του claude.ai. Στο RSFirewall, προσθέστε δύο εξαιρέσεις: <code>csmcpforj_oauth</code> και <code>api\/index\.php\/v1\/mcp</code> ως κανονική έκφραση."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_TITLE="Το Admin Tools είναι ενεργό."
COM_CSMCPFORJ_FIREWALL_ADMINTOOLS_BODY="Το Web Application Firewall του μπορεί να μπλοκάρει αιτήματα MCP και τη σύνδεση. Αν ο <strong>Έλεγχος σύνδεσης</strong> δείχνει μπλοκάρισμα, βρείτε τον κανόνα στο Blocked Requests Log του Admin Tools και προσθέστε εξαίρεση WAF ή απενεργοποιήστε εκείνον τον κανόνα. Επιτρέψτε τα <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> και τις διευθύνσεις URL που περιέχουν <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_TITLE="Το Securitycheck είναι ενεργό."
COM_CSMCPFORJ_FIREWALL_SECURITYCHECK_BODY="Το τείχος προστασίας του μπορεί να μπλοκάρει αιτήματα MCP και τη σύνδεση. Αν ο <strong>Έλεγχος σύνδεσης</strong> δείχνει μπλοκάρισμα, βρείτε το αίτημα στα αρχεία καταγραφής του και προσθέστε εξαίρεση για <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> και τις διευθύνσεις URL που περιέχουν <code>csmcpforj_oauth</code>."
COM_CSMCPFORJ_FIREWALL_ROUTE66_TITLE="Το Route 66 είναι ενεργό."
COM_CSMCPFORJ_FIREWALL_ROUTE66_BODY="Αυτή η επέκταση SEO μπορεί να πιάνει τις διευθύνσεις σύνδεσης (<code>index.php?csmcpforj_oauth=&hellip;</code>) και να απαντά με την αρχική σελίδα, οπότε το claude.ai ή το ChatGPT δεν μπορεί να εγγραφεί και δεν δίνει σαφή λόγο. Αν ο <strong>Έλεγχος σύνδεσης</strong> δείχνει την αρχική σελίδα για τα τελικά σημεία σύνδεσης, εξαιρέστε στο Route 66 τις διευθύνσεις URL που περιέχουν <code>csmcpforj_oauth</code> ή απενεργοποιήστε το πρόσθετο συστήματός του."
COM_CSMCPFORJ_FIREWALL_HOST_NOTE="Και τα τείχη προστασίας του παρόχου μπορούν να μπλοκάρουν: το o2switch TigerProtect απαντά 503 και οι κανόνες Imunify360, ModSecurity ή Cloudflare απαντούν 403. Ζητήστε από τον πάροχο να επιτρέψει τις παραπάνω διευθύνσεις ή να αφήσει να περνούν οι διακομιστές της Anthropic (<code>160.79.104.0/21</code>) για το claude.ai. <strong>Cloudflare</strong>: τα Browser Integrity Check και Security Level μπορεί να μπλοκάρουν τους διακομιστές των εφαρμογών. Προσθέστε έναν προσαρμοσμένο κανόνα WAF (Security &rarr; WAF &rarr; Custom rules) με ενέργεια <strong>Skip</strong> για αιτήματα των οποίων η διαδρομή URI περιέχει <code>/api/index.php/v1/mcp</code> ή <code>/.well-known/oauth-</code>, ή των οποίων η συμβολοσειρά ερωτήματος περιέχει <code>csmcpforj_oauth</code>, και τσεκάρετε τα <em>Browser Integrity Check</em> και <em>Security Level</em>. Το Bot Fight Mode δεν παρακάμπτεται με κανόνα, οπότε απενεργοποιήστε το αν μπλοκάρει."

; claude.ai checklist in the Setup Guide (#54)
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_SUMMARY="Λίστα ελέγχου claude.ai: &ldquo;cannot register&rdquo;, &ldquo;Authorization failed&rdquo; ή &ldquo;Couldn't reach the MCP server&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_INTRO="Ελέγξτε τα με τη σειρά. Το καθένα έχει κοστίσει σε κάποιον ώρες."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_URL="Χρησιμοποιήστε ακριβώς αυτή τη διεύθυνση: <code>%s</code>. Το αν έχει ή όχι <em>www</em> πρέπει να ταιριάζει με τον τρόπο που απαντά ο ιστότοπος, <strong>χωρίς ανακατεύθυνση</strong> ενδιάμεσα (από www στον σκέτο τομέα ή από http σε https). Το κουμπί <strong>Έλεγχος σύνδεσης</strong> του Πίνακα ελέγχου αναφέρει τυχόν ανακατεύθυνση."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_ON="Η σύνδεση OAuth είναι ενεργή σε αυτόν τον ιστότοπο. Το claude.ai μπορεί να συνδεθεί μόνο μέσω σύνδεσης χρήστη, οπότε πρέπει να μείνει ενεργή."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_OAUTH_OFF="<strong>Η σύνδεση OAuth είναι απενεργοποιημένη σε αυτόν τον ιστότοπο.</strong> Το claude.ai μπορεί να συνδεθεί μόνο μέσω σύνδεσης χρήστη, οπότε ένας Super User πρέπει πρώτα να την ενεργοποιήσει: Εφαρμογές &rarr; MCP for J &rarr; Επιλογές &rarr; <strong>Σύνδεση OAuth</strong>. Όσο είναι απενεργοποιημένη, το claude.ai λέει &ldquo;cannot register&rdquo;."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_CLIENT="Στο παράθυρο <strong>Add custom connector</strong>, επιλέξτε <strong>Sign in now</strong>. Για τον πελάτη OAuth λειτουργούν και το <strong>Use Claude's published identity</strong> και το <strong>Register automatically</strong> (η δημοσιευμένη ταυτότητα χρειάζεται την επέκταση curl της PHP στον διακομιστή). Αφήστε κενά το αναγνωριστικό και το μυστικό πελάτη. Αν ο ένας τρόπος αποτύχει, αφαιρέστε τη σύνδεση και προσθέστε την ξανά με τον άλλο."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_HEADERS="<strong>Μην προσθέτετε κεφαλίδες αιτήματος.</strong> Το claude.ai δεν δέχεται κεφαλίδα <code>X-Joomla-Token</code>, οπότε εκεί δεν μπορεί να χρησιμοποιηθεί κλειδί API. Η σύνδεση χρήστη είναι ο μόνος τρόπος εισόδου από το claude.ai."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_FIREWALL="Τα τείχη προστασίας πρέπει να αφήνουν να περνούν οι διακομιστές του claude.ai. Συνδέονται από το <code>160.79.104.0/21</code>, όχι από το πρόγραμμα περιήγησής σας. Το RSFirewall χρειάζεται δύο εξαιρέσεις: <code>csmcpforj_oauth</code> και <code>api\/index\.php\/v1\/mcp</code> ως κανονική έκφραση. Το Admin Tools, το Securitycheck και τείχη προστασίας του παρόχου όπως το o2switch TigerProtect (που απαντά 503) μπορούν επίσης να το μπλοκάρουν. <strong>Cloudflare</strong>: τα Browser Integrity Check και Security Level μπορεί να μπλοκάρουν τους διακομιστές των εφαρμογών. Προσθέστε έναν προσαρμοσμένο κανόνα WAF (Security &rarr; WAF &rarr; Custom rules) με ενέργεια <strong>Skip</strong> για αιτήματα των οποίων η διαδρομή URI περιέχει <code>/api/index.php/v1/mcp</code> ή <code>/.well-known/oauth-</code>, ή των οποίων η συμβολοσειρά ερωτήματος περιέχει <code>csmcpforj_oauth</code>, και τσεκάρετε τα <em>Browser Integrity Check</em> και <em>Security Level</em>. Το Bot Fight Mode δεν παρακάμπτεται με κανόνα, οπότε απενεργοποιήστε το αν μπλοκάρει. Το κουμπί <strong>Έλεγχος σύνδεσης</strong> του Πίνακα ελέγχου δείχνει τι απαντά."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_REWRITE="Το <strong>Route 66</strong> και άλλες επεκτάσεις SEO που ξαναγράφουν διευθύνσεις URL μπορεί να πιάνουν τις διευθύνσεις σύνδεσης (<code>index.php?csmcpforj_oauth=&hellip;</code>) και να απαντούν με την αρχική σελίδα, οπότε η εφαρμογή δεν μπορεί να εγγραφεί και δεν δίνει σαφή λόγο. Αν ο <strong>Έλεγχος σύνδεσης</strong> δείχνει την αρχική σελίδα για τα τελικά σημεία σύνδεσης, εξαιρέστε τις διευθύνσεις URL που περιέχουν <code>csmcpforj_oauth</code> σε εκείνη την επέκταση ή απενεργοποιήστε το πρόσθετο συστήματός της."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_CLAUDEAI_ACCOUNT="Συνδεθείτε με λογαριασμό που επιτρέπεται να χρησιμοποιεί το MCP (δείτε το <em>Ποιος μπορεί να χρησιμοποιήσει αυτό το τελικό σημείο;</em> στον Πίνακα ελέγχου). Αν αποτυγχάνει μόνο για ένα άτομο, ελέγξτε ότι ο λογαριασμός του δεν είναι αποκλεισμένος και δεν έχει ρύθμιση <em>Απαιτείται Αλλαγή Συνθηματικού</em>."
