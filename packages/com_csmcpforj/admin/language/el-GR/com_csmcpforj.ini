CS_INTEGRITY_PROBLEMS_BODY="Το %s δεν εγκαταστάθηκε πλήρως, οπότε μέρη του ίσως δεν λειτουργούν. Εγκαταστήστε ξανά το ίδιο πακέτο για να το επιδιορθώσετε. Αν η εγκατάσταση αποτύχει ξανά, κάποιο λογισμικό ασφαλείας στον διακομιστή (για παράδειγμα το Imunify360 Proactive Defense) ίσως μπλοκάρει το πρόγραμμα εγκατάστασης του Joomla: ελέγξτε το αρχείο συμβάντων του."
CS_INTEGRITY_CHANGED_TITLE="%1$d από %2$d αρχεία διαφέρουν από την έκδοση που κυκλοφόρησε."
CS_INTEGRITY_CHANGED_BODY="Αυτό συμβαίνει μετά από αποτυχημένη ενημέρωση ή όταν κάποιος επεξεργάζεται απευθείας τα αρχεία του %s. Εγκαταστήστε ξανά το ίδιο πακέτο για να τα επαναφέρετε."
CS_INTEGRITY_OK="Και τα %1$d αρχεία ταιριάζουν με την έκδοση που κυκλοφόρησε."
CS_INTEGRITY_NOLIST="Αυτή η έκδοση δεν έχει λίστα αρχείων, οπότε ο έλεγχος αρχείων δεν είναι διαθέσιμος."
