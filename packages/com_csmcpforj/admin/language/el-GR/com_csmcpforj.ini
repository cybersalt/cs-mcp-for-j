COM_CSMCPFORJ_LOGS_FOOTER="Οι ώρες εμφανίζονται στη ζώνη ώρας σας· το CSV και η εξαγωγή κειμένου χρησιμοποιούν UTC. Διακριτικά, κωδικοί, μυστικά πελατών και ορίσματα εργαλείων που μοιάζουν με κωδικούς πρόσβασης δεν γράφονται ποτέ σε αυτό το αρχείο. Οι εγγραφές που είναι παλαιότερες από την περίοδο διατήρησης που ορίζεται στις Επιλογές αφαιρούνται αυτόματα."
COM_CSMCPFORJ_CONFIG_LOGGING_FIELDSET_LABEL="Καταγραφή"
COM_CSMCPFORJ_CONFIG_LOGGING_FIELDSET_DESC="Τι καταγράφει το MCP for J στο Εφαρμογές &rarr; MCP for J &rarr; Αρχεία καταγραφής: βήματα σύνδεσης OAuth, απορριφθέντα διαπιστευτήρια (με τον λόγο), εφαρμογές AI που συνδέονται και κάθε κλήση εργαλείου."
COM_CSMCPFORJ_CONFIG_LOG_LEVEL_LABEL="Τι να καταγράφεται"
COM_CSMCPFORJ_CONFIG_LOG_LEVEL_DESC="Όλα: κάθε βήμα σύνδεσης και κλήση εργαλείου, που είναι ό,τι θέλετε όσο κάνετε ρύθμιση ή εντοπίζετε ένα πρόβλημα. Μόνο προειδοποιήσεις και σφάλματα: μόνο ό,τι πήγε στραβά. Απενεργοποιημένη: τίποτα."
COM_CSMCPFORJ_CONFIG_LOG_LEVEL_ALL="Όλα (προτείνεται)"
COM_CSMCPFORJ_CONFIG_LOG_LEVEL_PROBLEMS="Μόνο προειδοποιήσεις και σφάλματα"
COM_CSMCPFORJ_CONFIG_LOG_LEVEL_OFF="Απενεργοποιημένη"
COM_CSMCPFORJ_CONFIG_LOG_RETENTION_LABEL="Διατήρηση εγγραφών για (ημέρες)"
COM_CSMCPFORJ_CONFIG_LOG_RETENTION_DESC="Οι παλαιότερες εγγραφές διαγράφονται αυτόματα. Προεπιλογή 30. Το αρχείο καταγραφής επίσης δεν κρατά ποτέ περισσότερες από τις 20.000 νεότερες εγγραφές."
COM_CSMCPFORJ_DASHBOARD_OAUTH_PROBLEMS="<strong>%d προβλήματα σύνδεσης OAuth τις τελευταίες 24 ώρες.</strong> <a href=&quot;%s&quot;>Δείτε τι πήγε στραβά στα Αρχεία καταγραφής &rarr;</a>"
COM_CSMCPFORJ_SUPPORT_ATTACH_LOG_LABEL="Επισύναψη πρόσφατων προειδοποιήσεων και σφαλμάτων από τα Αρχεία καταγραφής (τελευταίες 7 ημέρες, έως 25 εγγραφές)"
COM_CSMCPFORJ_SUPPORT_ATTACH_LOG_HELP="Μας βοηθά να δούμε τι πήγε στραβά. Διακριτικά, κωδικοί και κωδικοί πρόσβασης δεν υπάρχουν ποτέ στο αρχείο καταγραφής. Μπορείτε να ελέγξετε πρώτα τις εγγραφές στα Αρχεία καταγραφής."

