COM_CSMCPFORJ_DASHBOARD_PRO_HEADING="Συνδέστε τον λογαριασμό σας Cybersalt Extensions"
COM_CSMCPFORJ_DASHBOARD_PRO_INTRO="Η σύνδεση του λογαριασμού σας Cybersalt Extensions επιτρέπει σε αυτόν τον ιστότοπο να εγκαθιστά και να ενημερώνει αυτόματα τις προσθήκες Pro MCP που έχετε αγοράσει &mdash; είτε πρόκειται για τη συνδρομή πλήρους πρόσβασης είτε για μια προσθήκη που αγοράσατε μεμονωμένα.<br><br>Όταν κάνετε κλικ στο <strong>Σύνδεση λογαριασμού</strong>, αυτός ο ιστότοπος καταχωρεί ένα <strong>αναγνωριστικό λήψης</strong> (που περιλαμβάνει τον τομέα σας) στο <code>cybersalt.com</code> και το συνδέει με το email που χρησιμοποιήσατε για την αγορά. Αυτή η σύνδεση εξουσιοδοτεί κάθε λήψη και ενημέρωση Pro για τις προσθήκες που ανήκουν στον λογαριασμό σας. Για τον σκοπό αυτό αποστέλλονται στο cybersalt.com η διεύθυνση email σας και ο τομέας αυτού του ιστότοπου· δεν αποστέλλεται κωδικός πρόσβασης &mdash; το κλειδί είναι το email."
