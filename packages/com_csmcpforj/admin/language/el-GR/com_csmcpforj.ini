COM_CSMCPFORJ_CONFIG_CATALOG_URL_LABEL="URL τελικού σημείου καταλόγου"
COM_CSMCPFORJ_CONFIG_CATALOG_URL_DESC="Από πού λαμβάνεται ο κατάλογος προσθηκών MCP. Αφήστε την προεπιλογή εκτός αν λειτουργείτε ιδιωτικό αντίγραφο του καταλόγου· σε μια σκέτη βασική διεύθυνση URL προστίθεται το /catalog.json."
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_LABEL="Διάρκεια προσωρινής μνήμης καταλόγου (ώρες)"
COM_CSMCPFORJ_CONFIG_CATALOG_CACHE_TTL_DESC="Πόσο διατηρείται στην προσωρινή μνήμη το catalog.json πριν ληφθεί ξανά. Το κουμπί χειροκίνητης ανανέωσης στη σελίδα του καταλόγου το παρακάμπτει. Εύρος 1&ndash;168 (μία εβδομάδα)."
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_LABEL="Εμφάνιση μη διαθέσιμων προσθηκών Pro"
COM_CSMCPFORJ_CONFIG_CATALOG_SHOW_PRO_DESC="Εμφάνιση των προσθηκών Pro στον κατάλογο ακόμη κι αν δεν έχετε αυτή τη στιγμή συνδρομή Pro. Χρήσιμο για να δείτε τι είναι διαθέσιμο· ορίστε σε Όχι για να τις αποκρύψετε εντελώς."
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_LABEL="Επανέλεγχος συνδρομής κάθε (δευτερόλεπτα)"
COM_CSMCPFORJ_CONFIG_PRO_RECHECK_DESC="Πόσο συχνά ο πίνακας ελέγχου ρωτά ξανά το cybersalt.com αν το συνδεδεμένο email έχει ακόμη πρόσβαση Pro. 86400 = μία φορά την ημέρα (προτείνεται). Ελάχιστο 60, μέγιστο 604800 = μία φορά την εβδομάδα."

; Server-side MCP behavior
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_LABEL="Διακομιστής MCP"
COM_CSMCPFORJ_CONFIG_SERVER_FIELDSET_DESC="Έλεγχοι του τελικού σημείου MCP από την πλευρά του διακομιστή. Επηρεάζουν τι βλέπουν και τι μπορούν να καλέσουν οι πελάτες MCP."
COM_CSMCPFORJ_CONFIG_READ_ONLY_LABEL="Λειτουργία μόνο ανάγνωσης"
COM_CSMCPFORJ_CONFIG_READ_ONLY_DESC="Όταν είναι ΝΑΙ, το τελικό σημείο MCP ανακοινώνει και δέχεται μόνο εργαλεία των οποίων τα MCP ToolAnnotations τα δηλώνουν μόνο ανάγνωσης (list_*, get_*, read_*, check_*, validate_*, fetch_*, καθώς και το joomla_update_healthcheck). Χρήσιμο όταν θέλετε ένας πελάτης AI να εξερευνήσει τον ιστότοπο χωρίς καμία δυνατότητα αλλαγής περιεχομένου. Οι εγγραφές επιστρέφουν σφάλμα που εξηγεί ότι ο διακομιστής είναι σε λειτουργία μόνο ανάγνωσης. Η ρύθμιση είναι κατώτατο όριο: ένας πελάτης MCP μπορεί επίσης να προσθέσει ?read_only=1 στη διεύθυνση URL του τελικού σημείου για περαιτέρω περιορισμό, αλλά δεν μπορεί να ΞΕΚΛΕΙΔΩΣΕΙ τις εγγραφές σε έναν ιστότοπο όπου αυτό είναι ΝΑΙ."

COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_LABEL="Απόρρητο κατά την καταγραφή οθόνης"
COM_CSMCPFORJ_CONFIG_PRIVACY_FIELDSET_DESC="Έλεγχοι για την προστασία θόλωσης μυστικών στον πίνακα ελέγχου (διακριτικό Joomla API στην προεπισκόπηση της εντολής, email συνδρομής Pro). Η θόλωση είναι ενεργή από προεπιλογή· αυτές οι επιλογές ρυθμίζουν την εμφάνιση με το ποντίκι, ώστε ένα τυχαίο πέρασμα του ποντικιού να μην αποκαλύψει κατά λάθος το μυστικό σε κοινή χρήση οθόνης ή καταγραφή οθόνης."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_LABEL="Καθυστέρηση εμφάνισης με το ποντίκι (δευτερόλεπτα)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_DELAY_DESC="Πόσα δευτερόλεπτα πρέπει να κρατήσετε τον δείκτη του ποντικιού πάνω σε ένα θολωμένο μυστικό πριν εμφανιστεί. Μια μικρή ένδειξη αντίστροφης μέτρησης εμφανίζεται δίπλα στο μυστικό όσο το κρατάτε, ώστε να ξέρετε ότι ο χρονομετρητής τρέχει. Αν απομακρύνετε το ποντίκι, η εμφάνιση ακυρώνεται και ο χρονομετρητής μηδενίζεται &mdash; το επόμενο πέρασμα ξεκινά νέα πλήρη αντίστροφη μέτρηση. Ορίστε 0 για άμεση εμφάνιση (καταργεί την προστασία από τυχαίο πέρασμα του ποντικιού αλλά επαναφέρει την κλασική συμπεριφορά). Προεπιλογή 3 δευτερόλεπτα."
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_LABEL="Αυτόματη απόκρυψη μετά την εμφάνιση (δευτερόλεπτα)"
COM_CSMCPFORJ_CONFIG_HOVER_REVEAL_HIDE_DESC="Μόλις ένα μυστικό εμφανιστεί με το ποντίκι, πόσα δευτερόλεπτα μένει ορατό πριν θολώσει ξανά αυτόματα &mdash; ακόμη κι αν το ποντίκι είναι ακόμη πάνω του. Διπλή ασφάλεια για περιπτώσεις τύπου &ldquo;το κοίταξα, το διάβασα, μετά αφαιρέθηκα&rdquo;, όπου ένα αφύλακτο πρόγραμμα περιήγησης θα άφηνε αλλιώς το μυστικό εκτεθειμένο επ' αόριστον. Η απομάκρυνση του ποντικιού θολώνει πάντα αμέσως, ανεξάρτητα από αυτή τη ρύθμιση. Ορίστε 0 για να απενεργοποιήσετε την αυτόματη απόκρυψη (τα μυστικά μένουν ορατά μέχρι να απομακρύνετε το ποντίκι). Προεπιλογή 8 δευτερόλεπτα &mdash; αρκετά για να διαβάσετε άνετα ένα πλήρες διακριτικό base64· αρκετά λίγα ώστε μια αφύλακτη συνεδρία να μην εκθέτει το μυστικό."

