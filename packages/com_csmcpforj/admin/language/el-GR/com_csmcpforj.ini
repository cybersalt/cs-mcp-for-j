COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP1_TITLE="1. Δημιουργήστε ένα διακριτικό API"
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP1_BODY="Συνδεθείτε ως ο χρήστης για λογαριασμό του οποίου θέλετε να ενεργεί ο πελάτης MCP. Ανοίξτε το προφίλ σας, μεταβείτε στην καρτέλα Διακριτικό Joomla API και κάντε κλικ στο εικονίδιο του ματιού για εμφάνιση."
