COM_CSMCPFORJ_SUPPORT_BANNER_PRO_HEADING="Έχετε ενεργή συνδρομή MCP for J Pro &mdash; σας ευχαριστούμε!"
COM_CSMCPFORJ_SUPPORT_BANNER_PRO_BODY="Οι συνδρομητές Pro έχουν υποστήριξη προτεραιότητας. Τα μηνύματά σας φτάνουν στα εισερχόμενά μας με ετικέτα υποστήριξης Pro, οπότε τα βλέπουμε πρώτα και απαντάμε όσο πιο γρήγορα μπορούμε. Ρωτήστε μας οτιδήποτε &mdash; αναφορές σφαλμάτων, αιτήματα λειτουργιών, ερωτήσεις, ιδέες &mdash; όλα είναι ευπρόσδεκτα."

COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_HEADING="Μας αρέσει να ακούμε από εσάς"
COM_CSMCPFORJ_SUPPORT_BANNER_COMMUNITY_BODY="Στείλτε μας τις αναφορές σφαλμάτων, τα αιτήματα λειτουργιών, τις ερωτήσεις και τις ιδέες σας &mdash; διαβάζουμε κάθε μία και εκτιμούμε τα σχόλιά σας. Η υποστήριξη της δωρεάν έκδοσης παρέχεται στο μέτρο του δυνατού (οι πόροι μας για δωρεάν υποστήριξη είναι περιορισμένοι), οπότε οι απαντήσεις μπορεί να αργήσουν. Αν χρειάζεστε εγγυημένους χρόνους απόκρισης ή προτεραιότητα, σκεφτείτε %sμια συνδρομή MCP for J Pro%s."

COM_CSMCPFORJ_SUPPORT_FORM_HEADING="Στείλτε μας μήνυμα"
COM_CSMCPFORJ_SUPPORT_FORM_INTRO="Το μήνυμά σας πηγαίνει απευθείας στο <code>support@cybersalt.com</code>. Στοιχεία περιβάλλοντος (η διεύθυνση URL του ιστότοπού σας, η έκδοση του MCP for J, οι εκδόσεις Joomla και PHP, οι εγκατεστημένες προσθήκες και η κατάσταση της συνδρομής Pro σας) επισυνάπτονται αυτόματα ώστε να σας βοηθήσουμε πιο γρήγορα &mdash; θα δείτε την πλήρη λίστα στην πλευρική στήλη."

COM_CSMCPFORJ_SUPPORT_FIELD_TYPE_LABEL="Τι είδους μήνυμα είναι αυτό;"
COM_CSMCPFORJ_SUPPORT_FIELD_TYPE_HINT="Επιλέξτε ό,τι ταιριάζει καλύτερα &mdash; εμείς το προωθούμε από εκεί."
COM_CSMCPFORJ_SUPPORT_TYPE_BUG="🐛 Αναφορά σφάλματος &mdash; κάτι δεν λειτουργεί"
COM_CSMCPFORJ_SUPPORT_TYPE_FEATURE="✨ Αίτημα λειτουργίας &mdash; κάτι νέο που θα ήθελα"
COM_CSMCPFORJ_SUPPORT_TYPE_QUESTION="❓ Ερώτηση &mdash; χρειάζομαι βοήθεια για να καταλάβω κάτι"
