COM_CSMCPFORJ_SUPPORT_TYPE_OTHER="💬 Άλλο &mdash; κάτι διαφορετικό"

COM_CSMCPFORJ_SUPPORT_FIELD_SUBJECT_LABEL="Θέμα"
COM_CSMCPFORJ_SUPPORT_FIELD_SUBJECT_PLACEHOLDER="Μια σύντομη περίληψη του μηνύματός σας"

COM_CSMCPFORJ_SUPPORT_FIELD_DESCRIPTION_LABEL="Μήνυμα"
COM_CSMCPFORJ_SUPPORT_FIELD_DESCRIPTION_PLACEHOLDER="Πείτε μας τι συμβαίνει. Για αναφορές σφαλμάτων, τι περιμένατε να συμβεί και τι συνέβη στην πραγματικότητα; Για αιτήματα λειτουργιών, ποιο πρόβλημα θα έλυνε; Όσο περισσότερο πλαίσιο, τόσο πιο γρήγορα μπορούμε να βοηθήσουμε."
COM_CSMCPFORJ_SUPPORT_FIELD_DESCRIPTION_HINT="Το απλό κείμενο είναι εντάξει &mdash; δεν χρειάζεται ειδική μορφοποίηση."

COM_CSMCPFORJ_SUPPORT_FIELD_EMAIL_LABEL="Απάντηση σε"
COM_CSMCPFORJ_SUPPORT_FIELD_EMAIL_HINT="Πού να στείλουμε την απάντησή μας; Έχουμε συμπληρώσει το email του λογαριασμού σας Joomla· αλλάξτε το αν θέλετε η απάντηση να πάει αλλού."

