COM_CSMCPFORJ_SUBMENU_SETUPGUIDE="Οδηγός ρύθμισης"
COM_CSMCPFORJ_TOOLBAR_SETUPGUIDE="Οδηγός ρύθμισης"
COM_CSMCPFORJ_SETUPGUIDE_TITLE="MCP for J — Οδηγός ρύθμισης"

COM_CSMCPFORJ_SETUPGUIDE_INTRO_HEADING="Συνδέστε ένα AI σε αυτόν τον ιστότοπο Joomla"
COM_CSMCPFORJ_SETUPGUIDE_INTRO_BODY="Το MCP for J έχει σχεδιαστεί ώστε να συνδέετε εύκολα έναν βοηθό AI όπως το Codex, το Claude, το ChatGPT ή το Cursor στον ιστότοπό σας Joomla &mdash; ώστε το AI να μπορεί να διαβάζει τα άρθρα σας, να διαχειρίζεται χρήστες, να δημοσιεύει περιεχόμενο και άλλα, όλα μέσα από το συνηθισμένο περιβάλλον συνομιλίας του AI. Δεν χρειάζεται να έχετε τεχνικές γνώσεις. Η εύκολη μέθοδος παρακάτω λειτουργεί για τους περισσότερους· κάντε κύλιση προς τα κάτω για προχωρημένες επιλογές αν τις χρειάζεστε."

; --- Easy Setup card (prominent, first thing after the intro) --------------

COM_CSMCPFORJ_SETUPGUIDE_EASY_HEADING="⭐ Ο εύκολος τρόπος"
COM_CSMCPFORJ_SETUPGUIDE_EASY_BODY="Χωρίς αρχεία ρυθμίσεων. Χωρίς κεφαλίδες. Χωρίς ορολογία. Απλώς αντιγράψτε μια έτοιμη εντολή ρύθμισης από τον Πίνακα ελέγχου και επικολλήστε την σε μια νέα συνομιλία με το AI σας. Το AI κάνει τα υπόλοιπα &mdash; δοκιμάζει τη σύνδεση και, σε πελάτες που το υποστηρίζουν, προσφέρεται να την αποθηκεύσει μόνιμα για εσάς."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP1="<strong>Πάρτε το κλειδί API σας</strong> (έναν προσωπικό κωδικό που επιτρέπει στο AI σας να ενεργεί σε αυτόν τον ιστότοπο). Οδηγίες παρακάτω αν δεν έχετε ακόμη."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP2="<strong>Μεταβείτε στον Πίνακα ελέγχου</strong> (κουμπί παρακάτω) και επικολλήστε το κλειδί API σας στο πεδίο εκεί."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP3="<strong>Κάντε κλικ στο κουμπί &ldquo;Αντιγραφή εντολής ρύθμισης&rdquo;</strong> στον Πίνακα ελέγχου. Το κλειδί σας μπαίνει αυτόματα στην εντολή πριν αντιγραφεί."
COM_CSMCPFORJ_SETUPGUIDE_EASY_STEP4="<strong>Επικολλήστε σε μια νέα συνομιλία</strong> με το AI σας (Claude, ChatGPT, Cursor, Copilot, Gemini κ.λπ.) και στείλτε. Το AI θα επιβεβαιώσει ότι η σύνδεση λειτουργεί και θα προσφερθεί να την αποθηκεύσει."
COM_CSMCPFORJ_SETUPGUIDE_EASY_CTA="Μετάβαση στον Πίνακα ελέγχου"
COM_CSMCPFORJ_SETUPGUIDE_EASY_HINT="Αυτό ήταν. Το AI σας είναι συνδεδεμένο. Αν θέλετε να μάθετε περισσότερα για το πώς ταιριάζουν τα κομμάτια ή προτιμάτε να ρυθμίσετε το AI σας χειροκίνητα, συνεχίστε να διαβάζετε παρακάτω &mdash; αλλά δεν είναι απαραίτητο."

; --- Get your API key -----------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_HEADING="Πάρτε το κλειδί API σας"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_BODY="Ένα <strong>κλειδί API</strong> είναι ένας προσωπικός κωδικός που επιτρέπει στο AI σας να ενεργεί σε αυτόν τον ιστότοπο Joomla ως ΕΣΕΙΣ. Όποιος έχει το κλειδί μπορεί να κάνει ό,τι μπορεί να κάνει ο λογαριασμός χρήστη σας στο Joomla &mdash; γι' αυτό κρατήστε το ιδιωτικό. Δείτε πώς να δημιουργήσετε ένα:"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP1="%sΚάντε κλικ εδώ για να ανοίξετε το προφίλ χρήστη σας στο Joomla%s. Ανοίγει σε νέα καρτέλα. Εκεί, βρείτε την καρτέλα με το όνομα <strong>Διακριτικό Joomla API</strong>."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP2="Σε αυτή την καρτέλα, κάντε κλικ στο κουμπί <strong>Επαναφορά</strong>. Το Joomla δημιουργεί μια μεγάλη σειρά από γράμματα και αριθμούς και τη βάζει στο πεδίο κάτω από το κουμπί. Αυτό είναι το κλειδί σας."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP3="Κάντε κλικ στο μικρό <strong>εικονίδιο του ματιού</strong> δίπλα στο πεδίο για να εμφανιστεί το κλειδί και αντιγράψτε ολόκληρη τη σειρά."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_STEP4="Επικολλήστε το στο πεδίο παρακάτω σε αυτή τη σελίδα (αποθηκεύεται μόνο στο πρόγραμμα περιήγησής σας, ώστε τα κουμπιά αντιγραφής αυτής της σελίδας να το συμπληρώνουν αυτόματα) Ή επικολλήστε το απευθείας στο πεδίο κλειδιού API του Πίνακα ελέγχου αν πηγαίνετε εκεί για την εύκολη ρύθμιση."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_TITLE="Χειριστείτε αυτό το κλειδί σαν κωδικό πρόσβασης."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_WARNING_BODY="Μην το επικολλάτε σε κοινόχρηστα έγγραφα, στιγμιότυπα οθόνης ή κώδικα που θα δημοσιεύσετε. Αν διαρρεύσει ποτέ, επιστρέψτε στην καρτέλα Διακριτικό Joomla API και κάντε ξανά κλικ στην Επαναφορά &mdash; το παλιό κλειδί ακυρώνεται αμέσως."

COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_LABEL="Επικολλήστε εδώ το κλειδί API σας (για αντιγραφή με ένα κλικ σε αυτή τη σελίδα)"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_INPUT_HINT="<strong>Το κλειδί σας απομνημονεύεται μόνο σε αυτό το πρόγραμμα περιήγησης</strong> &mdash; δεν φεύγει ποτέ από τον υπολογιστή σας. Χρησιμοποιήστε το κουμπί κάδου για να το ξεχάσετε. Αν το αφήσετε κενό, τα κουμπιά αντιγραφής αυτής της σελίδας θα λειτουργούν, αλλά θα πρέπει να επικολλήσετε το κλειδί σας χειροκίνητα στο απόσπασμα που αντιγράφηκε."
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_TOGGLE_SHOW="Εμφάνιση/απόκρυψη κλειδιού"
COM_CSMCPFORJ_SETUPGUIDE_TOKEN_CLEAR="Ξεχάστε το αποθηκευμένο κλειδί"

; --- Advanced section (folded by default; contains all the technical setup) -

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_SUMMARY="⚙️ Για προχωρημένους: χειροκίνητη σύνδεση AI (οι περισσότεροι δεν το χρειάζονται)"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_INTRO="Αυτή η ενότητα είναι για όσους θέλουν να ρυθμίσουν χειροκίνητα τη σύνδεση του πελάτη AI τους με αυτόν τον ιστότοπο &mdash; συνήθως επεξεργαζόμενοι ένα μικρό αρχείο κειμένου που λέγεται &ldquo;αρχείο ρυθμίσεων&rdquo;. Αν η Εύκολη ρύθμιση παραπάνω λειτούργησε για εσάς, μπορείτε άνετα να αγνοήσετε όλη αυτή την ενότητα. Αν θέλετε να παρακάμψετε την εντολή ρύθμισης και να καταχωρίσετε τη σύνδεση απευθείας στον πελάτη AI σας, συνεχίστε να διαβάζετε."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_HEADING="Η διεύθυνση URL σύνδεσης αυτού του ιστότοπου"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_ENDPOINT_BODY="Αυτή είναι η διεύθυνση που χρειάζεται ο πελάτης AI σας. Θα την επικολλήσετε στη ρύθμιση του πελάτη μαζί με το κλειδί API σας."

COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_HEADING="Επιλέξτε τον πελάτη AI σας"
COM_CSMCPFORJ_SETUPGUIDE_ADVANCED_CLIENT_PICKER_BODY="Η διεύθυνση URL σύνδεσης και το κλειδί API είναι ίδια για κάθε AI &mdash; μόνο το <em>πού τα επικολλάτε</em> διαφέρει ανά πελάτη. Επιλέξτε τον πελάτη σας παρακάτω για τις συγκεκριμένες οδηγίες."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CLAUDE="Claude"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CURSOR="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CHATGPT="ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_CODEX="Codex"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_HEADING="Codex (CLI, επέκταση IDE ή εφαρμογή επιφάνειας εργασίας)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_BODY="Το Codex υποστηρίζει εγγενώς αυτό το τελικό σημείο ως διακομιστή Streamable HTTP MCP. Αποθηκεύστε πρώτα το κλειδί Joomla API σε μια μεταβλητή περιβάλλοντος ειδική για τον ιστότοπο και έπειτα καταχωρίστε το τελικό σημείο με το όνομα της μεταβλητής. Το κλειδί δεν γράφεται ποτέ στο <code>config.toml</code>. Αν χρησιμοποιήσετε το κουμπί αντιγραφής αφού επικολλήσετε ένα κλειδί παραπάνω, η εντολή περιβάλλοντος που αντιγράφεται περιέχει αυτό το κλειδί, γι' αυτό κρατήστε την μακριά από κοινόχρηστα τερματικά, καταγραφές και αιτήματα υποστήριξης."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS="1a. Windows PowerShell &mdash; αποθήκευση του κλειδιού για μελλοντικές διεργασίες Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_WINDOWS_HINT="Ανοίξτε νέο τερματικό αφού ορίσετε μόνιμη μεταβλητή περιβάλλοντος των Windows. Οι διεργασίες Codex και τερματικού που ήδη εκτελούνται δεν μπορούν να τη δουν."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_UNIX="1b. macOS/Linux &mdash; ορισμός του κλειδιού για αυτό το τερματικό (αποθηκεύστε το μόνιμα στο ασφαλές περιβάλλον κελύφους σας αν χρειάζεται)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_ADD="2. Καταχωρίστε αυτόν τον ιστότοπο Joomla στο Codex"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_VERIFY="Εκτελέστε <code>codex mcp list</code>, επανεκκινήστε το Codex (ή δείτε την οθόνη κατάστασης MCP του) και έπειτα καλέστε το αβλαβές εργαλείο μόνο ανάγνωσης <code>get_joomla_version</code>. Έτσι επαληθεύονται η εκκίνηση, η πιστοποίηση, η ανακάλυψη εργαλείων και η κλήση. Για σύνδεση μόνο ανάγνωσης, ενεργοποιήστε επίσης τη λειτουργία μόνο ανάγνωσης του MCP for J στον διακομιστή· οι ρυθμίσεις έγκρισης του πελάτη δεν μπορούν να παρακάμψουν τα δικαιώματα του διακομιστή."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_TITLE="Μη έγκυρο διακριτικό σε cPanel ή PHP-FPM;"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CODEX_FALLBACK_BODY="Ο διακομιστής web μπορεί να αφαιρεί την τυπική κεφαλίδα Authorization. Αντικαταστήστε την καταχώριση που δημιουργήθηκε παραπάνω στο <code>~/.codex/config.toml</code> με αυτό το μπλοκ, ώστε το Codex να διαβάζει την ίδια μεταβλητή περιβάλλοντος και να τη στέλνει ως <code>X-Joomla-Token</code>, και έπειτα επανεκκινήστε το Codex."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_TAB_GEMINI="Gemini"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_TITLE="Προσοχή &mdash; το παράθυρο &ldquo;Add custom connector&rdquo; του Claude χρειάζεται OAuth, το οποίο είναι απενεργοποιημένο σε αυτόν τον ιστότοπο."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_HEADS_UP_BODY="Το ενσωματωμένο παράθυρο &ldquo;Add custom connector&rdquo; του Claude Desktop και του claude.ai συνδέεται μέσω σύνδεσης χρήστη (OAuth) και δεν έχει πεδίο για κλειδί API. Ένας Super User μπορεί να ενεργοποιήσει τη σύνδεση OAuth στις Επιλογές του MCP for J· τότε το παράθυρο λειτουργεί. Μέχρι τότε, οι παρακάτω οδηγίες για το Claude Desktop χρησιμοποιούν επεξεργασία αρχείου ρυθμίσεων. (Ή χρησιμοποιήστε την Εύκολη ρύθμιση παραπάνω &mdash; λειτουργεί και με το Claude.)"

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_HEADING="Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_BODY="Τέσσερα βήματα: δημιουργήστε ένα μικρό βοηθητικό αρχείο που λέγεται &ldquo;σενάριο περιτύλιξης&rdquo; και περιέχει την εντολή σύνδεσης, έπειτα κατευθύνετε το αρχείο ρυθμίσεων του Claude Desktop σε αυτό και επανεκκινήστε το Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WHY_WRAPPER="Γιατί σενάριο περιτύλιξης αντί να βάλετε τη σύνδεση απευθείας στη ρύθμιση του Claude Desktop; Το Claude Desktop 1.30096+ (Αύγουστος 2026) απορρίπτει καταχωρίσεις ρυθμίσεων των οποίων τα ορίσματα εντολής μοιάζουν να περιέχουν διαπιστευτήρια &mdash; ένα καλοπροαίρετο χαρακτηριστικό ασφαλείας που δυστυχώς μπλοκάρει την άμεση προσέγγιση. Η μεταφορά της εντολής σε ένα μικρό βοηθητικό αρχείο το παρακάμπτει (το Claude Desktop βλέπει απλώς μια εντολή χωρίς ορατά ορίσματα) και κρατά το κλειδί API σας εξίσου ασφαλές με πριν &mdash; το βοηθητικό αρχείο βρίσκεται στον δικό σας φάκελο χρήστη, δίπλα στη ρύθμιση του ίδιου του Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_HEADING="Προαπαιτούμενο μίας φοράς &mdash; Node.js"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_PREREQ_BODY="Αυτές οι οδηγίες προϋποθέτουν ότι έχετε εγκατεστημένο το Node.js στον υπολογιστή σας (που περιλαμβάνει μια εντολή με όνομα <code>npx</code>). Τα περισσότερα περιβάλλοντα προγραμματιστών το έχουν ήδη· αν όχι, εγκαταστήστε το από το <a href='https://nodejs.org' target='_blank' rel='noopener'>nodejs.org</a> με το πρόγραμμα εγκατάστασης LTS. Το παρακάτω αρχείο περιτύλιξης αναμένει το Node.js στην τυπική διαδρομή εγκατάστασης των Windows <code>C:\Program Files\nodejs\</code>. Αν το εγκαταστήσατε αλλού, αλλάξτε αυτή τη διαδρομή στο αρχείο περιτύλιξης μετά την αντιγραφή."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HEADING="Βήμα 1 &mdash; δημιουργήστε το σενάριο περιτύλιξης"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_BODY="Προς το παρόν μόνο για Windows (οι χρήστες Mac/Linux ας δουν τις Συχνές ερωτήσεις). Αντιγράψτε το παρακάτω μπλοκ σε ένα νέο αρχείο απλού κειμένου. Αποθηκεύστε το μέσα στον φάκελο χρήστη σας (<code>C:\Users\YOUR_WINDOWS_USERNAME\</code>) με όνομα αρχείου <code>claude-mcp-joomla-{sitename}.cmd</code>, όπου αντικαθιστάτε το <code>{sitename}</code> με μια σύντομη ετικέτα για τον ιστότοπό σας (π.χ. <code>cybersaltorg</code>). Βεβαιωθείτε ότι το <code>.cmd</code> είναι πράγματι η επέκταση και όχι μέρος του ονόματος &mdash; στο Σημειωματάριο, επιλέξτε &ldquo;Αποθήκευση ως τύπου: Όλα τα αρχεία&rdquo; ώστε να μην προστεθεί <code>.txt</code>. Αν επικολλήσατε το κλειδί API σας στο πεδίο στην κορυφή αυτής της σελίδας, το κουμπί αντιγραφής θα το συμπληρώσει για εσάς."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP1_HINT="Δεν ξέρετε το όνομα χρήστη σας στα Windows; Ανοίξτε την Εξερεύνηση αρχείων, μεταβείτε στο <code>C:\Users\</code> και δείτε τα ονόματα των φακέλων &mdash; ένας είναι ο δικός σας."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_HEADING="Βήμα 2 &mdash; ανοίξτε το αρχείο ρυθμίσεων του Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP2_BODY="Το αρχείο ρυθμίσεων του Claude Desktop βρίσκεται σε συγκεκριμένη διαδρομή ανά λειτουργικό σύστημα. Ανοίξτε το με οποιονδήποτε επεξεργαστή κειμένου (VS Code, Σημειωματάριο, TextEdit, Sublime, ό,τι έχετε):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_LABEL="macOS"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_MAC_PATH="~/Library/Application Support/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_LABEL="Windows"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_WIN_PATH="%APPDATA%\Claude\claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_LABEL="Linux"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_LINUX_PATH="~/.config/Claude/claude_desktop_config.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_EDIT_CONFIG_TIP="Το Claude Desktop έχει ένα κουμπί στο Settings &rarr; Developer &rarr; <strong>Edit Config</strong> που υποτίθεται ότι ανοίγει το αρχείο για εσάς. Αν κάνετε κλικ και δεν συμβαίνει τίποτα, είναι επειδή ο υπολογιστής σας δεν ξέρει με ποιο πρόγραμμα να ανοίγει τα αρχεία <code>.json</code>. Κανένα πρόβλημα &mdash; ανοίξτε το αρχείο μόνοι σας με έναν επεξεργαστή κειμένου, χρησιμοποιώντας μία από τις παραπάνω διαδρομές. Αν το αρχείο δεν υπάρχει ακόμη, δημιουργήστε το και χρησιμοποιήστε το παρακάτω μπλοκ ως ολόκληρο το περιεχόμενό του (τυλιγμένο ως <code>{&quot;mcpServers&quot;: { ... }}</code>)."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HEADING="Βήμα 3 &mdash; προσθέστε αυτό το μπλοκ στη ρύθμιση του Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_BODY="Επικολλήστε το στο <code>claude_desktop_config.json</code>. Αν το αρχείο έχει ήδη ένα αντικείμενο <code>mcpServers</code> με άλλους διακομιστές, προσθέστε την καταχώριση <code>joomla-...</code> δίπλα τους (μην επικολλήσετε δεύτερο αντικείμενο <code>mcpServers</code>). Αν το αρχείο είναι κενό ή δεν υπάρχει, χρησιμοποιήστε ολόκληρο το παρακάτω μπλοκ ως περιεχόμενό του. <strong>Σημαντικό:</strong> αντικαταστήστε το <code>YOUR_WINDOWS_USERNAME</code> με το πραγματικό σας όνομα χρήστη στα Windows."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP3_HINT="Αυτή η ρύθμιση απλώς κατευθύνει το Claude Desktop στο σενάριο περιτύλιξης που δημιουργήσατε στο Βήμα 1. Το κλειδί API σας μένει στο αρχείο περιτύλιξης, όχι στη ρύθμιση του Claude Desktop."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_HEADING="Βήμα 4 &mdash; κλείστε εντελώς και ανοίξτε ξανά το Claude Desktop"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_DESKTOP_STEP4_BODY="Το Claude Desktop διαβάζει το αρχείο ρυθμίσεων μόνο κατά την εκκίνηση. Κλείστε το εντελώς &mdash; στα Windows, κάντε δεξί κλικ στο εικονίδιο του Claude στην περιοχή ειδοποιήσεων (κάτω δεξιά, ίσως χρειαστεί να κάνετε κλικ στο μικρό βέλος προς τα πάνω) και επιλέξτε Quit. Περιμένετε δύο-τρία δευτερόλεπτα και ανοίξτε το ξανά. Σε οποιαδήποτε συνομιλία, κάντε κλικ στο εικονίδιο εργαλείων (ή ρωτήστε &ldquo;τι εργαλεία έχεις;&rdquo;) &mdash; τα εργαλεία του ιστότοπου θα πρέπει να εμφανίζονται. Αν όχι, δείτε την Αντιμετώπιση προβλημάτων παρακάτω."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_HEADING="Claude Code (τερματικό ή VS Code)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_CODE_BODY="Αν χρησιμοποιείτε το Claude Code, μία εντολή τερματικού στήνει τη σύνδεση &mdash; χωρίς επεξεργασία αρχείου ρυθμίσεων. Επικολλήστε το κλειδί API σας στο πεδίο παραπάνω ώστε να το συμπληρώσει το κουμπί αντιγραφής παρακάτω, έπειτα επικολλήστε την εντολή σε ένα τερματικό και πατήστε Enter. Το Claude Code επιβεβαιώνει αμέσως τη σύνδεση και επαναφορτώνει."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_HEADING="claude.ai (η έκδοση web)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CLAUDE_AI_BODY="Το παράθυρο <strong>Add custom connector</strong> του claude.ai συνδέεται μέσω σύνδεσης χρήστη (OAuth), η οποία είναι απενεργοποιημένη σε αυτόν τον ιστότοπο. Ένας Super User μπορεί να την ενεργοποιήσει στις Επιλογές του MCP for J και τότε το claude.ai αποκτά μόνιμη σύνδεση. Μέχρι τότε, η Εύκολη ρύθμιση παραπάνω (μέθοδος επικόλλησης εντολής) λειτουργεί μόνο για την τρέχουσα συνομιλία."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_HEADING="Cursor"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_BODY="Το Cursor αποθηκεύει τις συνδέσεις MCP του σε ένα αρχείο ρυθμίσεων με όνομα <code>mcp.json</code>. Ανοίξτε το σε έναν επεξεργαστή κειμένου, επικολλήστε το παρακάτω μπλοκ μέσα στο αντικείμενο <code>mcpServers</code> και αποθηκεύστε. Στις περισσότερες περιπτώσεις το Cursor αναγνωρίζει την αλλαγή χωρίς επανεκκίνηση."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CURSOR_LOCATION="Θέση αρχείου ρυθμίσεων: <code>~/.cursor/mcp.json</code> (για όλα τα έργα σας) ή <code>.cursor/mcp.json</code> σε συγκεκριμένο φάκελο έργου (μόνο για εκείνο το έργο)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_HEADING="Προσαρμοσμένοι διακομιστές MCP στο ChatGPT"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_BODY="Το παράθυρο <strong>Add custom MCP server</strong> του ChatGPT μπορεί να συνδεθεί μόνο μέσω σύνδεσης χρήστη (OAuth) ή χωρίς πιστοποίηση· δεν έχει πεδίο για κλειδί API ή κεφαλίδα. Η σύνδεση OAuth είναι απενεργοποιημένη σε αυτόν τον ιστότοπο, οπότε το ChatGPT δεν μπορεί ακόμη να συνδεθεί. Ένας Super User μπορεί να την ενεργοποιήσει στις Επιλογές του MCP for J. Μέχρι τότε, χρησιμοποιήστε το Codex (τον βοηθό προγραμματισμού της OpenAI), που στέλνει το κλειδί API από μια μεταβλητή περιβάλλοντος."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_CHATGPT_TIER_NOTE="Η προσθήκη προσαρμοσμένου διακομιστή MCP απαιτεί επί πληρωμή πρόγραμμα ChatGPT. Λειτουργεί στο Plus (ελέγχθηκε τον Οκτώβριο του 2026)."

COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_HEADING="Gemini CLI και Gemini Code Assist"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_BODY="Τόσο το Gemini CLI (ο βοηθός AI τερματικού της Google) όσο και η επέκταση Gemini Code Assist (για VS Code / JetBrains) διαβάζουν το ίδιο αρχείο ρυθμίσεων MCP. Δύο βήματα: επεξεργαστείτε αυτό το αρχείο για να προσθέσετε αυτόν τον ιστότοπο Joomla ως διακομιστή MCP και έπειτα επανεκκινήστε το Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_SCOPE_NOTE="Μπορείτε να προσθέσετε τον διακομιστή καθολικά (ώστε να τον βλέπει κάθε συνεδρία Gemini) ή μόνο μέσα σε έναν φάκελο έργου. Το απόσπασμα είναι το ίδιο &mdash; διαφέρει μόνο η θέση του αρχείου."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_HEADING="1. Ανοίξτε (ή δημιουργήστε) το αρχείο ρυθμίσεων του Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP1_BODY="Επιλέξτε μία από αυτές τις δύο θέσεις:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_LABEL="Καθολικά (κάθε έργο):"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_GLOBAL_PATH="~/.gemini/settings.json"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_LABEL="Μόνο για το έργο:"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_PROJECT_PATH=".gemini/settings.json (σε φάκελο έργου)"
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HEADING="2. Επικολλήστε αυτό το μπλοκ μέσα στο αρχείο."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_BODY="Αν το αρχείο έχει ήδη ενότητα <code>mcpServers</code>, προσθέστε την καταχώριση <code>&quot;joomla-...&quot;</code> μέσα στην υπάρχουσα &mdash; μην επαναλάβετε το εξωτερικό κλειδί <code>mcpServers</code>. Αν το αρχείο είναι κενό ή καινούργιο, επικολλήστε ολόκληρο το απόσπασμα ως έχει."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP2_HINT="Το Gemini χρησιμοποιεί <code>httpUrl</code> για διακομιστές MCP μέσω HTTP (όπως αυτός) &mdash; διαφορετικό από το κλειδί <code>url</code> του Cursor. Αντιγράψτε αυτό το απόσπασμα ακριβώς, αντί να ξαναχρησιμοποιήσετε εκείνο του Cursor."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_HEADING="3. Επανεκκινήστε το Gemini."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_STEP3_BODY="Κλείστε και ξανανοίξτε το <code>gemini</code> στο τερματικό ή επαναφορτώστε το παράθυρο του VS Code / JetBrains. Πληκτρολογήστε <code>/mcp</code> στο Gemini CLI για να δείτε τους συνδεδεμένους διακομιστές και να επιβεβαιώσετε ότι εμφανίζεται ο ιστότοπός σας Joomla."
COM_CSMCPFORJ_SETUPGUIDE_CLIENT_GEMINI_WEB_UI_NOTE="Η εφαρμογή web <code>gemini.google.com</code> δεν υποστηρίζει προσαρμοσμένους διακομιστές MCP από τον Αύγουστο του 2026 &mdash; αυτός ο οδηγός καλύπτει μόνο το Gemini CLI και το Gemini Code Assist. Αν η Google προσθέσει αργότερα υποστήριξη στο web, θα το περιγράψουμε εδώ."

COM_CSMCPFORJ_SETUPGUIDE_CLIENTS_MORE_COMING="Λειτουργούν και άλλοι πελάτες AI με υποστήριξη MCP (Cline, Continue, GitHub Copilot σε λειτουργία agent, Windsurf, mcp-cli κ.λπ.) &mdash; η διεύθυνση URL σύνδεσης και το κλειδί API είναι ίδια, διαφέρει μόνο το ακριβές σημείο όπου τα επικολλάτε. Θα προσθέτουμε σταδιακά οδηγούς για περισσότερους πελάτες· αν κολλήσετε, οι Συχνές ερωτήσεις παρακάτω έχουν γενική καθοδήγηση."

COM_CSMCPFORJ_SETUPGUIDE_COPY="Αντιγραφή"
COM_CSMCPFORJ_SETUPGUIDE_COPIED="Αντιγράφηκε"
COM_CSMCPFORJ_SETUPGUIDE_COPIED_WITH_TOKEN="Αντιγράφηκε (με το κλειδί σας)"

; --- Security & Sharing ---------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_SECURITY_HEADING="Ασφάλεια &amp; κοινή χρήση"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_BODY="Το κλειδί API σας ΕΙΝΑΙ η σύνδεση &mdash; όποιος το έχει μπορεί να κάνει ό,τι μπορεί να κάνει ο λογαριασμός χρήστη σας στο Joomla. Δεν υπάρχει ανώνυμη πρόσβαση. Αν ενεργοποιήσετε τη <strong>σύνδεση OAuth</strong>, μια εφαρμογή AI μπορεί επίσης να συνδεθεί στέλνοντάς σας στην κανονική σελίδα σύνδεσης αυτού του ιστότοπου· τότε ενεργεί ως ο λογαριασμός που συνδέθηκε, με ακριβώς τα δικαιώματα εκείνου του λογαριασμού, μέχρι να την αποσυνδέσετε στον Πίνακα ελέγχου."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_HEADING="Παροχή πρόσβασης MCP σε άλλους"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_SHARE_BODY="Δύο τρόποι &mdash; επιλέξτε όποιον σας ταιριάζει:"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_TITLE="Ένα κλειδί ανά άτομο (το πιο ασφαλές)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_A_BODY="Δημιουργήστε έναν χρήστη Joomla για κάθε άτομο, βάλτε τον σε μια ομάδα με μόνο τα δικαιώματα που θέλετε να έχει (π.χ. μόνο ανάγνωση), δημιουργήστε ένα κλειδί για αυτόν τον χρήστη και στείλτε του το ιδιωτικά. Κάθε άτομο έχει το δικό του ιστορικό ελέγχου· μπορείτε να ανακαλέσετε οποιοδήποτε κλειδί χωρίς να επηρεάσετε τα υπόλοιπα."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_TITLE="Ένα κοινό κλειδί (το πιο απλό αλλά το λιγότερο ασφαλές)"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_OPTION_B_BODY="Δημιουργήστε έναν περιορισμένο χρήστη (π.χ. <code>mcp-demo-guest</code>) σε ομάδα μόνο ανάγνωσης, δημιουργήστε ένα κλειδί και μοιραστείτε το ευρύτερα. Πιο απλό στη διανομή· πιο δύσκολο να ξέρετε ποιος το χρησιμοποιεί ή να ανακαλέσετε την πρόσβαση μόνο για ένα άτομο. Κατάλληλο για δημόσια επίδειξη· όχι για ευαίσθητη πρόσβαση."
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_HEADING="Ανάκληση κλειδιού"
COM_CSMCPFORJ_SETUPGUIDE_SECURITY_REVOKE_BODY="Για να σταματήσει αμέσως να λειτουργεί ένα υπάρχον κλειδί, μεταβείτε στο Χρήστες &rarr; ο συγκεκριμένος χρήστης &rarr; καρτέλα Διακριτικό Joomla API &rarr; κάντε κλικ στην <strong>Επαναφορά</strong>. Το παλιό κλειδί ακυρώνεται τη στιγμή που κάνετε κλικ. Δώστε το νέο κλειδί σε αυτό το άτομο ή αφήστε το χωρίς πρόσβαση."

; --- Troubleshooting ------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_HEADING="Αντιμετώπιση προβλημάτων"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLESHOOT_BODY="Βρείτε το είδος της εφαρμογής που συνδέετε και ανοίξτε το πρόβλημα που ταιριάζει με αυτό που βλέπετε. Τα μηνύματα σφάλματος και οι αποκλεισμοί από τείχη προστασίας μπορεί να εμφανιστούν σε οποιαδήποτε εφαρμογή, γι' αυτό έχουν δική τους ομάδα στο τέλος."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_SUMMARY="&ldquo;Unauthorized&rdquo; ή &ldquo;Authentication failed&rdquo; (σφάλμα 401)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_401_BODY="Το AI σας φτάνει στον ιστότοπο αλλά το κλειδί API δεν είναι σωστό. Ελέγξτε: (1) το κλειδί δεν έχει γίνει Επαναφορά από τότε που το αντιγράψατε (κάθε Επαναφορά ακυρώνει το προηγούμενο κλειδί)· (2) το κλειδί αντιγράφηκε ολόκληρο, χωρίς χαρακτήρες που λείπουν ή επιπλέον κενά· (3) αν επεξεργαστήκατε αρχείο ρυθμίσεων, η λέξη <code>Bearer </code> (με ένα κενό μετά) υπάρχει πριν από το κλειδί. Αν δεν είστε σίγουροι, δημιουργήστε νέο κλειδί και δοκιμάστε ξανά."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_SUMMARY="&ldquo;Not Acceptable&rdquo; ή &ldquo;Could not match accept header&rdquo; (σφάλμα 406)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_406_BODY="Παλαιότερες εκδόσεις του MCP for J (πριν από την 2.3.4) είχαν ένα σφάλμα που εμπόδιζε ορισμένους πελάτες AI να συνδεθούν. Ενημερώστε το MCP for J στην τελευταία έκδοση &mdash; δείτε το Σύστημα &rarr; Ενημέρωση &rarr; Επεκτάσεις στη διαχείριση του Joomla."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_SUMMARY="&ldquo;Συνδέθηκε αλλά δεν εμφανίζονται εργαλεία στο AI&rdquo;"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EMPTY_TOOLS_BODY="Συνήθως ένα από τα εξής τρία: (1) η ομάδα του χρήστη δεν έχει το <strong>Υπηρεσίες Διαδικτύου Είσοδος</strong> &mdash; ορίστε το στο Σύστημα &rarr; Γενικές Ρυθμίσεις &rarr; Δικαιώματα (από προεπιλογή το έχουν μόνο οι Super Users)· (2) η ομάδα δεν έχει δικαίωμα MCP &mdash; οι Super Users το έχουν πάντα και οι Administrators μέσω των προεπιλογών του Joomla, αλλά οι Managers και οι άλλες ομάδες χρειάζονται Χρήση τελικού σημείου MCP (και Εγγραφή μέσω τελικού σημείου MCP για αλλαγές) στις Επιλογές &rarr; Δικαιώματα αυτής της εφαρμογής· (3) ο πελάτης AI αποθήκευσε μια κενή λίστα εργαλείων &mdash; αποσυνδέστε και ξανασυνδέστε τον διακομιστή MCP στον πελάτη για να αναγκάσετε νέο έλεγχο."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_SUMMARY="&ldquo;Not Found&rdquo; ή η διεύθυνση URL επιστρέφει σφάλμα (σφάλμα 404)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_404_BODY="Είτε η διεύθυνση URL είναι λάθος (ελέγξτε την ξανά &mdash; πρέπει να τελειώνει σε <code>/api/index.php/v1/mcp</code>) ΕΙΤΕ το πρόσθετο Υπηρεσιών Διαδικτύου για το MCP είναι απενεργοποιημένο στον ιστότοπό σας Joomla. Στη διαχείριση του Joomla: Σύστημα &rarr; Διαχείριση &rarr; Επεκτάσεις &rarr; αναζητήστε <code>csmcpforj</code> &rarr; βεβαιωθείτε ότι το πρόσθετο Υπηρεσιών Διαδικτύου είναι ενεργό. Αν είναι ήδη ενεργό, το <code>.htaccess</code> του ιστότοπου ίσως μπλοκάρει τη διαδρομή <code>/api/</code> &mdash; πρόβλημα του παρόχου φιλοξενίας ή κάποιου πρόσθετου ασφαλείας."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_SUMMARY="&ldquo;Forbidden&rdquo; ή &ldquo;Malware detected&rdquo; (σφάλμα 403)"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_WAF_BODY="Ένα πρόσθετο ασφαλείας στον ιστότοπό σας Joomla (RSFirewall, Admin Tools Pro, Securitycheck Pro) μπλοκάρει το αίτημα MCP. Στο RSFirewall, προσθέστε δύο εξαιρέσεις: <code>csmcpforj_oauth</code> και <code>api\/index\.php\/v1\/mcp</code> ως κανονική έκφραση (η πρώτη είναι για τη σύνδεση). Στα άλλα, επιτρέψτε τα <code>/api/index.php/v1/mcp</code>, <code>/.well-known/oauth-protected-resource</code>, <code>/.well-known/oauth-authorization-server</code> και τις διευθύνσεις URL που περιέχουν <code>csmcpforj_oauth</code>. Για να επιβεβαιώσετε την αιτία, απενεργοποιήστε για λίγο το πρόσθετο ασφαλείας, δοκιμάστε ξανά και έπειτα ενεργοποιήστε το ξανά με τις εξαιρέσεις στη θέση τους. Το κουμπί <strong>Έλεγχος σύνδεσης</strong> του Πίνακα ελέγχου δείχνει ποια διεύθυνση μπλοκάρεται."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_SUMMARY="Το κουμπί &ldquo;Edit Config&rdquo; του Claude Desktop δεν κάνει τίποτα όταν το πατάω"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_EDIT_CONFIG_BODY="Αυτό το κουμπί προσπαθεί να δώσει το <code>claude_desktop_config.json</code> στο πρόγραμμα με το οποίο ο υπολογιστής σας ανοίγει τα αρχεία <code>.json</code>. Αν δεν το έχετε ρυθμίσει, το κουμπί αθόρυβα δεν κάνει τίποτα. Λύση: ανοίξτε το αρχείο μόνοι σας με οποιονδήποτε επεξεργαστή κειμένου. Οι διαδρομές ανά λειτουργικό σύστημα αναφέρονται στην ενότητα Claude, μέσα στο αναπτυσσόμενο τμήμα Για προχωρημένους παραπάνω. Αν το αρχείο δεν υπάρχει ακόμη, δημιουργήστε το και χρησιμοποιήστε το απόσπασμα εκείνης της ενότητας ως ολόκληρο το περιεχόμενό του (τυλίξτε το απόσπασμα ως <code>{&quot;mcpServers&quot;: { ... }}</code>). Δεν χρειάζονται αλλαγές δικαιωμάτων &mdash; το αρχείο βρίσκεται μέσα στον δικό σας φάκελο χρήστη."
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_SUMMARY="Το παράθυρο &ldquo;Add custom connector&rdquo; του Claude ή το &ldquo;Add custom MCP server&rdquo; του ChatGPT δεν έχει πεδίο για το κλειδί API"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_OAUTH_DIALOG_BODY="Αυτά τα παράθυρα είναι φτιαγμένα για σύνδεση μέσω σύνδεσης χρήστη (OAuth)· δεν υπάρχει πουθενά θέση για να επικολλήσετε κλειδί API του MCP for J. Αυτός ο ιστότοπος έχει απενεργοποιημένη τη σύνδεση OAuth. Ένας Super User μπορεί να την ενεργοποιήσει στο Εφαρμογές &rarr; MCP for J &rarr; Επιλογές &rarr; <strong>Σύνδεση OAuth</strong> και τότε λειτουργούν και τα δύο παράθυρα. Μέχρι τότε: το Claude Desktop μπορεί να χρησιμοποιήσει τη μέθοδο σεναρίου περιτύλιξης παραπάνω, το claude.ai την Εύκολη ρύθμιση και οι χρήστες του ChatGPT το Codex."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_SUMMARY="Το Claude Desktop εμφανίζει &ldquo;Some MCP servers could not be loaded&rdquo; κατά την εκκίνηση"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_SKIPPED_INVALID_BODY="Το Claude Desktop 1.30096+ (Αύγουστος 2026) αυστηροποίησε την επικύρωση του αρχείου ρυθμίσεων και πλέον απορρίπτει καταχωρίσεις των οποίων τα ορίσματα εντολής μοιάζουν να περιέχουν διαπιστευτήρια. Αυτό μπλοκάρει τους δύο προφανείς τρόπους ρύθμισης ενός διακομιστή MCP με διακριτικό bearer απευθείας στο <code>claude_desktop_config.json</code>: την εγγενή μορφή <code>type: http</code> ΚΑΙ τη χρήση του <code>mcp-remote</code> με όρισμα <code>--header &quot;Authorization: Bearer ...&quot;</code>. Και τα δύο φαίνονται σωστά στο αρχείο ρυθμίσεων, αλλά ο επικυρωτής σχήματος του Claude Desktop τα απορρίπτει κατά τη φόρτωση. <strong>Λύση:</strong> χρησιμοποιήστε τη μέθοδο σεναρίου περιτύλιξης που περιγράφεται στην ενότητα Claude, στο Για προχωρημένους παραπάνω &mdash; βάλτε ολόκληρη την εντολή σε ένα μικρό αρχείο <code>.cmd</code> και έπειτα κάντε τη ρύθμιση του Claude Desktop να αναφέρεται απλώς σε αυτό το αρχείο. Το Claude Desktop βλέπει μια απλή εντολή χωρίς ορατά ορίσματα και τη δέχεται. Το κλειδί API σας μένει εξίσου ασφαλές με πριν &mdash; το αρχείο περιτύλιξης βρίσκεται στον δικό σας φάκελο χρήστη."

COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_SUMMARY="Επανεκκίνησα το Claude Desktop αλλά ακόμη δεν βλέπει τη νέα σύνδεση"
COM_CSMCPFORJ_SETUPGUIDE_TROUBLE_TRAY_RESTART_BODY="Στα Windows, το κλείσιμο του παραθύρου του Claude Desktop απλώς το κρύβει στην περιοχή ειδοποιήσεων &mdash; ολόκληρη η εφαρμογή συνεχίζει να τρέχει με την ΠΑΛΙΑ ρύθμιση φορτωμένη στη μνήμη. Το κλικ στο εικονίδιο της γραμμής εργασιών αργότερα απλώς επαναφέρει το παράθυρο από αυτή τη διεργασία που ήδη τρέχει. Το Claude Desktop ξαναδιαβάζει το αρχείο ρυθμίσεων μόνο σε πραγματική επανεκκίνηση της εφαρμογής. Για πραγματική επανεκκίνηση: κάντε δεξί κλικ στο εικονίδιο του Claude στην περιοχή ειδοποιήσεων (κάτω δεξιά γωνία, ίσως χρειαστεί να κάνετε κλικ στο μικρό βέλος για να δείτε τα κρυφά εικονίδια) &rarr; επιλέξτε <strong>Quit</strong> &rarr; περιμένετε ~3 δευτερόλεπτα να τερματιστεί πλήρως η διεργασία &rarr; ανοίξτε ξανά το Claude Desktop από το μενού Έναρξη. Μόνο τότε θα ισχύσουν οι αλλαγές στο αρχείο ρυθμίσεων."

; --- FAQ ------------------------------------------------------------------

COM_CSMCPFORJ_SETUPGUIDE_FAQ_HEADING="Συχνές ερωτήσεις"

COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_SUMMARY="Μπορεί κάποιος να χρησιμοποιήσει αυτή τη σύνδεση χωρίς κλειδί API;"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ANONYMOUS_BODY="Όχι. Κάθε αίτημα πρέπει να φέρει έγκυρο κλειδί API ή διακριτικό πρόσβασης OAuth αν είναι ενεργή η σύνδεση OAuth. Τα αιτήματα χωρίς αυτό απορρίπτονται. Αυτό είναι σκόπιμο &mdash; το AI μπορεί να κάνει πραγματικές ενέργειες στον ιστότοπό σας (δημιουργία άρθρων, επεξεργασία χρηστών κ.λπ.), οπότε η ανώνυμη πρόσβαση θα ήταν καταστροφή για την ασφάλεια."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_SUMMARY="Μπορεί ένας χρήστης Joomla να έχει πολλά ενεργά κλειδιά API;"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_MULTIPLE_TOKENS_BODY="Όχι. Το Joomla αποθηκεύει ακριβώς ένα κλειδί API ανά χρήστη. Η Επαναφορά δημιουργεί νέο και ακυρώνει το παλιό. Αν χρειάζεστε πολλά κλειδιά (ένα ανά συσκευή, ένα ανά εργαλείο AI κ.λπ.), δημιουργήστε ξεχωριστούς χρήστες Joomla."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_SUMMARY="Υπάρχει όριο στο πόσο μπορώ να το χρησιμοποιήσω;"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_RATE_LIMIT_BODY="Το ίδιο το MCP for J δεν έχει όριο ρυθμού. Ισχύουν τα συνηθισμένα όρια φιλοξενίας (μνήμη PHP, συνδέσεις MariaDB κ.λπ.). Αν δημιουργείτε μεγάλη κίνηση (μεγάλες μαζικές λειτουργίες σε πολλούς ιστότοπους), μιλήστε με τον πάροχο φιλοξενίας σας για αύξηση της ταυτόχρονης εκτέλεσης του PHP-FPM."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_SUMMARY="Χρειάζεται να ανοίξω θύρες στο τείχος προστασίας ή να ρυθμίσω κάτι ιδιαίτερο;"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_HTTPS_BODY="Όχι. Το MCP χρησιμοποιεί απλώς τυπικό HTTPS στη θύρα 443. Αν ο ιστότοπός σας είναι ήδη δημόσια προσβάσιμος στο <code>https://yoursite.com/</code>, το τελικό σημείο MCP είναι προσβάσιμο από οποιονδήποτε πελάτη AI στο διαδίκτυο χωρίς επιπλέον ρύθμιση."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_SUMMARY="Πώς αλλάζω (εναλλάσσω) το κλειδί API μου σε τακτά διαστήματα;"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_ROTATE_BODY="Δεν υπάρχει αυτόματος προγραμματισμός &mdash; το αλλάζετε χειροκίνητα όποτε θέλετε. Μεταβείτε στο Χρήστες &rarr; ο χρήστης &rarr; καρτέλα Διακριτικό Joomla API &rarr; κάντε κλικ στην Επαναφορά. Έπειτα ενημερώστε τη ρύθμιση του πελάτη AI με το νέο κλειδί. Καλή συνήθεια: αλλάξτε κάθε κλειδί που έχει εμφανιστεί ποτέ σε στιγμιότυπο οθόνης, αρχείο καταγραφής ή αναφορά σφάλματος."
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_SUMMARY="Χρησιμοποιώ πελάτη AI που δεν αναφέρεται παραπάνω &mdash; θα λειτουργήσει;"
COM_CSMCPFORJ_SETUPGUIDE_FAQ_OTHER_CLIENTS_BODY="Σχεδόν σίγουρα ναι, εφόσον υποστηρίζει τυπικό MCP μέσω HTTPS και είτε σας επιτρέπει να προσθέσετε προσαρμοσμένη κεφαλίδα Authorization είτε μπορεί να συνδεθεί με OAuth (ενεργοποιήστε τη σύνδεση OAuth στις Επιλογές). Η διεύθυνση URL είναι ίδια παντού &mdash; διαφέρει μόνο το περιβάλλον ρύθμισης του πελάτη. Πελάτες που ξέρουμε ότι λειτουργούν αλλά για τους οποίους δεν έχουμε γράψει βήμα-βήμα οδηγούς: Continue.dev, Windsurf, επεξεργαστής Zed, mcp-cli, MCP Inspector, LibreChat, Open WebUI (μέσω της γέφυρας <code>mcpo</code>) και διάφοροι πράκτορες βασισμένοι στο Ollama."

