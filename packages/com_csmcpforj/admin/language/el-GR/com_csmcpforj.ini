COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP2_BODY="Οι Super Users λειτουργούν αμέσως. Κάθε άλλη ομάδα, ακόμη και οι Administrator και Manager, χρειάζεται πρώτα το <strong>Υπηρεσίες Διαδικτύου Είσοδος</strong> στο Σύστημα &rarr; Γενικές Ρυθμίσεις &rarr; Δικαιώματα. Οι Manager και οι άλλες ομάδες χρειάζονται επίσης Χρήση / Εγγραφή στις Επιλογές &rarr; Δικαιώματα αυτής της εφαρμογής."
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP3_TITLE="3. Επικόλληση στον πελάτη"
COM_CSMCPFORJ_DASHBOARD_QUICKSTART_STEP3_BODY="Αντιγράψτε το απόσπασμα ρύθμισης, επικολλήστε το στον πελάτη MCP σας και επανεκκινήστε τον πελάτη. Δοκιμάστε το tools/list για να επιβεβαιώσετε τη σύνδεση."

